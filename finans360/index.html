<title>Finans360</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell. Sticky top bar, one 880px content column, bottom tab bar
   that becomes a left rail at 960px+. Lists read like ledger pages: hairline rows, tabular figures. */
:root {
  --bg: #EDF1EF;
  --surface: #FFFFFF;
  --surface-2: #F5F8F7;
  --ink: #12212B;
  --ink-2: #33434E;
  --muted: #5B6972;
  --line: #D5DDDA;
  --track: #E2E9E6;
  --accent: #0B6B5D;
  --accent-mid: #6DB3A7;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFEA;
  --brass: #A1741A;
  --brass-soft: #F6ECD6;
  --ok: #1D7A45; --ok-soft: #DCF0E3;
  --warn: #935D00; --warn-soft: #FBEED3;
  --bad: #B3261E; --bad-soft: #F8DEDC;
  --info: #2C5AA0; --info-soft: #E1E9F6;
  --mute: #5F6C75; --mute-soft: #E7ECEE;
  --c-yillik: var(--accent); --c-mazeret: #2C5AA0; --c-saatlik: #A1741A; --c-rapor: #B3261E;
  --c-ucretsiz: #5F6C75; --c-dogum: #6B4FC8; --c-idari: #0E7490; --c-dgunu: #B23A6E;
  --c-ekip: var(--accent); --c-yonetim: #6B4FC8; --c-banka: #2C5AA0; --c-kapanis: #A1741A;
  --c-denetim: #B3261E; --c-birebir: #0E7490; --c-diger: #5F6C75;
  --logo-bg: #0B6B5D; --logo-ring: #EBC86E; --logo-f: #FFFFFF;
  --doc-bg: #FFFFFF; --doc-ink: #111111; --doc-line: #3A3A3A; --doc-fill: #F1F3F2;
  --scrim: rgb(10 20 24 / .45);
  --shadow-1: 0 1px 2px rgb(18 33 43 / .07);
  --shadow-2: 0 12px 32px rgb(18 33 43 / .16);
  --f-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 14px;
  --sat: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
  --sab: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  --top-offset: 0px;
  --top-pad: var(--sat);
  --tabbar-h: 66px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1315; --surface: #141E21; --surface-2: #1A262A; --ink: #E3ECE9; --ink-2: #C3D0CC;
    --muted: #8E9EA3; --line: #27363B; --track: #22302F;
    --accent: #3FBFA7; --accent-mid: #2A7F70; --accent-ink: #04211C; --accent-soft: #12352F;
    --brass: #DDAE52; --brass-soft: #33280F;
    --ok: #55C686; --ok-soft: #12301F; --warn: #E6AE45; --warn-soft: #33260A;
    --bad: #F2776C; --bad-soft: #3A1715; --info: #86AEF2; --info-soft: #172338; --mute: #9AA8AE; --mute-soft: #20292C;
    --c-mazeret: #86AEF2; --c-saatlik: #DDAE52; --c-rapor: #F2776C; --c-ucretsiz: #9AA8AE;
    --c-dogum: #A996F2; --c-idari: #5CC6DD; --c-dgunu: #F08AB7;
    --c-yonetim: #A996F2; --c-banka: #86AEF2; --c-kapanis: #DDAE52; --c-denetim: #F2776C; --c-birebir: #5CC6DD; --c-diger: #9AA8AE;
    --scrim: rgb(0 0 0 / .6); --shadow-1: 0 1px 2px rgb(0 0 0 / .4); --shadow-2: 0 14px 36px rgb(0 0 0 / .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1315; --surface: #141E21; --surface-2: #1A262A; --ink: #E3ECE9; --ink-2: #C3D0CC;
  --muted: #8E9EA3; --line: #27363B; --track: #22302F;
  --accent: #3FBFA7; --accent-mid: #2A7F70; --accent-ink: #04211C; --accent-soft: #12352F;
  --brass: #DDAE52; --brass-soft: #33280F;
  --ok: #55C686; --ok-soft: #12301F; --warn: #E6AE45; --warn-soft: #33260A;
  --bad: #F2776C; --bad-soft: #3A1715; --info: #86AEF2; --info-soft: #172338; --mute: #9AA8AE; --mute-soft: #20292C;
  --c-mazeret: #86AEF2; --c-saatlik: #DDAE52; --c-rapor: #F2776C; --c-ucretsiz: #9AA8AE;
  --c-dogum: #A996F2; --c-idari: #5CC6DD; --c-dgunu: #F08AB7;
  --c-yonetim: #A996F2; --c-banka: #86AEF2; --c-kapanis: #DDAE52; --c-denetim: #F2776C; --c-birebir: #5CC6DD; --c-diger: #9AA8AE;
  --scrim: rgb(0 0 0 / .6); --shadow-1: 0 1px 2px rgb(0 0 0 / .4); --shadow-2: 0 14px 36px rgb(0 0 0 / .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body.has-sheet { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { text-wrap: balance; }
.tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .93em; letter-spacing: -.01em; }
.display { font-family: var(--f-display); font-optical-sizing: auto; }
.muted { color: var(--muted); }
.neg { color: var(--bad); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; flex: none; }

/* ---- shell ---- */
.topbar { position: sticky; top: var(--top-offset); z-index: 20; padding-top: var(--top-pad); background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: saturate(1.3) blur(12px); backdrop-filter: saturate(1.3) blur(12px); }
.topbar-in { max-width: 912px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 20px/1 var(--f-display); letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
.brand b { color: var(--accent); font-weight: 800; }
.brand svg { width: 30px; height: 30px; }
.topbar-date { margin-left: auto; font-size: 13px; color: var(--muted); text-align: right; }
.view { max-width: 912px; margin: 0 auto; padding: 6px 16px calc(var(--tabbar-h) + var(--sab) + 104px); display: grid; gap: 26px; }
.view > * { min-width: 0; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 6px calc(6px + var(--sab)); background: var(--surface); border-top: 1px solid var(--line); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 54px; padding: 4px 0; border: 0; background: none; color: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: .01em; cursor: pointer; border-radius: 12px; }
.tab-ico { display: grid; place-items: center; width: 54px; height: 30px; border-radius: 999px; transition: background-color .2s; }
.tab .ic { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] .tab-ico { background: var(--accent-soft); color: var(--accent); }
#gearBtn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
@media (min-width: 960px) {
  .tabbar { top: 0; right: auto; width: 100px; grid-template-columns: 1fr; grid-auto-rows: min-content; align-content: start; gap: 8px; padding: calc(var(--sat) + 84px) 8px 16px; border-top: 0; border-right: 1px solid var(--line); }
  .app { padding-left: 100px; }
  .view { padding-bottom: 120px; }
}

/* ---- type ---- */
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.h1 { margin: 2px 0 0; font-size: clamp(28px, 7vw, 38px); line-height: 1.05; font-weight: 700; letter-spacing: -.025em; }
.lede { margin: 6px 0 0; font-size: 15px; color: var(--ink-2); max-width: 62ch; }
.sec { display: grid; gap: 10px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-title { margin: 0; font: 600 12.5px/1.3 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.sec-link { font-size: 13.5px; font-weight: 600; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 0; }
.fine { margin: 0; font-size: 12.5px; color: var(--muted); }
.hint { margin: 0; font-size: 12.5px; color: var(--muted); }

/* ---- surfaces ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card-title { margin: 0 0 12px; font: 700 17px/1.25 var(--f-display); letter-spacing: -.01em; }
.grid-2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }

.hero { position: relative; overflow: hidden; display: grid; gap: 8px; background: var(--accent); color: var(--accent-ink); border-color: transparent; padding: 18px 18px 16px; }
.hero .eyebrow { color: inherit; opacity: .82; }
.hero h2 { margin: 0; font: 700 23px/1.15 var(--f-display); letter-spacing: -.015em; max-width: 26ch; }
.hero p { margin: 0; }
.hero-ring { position: absolute; right: -46px; top: -46px; width: 190px; height: 190px; opacity: .16; pointer-events: none; }
.hero .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.btn-on { background: var(--accent-ink); color: var(--accent); border-color: transparent; }
.btn-on-ghost { background: transparent; color: var(--accent-ink); border-color: currentColor; }
.hero-empty { display: grid; gap: 10px; align-content: start; }
.hero-empty h2 { margin: 0; font: 700 20px/1.2 var(--f-display); }

.balance { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 18px; align-items: center; }
.ring-wrap { position: relative; width: 132px; height: 132px; }
.ring-wrap svg { width: 100%; height: 100%; display: block; }
.ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.05; }
.ring-center strong { font: 800 32px/1 var(--f-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ring-center span { font-size: 12px; color: var(--muted); margin-top: 3px; }
.kv { margin: 0; display: grid; gap: 7px; }
.kv > div { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.kv dt { color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.kv dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.balance .foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
@media (max-width: 380px) { .balance { grid-template-columns: 1fr; justify-items: center; } .balance .kv { width: 100%; } }

/* ---- ledger lists ---- */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 0; background: none; text-align: left; cursor: pointer; color: inherit; font: inherit; }
.row + .row { border-top: 1px solid var(--line); }
button.row:hover, .row .linkish:hover { background: var(--surface-2); }
.row-main { display: grid; gap: 2px; min-width: 0; }
.row-title { font-weight: 600; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
.row-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row-end { display: flex; align-items: center; gap: 6px; }
.linkish { border: 0; background: none; text-align: left; padding: 0; cursor: pointer; color: inherit; font: inherit; border-radius: 8px; }
.grp { margin: 6px 2px 0; font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.datetile { width: 48px; display: grid; justify-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.datetile span { width: 100%; text-align: center; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 0; color: var(--surface); background: var(--c); }
.datetile b { font: 700 19px/1.25 var(--f-display); padding: 2px 0 3px; font-variant-numeric: tabular-nums; }
.mtime { display: grid; justify-items: end; min-width: 50px; line-height: 1.2; }
.mtime b { font-weight: 600; font-size: 14.5px; }
.mtime span { font-size: 12.5px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }
.tag { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--mute-soft); color: var(--mute); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.live { background: var(--accent); color: var(--accent-ink); }
.flag { color: var(--warn); display: inline-flex; }
.flag .ic { width: 18px; height: 18px; }
.checkbtn { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--accent-ink); padding: 0; }
.checkbtn .ic { width: 16px; height: 16px; opacity: 0; }
.checkbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.checkbtn[aria-pressed="true"] .ic { opacity: 1; }
.done-text { text-decoration: line-through; color: var(--muted); }
.empty { padding: 22px 16px; display: grid; gap: 10px; justify-items: start; color: var(--ink-2); }
.empty p { margin: 0; }

/* ---- controls ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14.5px; cursor: pointer; text-decoration: none; text-align: center; line-height: 1.2; }
.btn .ic { width: 18px; height: 18px; }
.btn:hover { border-color: var(--muted); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { border-color: var(--accent); filter: brightness(1.06); }
.btn-quiet { background: transparent; border-color: transparent; color: var(--accent); padding: 0 8px; }
.btn-danger { color: var(--bad); }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 9px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 11px; border: 0; background: transparent; color: var(--ink); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.fab { position: fixed; right: 16px; bottom: calc(var(--tabbar-h) + var(--sab) + 16px); z-index: 25; display: inline-flex; align-items: center; gap: 8px; height: 54px; padding: 0 22px 0 18px; border-radius: 17px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 15px; box-shadow: var(--shadow-2); cursor: pointer; }
.fab .ic { width: 22px; height: 22px; }
@media (min-width: 960px) { .fab { bottom: 28px; right: 28px; } }
.act-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: 8px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--track); border-radius: 11px; max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 7px 13px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.seg-wide { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; }
.seg-wide button { padding: 8px 4px; font-size: 13px; }
.search { flex: 1 1 200px; display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--ink); padding: 8px 0; }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; display: inline-flex; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip > span, button.chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 500; cursor: pointer; color: var(--ink); line-height: 1.25; }
.chip input:checked + span, button.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 600; }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.namechip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 4px 4px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; }
.namechip button { width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.namechip .ic { width: 15px; height: 15px; }

.field { display: grid; gap: 6px; min-width: 0; border: 0; padding: 0; margin: 0; }
.field > label, .field > legend, .lbl { font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 0; margin-bottom: 0; }
.field > legend { margin-bottom: 6px; }
.field input:not([type="checkbox"]):not([type="radio"]), .field select, .field textarea, .inp { width: 100%; min-height: 44px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
.field textarea { min-height: 92px; resize: vertical; line-height: 1.45; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.row3 { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 400px) { .row3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .row3 > :first-child { grid-column: 1 / -1; } }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 0; }
.checks { display: grid; gap: 8px; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; }
.inline-form > input, .inline-form > select { flex: 1 1 160px; min-width: 0; }
.form-err { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); font-weight: 600; font-size: 14px; }

<script>
(() => {

const canPrint = !ENV.framed && !ENV.native && typeof window.print === 'function';
const canDownload = !ENV.framed && !ENV.native;

/* ================= small utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const addMonths = (s, n) => { const d = parseD(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return ymd(d); };
const today = () => ymd(new Date());
const dayDiff = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');

const toMin = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };

const atTime = (date, time) => { const d = parseD(date); const [h, m] = String(time || '00:00').split(':').map(Number); d.setHours(h || 0, m || 0, 0, 0); return d; };
const nowISO = () => new Date().toISOString();
const lowerTR = s => String(s || '').toLocaleLowerCase('tr');
const initials = n => String(n || '?').trim().split(/\s+/).map(w => w[0] || '').slice(0, 2).join('').toLocaleUpperCase('tr');
const safeUrl = u => { u = String(u || '').trim(); if (!u) return ''; if (/^https?:\/\//i.test(u)) return u; if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(u)) return 'https://' + u; return ''; };
const hashId = s => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h % 2000000000) + 1; };
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

const MONTHS = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
const MON3 = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
const DAYS = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
const DAY3 = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
const fmt = {
  num: n => { const r = Math.round((+n || 0) * 10) / 10; return (Number.isInteger(r) ? String(r) : r.toFixed(1)).replace('.', ','); },
  long: s => { const d = parseD(s); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; },
  longDay: s => { const d = parseD(s); return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; },
  dayMonth: s => { const d = parseD(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; },
  short: s => { const d = parseD(s); return `${d.getDate()} ${MON3[d.getMonth()]}`; },
  shortDay: s => { const d = parseD(s); return `${DAY3[d.getDay()]}, ${d.getDate()} ${MON3[d.getMonth()]}`; },
  range(a, b) {

      if (A.getMonth() === B.getMonth()) return `${A.getDate()}–${B.getDate()} ${MONTHS[B.getMonth()]} ${B.getFullYear()}`;
      return `${A.getDate()} ${MON3[A.getMonth()]} – ${B.getDate()} ${MON3[B.getMonth()]} ${B.getFullYear()}`;
    }
    return `${fmt.short(a)} ${A.getFullYear()} – ${fmt.short(b)} ${B.getFullYear()}`;
  },
  rel(s) {
    const n = dayDiff(today(), s);
    if (n === 0) return 'Bugün'; if (n === 1) return 'Yarın'; if (n === -1) return 'Dün';
    if (n > 1 && n < 7) return DAYS[parseD(s).getDay()];

  },
  stamp(iso) { const d = new Date(iso); if (isNaN(d)) return ''; return `${d.getDate()} ${MON3[d.getMonth()]} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
};

/* ================= icons ================= */
const ic = p => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

function upcomingHolidays(n = 5, from = today()) {

}

  days.forEach((x, i) => { if (x.cost === 0) { if (b && b.e === i - 1) b.e = i; else { b = { s: i, e: i }; blocks.push(b); } } });
  const gapCost = (s, e) => days.slice(s, e + 1).reduce((a, x) => a + x.cost, 0);
  const ideas = [];
  blocks.forEach((B, bi) => {

    if (!hol) return;
    const L = [{ cost: 0, s: B.s, gap: null }], R = [{ cost: 0, e: B.e, gap: null }];
    const P = blocks[bi - 1], Nx = blocks[bi + 1];

    let best = null;
    for (const l of L) for (const r of R) {
      const cost = l.cost + r.cost; if (!cost || cost > 3) continue;
      const span = r.e - l.s + 1; if (span < 4 || span / cost < 3) continue;

/* ================= device bridges ================= */
async function saveFile(name, mime, content) {
  if (ENV.native) {
    const FS = plug('Filesystem'), SH = plug('Share');
    if (FS && SH) {
      try {
        const r = await FS.writeFile({ path: name, data: content, directory: 'CACHE', encoding: 'utf8', recursive: true });
        await SH.share({ title: name, files: [r.uri], dialogTitle: 'Kaydet veya paylaş' });
        return true;
      } catch (e) { if (/cancel/i.test(String((e && e.message) || e))) return true; console.warn(e); }
    }
  }
  if (canDownload) {
    try {
      const url = URL.createObjectURL(new Blob([content], { type: mime + ';charset=utf-8' }));
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast(`${name} indirildi`);
      return true;
    } catch (e) { console.warn(e); }
  }
  openSheet('text', { title: name, text: content, wa: false, note: 'Bu görünümde dosya indirilemiyor. Metni kopyalayıp bir dosyaya yapıştırabilir ya da uygulamanın indirilen sürümünü kullanabilirsiniz.' });
  return false;
}
function copyText(text) {
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove(); toast(ok ? 'Panoya kopyalandı' : 'Kopyalanamadı. Metni seçip elle kopyalayın.');
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('Panoya kopyalandı'), fallback);
    else fallback();
  } catch (e) { fallback(); }
}
const canShareText = () => (ENV.native ? !!plug('Share') : !ENV.framed && !!navigator.share);
async function shareText(title, text) {
  try {
    if (ENV.native && plug('Share')) await plug('Share').share({ title, text, dialogTitle: title });
    else if (navigator.share) await navigator.share({ title, text });
  } catch (e) { /* user closed the share sheet */ }
}
function printHTML(inner) {
  const root = $('#print-root');
  root.innerHTML = `<div class="doc">${inner}</div>`;
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); root.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 60);
}

/* ================= notifications ================= */
const notified = new Set();
const scheduleNotifications = debounce(async () => {
  if (!ENV.native || !S.settings.notify) return;
  const LN = plug('LocalNotifications'); if (!LN) return;
  try {
    const pend = await LN.getPending();
    if (pend && pend.notifications && pend.notifications.length) await LN.cancel({ notifications: pend.notifications.map(n => ({ id: n.id })) });
    const now = Date.now(), list = [];
    for (const m of S.meetings) {
      if (m.status !== 'planned' || !m.reminder) continue;
      const at = mStart(m) - m.reminder * 60000;
      if (at > now && at < now + 60 * 864e5) list.push({ id: hashId(m.id), title: m.title, body: `${m.start}–${m.end}${m.location ? ' · ' + m.location : ''}`, schedule: { at: new Date(at), allowWhileIdle: true }, smallIcon: 'ic_stat_finans360', iconColor: '#0B6B5D', extra: { meetingId: m.id } });
    }
    for (const l of S.leaves) {
      if (l.person !== 'me' || l.status !== 'approved' || l.type === 'saatlik') continue;
      const at = atTime(addDays(l.start, -1), '17:00').getTime();
      if (at > now && at < now + 60 * 864e5) list.push({ id: hashId(l.id), title: 'Yarın izinlisiniz', body: `${LEAVE_TYPES[l.type].label} · ${rangeText(l)}${l.deputy ? ' · Vekil: ' + l.deputy : ''}`, schedule: { at: new Date(at), allowWhileIdle: true }, smallIcon: 'ic_stat_finans360', iconColor: '#0B6B5D' });
    }
    list.sort((a, b) => a.schedule.at - b.schedule.at);
    if (list.length) await LN.schedule({ notifications: list.slice(0, 60) });
  } catch (e) { console.warn('Bildirim planlanamadı', e); }
}, 600);
async function enableNotifications() {
  if (ENV.native) {
    const LN = plug('LocalNotifications');
    if (!LN) { toast('Bildirim eklentisi bulunamadı.'); return; }
    try {
      const r = await LN.requestPermissions();
      if (r.display === 'granted') { S.settings.notify = true; persist(); toast('Toplantı hatırlatmaları açıldı'); }
      else toast('Bildirim izni verilmedi. Telefon ayarlarından Finans360 için bildirimleri açın.', null, 6000);
    } catch (e) { toast('Bildirim izni alınamadı.'); }
  } else if ('Notification' in window && !ENV.framed) {
    const r = await Notification.requestPermission();
    S.settings.notify = r === 'granted'; persist();
    toast(r === 'granted' ? 'Uygulama açıkken bildirim gösterilecek' : 'Tarayıcı bildirim iznini reddetti');
  } else {
    S.settings.notify = true; persist();
    toast('Hatırlatmalar sayfa açıkken uygulama içinde gösterilecek');
  }
  render();
}
function tick() {
  const now = Date.now();
  if (tick.day !== today()) { const first = !tick.day; tick.day = today(); if (!first) render(); }
  for (const m of S.meetings) {
    if (m.status !== 'planned' || !m.reminder) continue;
    const st = mStart(m), key = `${m.id}@${m.date}${m.start}`;
    if (now >= st - m.reminder * 60000 && now < st && !notified.has(key)) {
      notified.add(key);
      toast(`${m.title}: ${Math.max(1, Math.round((st - now) / 60000))} dk sonra`, { label: 'Aç', run: () => openSheet('meeting', { id: m.id }) }, 9000);
      if (!ENV.native && !ENV.framed && S.settings.notify && 'Notification' in window && Notification.permission === 'granted' && document.visibilityState !== 'visible') {
        try { new Notification(m.title, { body: `${m.start}–${m.end} ${m.location || ''}`, tag: key }); } catch (e) { /* ignore */ }
      }
    }
  }
  $$('[data-countdown]').forEach(el => { const m = S.meetings.find(x => x.id === el.dataset.countdown); if (m) el.textContent = countdown(m); });
}

/* ================= toast ================= */
const toastActs = {};
function toast(msg, action, ms = 3800) {
  const root = $('#toastRoot'); if (!root) return;
  const id = uid();
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button" data-act="toast-act" data-id="${id}">${esc(action.label)}</button>` : ''}`;
  if (action) toastActs[id] = action.run;
  root.appendChild(el);
  while (root.children.length > 3) root.firstChild.remove();
  setTimeout(() => { el.remove(); delete toastActs[id]; }, ms);
}

function ringSVG(b) {
  const r = 50, c = 2 * Math.PI * r, total = Math.max(b.total, b.used + b.planned + b.pending, 1);
  let off = 0, arcs = '';
  for (const [v, col] of [[b.used, 'var(--accent)'], [b.planned, 'var(--accent-mid)'], [b.pending, 'var(--brass)']]) {
    if (v <= 0) continue;
    const len = (v / total) * c;
    arcs += `<circle r="${r}" cx="60" cy="60" fill="none" stroke="${col}" stroke-width="12" stroke-dasharray="${len.toFixed(2)} ${(c - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`;
    off += len;
  }
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle r="${r}" cx="60" cy="60" fill="none" stroke="var(--track)" stroke-width="12"/>${arcs}</svg>`;
}

  ${sdays.length ? `<section class="sec"><div class="sec-head"><h2 class="sec-title">Yaklaşan özel günler</h2><button type="button" class="sec-link" data-act="tab" data-tab="personel">Personel</button></div><div class="list">${sdays.slice(0, 6).map(specialRow).join('')}</div></section>` : ''}

  <section class="sec"><div class="sec-head"><h2 class="sec-title">Resmî tatiller</h2></div>
    <div class="list">${hols.map(h => `<div class="row"><span class="datetile" style="--c:var(--brass)"><span>${MON3[parseD(h.start).getMonth()]}</span><b>${parseD(h.start).getDate()}</b></span><span class="row-main"><span class="row-title">${esc(h.group)}</span><span class="row-sub">${h.start === h.end ? fmt.longDay(h.start) : fmt.range(h.start, h.end)}${h.days[0].half ? ' · arife yarım gün' : ''}</span></span><span class="row-end"><span class="pill">${dayDiff(t, h.start) === 0 ? 'Bugün' : `${dayDiff(t, h.start)} gün`}</span></span></div>`).join('') || '<div class="empty"><p>Tatil verisi bulunamadı. Ayarlar’dan tatil günü ekleyebilirsiniz.</p></div>'}</div></section>`;

function leaveListHTML() {
  const t = today(), q = lowerTR(UI.leaveQ.trim());
  let list = S.leaves.filter(l => (UI.leaveWho === 'all' || (UI.leaveWho === 'me' ? l.person === 'me' : l.person !== 'me')) && (UI.leaveStatus === 'all' || l.status === UI.leaveStatus));
  if (q) list = list.filter(l => lowerTR([LEAVE_TYPES[l.type].label, personName(l.person), l.reason, l.deputy, fmt.range(l.start, l.end), STATUS[l.status][0]].join(' ')).includes(q));
  const cur = list.filter(l => l.end >= t).sort((a, b) => a.start.localeCompare(b.start));
  const past = list.filter(l => l.end < t).sort((a, b) => b.start.localeCompare(a.start));
  if (!list.length) return `<div class="list"><div class="empty"><p>${q ? 'Aramanızla eşleşen izin yok.' : 'Bu filtrede izin kaydı yok.'}</p><button type="button" class="btn btn-sm" data-act="leave-new">${I.plus} İzin talebi oluştur</button></div></div>`;
  return `${cur.length ? `<h3 class="grp">Yaklaşan ve süren</h3><div class="list">${cur.map(leaveRow).join('')}</div>` : ''}${past.length ? `<h3 class="grp">Geçmiş</h3><div class="list">${past.map(leaveRow).join('')}</div>` : ''}`;
}
function viewLeaves() {
  const counts = s => S.leaves.filter(l => (UI.leaveWho === 'all' || (UI.leaveWho === 'me' ? l.person === 'me' : l.person !== 'me')) && (s === 'all' || l.status === s)).length;
  const hours = S.leaves.filter(l => l.person === 'me' && l.type === 'saatlik' && l.status === 'approved' && parseD(l.start).getFullYear() === parseD(today()).getFullYear()).reduce((a, l) => a + leaveHours(l), 0);
  return `
  <section><p class="eyebrow">İzin yönetimi</p><h1 class="display h1">İzin</h1><p class="lede">Bakiyenizi izleyin, talep oluşturun, onay durumunu ve ekibin izinlerini tek yerde görün.</p></section>
  ${meReady() ? balanceCard(balance(), true) : `<div class="banner" role="note"><p><b>İzin hakkınızı görmek için kendinizi seçin.</b> Personel listesindeki kaydınızı seçin ya da Ayarlar’da işe giriş tarihinizi girin.</p><div class="btns"><button type="button" class="btn btn-sm" data-act="tab" data-tab="${S.people.length ? 'ayarlar' : 'personel'}">${S.people.length ? 'Kendimi seç' : 'Personeli yükle'}</button></div></div>`}
  ${hours ? `<p class="fine">Bu yıl onaylı saatlik izin: ${fmt.num(hours)} saat.</p>` : ''}
  <section class="sec">
    <div class="toolbar">${seg('leaveWho', [['me', 'Benim'], ['team', 'Ekip'], ['all', 'Tümü']])}
      <label class="search">${I.search}<span class="sr-only">İzinlerde ara</span><input id="lq" type="search" placeholder="Tür, kişi veya açıklama ara" value="${esc(UI.leaveQ)}" autocomplete="off"></label></div>
    <div class="chips" role="group" aria-label="Durum">${[['all', 'Tümü'], ['pending', 'Bekleyen'], ['approved', 'Onaylı'], ['rejected', 'Reddedilen'], ['cancelled', 'İptal']].map(([v, l]) => `<button type="button" class="chip" data-act="filter" data-key="leaveStatus" data-v="${v}" aria-pressed="${UI.leaveStatus === v}">${l} <span class="count">${counts(v)}</span></button>`).join('')}</div>
    <div id="leaveList" class="sec">${leaveListHTML()}</div>
  </section>`;
}

function meetingListHTML() {
  const t = today(), now = Date.now(), q = lowerTR(UI.mQ.trim());
  let list = S.meetings.slice();
  if (UI.mWhen === 'upcoming') list = list.filter(m => mEnd(m) >= now && m.status !== 'cancelled');
  else if (UI.mWhen === 'past') list = list.filter(m => mEnd(m) < now || m.status === 'cancelled');
  if (q) list = list.filter(m => lowerTR([m.title, m.location, KINDS[m.kind][0], m.participants.join(' '), m.agenda.map(a => a.text).join(' ')].join(' ')).includes(q));
  list.sort(byStart); if (UI.mWhen === 'past') list.reverse();
  if (!list.length) return `<div class="list"><div class="empty"><p>${q ? 'Aramanızla eşleşen toplantı yok.' : UI.mWhen === 'upcoming' ? 'Yaklaşan toplantı yok.' : 'Kayıt yok.'}</p><button type="button" class="btn btn-sm" data-act="meeting-new">${I.plus} Toplantı planla</button></div></div>`;
  const groups = [];
  for (const m of list) { const g = groups[groups.length - 1]; if (g && g.date === m.date) g.items.push(m); else groups.push({ date: m.date, items: [m] }); }
  return groups.map(g => { const n = dayDiff(t, g.date); const lbl = n === 0 ? 'Bugün' : n === 1 ? 'Yarın' : n === -1 ? 'Dün' : ''; return `<h3 class="grp">${lbl ? lbl + ' · ' : ''}${fmt.longDay(g.date)}</h3><div class="list">${g.items.map(m => meetingRow(m, false)).join('')}</div>`; }).join('');
}
function viewMeetings() {
  const t = today(), wkEnd = addDays(t, 6);
  const week = S.meetings.filter(m => m.status === 'planned' && m.date >= t && m.date <= wkEnd);
  const mins = week.reduce((a, m) => a + Math.max(0, mDur(m)), 0);
  return `
  <section><p class="eyebrow">Toplantı yönetimi</p><h1 class="display h1">Toplantı</h1><p class="lede">Önümüzdeki 7 günde ${week.length} toplantı, toplam ${fmt.num(mins / 60)} saat.</p></section>
  ${nextMeetingCard()}
  <section class="sec">
    <div class="toolbar">${seg('mWhen', [['upcoming', 'Yaklaşan'], ['past', 'Geçmiş'], ['all', 'Tümü']])}
      <label class="search">${I.search}<span class="sr-only">Toplantılarda ara</span><input id="mq" type="search" placeholder="Konu, kişi veya yer ara" value="${esc(UI.mQ)}" autocomplete="off"></label></div>
    <div id="meetingList" class="sec">${meetingListHTML()}</div>
  </section>`;
}

function viewCalendar() {
  const [y, mo] = UI.calMonth.split('-').map(Number);
  const first = `${y}-${pad(mo)}-01`;
  const offset = (parseD(first).getDay() + 6) % 7;
  const gridStart = addDays(first, -offset);
  const dim = new Date(y, mo, 0).getDate();
  const weeks = Math.ceil((offset + dim) / 7);
  const t = today();
  const leaves = S.leaves.filter(activeLeave);
  let cells = '', mCount = 0, lDays = 0, hCount = 0;
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(gridStart, i), out = d.slice(0, 7) !== UI.calMonth;
    const h = holidayOn(d), we = isWeekend(d);
    const dl = leaves.filter(l => covers(l, d)), dm = S.meetings.filter(m => m.date === d && m.status !== 'cancelled');
    const bd = S.people.filter(p => isDate(p.birthDate) && p.birthDate.slice(5) === d.slice(5));
    if (!out) { mCount += dm.length; if (dl.some(l => l.person === 'me')) lDays++; if (h && !h.half) hCount++; }
    const cls = ['cal-cell', out && 'out', we && 'we', h && (h.half ? 'half' : 'hol'), d === t && 'today'].filter(Boolean).join(' ');
    const label = `${fmt.longDay(d)}${h ? ', ' + h.name : ''}${dm.length ? `, ${dm.length} toplantı` : ''}${dl.length ? `, ${dl.length} izin` : ''}${bd.length ? `, ${bd.length} doğum günü` : ''}`;
    cells += `<button type="button" class="${cls}" data-act="cal-day" data-date="${d}" aria-pressed="${UI.calDay === d}" aria-label="${esc(label)}"><span class="cal-num">${parseD(d).getDate()}</span>${bd.length ? '<span class="cal-bd" aria-hidden="true"></span>' : ''}${dm.length ? `<span class="cal-mc">${dm.length}</span>` : ''}${h ? `<span class="cal-hname">${esc(h.half ? 'Arife' : h.group)}</span>` : ''}<span class="cal-bars">${dl.slice(0, 3).map(l => `<i class="${l.person === 'me' ? '' : 'team'} ${l.status === 'pending' ? 'pend' : ''}" style="--c:var(${LEAVE_TYPES[l.type].color})"></i>`).join('')}</span></button>`;
  }
  const d = UI.calDay, h = holidayOn(d);
  const dl = S.leaves.filter(l => covers(l, d)).sort((a, b) => (a.person === 'me' ? -1 : 1));
  const dm = S.meetings.filter(m => m.date === d).sort(byStart);
  const dbd = S.people.filter(p => isDate(p.birthDate) && p.birthDate.slice(5) === d.slice(5));
  const noData = !BAYRAM[y] ? `<p class="note warn">${I.alert}<span>${y} yılı dinî bayram tarihleri yüklü değil. Ayarlar › Tatil günleri bölümünden ekleyebilirsiniz.</span></p>` : '';
  return `
  <section><p class="eyebrow">Takvim</p><h1 class="display h1">${MONTHS[mo - 1]} ${y}</h1><p class="lede">${mCount} toplantı · ${lDays} izinli gününüz · ${hCount} resmî tatil günü</p></section>
  ${noData}
  <div class="cal">
    <div class="cal-head"><h2>${MONTHS[mo - 1]} <span class="muted">${y}</span></h2>
      <button type="button" class="btn btn-sm btn-quiet" data-act="cal-today">Bugün</button>
      <button type="button" class="icon-btn" data-act="cal-prev" aria-label="Önceki ay">${I.left}</button>
      <button type="button" class="icon-btn" data-act="cal-next" aria-label="Sonraki ay">${I.right}</button></div>
    <div class="cal-wd" aria-hidden="true">${['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'].map(x => `<span>${x}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="legend"><span><i class="lg" style="background:var(--c-yillik)"></i>Sizin izniniz</span><span><i class="lg" style="background:repeating-linear-gradient(135deg,var(--c-mazeret) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--c-mazeret)"></i>Ekip izni</span><span><i class="lg" style="background:var(--brass-soft);box-shadow:inset 0 0 0 1px var(--brass)"></i>Resmî tatil</span><span><span class="cal-mc" style="position:static">2</span>Toplantı</span><span><i class="lg" style="width:8px;height:8px;border-radius:50%;background:var(--brass)"></i>Doğum günü</span></div>
  </div>
  <section class="sec" aria-live="polite">
    <div class="sec-head"><h2 class="sec-title">${fmt.longDay(d)}</h2></div>
    ${h ? `<p class="note warn">${I.flag}<span>${esc(h.name)}${h.half ? ': öğleden sonra tatil' : ''}</span></p>` : isWeekend(d) ? '<p class="fine">Hafta tatili</p>' : ''}
    ${dl.length || dm.length || dbd.length ? `<div class="list">${dbd.map(p => specialRow({ kind: 'bday', p, date: d, years: parseD(d).getFullYear() - parseD(p.birthDate).getFullYear() })).join('')}${dl.map(leaveRow).join('')}${dm.map(m => meetingRow(m, false)).join('')}</div>` : '<div class="list"><div class="empty"><p>Bu gün için kayıt yok.</p></div></div>'}
    <div class="act-grid"><button type="button" class="btn" data-act="meeting-new" data-date="${d}">${I.plus} Toplantı ekle</button><button type="button" class="btn" data-act="leave-new" data-start="${d}" data-end="${d}">${I.plus} İzin ekle</button></div>
  </section>`;
}

}

const sheets = [];
let histOK = true, popThen = null;
const sheetHead = (title, right = '') => `<header class="sheet-head"><button type="button" class="icon-btn" data-act="sheet-close" aria-label="Kapat">${I.x}</button><h2>${esc(title)}</h2>${right}</header>`;
function openSheet(kind, data) {
  const s = { id: uid(), kind, data: data || {} };
  sheets.push(s);
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap'; wrap.dataset.sid = s.id;
  wrap.innerHTML = `<div class="scrim" data-act="sheet-close"></div><div class="sheet ${SHEETS[kind].cls || ''}" role="dialog" aria-modal="true" tabindex="-1"></div>`;
  $('#sheetRoot').appendChild(wrap);
  s.el = wrap;
  fillSheet(s);
  document.body.classList.add('has-sheet');
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
  const f = wrap.querySelector('[autofocus]') || wrap.querySelector('.sheet');
  setTimeout(() => { try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 30);
  if (histOK) { try { history.pushState({ f360: sheets.length }, ''); } catch (e) { histOK = false; } }
  return s;
}
function fillSheet(s) {
  const def = SHEETS[s.kind], box = s.el.querySelector('.sheet');
  box.className = `sheet ${def.cls || ''}`;
  box.setAttribute('aria-label', def.label(s));
  box.innerHTML = def.render(s);
  if (def.mount) def.mount(s);
}
function refreshSheet(s) {
  if (!s || !s.el || SHEETS[s.kind].static) return;
  const body = s.el.querySelector('.sheet-body'), top = body ? body.scrollTop : 0;
  fillSheet(s);
  const nb = s.el.querySelector('.sheet-body'); if (nb) nb.scrollTop = top;
}
function swapSheet(s, kind, data) { s.kind = kind; s.data = data; fillSheet(s); }
function unmountTop() {
  const s = sheets.pop(); if (!s) return;
  s.el.remove();
  if (!sheets.length) document.body.classList.remove('has-sheet');
}
function closeTo(n, then) {
  if (sheets.length <= n) { if (then) then(); return; }
  if (histOK && history.state && history.state.f360 === sheets.length) { popThen = then || null; history.go(-(sheets.length - n)); }
  else { while (sheets.length > n) unmountTop(); if (then) then(); }
}
const sheetIndex = el => { const w = el.closest('.sheet-wrap'); return w ? sheets.findIndex(s => s.id === w.dataset.sid) : -1; };
const sheetOf = el => sheets[sheetIndex(el)];
window.addEventListener('popstate', e => {
  const depth = (e.state && e.state.f360) || 0;
  while (sheets.length > depth) unmountTop();
  const t = popThen; popThen = null; if (t) t();
});
function confirmSheet(o) { openSheet('confirm', o); }

function partsHTML(s) {

}
function addParts(s, names) {
  for (const raw of names) {
    const n = clean(raw); if (!n) continue;
    const p = findPerson(n), name = p ? p.name : n;
    if (p && p.id === S.meId) continue;
    if (!s.data.parts.some(x => fold(x) === fold(name))) s.data.parts.push(name);
  }
  const box = s.el.querySelector('[data-parts]'); if (box) box.innerHTML = partsHTML(s);
  syncMeetingForm(s);
}
function readMeetingForm(form) {
  const f = form.elements, s = sheetOf(form);
  const pending = f.partAdd ? f.partAdd.value.split(',').map(clean).filter(Boolean) : [];
  return {
    title: f.title.value.trim(), kind: f.kind.value, date: f.date.value, start: f.start.value, end: f.end.value,
    location: f.location.value.trim(), link: f.link.value.trim(), participants: [...new Set([...(s && s.data.parts ? s.data.parts : []), ...pending])],
    agendaLines: f.agenda.value.split('\n').map(x => x.trim()).filter(Boolean), reminder: +f.reminder.value || 0,
    status: f.status ? f.status.value : 'planned', repeat: f.repeat ? f.repeat.value : 'none', count: f.count ? Math.max(2, Math.min(26, +f.count.value || 2)) : 1
  };
}
function syncMeetingForm(s, ev) {
  const form = s.el.querySelector('form'); if (!form) return;
  const f = form.elements;
  if (ev && ev.target === f.start && isTime(f.start.value)) f.end.value = fromMin(toMin(f.start.value) + (+form.dataset.dur || 60));
  if (ev && ev.target === f.end && isTime(f.end.value) && isTime(f.start.value)) form.dataset.dur = Math.max(5, toMin(f.end.value) - toMin(f.start.value));
  const cw = form.querySelector('[data-show="count"]'); if (cw) cw.hidden = !f.repeat || f.repeat.value === 'none';
  const d = readMeetingForm(form); d.id = s.data.existing || '__draft';
  const box = form.querySelector('[data-conf]');
  if (!isDate(d.date) || !isTime(d.start) || !isTime(d.end)) { box.innerHTML = '<span class="muted">Tarih ve saatleri seçin.</span>'; return; }
  const notes = meetingNotes(d), dur = toMin(d.end) - toMin(d.start);
  box.innerHTML = `<div class="sum-main"><strong>${dur > 0 ? dur : 0}</strong><span>dakika</span><span class="muted">· ${fmt.longDay(d.date)}</span></div>${notes.length ? noteList(notes) : `<p class="note ok">${I.check}<span>Çakışma yok${d.participants.length ? '; katılımcıların hepsi müsait' : ''}.</span></p>`}`;
}
function submitMeeting(form, s) {
  const d = readMeetingForm(form), errEl = form.querySelector('.form-err');
  const err = !d.title ? 'Toplantı konusunu yazın.' : !isDate(d.date) ? 'Tarihi seçin.' : !isTime(d.start) || !isTime(d.end) ? 'Saatleri seçin.' : toMin(d.end) <= toMin(d.start) ? 'Bitiş saati başlangıçtan sonra olmalı.' : '';
  if (err) { errEl.textContent = err; errEl.hidden = false; errEl.scrollIntoView({ block: 'nearest' }); return; }
  const fields = { title: d.title, kind: d.kind, date: d.date, start: d.start, end: d.end, location: d.location, link: d.link, participants: d.participants, reminder: d.reminder };
  let m, made = 1;
  if (s.data.existing) {
    m = S.meetings.find(x => x.id === s.data.existing); if (!m) return;
    const old = m.agenda;
    Object.assign(m, fields, { status: d.status });
    m.agenda = d.agendaLines.map(text => { const o = old.find(a => a.text === text); return o || { id: uid(), text, done: false }; });
  } else {
    const base = { ...fields, seriesId: null, notes: '', actions: [], attendance: {}, status: 'planned', createdAt: nowISO(), sample: false };
    const sid = d.repeat !== 'none' ? uid() : null;
    made = sid ? d.count : 1;
    for (let i = 0; i < made; i++) {
      const date = d.repeat === 'weekly' ? addDays(d.date, 7 * i) : d.repeat === 'biweekly' ? addDays(d.date, 14 * i) : d.repeat === 'monthly' ? addMonths(d.date, i) : d.date;
      const item = { ...clone(base), id: uid(), seriesId: sid, date, agenda: d.agendaLines.map(text => ({ id: uid(), text, done: false })) };
      S.meetings.push(item); if (!i) m = item;
    }
  }
  persist(); render();
  if (s.data.fromDetail) { swapSheet(s, 'meeting', { id: m.id }); toast('Toplantı güncellendi'); }
  else closeTo(sheets.indexOf(s), () => toast(made > 1 ? `${made} toplantı oluşturuldu` : s.data.existing ? 'Toplantı güncellendi' : 'Toplantı kaydedildi', { label: 'Davet metni', run: () => openSheet('text', { title: 'Toplantı daveti', text: meetingInvite(m) }) }, 6000));
}

async function handleImportFile(file, s) {
  const st = s && s.el.querySelector('[data-import-status]');
  const say = t => { if (st) st.textContent = t; };
  try {
    const name = lowerTR(file.name || ''), isPdf = /\.pdf$/.test(name) || file.type === 'application/pdf';
    let recs = [], source = '';
    if (isPdf) {
      say('PDF okuyucu hazırlanıyor…');
      const r = await parsePbfPdf(file, (i, n) => say(`Sayfa ${i}/${n} okunuyor…`));
      recs = r.records; source = `PDF, ${r.pages} sayfa`;
      if (!recs.length) throw new Error('Bu PDF’te Personel Bilgi Formu bulunamadı. Taranmış (resim) PDF’ler okunamaz; Excel’den CSV deneyin.');
    } else {
      const text = await file.text();
      if (/^\s*[{[]/.test(text)) {
        const o = JSON.parse(text);
        if (o && Array.isArray(o.leaves) && Array.isArray(o.meetings)) { closeTo(sheets.indexOf(s), () => restoreFrom(text)); return; }
        const arr = Array.isArray(o) ? o : o && o.people;
        if (!Array.isArray(arr)) throw new Error('Bu JSON dosyası personel listesi içermiyor.');
        recs = arr.filter(Boolean).map(normalizePerson).filter(x => x.name); source = 'JSON';
      } else {
        recs = csvToRecords(text); source = 'CSV';
        if (!recs.length) throw new Error('CSV’de kişi bulunamadı. İlk satırda “Adı” ya da “Ad Soyad” başlığı olmalı.');
      }
    }
    recs.forEach(r => { if (!r.source) r.source = `İçe aktarıldı: ${file.name || source} (${fmt.long(today())})`; });
    swapSheet(s, 'importPreview', { records: prepareImport(recs), source });
  } catch (e) { console.warn(e); say(e && e.message ? e.message : 'Dosya okunamadı.'); }
}
function submitImport(form, s) {

}

  if (t.dataset.bind && (t.type === 'checkbox' || t.tagName === 'SELECT')) { bindInput(t); return; }
  if (t.id === 'peopleFile' && t.files && t.files[0]) { handleImportFile(t.files[0], sheetOf(t)); t.value = ''; return; }
  if (t.id === 's-me') { if (t.value) setMe(t.value); else setMe(null); persist(); render(); toast(t.value ? 'Profiliniz bu kayda bağlandı' : 'Bağlantı kaldırıldı'); return; }
  if (t.name === 'partAdd') { const s = sheetOf(t); if (s && findPerson(t.value)) { addParts(s, [t.value]); t.value = ''; } return; }
  if (t.id === 'restoreFile' && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => restoreFrom(String(r.result)); r.onerror = () => toast('Dosya okunamadı.'); r.readAsText(t.files[0]); return; }
  const form = t.closest('form[data-form]');
  if (form && form.dataset.form === 'leave' && (t.type === 'radio' || t.type === 'checkbox' || t.tagName === 'SELECT')) syncLeaveForm(sheetOf(form), e);
  if (form && form.dataset.form === 'meeting' && t.tagName === 'SELECT') syncMeetingForm(sheetOf(form), e);
});
function bindInput(t) {
  const [grp, key] = t.dataset.bind.split('.');
  let v = t.type === 'checkbox' ? t.checked : t.value;
  if (key === 'defaultDuration' || key === 'defaultReminder' || key === 'lockMinutes') v = +v;
  S[grp][key] = v;
  if (grp === 'profile') { S.profileSample = false; syncProfileToMe(); }
  persistSoon();
  const es = $('#entSummary span'); if (es) es.textContent = `${basisText(balance())}. Kanuni süreler (İş K. md. 53): 1–5 yıl 14 gün, 5–15 yıl 20 gün, 15 yıl ve üzeri 26 gün; 18 yaş ve altı ile 50 yaş ve üstü için en az 20 gün.`;
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.name === 'partAdd') { e.preventDefault(); const s = sheetOf(e.target); if (s) { addParts(s, e.target.value.split(',')); e.target.value = ''; } return; }
  if (e.key === 'Escape' && sheets.length && !locked) { e.preventDefault(); closeTo(sheets.length - 1); }
});
['dragover', 'dragleave', 'drop'].forEach(type => document.addEventListener(type, e => {
  const d = e.target && e.target.closest ? e.target.closest('.drop') : null; if (!d) return;
  e.preventDefault();
  d.classList.toggle('over', type === 'dragover');
  if (type === 'drop' && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) handleImportFile(e.dataTransfer.files[0], sheetOf(d));
}));
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (VIEWS[t] && t !== UI.tab) { UI.tab = t; render(); } });
if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) { /* old engines */ } }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
  if (S.settings.pinHash && !locked && hiddenAt && Date.now() - hiddenAt > (+S.settings.lockMinutes || 5) * 60000) showLock();
  tick();
});

/* ================= install & offline ================= */
function setupPWA() {
  if (!ENV.http || ENV.framed || ENV.native) return;
  const link = (rel, href) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
  link('manifest', 'manifest.webmanifest');
  link('apple-touch-icon', 'icons/apple-touch-icon.png');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (UI.tab === 'ayarlar') render(); });
}

/* ================= boot ================= */
function boot() {
  load();
  const h = location.hash.slice(1);
  UI.tab = VIEWS[h] ? h : 'ozet';
  applyTheme();
  if (S.settings.pinHash) showLock();
  render();
  setupPWA();
  tick(); setInterval(tick, 30000);
  scheduleNotifications();
  if (ENV.native) {
    const LN = plug('LocalNotifications');
    if (LN && LN.addListener) LN.addListener('localNotificationActionPerformed', ev => { const id = ev && ev.notification && ev.notification.extra && ev.notification.extra.meetingId; if (id && findMeeting(id)) openSheet('meeting', { id }); });
  }
  const style = document.createElement('style'); style.textContent = DOC_CSS; document.head.appendChild(style);
  window.Finans360 = { version: VERSION, state: () => S, holidayOn, leaveDays, balance, bridgeIdeas };
}
boot();
})();
</script>
