<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell. Sticky top bar, one 880px content column, bottom tab bar
   that becomes a left rail at 960px+. Lists read like ledger pages: hairline rows, tabular figures. */
:root {
  --bg: #EDF1EF;
  --surface: #FFFFFF;
  --surface-2: #F5F8F7;
  --ink: #12212B;
  --ink-2: #33434E;
  --muted: #5B6972;
  --line: #D5DDDA;
  --track: #E2E9E6;
  --accent: #0B6B5D;
  --accent-mid: #6DB3A7;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFEA;
  --brass: #A1741A;
  --brass-soft: #F6ECD6;
  --ok: #1D7A45; --ok-soft: #DCF0E3;
  --warn: #935D00; --warn-soft: #FBEED3;
  --bad: #B3261E; --bad-soft: #F8DEDC;
  --info: #2C5AA0; --info-soft: #E1E9F6;
  --mute: #5F6C75; --mute-soft: #E7ECEE;
  --c-yillik: var(--accent); --c-mazeret: #2C5AA0; --c-saatlik: #A1741A; --c-rapor: #B3261E;
  --c-ucretsiz: #5F6C75; --c-dogum: #6B4FC8; --c-idari: #0E7490; --c-dgunu: #B23A6E;
  --c-ekip: var(--accent); --c-yonetim: #6B4FC8; --c-banka: #2C5AA0; --c-kapanis: #A1741A;
  --c-denetim: #B3261E; --c-birebir: #0E7490; --c-diger: #5F6C75;
  --logo-bg: #0B6B5D; --logo-ring: #EBC86E; --logo-f: #FFFFFF;
  --doc-bg: #FFFFFF; --doc-ink: #111111; --doc-line: #3A3A3A; --doc-fill: #F1F3F2;
  --scrim: rgb(10 20 24 / .45);
  --shadow-1: 0 1px 2px rgb(18 33 43 / .07);
  --shadow-2: 0 12px 32px rgb(18 33 43 / .16);
  --f-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 14px;
  --sat: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
  --sab: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  --top-offset: 0px;
  --top-pad: var(--sat);
  --tabbar-h: 66px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1315; --surface: #141E21; --surface-2: #1A262A; --ink: #E3ECE9; --ink-2: #C3D0CC;
    --muted: #8E9EA3; --line: #27363B; --track: #22302F;
    --accent: #3FBFA7; --accent-mid: #2A7F70; --accent-ink: #04211C; --accent-soft: #12352F;
    --brass: #DDAE52; --brass-soft: #33280F;
    --ok: #55C686; --ok-soft: #12301F; --warn: #E6AE45; --warn-soft: #33260A;
    --bad: #F2776C; --bad-soft: #3A1715; --info: #86AEF2; --info-soft: #172338; --mute: #9AA8AE; --mute-soft: #20292C;
    --c-mazeret: #86AEF2; --c-saatlik: #DDAE52; --c-rapor: #F2776C; --c-ucretsiz: #9AA8AE;
    --c-dogum: #A996F2; --c-idari: #5CC6DD; --c-dgunu: #F08AB7;
    --c-yonetim: #A996F2; --c-banka: #86AEF2; --c-kapanis: #DDAE52; --c-denetim: #F2776C; --c-birebir: #5CC6DD; --c-diger: #9AA8AE;
    --scrim: rgb(0 0 0 / .6); --shadow-1: 0 1px 2px rgb(0 0 0 / .4); --shadow-2: 0 14px 36px rgb(0 0 0 / .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1315; --surface: #141E21; --surface-2: #1A262A; --ink: #E3ECE9; --ink-2: #C3D0CC;
  --muted: #8E9EA3; --line: #27363B; --track: #22302F;
  --accent: #3FBFA7; --accent-mid: #2A7F70; --accent-ink: #04211C; --accent-soft: #12352F;
  --brass: #DDAE52; --brass-soft: #33280F;
  --ok: #55C686; --ok-soft: #12301F; --warn: #E6AE45; --warn-soft: #33260A;
  --bad: #F2776C; --bad-soft: #3A1715; --info: #86AEF2; --info-soft: #172338; --mute: #9AA8AE; --mute-soft: #20292C;
  --c-mazeret: #86AEF2; --c-saatlik: #DDAE52; --c-rapor: #F2776C; --c-ucretsiz: #9AA8AE;
  --c-dogum: #A996F2; --c-idari: #5CC6DD; --c-dgunu: #F08AB7;
  --c-yonetim: #A996F2; --c-banka: #86AEF2; --c-kapanis: #DDAE52; --c-denetim: #F2776C; --c-birebir: #5CC6DD; --c-diger: #9AA8AE;
  --scrim: rgb(0 0 0 / .6); --shadow-1: 0 1px 2px rgb(0 0 0 / .4); --shadow-2: 0 14px 36px rgb(0 0 0 / .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body.has-sheet { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { text-wrap: balance; }
.tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .93em; letter-spacing: -.01em; }
.display { font-family: var(--f-display); font-optical-sizing: auto; }
.muted { color: var(--muted); }
.neg { color: var(--bad); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; flex: none; }

/* ---- shell ---- */
.topbar { position: sticky; top: var(--top-offset); z-index: 20; padding-top: var(--top-pad); background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: saturate(1.3) blur(12px); backdrop-filter: saturate(1.3) blur(12px); }
.topbar-in { max-width: 912px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 20px/1 var(--f-display); letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
.brand b { color: var(--accent); font-weight: 800; }
.brand svg { width: 30px; height: 30px; }
.topbar-date { margin-left: auto; font-size: 13px; color: var(--muted); text-align: right; }
.view { max-width: 912px; margin: 0 auto; padding: 6px 16px calc(var(--tabbar-h) + var(--sab) + 104px); display: grid; gap: 26px; }
.view > * { min-width: 0; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 6px calc(6px + var(--sab)); background: var(--surface); border-top: 1px solid var(--line); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 54px; padding: 4px 0; border: 0; background: none; color: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: .01em; cursor: pointer; border-radius: 12px; }
.tab-ico { display: grid; place-items: center; width: 54px; height: 30px; border-radius: 999px; transition: background-color .2s; }
.tab .ic { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] .tab-ico { background: var(--accent-soft); color: var(--accent); }
@media (min-width: 960px) {
  .tabbar { top: 0; right: auto; width: 100px; grid-template-columns: 1fr; grid-auto-rows: min-content; align-content: start; gap: 8px; padding: calc(var(--sat) + 84px) 8px 16px; border-top: 0; border-right: 1px solid var(--line); }
  .app { padding-left: 100px; }
  .view { padding-bottom: 120px; }
}

/* ---- type ---- */
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.h1 { margin: 2px 0 0; font-size: clamp(28px, 7vw, 38px); line-height: 1.05; font-weight: 700; letter-spacing: -.025em; }
.lede { margin: 6px 0 0; font-size: 15px; color: var(--ink-2); max-width: 62ch; }
.sec { display: grid; gap: 10px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-title { margin: 0; font: 600 12.5px/1.3 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.sec-link { font-size: 13.5px; font-weight: 600; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 0; }
.fine { margin: 0; font-size: 12.5px; color: var(--muted); }
.hint { margin: 0; font-size: 12.5px; color: var(--muted); }

/* ---- surfaces ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card-title { margin: 0 0 12px; font: 700 17px/1.25 var(--f-display); letter-spacing: -.01em; }
.grid-2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }

.hero { position: relative; overflow: hidden; display: grid; gap: 8px; background: var(--accent); color: var(--accent-ink); border-color: transparent; padding: 18px 18px 16px; }
.hero .eyebrow { color: inherit; opacity: .82; }
.hero h2 { margin: 0; font: 700 23px/1.15 var(--f-display); letter-spacing: -.015em; max-width: 26ch; }
.hero p { margin: 0; }
.hero-ring { position: absolute; right: -46px; top: -46px; width: 190px; height: 190px; opacity: .16; pointer-events: none; }
.hero .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.btn-on { background: var(--accent-ink); color: var(--accent); border-color: transparent; }
.btn-on-ghost { background: transparent; color: var(--accent-ink); border-color: currentColor; }
.hero-empty { display: grid; gap: 10px; align-content: start; }
.hero-empty h2 { margin: 0; font: 700 20px/1.2 var(--f-display); }

.balance { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 18px; align-items: center; }
.ring-wrap { position: relative; width: 132px; height: 132px; }
.ring-wrap svg { width: 100%; height: 100%; display: block; }
.ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.05; }
.ring-center strong { font: 800 32px/1 var(--f-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ring-center span { font-size: 12px; color: var(--muted); margin-top: 3px; }
.kv { margin: 0; display: grid; gap: 7px; }
.kv > div { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.kv dt { color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.kv dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.balance .foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
@media (max-width: 380px) { .balance { grid-template-columns: 1fr; justify-items: center; } .balance .kv { width: 100%; } }

/* ---- ledger lists ---- */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 0; background: none; text-align: left; cursor: pointer; color: inherit; font: inherit; }
.row + .row { border-top: 1px solid var(--line); }
button.row:hover, .row .linkish:hover { background: var(--surface-2); }
.row-main { display: grid; gap: 2px; min-width: 0; }
.row-title { font-weight: 600; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
.row-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row-end { display: flex; align-items: center; gap: 6px; }
.linkish { border: 0; background: none; text-align: left; padding: 0; cursor: pointer; color: inherit; font: inherit; border-radius: 8px; }
.grp { margin: 6px 2px 0; font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.datetile { width: 48px; display: grid; justify-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.datetile span { width: 100%; text-align: center; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 0; color: var(--surface); background: var(--c); }
.datetile b { font: 700 19px/1.25 var(--f-display); padding: 2px 0 3px; font-variant-numeric: tabular-nums; }
.mtime { display: grid; justify-items: end; min-width: 50px; line-height: 1.2; }
.mtime b { font-weight: 600; font-size: 14.5px; }
.mtime span { font-size: 12.5px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }
.tag { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.tag-sample { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--brass); border: 1px solid currentColor; border-radius: 5px; padding: 0 5px; vertical-align: 2px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--mute-soft); color: var(--mute); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.live { background: var(--accent); color: var(--accent-ink); }
.flag { color: var(--warn); display: inline-flex; }
.flag .ic { width: 18px; height: 18px; }
.checkbtn { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--accent-ink); padding: 0; }
.checkbtn .ic { width: 16px; height: 16px; opacity: 0; }
.checkbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.checkbtn[aria-pressed="true"] .ic { opacity: 1; }
.done-text { text-decoration: line-through; color: var(--muted); }
.empty { padding: 22px 16px; display: grid; gap: 10px; justify-items: start; color: var(--ink-2); }
.empty p { margin: 0; }

/* ---- controls ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14.5px; cursor: pointer; text-decoration: none; text-align: center; line-height: 1.2; }
.btn .ic { width: 18px; height: 18px; }
.btn:hover { border-color: var(--muted); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { border-color: var(--accent); filter: brightness(1.06); }
.btn-quiet { background: transparent; border-color: transparent; color: var(--accent); padding: 0 8px; }
.btn-danger { color: var(--bad); }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 9px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 11px; border: 0; background: transparent; color: var(--ink); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.fab { position: fixed; right: 16px; bottom: calc(var(--tabbar-h) + var(--sab) + 16px); z-index: 25; display: inline-flex; align-items: center; gap: 8px; height: 54px; padding: 0 22px 0 18px; border-radius: 17px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 15px; box-shadow: var(--shadow-2); cursor: pointer; }
.fab .ic { width: 22px; height: 22px; }
@media (min-width: 960px) { .fab { bottom: 28px; right: 28px; } }
.act-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: 8px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--track); border-radius: 11px; max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 7px 13px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.seg-wide { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; }
.seg-wide button { padding: 8px 4px; font-size: 13px; }
.search { flex: 1 1 200px; display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--ink); padding: 8px 0; }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; display: inline-flex; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip > span, button.chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 500; cursor: pointer; color: var(--ink); line-height: 1.25; }
.chip input:checked + span, button.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 600; }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.namechip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 4px 4px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; }
.namechip button { width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.namechip .ic { width: 15px; height: 15px; }

.field { display: grid; gap: 6px; min-width: 0; border: 0; padding: 0; margin: 0; }
.field > label, .field > legend, .lbl { font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 0; margin-bottom: 0; }
.field > legend { margin-bottom: 6px; }
.field input:not([type="checkbox"]):not([type="radio"]), .field select, .field textarea, .inp { width: 100%; min-height: 44px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
.field textarea { min-height: 92px; resize: vertical; line-height: 1.45; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.row3 { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 400px) { .row3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .row3 > :first-child { grid-column: 1 / -1; } }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 0; }
.checks { display: grid; gap: 8px; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; }
.inline-form > input, .inline-form > select { flex: 1 1 160px; min-width: 0; }

/* ================= holidays & bridge days ================= */
function upcomingHolidays(n = 5, from = today()) {
  const out = []; let cur = null;
  for (let i = 0; i < 420 && out.length <= n; i++) {
    const d = addDays(from, i), h = holidayOn(d);

    else { cur = { group: h.group, start: d, end: d, days: [h] }; out.push(cur); }
  }
  return out.slice(0, n);
}
function bridgeIdeas(limit = 3) {
  const from = addDays(today(), 1), N = 400, days = [];
  for (let i = 0; i < N; i++) { const d = addDays(from, i); const [am, pm] = halves(d); days.push({ d, cost: (am ? 0.5 : 0) + (pm ? 0.5 : 0), hol: holidayOn(d) }); }
  const blocks = []; let b = null;
  days.forEach((x, i) => { if (x.cost === 0) { if (b && b.e === i - 1) b.e = i; else { b = { s: i, e: i }; blocks.push(b); } } });
  const gapCost = (s, e) => days.slice(s, e + 1).reduce((a, x) => a + x.cost, 0);
  const ideas = [];
  blocks.forEach((B, bi) => {
    const hol = days.slice(B.s, B.e + 1).find(x => x.hol && !x.hol.half);
    if (!hol) return;
    const L = [{ cost: 0, s: B.s, gap: null }], R = [{ cost: 0, e: B.e, gap: null }];
    const P = blocks[bi - 1], Nx = blocks[bi + 1];
    if (P) { const c = gapCost(P.e + 1, B.s - 1); if (c > 0 && c <= 3) L.push({ cost: c, s: P.s, gap: [P.e + 1, B.s - 1] }); }
    if (Nx) { const c = gapCost(B.e + 1, Nx.s - 1); if (c > 0 && c <= 3) R.push({ cost: c, e: Nx.e, gap: [B.e + 1, Nx.s - 1] }); }
    let best = null;
    for (const l of L) for (const r of R) {
      const cost = l.cost + r.cost; if (!cost || cost > 3) continue;
      const span = r.e - l.s + 1; if (span < 4 || span / cost < 3) continue;
      if (!best || span > best.span || (span === best.span && cost < best.cost)) best = { span, cost, s: l.s, e: r.e, ls: (l.gap || r.gap)[0], le: (r.gap || l.gap)[1] };
    }
    if (best) ideas.push({ ...best, name: hol.hol.group, start: days[best.s].d, end: days[best.e].d, leaveStart: days[best.ls].d, leaveEnd: days[best.le].d });
  });
  return ideas.slice(0, limit);
}

/* ================= notifications ================= */
const notified = new Set();
const scheduleNotifications = debounce(async () => {
  if (!ENV.native || !S.settings.notify) return;
  const LN = plug('LocalNotifications'); if (!LN) return;
  try {
    const pend = await LN.getPending();
    if (pend && pend.notifications && pend.notifications.length) await LN.cancel({ notifications: pend.notifications.map(n => ({ id: n.id })) });
    const now = Date.now(), list = [];
    for (const m of S.meetings) {
      if (m.status !== 'planned' || !m.reminder) continue;
      const at = mStart(m) - m.reminder * 60000;
      if (at > now && at < now + 60 * 864e5) list.push({ id: hashId(m.id), title: m.title, body: `${m.start}–${m.end}${m.location ? ' · ' + m.location : ''}`, schedule: { at: new Date(at), allowWhileIdle: true }, smallIcon: 'ic_stat_finans360', iconColor: '#0B6B5D', extra: { meetingId: m.id } });
    }
    for (const l of S.leaves) {
      if (l.person !== 'me' || l.status !== 'approved' || l.type === 'saatlik') continue;
      const at = atTime(addDays(l.start, -1), '17:00').getTime();
      if (at > now && at < now + 60 * 864e5) list.push({ id: hashId(l.id), title: 'Yarın izinlisiniz', body: `${LEAVE_TYPES[l.type].label} · ${rangeText(l)}${l.deputy ? ' · Vekil: ' + l.deputy : ''}`, schedule: { at: new Date(at), allowWhileIdle: true }, smallIcon: 'ic_stat_finans360', iconColor: '#0B6B5D' });
    }
    list.sort((a, b) => a.schedule.at - b.schedule.at);
    if (list.length) await LN.schedule({ notifications: list.slice(0, 60) });
  } catch (e) { console.warn('Bildirim planlanamadı', e); }
}, 600);
async function enableNotifications() {
  if (ENV.native) {
    const LN = plug('LocalNotifications');
    if (!LN) { toast('Bildirim eklentisi bulunamadı.'); return; }
    try {
      const r = await LN.requestPermissions();
      if (r.display === 'granted') { S.settings.notify = true; persist(); toast('Toplantı hatırlatmaları açıldı'); }
      else toast('Bildirim izni verilmedi. Telefon ayarlarından Finans360 için bildirimleri açın.', null, 6000);
    } catch (e) { toast('Bildirim izni alınamadı.'); }
  } else if ('Notification' in window && !ENV.framed) {
    const r = await Notification.requestPermission();
    S.settings.notify = r === 'granted'; persist();
    toast(r === 'granted' ? 'Uygulama açıkken bildirim gösterilecek' : 'Tarayıcı bildirim iznini reddetti');
  } else {
    S.settings.notify = true; persist();
    toast('Hatırlatmalar sayfa açıkken uygulama içinde gösterilecek');
  }
  render();
}
function tick() {
  const now = Date.now();
  if (tick.day !== today()) { const first = !tick.day; tick.day = today(); if (!first) render(); }
  for (const m of S.meetings) {
    if (m.status !== 'planned' || !m.reminder) continue;
    const st = mStart(m), key = `${m.id}@${m.date}${m.start}`;
    if (now >= st - m.reminder * 60000 && now < st && !notified.has(key)) {
      notified.add(key);
      toast(`${m.title}: ${Math.max(1, Math.round((st - now) / 60000))} dk sonra`, { label: 'Aç', run: () => openSheet('meeting', { id: m.id }) }, 9000);
      if (!ENV.native && !ENV.framed && S.settings.notify && 'Notification' in window && Notification.permission === 'granted' && document.visibilityState !== 'visible') {
        try { new Notification(m.title, { body: `${m.start}–${m.end} ${m.location || ''}`, tag: key }); } catch (e) { /* ignore */ }
      }
    }
  }
  $$('[data-countdown]').forEach(el => { const m = S.meetings.find(x => x.id === el.dataset.countdown); if (m) el.textContent = countdown(m); });
}

const toastActs = {};
function toast(msg, action, ms = 3800) {
  const root = $('#toastRoot'); if (!root) return;
  const id = uid();
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button" data-act="toast-act" data-id="${id}">${esc(action.label)}</button>` : ''}`;
  if (action) toastActs[id] = action.run;
  root.appendChild(el);
  while (root.children.length > 3) root.firstChild.remove();
  setTimeout(() => { el.remove(); delete toastActs[id]; }, ms);
}

function ringSVG(b) {
  const r = 50, c = 2 * Math.PI * r, total = Math.max(b.total, b.used + b.planned + b.pending, 1);
  let off = 0, arcs = '';
  for (const [v, col] of [[b.used, 'var(--accent)'], [b.planned, 'var(--accent-mid)'], [b.pending, 'var(--brass)']]) {
    if (v <= 0) continue;
    const len = (v / total) * c;
    arcs += `<circle r="${r}" cx="60" cy="60" fill="none" stroke="${col}" stroke-width="12" stroke-dasharray="${len.toFixed(2)} ${(c - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`;
    off += len;
  }
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle r="${r}" cx="60" cy="60" fill="none" stroke="var(--track)" stroke-width="12"/>${arcs}</svg>`;
}

function viewCalendar() {
  const [y, mo] = UI.calMonth.split('-').map(Number);
  const first = `${y}-${pad(mo)}-01`;
  const offset = (parseD(first).getDay() + 6) % 7;
  const gridStart = addDays(first, -offset);
  const dim = new Date(y, mo, 0).getDate();
  const weeks = Math.ceil((offset + dim) / 7);
  const t = today();
  const leaves = S.leaves.filter(activeLeave);
  let cells = '', mCount = 0, lDays = 0, hCount = 0;
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(gridStart, i), out = d.slice(0, 7) !== UI.calMonth;
    const h = holidayOn(d), we = isWeekend(d);
    const dl = leaves.filter(l => covers(l, d)), dm = S.meetings.filter(m => m.date === d && m.status !== 'cancelled');
    if (!out) { mCount += dm.length; if (dl.some(l => l.person === 'me')) lDays++; if (h && !h.half) hCount++; }
    const cls = ['cal-cell', out && 'out', we && 'we', h && (h.half ? 'half' : 'hol'), d === t && 'today'].filter(Boolean).join(' ');
    const label = `${fmt.longDay(d)}${h ? ', ' + h.name : ''}${dm.length ? `, ${dm.length} toplantı` : ''}${dl.length ? `, ${dl.length} izin` : ''}`;

  }

    <div class="cal-wd" aria-hidden="true">${['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'].map(x => `<span>${x}</span>`).join('')}</div>

    <div class="legend"><span><i class="lg" style="background:var(--c-yillik)"></i>Sizin izniniz</span><span><i class="lg" style="background:repeating-linear-gradient(135deg,var(--c-mazeret) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--c-mazeret)"></i>Ekip izni</span><span><i class="lg" style="background:var(--brass-soft);box-shadow:inset 0 0 0 1px var(--brass)"></i>Resmî tatil</span><span><span class="cal-mc" style="position:static">2</span>Toplantı</span></div>

/* ================= sheets (bottom sheets / dialogs) ================= */
const sheets = [];
let histOK = true, popThen = null;
const sheetHead = (title, right = '') => `<header class="sheet-head"><button type="button" class="icon-btn" data-act="sheet-close" aria-label="Kapat">${I.x}</button><h2>${esc(title)}</h2>${right}</header>`;
function openSheet(kind, data) {
  const s = { id: uid(), kind, data: data || {} };
  sheets.push(s);
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap'; wrap.dataset.sid = s.id;
  wrap.innerHTML = `<div class="scrim" data-act="sheet-close"></div><div class="sheet ${SHEETS[kind].cls || ''}" role="dialog" aria-modal="true" tabindex="-1"></div>`;
  $('#sheetRoot').appendChild(wrap);
  s.el = wrap;
  fillSheet(s);
  document.body.classList.add('has-sheet');
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
  const f = wrap.querySelector('[autofocus]') || wrap.querySelector('.sheet');
  setTimeout(() => { try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 30);
  if (histOK) { try { history.pushState({ f360: sheets.length }, ''); } catch (e) { histOK = false; } }
  return s;
}
function fillSheet(s) {
  const def = SHEETS[s.kind], box = s.el.querySelector('.sheet');
  box.className = `sheet ${def.cls || ''}`;
  box.setAttribute('aria-label', def.label(s));
  box.innerHTML = def.render(s);
  if (def.mount) def.mount(s);
}
function refreshSheet(s) {
  if (!s || !s.el || SHEETS[s.kind].static) return;
  const body = s.el.querySelector('.sheet-body'), top = body ? body.scrollTop : 0;
  fillSheet(s);
  const nb = s.el.querySelector('.sheet-body'); if (nb) nb.scrollTop = top;
}
function swapSheet(s, kind, data) { s.kind = kind; s.data = data; fillSheet(s); }
function unmountTop() {
  const s = sheets.pop(); if (!s) return;
  s.el.remove();
  if (!sheets.length) document.body.classList.remove('has-sheet');
}
function closeTo(n, then) {
  if (sheets.length <= n) { if (then) then(); return; }
  if (histOK && history.state && history.state.f360 === sheets.length) { popThen = then || null; history.go(-(sheets.length - n)); }
  else { while (sheets.length > n) unmountTop(); if (then) then(); }
}
const sheetIndex = el => { const w = el.closest('.sheet-wrap'); return w ? sheets.findIndex(s => s.id === w.dataset.sid) : -1; };
const sheetOf = el => sheets[sheetIndex(el)];
window.addEventListener('popstate', e => {
  const depth = (e.state && e.state.f360) || 0;
  while (sheets.length > depth) unmountTop();
  const t = popThen; popThen = null; if (t) t();
});
function confirmSheet(o) { openSheet('confirm', o); }

function bindInput(t) {

  if (grp === 'profile') S.profileSample = false;
  persistSoon();
  const es = $('#entSummary span'); if (es) es.textContent = `${basisText(balance())}. Kanuni süreler (İş K. md. 53): 1–5 yıl 14 gün, 5–15 yıl 20 gün, 15 yıl ve üzeri 26 gün; 18 yaş ve altı ile 50 yaş ve üstü için en az 20 gün.`;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheets.length) { e.preventDefault(); closeTo(sheets.length - 1); } });
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (VIEWS[t] && t !== UI.tab) { UI.tab = t; render(); } });
if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) { /* old engines */ } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tick(); });

/* ================= install & offline ================= */
function setupPWA() {
  if (!ENV.http || ENV.framed || ENV.native) return;
  const link = (rel, href) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
  link('manifest', 'manifest.webmanifest');
  link('apple-touch-icon', 'icons/apple-touch-icon.png');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (UI.tab === 'ayarlar') render(); });
}

/* ================= boot ================= */
function boot() {
  load();
  const h = location.hash.slice(1);
  UI.tab = VIEWS[h] ? h : 'ozet';
  applyTheme();
  render();
  setupPWA();
  tick(); setInterval(tick, 30000);
  scheduleNotifications();
  if (ENV.native) {
    const LN = plug('LocalNotifications');
    if (LN && LN.addListener) LN.addListener('localNotificationActionPerformed', ev => { const id = ev && ev.notification && ev.notification.extra && ev.notification.extra.meetingId; if (id && findMeeting(id)) openSheet('meeting', { id }); });
  }
  const style = document.createElement('style'); style.textContent = DOC_CSS; document.head.appendChild(style);
  window.Finans360 = { version: VERSION, state: () => S, holidayOn, leaveDays, balance, bridgeIdeas };
}
boot();
})();
</script>
