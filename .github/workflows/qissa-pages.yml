name: Qissa Pages

# On demand: publish the hosted copy of the reader (the split page + data files, the PWA shell, the privacy page) to
# GitHub Pages — a stable public URL for the web app and for the privacy policy the Play listing needs.
# Owner's one-time step: Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch to publish the app from (the github-pages environment deploys from the default branch only)'
        default: 'claude/arabic-app-research-ozd58s'
      app_voice:
        description: "(v349) render the app's own voice (eSpeak NG, robotic) into the site — 'true' ships it; OFF until the owner has heard the samples and said yes"
        default: 'false'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'claude/arabic-app-research-ozd58s' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build the hosted copy
        env:
          PYTHONUTF8: '1'
        run: |
          cd arabic-app
          python tools/pubsplit.py prototype/reader.html ../site
          cp prototype/manifest.webmanifest prototype/sw.js prototype/privacy.html ../site/
          cp -r prototype/icons ../site/icons
          # (v349) recorded narration (narration/<story>/audio/): plain files beside the page, fetched only on a story's first listen
          if [ -d prototype/narration ]; then cp -r prototype/narration ../site/narration; fi
          # the front door is the entrance page (it warms the offline cache); without it, the app itself
          if [ -f prototype/welcome.html ]; then cp prototype/welcome.html ../site/index.html; else cp ../site/reader.html ../site/index.html; fi
          ls -la ../site ../site/data
      # (v349) the app's own voice: rendered HERE, at deploy time — a build product, never in git (tools/voice_app.py: the app's
      # reading of every vowel spoken by eSpeak NG, run as a tool; only the AAC audio reaches the site). Cached between runs on a
      # hash of every sent text + the tool + the pinned eSpeak; within a restored cache an unchanged chapter is not re-rendered.
      - uses: actions/setup-node@v4
        if: ${{ inputs.app_voice == 'true' }}
        with:
          node-version: '22'
      - name: The app voice's cache key
        if: ${{ inputs.app_voice == 'true' }}
        id: vkey
        run: cd arabic-app && echo "key=$(python tools/voice_app.py --key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: ${{ inputs.app_voice == 'true' }}
        with:
          path: voice-cache
          key: app-voice-${{ steps.vkey.outputs.key }}
          restore-keys: app-voice-
      - name: Render the app's own voice into the site
        if: ${{ inputs.app_voice == 'true' }}
        env:
          PYTHONUTF8: '1'
        run: |
          ffmpeg -version | head -1
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -qE '^ A[.A-Z]+ aac ' || { echo "::error::ffmpeg has no AAC encoder — the app voice cannot be written"; exit 1; }
          cd arabic-app
          npm ci --ignore-scripts
          time python tools/voice_app.py --out ../voice-cache
          python tools/voice_app.py --verify --out ../voice-cache
          mkdir -p ../site/narration && cp -r ../voice-cache/. ../site/narration/
          du -sh ../site/narration
      - name: No generated voice on the site (app_voice is not 'true')
        if: ${{ inputs.app_voice != 'true' }}
        run: rm -rf site/narration/*/app site/narration/app-voice.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
