name: Qissa Pages

# On demand: publish the hosted copy of the reader (the split page + data files, the PWA shell, the privacy page) to
# GitHub Pages — a stable public URL for the web app and for the privacy policy the Play listing needs.
# Owner's one-time step: Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch to publish the app from (the github-pages environment deploys from the default branch only)'
        default: 'claude/arabic-app-research-ozd58s'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'claude/arabic-app-research-ozd58s' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build the hosted copy
        env:
          PYTHONUTF8: '1'
        run: |
          cd arabic-app
          python tools/pubsplit.py prototype/reader.html ../site
          cp prototype/manifest.webmanifest prototype/sw.js prototype/privacy.html ../site/
          cp -r prototype/icons ../site/icons
          # the front door is the entrance page (it warms the offline cache); without it, the app itself
          if [ -f prototype/welcome.html ]; then cp prototype/welcome.html ../site/index.html; else cp ../site/reader.html ../site/index.html; fi
          ls -la ../site ../site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
