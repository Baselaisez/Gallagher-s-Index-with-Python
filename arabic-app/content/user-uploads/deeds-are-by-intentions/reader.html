fine are religion and this world together, how ugly unbelief and destitution in a man. Four against four in Surat al-Layl: «فَأَمَّا مَنْ أَعْطَى وَاتَّقَى وَصَدَّقَ بِالْحُسْنَىٰ فَسَنُيَسِّرُهُ لِلْيُسْرَىٰ · وَأَمَّا مَنْ بَخِلَ وَاسْتَغْنَىٰ وَكَذَّبَ بِالْحُسْنَىٰ فَسَنُيَسِّرُهُ لِلْعُسْرَىٰ». Sakkaki drew the lesson out: when one side is made the condition of a thing, the other side's contraries are made the condition of that thing's contrary — giving, fearing and affirming share ease; withholding, self-sufficiency and denial share hardship. The order is not decoration. If the counterparts arrive out of sequence, or if one of them is missing, what remains is a heap of opposites, not a muqabala. This is why the figure is at home in law and creed, where a ruling and its converse have to be stated together.","tr":"Mukâbele, tıbâkın büyütülmüş ve sıraya konulmuş hâlidir: birbirine muvâfık iki veya daha çok mana zikredilir, sonra her birinin mukâbili aynı sıra üzere getirilir. İkiye iki: «فَلْيَضْحَكُوا قَلِيلًا وَلْيَبْكُوا كَثِيرًا» — gülmenin karşısında ağlamak, azın karşısında çok. Üçe üç, Ebû Dülâme'nin beytinde: bir insanda din ile dünyanın birleşmesi ne güzel, küfür ile iflâsın birleşmesi ne çirkindir. Dörde dört, Leyl sûresinde: «فَأَمَّا مَنْ أَعْطَى وَاتَّقَى وَصَدَّقَ بِالْحُسْنَىٰ فَسَنُيَسِّرُهُ لِلْيُسْرَىٰ · وَأَمَّا مَنْ بَخِلَ وَاسْتَغْنَىٰ وَكَذَّبَ بِالْحُسْنَىٰ فَسَنُيَسِّرُهُ لِلْعُسْرَىٰ». İmam Sekkâkî bundan şu neticeyi çıkarır: bir taraf bir şeye şart kılınınca, öbür tarafın zıtları da o şeyin zıddına şart kılınır — i'tâ, ittikâ ve tasdîk teysîrde ortaktır; buhl, istiğnâ ve tekzîb ta'sîrde ortaktır. Sıra tezyînat değildir. Mukâbiller sırasız gelir yahut biri eksik kalırsa geriye mukâbele değil, dağınık bir zıtlar yığını kalır. Bu sebeple bu sanat, bir hükmün ve aksinin birlikte söylenmesi gereken fıkıh ve akâid metinlerinde çokça bulunur."},"plain":{"en":"Setting out several things, then answering each of them with its opposite, in the same order.","tr":"Birkaç şeyi sıralayıp sonra her birinin karşılığını aynı sırayla getirmek."},"sources":["تلخيص المفتاح (القزويني) — علم البديع، المحسنات المعنوية","مختصر السعد"],"examples":[{"ar":"الْبَيِّنَةُ لِلْمُدَّعِي وَالْيَمِينُ عَلَى مَنْ أَنْكَرَ.","gloss":{"en":"Two against two, and the order holds: proof belongs to the claimant, oath falls on the denier. Even the two prepositions are counterparts — لِـ for what is in your favour, عَلَى for what is against you.","tr":"İkiye iki, sıra da korunmuş: beyyine müddeîye, yemin münkire. İki harf bile mukâbildir — lehte olan için لِـ, aleyhte olan için عَلَى."},"src":"aqaid-ahl-al-sunna"},{"ar":"مَنْ أَطَاعَنِي دَخَلَ الْجَنَّةَ وَمَنْ عَصَانِي فَقَدْ أَبَى.","gloss":{"en":"Obeying against disobeying, entering the Garden against refusing it — the second half answers the first term for term.","tr":"İtaatin karşısında isyan, cennete girmenin karşısında imtinâ — ikinci yarı, birincisini kelime kelime karşılar."},"src":"min-muqaddimat-al-maqsud"},{"ar":"فَلْيَضْحَكُوا قَلِيلًا وَلْيَبْكُوا كَثِيرًا.","gloss":{"en":"The Talkhis's own example of two against two (al-Tawba 82).","tr":"Telhîs'in ikiye iki için verdiği misal (Tevbe 82)."},"src":null}],"mistakes":[{"wrong":"«وَكُنْ لِلَّهِ فِي سِرِّكَ كَمَا أَنْتَ لَهُ فِي عَلَانِيَتِكَ» مُقَابَلَةٌ","right":"طِبَاقٌ، لِأَنَّ الْمُقَابَلَ لَفْظٌ وَاحِدٌ بِلَفْظٍ وَاحِدٍ","why":{"en":"Only one pair of opposites is in play, سِرّ and عَلَانِيَة. Muqabala needs at least two meanings on each side.","tr":"Ortada tek bir zıt çift vardır: سِرّ ve عَلَانِيَة. Mukâbele için her tarafta en az iki mana bulunmalıdır."}},{"wrong":"«أَعْطَى وَاتَّقَى وَصَدَّقَ ... بَخِلَ وَاسْتَغْنَىٰ وَكَذَّبَ» طِبَاقٌ","right":"مُقَابَلَةٌ بَيْنَ ثَلَاثَةٍ وَثَلَاثَةٍ","why":{"en":"Each of the three has its own counterpart and they arrive in the same order. Calling it tibaq loses the very thing the verse is doing.","tr":"Üçün her birinin kendi mukâbili vardır ve hepsi aynı sıra üzere gelir. Buna tıbâk demek, âyetin yaptığı şeyi kaçırmaktır."}},{"wrong":"يَكْفِي فِي الْمُقَابَلَةِ اجْتِمَاعُ الْأَضْدَادِ وَإِنِ اخْتَلَّ التَّرْتِيبُ","right":"لَا بُدَّ مِنْ مَجِيءِ الْمُقَابِلَاتِ عَلَى تَرْتِيبِ الْأُوَلِ","why":{"en":"The definition says «then the counterpart of each is brought on the order». Shuffle them and the correspondence the hearer is meant to feel is gone.","tr":"Tarif «sonra her birinin mukâbili tertip üzere getirilir» der. Sıra bozulursa dinleyicinin hissetmesi istenen tekâbül kalmaz."}}]},"muraat-al-nazir":{"title":{"ar":"مُرَاعَاةُ النَّظِير (التَّنَاسُب)","en":"Mura'at al-nazir — gathering things that belong together","tr":"Mürâât-ı nazîr (tenâsüb) — birbirine münasip şeyleri bir arada anmak"},"level":5,"group":"balagha","explanation":{"en":"The mirror image of tibaq. There you joined a thing to its opposite; here you join it to its congener — «وَالشَّمْسُ وَالْقَمَرُ بِحُسْبَانٍ», sun kept company by moon. It is also called التَّنَاسُب and التَّوْفِيق. Al-Buhturi's line piles up a whole family at once: the camels are like bent bows, no — like planed arrows, no — like bowstrings; bow, arrow and string all belong to one world, and the ear is satisfied before the sense is. One recognised branch is تَشَابُهُ الأَطْرَافِ, where a passage is ended with something congenial to how it began: «لَا تُدْرِكُهُ الْأَبْصَارُ وَهُوَ يُدْرِكُ الْأَبْصَارَ وَهُوَ اللَّطِيفُ الْخَبِيرُ» — اللَّطِيف, who knows the fine and the hidden, answers the first clause; الْخَبِير, who knows things as they appear, answers the second. And there is a shadow kind, إِيهَامُ التَّنَاسُبِ, where the congeniality holds only through a meaning that is not the one intended: النَّجْم beside الشَّجَر means a stemless plant, but النَّجْم beside الشَّمْس and الْقَمَر sounds like a star. Practically: when you are naming several things in a definition or a description, the tradition asks you to draw them from one field. That is why creed texts list الْحَوَاسّ, الْخَبَر, الْعَقْل together and not knowledge alongside, say, wealth.","tr":"Tıbâkın aynadaki aksi. Orada bir şey zıddıyla birleştiriliyordu; burada nazîriyle birleştirilir — «وَالشَّمْسُ وَالْقَمَرُ بِحُسْبَانٍ»: güneşin yanında ay. Buna tenâsüb ve tevfîk de denir. Buhtürî'nin beyti bütün bir aileyi bir arada anar: develer eğilmiş yaylar gibi, hayır yontulmuş oklar gibi, hayır kirişler gibi; yay, ok ve kiriş tek bir âleme aittir, mana tamamlanmadan kulak razı olur. Bilinen bir dalı teşâbühü'l-etrâftır: sözün, başlangıcına münasip bir şeyle bitirilmesi — «لَا تُدْرِكُهُ الْأَبْصَارُ وَهُوَ يُدْرِكُ الْأَبْصَارَ وَهُوَ اللَّطِيفُ الْخَبِيرُ»: işlerin inceliğini bilen اللَّطِيف birinci cümleye, eşyanın zâhirini bilen الْخَبِير ikinci cümleye münasiptir. Bir de gölge kısmı vardır, îhâmü't-tenâsüb: münasebet ancak murad edilmeyen bir mana yoluyla kurulur — النَّجْم, الشَّجَر yanında gövdesiz bitki demektir, fakat الشَّمْس ve الْقَمَر yanında yıldız gibi işitilir. Amelî neticesi: bir tarifte yahut tavsifte birkaç şey sayarken gelenek onları tek bir sahadan seçmeni ister. Akâid metinlerinin الْحَوَاسّ, الْخَبَر ve الْعَقْل'ı birlikte sayıp yanına meselâ malı koymamasının sebebi budur."},"plain":{"en":"Gathering things that belong to one world: sun with moon, tree with fruit.","tr":"Aynı âleme ait şeyleri bir arada anmak: ay ile güneş, ağaç ile meyve."},"sources":["تلخيص المفتاح (القزويني) — علم البديع، المحسنات المعنوية","مختصر السعد"],"examples":[{"ar":"وَمَاؤُهُ أَبْيَضُ مِنَ اللَّبَنِ وَرِيحُهُ أَطْيَبُ مِنَ الْمِسْكِ.","gloss":{"en":"Water is measured against milk and scent against musk — each comparison drawn from the field its own subject belongs to. Swap them and the tanasub collapses.","tr":"Su süte, koku miske kıyaslanır — her mukayese, kendi mevzuunun ait olduğu sahadan seçilmiştir. Yer değiştirseler tenâsüb bozulur."},"src":"aqaid-ahl-al-sunna"},{"ar":"وَأَسْبَابُ الْعِلْمِ لِلْخَلْقِ ثَلَاثَةٌ: الْحَوَاسُّ السَّلِيمَةُ وَالْخَبَرُ الصَّادِقُ وَالْعَقْلُ.","gloss":{"en":"Three sources of knowledge named together: sense, report, intellect. They are congeners, not opposites — this is the ordinary shape of a definition in the creed books.","tr":"İlmin üç sebebi bir arada anılır: havâss, haber, akıl. Bunlar zıt değil nazîrdir — akâid kitaplarında tarifin âdet üzere aldığı şekil budur."},"src":"aqaid-ahl-al-sunna"},{"ar":"إِنَّ الْعِلْمَ بِلَا عَمَلٍ كَشَجَرٍ بِلَا ثَمَرٍ.","gloss":{"en":"Tree and fruit inside a tashbih: the second term is congenial to the first, which is what makes the image land.","tr":"Bir teşbih içinde ağaç ve meyve: ikinci lafız birincinin nazîridir; tasvirin tutmasını sağlayan da budur."},"src":"wasiyyat-abi-hanifa-L4"},{"ar":"لَا تُدْرِكُهُ الْأَبْصَارُ وَهُوَ يُدْرِكُ الْأَبْصَارَ وَهُوَ اللَّطِيفُ الْخَبِيرُ.","gloss":{"en":"The Talkhis's example of تَشَابُهُ الأَطْرَافِ (al-An'am 103).","tr":"Telhîs'in teşâbühü'l-etrâf için verdiği misal (En'âm 103)."},"src":null}],"mistakes":[{"wrong":"«وَالشَّمْسُ وَالْقَمَرُ» طِبَاقٌ","right":"مُرَاعَاةُ النَّظِيرِ، لِأَنَّهُمَا مُتَنَاسِبَانِ لَا مُتَضَادَّانِ","why":{"en":"Sun and moon are of one field, not two poles. Day against night would be tibaq; sun beside moon is tanasub.","tr":"Güneş ve ay tek bir sahadandır, iki kutup değildir. Gece karşısında gündüz tıbâk olurdu; ayın yanındaki güneş tenâsübdür."}},{"wrong":"كُلُّ لَفْظَيْنِ اجْتَمَعَا فِي جُمْلَةٍ فَبَيْنَهُمَا مُرَاعَاةُ النَّظِيرِ","right":"لَا بُدَّ مِنْ مُنَاسَبَةٍ فِي الْمَعْنَى بَيْنَ الْمُجْتَمِعَيْنِ","why":{"en":"Being in the same sentence is not congeniality. The two have to belong to one kind or one field before the figure is present at all.","tr":"Aynı cümlede bulunmak münasebet değildir. Sanatın var sayılması için iki lafzın tek bir nev'e yahut tek bir sahaya ait olması gerekir."}}]},"naat-sifa":{"title":{"ar":"النَّعْت (الصِّفَة)","en":"The na't (adjective)","tr":"Na't (sıfat)"},"level":3,"group":"nahw","explanation":{"en":"The na't (also called sifa) is the first of the followers (التوابع): it follows its noun (المنعوت) in FOUR things — case, definiteness, gender, and number. In this story: عَزِيزًا مُحْتَرَمًا — «honored» follows «dear» in nasb and indefiniteness. Contrast with the hal: a definite word after a definite noun is a na't (الرَّجُلُ الْكَرِيمُ, the generous man); an indefinite mansub after a definite noun is a hal. Birgivi lists the followers at the end of the Awamil as governed «by way of following» (بالتبعية).","tr":"Na't (sıfat) tâbilerin ilkidir: mevsûfuna (men'ût) DÖRT şeyde uyar — i'rab, marifelik-nekrelik, müzekkerlik-müenneslik ve sayı. Hikâyede: عَزِيزًا مُحْتَرَمًا — «saygın», «aziz» kelimesine nasbda ve nekrelikte uyar. Hâl ile farkı: marife isimden sonra marife kelime sıfattır (الرَّجُلُ الْكَرِيمُ); marife isimden sonra nekre mansub ise hâldir. Birgivî, Avâmil'in sonunda tâbileri «tebe'iyyet yoluyla» âmillenmiş sayar."},"plain":{"en":"An adjective. It copies its noun in case, number, gender and definiteness.","tr":"Sıfat. Nitelediği ismi i'rabda, sayıda, cinste ve belirlilikte takip eder."},"mamul":"tabai","sources":["العوامل (البيركوي) — التوابع","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"examples":[{"ar":"صِرْتَ فِيهِمْ عَزِيزًا مُحْتَرَمًا.","gloss":{"en":"You become dear and honored among them — the na't follows its noun in nasb.","tr":"Aralarında aziz ve saygın olursun — na't, mevsûfuna nasbda uyar."},"src":"wasiyyat-abi-hanifa-L4"},{"ar":"الرَّجُلُ الْكَرِيمُ مَحْبُوبٌ.","gloss":{"en":"The generous man is beloved — definite noun, definite na't.","tr":"Cömert adam sevilir — marife isim, marife na't."},"src":null},{"ar":"قَرَأْتُ كِتَابًا مُفِيدًا.","gloss":{"en":"I read a useful book — indefinite noun, indefinite na't.","tr":"Faydalı bir kitap okudum — nekre isim, nekre na't."},"src":null}],"mistakes":[{"wrong":"قرأتُ كتابًا مفيدٌ","right":"قرأتُ كتابًا مفيدًا","why":{"en":"The na't must match its noun's case — after a mansub noun the adjective takes nasb too.","tr":"Sıfat, mevsûfun i'rabına uymalıdır — mansub isimden sonra sıfat da nasb alır."}},{"wrong":"الرجلُ كريمُ (نعتًا)","right":"الرجلُ الْكَرِيمُ","why":{"en":"A na't of a definite noun must itself be definite; without ال the sentence turns into mubtada + khabar («the man is generous»).","tr":"Marife ismin sıfatı da marife olmalıdır; ال düşerse cümle mübteda-haber olur («adam cömerttir»)."}},{"wrong":"طالبةٌ مجتهدٌ","right":"طالبةٌ مجتهدةٌ","why":{"en":"The na't follows in gender as well — feminine noun takes a feminine adjective.","tr":"Sıfat cinsiyette de uyar — müennes isme müennes sıfat gelir."}}]},"naib-al-fail":{"title":{"ar":"نَائِبُ الْفَاعِل (الْمَبْنِيُّ لِلْمَجْهُول)","en":"The naib al-fail (passive and its deputy subject)","tr":"Nâib-i fâil (meçhul sîga)"},"level":4,"group":"nahw","explanation":{"en":"When the doer is not named, Arabic rebuilds the verb rather than adding a word for «by». The verb is put into the majhul pattern and the former direct object steps up into the doer's place, in RAF', as the نَائِبُ الْفَاعِل — the deputy subject. The vowelling is fixed: in the past, damma on the first letter and kasra on the letter before the last (سَأَلَ ← سُئِلَ, كَتَبَ ← كُتِبَ); in the present, damma on the prefix and fatha before the last (يَسْأَلُ ← يُسْأَلُ, يَكْتُبُ ← يُكْتَبُ). Hollow verbs shift to kasra instead: قَالَ ← قِيلَ, يَقُولُ ← يُقَالُ. Birgivi counts the naib al-fail second among the nine marfu'at, immediately after the fa'il, because it occupies the same position.","tr":"Fâil zikredilmediğinde Arapça, «tarafından» diye bir kelime eklemek yerine fiili yeniden kurar. Fiil meçhul kalıbına sokulur ve önceki mef'ûlün bih, fâilin yerine geçerek REF hâlini alır: NÂİB-İ FÂİL. Harekeleme sabittir: mazide ilk harf ötreli, son harften önceki kesreli olur (سَأَلَ ← سُئِلَ, كَتَبَ ← كُتِبَ); muzaride önek ötreli, son harften önceki fethalı olur (يَسْأَلُ ← يُسْأَلُ, يَكْتُبُ ← يُكْتَبُ). Ecvef fiiller kesreye döner: قَالَ ← قِيلَ, يَقُولُ ← يُقَالُ. Birgivî, nâib-i fâili dokuz merfûâtın ikincisi sayar, hemen fâilden sonra; çünkü onun yerini tutar."},"plain":{"en":"When nobody is named as doing it, the thing acted on moves into the doer's place.","tr":"Yapan anılmadığında, kendisine iş yapılan şey fâilin yerine geçer."},"mamul":"marfu","sources":["العوامل (البيركوي) — المرفوعات","إظهار الأسرار (البيركوي)","الفوائد الضيائية (ملا جامي)","الكافية (ابن الحاجب)"],"question":{"tr":["Ne?","Kim?"],"en":["What?","Who?"]},"examples":[{"ar":"وَلَا تَتَكَلَّمْ بَيْنَ يَدَيِ الْعَامَّةِ إِلَّا بِمَا تُسْأَلُ عَنْهُ.","gloss":{"en":"Do not speak before the common people except about what you are asked — تُسْأَلُ is majhul; its deputy subject is the hidden «you».","tr":"Avamın huzurunda ancak sorulan şey hakkında konuş — تُسْأَلُ meçhuldür, nâib-i fâili gizli «sen» zamiridir."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"كُتِبَ الدَّرْسُ.","gloss":{"en":"The lesson was written — the former object الدَّرْسَ now stands in raf' as naib al-fail.","tr":"Ders yazıldı — eskiden mef'ûl olan الدَّرْسَ şimdi nâib-i fâil olarak ref hâlindedir."},"src":null},{"ar":"قِيلَ لَهُ.","gloss":{"en":"It was said to him — a hollow verb takes kasra in the passive, not damma.","tr":"Ona denildi — ecvef fiil meçhulde damme değil kesre alır."},"src":null}],"mistakes":[{"wrong":"كُتِبَ الدَّرْسَ","right":"كُتِبَ الدَّرْسُ","why":{"en":"Once the verb is passive its object BECOMES the deputy subject and must take raf'. Leaving it in nasb is the commonest passive error.","tr":"Fiil meçhul olunca mef'ûl, nâib-i fâile DÖNÜŞÜR ve ref alır. Onu mansub bırakmak en sık yapılan meçhul hatasıdır."}},{"wrong":"كُتِبَ الدَّرْسُ مِنْ قِبَلِ الطَّالِبِ (في الفصيح)","right":"كَتَبَ الطَّالِبُ الدَّرْسَ","why":{"en":"Classical Arabic does not name the doer of a passive verb — that is the whole point of «majhul» (unknown). If the doer matters, use the active. The «مِنْ قِبَلِ» construction is a modern calque.","tr":"Klasik Arapçada meçhul fiilin fâili zikredilmez — «meçhul» (bilinmeyen) denmesinin sebebi budur. Fâil önemliyse malum sîga kullanılır. «مِنْ قِبَلِ» kalıbı modern bir çeviri alışkanlığıdır."}},{"wrong":"قُولَ لَهُ","right":"قِيلَ لَهُ","why":{"en":"Hollow verbs take kasra on the first letter in the passive, and the weak letter turns to ي: قَالَ ← قِيلَ, not *قُولَ.","tr":"Ecvef fiiller meçhulde ilk harflerini kesreli alır ve illet harfi yâya döner: قَالَ ← قِيلَ, *قُولَ değil."}}]},"naqis-verbs":{"title":{"ar":"الْفِعْلُ النَّاقِص","en":"Defective verbs (final و or ي)","tr":"Nâkıs fiil (sonu و veya ي)"},"level":3,"group":"sarf","explanation":{"en":"A naqis verb ends in و or ي: رَمَى (رَمَيَ), دَعَا (دَعَوَ), خَلَا, عَصَى. Four rules do almost all the work. FIRST, a voweled و or ي preceded by fatha turns into alif — that is why the past looks like رَمَى and غَزَا rather than رَمَيَ and غَزَوَ. SECOND, a damma on a final و or ي is simply dropped as too heavy: يَغْزُوُ → يَغْزُو, يَرْمِيُ → يَرْمِي. So the present ends in a long vowel with no visible case ending, and its raf' is مُقَدَّر — implied. THIRD, a kasra in the same position goes the same way: تَغْزُوِينَ → تَغْزِينَ, تَرْمِيِينَ → تَرْمِينَ. FOURTH, in anything longer than three letters a final و turns into ي: أَعْطَوَ → أَعْطَى, اِعْتَدَوَ → اِعْتَدَى — which is why ادَّعَى, from the root د ع و, still ends in ى. The practical consequences: before تْ the weak letter vanishes (رَمَتْ, خَلَتْ); in the jussive it vanishes too (لَمْ يَرْمِ, لَمْ يَخْلُ); the imperative is bare (اِرْمِ, اُخْلُ); and the ism fa'il is manqus (رَامٍ / الرَّامِي, مُدَّعٍ / الْمُدَّعِي). This is precisely why the app stores these forms rather than deriving them.","tr":"Nâkıs fiilin sonu و veya ي'dir: رَمَى (رَمَيَ), دَعَا (دَعَوَ), خَلَا، عَصَى. Dört kaide işin neredeyse tamamını görür. BİRİNCİ: harekeli و/ي, öncesi fethalı ise elife kalbolur — mâzinin رَمَى ve غَزَا görünmesinin sebebi budur. İKİNCİ: sondaki و/ي üzerindeki damme ağır geldiği için düşer: يَغْزُوُ → يَغْزُو، يَرْمِيُ → يَرْمِي. Böylece muzâri uzun bir sesle biter, i'rab alâmeti görünmez ve ref takdîrî olur. ÜÇÜNCÜ: aynı yerdeki kesre de düşer: تَغْزُوِينَ → تَغْزِينَ، تَرْمِيِينَ → تَرْمِينَ. DÖRDÜNCÜ: üç harften uzun kelimelerde sondaki و, يا'ya kalbolur: أَعْطَوَ → أَعْطَى، اِعْتَدَوَ → اِعْتَدَى — د ع و kökünden gelen ادَّعَى'nın ى ile bitmesi bundandır. Pratik neticeler: tâ-i te'nisten önce illetli harf düşer (رَمَتْ، خَلَتْ); cezmde de düşer (لَمْ يَرْمِ، لَمْ يَخْلُ); emir çıplaktır (اِرْمِ، اُخْلُ); ism-i fâili mankûstur (رَامٍ / الرَّامِي، مُدَّعٍ / الْمُدَّعِي). Uygulamanın bu şekilleri türetmek yerine saklamasının sebebi tam olarak budur."},"plain":{"en":"Verbs ending in و or ي, like رَمَى. The final letter shifts or falls away depending on what comes after it.","tr":"Sonu و veya ي olan fiiller (رَمَى gibi). Son harf, gelen eke göre değişir yahut düşer."},"sources":["مراح الأرواح","بناء الأفعال — الأقسام السبعة","المقصود"],"examples":[{"ar":"رَمَتْهُمْ بِحِجَارَةٍ.","gloss":{"en":"They pelted them with stones — before the feminine تْ the ي of رَمَى disappears.","tr":"Onlara taşlar attılar — tâ-i te'nisten önce رَمَى'nın yâsı düşer."},"src":"ashab-al-fil"},{"ar":"قَدْ خَلَتْ مِنْ قَبْلِهِ الرُّسُلُ.","gloss":{"en":"Messengers have passed away before him — the same loss in خَلَا, a defective wawi.","tr":"Ondan önce resuller gelip geçti — nâkıs-ı vâvî olan خَلَا'da da aynı düşme."},"src":"aqaid-ahl-al-sunna"},{"ar":"صِدْقِ مَنِ ادَّعَى أَنَّهُ رَسُولٌ.","gloss":{"en":"…of one who claims to be a messenger — ادَّعَى is from د ع و, yet ends in ى because the word runs past three letters.","tr":"…resul olduğunu iddia eden kimsenin — ادَّعَى, د ع و kökündendir, fakat kelime üç harfi aştığı için ى ile biter."},"src":"aqaid-ahl-al-sunna"},{"ar":"الْبَيِّنَةُ لِلْمُدَّعِي.","gloss":{"en":"The proof is on the claimant — the ism fa'il of a defective verb is a manqus noun.","tr":"Beyyine davacıya aittir — nâkıs fiilin ism-i fâili mankûs isimdir."},"src":"aqaid-ahl-al-sunna"}],"mistakes":[{"wrong":"لَمْ يَرْمِي","right":"لَمْ يَرْمِ","why":{"en":"The jussive of a defective verb is marked by DROPPING the weak letter, not by a sukun. Nothing is left to carry one.","tr":"Nâkıs fiilin cezmi sükûnla değil, illetli harfin HAZFİYLE olur. Sükûn taşıyacak harf kalmaz."}},{"wrong":"رَمَيَتْ الطُّيُورُ","right":"رَمَتِ الطُّيُورُ","why":{"en":"Before تْ the ي falls away: رَمَتْ, not رَمَيَتْ.","tr":"Tâ-i te'nisten önce ي düşer: رَمَتْ، رَمَيَتْ değil."}},{"wrong":"جَاءَ الْقَاضِي — «الْقَاضِي» مَرْفُوعٌ بِضَمَّةٍ ظَاهِرَةٍ","right":"مَرْفُوعٌ بِضَمَّةٍ مُقَدَّرَةٍ عَلَى الْيَاءِ","why":{"en":"The damma was dropped as too heavy on the ي. It is still raf' — but the mark is implied, and saying it is visible misreads the whole class.","tr":"Damme, يا üzerinde ağır geldiği için düşmüştür. İ'rab yine reftir, fakat alâmeti takdîrîdir."}},{"wrong":"اِرْمِي الْحَجَرَ (أَمْرًا لِلْمُذَكَّرِ)","right":"اِرْمِ الْحَجَرَ","why":{"en":"اِرْمِي is the feminine singular imperative. The masculine drops the weak letter entirely: اِرْمِ.","tr":"اِرْمِي müennes tekil emirdir. Müzekkerde illetli harf tamamen düşer: اِرْمِ."}}]},"nun-tawkid":{"title":{"ar":"نُونُ التَّوْكِيدِ","en":"The nun of emphasis","tr":"Te'kid nûnu"},"level":4,"group":"nahw","explanation":{"en":"The نُونُ التَّوْكِيدِ comes heavy (ـنَّ) or light (ـنْ) and fastens to the mudari' — most often after a prohibition, a command, an oath's lam (وَاللهِ لَأَفْعَلَنَّ), or a question. When it attaches directly, the verb becomes MABNI on fatha: the fatha of تَحْقِرَنَّ is building, not nasb, and if a jazim like لَا النَّاهِيَة stands before the verb, the jazm survives «in position» (فِي مَحَلِّ جَزْمٍ). The five-verbs endings interact with it: their nun of raf' drops before the nun of emphasis (تَفْعَلُونَ + نَّ → تَفْعَلُنَّ). The wasiyya's counsel list runs on this nun: لَا تَحْقِرَنَّ، لَا تُقَصِّرَنَّ، لَا تُخْرِجَنَّ، لَا تَثِقَنَّ، لَا تَقُولَنَّ — five prohibitions, each nailed shut.","tr":"Te'kid nûnu şeddeli (ـنَّ) yahut sâkin (ـنْ) gelir ve muzâriye bitişir — en çok nehiyden, emirden, kasem lâmından (وَاللهِ لَأَفْعَلَنَّ) yahut istifhamdan sonra. Doğrudan bitiştiğinde fiil fetha üzere MEBNÎ olur: تَحْقِرَنَّ'deki fetha binâdır, nasb değildir; başta لَا النَّاهِيَة gibi bir câzim varsa cezm «mahallen» devam eder (فِي مَحَلِّ جَزْمٍ). Beş fiilin sonlarıyla da etkileşir: ref nûnları, te'kid nûnundan önce düşer (تَفْعَلُونَ + نَّ → تَفْعَلُنَّ). Vasiyetin nasihat listesi bu nûnla yürür: لَا تَحْقِرَنَّ، لَا تُقَصِّرَنَّ، لَا تُخْرِجَنَّ، لَا تَثِقَنَّ، لَا تَقُولَنَّ — beş nehiy, beşi de perçinli."},"plain":{"en":"A doubled nun on the end of a present verb — لَا تَحْقِرَنَّ «do not EVER despise» — hammers the verb home. The verb ends in fatha because of the nun, not because anything made it nasb.","tr":"Muzârinin sonuna gelen şeddeli nûn — لَا تَحْقِرَنَّ «sakın hor görme» — fiili perçinler. Fiilin sonundaki fetha nûn yüzündendir; hiçbir âmil onu nasb etmiş değildir."},"sources":["قطر الندى (ابن هشام) — إعراب المضارع","الكافية (ابن الحاجب)"],"examples":[{"ar":"وَلَا تَحْقِرَنَّ أَحَدًا يَقْصِدُكَ.","gloss":{"en":"«And do not EVER despise anyone who seeks you out» — the verb is built on fatha by the heavy nun, in the position of jazm under لا.","tr":"«Sana yönelen hiç kimseyi sakın hor görme» — fiil, şeddeli nûnla fetha üzere mebnîdir; لا altında mahallen meczumdur."},"src":"wasiyyat-abi-hanifa-samti"},{"ar":"وَتَاللهِ لَأَكِيدَنَّ أَصْنَامَكُمْ.","gloss":{"en":"«By Allah, I shall surely scheme against your idols» (al-Anbiya 21:57) — the oath's lam and the heavy nun clamp the verb from both ends.","tr":"«Vallahi putlarınıza mutlaka bir tuzak kuracağım» (Enbiyâ 21:57) — kasem lâmı ile şeddeli nûn fiili iki uçtan kenetler."},"src":null}],"mistakes":[{"wrong":"لَا تَحْقِرَنَّ — فِعْلٌ مَنْصُوبٌ","right":"فِعْلٌ مَبْنِيٌّ عَلَى الْفَتْحِ فِي مَحَلِّ جَزْمٍ بِلَا النَّاهِيَةِ","why":{"en":"The fatha before the nun of emphasis is building, not nasb — no nasb governor is anywhere in the sentence; لا of prohibition still holds the verb in the position of jazm.","tr":"Te'kid nûnundan önceki fetha binâdır, nasb değildir — cümlede hiçbir nasb âmili yoktur; nehiy lâ'sı fiili mahallen cezimde tutar."}},{"wrong":"لَا تَقُولُنَّ","right":"لَا تَقُولَنَّ","why":{"en":"Directly attached, the nun of emphasis takes fatha before it; damma would pretend the raf' survived the prohibition.","tr":"Doğrudan bitişen te'kid nûnundan önce fetha gelir; zamme, nehye rağmen ref sürüyormuş gibi olurdu."}}]},"qad-harf":{"title":{"ar":"قَدْ (حَرْفُ التَّحْقِيقِ وَالتَّقْلِيلِ)","en":"The particle قَدْ","tr":"قَدْ (tahkîk ve taklîl harfi)"},"level":3,"group":"nahw","explanation":{"en":"قَدْ enters only on verbs, and what it does depends on the tense. Before a MADI it is تَحْقِيق — it affirms the act and pulls it close to the present: قَدْ خَلَتْ, «they have indeed passed away» rather than a bare «they passed». Before a MUDARI' it usually means the opposite, تَقْلِيل — «sometimes, it may be»: قَدْ يَصْدُقُ الْكَذُوبُ, «a liar does sometimes tell the truth». It governs nothing, so it changes no ending; it only conditions the reading. One consequence matters in i'rab: قَدْ + madi is one of the standard ways a past clause is licensed to serve as a hal — قَدْ is what makes «جَاءَ وَقَدْ غَابَتِ الشَّمْسُ» acceptable.","tr":"قَدْ yalnız fiillerin başına gelir ve işlevi zamana göre değişir. MÂZİ'nin başında tahkîk içindir; fiili te'kid eder ve hâle yaklaştırır: قَدْ خَلَتْ, «gelip geçmişlerdir». MUZÂRİ'nin başında ise çoğunlukla tersini, taklîli ifade eder: قَدْ يَصْدُقُ الْكَذُوبُ, «yalancı bazen doğru söyler». Amel etmez, hiçbir i'rabı değiştirmez; sadece manayı belirler. İ'rab açısından şu önemlidir: قَدْ + mâzi, mâzi cümlesinin hâl olabilmesinin standart yollarından biridir — «جَاءَ وَقَدْ غَابَتِ الشَّمْسُ» ifadesini caiz kılan قَدْ'dir."},"plain":{"en":"قَدْ before a past verb means «has indeed»; before a present verb it usually means «sometimes».","tr":"قَدْ mâzînin başında «gerçekten…-dı», muzârinin başında çoğunlukla «bazen» manası verir."},"sources":["العوامل (البيركوي) — الحروف","قطر الندى (ابن هشام)"],"examples":[{"ar":"قَدْ خَلَتْ مِنْ قَبْلِهِ الرُّسُلُ.","gloss":{"en":"Messengers have indeed passed away before him — قَدْ before a past verb affirms it.","tr":"Ondan önce resuller muhakkak gelip geçti — قَدْ mâzinin başında onu te'kid eder."},"src":"aqaid-ahl-al-sunna"},{"ar":"قَدْ يَصْدُقُ الْكَذُوبُ.","gloss":{"en":"A habitual liar does sometimes tell the truth — قَدْ before a mudari' means «sometimes».","tr":"Yalancı bazen doğru söyler — قَدْ muzârinin başında «bazen» manasındadır."},"src":null}],"mistakes":[{"wrong":"قَدْ الرَّجُلُ ذَهَبَ","right":"قَدْ ذَهَبَ الرَّجُلُ","why":{"en":"قَدْ attaches directly to the verb; nothing may come between them.","tr":"قَدْ doğrudan fiile bitişir; araya hiçbir kelime giremez."}},{"wrong":"قَدْ يَذْهَبُ أَمْسِ","right":"قَدْ ذَهَبَ أَمْسِ","why":{"en":"قَدْ with a mudari' reads as «sometimes / may», which cannot be combined with «yesterday». For a completed past act use قَدْ + madi.","tr":"قَدْ + muzâri «bazen / olabilir» manasındadır ve «dün» ile birleşmez. Tamamlanmış geçmiş için قَدْ + mâzi kullanılır."}}]},"qasr":{"title":{"ar":"الْقَصْر (الْحَصْر)","en":"Restriction — «only this, and nothing else»","tr":"Kasr (hasr) — «ancak bu»"},"level":4,"group":"balagha","explanation":{"en":"Qasr is confining one thing to another: this predicate to this subject and to nothing else. Arabic has four standard ways to do it, and they are not interchangeable. (1) NEGATION THEN EXCEPTION — مَا مُحَمَّدٌ إِلَّا رَسُولٌ. This is the strongest and the most explicit; it is used when the listener firmly believes the opposite, and it denies before it affirms. (2) إِنَّمَا — إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ. Softer, and used when the point is treated as already granted or easily granted; it affirms without a preceding denial. (3) FRONTING what would normally come later — إِيَّاكَ نَعْبُدُ puts the object first and thereby confines the worship. (4) The particles إِنَّمَا's cousins, بَلْ and لَا and لَكِنْ, which restrict by correcting. Reading the choice is the skill: the hadith says إِنَّمَا الْأَعْمَالُ because nobody was denying it, while the verse says مَا مُحَمَّدٌ إِلَّا رَسُولٌ at a moment when people were doing exactly that.","tr":"Kasr, bir şeyi başka bir şeye hasretmektir: bu hükmü bu konuya, başkasına değil. Arapçada dört yolu vardır ve birbirinin yerine geçmezler. (1) NEFY VE İSTİSNÂ — مَا مُحَمَّدٌ إِلَّا رَسُولٌ. En kuvvetli ve en açık olanıdır; muhatap aksine kesin inandığında kullanılır, ispattan önce nefyeder. (2) إِنَّمَا — إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ. Daha yumuşaktır; hüküm zaten kabul edilmiş yahut kolay kabul edilir sayıldığında kullanılır, öncesinde nefy olmadan ispat eder. (3) TAKDÎM — normalde sonra gelecek olanı öne almak: إِيَّاكَ نَعْبُدُ mef'ûlü öne alır ve ibadeti böylece hasreder. (4) بَلْ، لَا، لَكِنْ gibi tashih yoluyla hasreden edatlar. Hangisinin seçildiğini okumak asıl hünerdir: hadis إِنَّمَا الْأَعْمَالُ der, çünkü kimse bunu inkâr etmiyordu; âyet ise insanların tam da bunu yaptığı bir anda مَا مُحَمَّدٌ إِلَّا رَسُولٌ der."},"plain":{"en":"The ways of saying «only this, and nothing else».","tr":"«Yalnız bu, başkası değil» demenin yolları."},"sources":["تلخيص المفتاح (القزويني) — علم المعاني","مختصر السعد","الكافية (ابن الحاجب)"],"examples":[{"ar":"إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ.","gloss":{"en":"Deeds are only by intentions — إِنَّمَا, affirming what nobody was contesting.","tr":"Ameller ancak niyetlerledir — kimsenin itiraz etmediğini ispat eden إِنَّمَا."},"src":"deeds-are-by-intentions"},{"ar":"وَمَا مُحَمَّدٌ إِلَّا رَسُولٌ.","gloss":{"en":"Muhammad is but a messenger — negation then exception, at a moment when people believed otherwise.","tr":"Muhammed ancak bir resuldür — insanların aksine inandığı bir anda nefy ve istisnâ."},"src":"aqaid-ahl-al-sunna"},{"ar":"وَإِنَّمَا أُوصِيكَ لِمَصْلَحَتِكَ وَمَصْلَحَةِ الْمُسْلِمِينَ.","gloss":{"en":"I counsel you only for your good and the good of the Muslims — إِنَّمَا confining the motive.","tr":"Sana ancak senin ve Müslümanların iyiliği için nasihat ediyorum — sebebi hasreden إِنَّمَا."},"src":"wasiyyat-abi-yusuf-L5"}],"mistakes":[{"wrong":"إِنَّمَا وَمَا … إِلَّا سَوَاءٌ","right":"لَا؛ «مَا … إِلَّا» لِلْمُنْكِرِ، وَ«إِنَّمَا» لِغَيْرِ الْمُنْكِرِ","why":{"en":"They restrict the same thing but address different listeners. Choosing the wrong one is a mistake of tone, and tone is what balagha is about.","tr":"İkisi de aynı şeyi hasreder fakat farklı muhataba hitap eder. Yanlışını seçmek üslup hatasıdır; belâgat da zaten üsluptur."}},{"wrong":"«إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ» — «الْأَعْمَالُ» اسْمُ إِنَّ مَنْصُوبٌ","right":"مَرْفُوعٌ، لِأَنَّ «مَا» كَفَّتْ «إِنَّ» عَنِ الْعَمَلِ","why":{"en":"The مَا that turns إِنَّ into a restrictor also strips its government, so the noun goes back to raf'. The rhetoric and the grammar move together.","tr":"إِنَّ'yi hasr edatına çeviren مَا, aynı zamanda amelini de düşürür; isim ref'e döner. Belâgat ile nahiv birlikte hareket eder."}}]},"rubai-babs":{"title":{"ar":"الْفِعْلُ الرُّبَاعِيُّ وَأَبْوَابُهُ","en":"The quadriliteral verb and its babs","tr":"Rubâî fiil ve bâbları"},"level":5,"group":"sarf","explanation":{"en":"The 35-bab table counts eighteen triliteral babs and seventeen quadriliteral ones. The bare bab is فَعْلَلَ يُفَعْلِلُ (دَحْرَجَ يُدَحْرِجُ — 'he rolled it'), and it is the only Form-I-like verb whose mudari' prefix takes DAMMA, exactly as the augmented triliterals do; its masdar is فَعْلَلَة or فِعْلَال. Six MULHAQ shapes are attached to it — فَوْعَلَ (حَوْقَلَ), فَيْعَلَ (بَيْطَرَ), فَعْوَلَ (جَهْوَرَ), فَعْيَلَ (عَثْيَرَ), doubled-lam فَعْلَلَ (جَلْبَبَ) and فَعْلَى (سَلْقَى): three root letters dressed as four, conjugated exactly like دَحْرَجَ. Then three augmented babs: تَفَعْلَلَ (تَدَحْرَجَ — the reflexive of the first: 'I rolled it and it rolled'), افْعَنْلَلَ (اِحْرَنْجَمَ — 'the camels gathered'), and افْعَلَلَّ (اِقْشَعَرَّ — 'the skin shivered'), whose last radical doubles and therefore contracts before a vowel and breaks before a consonant: اِقْشَعَرَّ but اِقْشَعْرَرْتُ.","tr":"35 bâb tablosu on sekiz sülâsî ve on yedi rubâî bâb sayar. Mücerred bâb فَعْلَلَ يُفَعْلِلُ'dür (دَحْرَجَ يُدَحْرِجُ — 'yuvarladı'); muzâraat harfi DAMMELİ olan tek mücerred fiildir, tıpkı mezîd sülâsîler gibi. Masdarı فَعْلَلَة yahut فِعْلَال gelir. Ona ilhak edilen altı şekil vardır — فَوْعَلَ (حَوْقَلَ), فَيْعَلَ (بَيْطَرَ), فَعْوَلَ (جَهْوَرَ), فَعْيَلَ (عَثْيَرَ), lâmı tekrarlı فَعْلَلَ (جَلْبَبَ) ve فَعْلَى (سَلْقَى): dört harf kılığına girmiş üç harfli kökler, aynen دَحْرَجَ gibi çekilirler. Sonra üç mezîd bâb: تَفَعْلَلَ (تَدَحْرَجَ — birincinin mutâvaatı: 'yuvarladım, o da yuvarlandı'), افْعَنْلَلَ (اِحْرَنْجَمَ — 'develer toplandı') ve افْعَلَلَّ (اِقْشَعَرَّ — 'deri ürperdi'). Sonuncusunun son harfi şeddelidir: harekeden önce idgamlı, sâkinden önce fekkli gelir — اِقْشَعَرَّ fakat اِقْشَعْرَرْتُ."},"plain":{"en":"Some verbs have FOUR root letters, not three. They have their own small table: one bare bab and three augmented ones — and none of them behaves like a triliteral.","tr":"Bazı fiillerin kökü üç değil DÖRT harflidir. Kendilerine ait küçük bir tabloları vardır: bir mücerred, üç mezîd bâb — ve hiçbiri sülâsî gibi çekilmez."},"sources":["المقصود","مراح الأرواح","بناء الأفعال"],"question":{"tr":["Kökü kaç harf? Dört ise sülâsî tabloya bakmayın.","Muzârisi yu- ile mi başlıyor? Rubâî mücerreddir."],"en":["How many root letters? Four means the triliteral table does not apply.","Does the mudari' open with yu-? Then it is the bare quadriliteral."]},"examples":[{"ar":"دَحْرَجَ يُدَحْرِجُ دَحْرَجَةً — مُدَحْرِجٌ، مُدَحْرَجٌ.","gloss":{"en":"The bare quadriliteral in full: past, present, masdar, doer, done-to.","tr":"Rubâî mücerredin tamamı: mâzî, muzâri, masdar, ism-i fâil, ism-i mef'ûl."},"src":null},{"ar":"دَحْرَجْتُهُ فَتَدَحْرَجَ.","gloss":{"en":"I rolled it and it rolled — تَفَعْلَلَ is the reflexive (mutawa'a) of فَعْلَلَ.","tr":"Onu yuvarladım, o da yuvarlandı — تَفَعْلَلَ, فَعْلَلَ'nin mutâvaatıdır."},"src":null},{"ar":"اِقْشَعَرَّ الْجِلْدُ، وَاِقْشَعْرَرْتُ مِنْهُ.","gloss":{"en":"The skin shivered — contracted before a vowel, broken before a consonant.","tr":"Deri ürperdi — harekeden önce idgamlı, sâkinden önce fekkli."},"src":null}],"mistakes":[{"wrong":"دَحْرَجَ يَدْحَرِجُ","right":"دَحْرَجَ يُدَحْرِجُ","why":{"en":"The quadriliteral's mudari' prefix takes DAMMA, not fatha — it is not a triliteral Form I, however much its past tense looks like one.","tr":"Rubâînin muzâraat harfi DAMMELİDİR, fethalı değil — mâzîsi ne kadar sülâsî görünse de o bir sülâsî mücerred değildir."}}]},"saj":{"title":{"ar":"السَّجْع","en":"Saj' — prose that agrees at the pause","tr":"Seci — nesirde fâsılaların bir harf üzerinde birleşmesi"},"level":6,"group":"balagha","explanation":{"en":"Saj' is the agreement of two فَوَاصِل — the last word of each clause — upon one letter. Al-Sakkaki put it in a sentence: saj' is to prose what qafiya is to verse. The kinds are told apart by how the two fawasil stand to each other. If they differ in wazn, it is مُطَرَّف: «مَا لَكُمْ لَا تَرْجُونَ لِلَّهِ وَقَارًا · وَقَدْ خَلَقَكُمْ أَطْوَارًا». If they do not differ, and most or all of the words of one clause match their counterparts in the other in wazn and in rhyme, it is تَرْصِيع — the tightest weave, as in al-Hariri's «يَطْبَعُ الْأَسْجَاعَ بِجَوَاهِرِ لَفْظِهِ وَيَقْرَعُ الْأَسْمَاعَ بِزَوَاجِرِ وَعْظِهِ». Anything else is مُتَوَازٍ: «فِيهَا سُرُرٌ مَرْفُوعَةٌ وَأَكْوَابٌ مَوْضُوعَةٌ», where only the fawasil answer each other. On length: the finest saj' has clauses of equal measure; after that, the one whose second clause is the longer; and bringing a second or third clause much shorter than the first is held to be ugly. Saj' is built on sukun at the pause — «مَا أَبْعَدَ مَا فَاتْ وَمَا أَقْرَبَ مَا هُوَ آتْ» — so the ending you hear is the one that counts, not the case vowel on the page. Two cautions the books add themselves. Many scholars decline to use the word for the Qur'an and say فَاصِلَة instead. And لُزُومُ مَا لَا يَلْزَمُ is the further refinement of matching a letter the rhyme never required: «فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ · وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ», where both fawasil agree on ه before the ر that alone was needed.","tr":"Seci, iki fâsılanın — her karînenin son kelimesinin — bir harf üzerinde ittifak etmesidir. Sekkâkî bunu tek cümlede söyler: nesirde seci, şiirde kafiye gibidir. Kısımlar, iki fâsılanın birbirine nispetine göre ayrılır. Vezinde ihtilâf ederlerse mutarraf olur: «مَا لَكُمْ لَا تَرْجُونَ لِلَّهِ وَقَارًا · وَقَدْ خَلَقَكُمْ أَطْوَارًا». İhtilâf etmez ve bir karînedeki lafızların çoğu yahut hepsi, öbür karînedeki mukâbilinin vezin ve kafiyede misli olursa tersî' olur — en sıkı dokuma; Harîrî'nin «يَطْبَعُ الْأَسْجَاعَ بِجَوَاهِرِ لَفْظِهِ وَيَقْرَعُ الْأَسْمَاعَ بِزَوَاجِرِ وَعْظِهِ» sözünde olduğu gibi. Bunun dışındakine mütevâzî denir: «فِيهَا سُرُرٌ مَرْفُوعَةٌ وَأَكْوَابٌ مَوْضُوعَةٌ»; burada yalnız fâsılalar birbirini karşılar. Uzunluk bahsinde: secinin en güzeli karîneleri müsâvî olanıdır; sonra ikinci karînesi daha uzun olanı; ikinci yahut üçüncü karîneyi birincisinden çok kısa getirmek güzel görülmemiştir. Seciler sonlarının sükûnu üzerine mebnîdir — «مَا أَبْعَدَ مَا فَاتْ وَمَا أَقْرَبَ مَا هُوَ آتْ» — yani hesaba giren, sayfadaki i'râb harekesi değil, vakıfta işitilen sondur. Kitapların kendi koyduğu iki kayıt: birçok âlim Kur'an için bu kelimeyi kullanmaz, fâsıla der. Ve lüzûm-ı mâ lâ yelzem, kafiyenin hiç istemediği bir harfte dahi ittifak etmektir: «فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ · وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ» — yalnız ر kâfî iken iki fâsıla ondan önceki ه'da da birleşmiştir."},"plain":{"en":"Prose whose clauses end on the same sound, the way verse rhymes.","tr":"Cümleleri, şiirin kafiyesi gibi aynı sesle biten nesir."},"sources":["تلخيص المفتاح (القزويني) — علم البديع، المحسنات اللفظية","مختصر السعد"],"examples":[{"ar":"أَكْرِمِ الْعُلَمَاءَ وَاحْتَرِمِ الْكِبَارَ وَارْحَمِ الصِّغَارَ.","gloss":{"en":"الْكِبَارَ and الصِّغَارَ are the two fawasil: one wazn, one rhyme letter — and also a tibaq. The imperatives do not match in wazn (اِفْتَعِلْ against اِفْعَلْ), so it is مُتَوَازٍ and not tarsi'.","tr":"الْكِبَارَ ve الصِّغَارَ iki fâsıladır: vezin bir, kafiye harfi bir — üstelik aralarında tıbâk vardır. Emirler vezinde uyuşmadığı için (اِفْتَعِلْ karşısında اِفْعَلْ) bu, tersî' değil mütevâzî secidir."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"فِيهَا سُرُرٌ مَرْفُوعَةٌ وَأَكْوَابٌ مَوْضُوعَةٌ.","gloss":{"en":"The Talkhis's example of مُتَوَازٍ: the fawasil agree, while سُرُر and أَكْوَاب do not (al-Ghashiya 13-14).","tr":"Telhîs'in mütevâzî için verdiği misal: fâsılalar birleşir, سُرُر ile أَكْوَاب birleşmez (Ğâşiye 13-14)."},"src":null},{"ar":"مَا أَبْعَدَ مَا فَاتْ وَمَا أَقْرَبَ مَا هُوَ آتْ.","gloss":{"en":"An Arab saying quoted to show that saj' is built on the pausal sukun — فَاتْ and آتْ rhyme only when they are stopped on.","tr":"Secinin vakıf sükûnu üzerine kurulduğunu göstermek için nakledilen bir Arap sözü — فَاتْ ile آتْ ancak üzerinde vakfedilince kafiyeleşir."},"src":null}],"mistakes":[{"wrong":"«إِنَّ الْعِلْمَ بِلَا عَمَلٍ كَشَجَرٍ بِلَا ثَمَرٍ» سَجْعٌ","right":"لَيْسَ بِسَجْعٍ لِاخْتِلَافِ حَرْفِ الْفَاصِلَتَيْنِ (ل / ر)، وَإِنَّمَا اتَّفَقَا فِي الْوَزْنِ","why":{"en":"عَمَل and ثَمَر are both فَعَل and the two clauses are perfectly parallel, which is why the sentence sounds like saj'. But saj' is defined by agreement on the final letter, and these two end on different ones.","tr":"عَمَل ve ثَمَر ikisi de فَعَل vezninde ve iki karîne tam mütenâzırdır; cümlenin seci gibi işitilmesinin sebebi budur. Fakat seci son harfteki ittifakla tarif edilir ve bu ikisi ayrı harflerle biter."}},{"wrong":"يُعْتَبَرُ فِي السَّجْعِ آخِرُ الْكَلِمَةِ بِحَرَكَةِ الْإِعْرَابِ","right":"الْأَسْجَاعُ مَبْنِيَّةٌ عَلَى الْوَقْفِ وَالسُّكُونِ","why":{"en":"The rhyme is heard where the reciter stops. Judging it by the i'rab vowel would break pairs the ear accepts and admit pairs it rejects.","tr":"Kafiye, okuyanın vakfettiği yerde işitilir. İ'râb harekesine göre hüküm vermek, kulağın kabul ettiği çiftleri bozar, reddettiklerini kabul ettirir."}},{"wrong":"كُلَّمَا تَقَارَبَتِ الْفَوَاصِلُ حَسُنَ السَّجْعُ وَلَوْ قَصُرَتِ الْقَرِينَةُ الثَّانِيَةُ جِدًّا","right":"أَحْسَنُهُ مَا تَسَاوَتْ قَرَائِنُهُ، ثُمَّ مَا طَالَتْ ثَانِيَتُهُ","why":{"en":"The book rules a second or third clause much shorter than the first to be ugly. The rhyme is not enough on its own; the measure has to carry it.","tr":"Kitap, ikinci yahut üçüncü karîneyi birincisinden çok kısa getirmeyi güzel saymaz. Kafiye tek başına yetmez; ölçünün de onu taşıması gerekir."}}]},"sifa-mushabbaha":{"title":{"ar":"الصِّفَةُ الْمُشَبَّهَة","en":"The sifa mushabbaha (adjective of permanent quality)","tr":"Sıfat-ı müşebbehe"},"level":6,"group":"nahw","explanation":{"en":"The sifa mushabbaha is «likened» to the ism fail because it too is derived and governs like a verb — but it names a SETTLED quality rather than a passing act: حَسَن «beautiful» as against ضَارِب «striking (now)». Like its verb it needs a doer, and here is the whole difficulty: the noun after it (وَجْه, «face») may be read in raf', nasb or jarr, and the sifa itself may be bare or carry ال. That is eighteen possible constructions, and the tradition grades each as أَحْسَن (best), حَسَن (good), قَبِيح (poor) or مُمْتَنِع (not permitted).\n\nOne rule explains almost all of them: COUNT THE PRONOUNS. If the noun after the sifa is marfu', it IS the doer, and no hidden pronoun exists; in nasb or jarr the doer is a hidden pronoun inside the sifa. Add to that any pronoun attached to the noun itself (وَجْهُهُ). A construction carrying exactly ONE pronoun is best; TWO is merely good; NONE is poor — a derived word governing with no doer at all in sight is weak Arabic. Separately, a sifa carrying ال may only be made mudaf to a noun that also carries ال, which is why الْحَسَنُ وَجْهِهِ and الْحَسَنُ وَجْهٍ are simply not said.\n\nThat rule settles seventeen of the eighteen. The one it leaves open — حَسَنُ وَجْهِهِ — is precisely the case the tables mark اخْتِلَاف, disputed among the grammarians.","tr":"Sıfat-ı müşebbehe, ism-i fâile «benzetilmiştir»; çünkü o da müştaktır ve fiil gibi amel eder — fakat geçici bir işi değil, SABİT bir vasfı bildirir: حَسَن «güzel», ضَارِب «(şimdi) vuran»ın karşısında. Fiili gibi bir fâile ihtiyaç duyar ve bütün güçlük buradadır: ardından gelen isim (وَجْه) ref, nasb veya cer ile okunabilir; sıfatın kendisi de ال'lı veya ال'sız olabilir. Bu on sekiz vecih eder ve gelenek her birini اَحْسَن (en güzel), حَسَن (güzel), قَبِيح (çirkin) veya مُمْتَنِع (caiz değil) diye derecelendirir.\n\nNeredeyse hepsini tek bir kural açıklar: ZAMİRLERİ SAY. Sıfattan sonraki isim merfû ise fâilin kendisidir ve gizli zamir yoktur; nasb veya cer ile okunursa fâil, sıfatın içindeki gizli zamirdir. Buna ismin kendisine bitişen zamiri ekle (وَجْهُهُ). Tam BİR zamir taşıyan vecih en güzeldir; İKİ taşıyan yalnızca güzeldir; HİÇ taşımayan çirkindir — ortada hiçbir fâil görünmeden amel eden müştak kelime zayıf Arapçadır. Ayrıca ال taşıyan bir sıfat, yalnızca yine ال taşıyan bir isme muzâf olabilir; الْحَسَنُ وَجْهِهِ ve الْحَسَنُ وَجْهٍ'in söylenmemesinin sebebi budur.\n\nBu kural on sekizden on yedisini çözer. Açık bıraktığı tek vecih — حَسَنُ وَجْهِهِ — tam da cetvellerin اِخْتِلَاف, yani gramerciler arasında ihtilaflı diye işaretlediği vecihtir."},"plain":{"en":"An adjective for a settled quality rather than something happening right now: «beautiful», as against «striking (at this moment)».","tr":"Geçici bir işi değil, yerleşik bir vasfı bildiren sıfat: «güzel», «(şu anda) vuran»ın karşısında."},"mamul":"marfu","sources":["أوزان صفة مشبهة (جدول المدرسة)","الفوائد الضيائية (ملا جامي)","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"examples":[{"ar":"زَيْدٌ حَسَنٌ وَجْهُهُ.","gloss":{"en":"Zayd is beautiful of face — أَحْسَن: the noun is marfu' as the doer, and carries one pronoun.","tr":"Zeyd yüzü güzeldir — أَحْسَن: isim fâil olarak merfûdur ve bir zamir taşır."},"src":null},{"ar":"زَيْدٌ حَسَنٌ الْوَجْهَ.","gloss":{"en":"Same sense, the noun in nasb — also أَحْسَن: the doer is a hidden pronoun, one pronoun in all.","tr":"Aynı mana, isim nasb hâlinde — yine أَحْسَن: fâil müstetir zamirdir, toplamda bir zamir."},"src":null},{"ar":"زَيْدٌ حَسَنٌ الْوَجْهُ.","gloss":{"en":"قَبِيح: the noun is marfu' as doer and carries no pronoun, so nothing pronominal remains anywhere.","tr":"قَبِيح: isim fâil olarak merfûdur ve zamir taşımaz, dolayısıyla hiçbir yerde zamir kalmaz."},"src":null},{"ar":"زَيْدٌ الْحَسَنُ وَجْهِهِ.","gloss":{"en":"مُمْتَنِع: a sifa carrying ال cannot be mudaf to a noun made definite by a pronoun.","tr":"مُمْتَنِع: ال taşıyan bir sıfat, zamirle marife olmuş bir isme muzâf olamaz."},"src":null}],"mistakes":[{"wrong":"زيدٌ حسنٌ الوجهُ","right":"زَيْدٌ حَسَنٌ الْوَجْهَ / حَسَنُ الْوَجْهِ","why":{"en":"Reading the noun in raf' after a bare sifa leaves the construction with no pronoun at all — the grammarians call this qabih. Put it in nasb or make it mudaf instead.","tr":"ال'sız bir sıfattan sonra ismi merfû okumak, terkibi hiç zamirsiz bırakır — gramerciler buna kabîh der. Onun yerine nasb ile oku veya muzâf yap."}},{"wrong":"زيدٌ الحسنُ وجهٍ","right":"زَيْدٌ الْحَسَنُ الْوَجْهِ","why":{"en":"Once the sifa carries ال, whatever it is mudaf to must carry ال too. Otherwise the idafa is not permitted at all.","tr":"Sıfat ال aldıysa, muzâf olduğu isim de ال almalıdır. Aksi hâlde izafet hiç caiz olmaz."}},{"wrong":"عَدُّ الصِّفَةِ الْمُشَبَّهَةِ كَاسْمِ الْفَاعِلِ فِي الدَّلَالَةِ","right":"الصِّفَةُ الْمُشَبَّهَةُ لِلثُّبُوتِ وَاسْمُ الْفَاعِلِ لِلْحُدُوثِ","why":{"en":"They are not interchangeable: حَسَن states a settled quality, حَاسِن would state an act in progress. The sifa mushabbaha is also built only from an intransitive verb.","tr":"Birbirinin yerine geçmezler: حَسَن sabit bir vasfı, حَاسِن ise sürmekte olan bir işi bildirir. Ayrıca sıfat-ı müşebbehe yalnız lâzım fiilden yapılır."}}]},"sighat-mubalagha":{"title":{"ar":"صِيَغُ الْمُبَالَغَة","en":"The intensive forms of the ism fa'il","tr":"Mübalağa sîgaları"},"level":5,"group":"sarf","explanation":{"en":"When the plain ism fa'il is not strong enough, Arabic reshapes it. صَادِق is «truthful»; صِدِّيق is truthful through and through. The tradition counts eight patterns for the intensive of the doer — فَعُول (جَهُول), فِعِّيل (صِدِّيق), فَعَّال (كَذَّاب), فُعُل (غُفُل), فَعِل (يَقِظ), مِفْعَال (مِدْرَار), مِفْعِيل (مِكْثِير), فُعَلَة (لُعَنَة) — and one for the intensive of the thing done to, فُعْلَة (لُعْنَة, «much cursed»). Three of these are worth knowing well because they are everywhere in the divine names and in classical prose: فَعُول (غَفُور, شَكُور), فَعَّال (غَفَّار, قَهَّار) and فِعِّيل (صِدِّيق). Do not confuse مِفْعَال and مِفْعِيل here with the ism ala, which uses the same shapes for instruments — مِفْتَاح is a key, not an intense opener; only the context decides. The intensive is a noun, so it takes the case its position calls for and can govern an object just as its verb would.","tr":"Sade ism-i fâil yetmediğinde Arapça onu yeniden döker. صَادِق «doğru sözlü»dür; صِدِّيق ise özü sözü doğru olandır. Gelenek, fâilin mübalağası için sekiz vezin sayar — فَعُول (جَهُول)، فِعِّيل (صِدِّيق)، فَعَّال (كَذَّاب)، فُعُل (غُفُل)، فَعِل (يَقِظ)، مِفْعَال (مِدْرَار)، مِفْعِيل (مِكْثِير)، فُعَلَة (لُعَنَة) — ve mef'ûlün mübalağası için bir vezin: فُعْلَة (لُعْنَة). Bunlardan üçü esmâ-i hüsnâda ve klasik nesirde çok geçtiği için iyi bilinmelidir: فَعُول (غَفُور، شَكُور)، فَعَّال (غَفَّار، قَهَّار) ve فِعِّيل (صِدِّيق). Buradaki مِفْعَال ve مِفْعِيل'i, aynı kalıpları âlet için kullanan ism-i âletle karıştırmayın — مِفْتَاح anahtardır, «çok açan» değil; ayrımı ancak siyak yapar. Mübalağa sîgası isimdir; bulunduğu mahallin i'rabını alır ve fiili gibi mef'ûl de alabilir."},"plain":{"en":"For when «truthful» is not strong enough: a set of patterns that intensify a doer. صَادِق is truthful; صِدِّيق is truthful through and through.","tr":"«Doğru» yetmediğinde: fâili kuvvetlendiren kalıplar. صَادِق doğrudur; صِدِّيق ise özü sözü doğru olandır."},"sources":["مراح الأرواح","المقصود","الكافية (ابن الحاجب)"],"examples":[{"ar":"وَالْخَبَرُ الصَّادِقُ.","gloss":{"en":"…and the truthful report — the plain ism fa'il. Intensify it and you get صِدِّيق, a person truthful to the core.","tr":"…ve sâdık haber — sade ism-i fâil. Mübalağalandırınca صِدِّيق olur: özü sözü doğru kimse."},"src":"aqaid-ahl-al-sunna"},{"ar":"إِنَّ اللهَ غَفُورٌ رَحِيمٌ.","gloss":{"en":"Allah is much-forgiving, merciful — فَعُول, the commonest intensive of them all.","tr":"Allah çok bağışlayıcı ve merhametlidir — فَعُول, mübalağa vezinlerinin en yaygını."},"src":null},{"ar":"رَجُلٌ كَذَّابٌ.","gloss":{"en":"An inveterate liar — فَعَّال, the pattern of habit and profession alike.","tr":"İflah olmaz bir yalancı — فَعَّال, hem alışkanlık hem meslek vezni."},"src":null}],"mistakes":[{"wrong":"اللهُ غَافِرٌ لِلذُّنُوبِ جَمِيعًا (فِي مَقَامِ الثَّنَاءِ)","right":"اللهُ غَفَّارٌ / غَفُورٌ","why":{"en":"The plain ism fa'il states the act; the intensive states the quality. In praise the intensive is what is meant.","tr":"Sade ism-i fâil fiili haber verir, mübalağa sîgası vasfı bildirir. Senâ makamında murad olan mübalağadır."}},{"wrong":"مِفْتَاحٌ — صِيغَةُ مُبَالَغَةٍ","right":"مِفْتَاحٌ اسْمُ آلَةٍ","why":{"en":"مِفْعَال serves both the intensive and the instrument. مِفْتَاح is an instrument — a key — and only its meaning tells you which.","tr":"مِفْعَال hem mübalağa hem ism-i âlet için kullanılır. مِفْتَاح âlettir; hangisi olduğunu ancak mana gösterir."}}]},"tamyiz":{"title":{"ar":"التَّمْيِيز","en":"The tamyiz (accusative of specification)","tr":"Temyîz"},"level":4,"group":"nahw","explanation":{"en":"Defined in the Mansubat as «مَا يَرْفَعُ الْإِبْهَامَ الْمُسْتَقِرَّ عَنْ ذَاتٍ مَذْكُورَةٍ أَوْ مُقَدَّرَةٍ» — the indefinite noun in nasb that clears up an ambiguity already settled in the sentence. It answers «in what respect?». The Mansubat divides it in two: (1) tamyiz of a STATED thing (مَذْكُورَة) — after measures, weights and numbers: رِطْلٌ زَيْتًا, عِشْرُونَ كِتَابًا; (2) tamyiz of an IMPLIED thing (مُقَدَّرَة), which resolves a whole sentence: طَابَ الرَّجُلُ نَفْسًا «the man was good — in soul». The tamyiz is always indefinite and always mansub.","tr":"Mensûbât'ta şöyle tanımlanır: «مَا يَرْفَعُ الْإِبْهَامَ الْمُسْتَقِرَّ عَنْ ذَاتٍ مَذْكُورَةٍ أَوْ مُقَدَّرَةٍ» — cümlede yerleşmiş bir kapalılığı gideren, nekre ve mansub isimdir. «Hangi bakımdan?» sorusuna cevap verir. Mensûbât ikiye ayırır: (1) ZİKREDİLMİŞ bir zâtın temyizi — ölçü, tartı ve sayılardan sonra: رِطْلٌ زَيْتًا, عِشْرُونَ كِتَابًا; (2) MUKADDER bir zâtın temyizi, ki bütün cümlenin kapalılığını giderir: طَابَ الرَّجُلُ نَفْسًا «adam hoş oldu — nefis bakımından». Temyiz daima nekre ve daima mansubdur."},"plain":{"en":"Answers «in what respect?»: «the greatest of people in regret».","tr":"«Hangi cihetten?» sorusuna cevap verir: «insanların hasret bakımından en şiddetlisi»."},"mamul":"mansub","sources":["المنصوبات","العوامل (البيركوي)","قطر الندى (ابن هشام)"],"question":{"tr":["Ne cihetten?"],"en":["In what respect?"]},"examples":[{"ar":"أَشَدُّ النَّاسِ حَسْرَةً يَوْمَ الْقِيَامَةِ.","gloss":{"en":"The people of greatest regret on the Day of Resurrection — حَسْرَةً is the tamyiz after an ism tafdil, naming the respect in which «greatest» holds.","tr":"Kıyamet günü pişmanlığı en büyük olan insanlar — حَسْرَةً, ism-i tafdîlden sonra gelen temyîzdir; «en büyük»ün hangi cihetten olduğunu belirtir."},"src":"min-muqaddimat-al-maqsud"},{"ar":"طَابَ الرَّجُلُ نَفْسًا.","gloss":{"en":"The man was contented — in respect of soul. Tamyiz of an implied thing.","tr":"Adam gönlü hoş oldu — nefis cihetinden. Mukadder bir şeyin temyîzi."},"src":null},{"ar":"اِشْتَرَيْتُ رِطْلًا زَيْتًا.","gloss":{"en":"I bought a pound — of oil. Tamyiz after a measure.","tr":"Bir rıtl satın aldım — yağdan. Ölçüden sonra temyîz."},"src":null},{"ar":"عِشْرُونَ كِتَابًا.","gloss":{"en":"Twenty books — the counted noun after 11-99 is a singular mansub tamyiz.","tr":"Yirmi kitap — 11-99 arasında ma'dûd, mansub müfred temyîzdir."},"src":null}],"mistakes":[{"wrong":"عشرون كُتُبٍ","right":"عشرون كِتَابًا","why":{"en":"After the numbers 11-99 the counted noun is a SINGULAR tamyiz in nasb, not a plural in jarr. This is the most frequent tamyiz error.","tr":"11-99 sayılarından sonra sayılan isim, mecrûr çoğul değil, mansub TEKİL temyizdir. En sık yapılan temyiz hatasıdır."}},{"wrong":"طاب الرجلُ النفسَ","right":"طاب الرجلُ نفسًا","why":{"en":"The tamyiz must stay indefinite — definiteness would make it an object or an apposition instead.","tr":"Temyiz nekre kalmalıdır — marife yapılırsa mef'ûl veya bedel hâline gelir."}},{"wrong":"طاب الرجلُ نفسٌ","right":"طاب الرجلُ نفسًا","why":{"en":"The tamyiz is mansub; giving it raf' makes it read as a second subject of the verb.","tr":"Temyiz mansubdur; ref verilirse fiilin ikinci fâili gibi okunur."}}]},"tanazu":{"title":{"ar":"التَّنَازُعُ فِي الْعَمَلِ","en":"Tanazu': two verbs contending over one noun","tr":"Tenâzu (iki fiilin bir isimde çekişmesi)"},"level":6,"group":"nahw","explanation":{"en":"التَّنَازُع is two verbs (or quasi-verbs) followed by ONE overt noun that either could take, as its fa'il, its maf'ul, or one of each. The Kafiya's three cases: contention over the fa'il — ضَرَبَنِي وَأَكْرَمَنِي زَيْدٌ («he struck me and he honoured me — Zayd»); over the maf'ul — ضَرَبْتُ وَأَكْرَمْتُ زَيْدًا; and mixed — أَكْرَمَنِي وَضَرَبْتُ زَيْدًا. One word cannot carry two governments at once, so one verb wins the noun and the loser governs a concealed pronoun that refers to it. The schools split over who wins: the Basrans prefer the NEARER verb (its claim is adjacent), the Kufans the FIRST (its claim is earlier). The corpus follows the Basran choice, which is also the reading the received examples assume. What the reader needs in practice: when a noun after two verbs seems to belong to both, its i'rab is assigned by exactly one of them — parse it once, not twice.","tr":"التَّنَازُع: iki fiilin (yahut şibh-i fiilin) kendilerinden sonra gelen TEK bir zâhir isimde çekişmesidir — isim her ikisine fâil, her ikisine mef'ûl yahut birine fâil öbürüne mef'ûl olmaya elverişlidir. Kâfiye'nin üç sûreti: fâilde çekişme — ضَرَبَنِي وَأَكْرَمَنِي زَيْدٌ; mef'ûlde çekişme — ضَرَبْتُ وَأَكْرَمْتُ زَيْدًا; ve karışık — أَكْرَمَنِي وَضَرَبْتُ زَيْدًا. Bir kelime iki ameli birden taşıyamaz; fiillerden biri ismi alır, kaybeden ise ona râci gizli bir zamirde amel eder. Kimin kazanacağında mektepler ayrılır: Basralılar YAKIN fiili (komşuluk hakkı), Kûfeliler İLK fiili (öncelik hakkı) tercih eder. Külliyat Basra tercihini takip eder; me'sur misallerin okunuşu da budur. Okuyucu için pratik netice: iki fiilden sonra gelen isim ikisine de ait görünüyorsa, i'rabını yalnız BİRİ vermiştir — bir kere tahlil edin, iki kere değil."},"plain":{"en":"In «he struck me and honoured me — Zayd», two verbs both want زيد. Only one may govern him; the other gets a hidden pronoun instead.","tr":"«Beni dövdü ve bana ikram etti — Zeyd» cümlesinde iki fiil de زيد'i ister. Yalnız biri onda amel edebilir; öbürüne gizli bir zamir düşer."},"sources":["الكافية (ابن الحاجب) — التنازع","قطر الندى (ابن هشام)"],"examples":[{"ar":"ضَرَبَنِي وَأَكْرَمَنِي زَيْدٌ.","gloss":{"en":"Contention over the fa'il: زَيْدٌ is raf' as fa'il of the nearer verb أَكْرَمَنِي; ضَرَبَنِي keeps a hidden «he».","tr":"Fâilde tenâzu: زَيْدٌ yakın fiil أَكْرَمَنِي'nin fâili olarak merfûdur; ضَرَبَنِي'ye gizli bir «o» kalır."},"src":null},{"ar":"ضَرَبْتُ وَأَكْرَمْتُ زَيْدًا.","gloss":{"en":"Contention over the maf'ul: زَيْدًا is nasb by the nearer أَكْرَمْتُ; the first verb's object is an understood pronoun.","tr":"Mef'ûlde tenâzu: زَيْدًا yakın fiil أَكْرَمْتُ ile mensubtur; ilk fiilin mef'ûlü mukadder bir zamirdir."},"src":null}],"mistakes":[{"wrong":"ضَرَبَنِي وَأَكْرَمَنِي زَيْدًا","right":"ضَرَبَنِي وَأَكْرَمَنِي زَيْدٌ","why":{"en":"Both verbs want زيد as their FA'IL here, so whoever wins, the overt noun stands in raf'. Nasb would treat it as an object neither verb is missing.","tr":"Burada iki fiil de زيد'i FÂİL ister; hangisi kazanırsa kazansın zâhir isim merfû olur. Nasb, hiçbir fiilin aramadığı bir mef'ûl uydurmak olur."}},{"wrong":"زَيْدٌ ضَرَبَنِي وَأَكْرَمَنِي (على أنه تنازع)","right":"ضَرَبَنِي وَأَكْرَمَنِي زَيْدٌ","why":{"en":"Tanazu' requires the noun AFTER both governors. With زيد in front there is no contest — he is simply mubteda and the verbs carry his pronouns.","tr":"Tenâzu, ismin iki âmilden SONRA gelmesini ister. زيد başa geçince çekişme kalmaz — o artık mübtedâdır, fiiller onun zamirlerini taşır."}}]},"tashbih":{"title":{"ar":"التَّشْبِيه","en":"Simile — the four pillars","tr":"Teşbih ve dört rüknü"},"level":4,"group":"balagha","explanation":{"en":"A tashbih says that one thing shares a quality with another. It has four pillars: the thing compared (مُشَبَّه), the thing compared to (مُشَبَّهٌ بِهِ), the tool that joins them (أَدَاةُ التَّشْبِيه — كَ, كَأَنَّ, مِثْل, كَمَا), and the point they share (وَجْهُ الشَّبَه). «فَكُنْ مِنْهُ كَمَا أَنْتَ مِنَ النَّارِ» has all four: you and fire, joined by كَمَا, sharing the way one keeps a careful distance. The tradition grades a tashbih by how much it leaves out. Name all four and it is مُرْسَلٌ مُفَصَّل, the plainest kind. Drop the tool and it is مُؤَكَّد; drop the shared point and it is مُجْمَل; drop both — «أَنْتَ بَدْرٌ» — and you have تَشْبِيهٌ بَلِيغ, the strongest, because nothing is left between the two things. That grading is the whole craft: the more the ear has to supply, the more forceful the comparison.","tr":"Teşbih, bir şeyin başka bir şeyle bir vasıfta ortak olduğunu söyler. Dört rüknü vardır: müşebbeh, müşebbehün bih, edât (كَ، كَأَنَّ، مِثْل، كَمَا) ve vech-i şebeh. «فَكُنْ مِنْهُ كَمَا أَنْتَ مِنَ النَّارِ» dördünü de taşır: sen ve ateş, كَمَا ile birleşmiş, ortak nokta ise ölçülü mesafeyi korumaktır. Gelenek teşbihi, ne kadarını hazfettiğine göre derecelendirir. Dördü de zikredilirse mürsel-mufassaldır, en sadesi. Edât hazfedilirse müekked; vech-i şebeh hazfedilirse mücmel; ikisi birden hazfedilirse — «أَنْتَ بَدْرٌ» — teşbîh-i belîğ olur, en kuvvetlisi; çünkü iki şeyin arasında hiçbir şey kalmaz. Bu derecelendirme işin kendisidir: kulak ne kadar çok tamamlarsa teşbih o kadar tesirli olur."},"plain":{"en":"Saying one thing is like another — and the four pieces that make the comparison.","tr":"Bir şeyin başka bir şeye benzediğini söylemek ve teşbihi kuran dört rükün."},"sources":["تلخيص المفتاح (القزويني) — علم البيان","مختصر السعد"],"examples":[{"ar":"فَكُنْ مِنْهُ كَمَا أَنْتَ مِنَ النَّارِ.","gloss":{"en":"Be to him as you are to fire — all four pillars, with كَمَا as the tool.","tr":"Ona karşı ateşe karşı olduğun gibi ol — dört rükün de var, edât كَمَا."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"وَمَاؤُهُ أَبْيَضُ مِنَ اللَّبَنِ وَرِيحُهُ أَطْيَبُ مِنَ الْمِسْكِ.","gloss":{"en":"Its water whiter than milk, its scent sweeter than musk — comparison carried by the elative and مِنْ rather than by an adat.","tr":"Suyu sütten beyaz, kokusu miskten güzel — mukayese, edâtla değil ism-i tafdîl ve مِنْ ile taşınır."},"src":"aqaid-ahl-al-sunna"},{"ar":"أَنْتَ بَدْرٌ.","gloss":{"en":"You are a full moon — tool and shared point both dropped: tashbih baligh.","tr":"Sen bir dolunaysın — edât da vech-i şebeh de hazfedilmiş: teşbîh-i belîğ."},"src":null}],"mistakes":[{"wrong":"«أَنْتَ بَدْرٌ» اسْتِعَارَةٌ","right":"تَشْبِيهٌ بَلِيغٌ، لِأَنَّ الْمُشَبَّهَ مَذْكُورٌ","why":{"en":"Both sides are still named, so it is a tashbih with its tool dropped. An isti'ara names only ONE side.","tr":"İki taraf da zikredilmiştir; bu, edâtı hazfedilmiş bir teşbihtir. İstiârede taraflardan yalnız BİRİ zikredilir."}},{"wrong":"زَيْدٌ كَعَمْرٍو فِي الطُّولِ — تَشْبِيهٌ بَلِيغٌ","right":"مُرْسَلٌ مُفَصَّلٌ","why":{"en":"The tool and the shared point are both stated, which is the plainest grade, not the strongest.","tr":"Edât da vech-i şebeh de zikredilmiştir; bu en sade derecedir, en kuvvetlisi değil."}}]},"tawkid":{"title":{"ar":"التَّوْكِيد","en":"Emphasis (tawkid)","tr":"Te'kîd"},"level":4,"group":"nahw","explanation":{"en":"Tawkid is a follower that removes doubt about what precedes it, and like every tabi' it copies that word's case. It comes in two kinds. LAFZI tawkid simply repeats the word or phrase: جَاءَ زَيْدٌ زَيْدٌ. MA'NAWI tawkid uses a fixed set of words — نَفْس and عَيْن for a single thing, and كُلّ، جَمِيع، أَجْمَع for the whole of it — each made mudaf to a pronoun agreeing with what it emphasizes: جَاءَ الْقَوْمُ كُلُّهُمْ, رَأَيْتُ الْأَمِيرَ نَفْسَهُ. The point of نَفْس and عَيْن is to deny that a deputy is meant; the point of كُلّ is to deny that only a part is meant.","tr":"Te'kîd, kendinden öncekiyle ilgili şüpheyi gideren bir tâbidir ve her tâbi gibi onun i'rabını kopyalar. İki çeşittir. LAFZÎ te'kîd kelimeyi veya terkibi tekrar eder: جَاءَ زَيْدٌ زَيْدٌ. MA'NEVÎ te'kîd belirli kelimelerle yapılır — bir şeyin kendisi için نَفْس ve عَيْن, tamamı için كُلّ، جَمِيع، أَجْمَع — her biri te'kîd ettiği şeye uyan bir zamire muzâf olur: جَاءَ الْقَوْمُ كُلُّهُمْ, رَأَيْتُ الْأَمِيرَ نَفْسَهُ. نَفْس ve عَيْن'in maksadı, bir vekilin kastedilmediğini bildirmektir; كُلّ'ün maksadı ise yalnız bir kısmın kastedilmediğini bildirmektir."},"plain":{"en":"Removing doubt — by repeating the word, or by adding «himself», «all of them».","tr":"Şüpheyi kaldırmak — kelimeyi tekrarlayarak yahut «kendisi», «hepsi» gibi kelimeler ekleyerek."},"mamul":"tabai","sources":["العوامل (البيركوي) — التوابع","إظهار الأسرار (البيركوي)","الكافية (ابن الحاجب)"],"examples":[{"ar":"جَاءَ الْقَوْمُ كُلُّهُمْ.","gloss":{"en":"The people came, all of them — ma'nawi tawkid, copying the raf' of «the people».","tr":"İnsanlar geldi, hepsi — manevî te'kid, «insanlar»ın ref'ini alır."},"src":null},{"ar":"رَأَيْتُ الْأَمِيرَ نَفْسَهُ.","gloss":{"en":"I saw the commander himself — not a messenger on his behalf; the tawkid follows into nasb.","tr":"Emirin bizzat kendisini gördüm — vekilini değil; te'kid nasba da uyar."},"src":null},{"ar":"جَاءَ زَيْدٌ زَيْدٌ.","gloss":{"en":"Zayd came — Zayd! Lafzi tawkid by plain repetition.","tr":"Zeyd geldi — Zeyd! Lafzın tekrarıyla lafzî te'kid."},"src":null}],"mistakes":[{"wrong":"جاء القومُ كلَّهم","right":"جَاءَ الْقَوْمُ كُلُّهُمْ","why":{"en":"Tawkid is a tabi': it copies the case of what it emphasizes. After a marfu' it is marfu', not mansub.","tr":"Te'kîd bir tâbidir: te'kîd ettiği kelimenin i'rabını alır. Merfûdan sonra merfû olur, mansub değil."}},{"wrong":"رأيتُ الأميرَ نفسٌ","right":"رَأَيْتُ الْأَمِيرَ نَفْسَهُ","why":{"en":"Ma'nawi tawkid must be mudaf to a pronoun matching the emphasized word; without that pronoun it is not tawkid at all.","tr":"Ma'nevî te'kîd, te'kîd edilen kelimeye uyan bir zamire muzâf olmalıdır; o zamir olmadan te'kîd sayılmaz."}},{"wrong":"جاء رجلٌ نفسُهُ","right":"جَاءَ الرَّجُلُ نَفْسُهُ","why":{"en":"What is emphasized is normally definite: emphasizing an indefinite says nothing, since there was no particular thing to be doubted.","tr":"Te'kîd edilen kelime çoğunlukla marifedir: nekreyi te'kîd etmek bir şey ifade etmez, çünkü şüphe edilecek belirli bir şey yoktur."}}]},"thulathi-mujarrad-babs":{"title":{"ar":"أَبْوَابُ الثُّلَاثِيِّ الْمُجَرَّد","en":"The six babs of the bare triliteral","tr":"Sülâsî mücerredin altı bâbı"},"level":2,"group":"sarf","explanation":{"en":"Every bare three-letter verb belongs to one of exactly six babs, and the bab is fixed by ONE thing: the vowel on the middle radical in the past and in the present. That pair is the bab's «sign» (عَلَامَة), and the pattern verb is its name. (1) نَصَرَ يَنْصُرُ — fatha then damma. (2) ضَرَبَ يَضْرِبُ — fatha then kasra. (3) فَتَحَ يَفْتَحُ — fatha then fatha, and this one has a condition: the middle or last radical must be a throat letter (ء ه ع ح غ خ), which is why فَتَحَ and ذَهَبَ qualify. (4) عَلِمَ يَعْلَمُ — kasra then fatha. (5) كَرُمَ يَكْرُمُ — damma then damma, and this bab alone is ALWAYS intransitive; it is the bab of settled qualities, حَسُنَ, كَبُرَ, صَغُرَ. (6) حَسِبَ يَحْسِبُ — kasra then kasra, the rarest. The first four and the sixth are usually transitive and sometimes intransitive. You cannot derive the bab from the letters: قَعَدَ is bab 1 and جَلَسَ is bab 2 though they mean the same thing. The bab is learned with the word, which is why every verb in this app carries its bab on the Conjugation tab.","tr":"Her sülâsî mücerred fiil tam olarak altı bâbdan birine girer ve bâbı TEK bir şey belirler: ayne'l-fiilin mâzideki ve muzârideki harekesi. Bu ikili bâbın «alâmet»idir, vezin fiili de adıdır. (1) نَصَرَ يَنْصُرُ — fetha, sonra damme. (2) ضَرَبَ يَضْرِبُ — fetha, sonra kesre. (3) فَتَحَ يَفْتَحُ — fetha, fetha; bunun bir şartı vardır: ayne'l-fiil yahut lâme'l-fiil hurûf-ı halktan (ء ه ع ح غ خ) olmalıdır; فَتَحَ ve ذَهَبَ bu yüzden bu bâbdandır. (4) عَلِمَ يَعْلَمُ — kesre, sonra fetha. (5) كَرُمَ يَكْرُمُ — damme, damme; yalnız bu bâb DAİMA lâzımdır, yerleşik vasıfların bâbıdır: حَسُنَ، كَبُرَ، صَغُرَ. (6) حَسِبَ يَحْسِبُ — kesre, kesre; en az kullanılanıdır. Beşinci dışındakiler çok kere müteaddî, bazen lâzımdır. Bâb harflerden çıkarılamaz: قَعَدَ birinci, جَلَسَ ikinci bâbdandır, hâlbuki manaları aynıdır. Bâb kelimeyle birlikte öğrenilir; uygulamadaki her fiilin Çekim sekmesinde bâbının yazılı olmasının sebebi budur."},"plain":{"en":"Every plain three-letter verb belongs to one of six families, and the family — not the dictionary — tells you the vowel on its present tense.","tr":"Her sülâsî mücerred fiil altı bâbdan birine girer; muzârisinin harekesini sözlük değil, bâbı söyler."},"sources":["الأمثلة المختلفة","بناء الأفعال","مراح الأرواح","المقصود"],"examples":[{"ar":"نَظَرَ يَنْظُرُ — مِنْ بَابِ نَصَرَ.","gloss":{"en":"«He looked» — bab 1, fatha then damma.","tr":"«Baktı» — birinci bâb, fetha sonra damme."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"جَلَسَ يَجْلِسُ — مِنْ بَابِ ضَرَبَ.","gloss":{"en":"«He sat» — bab 2, fatha then kasra, though قَعَدَ with the same meaning is bab 1.","tr":"«Oturdu» — ikinci bâb, fetha sonra kesre; hâlbuki aynı manadaki قَعَدَ birinci bâbdandır."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"ذَهَبَ يَذْهَبُ — مِنْ بَابِ فَتَحَ.","gloss":{"en":"«He went» — bab 3; the ه is a throat letter, which is what admits it.","tr":"«Gitti» — üçüncü bâb; ه hurûf-ı halktandır, bâba girmesini sağlayan da budur."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"صَغُرَ يَصْغُرُ — مِنْ بَابِ كَرُمَ.","gloss":{"en":"«He became small» — bab 5, always intransitive, always a quality.","tr":"«Küçüldü» — beşinci bâb, daima lâzım, daima bir vasıf."},"src":"wasiyyat-abi-yusuf-L5"}],"mistakes":[{"wrong":"ضَرَبَ يَضْرُبُ","right":"ضَرَبَ يَضْرِبُ","why":{"en":"The bab is not a choice. ضَرَبَ is bab 2 and its present takes kasra; changing the vowel changes the word into one that does not exist.","tr":"Bâb keyfî değildir. ضَرَبَ ikinci bâbdandır, muzârisi kesre alır; hareke değişince kelime var olmayan bir şekle döner."}},{"wrong":"كَرُمَ الرَّجُلُ الضَّيْفَ","right":"أَكْرَمَ الرَّجُلُ الضَّيْفَ","why":{"en":"Bab 5 never takes an object. To make it transitive you must move the verb to bab IV: أَكْرَمَ.","tr":"Beşinci bâb mef'ûl almaz. Müteaddî yapmak için fiili if'âl bâbına nakletmek gerekir: أَكْرَمَ."}},{"wrong":"كَتَبَ يَكْتَبُ","right":"كَتَبَ يَكْتُبُ","why":{"en":"Bab 3's fatha-fatha needs a throat letter in the middle or last radical. ك ت ب has none, so كَتَبَ is bab 1.","tr":"Üçüncü bâbın fetha-fethası için ayn yahut lâmda hurûf-ı halktan bir harf gerekir. ك ت ب'de yoktur, dolayısıyla كَتَبَ birinci bâbdandır."}}]},"tibaq":{"title":{"ar":"الطِّبَاق (المُطَابَقَة)","en":"Tibaq — joining a word to its opposite","tr":"Tıbâk (mutâbakat) — bir lafzı zıddıyla birleştirmek"},"level":5,"group":"balagha","explanation":{"en":"Badi' is the third of the three sciences of balagha: after the sense is sound (ma'ani) and the image is clear (bayan), badi' asks what makes the wording beautiful. Its embellishments are of two kinds — of meaning (مَعْنَوِيَّة) and of wording (لَفْظِيَّة) — and the first of the meaning ones is tibaq: bringing two contrary meanings together in a single passage. It is also called المُطَابَقَة and التَّضَادّ. The book sorts it twice over. First by what is paired: two nouns («وَتَحْسَبُهُمْ أَيْقَاظًا وَهُمْ رُقُودٌ»), two verbs («يُحْيِي وَيُمِيتُ»), two particles («لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ»), or two words of different kinds — a noun against a verb, «أَوَمَنْ كَانَ مَيْتًا فَأَحْيَيْنَاهُ». Second by how the opposition is made: طِبَاقُ الإِيجَابِ when both sides are affirmed, and طِبَاقُ السَّلْبِ when one and the same word appears once affirmed and once negated — «وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ · يَعْلَمُونَ ظَاهِرًا مِنَ الْحَيَاةِ الدُّنْيَا». Near-opposites are admitted too. When the two are not strictly contrary but the wording makes them look so — laughter said of grey hair set against weeping — the tradition calls it إِيهَامُ التَّضَادِّ and still counts it under tibaq. Keep one boundary firm: tibaq sets one thing against one thing. The moment a whole set is answered by a whole set, in order, it is muqabala.","tr":"Bedî', belâgatin üç ilminden üçüncüsüdür: mana sağlam (meânî), tasvir açık (beyân) olduktan sonra bedî', lafzı güzelleştiren vecihleri sorar. Bu vecihler iki kısımdır — muhassinât-ı ma'neviyye ve lafziyye — ma'nevî olanların ilki tıbâktır: bir sözde birbirine zıt iki manayı bir araya getirmek. Buna mutâbakat ve tezâd da denir. Kitap bunu iki yönden taksim eder. Önce neyin eşleştiğine göre: iki isim («وَتَحْسَبُهُمْ أَيْقَاظًا وَهُمْ رُقُودٌ»), iki fiil («يُحْيِي وَيُمِيتُ»), iki harf («لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ»), yahut iki ayrı nevden iki lafız — isim karşısında fiil: «أَوَمَنْ كَانَ مَيْتًا فَأَحْيَيْنَاهُ». Sonra zıtlığın nasıl kurulduğuna göre: iki taraf da müsbet ise tıbâku'l-îcâb; aynı lafız bir yerde müsbet bir yerde menfî gelirse tıbâku's-selb — «وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ · يَعْلَمُونَ ظَاهِرًا مِنَ الْحَيَاةِ الدُّنْيَا». Tam zıt olmayanlar da kabul edilir: hakikatte zıt olmadığı hâlde lafız onları zıt gösteriyorsa — ihtiyarlığın «gülmesi» ağlamanın karşısına konulduğu gibi — buna îhâmü't-tezâd denir ve yine tıbâktan sayılır. Bir sınırı sabit tut: tıbâk bir şeyi bir şeyin karşısına koyar. Bir küme, sırasıyla başka bir kümeyle karşılandığı anda o artık mukâbeledir."},"plain":{"en":"Putting a word next to its opposite: near and far, secret and open.","tr":"Bir kelimeyi zıddının yanına koymak: yakın ve uzak, gizli ve açık."},"sources":["تلخيص المفتاح (القزويني) — علم البديع، المحسنات المعنوية","مختصر السعد"],"examples":[{"ar":"الْفِقْهُ مَعْرِفَةُ النَّفْسِ مَا لَهَا وَمَا عَلَيْهَا عَمَلًا.","gloss":{"en":"Tibaq between two particles — لَهَا against عَلَيْهَا — exactly the harf case the Talkhis cites. The definition of fiqh is built on it: what counts for you and what counts against you.","tr":"İki harf arasında tıbâk — لَهَا karşısında عَلَيْهَا — Telhîs'in zikrettiği harf misalinin aynısı. Fıkhın tarifi bunun üzerine kurulmuştur: lehine olan ve aleyhine olan."},"src":"mukhtasar-al-manar"},{"ar":"بَلْ تَقَرَّبْ إِلَيْهِ فَقَطْ وَتَبَاعَدْ عَنْ حَاشِيَتِهِ.","gloss":{"en":"Two verbs: تَقَرَّبْ against تَبَاعَدْ. Draw near, keep away — the advice is the opposition itself.","tr":"İki fiil: تَقَرَّبْ karşısında تَبَاعَدْ. Yaklaş, uzak dur — nasihatin kendisi bu zıtlıktır."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"وَكُنْ لِلَّهِ فِي سِرِّكَ كَمَا أَنْتَ لَهُ فِي عَلَانِيَتِكَ.","gloss":{"en":"Two nouns: سِرّ against عَلَانِيَة, the hidden life against the public one.","tr":"İki isim: سِرّ karşısında عَلَانِيَة, gizli hâl karşısında açık hâl."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"فَإِنَّ السُّلْطَانَ لَا يَرَى لِأَحَدٍ مَا يَرَى لِنَفْسِهِ.","gloss":{"en":"Tibaq al-salb: one and the same verb يَرَى, first negated and then affirmed.","tr":"Tıbâku's-selb: aynı fiil يَرَى, önce menfî sonra müsbet gelmiştir."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"وَالْمُحْدَثُ هُوَ الْمُخْرَجُ مِنَ الْعَدَمِ إِلَى الْوُجُودِ.","gloss":{"en":"الْعَدَم against الْوُجُود — and the two prepositions مِنْ / إِلَى carry the same opposition a second time.","tr":"الْعَدَم karşısında الْوُجُود — ve مِنْ / إِلَى harfleri aynı zıtlığı ikinci defa taşır."},"src":"aqaid-ahl-al-sunna"},{"ar":"لِأَنَّهُ يُصَيِّرُ الْقَلِيلَ مِنَ الْأَفْعَالِ كَثِيرًا.","gloss":{"en":"الْقَلِيل against كَثِيرًا, the two objects of a verb of transformation — the point of tasrif stated as an opposition.","tr":"الْقَلِيل karşısında كَثِيرًا; tasyîr fiilinin iki mefûlü — sarfın gayesi bir zıtlıkla ifade edilmiş."},"src":"min-muqaddimat-al-maqsud"},{"ar":"مَنْ لَمْ يَرْحَمْ صَغِيرَنَا وَلَمْ يُوَقِّرْ كَبِيرَنَا فَلَيْسَ مِنَّا.","gloss":{"en":"صَغِير against كَبِير. Note that this is tibaq, not muqabala: each pair is one word against one word, and the two clauses are not counterparts but a single condition repeated.","tr":"صَغِير karşısında كَبِير. Bunun mukâbele değil tıbâk olduğuna dikkat et: eşleşme bir lafza karşı bir lafızdır; iki cümle birbirinin mukâbili değil, tek şartın tekrarıdır."},"src":"wasiyyat-abi-yusuf-L5"}],"mistakes":[{"wrong":"«مَنْ أَطَاعَنِي دَخَلَ الْجَنَّةَ وَمَنْ عَصَانِي فَقَدْ أَبَى» طِبَاقٌ","right":"مُقَابَلَةٌ، لِأَنَّ الْمُقَابَلَ جُمْلَتَانِ لَا لَفْظَانِ","why":{"en":"Two meanings are set out and then two counterparts follow them in order — obeying and entering, disobeying and refusing. Tibaq is one word against one word; a set answered by a set is muqabala.","tr":"İki mana zikredilip ardından sırasıyla iki mukâbili gelmiştir — itaat ve girmek, isyan ve imtinâ. Tıbâk bir lafza karşı bir lafızdır; bir kümeye karşı küme gelirse o mukâbeledir."}},{"wrong":"«الْبَيْعُ مُبَادَلَةُ مَالٍ بِمَالٍ» طِبَاقٌ","right":"تَكْرَارٌ، وَلَا طِبَاقَ فِيهِ","why":{"en":"The same word repeated is not its own opposite. Tibaq needs two contrary meanings, not one meaning said twice.","tr":"Aynı lafzın tekrarı kendi zıddı değildir. Tıbâk için birbirine zıt iki mana gerekir; bir mananın iki kere söylenmesi yetmez."}},{"wrong":"طِبَاقُ السَّلْبِ يَكُونُ بَيْنَ لَفْظَيْنِ مُخْتَلِفَيْنِ أَحَدُهُمَا مَنْفِيٌّ","right":"طِبَاقُ السَّلْبِ يَكُونُ بِاللَّفْظِ الْوَاحِدِ: مُثْبَتًا وَمَنْفِيًّا","why":{"en":"«لَا تَخْشَوُا النَّاسَ وَاخْشَوْنِ» is tibaq al-salb because خشي is the same verb twice. A negated word set against a different word is ordinary tibaq al-ijab, if it is tibaq at all.","tr":"«لَا تَخْشَوُا النَّاسَ وَاخْشَوْنِ» tıbâku's-selbdir; çünkü خشي aynı fiildir. Menfî bir lafzın başka bir lafızla karşılanması ise — tıbâk sayılırsa — âdî tıbâku'l-îcâbdır."}}]},"vocative-munada":{"title":{"ar":"النِّدَاءُ وَالْمُنَادَى","en":"The vocative and its five kinds","tr":"Nidâ ve münâdânın beş çeşidi"},"level":2,"group":"nahw","explanation":{"en":"The particles are يَا (for near and far alike), أَيَا and هَيَا (for the far), أَيْ and the bare أَ (for the near), and وَا (for lament). Whichever is used, the books read the whole call as the object of an omitted verb: أَدْعُو زَيْدًا. That single idea decides the entire chapter. The munada comes in FIVE kinds, and they split two against three. MABNI — fixed, with the nasb only «by position»: (1) الْمُفْرَدُ الْعَلَمُ, a single proper name, يَا يُوسُفُ; (2) النَّكِرَةُ الْمَقْصُودَةُ, an indefinite you mean of somebody in particular, يَا وَلَدُ said to the child in front of you. MANSUB — really, visibly mansub: (3) الْمُضَافُ, يَا عَبْدَ اللهِ; (4) الشَّبِيهُ بِالْمُضَافِ, a munada carrying a word it governs, يَا طَالِعًا جَبَلًا; (5) النَّكِرَةُ غَيْرُ الْمَقْصُودَةِ, an indefinite meant of nobody in particular, يَا رَجُلًا خُذْ بِيَدِي, which alone KEEPS its tanwin. Now the sentence that the whole chapter turns on: يُبْنَى الْمُنَادَى عَلَى مَا يُرْفَعُ بِهِ — the fixed munada is built on WHAT WOULD HAVE RAISED IT, not simply on the damma. So a dual is fixed on its ALIF (يَا مُسْلِمَانِ) and a sound masculine plural on its WAW (يَا مُسْلِمُونَ), exactly the letters that raise them in the chapter on الْإِعْرَابُ بِالْحُرُوفِ. A noun with الـ is never called with يَا straight: أَيُّ (masc.) or أَيَّة (fem.) goes between and takes the call on itself — يَا أَيُّهَا الطَّالِبُ, where أَيّ is the munada fixed on the damma, هَا is a particle of drawing near, and الطَّالِبُ follows it as a na't in raf'. The Name is the exception heard from the Arabs, يَا اللهُ, and it has its own contracted form: اللَّهُمَّ, where the doubled mim at the end stands in for the particle at the front. Three chapters hang off the vocative. الِاسْتِغَاثَةُ, appealing for help: يَا لَلْمُسْلِمِينَ — the one appealed to takes a FATHA-bearing lam and is majrur by it, while the one appealed FOR takes a kasra-bearing lam. النَّدْبَةُ, lament: وَا زَيْدَاهْ, with the alif of grief and the ha of pause hung on the end. And التَّرْخِيمُ, lopping the last letter off a called name — يَا حَارِ for يَا حَارِثُ. Tarkhim is licensed for a proper name of more than three letters, and for ANY word ending in ta marbuta even if it is short and no name at all (يَا فَاطِمَ). Where a long vowel is left bare with three sound letters standing before it, it falls too: عُثْمَانُ → يَا عُثْمَ، مَنْصُورُ → يَا مَنْصُ. Two dialects then part company over what is left: لُغَةُ مَنْ يَنْتَظِرُ leaves the remainder wearing the vowel it already had, as though the dropped letter were still coming (يَا حَارِ), while لُغَةُ مَنْ لَا يَنْتَظِرُ treats the remainder as a fresh munada mufrad and builds it on the damma (يَا حَارُ).","tr":"Nidâ harfleri şunlardır: يَا (yakına da uzağa da), أَيَا ve هَيَا (uzağa), أَيْ ve yalın أَ (yakına), bir de وَا (nedbe için). Hangisi olursa olsun kitaplar bütün nidâyı mahzuf bir fiilin mef'ûlü sayar: أَدْعُو زَيْدًا. Bu tek fikir bütün bahsi tayin eder. Münâdâ BEŞ çeşittir ve ikiye üç ayrılır. MEBNÎ olanlar — nasbı yalnız «mahallen»: (1) MÜFRED ALEM, tek kelimelik özel isim, يَا يُوسُفُ; (2) NEKİRE-İ MAKSÛDE, muayyen birini kastettiğiniz nekire; önünüzdeki çocuğa يَا وَلَدُ demeniz gibi. MANSUB olanlar — gerçekten, görünür şekilde mansub: (3) MUZÂF, يَا عَبْدَ اللهِ; (4) ŞEBÎH Bİ'L-MUZÂF, kendisinden sonrakine amel eden münâdâ, يَا طَالِعًا جَبَلًا; (5) NEKİRE-İ GAYR-İ MAKSÛDE, hiç kimseyi kastetmeyen nekire, يَا رَجُلًا خُذْ بِيَدِي — ki tenvinini KORUYAN yalnız budur. Şimdi bütün bahsin döndüğü cümle: يُبْنَى الْمُنَادَى عَلَى مَا يُرْفَعُ بِهِ — mebnî münâdâ, sadece damme üzere değil, KENDİSİYLE MERFÛ OLACAĞI ŞEY üzere mebnîdir. Öyleyse tesniye ELİFİ üzere (يَا مُسْلِمَانِ), cem'-i müzekker-i sâlim VÂVI üzere (يَا مُسْلِمُونَ) mebnî olur — «harfle i'râb» bahsinde onları ref eden harflerin ta kendisi. الـ'lı bir isme يَا ile doğrudan seslenilmez: araya أَيُّ (eril) yahut أَيَّة (dişil) girer ve nidâyı kendi üstlenir — يَا أَيُّهَا الطَّالِبُ; burada أَيّ damme üzere mebnî münâdâ, هَا tenbih harfi, الطَّالِبُ ise ona tâbi merfû na't'tır. Lafza-i celâl Arap'tan işitilmiş bir istisnadır, يَا اللهُ; bir de kendine mahsus muhtasar şekli vardır: اللَّهُمَّ — sondaki şeddeli mîm, baştaki harfin yerini tutar. Nidâya üç bahis bağlanır. İSTİGÂSE, yardıma çağırmak: يَا لَلْمُسْلِمِينَ — kendisinden yardım istenen FETHALI lâm alır ve onunla mecrûr olur; kendisi için yardım istenen ise kesralı lâm alır. NEDBE, ağıt: وَا زَيْدَاهْ; sona elif-i nedbe ile hâ-i sekt eklenir. Ve TERHÎM, çağrılan ismin sonundan bir harf kırpmak — يَا حَارِثُ yerine يَا حَارِ. Terhîm, üç harften fazla alem için ve tâ-i te'nîs ile biten HER kelime için — kısa olsa ve alem olmasa bile — câizdir (يَا فَاطِمَ). Geride açıkta kalan med harfinin önünde üç sahih harf duruyorsa o da düşer: عُثْمَانُ → يَا عُثْمَ، مَنْصُورُ → يَا مَنْصُ. Sonra iki lugat, kalan üzerinde ayrılır: BEKLEYENİN LUGATİ kalanı zate
