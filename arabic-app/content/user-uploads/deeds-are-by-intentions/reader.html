function sarfAudit(){
  const out = { checked: 0, skipped: 0, bad: [] };
  const seen = new Set();
  STORIES.forEach(st => Object.entries(st.morph || {}).forEach(([lex, m]) => {
    if (m.jamid || seen.has(lex)) return;
    seen.add(lex);
    const e = st.glossary[lex];
    const cls = nakilClass(e);
    if (!cls) { out.skipped++; return; }
    const at = sjAttested(m);
    if (!at) { out.skipped++; return; }
    const { form, bab } = at;
    const g = sarfDerive(cls, form, bab);
    if (!g.ok) { out.skipped++; return; }
    out.checked++;
    const diffs = [];
    [["mazi", 14], ["mudari", 14], ["amr", 6]].forEach(([k, n]) => {
      for (let i = 0; i < n; i++)
        if (sjN(g[k][i]) !== sjN(m[k][i])) diffs.push(`${k}[${i}] ${g[k][i]}≠${m[k][i]}`);
    });
    ["mansub", "majzum", "majzum2"].forEach(k => {
      if (m[k] && sjN(g[k]) !== sjN(m[k])) diffs.push(`${k} ${g[k]}≠${m[k]}`);
    });
    if (diffs.length) out.bad.push(lex + ": " + diffs.slice(0, 4).join("; "));
  }));
  return out;
}

// ---------- the Aded engine (أَسْمَاءُ الْعَدَدِ) ----------
// The number chapter as a machine, specified by the uploaded أسماء عدد
// worksheets (research/sources/esmai-aded-worksheets.txt — the smoke suite
// replays the handwritten table against this class, cell for cell) and the
// madrasah rules: composition order thousands، hundreds، UNITS، tens —
// units before tens — joined by و; hundreds multiples written joined
// (ثَلَاثُمِائَةٍ); 11–19 one block. Polarity: after 3–10 a masculine counted
// noun takes the ta-form of the number and a feminine drops it. The ma'dud
// follows the LAST number uttered: jam' majrur after 3–10, mufrad mansub
// after 11–99, mufrad majrur in idafa after the hundreds and thousands.
class AdadEngine {
  static UNITS_M = ["وَاحِدٌ","اِثْنَانِ","ثَلَاثَةٌ","أَرْبَعَةٌ","خَمْسَةٌ","سِتَّةٌ","سَبْعَةٌ","ثَمَانِيَةٌ","تِسْعَةٌ","عَشَرَةٌ"];
  static UNITS_F = ["وَاحِدَةٌ","اِثْنَتَانِ","ثَلَاثٌ","أَرْبَعٌ","خَمْسٌ","سِتٌّ","سَبْعٌ","ثَمَانٍ","تِسْعٌ","عَشْرٌ"];
  static TEEN_M = ["أَحَدَ عَشَرَ","اِثْنَا عَشَرَ","ثَلَاثَةَ عَشَرَ","أَرْبَعَةَ عَشَرَ","خَمْسَةَ عَشَرَ",
                   "سِتَّةَ عَشَرَ","سَبْعَةَ عَشَرَ","ثَمَانِيَةَ عَشَرَ","تِسْعَةَ عَشَرَ"];
  static TEEN_F = ["إِحْدَى عَشْرَةَ","اِثْنَتَا عَشْرَةَ","ثَلَاثَ عَشْرَةَ","أَرْبَعَ عَشْرَةَ","خَمْسَ عَشْرَةَ",
                   "سِتَّ عَشْرَةَ","سَبْعَ عَشْرَةَ","ثَمَانِيَ عَشْرَةَ","تِسْعَ عَشْرَةَ"];
  static TENS = ["عِشْرُونَ","ثَلَاثُونَ","أَرْبَعُونَ","خَمْسُونَ","سِتُّونَ","سَبْعُونَ","ثَمَانُونَ","تِسْعُونَ"];
  static HUNDREDS = ["مِائَةٌ","مِائَتَانِ","ثَلَاثُمِائَةٍ","أَرْبَعُمِائَةٍ","خَمْسُمِائَةٍ",
                     "سِتُّمِائَةٍ","سَبْعُمِائَةٍ","ثَمَانِمِائَةٍ","تِسْعُمِائَةٍ"];
  static THOUSANDS = ["أَلْفٌ","أَلْفَانِ","ثَلَاثَةُ آلَافٍ","أَرْبَعَةُ آلَافٍ","خَمْسَةُ آلَافٍ",
                      "سِتَّةُ آلَافٍ","سَبْعَةُ آلَافٍ","ثَمَانِيَةُ آلَافٍ","تِسْعَةُ آلَافٍ"];
  // the ordered components of n — each knows which ma'dud rule it carries
  static parts(n, fem){
    if (!Number.isInteger(n) || n < 1 || n > 9999) return null;
    const out = [];
    const th = Math.floor(n / 1000), hu = Math.floor((n % 1000) / 100), rest = n % 100;
    if (th) out.push({ kind: th < 3 ? "alf" : "alf3", text: this.THOUSANDS[th - 1] });
    if (hu) out.push({ kind: hu < 3 ? "mia" : "mia3", text: this.HUNDREDS[hu - 1] });
    if (rest) {
      const U = fem ? this.UNITS_F : this.UNITS_M;
      if (rest <= 10) out.push({ kind: rest <= 2 ? "u12" : "u310", text: U[rest - 1] });
      else if (rest < 20) out.push({ kind: "teen", text: (fem ? this.TEEN_F : this.TEEN_M)[rest - 11] });
      else {
        const u = rest % 10, t = Math.floor(rest / 10);
        if (u) out.push({ kind: "u-comp", text: U[u - 1] });
        out.push({ kind: "ten", text: this.TENS[t - 2] });

    }
    return out;
  }
  // the absolute number-name, exactly as the worksheets compose it
  static name(n, fem){
    const p = this.parts(n, !!fem);
    return p ? p.map(x => x.text).join(" وَ").normalize("NFC") : null;
  }
  // a component's idafa (mudaf) form: the tanwin leaves, a dual drops its nun
  static idafa(part){
    return part.text
      .replace(/مِائَتَانِ$/, "مِائَتَا").replace(/أَلْفَانِ$/, "أَلْفَا")
      .replace(/ثَمَانٍ$/, "ثَمَانِي")
      .replace(/ٌ$/, "ُ").replace(/ٍ$/, "ِ");
  }
  // the counted phrase: number + ma'dud with the rule of the LAST part
  static phrase(n, noun){
    const p = this.parts(n, noun.fem);
    if (!p) return null;
    if (n === 1) return { text: noun.sg + " " + (noun.fem ? "وَاحِدَةٌ" : "وَاحِدٌ"), rule: "u12" };
    if (n === 2) return { text: noun.du + " " + (noun.fem ? "اِثْنَتَانِ" : "اِثْنَانِ"), rule: "u12" };
    const last = p[p.length - 1], head = p.slice(0, -1).map(x => x.text).join(" وَ");
    const join = head ? head + " وَ" : "";
    let text, rule;
    if (last.kind === "u310") { text = join + this.idafa(last) + " " + noun.plMajrur; rule = "u310"; }
    else if (last.kind === "teen") { text = join + last.text + " " + noun.mansub; rule = "teen"; }
    else if (last.kind === "ten") { text = join + last.text + " " + noun.mansub; rule = "ten"; }
    else if (last.kind === "u12") {
      // ‎101 books: the hundred takes the noun in idafa, the unit repeats it —
      // مِائَةُ كِتَابٍ وَكِتَابٌ.
      const prev = p[p.length - 2];
      text = p.slice(0, -2).map(x => x.text).join(" وَ");
      text = (text ? text + " وَ" : "") + this.idafa(prev) + " " + noun.majrur + " وَ" +
             (last.text === (noun.fem ? "اِثْنَتَانِ" : "اِثْنَانِ") ? noun.du : noun.sg);
      rule = "u12";
    }
    else { text = join + this.idafa(last) + " " + noun.majrur; rule = "mia"; }
    return { text: text.normalize("NFC"), rule };
  }
}

// Form I only, and only where a rule actually fired; every step carries the

function ilalSteps(cls, bab, mazi, mudari){

    tr: "İllet harfi harekeli, öncesi fethalı olunca elife çevrildi.",

    return [{ asl: sjN(cls.rs[0]+"َ"+cls.rs[1]+"ِ"+cls.rs[2]), now: mazi,
      ar: soundHollowNote(shKey),
      en: `No i'lal runs here: this is one of the verbs of defect and colour (${e.en}). Its masdar فَعَل is sound and its ism fa'il rides أَفْعَل, so the weak letter stays where it is.`,

    S.push({ asl: sjN("يَ" + f + "ْ" + a + V.v2 + l + "ُ"), now: mudari,

      en: "The vowel sat heavy on the weak letter, so it was carried back to the quiescent letter before it.",
      tr: "Hareke illet harfine ağır geldi; öncesindeki sâkine nakledildi." });

    if (bab !== 4)

// order to an underlying form (الأصل) until nothing fires. That is an
// algorithm, so it is written as one here. Each rule is a pure test/apply
// pair over the word parsed into (letter, marks) units, and derive() records
// every firing — the chain a Maksud student recites out loud.
//
// The order matters and is the books' own: naql before qalb, qalb before
// the meeting of two sakins, and the vowel-harmony that PROVES what was

    fail:   { ar: "فَاعِلٌ",   asl: (f, a, l) => f + "َا" + a + "ِ" + l + "ٌ" },
    maful:  { ar: "مَفْعُولٌ", asl: (f, a, l) => "مَ" + f + "ْ" + a + "ُو" + l + "ٌ" },
    alat:   { ar: "مِفْعَالٌ", asl: (f, a, l) => "مِ" + f + "ْ" + a + "َا" + l + "ٌ" },
    zaman:  { ar: "مَفْعَلٌ",  asl: (f, a, l) => "مَ" + f + "ْ" + a + "َ" + l + "ٌ" },
    tafdil: { ar: "أَفْعَلُ",   asl: (f, a, l) => "أَ" + f + "ْ" + a + "َ" + l + "ُ" },
    mudari: { ar: "يَفْعِلُ",   asl: (f, a, l) => "يَ" + f + "ْ" + a + "ِ" + l + "ُ" },
  };
  // ---- where the rules are told to stand down -------------------------
  // The rules above are qiyasi and they over-apply. The books name places
  // where a weak letter stays SOUND, and those places are of two kinds.
  // (1) A WAZN rule, which is derivable: the elative and the wonder-verb on
  // أَفْعَل are never i'lal'd, because the shape itself is the meaning and
  // i'lal would destroy it — أَقْوَلُ مِنْهُ, مَا أَقْوَلَهُ. (2) A LEXICAL set,
  // which is not: whether a root means a defect or a colour is something you
  // know, not something you compute, and the same goes for the handful of
  // Form VIII/X verbs the Arabs preserved (اِعْتَوَرَ، اِسْتَحْوَذَ). So the
  // wazn rule is coded and the lexical set is stored — the project's line.
  static SAHIH_SHAPES = { tafdil: true, taajjub: true };
  static SAHIH_ROOTS = {
    "عور": { ar: "الْعَوَر", en: "one-eyedness", tr: "tek gözlülük" },
    "حول": { ar: "الْحَوَل", en: "a squint", tr: "şaşılık" },
    "صيد": { ar: "الصَّيَد", en: "a stiff neck", tr: "boyun tutukluğu" },
    "غيد": { ar: "الْغَيَد", en: "softness of limb", tr: "endam yumuşaklığı" },
    "هيف": { ar: "الْهَيَف", en: "slenderness of waist", tr: "ince bellilik" },
    "حور": { ar: "الْحَوَر", en: "deep blackness of the eye", tr: "gözün siyahlığı" },
  };
  // Would any rule fire on this root+shape, and SHOULD it? Returns a refusal
  // with its reason, or null to let the rules run.
  static blocked(root, shape){
    const key = (root || "").normalize("NFC").replace(/[^ء-ي]/g, "").replace(/ى/g, "ي");
    if (this.SAHIH_SHAPES[shape])
      return { why: "wazn",
        ar: "أَفْعَلُ التَّفْضِيلِ وَفِعْلُ التَّعَجُّبِ لَا يُعَلَّانِ — الصِّيغَةُ نَفْسُهَا هِيَ الْمَعْنَى، وَالْإِعْلَالُ يَهْدِمُهَا.",
        en: "The elative and the wonder-verb are never i'lal'd: the SHAPE is the meaning here, and i'lal would destroy it — أَقْوَلُ مِنْهُ، مَا أَقْوَلَهُ.",
        tr: "İsm-i tafdîl ile taaccüb fiili i'lâl edilmez: burada mana bizzat SÎGADIR, i'lâl onu yıkar — أَقْوَلُ مِنْهُ، مَا أَقْوَلَهُ." };
    const e = this.SAHIH_ROOTS[key];
    if (e && (shape === "fail" || shape === "maful"))
      return { why: "lexical", entry: e,
        ar: `أَفْعَالُ الْعُيُوبِ وَالْأَلْوَانِ لَا تُعَلُّ: ${e.ar} مَصْدَرٌ صَحِيحٌ، وَاسْمُ الْفَاعِلِ عَلَى أَفْعَلَ لَا عَلَى فَاعِلٍ.`,
        en: `A verb of defect or colour keeps its weak letter SOUND (${e.en}): its masdar فَعَل is sound and its ism fa'il rides أَفْعَل, not فَاعِل. Which roots carry that meaning is lexical — nothing derives it.`,
        tr: `Uyûb ve elvân fiilleri i'lâl edilmez (${e.tr}): masdarı فَعَل sahihtir, ism-i fâili فَاعِل değil أَفْعَل vezninde gelir. Hangi kökün bu manayı taşıdığı lugavîdir — hiçbir kaide onu türetmez.` };
    return null;
  }
  static build(root, shape){
    const rs = (root || "").normalize("NFC").replace(/[^ء-ي]/g, "").split("");
    const S = this.SHAPES[shape];
    if (!S || rs.length !== 3) return null;
    const asl = S.asl(rs[0], rs[1], rs[2]);
    const stop = this.blocked(root, shape);
    // A blocked derivation still SHOWS its origin — the learner needs to see
    // the form the rules would have eaten, and the reason they were refused.
    if (stop) return { shape, wazn: S.ar, asl, out: asl, steps: [], blocked: stop };
    const d = this.derive(asl);
    return d && { shape, wazn: S.ar, ...d };
  }
  static derive(asl, opts = {}){
    const only = opts.only || null;
    let u = this.parse(asl);
    if (!u.length) return null;
    this._pend = null;
    const steps = [];
    for (let guard = 0; guard < 12; guard++) {
      let fired = null;
      for (const r of this.RULES) {
        if (only && !only.includes(r.id)) continue;
        const before = this.join(u);
        const at = r.run(u, this);
        if (at >= 0) { fired = { id: r.id, ar: r.ar, en: r.en, tr: r.tr, before, after: this.join(u), at }; break; }
      }
      if (!fired) break;
      if (fired.before === fired.after) break;
      steps.push(fired);
    }
    this._pend = null;
    return { asl: this.parse(asl).map(x => x.c + x.m).join(""), out: this.join(u), steps };
  }
}

// ---------- the role parser (تَحْلِيلُ الْوَظَائِفِ) ----------
// class RoleEngine READS each token's stored Arabic i'rab line the way a
// student would, and names the word's FUNCTION in the sentence; the
// reader's role-color layer paints from it. Precedence order: the first
// test that matches wins, so «مُضَافٌ إِلَيْهِ مَجْرُورٌ» is mudaf-ilayh
// before it is merely majrur, and a jarr-phrase serving as khabar reads
// as khabar — function over form, as the i'rab itself teaches.
class RoleEngine {
  static ROLES = [
    { id: "fail",    re: /فَاعِل|نَائِبُ الْفَاعِل/,       en: "fa'il / deputy",  tr: "fâil / nâib" },
    { id: "maful",   re: /مَفْعُول|مُسْتَثْنًى|مُنَادًى/,  en: "object",          tr: "mef'ûl" },
    { id: "mubtada", re: /مُبْتَدَأ|اسْمُ «/,              en: "mubtada / ism",   tr: "mübteda / isim" },
    { id: "khabar",  re: /خَبَر/,                          en: "khabar",          tr: "haber" },
    { id: "mudaf",   re: /مُضَافٌ إِلَيْهِ/,               en: "mudaf ilayh",     tr: "muzâfun ileyh" },
    { id: "hal",     re: /حَال|تَمْيِيز|ظَرْف/,            en: "hal / adverbial", tr: "hâl / zarf" },
    { id: "tabi",    re: /مَعْطُوف|نَعْت|بَدَل|تَوْكِيد/,   en: "follower",        tr: "tâbi'" },
    { id: "jarr",    re: /مَجْرُور|جَارٌّ|حَرْفُ جَرٍّ/,     en: "jarr",            tr: "cer" },
  ];
  static of(tok){
    if (!tok.irab || !tok.irab.ar) return null;
    // sarf commentary is not syntax: «اسْمُ فَاعِلٍ مِنْ رَكِبَ» inside a
    // hal's i'rab must not read as the fa'il role — blank the sarf phrases
    // before the role regexes run (the ML trains on these labels).
    const ar = tok.irab.ar.normalize("NFC")
      .replace(/اسْم[ُِ]\s*(الْ)?(فَاعِل|مَفْعُول)\S*/g, "▨");
    for (const r of this.ROLES) if (r.re.test(ar)) return r.id;
    return null;
  }
}
function updateRoleMode(){
  document.body.classList.toggle("role-mode", !!state.roles);
  const btn = document.getElementById("roleToggle");
  if (btn) btn.classList.toggle("on", !!state.roles);
  let leg = document.getElementById("roleLegend");
  if (!state.roles) { if (leg) leg.remove(); return; }
  if (!leg) {
    leg = document.createElement("div");
    leg.id = "roleLegend";
    document.querySelector("header.app").appendChild(leg);
  }
  leg.innerHTML = RoleEngine.ROLES.map(r =>
    `<span class="rl" data-role="${r.id}">${state.uiLang === "tr" ? r.tr : r.en}</span>`).join("");
}

// ---------- the Root Finder (كَاشِفُ الْجَذْرِ / Kök Bulucu) ----------
// Corpus FIRST: if any stored paradigm contains the typed form, the answer
// comes with everything the lexicon knows — root, form, and for Form I the
// bab, which is SEMA'I: recited, never computed. Only when the corpus is
// silent do the de-augmentation RULES run — they peel است/ان/ت/أ and the
// iftial ta (reversing its ibdal: اصْطَبَرَ → صبر, اِزْدَجَرَ → زجر), and
// where orthography hides a weak radical they say so honestly (و/ي)
// instead of guessing.
class RootFinder {
  static _index = null;
  static corpusIndex(){
    if (this._index) return this._index;
    this._index = [];
    const seen = new Set();
    STORIES.forEach(st => Object.entries(st.morph || {}).forEach(([lex, m]) => {
      if (seen.has(lex)) return;
      seen.add(lex);
      const e = st.glossary[lex];
      if (!e || !e.root) return;
      this._index.push({ lex, m, root: e.root, lemma: e.lemma, form: e.form || null,
                         bab: m.bab || null, gloss: e.gloss });
    }));
    return this._index;
  }
  static fromCorpus(word){
    for (const v of this.corpusIndex()) {
      const cell = findFormInParadigm(v.m, word);
      if (cell) return { root: v.root, via: "corpus", lemma: v.lemma,
                         form: v.form, bab: v.bab, gloss: v.gloss, cell };
    }
    return null;
  }
  // candidate skeletons: the bare word, minus one clitic, minus the person
  // prefixes and suffixes of a conjugated form
  static candidates(word){
    let s = stripAr((word || "").replace(/[«»،:.!؟\s]/g, ""));
    const out = new Set([s]);
    [s.replace(/^(و|ف|س|ل|ب)/, "")].forEach(x => out.add(x));
    [...out].forEach(x => {
      [x.replace(/(ون|ين|ان|وا|تم|تما|تن|نا|ات|ت|ن|ي|ا)$/, "")].forEach(y => out.add(y));
    });
    [...out].forEach(x => {
      if (/^[يتأن]/.test(x)) out.add(x.slice(1));
    });
    return [...out].filter(x => x.length >= 3);
  }
  // one skeleton → {root, wazn} or null. MASDARS first (they are longer and
  // more specific), then the verb skeletons; hamza may be written plain (اكرم).
  static peel(s){
    let m;
    // -- masdar patterns
    if ((m = s.match(/^است(..)ا(.)$/)))       return { root: m[1] + m[2], wazn: "اِسْتِفْعَال — مَصْدَر" };
    if ((m = s.match(/^ا([صضطظ])ط(.)ا(.)$/))) return { root: m[1] + m[2] + m[3], wazn: "اِفْتِعَال — مَصْدَر (ت ← ط)" };
    if ((m = s.match(/^ا([زدذ])د(.)ا(.)$/)))  return { root: m[1] + m[2] + m[3], wazn: "اِفْتِعَال — مَصْدَر (ت ← د)" };
    if ((m = s.match(/^ا(.)ت(.)ا(.)$/)))      return { root: m[1] + m[2] + m[3], wazn: "اِفْتِعَال — مَصْدَر" };
    if ((m = s.match(/^ان(..)ا(.)$/)))        return { root: m[1] + m[2], wazn: "اِنْفِعَال — مَصْدَر" };
    if ((m = s.match(/^[أاإ](..)ا(.)$/)))     return { root: m[1] + m[2], wazn: "إِفْعَال — مَصْدَر" };
    if ((m = s.match(/^ت(..)ي(.)$/)))         return { root: m[1] + m[2], wazn: "تَفْعِيل — مَصْدَر" };
    if ((m = s.match(/^م(..)ا(.)$/)))         return { root: m[1] + m[2], wazn: "مِفْعَال / مُفَاعَلَة" };
    if ((m = s.match(/^م(.)ا(..)$/)))         return { root: m[1] + m[2], wazn: "مُفَاعِل / مَفَاعِل" };
    // -- verb skeletons
    if ((m = s.match(/^مست(...)$/)) || (m = s.match(/^است(...)$/)) || (m = s.match(/^ست(...)$/)))
      return { root: m[1], wazn: "اِسْتَفْعَلَ" };
    if ((m = s.match(/^من(...)$/)) || (m = s.match(/^ان(...)$/)))
      return { root: m[1], wazn: "اِنْفَعَلَ" };
    // iftial with its ibdal: the ta shows as ط after ص/ض/ط/ظ and as د after ز/د/ذ
    if ((m = s.match(/^[ما]([صضطظ])ط(..)$/))) return { root: m[1] + m[2], wazn: "اِفْتَعَلَ (ت ← ط)" };
    if ((m = s.match(/^[ما]([زدذ])د(..)$/)))  return { root: m[1] + m[2], wazn: "اِفْتَعَلَ (ت ← د)" };
    if ((m = s.match(/^[ما](.)ت(..)$/)))      return { root: m[1] + m[2], wazn: "اِفْتَعَلَ" };
    if ((m = s.match(/^مت(.)ا(..)$/)) || (m = s.match(/^ت(.)ا(..)$/)))
      return { root: m[1] + m[2], wazn: "تَفَاعَلَ" };
    if ((m = s.match(/^مت(...)$/)) || (m = s.match(/^ت(...)$/)))
      return { root: m[1], wazn: "تَفَعَّلَ" };
    if ((m = s.match(/^[أا](...)$/))) return { root: m[1], wazn: "أَفْعَلَ" };
    if ((m = s.match(/^(.)ا(..)$/))) return { root: m[1] + m[2], wazn: "فَاعَلَ" };
    // -- noun shapes that still betray the root
    if ((m = s.match(/^(..)ي(.)$/))) return { root: m[1] + m[2], wazn: "فَعِيل / تَصْغِير" };
    if ((m = s.match(/^(..)ا(.)$/))) return { root: m[1] + m[2], wazn: "فِعَال — مَصْدَر / جَمْع" };
    if ((m = s.match(/^ن(...)$/))) return { root: m[1], wazn: "اِنْفَعَلَ" };
    if (s.length === 3) return { root: s, wazn: "فَعَلَ / فَعَّلَ" };
    return null;
  }
  // weak slots the skeleton cannot decide: name the possibilities
  static weakNote(root){
    const notes = [];
    if (root[1] === "ا") notes.push("mid");
    if (/[اى]$/.test(root)) notes.push("last");
    return notes;
  }
  // find() runs on every keystroke of three labs and on every Analyzer word —
  // and each miss walks the whole corpus. The memo makes repeat lookups free;
  // 400 entries is far past anything one session types.
  static _memo = new Map();
  static find(word){
    const key = (word || "").normalize("NFC");
    if (this._memo.has(key)) return this._memo.get(key);
    const res = this._find(key);
    if (this._memo.size > 400) this._memo.clear();
    this._memo.set(key, res);
    return res;
  }
  static _find(word){
    const hit = this.fromCorpus(word);
    if (hit) return hit;
    // corpus-first applies to the PEELED skeletons too: ورجع must find the
    // stored رَجَعَ before any pattern rule gets to guess at it.
    const cands = this.candidates(word);
    for (const c of cands) {
      const h2 = this.fromCorpus(c);
      if (h2) return h2;
    }
    for (const c of cands) {
      const r = this.peel(c);
      if (r) {
        const weak = this.weakNote(r.root);
        let display = r.root.split("").join(" ");
        if (weak.includes("mid")) display = display.replace(" ا ", " و/ي ");
        if (weak.includes("last")) display = display.replace(/[اى]$/, "و/ي");
        return { root: display, via: "rules", wazn: r.wazn, weak: weak.length > 0, skeleton: c };
      }
    }
    return null;
  }
}

// ---------- the Mizan (وزن) engine ----------
// The classical exercise in reverse: given any form, say its wazn. Two paths,
// both deterministic. CORPUS: if the form is a cell of a stored paradigm, the
// mizan is computed by conjugating the root ف ع ل itself through the SAME
// form, bab and cell with sarfDerive — so يَسْتَغْفِرُونَ answers يَسْتَفْعِلُونَ with
// every harake earned, not templated. For a weak verb this yields the wazn
// بِحَسَبِ الْأَصْلِ (قَالَ → فَعَلَ), which is the madrasah's answer — and the i'lal
// chain is right there to explain the surface. RULES: when the corpus is
// silent, the peel pattern that found the root already names the wazn.
class WaznEngine {
  static _memo = new Map();
  static of(word){
    const key = (word || "").normalize("NFC");
    if (this._memo.has(key)) return this._memo.get(key);
    const hit = RootFinder.fromCorpus(key);
    const res = hit ? this._corpus(key, hit)
      : (r => r ? { via: "rules", root: r.root, wazn: r.wazn, weak: r.weak } : null)(RootFinder.find(key));
    if (this._memo.size > 400) this._memo.clear();
    this._memo.set(key, res);
    return res;
  }
  static _corpus(word, hit){
    // find the entry again to reach its morphology (fromCorpus returns the cell)
    let entry = null;
    for (const v of RootFinder.corpusIndex())
      if (v.lemma === hit.lemma && findFormInParadigm(v.m, word)) { entry = v; break; }
    const out = { via: "corpus", root: hit.root, lemma: hit.lemma, cell: hit.cell,
                  gloss: hit.gloss, form: hit.form, bab: hit.bab };
    if (!entry) return out;
    const att = sjAttested(entry.m);
    if (!att) return out;                       // sema'i-only entry: no derivation
    const cls = nakilClass({ root: "ف ع ل" });
    const d = sarfDerive(cls, att.form, att.bab || 1);
    if (!d.ok) return out;
    const v = d[hit.cell.tense];
    const mizan = Array.isArray(v) ? v[hit.cell.i] : v;
    if (mizan) {
      out.mizan = mizan;
      out.headWazn = d.wazn;
      // the verb's own class decides whether this is the surface or the asl
      const vcls = nakilClass({ root: entry.root });
      out.asl = !!(vcls && vcls.type !== "sound");
    }
    return out;
  }
}

// ---------- the Tasgir & Nisba engine ----------
// Two classical noun machines, both pure rule. TASGIR: three sound letters
// ride فُعَيْل (plus the ta if the word wore one), four ride فُعَيْعِل, the
// alif of فَاعِل turns waw (شَاعِر → شُوَيْعِر), and a weak last letter melts
// into the diminutive ya. NISBA: drop the ta, then the doubled ya of
// relation; the maqsur alif and the mamdud hamza turn waw. What the rules
// cannot know — مَدِينَة → مَدَنِيّ, قُرَيْش → قُرَشِيّ — is STORED, not
// computed: the semai table answers first, exactly like the Root Finder's
// corpus-before-rules order.
class IsmEngine {
  static SEMAI_NISBA = {
    "مدينة": "مَدَنِيّ", "قريش": "قُرَشِيّ", "دنيا": "دُنْيَوِيّ",
    "أخ": "أَخَوِيّ", "اخ": "أَخَوِيّ", "أب": "أَبَوِيّ", "اب": "أَبَوِيّ",
    "يد": "يَدَوِيّ", "سماء": "سَمَاوِيّ", "عيسى": "عِيسَوِيّ",
    "بصرة": "بَصْرِيّ", "كوفة": "كُوفِيّ", "حنيفة": "حَنَفِيّ",
    // radical-ha words: the ha is a ROOT letter, so the silent-ha rule below
    // must not touch them — the table answers first.
    "فقه": "فِقْهِيّ", "وجه": "وَجْهِيّ", "له": "إِلَهِيّ", "اله": "إِلَهِيّ",
  };
  static parts(word){
    const b = stripAr(word || "").replace(/[^ء-ي]/g, "").replace(/^ال/, "");
    return { b, ta: /ة$/.test(b), core: b.replace(/ة$/, "") };
  }
  static tasgir(word){
    const { ta, core } = this.parts(word);
    const L = core.split("");
    if (L.length === 3 && /[اوىي]/.test(L[2]))
      return { out: L[0]+"ُ"+L[1]+"َيّ", rule: "فُعَيْل — أُدْغِمَتْ يَاءُ التَّصْغِيرِ فِي الْآخِرِ الْمُعْتَلِّ" };
    if (L.length === 3)
      return { out: L[0]+"ُ"+L[1]+"َيْ"+L[2]+(ta ? "َة" : ""), rule: "فُعَيْل" };
    if (L.length === 4 && L[1] === "ا")
      return { out: L[0]+"ُوَيْ"+L[2]+"ِ"+L[3]+(ta ? "َة" : ""), rule: "فُوَيْعِل — أَلِفُ فَاعِلٍ تُقْلَبُ وَاوًا" };
    // the madda as third letter melts into the tasgir ya:
    // كِتَاب → كُتَيِّب، مَدِينَة → مُدَيِّنَة، صَحِيفَة → صُحَيِّفَة
    if (L.length === 4 && /[اوي]/.test(L[2]))
      return { out: L[0]+"ُ"+L[1]+"َيِّ"+L[3]+(ta ? "َة" : ""), rule: "فُعَيِّل — مَدَّةُ الثَّالِثِ تُدْغَمُ فِي يَاءِ التَّصْغِيرِ" };
    if (L.length === 4 && !/[اوىي]/.test(L[3]))
      return { out: L[0]+"ُ"+L[1]+"َيْ"+L[2]+"ِ"+L[3]+(ta ? "َة" : ""), rule: "فُعَيْعِل" };
    return null;
  }
  static nisba(word){
    const { b, ta, core } = this.parts(word);
    const s = this.SEMAI_NISBA[b] || this.SEMAI_NISBA[core];
    if (s) return { out: s, rule: "سَمَاعِيٌّ — مِنَ الْجَدْوَلِ الْمَحْفُوظِ لَا مِنَ الْقَاعِدَةِ", semai: true };
    if (ta) return { out: core + "ِيّ", rule: "تُحْذَفُ التَّاءُ ثُمَّ تُزَادُ يَاءُ النِّسْبَةِ" };
    // the silent final ha of foreign and Ottoman place-names turns waw:
    // رِيزَه → رِيزَوِيّ، قُونِيَه → قُونَوِيّ. Radical-ha words (فقه، وجه)
    // are shielded by the semai table above.
    if (/ه$/.test(core)) return { out: core.slice(0, -1) + "وِيّ", rule: "الْهَاءُ السَّاكِنَةُ فِي آخِرِ الْأَعْلَامِ تُقْلَبُ وَاوًا — رِيزَه → رِيزَوِيّ" };
    if (/اء$/.test(core)) return { out: core.slice(0, -1) + "وِيّ", rule: "هَمْزَةُ الْمَمْدُودِ تُقْلَبُ وَاوًا" };
    if (/[اى]$/.test(core)) return { out: core.slice(0, -1) + "َوِيّ", rule: "أَلِفُ الْمَقْصُورِ تُقْلَبُ وَاوًا" };
    return { out: core + "ِيّ", rule: "تُزَادُ يَاءُ النِّسْبَةِ الْمُشَدَّدَةُ" };
  }
  // ---- the qiyasi derivations of the Maqsud: pure rule, no data ----------
  // Ism tafdil rides أَفْعَلُ with the weak-letter accidents the books list;
  // it REFUSES what the pattern cannot carry (non-triliteral roots).
  static tafdil(rootLetters){
    const L = rootLetters;
    if (!L || L.length !== 3) return null;
    const [f, a, l] = L;
    if (a === l) return { out: "أَ" + f + "َ" + a + "ُّ", rule: "أَفَلُّ — أُدْغِمَ الْمِثْلَانِ: شَدَّ → أَشَدُّ" };
    if (/[وي]/.test(l) || l === "ى")
      return { out: "أَ" + f + "ْ" + a + "َى", rule: "أَفْعَى — لَامُهُ الْمُعْتَلَّةُ تُقْلَبُ أَلِفًا: عَلَا → أَعْلَى" };
    return { out: "أَ" + f + "ْ" + a + "َ" + l + "ُ", rule: "أَفْعَلُ — وَمُؤَنَّثُهُ فُعْلَى" };
  }
  // Ism zaman/makan: مَفْعِل when the mudari's ayn is kasra (يَجْلِسُ →
  // مَجْلِس) and for the waw-mithal always (وَعَدَ → مَوْعِد); مَفْعَل
  // otherwise; the weak letters bend it exactly as the verb bends.
  static zamanMakan(rootLetters, mudariKasra){
    const L = rootLetters;
    if (!L || L.length !== 3) return null;
    const [f, a, l] = L;
    if (/[وي]/.test(l) || l === "ى")
      return { out: "مَ" + f + "ْ" + a + "ًى", rule: "مَفْعًى — النَّاقِصُ: رَمَى → مَرْمًى" };
    if (a === "و") return { out: "مَ" + f + "َا" + l, rule: "مَفَال — الْأَجْوَفُ الْوَاوِيُّ: قَامَ → مَقَام" };
    if (a === "ي") return { out: "مَ" + f + "ِي" + l, rule: "مَفِيل — الْأَجْوَفُ الْيَائِيُّ: بَاتَ → مَبِيت" };
    if (a === l) return { out: "مَ" + f + "َ" + a + "ّ", rule: "مَفَلّ — أُدْغِمَ الْمِثْلَانِ: حَلَّ → مَحَلّ" };
    if (f === "و") return { out: "مَوْ" + a + "ِ" + l, rule: "مَفْعِل — الْمِثَالُ الْوَاوِيُّ أَبَدًا: وَعَدَ → مَوْعِد" };
    if (mudariKasra === true)
      return { out: "مَ" + f + "ْ" + a + "ِ" + l, rule: "مَفْعِل — لِأَنَّ عَيْنَ مُضَارِعِهِ مَكْسُورَةٌ: يَجْلِسُ → مَجْلِس" };
    if (mudariKasra === false)
      return { out: "مَ" + f + "ْ" + a + "َ" + l, rule: "مَفْعَل — لِأَنَّ عَيْنَ مُضَارِعِهِ غَيْرُ مَكْسُورَةٍ: يَكْتُبُ → مَكْتَب" };
    // bab unknown: say both, and say why we cannot choose
    return { out: "مَ" + f + "ْ" + a + "َ" + l + " / مَ" + f + "ْ" + a + "ِ" + l,
             rule: "مَفْعَل أَوْ مَفْعِل — يُحْسَمُ بِعَيْنِ الْمُضَارِعِ، وَبَابُ هٰذَا الْجَذْرِ غَيْرُ مَحْفُوظٍ فِي الْكُلِّيَّاتِ", both: true };
  }
  // Ism alat is SEMAI: which of مِفْعَل / مِفْعَلَة / مِفْعَال a root uses
  // is heard, not derived — so the table answers or the engine refuses.
  static SEMAI_ALAT = {
    "فتح": "مِفْتَاح", "وزن": "مِيزَان", "نشر": "مِنْشَار", "صبح": "مِصْبَاح",
    "كنس": "مِكْنَسَة", "قص": "مِقَصّ", "قصص": "مِقَصّ", "برد": "مِبْرَد",
    "قود": "مِقْوَد", "ملق": "مِمْلَقَة", "سطر": "مِسْطَرَة", "قلم": "مِقْلَمَة",
  };
  static alat(rootLetters){
    const key = (rootLetters || []).join("");
    const hit = this.SEMAI_ALAT[key];
    if (hit) return { out: hit, rule: "سَمَاعِيٌّ — مِنَ الْجَدْوَلِ الْمَحْفُوظِ؛ أَوْزَانُهُ مِفْعَل وَمِفْعَلَة وَمِفْعَال" };
    return null;
  }
}

// ---------- the MA engine: twelve readings, decided by signal -----------
// Qawa'id al-I'rab devotes a whole bab to مَا because it is the most
// overloaded word in the language: seven noun readings and five particle
// readings, identical in spelling. A reader cannot look it up — it must be
// READ OFF THE NEIGHBOURS, which is exactly what a rule engine can do. Each
// reading below carries the signal that proposes it, so the app never says
// "it is X" but "X, because Y" — and offers the runners-up when the signal
// is weak. No corpus, no data: only the closed classes and the patterns.
class MaEngine {
  static WAJH = {
    mawsula:   { ar: "مَا الْمَوْصُولَة", en: "relative ma (= that which)", tr: "ism-i mevsûl mâ (= o şey ki)" },
    shartiyya: { ar: "مَا الشَّرْطِيَّة", en: "conditional ma — jazm on two verbs", tr: "şart mâsı — iki fiili cezmeder" },
    istifham:  { ar: "مَا الِاسْتِفْهَامِيَّة", en: "interrogative ma — what?", tr: "istifham mâsı — ne?" },
    taajjub:   { ar: "مَا التَّعَجُّبِيَّة", en: "ma of wonder — how …!", tr: "taaccüb mâsı — ne kadar …!" },
    mawsufa:   { ar: "مَا النَّكِرَة الْمَوْصُوفَة", en: "indefinite ma with a description", tr: "mevsûfe nekre mâ" },
    nakira:    { ar: "مَا النَّكِرَة التَّامَّة", en: "bare indefinite ma — «a thing»", tr: "tâmme nekre mâ — «bir şey»" },
    nafiya:    { ar: "مَا النَّافِيَة", en: "negating ma — governs nothing", tr: "nefiy mâsı — amel etmez" },
    hijaziyya: { ar: "مَا النَّافِيَة الْحِجَازِيَّة", en: "Hijazi negating ma — works like laysa", tr: "hicâzî nefiy mâsı — leyse gibi amel eder" },
    masdariyya:{ ar: "مَا الْمَصْدَرِيَّة", en: "masdar-making ma — the clause becomes a masdar", tr: "masdariyye mâ — cümle masdara döner" },
    zarfiyya:  { ar: "مَا الْمَصْدَرِيَّة الظَّرْفِيَّة", en: "masdar-and-time ma — «as long as»", tr: "zarfiyye masdariyye mâ — «-dığı müddetçe»" },
    kaffa:     { ar: "مَا الْكَافَّة", en: "restraining ma — it disarms the governor before it", tr: "kâffe mâ — önündeki âmilin amelini keser" },
    zaida:     { ar: "مَا الزَّائِدَة", en: "extra ma — added for emphasis, governs nothing", tr: "zâid mâ — te'kid için gelir, amel etmez" },
  };
  // the hosts that swallow ما and are disarmed by it
  // ONLY inna and her sisters, plus rubba/qalla/kathura/tala. كَانَ is a sister
  // of kana, not of inna — it is never disarmed by ma, and كانما is no word.
  // أَنَّ on the other hand really does give أَنَّمَا (أَنَّمَا يُوحَى إِلَيَّ).
  static KAFFA_HOSTS = ["ان", "إن", "أن", "كأن", "لكن", "ليت", "لعل", "رب",
                        "قل", "كثر", "طال", "انما", "إنما", "أنما",
                        "كأنما", "لكنما", "ليتما", "لعلما", "ربما", "قلما", "كثرما", "طالما"];
  // alif RETAINED → the clause reads as a masdar or a relative
  static JARR_FUSED = { "مما": "من", "بما": "ب", "عما": "عن", "فيما": "في",
                        "كما": "ك", "لما": "ل" };
  // alif ELIDED → interrogative only: عَمَّ يَتَسَاءَلُونَ، فِيمَ أَنْتَ، عَلَامَ، إِلَامَ
  static JARR_CONTRACTED = { "علام": "على", "الام": "الى", "إلام": "إلى",
                             "بم": "ب", "فيم": "في", "عم": "عن" };
  static isVerbish(w){ return /^[يتنأ]/.test(w) && w.length >= 3 && !/^ال/.test(w); }
  static isAfal(w){ return /^أ/.test(w) && w.length === 4 && !/^ال/.test(w); }
  // words: bare surfaces; i: index of the ma token; isVerb: an optional
  // ORACLE — a bare mazi wears no prefix, so only the corpus can call كَتَبَ
  // a verb. Without one the engine falls back to the prefix test and says so.
  // Returns the readings ranked, each with the signal that proposed it.
  static read(words, i, fulls, isVerb){
    const verbAt = k => {
      const w = words[k] || "";
      if (!w) return false;
      const hint = isVerb ? isVerb(k) : null;
      return hint === null || hint === undefined ? this.isVerbish(w) : !!hint;
    };
    const bare = k => (words[k] || "");
    const prev = bare(i - 1), next = bare(i + 1), next2 = bare(i + 2);
    const nextFull = (fulls && fulls[i + 1]) || "";
    const out = [];
    const say = (k, en, tr) => out.push({ k, ...this.WAJH[k], why: { en, tr } });
    // 1. fused into a governor, or riding qalla/kathura/tala — kaffa
    // one list serves both the standing host before ما and the fused spelling
    if (this.KAFFA_HOSTS.includes(prev) || this.KAFFA_HOSTS.includes(bare(i)))
      say("kaffa", "it sits on a governor (inna's family, rubba, qalla…), which such a ma disarms",
                   "bir âmilin (inne ailesi, rubbe, kalle…) üzerinde geliyor; böyle bir mâ onun amelini keser");
    // 2. before the دَامَ family — «as long as». It is a hollow verb, so the
    // surface may be دَامَ or دُمْتُ or يَدُومُ; match the root, not one cell.
    if (/^(دام|دمت|دمنا|دمن|يدوم|تدوم|ندوم|أدوم|ادوم)/.test(next))
      say("zarfiyya", "دَامَ follows: «ma dumtu» = «for as long as I remain»",
                      "ardından دَامَ geliyor: «mâ dümtü» = «kaldığım müddetçe»");
    // 3. wonder: ما + أَفْعَلَ + a mansub noun
    if (this.isAfal(next) && /ً/.test((fulls && fulls[i + 2]) || ""))
      say("taajjub", "أَفْعَلَ follows and the noun after it is mansub — the wonder pattern «ما أَحْسَنَ زَيْدًا»",
                     "ardından أَفْعَلَ, ondan sonraki isim mensub — taaccüb kalıbı «مَا أَحْسَنَ زَيْدًا»");
    // 3b. the alif-elided fusion is interrogative and nothing else: the alif
    // of مَا drops after a jarr letter EXACTLY when the ma is a question.
    const contracted = this.JARR_CONTRACTED[bare(i)];
    if (contracted)
      say("istifham", `the alif of ما is elided after «${contracted}» — that contraction happens only when the ma is interrogative`,
                      `«${contracted}» sonrasında مَا'nın elifi düşmüş — bu hazif yalnız mâ istifhâmiyye olduğunda olur`);
    // 4. after a jarr letter (fused or standing) — a masdar or a relative
    const fused = this.JARR_FUSED[bare(i)];
    if (fused || (!contracted && /^(من|في|ب|ل|ك|على|عن|الى|إلى)$/.test(prev))) {
      say("masdariyya", "a jarr letter precedes, so the clause after it construes as a masdar",
                        "öncesinde cer harfi var; sonrasındaki cümle masdar hükmüne girer");
      say("mawsula", "the same position also admits the relative reading — «that which»",
                     "aynı yer mevsûl okumaya da açıktır — «o şey ki»");
    }
    // 4b. after a jarr letter the NEXT noun sometimes carries the jarr itself
    // (kasratan) — then the ma between them governed nothing: it is زَائِدَة.
    // فَبِمَا رَحْمَةٍ مِنَ اللهِ — رحمةٍ is majrur by the ba, not by anything ma did.
    if ((fused || contracted) && /ٍ/.test(((fulls || [])[i + 1] || "").normalize("NFC")))
      say("zaida", "the following noun carries kasratan — it is majrur by the jarr letter itself, so the ma between them governed nothing",
                   "sonraki isim kesratenli — cer harfinin kendisiyle mecrurdur; aradaki mâ hiçbir amel etmemiştir");
    // 4c. after رُبَّ an indefinite follows and ma merely describes it
    if (/^رب/.test(prev) ||
        (/^رب/.test(bare(i)) && /ٍ/.test(((fulls || [])[i + 1] || "").normalize("NFC"))))
      say("mawsufa", "رُبَّ precedes and an indefinite follows — the described-indefinite ma",
                     "öncesinde رُبَّ ve ardından nekre var — mevsûfe nekre mâ");
    // 4d. نِعِمَّا / بِئْسَمَا — the praise-and-blame verbs take a bare indefinite
    // ma as their tamyiz: «a thing», complete in itself, needing no sifa.
    if (/^(نعم|بئس|نعما|بئسما)$/.test(prev) || /^(نعما|بئسما)$/.test(bare(i)))
      say("nakira", "it follows a verb of praise or blame — the bare indefinite «a thing», complete without a description",
                    "medih yahut zem fiilinden sonra geliyor — sıfat istemeyen tâmme nekre: «bir şey»");
    // 5. two verbs after it — the conditional that puts both in jazm
    if (verbAt(i + 1) && words.slice(i + 2).some((w, k) => verbAt(i + 2 + k)))
      say("shartiyya", "a verb follows and another comes after it — the two-verb conditional shape",
                       "ardından bir fiil, sonra bir fiil daha geliyor — iki fiilli şart kalıbı");
    // 6. a NOUN follows and something later wears fath tanwin: that accusative
    // is the khabar this ma has put in nasb — the Hijazi, laysa-like reading.
    // (The signal is the MANSUB KHABAR, not a ba: the ba of «بَشَرًا» is a
    // radical. The zaid-ba variant «مَا زَيْدٌ بِقَائِمٍ» is the same wajh.)
    const nounNext = next && !verbAt(i + 1);
    const mansubLater = (fulls || []).slice(i + 1, i + 5).some(w => /ً/.test((w || "").normalize("NFC")));
    if (nounNext && mansubLater)
      say("hijaziyya", "a noun follows and a later word is mansub — that accusative is the khabar this ma governs, exactly as laysa would",
                       "ardından isim geliyor ve sonraki bir kelime mensub — o mensub, bu mânın naspettiği haberdir; tıpkı leyse gibi");
    // 7. a verb right after — the plain negation. A pronoun, demonstrative or
    // relative is NOT a verb, so it must not be read as one.
    const nextIsClosed = !!SentenceAnalyzer.PARTICLES[next];
    if (verbAt(i + 1) ||
        (next && !nextIsClosed && !/^ال/.test(next) && next.length >= 3 && !out.length))
      say("nafiya", "a verb follows and nothing governs — the plain negation, «did not»",
                    "ardından fiil geliyor ve amel eden yok — sade nefiy, «-medi»");
    // 8. sentence-initial before a noun or a detached pronoun — the question
    if (i === 0 && nounNext)
      say("istifham", "it opens the sentence and a noun follows — «what is …?»",
                      "cümlenin başında ve ardından isim var — «… nedir?»");
    // 9. the fallback the books themselves fall back on
    if (!out.length)
      say("mawsula", "no other signal is present; the relative reading is the default",
                     "başka bir işaret yok; asıl olan mevsûl okumadır");
    // dedupe, keep first reason
    const seen = new Set();
    return out.filter(o => !seen.has(o.k) && seen.add(o.k));
  }
}

// ---------- the I'rab Model: MACHINE-LEARNED from the corpus ----------
// Every token in every story carries a hand-written i'rab, and RoleEngine
// reads each one into a functional role — which makes the corpus a labeled
// training set thousands of examples strong. This model trains on it AT
// RUNTIME: naive Bayes with Laplace smoothing over cheap surface features
// (article, tanwin, ta marbuta, attached pronoun, position, what came
// before). No weights ship in the file; every content release retrains the
// model on the enlarged corpus automatically. Predictions are labeled as
// statistics, never as i'rab — the hand-written analyses stay the truth.
class IrabModel {
  static _model = null;
  static ROLES = ["fail", "maful", "mubtada", "khabar", "mudaf", "hal", "tabi", "jarr"];
  // features are computed from the FULL surface + neighbors
  static features(full, i, n, prev){
    const w = (full || "").normalize("NFC");
    const bare = stripAr(w).replace(/[^ء-ي]/g, "");
    const f = [];
    if (/^ال/.test(bare) || /^[وفب]ال/.test(bare)) f.push("al");
    if (/[ًٌٍ]/.test(w)) f.push("tanwin");
    if (/ة$/.test(bare)) f.push("ta");
    if (/(ه|ها|هم|هما|كم|نا|ك)$/.test(bare) && bare.length > 4) f.push("pron");
    if (i === 0) f.push("first");
    if (i === n - 1) f.push("last");
    if (i <= 1) f.push("early"); else if (i >= n - 2) f.push("late"); else f.push("mid");
    if (prev === "verb") f.push("after-verb");
    if (prev === "jarr") f.push("after-jarr");
    if (prev === "noun") f.push("after-noun");
    if (/^[وف]/.test(bare)) f.push("waw-start");
    // The single strongest cue a reader actually uses: what the LAST letter
    // shows. This is where the rule engines feed the statistical one —
    // caseSignOf names the vowel, IrabSign names the MANNER of i'rab (a
    // mabni word declines by position, a dual by letters), and the naive
    // Bayes learns which roles live behind each. Nothing is hard-coded:
    // the association is counted off the corpus like every other feature.
    const sign = caseSignOf(w);
    if (sign) f.push("sign-" + sign.en);
    const is = IrabSign.of(w);
    if (is) f.push("by-" + is.by);
    // Length, bucketed. It is a proxy for word CLASS that costs nothing: a
    // two-letter word is almost always a particle, a six-letter one carries
    // affixes. Kept because the ablation earned it (+1.8 pts on first guess);
    // a mim-initial flag and a shadda flag were tried in the same pass and
    // DROPPED — they measured as noise, and an unmeasured feature is a
    // superstition. Re-run tools/ablate_features.js before adding another.
    f.push("len-" + (bare.length <= 3 ? bare.length : bare.length <= 5 ? "45" : "6"));
    return f;
  }
  static train(){
    if (this._model) return this._model;
    const m = { roleN: {}, feat: {}, total: 0 };
    this.ROLES.forEach(r => { m.roleN[r] = 0; m.feat[r] = {}; });
    STORIES.forEach(st => st.chapters.forEach(ch => ch.sentences.forEach(sen => {
      let prev = null;
      const n = sen.tokens.length;
      sen.tokens.forEach((t, i) => {
        const role = RoleEngine.of(t);
        const isVerb = t.pos === "verb";
        if (role) {
          const fs = this.features(t.s.full, i, n, prev);
          m.roleN[role]++; m.total++;
          fs.forEach(f => { m.feat[role][f] = (m.feat[role][f] || 0) + 1; });
        }
        // non-sticky, mirroring the predict call site exactly: a particle
        // that is not a jarr letter RESETS prev — training and inference
        // must share one feature definition or the counts lie.
        prev = isVerb ? "verb"
             : (t.irab && /حَرْفُ جَرٍّ|جَارَّة/.test(t.irab.ar || "")) ? "jarr"
             : t.pos === "noun" ? "noun" : null;
      });
    })));
    this._model = m;
    return m;
  }
  // P(role | features) by naive Bayes; returns roles sorted by probability.
  //
  // The likelihoods carry a 1/sqrt(k) weight, k being how many features the
  // word fired. Naive Bayes assumes features are independent and ours plainly
  // are not — «al» and «sign-kasra» and «by-haraka» all move together on the
  // same word — so an unweighted product counts one piece of evidence three
  // times and the posterior spikes on whichever class happens to own that
  // cluster. Damping by the feature count is the cheapest correction that
  // keeps the model interpretable. Measured with tools/ablate_estimator.js:
  // 51.9% → 53.2% first guess. Complement NB was tried in the same run and
  // was far WORSE (42.8%) — it is the wrong medicine for this skew.
  static predict(full, i, n, prev){
    const m = this.train();
    if (!m.total) return [];
    const fs = this.features(full, i, n, prev);
    const w = 1 / Math.sqrt(Math.max(1, fs.length));
    const scores = this.ROLES.map(r => {
      let lp = Math.log((m.roleN[r] + 1) / (m.total + this.ROLES.length));
      fs.forEach(f => {
        lp += w * Math.log(((m.feat[r][f] || 0) + 1) / (m.roleN[r] + 2));
      });
      return { r, lp };
    });
    const mx = Math.max(...scores.map(s => s.lp));
    let z = 0;
    scores.forEach(s => { s.p = Math.exp(s.lp - mx); z += s.p; });
    scores.forEach(s => { s.p /= z; });
    return scores.sort((a, b) => b.p - a.p);
  }
  static trainingSize(){ return this.train().total; }
  // How often the model is right about the very corpus it learned from. This
  // is a RESUBSTITUTION score, not a held-out one — it is honest about being
  // an upper bound, and it exists so a feature change can be measured instead
  // of merely believed. Computed once, lazily, and cached.
  static _acc = null;
  static accuracy(){
    if (this._acc) return this._acc;
    let ok = 0, two = 0, n = 0;
    STORIES.forEach(st => st.chapters.forEach(ch => ch.sentences.forEach(sen => {
      let prev = null;
      const N = sen.tokens.length;
      sen.tokens.forEach((t, i) => {
        const role = RoleEngine.of(t);
        if (role) {
          const pr = this.predict(t.s.full, i, N, prev);
          n++;
          if (pr[0] && pr[0].r === role) ok++;
          if (pr.slice(0, 2).some(x => x.r === role)) two++;
        }
        prev = t.pos === "verb" ? "verb"
             : (t.irab && /حَرْفُ جَرٍّ|جَارَّة/.test(t.irab.ar || "")) ? "jarr"
             : t.pos === "noun" ? "noun" : null;
      });
    })));
    this._acc = { n, top1: n ? ok / n : 0, top2: n ? two / n : 0 };
    return this._acc;
  }
}

// realize a FORM's masdar on a root — the rough-gloss line leans on this
// when a verb is unknown: the user's rule, "just the masdar for now".
const MASDAR_SHAPE = {
  II:  (f, a, l) => "تَ" + f + "ْ" + a + "ِي" + l,
  III: (f, a, l) => "مُ" + f + "َا" + a + "َ" + l + "َة",
  IV:  (f, a, l) => "إِ" + f + "ْ" + a + "َا" + l,
  V:   (f, a, l) => "تَ" + f + "َ" + a + "ُّ" + l,
  VI:  (f, a, l) => "تَ" + f + "َا" + a + "ُ" + l,
  VII: (f, a, l) => "اِنْ" + f + "ِ" + a + "َا" + l,
  VIII:(f, a, l) => "اِ" + f + "ْتِ" + a + "َا" + l,
  X:   (f, a, l) => "اِسْتِ" + f + "ْ" + a + "َا" + l,
};
const WAZN_FORM = { "أَفْعَلَ": "IV", "فَعَّلَ": "II", "فَاعَلَ": "III", "تَفَعَّلَ": "V",
  "تَفَاعَلَ": "VI", "اِنْفَعَلَ": "VII", "اِفْتَعَلَ": "VIII", "اِسْتَفْعَلَ": "X" };
function realizeMasdar(rootSpaced, waznHead){
  const form = WAZN_FORM[(waznHead || "").normalize("NFC").split(" ")[0]];
  const rs = (rootSpaced || "").split(/\s+/).filter(x => /^[ء-ي]$/.test(x));
  if (!form || rs.length !== 3 || !MASDAR_SHAPE[form]) return null;
  return MASDAR_SHAPE[form](rs[0], rs[1], rs[2]);
}

// ---------- the Harake Auditor: vowelling proofread by pure rule ----------
// No dictionary, no corpus — only what the orthography itself forbids.
// A first letter cannot carry sukun or shadda (the shadda after ال lives on
// the SECOND letter); a plain alif inside a word carries no vowel (word-
// initial alif does: that is hamzat al-wasl's spelling); tanwin belongs to
// the last letter (or the one before a final alif/ta); one letter never
// carries two vowels, nor shadda together with sukun; and two explicit
// sukuns cannot meet inside a word. These are the rules a musahhih applies
// before ever opening a dictionary — which is why they need no data.
class HarakeAuditor {
  static V = "َُِ";      // fatha damma kasra
  static TANWIN = "ًٌٍ";
  static SUKUN = "ْ"; static SHADDA = "ّ";
  static audit(word){
    const w = (word || "").normalize("NFC");
    // group marks under their base letter
    const units = [];
    for (const ch of w) {
      if (/[ً-ْٰ]/.test(ch) && units.length) units[units.length - 1].m += ch;
      else if (/[ء-يٱ-ۓ]/.test(ch)) units.push({ c: ch, m: "" });
    }
    const out = [];
    const say = (en, tr) => out.push({ en, tr });
    units.forEach((u, i) => {
      const vowels = [...u.m].filter(c => this.V.includes(c)).length;
      const tanwins = [...u.m].filter(c => this.TANWIN.includes(c)).length;
      const hasSukun = u.m.includes(this.SUKUN), hasShadda = u.m.includes(this.SHADDA);
      // exception the books themselves write: بْنُ between two names, its
      // alif elided so the ba leans on the previous word's final vowel.
      const ibn = units[0].c === "ب" && units.length <= 3 &&
                  units.map(x => x.c).join("").match(/^بني?$/);
      if (i === 0 && hasSukun && !ibn)
        say("a word cannot OPEN with sukun", "kelime sükûnla BAŞLAYAMAZ");
      if (i === 0 && hasShadda)
        say("a word cannot open with shadda (after ال it sits on the SECOND letter)", "kelime şeddeyle başlayamaz (ال'dan sonra şedde İKİNCİ harfe oturur)");
      if (u.c === "ا" && i > 0 && (vowels || hasSukun))
        say("a plain alif inside the word carries no vowel — hamza intended?", "kelime içindeki düz elif hareke almaz — hemze mi kastedildi?");
      if (vowels + tanwins > 1)
        say("one letter cannot carry two vowels", "bir harf iki hareke taşıyamaz");
      if (hasShadda && hasSukun)
        say("shadda with sukun on one letter is impossible", "bir harfte şedde ile sükûn bir arada olamaz");
      if (tanwins && i < units.length - 1 &&
          !(i === units.length - 2 && (units[i + 1].c === "ا" || units[i + 1].c === "ى")))
        say("tanwin belongs to the END of the word", "tenvin kelimenin SONUNA aittir");
      if (hasSukun && i > 0 && units[i - 1].m.includes(this.SUKUN))
        say("two sukuns meet inside the word (iltiqa al-sakinayn)", "kelime içinde iki sâkin buluşuyor (iltikâ-i sâkineyn)");
    });
    return out;
  }
}

// ---------- the Sentence Analyzer: any Arabic, no stored data required ----------
// Paste a sentence the corpus has never seen and get a best-effort parse.
// Three layers, each honest about its certainty: (1) the PARTICLE TABLE —
// closed-class words are finite, so identifying them is knowledge, not
// guessing; (2) MORPHOLOGY — verb prefixes, the definite article, tanwin and
// the ta marbuta betray the word kind; the Root Finder and the Mizan then dig
// the root and wazn; (3) SEQUENCE — a jarr letter promises a majrur, لم/لن
// promise a verb, يا promises a munada. Everything from layers 2-3 wears a
// tentative mark: the analyzer READS signals, it does not claim i'rab.
class SentenceAnalyzer {
  static PARTICLES = {
    "في": { k: "jarr" }, "من": { k: "jarr" }, "الى": { k: "jarr" }, "إلى": { k: "jarr" },
    "عن": { k: "jarr" }, "على": { k: "jarr" }, "حتى": { k: "jarr" }, "رب": { k: "jarr" },
    "مذ": { k: "jarr" }, "منذ": { k: "jarr" }, "بلا": { k: "jarr" },
    "ان": { k: "inna" }, "إن": { k: "inna" }, "أن": { k: "an-amb" }, "لن": { k: "nasb-verb" },
    "كي": { k: "nasb-verb" }, "اذن": { k: "nasb-verb" }, "إذن": { k: "nasb-verb" },
    "لم": { k: "jazm" }, "لما": { k: "jazm" },
    "لا": { k: "nafy" }, "ما": { k: "ma" }, "قد": { k: "qad" }, "سوف": { k: "sawfa" },
    // مَا fused to its jarr letter is written as one word but is two closed-
    // class words; the MA engine reads the wajh off the fused spelling.
    "مما": { k: "ma" }, "بما": { k: "ma" }, "عما": { k: "ma" }, "فيما": { k: "ma" },
    "كما": { k: "ma" }, "علام": { k: "ma" }, "الام": { k: "ma" }, "إلام": { k: "ma" },
    "بم": { k: "ma" }, "لم؟": { k: "ma" }, "فيم": { k: "ma" }, "عم": { k: "ma" },
    // …and مَا fused to a governor it DISARMS: the kaffa spellings.
    "انما": { k: "ma" }, "إنما": { k: "ma" }, "كأنما": { k: "ma" }, "لكنما": { k: "ma" },
    "ليتما": { k: "ma" }, "لعلما": { k: "ma" }, "ربما": { k: "ma" }, "أنما": { k: "ma" },
    "نعما": { k: "ma" }, "بئسما": { k: "ma" },
    "قلما": { k: "ma" }, "طالما": { k: "ma" }, "كثرما": { k: "ma" },
    "يا": { k: "nida" }, "هل": { k: "istifham" }, "أ": { k: "istifham" },
    "و": { k: "waw" }, "ف": { k: "fa" }, "ثم": { k: "atf" }, "او": { k: "atf" }, "أو": { k: "atf" },
    "اذا": { k: "shart" }, "إذا": { k: "shart" }, "لو": { k: "shart" }, "لولا": { k: "shart" },
    "كان": { k: "kana" }, "ليس": { k: "kana" }, "هو": { k: "pron" }, "هي": { k: "pron" },
    "هم": { k: "pron" }, "انا": { k: "pron" }, "أنا": { k: "pron" }, "انت": { k: "pron" }, "أنت": { k: "pron" },
    "هذا": { k: "ishara" }, "هذه": { k: "ishara" }, "ذلك": { k: "ishara" }, "تلك": { k: "ishara" },
    "الذي": { k: "mawsul" }, "التي": { k: "mawsul" }, "الذين": { k: "mawsul" }, "الا": { k: "istithna" }, "إلا": { k: "istithna" },
    // İzhar's fuller rolls: the rest of inna's sisters…
    "كأن": { k: "inna" }, "لكن": { k: "inna" }, "ليت": { k: "inna" }, "لعل": { k: "inna" },
    "لأن": { k: "inna" }, "لان": { k: "inna" },
    // …kana's sisters beyond kana and laysa…
    "صار": { k: "kana" }, "أصبح": { k: "kana" }, "اصبح": { k: "kana" }, "أمسى": { k: "kana" }, "ظل": { k: "kana" },
    // …and the conditional NOUNS among the fifteen jawazim
    "مهما": { k: "shart-jazim" }, "متى": { k: "shart-jazim" }, "أين": { k: "shart-jazim" }, "اين": { k: "shart-jazim" },
    "أنى": { k: "shart-jazim" }, "انى": { k: "shart-jazim" }, "حيثما": { k: "shart-jazim" }, "اذما": { k: "shart-jazim" },
    "إذما": { k: "shart-jazim" }, "أي": { k: "shart-jazim" },
  };
  // enclitic pronouns, longest first — a peeled one names itself: mudaf ilayh
  // behind a noun, maf'ul behind a verb (İzhar's own account of the ha).
  static ENCLITICS = ["هما", "كما", "تما", "هم", "هن", "كم", "كن", "نا", "ها", "ه", "ك"];
  // مَا fused to a jarr letter keeps ONE token in writing — مِمَّا، بِمَا، عَمَّا
  static JARR_MA_TEST = /^(مما|بما|عما|فيما|لما|كما|الام|إلام|علام|بم|فيم|عم|انما|إنما|أنما|كأنما|لكنما|ليتما|لعلما|ربما|قلما|طالما|كثرما|نعما|بئسما)$/;
  static KIND_LBL = {
    jarr:     { en: "jarr letter — the next noun should be majrur", tr: "cer harfi — sonraki isim mecrur olmalı" },
    inna:     { en: "inna family — nasb on its noun, raf' on its khabar", tr: "inne ailesi — ismini nasb, haberini raf eder" },
    "nasb-verb": { en: "nasb governor — awaits a mudari' verb", tr: "nâsıb — muzâri fiil bekler" },
    jazm:     { en: "jazm governor — awaits a mudari' verb", tr: "câzim — muzâri fiil bekler" },
    nafy:     { en: "negation la (or prohibition before a verb)", tr: "nefiy lâsı (fiilden önce nehiy de olabilir)" },
    ma:       { en: "ma — negation, relative, or masdar-maker; context decides", tr: "mâ — nefiy, mevsûl veya masdariyye; bağlam belirler" },
    qad:      { en: "qad — certainty with past, sometimes with mudari'", tr: "kad — mâzîyle tahkik, muzâriyle bazen" },
    sawfa:    { en: "future marker", tr: "istikbal edatı" },
    nida:     { en: "vocative — the next noun is a munada", tr: "nidâ — sonraki isim münâdâdır" },
    istifham: { en: "question particle", tr: "istifham edatı" },
    waw:      { en: "waw — joining, circumstance, oath or resumption; test with «while»", tr: "vav — atıf, hâl, kasem veya isti'nâf; «-iken» denemesi yapın" },
    fa:       { en: "fa — joining, consequence or answer", tr: "fâ — atıf, tefrî' veya cevap" },
    atf:      { en: "joining particle", tr: "atıf harfi" },
    shart:    { en: "conditional", tr: "şart edatı" },
    kana:     { en: "kana family — raf' on its noun, nasb on its khabar", tr: "kâne ailesi — ismini raf, haberini nasb eder" },
    "shart-jazim": { en: "conditional noun — one of the fifteen jawazim, jazm on two verbs", tr: "şart ismi — on beş câzimden; iki fiili cezmeder" },
    "an-amb": { en: "an — before a verb the masdar-maker (nasb); before a noun it is anna (inna family)", tr: "en — fiilden önce masdariyye (nasb eder); isimden önce enne'dir (inne ailesi)" },
    pron:     { en: "detached pronoun", tr: "munfasıl zamir" },
    ishara:   { en: "demonstrative", tr: "ism-i işaret" },
    mawsul:   { en: "relative noun", tr: "ism-i mevsûl" },
    istithna: { en: "exception particle", tr: "istisnâ edatı" },
  };
  static analyze(text){
    const words = (text || "").split(/[\s،.؛:!؟]+/).filter(w => stripAr(w).length);
    const out = [];
    // the İzhar queue: every recognised amil pushes what it EXPECTS to govern;
    // each following open-class word consumes one expectation.
    let expect = [];
    let afterVerb = false;
    words.forEach(w => {
      const bare = stripAr(w).replace(/[^ء-ي]/g, "");
      const row = { w, seg: [], notes: [], sure: false };
      let core = bare;
      // -- proclitics. و/ف only when what remains is a particle or definite
      // (a radical waw — وَصِيَّة — keeps its letter); ب/ل/ك are jarr clitics,
      // so the word that carries them IS the majrur; س marks the future.
      if (!this.PARTICLES[core] && /^[وف]/.test(core) && core.length > 1 &&
          (this.PARTICLES[core.slice(1)] || /^ال/.test(core.slice(1)))) {
        row.seg.push(core[0]);
        row.notes.push(this.KIND_LBL[core[0] === "و" ? "waw" : "fa"]);
        core = core.slice(1);
      }
      // ب/ل/ك peel ONLY before a definite noun or a known particle — the
      // kaf of كِتَاب and the ba of بَيْت are radicals, not prepositions.
      if (!this.PARTICLES[core] && /^[بلك]/.test(core) && core.length > 2 &&
          (/^.ال/.test(core) || this.PARTICLES[core.slice(1)])) {
        row.seg.push(core[0]);
        row.notes.push({ en: "jarr clitic — this very word is the majrur", tr: "cer öneki — mecrur olan bu kelimenin kendisidir" });
        core = core.slice(1);
      }
      if (!this.PARTICLES[core] && /^س[يتنأ]/.test(core) && core.length > 3) {
        row.seg.push("س");
        row.notes.push({ en: "future sin — a mudari' follows", tr: "istikbal sîni — muzâri gelir" });
        core = core.slice(1);
      }
      // -- the closed classes: knowledge, not guessing
      const p = this.PARTICLES[core];
      if (p) {
        row.kind = "particle"; row.sure = true;
        row.seg.push(core);
        row.notes.push(this.KIND_LBL[p.k]);
        // -- the hamza of ان reads by position (Qatr al-Nada): sentence-
        // initial and after the qawl verbs it is إِنَّ with kasra (speech is
        // quoted whole); after other verbs the clause melts into a masdar,
        // so it is أَنَّ with fatha. Applies to the ambiguous spellings only.
        // مَا wears twelve faces; the engine proposes them WITH their signals
        // and the Analyzer prints the ranked shortlist, never a single verdict.
        const lammaJazim = core === "لما" && /مَّ|مّ/.test(w.normalize("NFC"));
        if (!lammaJazim && (core === "ما" || this.JARR_MA_TEST.test(core))) {
          // the engine must see the word as PEELED — فَبِمَا reaches it as بما,
          // or the fused-jarr table and its signals will never match.
          const bares = words.map(x => stripAr(x).replace(/[^ء-ي]/g, ""));
          bares[out.length] = core;
          const wj = MaEngine.read(bares, out.length, words.map(x => x.normalize("NFC")),
            k => { const c = RootFinder.fromCorpus(bares[k]); return c && c.cell ? true : null; });
          if (wj.length) row.wajh = wj[0];
          wj.slice(0, 3).forEach((r, ri) => row.notes.push({
            en: `${ri ? "or " : ""}${r.ar} — ${r.en}: ${r.why.en}`,
            tr: `${ri ? "yahut " : ""}${r.ar} — ${r.tr}: ${r.why.tr}`,
          }));
        }
        if (core === "ان" || core === "أن") {
          // the governing verb may sit behind its fa'il (قَالَ زَيْدٌ إِنَّ):
          // walk back over noun rows to the nearest verb; a particle wall
          // ends the search.
          let pv = null;
          for (let bi = out.length - 1; bi >= 0; bi--) {
            const b = out[bi];
            if (b.kind && b.kind.startsWith("verb")) { pv = b; break; }
            if (b.kind === "particle") break;
          }
          const QAWL = /^(قال|قالت|قالوا|يقول|تقول|أقول|اقول|نقول|قل)$/;
          if (!out.length)
            row.notes.push({ en: "sentence-initial — read إِنَّ, the hamza with KASRA",
                             tr: "cümle başı — İNNE okunur, hemze KESRALI" });
          else if (pv && QAWL.test(pv.seg[0] || ""))
            row.notes.push({ en: "after a qawl verb — still إِنَّ with KASRA: the saying is quoted whole",
                             tr: "kavil fiilinden sonra — yine İNNE, hemze KESRALI: söz olduğu gibi aktarılır" });
          else if (pv)
            row.notes.push({ en: "after a verb — likely أَنَّ with FATHA: the clause melts into a masdar (that…)",
                             tr: "fiilden sonra — muhtemelen ENNE, hemze FETHALI: cümle masdara dönüşür (-dığını)" });
        }
        if (p.k === "jarr") expect = [{ en: "after a jarr letter — likely majrur", tr: "cer harfinden sonra — muhtemelen mecrur" }];
        else if (p.k === "jazm" || p.k === "nasb-verb" || p.k === "shart-jazim")
          expect = [{ en: "after a governor of verbs — a verb should follow", tr: "fiile âmil edattan sonra — fiil gelmeli", verb: true }];
        else if (p.k === "nida") expect = [{ en: "likely the munada", tr: "muhtemelen münâdâdır" }];
        else if (p.k === "inna") expect = [
          { en: "likely inna-family's ISM — mansub", tr: "muhtemelen innenin İSMİ — mensub" },
          { en: "then its KHABAR — marfu'", tr: "sonra HABERİ — merfû" }];
        else if (p.k === "kana") expect = [
          { en: "likely kana-family's ISM — marfu'", tr: "muhtemelen kânenin İSMİ — merfû" },
          { en: "then its KHABAR — mansub", tr: "sonra HABERİ — mensub" }];
        else expect = [];
        afterVerb = p.k === "kana";
        out.push(row); return;
      }
      // -- enclitic pronouns: peel from a long-enough remainder
      let enc = null;
      for (const e of this.ENCLITICS) {
        if (core.length - e.length >= 3 && core.endsWith(e)) { enc = e; core = core.slice(0, -e.length); break; }
      }
      // -- morphology signals: tentative
      const hasAl = /^ال/.test(core);
      const tanwin = /[ًٌٍ]/.test(w.normalize("NFC"));
      const taM = /ة$/.test(core);
      const verbish = /^[يتنأ]/.test(core) && core.length >= 3 && !hasAl;
      row.seg.push(core);
      if (enc) row.seg.push(enc);
      if (hasAl && tanwin)
        row.notes.push({ en: "⚠ definite article WITH tanwin — these never combine; check the vowelling", tr: "⚠ harf-i tarifle tenvin BİRLİKTE — asla birleşmez; harekeyi kontrol edin" });
      if (hasAl || tanwin || taM) {
        row.kind = "noun";
        if (hasAl) row.notes.push({ en: "definite article — a noun", tr: "harf-i tarif — isimdir" });
        if (tanwin) row.notes.push({ en: "tanwin — an indefinite noun", tr: "tenvin — nekre isimdir" });
        if (taM) row.notes.push({ en: "ta marbuta — a noun, feminine", tr: "tâ-i merbûta — müennes isimdir" });
      } else if (verbish) {
        row.kind = "verb?";
        row.notes.push({ en: "mudari'-like prefix — probably a verb", tr: "muzâri öneki — muhtemelen fiildir" });
      } else {
        row.kind = "noun?";
      }
      if (enc) row.notes.push(row.kind.startsWith("verb")
        ? { en: "attached pronoun — its maf'ul bihi", tr: "bitişik zamir — mef'ûlün bihidir" }
        : { en: "attached pronoun — the mudaf ilayh", tr: "bitişik zamir — muzâfun ileyhtir" });
      // -- consume one İzhar expectation, or inherit the verb's promise
      let expVerb = false;
      if (expect.length) { const e = expect.shift(); row.notes.push(e); expVerb = !!e.verb; }
      else if (afterVerb && row.kind === "noun" && (hasAl || !tanwin))
        row.notes.push({ en: "first noun after the verb — likely the fa'il, marfu'", tr: "fiilden sonraki ilk isim — muhtemelen fâil, merfû" });
      afterVerb = row.kind.startsWith("verb");
      // -- dig with the other machines
      const r = RootFinder.find(w);
      if (r) {
        row.root = r.root;
        if (r.via === "corpus") {
          row.lemma = r.lemma; row.gloss = r.gloss; row.sure = true;
          // the corpus knows WHICH cell matched — a mazi wears no prefix,
          // but a stored paradigm outranks the morphology guess entirely.
          if (r.cell) {
            row.kind = "verb";
            const lbl = formCellLabel(r.cell);
            row.notes.push({ en: "a corpus verb — " + lbl.en, tr: "külliyat fiili — " + lbl.tr });
            afterVerb = true;
          }
        }
        if (r.wazn) row.wazn = r.wazn;
      }
      const m = WaznEngine.of(w);
      if (m && m.mizan) row.wazn = m.mizan;
      // -- the İzhar contract beats the pattern guess: after a governor of
      // verbs a mazi cannot stand, so a ta-initial word there is a governed
      // mudari' whose ta is the person prefix — NOT Form V/VI's ta. Retire
      // the impossible mazi mizan (its realized masdar would lie) and try
      // the corpus once more on the stem behind the prefix.
      if (expVerb && verbish && !row.sure) {
        // compare on the skeleton — NFC reorders fatha before shadda, so a
        // literal تَفَعَّ never matches. Form V betrays itself by shadda,
        // Form VI by its alif; a true mudari mizan (تَفْعُلُ) has neither.
        const wb = row.wazn ? stripAr(row.wazn) : "";
        if (row.wazn && ((wb.startsWith("تفعل") && row.wazn.includes("ّ")) || wb.startsWith("تفاعل")))
          delete row.wazn;
        const cr = RootFinder.fromCorpus(core.slice(1));
        if (cr) {
          row.root = cr.root; row.lemma = cr.lemma; row.gloss = cr.gloss;
          row.sure = true; row.kind = "verb";
        }
        row.notes.push({ en: "a governed mudari' — the opening ta/ya is the person prefix, not Form V's ta",
                         tr: "âmilin çektiği muzâri — baştaki tâ/yâ şahıs önekidir, tefe''ul tâsı değil" });
      }
      // how is this word's case REALIZED? Pure rule, no corpus — and it
      // refuses when the surface genuinely cannot decide.
      const rz = IrabSign.of(w);
      if (rz) {
        row.realize = rz;
        row.notes.push({ en: rz.why.en, tr: rz.why.tr });
      }
      row.al = hasAl; row.tanwin = tanwin;
      // the proofreader rides along: impossible vowelling is flagged even
      // when every other layer is happy.
      HarakeAuditor.audit(w).forEach(a =>
        row.notes.push({ en: "⚠ " + a.en, tr: "⚠ " + a.tr }));
      // the corpus-trained model votes on open-class words — statistics,
      // clearly labeled, never claimed as i'rab.
      if (row.kind && row.kind.startsWith("noun")) {
        const prevKind = out.length ? (out[out.length - 1].kind === "verb" || out[out.length - 1].kind === "verb?" ? "verb"
          : (out[out.length - 1].kind === "particle" && out[out.length - 1].notes.some(x => /jarr letter|cer harfi/.test(x.en + x.tr))) ? "jarr"
          : out[out.length - 1].kind === "noun" ? "noun" : null) : null;
        const pred = IrabModel.predict(w, out.length, words.length, prevKind).slice(0, 2)
          .filter(p => p.p >= 0.2);
        if (pred.length) row.ml = pred.map(p => ({ r: p.r, pct: Math.round(p.p * 100) }));
      }
      out.push(row);
    });
    // -- idafa pass: a bare noun (no article, no tanwin) followed by a
    // definite noun reads as mudaf + mudaf ilayh — İzhar's third noun state.
    for (let i = 0; i + 1 < out.length; i++) {
      const a = out[i], b = out[i + 1];
      if (a.kind && a.kind.startsWith("noun") && !a.sure && !a.al && !a.tanwin &&
          !a.seg.includes("ه") && b.kind === "noun" && b.al) {
        a.notes.push({ en: "bare before a definite noun — likely mudaf (idafa)", tr: "harf-i tarifsiz ve tenvinsiz, ardından marife isim — muhtemelen muzâf (izâfet)" });
        b.notes.push({ en: "likely the mudaf ilayh — majrur", tr: "muhtemelen muzâfun ileyh — mecrur" });
      }
    }
    return out;
  }
}

// Qawa'id al-I'rab's first question about any sentence: what does it OPEN
// with? A verb makes it fi'liyya (a fa'il is coming); a noun makes it
// ismiyya (mubtada and khabar are coming). Joining و/ف and the closed
// introducers are looked through to the first weight-bearing word.
function sentenceType(rows){
  for (const r of rows) {
    if (r.kind === "particle") {
      const note = r.notes.map(n => n.en).join(" ");
      if (/kana family/.test(note)) return "filiyya";
      if (/inna family/.test(note)) return "ismiyya";
      if (/waw|fa —|joining|conditional|question|resum/i.test(note)) continue;
      return null;
    }
    if (r.kind && r.kind.startsWith("verb")) return "filiyya";
    if (r.kind && r.kind.startsWith("noun")) return "ismiyya";
  }
  return null;
}
const SENT_TYPE_LBL = {
  ismiyya: { ar: "جُمْلَةٌ اسْمِيَّةٌ",
             en: "opens with a noun — nominal: expect mubtada then khabar",
             tr: "isimle açılıyor — isim cümlesi: mübteda, sonra haber beklenir" },
  filiyya: { ar: "جُمْلَةٌ فِعْلِيَّةٌ",
             en: "opens with a verb — verbal: expect the fa'il after it",
             tr: "fiille açılıyor — fiil cümlesi: ardından fâil beklenir" },
};
// the hoca's question chain: after each word, the question the NEXT word
// answers — كِيمْ؟ نَه؟ نَاصِل؟ — exactly how the dershane walks a sentence.
const ROLE_Q = {
  fail:    { en: "who?",           tr: "kim?" },
  maful:   { en: "what / whom?",   tr: "neyi / kimi?" },
  mubtada: { en: "who/what is it about?", tr: "kimden/neden söz ediliyor?" },
  khabar:  { en: "what about them?", tr: "onun nesi / ne imiş?" },
  mudaf:   { en: "whose / of what?", tr: "kimin / neyin?" },
  hal:     { en: "in what state?",  tr: "ne hâlde / nasıl?" },
  jarr:    { en: "…?",              tr: "…?" },
};
const JARR_Q = {
  "ل": { en: "to whom / for what?", tr: "kime / ne için?" },
  "في": { en: "in what / where?", tr: "nede / nerede?" },
  "الى": { en: "to where?", tr: "nereye?" }, "إلى": { en: "to where?", tr: "nereye?" },
  "من": { en: "from what / than what?", tr: "neden / neyden?" },
  "على": { en: "upon what?", tr: "neyin üzerine?" },
  "عن": { en: "from / about what?", tr: "neyden / ne hakkında?" },
  "ب": { en: "with what?", tr: "neyle?" },
};
function hocaChain(rows, lang){
  const lines = [];
  rows.forEach((r, i) => {
    let gloss = "";
    if (r.gloss) gloss = T(r.gloss);
    else if (r.kind && r.kind.startsWith("verb") && r.root) {
      const mas = r.wazn ? realizeMasdar(r.root, r.wazn) : null;
      gloss = mas ? (lang === "tr" ? `masdarı: ${mas}` : `its masdar: ${mas}`)
                  : (lang === "tr" ? "fiil (masdarı semâî)" : "a verb (masdar is sema'i)");
    } else if (r.wajh) gloss = `${r.wajh.ar} — ${lang === "tr" ? r.wajh.tr : r.wajh.en}`;
    else if (r.kind === "particle") gloss = r.notes.length ? r.notes[r.notes.length - 1][lang] : "";
    // which question does the NEXT word answer?
    let q = null, qMl = false;
    const nxt = rows[i + 1];
    if (nxt) {
      if (r.kind && r.kind.startsWith("verb")) q = ROLE_Q.fail;
      else if (r.kind === "particle" && r.seg && JARR_Q[r.seg[r.seg.length - 1]]) q = JARR_Q[r.seg[r.seg.length - 1]];
      // the model's guess wears the model's badge — a statistical question
      // must never dress as a rule-derived one.
      else if (nxt.ml && nxt.ml.length && ROLE_Q[nxt.ml[0].r] && nxt.ml[0].pct >= 40) { q = ROLE_Q[nxt.ml[0].r]; qMl = true; }
    }
    lines.push(`<div class="hoca-line"><b lang="ar">${escapeAttr(r.w)}</b> — ${gloss || "·"}${
      q ? ` <span class="hoca-q">${qMl ? "🧠 " : ""}${q[lang]}${qMl ? (lang === "tr" ? " (tahmin)" : " (model guess)") : ""}</span>` : ""}</div>`);
  });

}
// the rough gloss — the user's «İmre'e kitabet etmedi bir mektub» line:
// known words speak their gloss, unknown verbs their realized masdar,
// everything else stays Arabic. Explicitly ROUGH; a bridge, not a claim.
function roughGloss(rows, lang){
  const bits = rows.map(r => {
    if (r.gloss) return T(r.gloss).split(/[,;·]/)[0].trim();
    if (r.kind && r.kind.startsWith("verb") && r.root && r.wazn) {
      const mas = realizeMasdar(r.root, r.wazn);
      if (mas) return mas + (lang === "tr" ? " etmek·" : " (to do)·");
    }
    if (r.kind === "particle") return null;
    return r.seg ? r.seg[0] : r.w;
  }).filter(Boolean);
  return bits.length > 1 ? bits.join(" — ") : null;
}

// The I'lal Lab. The root and the wazn make an ASL; the rule engine does the
// rest, and every firing is shown with the rule that fired it — the chain a
// Maksud student recites. A root that needs no i'lal shows an empty chain and
// says so: that is information too.
function renderIlalOut(){
  const out = document.getElementById("ilalOut");
  if (!out) return;
  const E = escapeAttr;
  const raw = (conjState.ilalRoot || "").normalize("NFC").replace(/[^ء-ي]/g, "");
  if (raw.length !== 3) { out.innerHTML = `<p class="empty">${ui().jadhrBad}</p>`; return; }
  const b = IlalEngine.build(raw, conjState.ilalShape);
  if (!b) { out.innerHTML = `<p class="empty">${ui().jadhrBad}</p>`; return; }
  let h = `<div class="ilal-flow">
    <div class="if-end"><span class="if-lbl">${ui().ilalAsl}</span><b lang="ar">${E(b.asl)}</b></div>
    <div class="if-arrow">→</div>
    <div class="if-end out"><span class="if-lbl">${ui().ilalOutLbl}</span><b lang="ar">${E(b.out)}</b></div>
  </div>`;
  if (b.blocked) {
    h += `<div class="ilal-block">
      <div class="ib-head">${ui().ilalBlocked}</div>
      <div class="ib-ar" lang="ar">${b.blocked.ar}</div>
      <div class="ib-gloss">${state.uiLang === "tr" ? b.blocked.tr : b.blocked.en}</div>
      <div class="ib-kind">${b.blocked.why === "wazn" ? ui().ilalByRule : ui().ilalByLexicon}</div>
    </div>`;
  } else if (!b.steps.length) {
    h += `<p class="ilal-none">${ui().ilalNone}</p>`;
  } else {
    h += `<ol class="ilal-steps">` + b.steps.map((s, k) => `<li>
      <div class="is-n">${k + 1}</div>
      <div class="is-body">
        <div class="is-forms" lang="ar" dir="rtl">${E(s.before)} <span class="is-to">←</span> ${E(s.after)}</div>
        <div class="is-rule" lang="ar">${s.ar}</div>
        <div class="is-gloss">${state.uiLang === "tr" ? s.tr : s.en}</div>
      </div></li>`).join("") + `</ol>`;
  }
  out.innerHTML = h;
}

function renderNidaOut(){

  if (!out) return;
  const txt = (conjState.nida || "").trim();
  const E = escapeAttr;
  if (!txt) { out.innerHTML = ""; return; }
  const r = NidaEngine.read(txt);
  if (!r) { out.innerHTML = ""; return; }
  if (!r.ok) {
    const msg = { particle: ui().nidaErrParticle, empty: ui().nidaErrEmpty,
                  alAfterYa: ui().nidaErrAl, tanwin: ui().nidaErrTanwin,
                  unvowelled: ui().nidaErrUnvowelled }[r.reason] || "";
    out.innerHTML = `<div class="nida-bad">${msg}${
      r.fix ? `<span class="fix">${r.particle ? r.particle.ar + " " : ""}${E(r.fix)}</span>` : ""}</div>`;
    return;
  }
  const call = `${r.particle ? `<span class="prt">${r.particle.ar}</span> ` : ""}<span class="mn">${E(r.munada)}</span>${
    r.tail ? " " + E(r.tail) : ""}`;
  const row = (k, arLine, plain) => `<div class="nida-row"><div class="k">${k}</div><div class="v">${
    arLine ? `<span class="ar">${arLine}</span>` : ""}${plain || ""}</div></div>`;
  let h = `<div class="nida-verdict">
    <div class="nida-call" lang="ar">${call}</div>

    ${row(ui().nidaKind, r.kindLabel.ar, T(r.kindLabel))}
    ${row(ui().nidaSign, r.signLabel.ar, T(r.signLabel))}
    <div class="nida-why"><span class="ar" lang="ar" style="font-family:var(--ar-font);font-size:1.1rem">${
      NidaEngine.WHY[r.ruling === "mabni" ? "mabni" : "mansub"].ar}</span><br>${
      T(NidaEngine.WHY[r.ruling === "mabni" ? "mabni" : "mansub"])}</div>
    ${r.ambiguous ? `<div class="nida-why">${ui().nidaAmbiguous}</div>` : ""}
  </div>`;
  // The derivations only make sense for a munada that stands alone; a mudaf is

             <div class="sub">${ui().nidaGhayr}${tk.same ? " — " + ui().nidaSame : ""}</div>
             <div class="sub">${ui().nidaDropped} <span lang="ar">${E(tk.dropped.join(" "))}</span>${
               tk.needsAlam ? " · " + ui().nidaNeedsAlam : ""}</div>`
          : `<div class="sub">${ui().nidaNoTarkhim}</div>`}</div>
      <div class="d"><h4>${ui().nidaNadb}</h4>${
        nd ? `<div class="frm" lang="ar">${E(nd.call)}</div>` : ""}</div>

function renderIsmOut(){
  const out = document.getElementById("ismOut");
  if (!out) return;
  const w = (conjState.ism || "").trim();
  if (!w || stripAr(w).replace(/[^ء-ي]/g, "").length < 2) {
    out.innerHTML = `<p class="empty">${ui().jadhrBad}</p>`;
    return;
  }
  const t = IsmEngine.tasgir(w);
  const n = IsmEngine.nisba(w);
  let h = "";
  if (t) h += `<div class="adad-phrase" lang="ar" dir="rtl">${ui().tasgirLbl} ${t.out}</div>
    <p class="bab-line" lang="ar">${t.rule}</p>`;
  else h += `<p class="empty">${ui().tasgirNone}</p>`;
  if (n) h += `<div class="adad-phrase" lang="ar" dir="rtl">${ui().nisbaLbl} ${n.out}</div>
    <p class="bab-line" lang="ar">${n.rule}</p>
    ${n.semai ? `<p class="sarf-note">${ui().ismSemai}</p>` : ""}`;
  // ---- the qiyasi derivations: resolve a triliteral root, then let the
  // rules speak. Bab (for مَفْعَل/مَفْعِل) comes from the corpus when the
  // verb is attested; otherwise both forms stand, honestly labeled.
  let root = null;
  const bare3 = stripAr(w).replace(/[^ء-ي]/g, "");
  if (bare3.length === 3 && !/^ال/.test(bare3)) root = bare3.split("");
  else {
    const rf = RootFinder.find(w);
    if (rf && rf.root) {
      const rs = rf.root.split(/\s+/).filter(x => /^[ء-ي]$/.test(x));
      if (rs.length === 3) root = rs;
    }
  }
  if (root) {
    const key = root.join("").replace(/ى/g, "ي");
    const hit = conjKnownMap()[key];
    const mk = (hit && hit.form === "I" && hit.bab) ? (hit.bab === 2 || hit.bab === 6) : null;
    const tf = IsmEngine.tafdil(root);
    const zm = IsmEngine.zamanMakan(root, mk);
    const al = IsmEngine.alat(root);
    h += `<p class="conj-known"><span lang="ar">${ui().jadhrRoot} ${root.join(" ")}</span>${
      hit && hit.form === "I" && hit.bab ? ` · <span lang="ar">${hit.mazi || ""}</span> ✓` : ""}</p>`;
    if (tf) h += `<div class="adad-phrase" lang="ar" dir="rtl">${ui().tafdilLbl} ${tf.out}</div>
      <p class="bab-line" lang="ar">${tf.rule}</p>`;
    if (zm) h += `<div class="adad-phrase" lang="ar" dir="rtl">${ui().zamakLbl} ${zm.out}</div>
      <p class="bab-line" lang="ar">${zm.rule}</p>${zm.both ? `<p class="sarf-note">${ui().zamakBoth}</p>` : ""}`;
    if (al) h += `<div class="adad-phrase" lang="ar" dir="rtl">${ui().alatLbl} ${al.out}</div>
      <p class="bab-line" lang="ar">${al.rule}</p>`;
    else h += `<p class="sarf-note">${ui().alatSemai}</p>`;
  }
  out.innerHTML = h;
}
