 where the meaning did not bend to accommodate the sound.","tr":"Cinâs ile ma'nevî muhassinâttan lafzî olanlara geçeriz. Cinâs, iki lafzın telaffuzda birbirine benzemesidir; ya tam ya nâkıstır. Tam cinâs, iki lafzın harflerinin nev'inde, adedinde, hey'etinde (harekelerinde) ve tertibinde ittifak etmesidir. İkisi de aynı nevden ise mümâsil olur — «وَيَوْمَ تَقُومُ السَّاعَةُ يُقْسِمُ الْمُجْرِمُونَ مَا لَبِثُوا غَيْرَ سَاعَةٍ»: kıyamet saati ve bir saat. İki ayrı nevden iseler müstevfâ olur; biri fiil biri isim olan iki يَحْيَى gibi. Taraflardan biri mürekkeb olursa isimler yine değişir: terkîb; hatlarının bir olup olmamasına göre müteşâbih yahut mefrûk. Nâkıs cinâs, bu ittifakın eksik kalmasıdır: yalnız harekelerde ihtilâf muharref; harf adedinde ihtilâf âdî nâkıstır ve fazla harf sonda ise mutarraf denir — عَوَاصِم yanında عَوَاصٍ — kuyruk daha uzunsa müzeyyel olur. İki şey daha cinâsa katılır fakat hakikatte cinâs değildir: iştikakta birleşen iki lafız, «فَأَقِمْ وَجْهَكَ لِلدِّينِ الْقَيِّمِ»; ve iştikaka benzeyen bir müşâbehette birleşen iki lafız, قَالَ yanında «إِنِّي لِعَمَلِكُمْ مِنَ الْقَالِينَ». Klasik nesrin fiilen üzerinde yürüdüğü ve bizim metinlerimizde bulunan da bu sonuncu ailedir — iştikak: masdarın kendi fiilinin yanına, ismin kendisinden türediği fiilin yanına konulması. Bunu bir hüner değil bir edep olarak oku: gelenek cinâsı ancak mana sese kurban edilmediği yerde över."},"plain":{"en":"Two words that sound alike, set close together.","tr":"Sesçe birbirine benzeyen iki kelimeyi yan yana getirmek."},"sources":["تلخيص المفتاح (القزويني) — علم البديع، المحسنات اللفظية","مختصر السعد"],"examples":[{"ar":"فَإِنَّهُمْ يَأْخُذُونَ أَمْوَالَكَ وَيَطْمَعُونَ فِيهَا غَايَةَ الطَّمَعِ.","gloss":{"en":"يَطْمَعُونَ and الطَّمَع share one derivation — the mulhaq-bi'l-jinas kind. It is also a maful mutlaq, which is why the sound and the sense reinforce each other instead of competing.","tr":"يَطْمَعُونَ ile الطَّمَع iştikakta birleşir — cinâsa mülhak olan kısım. Aynı zamanda mef'ûl-i mutlaktır; ses ile mana bu yüzden çekişmez, birbirini pekiştirir."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"وَالْجَوْهَرُ هُوَ الْجُزْءُ الَّذِي لَا يَتَجَزَّى.","gloss":{"en":"الْجُزْء beside يَتَجَزَّى: the same root affirming and denying itself. The definition of the atom is stated in a single derivation.","tr":"الْجُزْء yanında يَتَجَزَّى: aynı kök hem kendini kurar hem nefyeder. Cevherin tarifi tek bir iştikakla söylenmiştir."},"src":"aqaid-ahl-al-sunna"},{"ar":"رَجُلٌ أَمْكَنَهُ طَلَبُ الْعِلْمِ فِي الدُّنْيَا فَلَمْ يَطْلُبْهُ.","gloss":{"en":"The masdar طَلَب beside its own verb يَطْلُبْ — joined by derivation, and at the same time a tibaq al-salb: what he could have sought, he did not seek.","tr":"طَلَب masdarı kendi fiili يَطْلُبْ ile yan yana — iştikakla birleşmiş, aynı anda bir tıbâku's-selb: talep edebileceği şeyi talep etmedi."},"src":"min-muqaddimat-al-maqsud"},{"ar":"وَجِئْتُكَ مِنْ سَبَإٍ بِنَبَإٍ يَقِينٍ.","gloss":{"en":"سَبَإ and نَبَإ differ in one letter and stand next to each other — the Talkhis's example of the muzdawij kind (al-Naml 22).","tr":"سَبَإ ile نَبَإ tek harfte ayrılır ve yan yana gelir — Telhîs'in müzdevic kısmı için verdiği misal (Neml 22)."},"src":null}],"mistakes":[{"wrong":"«مُبَادَلَةُ مَالٍ بِمَالٍ» جِنَاسٌ","right":"تَكْرَارُ اللَّفْظِ نَفْسِهِ، وَالْجِنَاسُ بَيْنَ لَفْظَيْنِ","why":{"en":"Jinas is a resemblance between two words. One word said twice is repetition — a real device, but a different one.","tr":"Cinâs iki lafız arasındaki benzerliktir. Bir lafzın iki kere söylenmesi tekrardır — o da bir sanattır, fakat başkasıdır."}},{"wrong":"«الْجُزْءُ / يَتَجَزَّى» جِنَاسٌ تَامٌّ","right":"مُلْحَقٌ بِالْجِنَاسِ بِالِاشْتِقَاقِ","why":{"en":"A jinas tamm requires the two to agree in the kind, number, vowelling and order of their letters. These two agree only in their root, so the book files them under what is joined to jinas, not under jinas.","tr":"Cinâs-ı tam, harflerin nev'inde, adedinde, hey'etinde ve tertibinde ittifak ister. Bu ikisi yalnız kökte birleşir; bu yüzden kitap onları cinâsın altına değil, cinâsa mülhak olanların altına koyar."}},{"wrong":"يَحْسُنُ الْجِنَاسُ وَإِنْ تُكُلِّفَ لَهُ الْمَعْنَى","right":"الْمُحَسِّنَاتُ اللَّفْظِيَّةُ بَعْدَ رِعَايَةِ الْمُطَابَقَةِ وَوُضُوحِ الدَّلَالَةِ","why":{"en":"Badi' is defined as what beautifies speech *after* the sense fits the situation and the meaning is clear. A jinas bought at the price of the meaning is not badi' at all.","tr":"Bedî', sözü ancak mutâbakat ve delâletin vuzûhu gözetildikten *sonra* güzelleştiren vecihler diye tarif edilir. Mana pahasına elde edilen cinâs, aslında bedî' değildir."}}]},"jumla-mutarida":{"title":{"ar":"الْجُمْلَةُ الْمُعْتَرِضَة","en":"The parenthetical clause","tr":"Cümle-i mu'teriza"},"level":5,"group":"nahw","explanation":{"en":"A clause can be dropped into the middle of a sentence without being part of it. It comes between two things that belong together — a verb and its object, a mubtada and its khabar, a mudaf and what follows — and it has no case position at all: لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ. The commonest kind by far is the invocation: تَعَالَى, سُبْحَانَهُ, رَحِمَهُ اللهُ, صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ. When you read «إِنْسَانٌ بَعَثَهُ اللهُ تَعَالَى إِلَى الْخَلْقِ», the تَعَالَى is not an adjective of the majestic name and not a second verb in the chain; it is a prayer set inside the sentence, and the sentence would be complete without it. The practical test: lift the clause out. If what remains is still a whole sentence, the clause was mu'tarida.","tr":"Bir cümle, cümlenin öğesi olmadan söz arasına girebilir. Birbirine bağlı iki unsurun — fiil ile mef'ûlünün, mübteda ile haberin, muzâf ile muzâfun ileyhin — arasına girer ve i'rabdan mahalli yoktur. En yaygın türü duâ cümlesidir: تَعَالَى، سُبْحَانَهُ، رَحِمَهُ اللهُ، صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ. «إِنْسَانٌ بَعَثَهُ اللهُ تَعَالَى إِلَى الْخَلْقِ» okurken تَعَالَى, lafza-i celâlin sıfatı yahut ikinci bir fiil değildir; cümlenin içine yerleştirilmiş bir duâdır ve o olmadan da cümle tamamdır. Pratik ölçü: cümleyi çıkarın; geriye kalan hâlâ tam bir cümle ise o cümle mu'terizadır."},"plain":{"en":"A clause dropped into the middle of a sentence without belonging to it — most often a blessing, like «Allah, exalted is He».","tr":"Cümlenin ortasına, ona dâhil olmadan giren cümlecik — çoğu zaman «Allah — teâlâ —» gibi bir duâ."},"sources":["الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"examples":[{"ar":"الرَّسُولُ إِنْسَانٌ بَعَثَهُ اللهُ تَعَالَى إِلَى الْخَلْقِ.","gloss":{"en":"…whom Allah — exalted is He — has sent to creation.","tr":"…Allah Teâlâ'nın mahlukata gönderdiği."},"src":"aqaid-ahl-al-sunna"},{"ar":"مُتَابَعَةُ أَهْلِ السُّنَّةِ وَالْجَمَاعَةِ — اللهُ سُبْحَانَهُ كَثَّرَهُمْ — فِي الْأَفْعَالِ وَالْأَقْوَالِ.","gloss":{"en":"…following Ahl al-Sunna — may Allah, glorified is He, increase them — in deeds and words. The prayer sits between the mudaf ilayh and the phrase that completes مُتَابَعَة.","tr":"…Ehl-i Sünnet'e tâbi olmak — Allah Sübhânehû onları çoğaltsın — fiillerde ve sözlerde. Duâ, muzâfun ileyh ile مُتَابَعَة'yi tamamlayan ifade arasına girmiştir."},"src":"aqaid-ahl-al-sunna"},{"ar":"الْعَالَمُ مَا سِوَى اللهِ تَعَالَى مِنَ الْمَوْجُودَاتِ.","gloss":{"en":"The world is what is other than Allah — exalted is He — among existent things.","tr":"Âlem, Allah Teâlâ'nın dışında kalan mevcudattır."},"src":"aqaid-ahl-al-sunna"}],"mistakes":[{"wrong":"اللهُ تَعَالَى — «تَعَالَى» نَعْتٌ لِلَفْظِ الْجَلَالَةِ","right":"«تَعَالَى» جُمْلَةٌ فِعْلِيَّةٌ دُعَائِيَّةٌ مُعْتَرِضَةٌ","why":{"en":"تَعَالَى is a verb, and a verb is never a na't. It is a whole clause slipped into the sentence.","tr":"تَعَالَى fiildir, fiil ise na't olmaz. Söz arasına girmiş müstakil bir cümledir."}},{"wrong":"قَالَ — رَحِمَهُ اللهُ — كَلَامًا؛ فَـ«رَحِمَهُ» مَعْطُوفَةٌ عَلَى «قَالَ»","right":"«رَحِمَهُ اللهُ» مُعْتَرِضَةٌ لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ","why":{"en":"The invocation is not coupled to the main verb — nothing joins them, and the speaker is not doing two things.","tr":"Duâ cümlesi ana fiile matûf değildir; aralarında atıf harfi yoktur ve fâil iki iş yapmamaktadır."}}]},"jumla-sifa":{"title":{"ar":"الْجُمْلَةُ الْوَاقِعَةُ صِفَةً","en":"A clause standing as an adjective","tr":"Sıfat olan cümle"},"level":5,"group":"nahw","explanation":{"en":"An adjective need not be a single word. A whole clause can describe a noun, and the tradition states the rule in one line: الْجُمَلُ بَعْدَ النَّكِرَاتِ صِفَاتٌ وَبَعْدَ الْمَعَارِفِ أَحْوَالٌ — clauses after indefinite nouns are adjectives, after definite nouns they are hal. So in «صِفَةٌ يَتَجَلَّى بِهَا الْمَذْكُورُ» the indefinite صِفَةٌ is described by the verbal clause that follows: «an attribute by which the named thing becomes manifest». Three things to hold on to. The clause must contain a pronoun linking it to the noun (the same عَائِد as in a relative clause) — here بِهَا. The clause takes the case POSITION of the noun it describes, which is why we say «فِي مَحَلِّ رَفْعٍ صِفَةٌ» after a marfu' noun and «فِي مَحَلِّ جَرٍّ صِفَةٌ» after a majrur one. And the noun must genuinely be indefinite: قَوْمٍ in «قَوْمٍ لَا يُتَصَوَّرُ تَوَاطُؤُهُمْ» is indefinite, so the clause is its sifa; make the noun definite and the same clause becomes a hal.","tr":"Sıfatın tek kelime olması şart değildir; bir cümle de ismi niteleyebilir. Kaide tek satırdır: الْجُمَلُ بَعْدَ النَّكِرَاتِ صِفَاتٌ وَبَعْدَ الْمَعَارِفِ أَحْوَالٌ — nekrelerden sonraki cümleler sıfat, marifelerden sonrakiler hâldir. «صِفَةٌ يَتَجَلَّى بِهَا الْمَذْكُورُ» ifadesinde nekre olan صِفَةٌ, kendisinden sonraki fiil cümlesiyle nitelenir. Üç noktayı unutmayın. Cümlede ismi bağlayan bir zamir (âid) bulunmalıdır — burada بِهَا. Cümle, nitelediği ismin i'rab MAHALLİNİ alır; merfû isimden sonra «ref mahallinde sıfat», mecrûr isimden sonra «cer mahallinde sıfat» denir. Ve isim gerçekten nekre olmalıdır: «قَوْمٍ لَا يُتَصَوَّرُ تَوَاطُؤُهُمْ» ifadesinde قَوْمٍ nekredir, dolayısıyla cümle sıfattır; isim marife olsaydı aynı cümle hâl olurdu."},"plain":{"en":"A whole clause used as an adjective. After an indefinite noun it describes it; after a definite one it tells you a state instead.","tr":"Sıfat olarak kullanılan tam cümle. Nekreden sonra sıfat, marifeden sonra hâl olur."},"mamul":"tabai","sources":["الكافية (ابن الحاجب) — التوابع","إظهار الأسرار (البركوي)","قطر الندى (ابن هشام)"],"examples":[{"ar":"الْعِلْمُ صِفَةٌ يَتَجَلَّى بِهَا الْمَذْكُورُ.","gloss":{"en":"Knowledge is an attribute by which the named thing becomes manifest — the clause stands in raf', describing the indefinite صِفَةٌ.","tr":"İlim, kendisiyle mezkûrun açığa çıktığı bir sıfattır — cümle, nekre olan صِفَةٌ'yi niteleyerek ref mahallindedir."},"src":"aqaid-ahl-al-sunna"},{"ar":"عَلَى أَلْسِنَةِ قَوْمٍ لَا يُتَصَوَّرُ تَوَاطُؤُهُمْ عَلَى الْكَذِبِ.","gloss":{"en":"…of a people whose collusion upon a lie cannot be conceived — the clause stands in jarr, following قَوْمٍ.","tr":"…yalan üzerinde birleşmeleri düşünülemeyen bir topluluğun — cümle قَوْمٍ'den sonra cer mahallindedir."},"src":"aqaid-ahl-al-sunna"},{"ar":"الرَّسُولُ إِنْسَانٌ بَعَثَهُ اللهُ تَعَالَى إِلَى الْخَلْقِ.","gloss":{"en":"A messenger is a human being whom Allah has sent to creation — the ‘aid is the ـهُ of بَعَثَهُ.","tr":"Resul, Allah'ın mahlukata gönderdiği bir insandır — âid, بَعَثَهُ'deki هُ'dir."},"src":"aqaid-ahl-al-sunna"}],"mistakes":[{"wrong":"رَأَيْتُ الرَّجُلَ يَقْرَأُ — «يَقْرَأُ» صِفَةٌ","right":"«يَقْرَأُ» جُمْلَةٌ حَالِيَّةٌ، لِأَنَّ «الرَّجُلَ» مَعْرِفَةٌ","why":{"en":"After a definite noun the clause is a hal, not a sifa — «I saw the man while he was reading», not «the man who reads».","tr":"Marife isimden sonra gelen cümle sıfat değil hâldir: «adamı okurken gördüm», «okuyan adamı gördüm» değil."}},{"wrong":"جَاءَ رَجُلٌ يَقْرَأُ الْكِتَابَ — «يَقْرَأُ» مَرْفُوعَةٌ صِفَةً","right":"الْجُمْلَةُ فِي مَحَلِّ رَفْعٍ صِفَةٌ لِـ«رَجُلٌ»","why":{"en":"A clause has no ending to inflect, so it is never itself marfu'. It occupies the POSITION of raf' — say «فِي مَحَلِّ رَفْعٍ».","tr":"Cümlenin çekilecek bir sonu yoktur, kendisi merfû olmaz; ref MAHALLİNDE bulunur — «فِي مَحَلِّ رَفْعٍ» denir."}},{"wrong":"هَذَا كِتَابٌ قَرَأْتُ","right":"هَذَا كِتَابٌ قَرَأْتُهُ","why":{"en":"A describing clause needs its ‘aid just as a relative clause does; without ـهُ the clause floats free of the noun.","tr":"Sıfat cümlesi de sıla gibi âide muhtaçtır; ـهُ olmadan cümle isimle bağını kurmaz."}}]},"kana-wa-akhawatuha":{"title":{"ar":"كَانَ وَأَخَوَاتُهَا","en":"Kana and its sisters","tr":"Kâne ve kardeşleri"},"level":2,"group":"nahw","explanation":{"en":"كَانَ and its sisters — صَارَ، لَيْسَ، أَصْبَحَ، أَمْسَى، أَضْحَى، ظَلَّ، بَاتَ، مَا زَالَ، مَا دَامَ … — are the الأفعال الناقصة (defective verbs): they carry tense but no full meaning of their own, so they need a predicate to complete them. They enter a nominal sentence (mubtada + khabar) and re-work it: the old mubtada becomes the اسم كان and stays marfu', while the old khabar becomes the خبر كان and turns mansub. This is the exact mirror of إِنَّ, which does the opposite (nasb on the ism, raf' on the khabar) — so the two make a clean contrasting pair. If the story's nominal sentence «الْعِلْمُ أَمَانَةٌ» took كان, it would read «كَانَ الْعِلْمُ أَمَانَةً»: الْعِلْمُ raised as ism, أَمَانَةً dropped to nasb as khabar. Ibn Ajurrum gives them their own chapter (\"ترفع الاسم وتنصب الخبر\"); Birgivi counts them among the لفظية governors in the Awamil.","tr":"كَانَ ve kardeşleri — صَارَ، لَيْسَ، أَصْبَحَ، أَمْسَى، أَضْحَى، ظَلَّ، بَاتَ، مَا زَالَ، مَا دَامَ … — nâkıs fiillerdir: zaman taşırlar ama tek başlarına tam mana vermezler, tamamlanmak için bir habere ihtiyaç duyarlar. İsim cümlesine (mübteda + haber) girip onu yeniden düzenlerler: eski mübteda kânenin ismi olur ve merfu kalır; eski haber kânenin haberi olur ve mansub olur. Bu, tam olarak إِنَّ'nin tersidir (o ismi nasb, haberi ref eder) — böylece ikisi karşıt bir çift oluşturur. Hikâyedeki «الْعِلْمُ أَمَانَةٌ» isim cümlesi كان alsaydı «كَانَ الْعِلْمُ أَمَانَةً» olurdu: الْعِلْمُ ism olarak merfu, أَمَانَةً haber olarak mansub. İbn Âcurrûm bunlara ayrı bir bab ayırır (\"ismi ref, haberi nasb eder\"); Birgivî Avâmil'de bunları lafzî âmiller arasında sayar."},"plain":{"en":"كَانَ and its family leave the topic as it was and put the predicate in the accusative.","tr":"كَانَ ve kardeşleri mübtedayı olduğu gibi bırakır, haberi nasb eder."},"amil":"تَرْفَعُ الِاسْمَ وَتَنْصِبُ الْخَبَرَ — the defective verbs that raise the subject to raf' and put the predicate in nasb","mamul":"marfu","sources":["الآجُرُّومِيَّة (ابن آجُرُّوم)","العوامل (البيركوي)","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"question":{"tr":["Ne? Kim? (ismi)","Nedir? Kimdir? (haberi)"],"en":["What? Who? (its noun)","What is it? Who is it? (its khabar)"]},"examples":[{"ar":"كَانَ الْعِلْمُ أَمَانَةً.","gloss":{"en":"Knowledge was a trust — the كان mirror of the story's «إِنَّ الْعِلْمَ أَمَانَةٌ» (s7): here الْعِلْمُ is the ism, raised to raf', and أَمَانَةً is the khabar, dropped to nasb.","tr":"İlim bir emanetti — hikâyedeki «إِنَّ الْعِلْمَ أَمَانَةٌ» (s7) cümlesinin كان ile aynadaki hâli: burada الْعِلْمُ isimdir, ref'e yükselir; أَمَانَةً haberdir, nasba iner."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"صَارَ الطَّالِبُ عَالِمًا.","gloss":{"en":"The student became a scholar — الطَّالِبُ ism (raf'), عَالِمًا khabar (nasb).","tr":"Talebe âlim oldu — الطَّالِبُ isim (ref), عَالِمًا haber (nasb)."},"src":null},{"ar":"لَيْسَ الْكَلَامُ كَثِيرًا مَحْمُودًا.","gloss":{"en":"Much talk is not praiseworthy — لَيْسَ negates and works like كان: الكلامُ marfu' ism, محمودًا mansub khabar.","tr":"Çok söz övülmüş değildir — لَيْسَ nefyeder ve كان gibi amel eder: الكلامُ merfû ism, محمودًا mansub haber."},"src":null}],"mistakes":[{"wrong":"كَانَ الْعِلْمُ أَمَانَةٌ","right":"كَانَ الْعِلْمُ أَمَانَةً","why":{"en":"The khabar of كان must be mansub. Learners keep the mubtada's raf' damma on it out of habit; كان demands nasb on the predicate — أَمَانَةً.","tr":"Kânenin haberi mansub olmalıdır. Öğrenciler alışkanlıkla mübtedanın ref ötresini haberde bırakır; kâne haberi nasb ister — أَمَانَةً."}},{"wrong":"كَانَ الْعِلْمَ أَمَانَةً","right":"كَانَ الْعِلْمُ أَمَانَةً","why":{"en":"Confusing كان with إنّ: كان raises its ism to raf' (الْعِلْمُ), it does not put it in nasb. Only the khabar of كان is mansub — the opposite of what إنّ does.","tr":"Kâne ile إنّ'yi karıştırmak: kâne ismini ref eder (الْعِلْمُ), nasb etmez. Kânede yalnız haber mansubdur — إنّ'nin yaptığının tersi."}}]},"kinaya":{"title":{"ar":"الْكِنَايَة","en":"Allusion — saying it by its consequence","tr":"Kinâye — lâzımıyla söylemek"},"level":5,"group":"balagha","explanation":{"en":"A kinaya is لَفْظٌ مُسْتَعْمَلٌ فِي لَازِمِ مَا وُضِعَ لَهُ بِلَا قَرِينَةٍ مَانِعَة — a word used for what its literal meaning ENTAILS, with nothing blocking the literal reading. That last clause is the whole difference from majaz. In a majaz the clue forbids you the literal sense; in a kinaya the literal sense stays perfectly available and you take the entailment as well. «طَوِيلُ النِّجَادِ» means the man's sword-belt is long — it really is — and therefore that he is tall. Both readings stand. That is why kinaya carries more force than plain statement: it does not assert the claim, it hands you the evidence and lets you draw it. The wasiyya's «الْبَهَائِمُ تُنَادَى مِنْ خَلْفِهَا» never calls anyone an animal; it states a fact about animals and leaves the listener to finish the sentence about himself. That oblique form has its own name, تَعْرِيض.","tr":"Kinâye: لَفْظٌ مُسْتَعْمَلٌ فِي لَازِمِ مَا وُضِعَ لَهُ بِلَا قَرِينَةٍ مَانِعَة — hakikî mananın GEREKTİRDİĞİ şey için, hakikî manayı engelleyen bir karîne olmaksızın kullanılan lafız. Son kayıt, mecazdan bütün farkıdır. Mecazda karîne hakikî manayı yasaklar; kinâyede hakikî mana da tamamen ayakta kalır, siz ayrıca lâzımını alırsınız. «طَوِيلُ النِّجَادِ» adamın kılıç bağının uzun olduğunu söyler — gerçekten uzundur — ve dolayısıyla boyunun uzun olduğunu. İki okuyuş da geçerlidir. Kinâyenin sarih sözden daha kuvvetli olmasının sebebi budur: iddiayı öne sürmez, delili verir ve neticeyi size çıkarttırır. Vasiyetteki «الْبَهَائِمُ تُنَادَى مِنْ خَلْفِهَا» kimseye hayvan demez; hayvanlar hakkında bir şey söyler ve cümleyi muhatabın kendisi hakkında tamamlamasını bırakır. Bu dolaylı şekle ta'rîz denir."},"plain":{"en":"Saying a thing by naming what follows from it: «the ash of his cooking-pot is deep» for «he is generous».","tr":"Bir şeyi, ondan doğan neticeyi anarak söylemek: «cömerttir» yerine «tenceresinin külü çoktur»."},"sources":["تلخيص المفتاح (القزويني) — علم البيان","علاقات المجاز"],"examples":[{"ar":"وَمَنْ دَعَاكَ مِنْ خَلْفِكَ فَلَا تُجِبْهُ، فَإِنَّ الْبَهَائِمَ تُنَادَى مِنْ خَلْفِهَا.","gloss":{"en":"Do not answer one who calls you from behind — beasts are what get called from behind. Nobody is called an animal; the hearer finishes it.","tr":"Arkandan çağırana cevap verme; zira hayvanlar arkalarından çağrılır. Kimseye hayvan denmez; neticeyi muhatap çıkarır."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"طَوِيلُ النِّجَادِ.","gloss":{"en":"Long of sword-belt — and therefore tall. The literal sense is not cancelled.","tr":"Kılıç bağı uzun — dolayısıyla boylu. Hakikî mana iptal edilmez."},"src":null},{"ar":"كَثِيرُ الرَّمَادِ.","gloss":{"en":"Much ash at his hearth — that is, generous, because a generous man cooks for guests.","tr":"Külü çok — yani cömert; çünkü cömert adam misafir için ocak yakar."},"src":null}],"mistakes":[{"wrong":"الْكِنَايَةُ تُبْطِلُ الْمَعْنَى الْحَقِيقِيَّ","right":"الْكِنَايَةُ لَا تُبْطِلُهُ؛ الْمَجَازُ هُوَ الَّذِي يَمْنَعُهُ بِالْقَرِينَةِ","why":{"en":"The one test that separates them: in a kinaya the literal reading is still true. If something in the sentence forbids it, you are looking at majaz.","tr":"İkisini ayıran tek ölçü: kinâyede hakikî mana hâlâ doğrudur. Cümlede onu yasaklayan bir şey varsa karşınızdaki mecazdır."}},{"wrong":"كُلُّ تَعْرِيضٍ كِنَايَةٌ عَنْ ذَمٍّ","right":"التَّعْرِيضُ أُسْلُوبٌ، وَقَدْ يَكُونُ مَدْحًا أَوْ نُصْحًا","why":{"en":"Ta'rid is the oblique manner, not a verdict. The wasiyya uses it to counsel, not merely to rebuke.","tr":"Ta'rîz bir üsluptur, bir hüküm değil. Vasiyet onu azarlamak için değil öğüt vermek için kullanır."}}]},"la-nafiya-lil-jins":{"title":{"ar":"لَا النَّافِيَةُ لِلْجِنْس","en":"The «la» that denies the whole genus","tr":"Cinsini nefyeden لَا"},"level":4,"group":"awamil","explanation":{"en":"This «la» denies the quality of an ENTIRE class, not of one individual — «there is no X whatsoever». Birgivi lists it among the governors, working like إِنَّ: its noun takes nasb and its predicate stays in raf'. When that noun is a single indefinite word it is BUILT on fatha with no tanwin — لَا رَجُلَ فِي الدَّارِ. The most famous instance of all is the testimony itself: لَا إِلَهَ إِلَّا اللهُ, where إِلَهَ is built on fatha and the predicate (مَوْجُودٌ, «existing») is left unspoken — which is precisely why the sentence denies every god absolutely before affirming the One.","tr":"Bu «lâ», bir ferdin değil BÜTÜN CİNSİN vasfını nefyeder — «hiçbir X yoktur». Birgivî onu âmiller arasında sayar; «inne» gibi amel eder: ismini nasb, haberini ref eder. İsmi müfred ve nekre olduğunda tenvinsiz olarak FETHA ÜZERE MEBNÎ olur — لَا رَجُلَ فِي الدَّارِ. En meşhur örneği kelime-i tevhiddir: لَا إِلَهَ إِلَّا اللهُ; burada إِلَهَ fetha üzere mebnîdir ve haberi (مَوْجُودٌ «mevcut») hazfedilmiştir — cümlenin Bir'i ispat etmeden önce her ilahı mutlak olarak nefyetmesinin sebebi de budur."},"plain":{"en":"The لَا that denies a whole class at once: «there is no god at all but Allah».","tr":"Bir cinsin tamamını birden nefyeden لَا: «Allah'tan başka hiçbir ilah yoktur»."},"amil":"تَنْصِبُ الِاسْمَ وَتَرْفَعُ الْخَبَرَ — it governs like inna: nasb on its noun, raf' on its predicate","mamul":"mansub","sources":["العوامل (البيركوي)","المنصوبات","إظهار الأسرار (البيركوي)","قطر الندى (ابن هشام)"],"question":{"tr":["Nedir? (haberi)"],"en":["What is it? (its khabar)"]},"examples":[{"ar":"مَنْ قَالَ لَا إِلَهَ إِلَّا اللهُ ... دَخَلَ الْجَنَّةَ.","gloss":{"en":"Whoever says «there is no god but Allah» ... enters the Garden — إِلَهَ is built on fatha as the ism of la.","tr":"«Allah'tan başka ilah yoktur» diyen … cennete girer — إِلَهَ, lâ'nın ismi olarak fetha üzere mebnîdir."},"src":"aqaid-ahl-al-sunna"},{"ar":"لَا رَجُلَ فِي الدَّارِ.","gloss":{"en":"There is no man at all in the house — a flat denial of the whole class.","tr":"Evde hiçbir adam yoktur — bütün cinsin kesin nefyi."},"src":null},{"ar":"لَا رَجُلٌ فِي الدَّارِ بَلْ رَجُلَانِ.","gloss":{"en":"Not ONE man is in the house, but two — with tanwin the «la» merely negates a number, and no longer denies the genus.","tr":"Evde BİR adam yok, iki var — tenvinli gelince lâ yalnız sayıyı nefyeder, cinsi nefyetmez."},"src":null}],"mistakes":[{"wrong":"لَا إِلَهٌ إِلَّا اللهُ","right":"لَا إِلَهَ إِلَّا اللهُ","why":{"en":"The ism of this la is built on fatha WITHOUT tanwin. With tanwin the sentence stops denying the genus and merely denies one instance — which would break the testimony's meaning.","tr":"Bu «lâ»nın ismi tenvinsiz olarak fetha üzere mebnîdir. Tenvinli olursa cümle cinsi nefyetmeyi bırakır, sadece bir ferdi nefyeder — bu da kelime-i tevhidin mânâsını bozar."}},{"wrong":"لَا الرَّجُلَ فِي الدَّارِ","right":"لَا رَجُلَ فِي الدَّارِ","why":{"en":"The ism of la nafiya lil-jins must be indefinite; a definite noun after it is not admitted.","tr":"Cinsini nefyeden «lâ»nın ismi nekre olmalıdır; ardından marife isim gelmez."}},{"wrong":"لَا إِلَهَ إِلَّا اللهَ","right":"لَا إِلَهَ إِلَّا اللهُ","why":{"en":"After the neutralized إِلَّا the majestic name is a badal of the POSITION of la's noun, which is raf' — so it takes damma, not the fatha of the ism.","tr":"Amelden düşmüş إِلَّا'dan sonra lafza-i celâl, «lâ»nın isminin MAHALLİNDEN bedeldir; o mahal ref olduğu için damme alır, ismin fethasını değil."}}]},"la-nahiya":{"title":{"ar":"لَا النَّاهِيَة","en":"The prohibiting la","tr":"Nehiy لَا'sı"},"level":2,"group":"awamil","explanation":{"en":"لا الناهية (\"do not…\") governs the present verb in the jussive (majzum): sukun on the last radical, or dropping the ن in the five verbs. Birgivi lists it among the jazm governors with لَمْ، لَمَّا، لام الأمر. Contrast لا النافية, which merely negates and governs nothing: لَا تَتَكَلَّمْ (don't speak!) vs لَا تَتَكَلَّمُ (you are not speaking) — the haraka on the final letter is the whole difference in meaning.","tr":"Nehiy lâsı ('yapma!') muzariyi cezmeder: son harfte sükûn, ef'al-i hamsede نون düşer. Birgivî cezm edatları arasında لَمْ، لَمَّا، لام الأمر ile birlikte sayar. Nefiy lâsı ise amel etmez: لَا تَتَكَلَّمْ (konuşma!) ile لَا تَتَكَلَّمُ (konuşmuyorsun) arasındaki fark son harekededir."},"plain":{"en":"لَا telling someone not to do something — and it shortens the verb.","tr":"Bir işi yapmamayı söyleyen لَا; fiilin sonunu cezm eder."},"amil":"مِنْ جَوَازِمِ الْمُضَارِعِ — a governor that puts the present verb in jazm","mamul":"majzum","sources":["العوامل (البيركوي)","إظهار الأسرار (البيركوي)","قطر الندى (ابن هشام)"],"examples":[{"ar":"لَا تَحْتَقِرْ أَحَدًا.","gloss":{"en":"Do not belittle anyone.","tr":"Hiç kimseyi küçümseme."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"وَلَا تَتَكَلَّمْ كَثِيرًا.","gloss":{"en":"And do not talk too much.","tr":"Ve çok konuşma."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"لَا تَحْزَنْ إِنَّ اللهَ مَعَنَا.","gloss":{"en":"Do not grieve; indeed Allah is with us. (Quran 9:40)","tr":"Üzülme, muhakkak Allah bizimledir. (Tevbe 9:40)"},"src":null}],"mistakes":[{"wrong":"لا تتكلمُ كثيرًا (بمعنى النهي)","right":"لا تتكلمْ كثيرًا","why":{"en":"Keeping the damma turns the prohibition into a statement (\"you do not talk much\"). The prohibiting لا demands sukun.","tr":"Ötre kalırsa nehiy haber cümlesine dönüşür ('çok konuşmuyorsun'). Nehiy lâsı sükûn ister."}},{"wrong":"لن تحتقرْ أحدًا (بمعنى النهي)","right":"لا تحتقرْ أحدًا","why":{"en":"لن negates the future (and governs nasb: لن تحتقرَ); prohibition needs لا + jazm.","tr":"لن geleceği nefyeder ve nasbeder (لن تحتقرَ); yasaklama لا + cezim ister."}},{"wrong":"لا تذهبوننَ","right":"لا تذهبوا","why":{"en":"In the five verbs jazm is shown by dropping the ن: تذهبون → لا تذهبوا.","tr":"Ef'al-i hamsede cezm نون düşmesiyle gösterilir: تذهبون → لا تذهبوا."}}]},"lam-amr":{"title":{"ar":"لَامُ الْأَمْر","en":"The lam of command","tr":"Emir lâmı"},"level":4,"group":"awamil","explanation":{"en":"Arabic has a proper imperative only for the person you are addressing: اِفْعَلْ. To command anyone else — a third person, or yourself, or a passive — you put لِ on the present verb and it goes into jazm: لِيَذْهَبْ «let him go», لِنَذْهَبْ «let us go», لِيُعْلَمْ «let it be known». The لِ carries kasra on its own, but after وَ, فَ or ثُمَّ it is usually left vowelless: وَلْتَكُنْ, فَلْيَقُلْ. That is why the wasiyya's وَلْتَكُنْ looks unfamiliar — it is simply «let it be», with the لِ having lost its vowel to the وَ before it. Two things to keep straight. The verb is مَجْزُوم, so a hollow verb shortens (تَكُونُ → تَكُنْ) and a defective one drops its weak letter. And the لِ of command is not the لِ of purpose: the first gives jazm and means «let», the second gives nasb through an implied أَنْ and means «in order to» — لِيَذْهَبْ against لِيَذْهَبَ.","tr":"Arapçada hakiki emir sadece muhatap içindir: اِفْعَلْ. Başkasına — gâibe, kendine yahut meçhule — emretmek için muzârinin başına لِ getirilir ve fiil cezmedilir: لِيَذْهَبْ «gitsin», لِنَذْهَبْ «gidelim», لِيُعْلَمْ «bilinsin». لِ kendi başına kesreli gelir, fakat وَ، فَ yahut ثُمَّ'den sonra çoğunlukla sâkin bırakılır: وَلْتَكُنْ، فَلْيَقُلْ. Vasiyetteki وَلْتَكُنْ'un yabancı görünmesinin sebebi budur — «ol(sun)» demektir, لِ kendinden önceki وَ sebebiyle harekesini bırakmıştır. İki noktaya dikkat: fiil MECZÛMdur, dolayısıyla ecvef kısalır (تَكُونُ → تَكُنْ), nâkıs ise illetli harfini düşürür. Ve emir lâmı, ta'lîl lâmı değildir: birincisi cezmeder ve «-sin» manasındadır, ikincisi mukadder أَنْ ile nasbeder ve «için» manasındadır — لِيَذْهَبْ ile لِيَذْهَبَ."},"plain":{"en":"A لِـ that turns a present verb into a command, usually for someone not being spoken to: «let him…».","tr":"Muzâriyi emre çeviren لِـ; çoğunlukla gâib için: «…-sın»."},"mamul":"majzum","sources":["العوامل (البيركوي) — الجوازم","قطر الندى (ابن هشام)"],"examples":[{"ar":"وَلْتَكُنْ إِذَا دَخَلْتَ عَلَيْهِ تَعْرِفُ قَدْرَكَ.","gloss":{"en":"And when you enter upon him, let it be that you know your own worth — تَكُنْ is in jazm, so the و of تَكُونُ is gone.","tr":"Onun yanına girdiğinde kendi kadrini bilir ol — تَكُنْ meczûmdur, تَكُونُ'nun vâvı düşmüştür."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"لِيُنْفِقْ ذُو سَعَةٍ مِنْ سَعَتِهِ.","gloss":{"en":"Let a man of means spend out of his means (Quran 65:7) — the لِ with its own kasra, at the start of the clause.","tr":"Varlıklı olan varlığından infak etsin (Talâk 65:7) — cümle başında kendi kesresiyle لِ."},"src":null},{"ar":"لِنَذْهَبْ إِلَى الدَّرْسِ.","gloss":{"en":"Let us go to the lesson — the command turned on the speaker himself.","tr":"Derse gidelim — emrin mütekellime yöneltilmiş hâli."},"src":null}],"mistakes":[{"wrong":"لِيَذْهَبُ","right":"لِيَذْهَبْ","why":{"en":"The lam of command is a jazim. A damma on the end means it was read as something else entirely.","tr":"Emir lâmı câzimdir. Sondaki damme, kelimenin bambaşka okunduğunu gösterir."}},{"wrong":"لِيَذْهَبَ إِلَى السُّوقِ (بِمَعْنَى: لِيَذْهَبْ)","right":"لِيَذْهَبْ إِلَى السُّوقِ","why":{"en":"With fatha this is the لِ of purpose — «in order for him to go». The command needs jazm.","tr":"Fetha ile bu, ta'lîl lâmıdır: «gitmesi için». Emir için cezm gerekir."}},{"wrong":"وَلِتَكُنْ صَابِرًا — بِكَسْرِ اللَّامِ بَعْدَ الْوَاوِ","right":"وَلْتَكُنْ صَابِرًا","why":{"en":"After وَ, فَ or ثُمَّ the lam is normally left vowelless. Keeping the kasra is not wrong in principle but is not how it is read.","tr":"وَ، فَ yahut ثُمَّ'den sonra lâm sâkin bırakılır. Kesreyi korumak aslen hatalı olmasa da okunuş bu değildir."}}]},"lam-jazim":{"title":{"ar":"لَمْ الْجَازِمَة","en":"«Lam»: negation, jussive, and the flip to past","tr":"لَمْ — nefy, cezm ve zamanı çevirme"},"level":2,"group":"awamil","explanation":{"en":"«Lam» does three things at once, which is why the grammarians call it حَرْفُ نَفْيٍ وَجَزْمٍ وَقَلْبٍ: it NEGATES, it puts the following present verb in the JUSSIVE, and it FLIPS the verb's time from present to past. So لَمْ يَطْلُبْهُ means «he did not seek it» — a past meaning carried by a present-tense form. Birgivi lists it first among the fifteen jawazim, those governors that put one present verb in the jussive. In the Emsile-i Muhtelife this is the row called جَحْدُ الْمُطْلَق (cahd-i mutlak), the absolute denial of the past, and its neighbour لَمَّا is the same construction denying the past up to the present moment.","tr":"«Lem» aynı anda üç iş yapar; bu yüzden gramerciler ona «harf-i nefy, cezm ve kalb» derler: NEFYEDER, ardından gelen muzari fiili CEZMEDER ve fiilin zamanını maziye ÇEVİRİR. Böylece لَمْ يَطْلُبْهُ «onu talep etmedi» demektir — muzari kalıbıyla taşınan mazi mânâsı. Birgivî onu, bir muzari fiili cezmeden on beş cezm edatının başında sayar. Emsile-i Muhtelife'de bu sîgaya «cahd-ı mutlak» denir; komşusu لَمَّا ise aynı yapının şimdiye kadar uzanan olumsuzluğudur (cahd-ı müstağrak)."},"plain":{"en":"لَمْ negates a present-tense verb and flips its meaning into the past: «he did not…».","tr":"لَمْ muzâriyi nefyeder ve manasını mâzîye çevirir: «…-madı»."},"amil":"تَجْزِمُ الْمُضَارِعَ وَتَقْلِبُ زَمَانَهُ إِلَى الْمُضِيِّ — it puts the present verb in the jussive and turns its time into the past","mamul":"majzum","sources":["العوامل (البيركوي) — الجوازم","الأمثلة المختلفة","إظهار الأسرار (البيركوي)"],"examples":[{"ar":"أَمْكَنَهُ طَلَبُ الْعِلْمِ فِي الدُّنْيَا فَلَمْ يَطْلُبْهُ.","gloss":{"en":"Seeking knowledge was within his reach in this world, and he did not seek it — present form, past meaning, jussive ending.","tr":"Dünyada ilim talebi elinin altındaydı da o talep etmedi — muzâri şekli, mâzi manası, meczûm sonu."},"src":"min-muqaddimat-al-maqsud"},{"ar":"لَمْ يَذْهَبْ.","gloss":{"en":"He did not go — compare مَا ذَهَبَ, which negates the past verb directly.","tr":"Gitmedi — doğrudan mâziyi nefyeden مَا ذَهَبَ ile karşılaştırın."},"src":null},{"ar":"لَمَّا يَذْهَبْ.","gloss":{"en":"He has not gone yet — لَمَّا denies right up to the present and implies it may still happen.","tr":"Henüz gitmedi — لَمَّا nefyi şimdiye kadar sürdürür ve hâlâ olabileceğini ima eder."},"src":null}],"mistakes":[{"wrong":"لَمْ يَذْهَبُ","right":"لَمْ يَذْهَبْ","why":{"en":"«Lam» governs the jussive: the final damma must go. Leaving it is the single most common jussive error.","tr":"«Lem» cezmeder: sondaki damme düşmelidir. Onu bırakmak en sık yapılan cezm hatasıdır."}},{"wrong":"لَمْ ذَهَبَ","right":"لَمْ يَذْهَبْ","why":{"en":"«Lam» enters only on a PRESENT verb, never a past one — it supplies the past meaning itself. To negate a past verb directly, use مَا.","tr":"«Lem» yalnız MUZARİ fiilin başına gelir, maziye gelmez — mazi mânâsını kendisi verir. Maziyi doğrudan olumsuzlamak için مَا kullanılır."}},{"wrong":"لَمْ يَذْهَبْ أَمْسِ وَسَيَذْهَبُ (بمعنى: لم يذهب بعدُ)","right":"لَمَّا يَذْهَبْ","why":{"en":"For «has not yet» — a denial reaching the present with the act still expected — the word is لَمَّا, not لَمْ.","tr":"«Henüz gitmedi» — şimdiye kadar süren ve devamı beklenen olumsuzluk — için لَمَّا kullanılır, لَمْ değil."}}]},"lam-taleel":{"title":{"ar":"لَام التَّعْلِيل","en":"The lam of purpose","tr":"Lâm-ı ta'lîl"},"level":2,"group":"awamil","explanation":{"en":"Prefixed لِ before a present verb means \"in order to\". Grammatically the verb is mansub by a hidden أَنْ after the lam — so it behaves exactly like the أَنْ clause: final fatha, نون dropped in the five verbs. In this story: لِيُوَدِّعَهُ = لِأَنْ يُوَدِّعَهُ (\"in order to bid him farewell\").","tr":"Muzariden önce gelen لِ '-mek için' demektir. Fiil, lâm'dan sonra gizli bir أَنْ ile mansubdur: son harf fetha, ef'al-i hamsede نون düşer. Hikâyede: لِيُوَدِّعَهُ = لِأَنْ يُوَدِّعَهُ ('onu uğurlamak için')."},"plain":{"en":"A لِـ meaning «in order to».","tr":"«…-mek için» manasındaki لِـ."},"amil":"تَنْصِبُ الْمُضَارِعَ بِأَنْ مُضْمَرَةً — governs nasb through an implied أَنْ","sources":["عوامل البركوي — اللام مِنْ حروف الجر العشرين","قطر الندى (ابن هشام) — لام كي"],"examples":[{"ar":"ذَهَبَ إِلَيْهِ لِيُوَدِّعَهُ.","gloss":{"en":"He went to him to bid him farewell.","tr":"Ona veda etmek için gitti."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"أَدْرُسُ لِأَنْجَحَ.","gloss":{"en":"I study in order to succeed.","tr":"Başarmak için çalışıyorum."},"src":null}],"mistakes":[{"wrong":"ذهب لِيُوَدِّعُهُ","right":"ذهب لِيُوَدِّعَهُ","why":{"en":"The verb after lam at-ta'lil is mansub — fatha on the last radical, not damma.","tr":"Lâmu't-ta'lîlden sonra fiil mansubdur — son harfte fetha, ötre değil."}},{"wrong":"أدرس لِأَنَّ أنجحَ","right":"أدرس لِأَنْجَحَ / لِكَيْ أَنْجَحَ","why":{"en":"Mixing لأنّ (\"because\", followed by a noun) with the purpose lam (followed by a mansub verb).","tr":"لأنّ ('çünkü', isimden önce) ile amaç lâmı (mansub fiilden önce) karıştırılıyor."}}]},"ma-la-mushabbaha":{"title":{"ar":"مَا وَلَا الْمُشَبَّهَتَانِ بِلَيْسَ","en":"«Ma» and «la» resembling «laysa»","tr":"لَيْسَ'ye benzeyen مَا ve لَا"},"level":5,"group":"awamil","explanation":{"en":"Birgivi counts exactly two governors in this class: the «ma» and the «la» that work like لَيْسَ. They enter a nominal sentence and do what laysa does — the subject stays in RAF' as their ism, and the predicate goes into NASB as their khabar. The Awamil explains the resemblance in two points: both enter upon a mubtada and khabar, and both carry the meaning of negation. The book's own example is مَا اللَّهُ تَعَالَى مُتَمَكِّنًا بِمَكَانٍ — «Allah is not confined to any place», where مُتَمَكِّنًا is in nasb. The Hijazi dialect is the one that governs this way; in the Tamimi dialect these particles govern nothing and the predicate simply stays in raf'.","tr":"Birgivî bu sınıfta tam olarak iki âmil sayar: لَيْسَ gibi amel eden «mâ» ve «lâ». İsim cümlesine girip leysenin yaptığını yaparlar — mübteda onların ismi olarak REF hâlinde kalır, haber ise onların haberi olarak NASB alır. Avâmil benzerliği iki noktada açıklar: ikisi de mübteda ve haberin başına girer, ikisi de nefy mânâsı taşır. Kitabın kendi örneği: مَا اللَّهُ تَعَالَى مُتَمَكِّنًا بِمَكَانٍ — «Allah bir mekânda yer tutmuş değildir»; burada مُتَمَكِّنًا mansubdur. Bu şekilde amel eden Hicaz lehçesidir; Temîm lehçesinde bu edatlar amel etmez ve haber merfû kalır."},"plain":{"en":"مَا and لَا used the way لَيْسَ is used — «is not».","tr":"لَيْسَ gibi kullanılan مَا ve لَا — «değildir»."},"amil":"تَرْفَعُ الِاسْمَ وَتَنْصِبُ الْخَبَرَ — it keeps the subject in raf' and puts the predicate in nasb","mamul":"marfu","sources":["العوامل (البيركوي)","إظهار الأسرار (البيركوي)","الكافية (ابن الحاجب)"],"examples":[{"ar":"وَمَا مُحَمَّدٌ إِلَّا رَسُولٌ.","gloss":{"en":"Muhammad is but a messenger — مَا would have put رَسُول in nasb, but إِلَّا cancels its effect and raf' returns.","tr":"Muhammed ancak bir resuldür — مَا, رَسُول'ü nasb edecekti, fakat إِلَّا amelini iptal eder ve ref döner."},"src":"aqaid-ahl-al-sunna"},{"ar":"مَا اللَّهُ تَعَالَى مُتَمَكِّنًا بِمَكَانٍ.","gloss":{"en":"Allah — exalted is He — is not confined to any place. The Awamil's own example: the predicate is in nasb.","tr":"Allah Teâlâ hiçbir mekâna hulûl etmiş değildir. Avâmil'in kendi örneği: haber mansubdur."},"src":null},{"ar":"مَا هَذَا بَشَرًا.","gloss":{"en":"This is no human being — the Qur'anic instance of the Hijazi «ma».","tr":"Bu bir beşer değildir — Hicaz مَا'sının Kur'ânî örneği."},"src":null},{"ar":"لَا رَجُلٌ أَفْضَلَ مِنْكَ.","gloss":{"en":"No man is better than you — the «la» that resembles laysa.","tr":"Hiçbir adam senden hayırlı değildir — لَيْسَ'ye benzeyen لَا."},"src":null}],"mistakes":[{"wrong":"ما هذا بشرٌ (على لغة الحجاز)","right":"مَا هَذَا بَشَرًا","why":{"en":"In the Hijazi usage these particles govern like laysa, so the predicate takes nasb. Leaving it in raf' is the Tamimi reading, where they govern nothing — correct in itself, but not what the Awamil is teaching here.","tr":"Hicaz kullanımında bu edatlar leyse gibi amel eder, haber nasb alır. Merfû bırakmak Temîm okuyuşudur; kendi başına doğrudur ama Avâmil'in burada öğrettiği bu değildir."}},{"wrong":"ما مُتَمَكِّنًا اللهُ","right":"مَا اللَّهُ مُتَمَكِّنًا","why":{"en":"These particles only govern while the order is kept: ism first, khabar after. Fronting the khabar cancels the resemblance to laysa and the government falls away.","tr":"Bu edatlar ancak sıra korunduğunda amel eder: önce isim, sonra haber. Haber öne alınırsa leyseye benzerlik bozulur ve amel düşer."}},{"wrong":"ما زيدٌ إلا قائمًا","right":"مَا زَيْدٌ إِلَّا قَائِمٌ","why":{"en":"If إِلَّا comes between, the negation is broken and the government lapses: the predicate returns to raf'.","tr":"Araya إِلَّا girerse nefy bozulur ve amel düşer: haber ref'e döner."}}]},"maful-bihi":{"title":{"ar":"الْمَفْعُولُ بِه","en":"The direct object (maf'ul bihi)","tr":"Mef'ûlün bih (nesne)"},"level":2,"group":"nahw","explanation":{"en":"The maf'ul bihi is the direct object — the noun in nasb upon which the verb's action falls. Its governor is the transitive verb (الفعل المتعدّي), and it is always mansub. In «أَكْرِمِ الْعُلَمَاءَ» (honor the scholars) the honoring lands on الْعُلَمَاءَ, so it is mansub. The object can be a visible noun — الْبَصْرَةَ، أَحَدًا، الْكِبَارَ — or an attached pronoun in the position of nasb, like the ـه of «يُوَدِّعَهُ» (to bid *him* farewell) and the ـك of «يَأْتِيكَ» (comes to *you*). Default order is verb–fa'il–maf'ul, but Arabic allows the object to move for emphasis while the nasb stays as its fixed sign. Ibn Ajurrum defines it as \"the mansub noun upon which the action occurs\"; it heads the منصوبات in the Ajurrumiyya and is detailed in Qatr al-Nada.","tr":"Mef'ûlün bih, düz nesnedir — fiilin işinin üzerine düştüğü mansub isimdir. Âmili müteaddî (geçişli) fiildir ve daima mansubdur. «أَكْرِمِ الْعُلَمَاءَ» (âlimlere ikram et) cümlesinde ikram الْعُلَمَاءَ üzerine düşer, bu yüzden mansubdur. Nesne açık bir isim olabilir — الْبَصْرَةَ، أَحَدًا، الْكِبَارَ — ya da nasb mahallinde bitişik bir zamir, mesela «يُوَدِّعَهُ»deki ـه (onu uğurlamak) ve «يَأْتِيكَ»deki ـك (sana gelir). Temel dizim fiil–fâil–mef'ûldür, ama Arapça vurgu için nesnenin öne geçmesine izin verir; sabit alâmeti olan nasb yine kalır. İbn Âcurrûm onu \"fiilin üzerine vuku bulduğu mansub isim\" diye tanımlar; Âcurrûmiyye'de mansûbâtın başında gelir."},"plain":{"en":"What the action was done to.","tr":"İşin kendisine yapıldığı şey."},"mamul":"mansub","sources":["الآجُرُّومِيَّة (ابن آجُرُّوم)","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"question":{"tr":["Neyi?","Neye?","Kimi?","Kime?"],"en":["What? (direct)","To what?","Whom?","To whom?"]},"examples":[{"ar":"أَكْرِمِ الْعُلَمَاءَ.","gloss":{"en":"Honor the scholars — الْعُلَمَاءَ is the direct object of أَكْرِم, mansub by fatha.","tr":"Âlimlere ikram et — الْعُلَمَاءَ, أَكْرِم fiilinin mef'ûlüdür, fetha ile mansubdur."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"لَا تَحْتَقِرْ أَحَدًا.","gloss":{"en":"Do not belittle anyone — أَحَدًا is the direct object, mansub with tanwin fatha.","tr":"Hiç kimseyi küçümseme — أَحَدًا mef'ûldür, tenvinli fetha ile mansubdur."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"إِذَا دَخَلْتَ الْبَصْرَةَ.","gloss":{"en":"When you enter Basra — الْبَصْرَةَ is the direct object of دَخَلْتَ, mansub by fatha.","tr":"Basra'ya girdiğinde — الْبَصْرَةَ, دَخَلْتَ fiilinin fetha ile mansub mef'ûlüdür."},"src":"wasiyyat-abi-hanifa-L2"}],"mistakes":[{"wrong":"أَكْرِمِ الْعُلَمَاءُ","right":"أَكْرِمِ الْعُلَمَاءَ","why":{"en":"The object is mansub, not marfu'. Giving الْعُلَمَاء a damma treats it as the fa'il (the doer) — but here it is who is honored, so it must be mansub (fatha).","tr":"Nesne mansubdur, merfu değil. الْعُلَمَاء'a ötre vermek onu fâil (yapan) saymaktır — oysa burada ikram edilen odur, bu yüzden mansub olmalı (fetha)."}},{"wrong":"أَكْرِمْ لِلْعُلَمَاءِ","right":"أَكْرِمِ الْعُلَمَاءَ","why":{"en":"أَكْرَمَ is transitive and takes a direct object with no preposition. Inserting لـ (from English 'be kind TO') puts the noun in jarr and loses the maf'ul bihi.","tr":"أَكْرَمَ geçişlidir ve nesnesini harf-i cersiz doğrudan alır. İngilizce 'to' etkisiyle لـ eklemek ismi mecrur yapar ve mef'ûlün bihi kaybeder."}}]},"maful-fih":{"title":{"ar":"الْمَفْعُولُ فِيهِ (الظَّرْف)","en":"The maf'ul fih (adverb of time or place)","tr":"Mef'ûl fîh (zarf)"},"level":3,"group":"nahw","explanation":{"en":"Defined in the Mansubat as «هُوَ مَا فُعِلَ فِيهِ فِعْلٌ مَذْكُورٌ مِنْ زَمَانٍ أَوْ مَكَانٍ» — the noun of the time or place IN WHICH the stated action happened. It answers «when?» or «where?» and takes nasb. The condition for nasb is that the sense «فِي» be intended without the preposition being written: صُمْتُ يَوْمَ الِاثْنَيْنِ = «I fasted ON Monday». Most zarfs are mudaf, and the following noun is in jarr: أَمَامَ مَكَّةَ, بَيْنَ يَدَيْهِ, عِنْدَهُ. Some are indeclinable (مَبْنِيّ) — حَيْثُ, and قَبْلُ / بَعْدُ when cut off from what they govern.","tr":"Mensûbât'ta şöyle tanımlanır: «هُوَ مَا فُعِلَ فِيهِ فِعْلٌ مَذْكُورٌ مِنْ زَمَانٍ أَوْ مَكَانٍ» — zikredilen işin İÇİNDE yapıldığı zaman veya mekânın ismidir. «Ne zaman?» «Nerede?» sorularına cevap verir ve nasb alır. Nasb olmasının şartı, «فِي» mânâsının kastedilip harfin yazılmamasıdır: صُمْتُ يَوْمَ الِاثْنَيْنِ = «Pazartesi GÜNÜ oruç tuttum». Zarfların çoğu muzâftır, sonrası mecrûr olur: أَمَامَ مَكَّةَ, بَيْنَ يَدَيْهِ, عِنْدَهُ. Bazıları mebnîdir — حَيْثُ ile, izafetten kesildiğinde قَبْلُ / بَعْدُ gibi."},"plain":{"en":"Where, or when.","tr":"Nerede yahut ne zaman."},"mamul":"mansub","sources":["المنصوبات","العوامل (البيركوي)","إظهار الأسرار (البيركوي)","قطر الندى (ابن هشام)"],"question":{"tr":["Nerede?","Ne zaman?","Hangi mekânda?","Kim indinde?","Nereye?","Ne zamana kadar?"],"en":["Where?","When?","In which place?","In whose presence?","To where?","Until when?"]},"examples":[{"ar":"وَقَفَ الْفِيلُ أَمَامَ مَكَّةَ.","gloss":{"en":"The elephant stopped before Mecca — zarf of place, in nasb, and mudaf.","tr":"Fil Mekke'nin önünde durdu — mekân zarfı, mansub ve muzâf."},"src":"ashab-al-fil"},{"ar":"وَإِيَّاكَ وَالْكَذِبَ بَيْنَ يَدَيْهِ.","gloss":{"en":"Beware of lying in his presence — بَيْنَ is a zarf of place in nasb.","tr":"Onun huzurunda yalandan sakın — بَيْنَ mansub mekân zarfıdır."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"وَصَغُرَتْ مَنْزِلَتُكَ عِنْدَهُ.","gloss":{"en":"And your standing with him shrank — عِنْدَ is a zarf, mudaf to the pronoun.","tr":"Ve onun yanında mevkiin küçüldü — عِنْدَ zarftır, zamire muzâftır."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"صُمْتُ يَوْمَ الِاثْنَيْنِ.","gloss":{"en":"I fasted on Monday — zarf of time; the sense of «on» is carried without فِي.","tr":"Pazartesi günü oruç tuttum — zaman zarfı; «-de» manası فِي olmadan taşınır."},"src":null}],"mistakes":[{"wrong":"وقف الفيلُ أمامُ مكةَ","right":"وقف الفيلُ أمامَ مكةَ","why":{"en":"The zarf is mansub. Learners give it a damma because it is not the object of the verb in the ordinary sense — but maf'ul fih is one of the thirteen mansubat.","tr":"Zarf mansubdur. Öğrenciler onu alışılmış mânâda mef'ûl saymadıkları için ötre verir — hâlbuki mef'ûl fîh, on üç mensûbâttan biridir."}},{"wrong":"جلستُ في أمامِ البيتِ","right":"جلستُ أمامَ البيتِ","why":{"en":"Do not write فِي before a zarf: the zarf already carries that sense, which is exactly why it takes nasb. Writing فِي makes the noun majrur instead.","tr":"Zarfın önüne فِي yazılmaz: zarf o mânâyı zaten taşır, nasb almasının sebebi de budur. فِي yazılırsa isim mecrûr olur."}},{"wrong":"أمامَ الْبَيْتُ","right":"أمامَ الْبَيْتِ","why":{"en":"A zarf is normally mudaf, so what follows it is in jarr — nasb on the zarf, jarr on its mudaf ilayh.","tr":"Zarf çoğunlukla muzâftır; ardından geleni mecrûr yapar — zarf mansub, muzâfun ileyh mecrûrdur."}}]},"maful-lah":{"title":{"ar":"الْمَفْعُولُ لَهُ (لِأَجْلِهِ)","en":"The maf'ul lah (accusative of purpose)","tr":"Mef'ûl leh (li-eclih)"},"level":4,"group":"nahw","explanation":{"en":"Defined in the Mansubat as «هُوَ مَا فُعِلَ لِأَجْلِهِ فِعْلٌ مَذْكُورٌ» — the noun naming the REASON for which the stated action was done. It answers «why?» and takes nasb: قُمْتُ إِجْلَالًا لِلْعَالِمِ «I stood out of respect for the scholar». For it to take nasb rather than a preposition, three things are normally required: it must be a masdar (a قلبي one, an act of the heart — fear, desire, respect), and it must share the doer and the time of the main verb. When any of those fails, Arabic uses لِ instead: جِئْتُ لِلْعِلْمِ.","tr":"Mensûbât'ta şöyle tanımlanır: «هُوَ مَا فُعِلَ لِأَجْلِهِ فِعْلٌ مَذْكُورٌ» — zikredilen işin kendisi SEBEBİYLE yapıldığı şeyin ismidir. «Niçin?» sorusuna cevap verir ve nasb alır: قُمْتُ إِجْلَالًا لِلْعَالِمِ «Âlime saygıdan dolayı ayağa kalktım». Harf-i cer yerine nasb alabilmesi için genelde üç şart aranır: masdar olması (kalbî bir masdar — korku, arzu, saygı gibi), fâilinin ve zamanının asıl fiille aynı olması. Bunlardan biri düşerse لِ kullanılır: جِئْتُ لِلْعِلْمِ."},"plain":{"en":"Why — the reason the act was done.","tr":"Niçin — işin yapılma sebebi."},"mamul":"mansub","sources":["المنصوبات","العوامل (البيركوي)","قطر الندى (ابن هشام)"],"question":{"tr":["Niçin?","Kim için?"],"en":["Why? / What for?","For whom?"]},"examples":[{"ar":"قُمْتُ إِجْلَالًا لِلْعَالِمِ.","gloss":{"en":"I stood out of respect for the scholar — the reason, in nasb.","tr":"Âlime hürmeten ayağa kalktım — sebep, mansub olarak."},"src":null},{"ar":"وَإِنَّمَا أُوصِيكَ لِمَصْلَحَتِكَ وَمَصْلَحَةِ الْمُسْلِمِينَ.","gloss":{"en":"I counsel you only for your good and the good of the Muslims — the reason, carried by لِ rather than nasb because it is not a heart-masdar.","tr":"Sana ancak senin ve Müslümanların iyiliği için nasihat ediyorum — sebep, kalb masdarı olmadığı için nasb ile değil لِ ile gelir."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"وَإِنَّمَا أُوصِيكَ لِمَصْلَحَتِكَ وَمَصْلَحَةِ الْمُسْلِمِينَ.","gloss":{"en":"I counsel you only for your good and the good of the Muslims — here the reason is carried by لِ, not by nasb, because it is not a heart-masdar. From Abu Hanifa's testament to Abu Yusuf.","tr":"Sana ancak senin ve Müslümanların iyiliği için nasihat ediyorum — sebep burada nasb ile değil لِ ile taşınır, çünkü kalb masdarı değildir. Ebû Hanîfe'nin Ebû Yusuf'a vasiyetinden."},"src":null},{"ar":"تَرَكْتُ الْمَعْصِيَةَ خَوْفًا مِنَ اللَّهِ.","gloss":{"en":"I abandoned the sin out of fear of Allah.","tr":"Allah korkusuyla günahı terk ettim."},"src":null}],"mistakes":[{"wrong":"قمتُ إجلالٌ للعالمِ","right":"قمتُ إجلالًا للعالمِ","why":{"en":"The maf'ul lah is mansub — it is one of the thirteen mansubat, not a subject.","tr":"Mef'ûl leh mansubdur — on üç mensûbâttan biridir, fâil değildir."}},{"wrong":"جئتُ الْعِلْمَ (يريد: لطلب العلم)","right":"جئتُ لِلْعِلْمِ","why":{"en":"A non-masdar, or one whose doer differs from the verb's, cannot take nasb as maf'ul lah — it needs لِ. Putting it in nasb makes it read as a direct object.","tr":"Masdar olmayan veya fâili asıl fiilden farklı olan kelime mef'ûl leh olarak nasb alamaz — لِ gerekir. Nasb yapılırsa mef'ûlün bih gibi okunur."}},{"wrong":"ضربتُه تأديبًا لأخيه","right":"ضربتُه تأديبًا لَهُ","why":{"en":"The maf'ul lah must share the doer of the main verb; if the purpose belongs to someone else, the sentence must be recast.","tr":"Mef'ûl leh, asıl fiilin fâiliyle aynı fâile sahip olmalıdır; maksat başkasına aitse cümle yeniden kurulmalıdır."}}]},"maful-maah":{"title":{"ar":"الْمَفْعُولُ مَعَهُ","en":"The maf'ul ma'ah (accusative of accompaniment)","tr":"Mef'ûl maah"},"level":5,"group":"nahw","explanation":{"en":"Defined in the Mansubat as «هُوَ مَذْكُورٌ بَعْدَ الْوَاوِ لِمُصَاحَبَةِ مَعْمُولِ فِعْلٍ لَفْظًا أَوْ مَعْنًى» — a noun after a وَ that means «together with» rather than «and», put in nasb: سِرْتُ وَالنِّيلَ «I travelled alongside the Nile». The test is whether the two are true partners in the action. If they are, the وَ is a connective and the noun follows the case of what precedes; if the second merely accompanies, the وَ is وَاوُ الْمَعِيَّةِ and the noun is mansub. Compare جَاءَ زَيْدٌ وَعَمْرٌو (both came) with اِسْتَوَى الْمَاءُ وَالْخَشَبَةَ (the water rose level with the plank — the plank did not rise).","tr":"Mensûbât'ta şöyle tanımlanır: «هُوَ مَذْكُورٌ بَعْدَ الْوَاوِ لِمُصَاحَبَةِ مَعْمُولِ فِعْلٍ لَفْظًا أَوْ مَعْنًى» — «ve» değil «ile birlikte» mânâsındaki bir وَ'dan sonra gelen ve nasb alan isimdir: سِرْتُ وَالنِّيلَ «Nil boyunca yürüdüm». Ölçü, ikisinin fiilde gerçekten ortak olup olmadığıdır. Ortaksalar وَ atıf harfidir ve isim öncekinin i'rabını alır; ikincisi sadece eşlik ediyorsa وَ vâvü'l-maiyyedir ve isim mansub olur. Karşılaştır: جَاءَ زَيْدٌ وَعَمْرٌو (ikisi de geldi) ile اِسْتَوَى الْمَاءُ وَالْخَشَبَةَ (su tahta ile aynı seviyeye geldi — tahta yükselmedi)."},"plain":{"en":"What or who it happened alongside.","tr":"İşin kiminle yahut neyle beraber olduğu."},"mamul":"mansub","sources":["المنصوبات","العوامل (البيركوي)","الكافية (ابن الحاجب)"],"question":{"tr":["Ne ile beraber?","Kim ile beraber?"],"en":["Together with what?","Together with whom?"]},"examples":[{"ar":"سِرْتُ وَالنِّيلَ.","gloss":{"en":"I travelled alongside the Nile — the Nile did not travel; it accompanies.","tr":"Nil boyunca yolculuk ettim — Nil yolculuk etmedi, beraberlik bildirir."},"src":null},{"ar":"اِسْتَوَى الْمَاءُ وَالْخَشَبَةَ.","gloss":{"en":"The water became level with the plank — the classic test case.","tr":"Su tahta ile bir hizaya geldi — klasik ölçü örneği."},"src":null},{"ar":"جَاءَ زَيْدٌ وَعَمْرٌو.","gloss":{"en":"Zayd and Amr came — here both are doers, so the وَ is a plain connective and عمرو is marfu'.","tr":"Zeyd ve Amr geldi — burada ikisi de fâildir, dolayısıyla vâv atıf harfidir ve عمرو merfûdur."},"src":null}],"mistakes":[{"wrong":"سرتُ والنيلُ","right":"سرتُ والنيلَ","why":{"en":"When the وَ means «together with», the noun after it is mansub. Reading it as a connective and giving it raf' claims the Nile travelled too.","tr":"وَ «ile birlikte» mânâsındaysa sonrası mansub olur. Atıf sayıp ref verilirse Nil'in de yürüdüğü iddia edilmiş olur."}},{"wrong":"جاء زيدٌ وعمرًا","right":"جاء زيدٌ وعمرٌو","why":{"en":"The opposite error: when both are genuinely doers, the وَ is a connective and the second follows the first in raf'. Not every وَ is waw al-ma'iyya.","tr":"Bunun tersi hata: ikisi de gerçekten fâilse وَ atıf harfidir ve ikincisi birinciye ref'de uyar. Her وَ vâvü'l-maiyye değildir."}}]},"maful-mutlaq":{"title":{"ar":"الْمَفْعُولُ الْمُطْلَق","en":"The maf'ul mutlaq (cognate accusative)","tr":"Mef'ûl-i mutlak"},"level":4,"group":"nahw","explanation":{"en":"Defined in the Mansubat as «هُوَ اسْمُ مَا فَعَلَهُ فَاعِلُ فِعْلٍ مَذْكُورٍ بِمَعْنَاهُ» — the masdar of the very verb that governs it, put in nasb. English has no equivalent; it is the Arabic way of intensifying or specifying an action. The Mansubat divides it into three: (1) تَأْكِيدِيّ, which merely emphasizes — ضَرَبْتُ ضَرْبًا «I struck a striking» = I really struck; (2) نَوْعِيّ, which specifies the KIND, and then it is normally described or made mudaf — ضَرَبْتُ ضَرْبًا شَدِيدًا, يَطْمَعُونَ غَايَةَ الطَّمَعِ; (3) عَدَدِيّ, which counts the times — ضَرَبْتُ ضَرْبَتَيْنِ.","tr":"Mensûbât'ta şöyle tanımlanır: «هُوَ اسْمُ مَا فَعَلَهُ فَاعِلُ فِعْلٍ مَذْكُورٍ بِمَعْنَاهُ» — kendisini amel eden fiilin masdarıdır, mansub gelir. Türkçede tam karşılığı yoktur; fiili pekiştirmenin veya belirlemenin Arapça yoludur. Mensûbât üçe ayırır: (1) te'kîdî, sadece pekiştirir — ضَرَبْتُ ضَرْبًا «vurdum da vurdum»; (2) nev'î, çeşidini belirtir, çoğunlukla sıfatlanır veya muzâf olur — ضَرَبْتُ ضَرْبًا شَدِيدًا, يَطْمَعُونَ غَايَةَ الطَّمَعِ; (3) adedî, kaç kez olduğunu sayar — ضَرَبْتُ ضَرْبَتَيْنِ."},"plain":{"en":"Saying the action again as a noun, to strengthen or qualify it: «they covet it utterly».","tr":"İşi bir de isim olarak söyleyip pekiştirmek yahut nitelemek: «ona son derece tamah ederler»."},"mamul":"mansub","sources":["المنصوبات","العوامل (البيركوي)","الكافية (ابن الحاجب)"],"examples":[{"ar":"يَأْخُذُونَ أَمْوَالَكَ وَيَطْمَعُونَ فِيهَا غَايَةَ الطَّمَعِ.","gloss":{"en":"They take your wealth and covet it utterly — غَايَةَ الطَّمَعِ is a maf'ul mutlaq of the naw'i kind, mudaf to the masdar of the governing verb.","tr":"Malını alırlar ve son derece tamah ederler — غَايَةَ الطَّمَعِ nev'î mef'ûl-i mutlaktır, âmil fiilin masdarına muzâftır."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"ضَرَبْتُ ضَرْبًا شَدِيدًا.","gloss":{"en":"I struck a severe striking — naw'i, specified by an adjective.","tr":"Şiddetli bir vuruşla vurdum — nev'î, sıfatla belirtilmiş."},"src":null},{"ar":"ضَرَبْتُ ضَرْبَتَيْنِ.","gloss":{"en":"I struck twice — adadi, counting the occurrences.","tr":"İki kere vurdum — adedî, tekrarı sayar."},"src":null}],"mistakes":[{"wrong":"ضربتُ ضربٌ شديدٌ","right":"ضربتُ ضربًا شديدًا","why":{"en":"The maf'ul mutlaq is mansub, and its adjective follows it in nasb. It is not a second subject.","tr":"Mef'ûl-i mutlak mansubdur, sıfatı da nasbda ona uyar. İkinci bir fâil değildir."}},{"wrong":"ضربتُ بِضَرْبٍ شديدٍ","right":"ضربتُ ضربًا شديدًا","why":{"en":"No preposition is used: the masdar goes straight into nasb. Adding بِ turns it into an ordinary prepositional phrase and loses the emphasis.","tr":"Harf-i cer kullanılmaz: masdar doğrudan nasb alır. بِ eklenirse sıradan bir câr-mecrûr olur ve pekiştirme kaybolur."}},{"wrong":"جلستُ قُعُودًا","right":"جلستُ جُلُوسًا","why":{"en":"The maf'ul mutlaq must be the masdar of the SAME verb that governs it — بِمَعْنَاهُ in the definition. A synonym's masdar does not qualify.","tr":"Mef'ûl-i mutlak, kendisini amel eden fiilin AYNI masdarı olmalıdır — tanımdaki بِمَعْنَاهُ kaydı budur. Eş anlamlı bir fiilin masdarı olmaz."}}]},"mamnu-min-sarf":{"title":{"ar":"الْمَمْنُوعُ مِنَ الصَّرْف","en":"The diptote (mamnu' min as-sarf)","tr":"Gayr-ı munsarif isim"},"level":2,"group":"nahw","explanation":{"en":"A diptote is a noun \"barred from full inflection\": it refuses tanwin, and in the jarr position it takes fatha instead of kasra. The label lives on the border of sarf and nahw — the *reasons* it is barred are morphological (the causes are sarf: proper-name + feminine, proper-name + foreignness, the plural pattern مَفَاعِل/مَفَاعِيل, the adjectival أَفْعَل pattern, ألف التأنيث…), but the *effect* is a nahw rule about case endings, which is why al-Ajurrumiyya files it under علامات الجر (\"jarr is shown by fatha in the noun that does not inflect fully\"). In this story حَنِيفَة is a diptote through عَلَمِيَّة + تَأْنِيث (a feminine proper name), so «أَبِي حَنِيفَةَ» ends in fatha though it is majrur. يُوسُف is a diptote through عَلَمِيَّة + عُجْمَة (a foreign proper name): notice it never takes tanwin even in raf' (يُوسُفُ). One escape hatch: add الـ or make it a mudaf, and the kasra returns (فِي الْمَسَاجِدِ).","tr":"Gayr-ı munsarif, \"tam çekimden men edilmiş\" isimdir: tenvin almaz ve cer halinde kesre yerine fetha alır. Terim sarf ile nahiv sınırındadır — men sebepleri sarfîdir (alemiyet + te'nis, alemiyet + ucme, مَفَاعِل/مَفَاعِيل müntehe'l-cumû kalıbı, أَفْعَل sıfat kalıbı, elif-i te'nis…), ama sonucu i'rab (harekeler) ile ilgili bir nahiv kuralıdır; bu yüzden Âcurrûmiyye onu cer alâmetleri babında zikreder. Bu hikâyede حَنِيفَة alemiyet + te'nis ile gayr-ı munsariftir; bu yüzden «أَبِي حَنِيفَةَ» mecrur olduğu halde fetha ile biter. يُوسُف alemiyet + ucme ile gayr-ı munsariftir: ref halinde bile tenvin almaz (يُوسُفُ). İstisna: başına الـ gelirse veya muzaf olursa kesre geri döner (فِي الْمَسَاجِدِ)."},"plain":{"en":"Words that refuse tanwin and take fatha where other nouns take kasra.","tr":"Tenvin almayan ve başka isimlerin kesre aldığı yerde fetha alan kelimeler."},"sources":["الآجُرُّومِيَّة (ابن آجُرُّوم)","الكافية (ابن الحاجب)","الشافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"examples":[{"ar":"قَالَ أَبُو حَنِيفَةَ.","gloss":{"en":"Abu Hanifa said — حَنِيفَةَ is mudaf ilayh, majrur but marked by fatha because it is a diptote (feminine proper name).","tr":"Ebû Hanîfe dedi — حَنِيفَةَ muzâfun ileyhtir, mecrûrdur fakat gayr-i munsarif olduğu için fetha ile (müennes alem)."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"أَرَادَ يُوسُفُ أَنْ يَرْجِعَ.","gloss":{"en":"Yusuf wanted to return — يُوسُفُ is marfu' with a bare damma and no tanwin: a foreign proper name is a diptote.","tr":"Yusuf dönmek istedi — يُوسُفُ tenvinsiz sade damme ile merfûdur: yabancı alem gayr-i munsariftir."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"صَلَّيْتُ فِي مَسَاجِدَ كَثِيرَةٍ.","gloss":{"en":"I prayed in many mosques — مَسَاجِدَ (pattern مَفَاعِل) is a diptote: majrur but with fatha and no tanwin.","tr":"Birçok mescitte namaz kıldım — مَسَاجِدَ (مَفَاعِل vezni) gayr-i munsariftir: mecrûrdur ama fetha ile ve tenvinsiz."},"src":null}],"mistakes":[{"wrong":"قَالَ أَبُو حَنِيفَةٍ","right":"قَالَ أَبُو حَنِيفَةَ","why":{"en":"A diptote never takes tanwin and shows jarr by fatha, so «حنيفة» must end in a plain fatha — not the kasra-with-tanwin (ـةٍ) that a normal noun would take as mudaf ilayh.","tr":"Gayr-ı munsarif tenvin almaz ve cerri fetha ile gösterir; bu yüzden «حنيفة» düz fetha ile bitmeli — sıradan bir muzafun ileyhin alacağı tenvinli kesre (ـةٍ) ile değil."}},{"wrong":"جَاءَ يُوسُفٌ","right":"جَاءَ يُوسُفُ","why":{"en":"Even in raf' a diptote refuses tanwin: يُوسُفُ takes a single damma, not tanwin damma (ـٌ). Learners add tanwin by analogy with ordinary triptote nouns.","tr":"Ref halinde bile gayr-ı munsarif tenvin almaz: يُوسُفُ tek ötre alır, tenvinli ötre (ـٌ) değil. Öğrenciler sıradan munsarif isimlere kıyasla tenvin ekler."}}]},"mana-al-fil":{"title":{"ar":"مَعْنَى الْفِعْلِ (الْعَامِلُ الْمَعْنَوِيُّ فِي الْحَالِ)","en":"Verbal force without a verb (ma'na al-fi'l)","tr":"Mana-yı fiil (fiil manası taşıyan âmil)"},"level":5,"group":"awamil","explanation":{"en":"The governor of a HAL is usually a verb (ضَرَبْتُ زَيْدًا قَائِمًا) or a quasi-verb like an ism fa'il (زَيْدٌ فِي الدَّارِ قَائِمًا has the sense of «being»). The Kafiya adds a third class: مَعْنَى الْفِعْلِ — a word with no verbal form at all whose meaning performs an act. In هٰذَا زَيْدٌ قَائِمًا («here is Zayd, standing»), nothing looks like a verb, yet قَائِمًا stands in nasb as hal: the pointing word هٰذَا carries the force of أُشِيرُ «I point», and that hidden act is the governor. The same account covers the tanbih and tamanni particles and expressions like كَأَنَّ (تَشْبِيه = «I liken»). This is the item the Ottoman ma'mul tables list as «manayı fiil» among the governors: a reminder that government needs an act — but the act may live inside a meaning, not a conjugation.","tr":"HÂL'in âmili çoğu zaman bir fiildir (ضَرَبْتُ زَيْدًا قَائِمًا) yahut ism-i fâil gibi bir şibh-i fiildir (زَيْدٌ فِي الدَّارِ قَائِمًا «bulunma» manası taşır). Kâfiye üçüncü bir sınıf ekler: مَعْنَى الْفِعْلِ — şeklen fiil olmayan fakat manasıyla bir iş gören kelime. هٰذَا زَيْدٌ قَائِمًا («işte Zeyd, ayakta») cümlesinde fiile benzer hiçbir şey yoktur; yine de قَائِمًا hâl olarak mensubtur: işaret kelimesi هٰذَا, أُشِيرُ «işaret ederim» kuvvetini taşır ve âmil o gizli iştir. Tenbih ve temenni harfleri ile كَأَنَّ (teşbih = «benzetirim») gibi ifadeler de aynı hesaba girer. Osmanlı ma'mûl cetvellerinin âmiller arasında «manayı fiil» diye yazdığı madde budur: amel bir iş ister — fakat o iş bir çekimde değil, bir manada da yaşayabilir."},"plain":{"en":"Some words are not verbs but carry a verb's meaning — «this is…» secretly says «I point at…». That hidden verbal force can govern a hal.","tr":"Bazı kelimeler fiil değildir ama fiil manası taşır — «işte bu…» gizlice «işaret ederim» der. O gizli fiil kuvveti bir hâli nasb edebilir."},"mamul":"mansub","sources":["الكافية (ابن الحاجب) — عامل الحال","العوامل (البيركوي)"],"examples":[{"ar":"هٰذَا زَيْدٌ قَائِمًا.","gloss":{"en":"Here is Zayd, standing — قَائِمًا is hal, governed by the pointing force inside هٰذَا.","tr":"İşte Zeyd, ayakta — قَائِمًا hâldir; âmili هٰذَا'nın içindeki işaret kuvvetidir."},"src":null},{"ar":"كَأَنَّكَ شَمْسٌ طَالِعَةً.","gloss":{"en":"As if you were a sun, rising — the likening force of كَأَنَّ governs the hal.","tr":"Sanki doğan bir güneşsin — hâli, كَأَنَّ'deki benzetme kuvveti nasb eder."},"src":null}],"mistakes":[{"wrong":"هٰذَا زَيْدٌ قَائِمٌ (مُرَادًا بِهِ الْحَال)","right":"هٰذَا زَيْدٌ قَائِمًا","why":{"en":"If «standing» describes the state of the act of pointing, it is hal and must be mansub. Raf' would make it a second khabar instead.","tr":"«Ayakta» işaret etme ânındaki hâli anlatıyorsa hâldir, mensub olmalıdır. Merfû okunursa ikinci haber olur."}},{"wrong":"قَائِمًا هٰذَا زَيْدٌ","right":"هٰذَا زَيْدٌ قَائِمًا","why":{"en":"A hal governed by mere verbal force may not precede its governor — that licence belongs to real verbs.","tr":"Âmili yalnız mana-yı fiil olan hâl, âmilinin önüne geçemez — o ruhsat gerçek fiillere aittir."}}]},"masdar":{"title":{"ar":"الْمَصْدَر","en":"The masdar (verbal noun)","tr":"Masdar"},"level":3,"group":"sarf","explanation":{"en":"The masdar names the act itself, with no doer and no time: نَقْل «transferring», حَبْس «holding», تَمْلِيك «conveying ownership». It is a NOUN, so it takes case endings and can head an idafa — and that is why almost every classical definition is built on one. «الرَّهْنُ حَبْسُ شَيْءٍ» is mubtada and khabar, and the khabar is a masdar governing what follows. For the augmented babs the masdar is regular and can simply be learned with the pattern: أَفْعَلَ → إِفْعَال, فَعَّلَ → تَفْعِيل, فَاعَلَ → مُفَاعَلَة, تَفَعَّلَ → تَفَعُّل, تَفَاعَلَ → تَفَاعُل, اِنْفَعَلَ → اِنْفِعَال, اِفْتَعَلَ → اِفْتِعَال, اِسْتَفْعَلَ → اِسْتِفْعَال. For the BARE triliteral it is not regular at all: it is سَمَاعِيّ, heard and memorised, and the manuals count some thirty-two patterns for it — قَتْلٌ, فِسْقٌ, شُغْلٌ, رَحْمَةٌ, بُشْرَى, حِرْمَانٌ, طَلَبٌ, ذَهَابٌ, دُخُولٌ, صُهُوبَةٌ and the rest. There is no rule to apply; the masdar of a bare verb is learned with the verb, exactly like its bab.","tr":"Masdar, fâili ve zamanı olmaksızın işin kendisini adlandırır: نَقْل «devretme», حَبْس «tutma», تَمْلِيك «temlik». İSİMDİR; i'rab alır ve izafetin başına geçer — klasik tariflerin neredeyse tamamının masdarla kurulmasının sebebi budur. «الرَّهْنُ حَبْسُ شَيْءٍ» mübteda ve haberdir, haber ise sonrasını izafetle alan bir masdardır. Mezîd bablarda masdar kıyasîdir ve vezniyle birlikte öğrenilir: أَفْعَلَ → إِفْعَال، فَعَّلَ → تَفْعِيل، فَاعَلَ → مُفَاعَلَة، تَفَعَّلَ → تَفَعُّل، تَفَاعَلَ → تَفَاعُل، اِنْفَعَلَ → اِنْفِعَال، اِفْتَعَلَ → اِفْتِعَال، اِسْتَفْعَلَ → اِسْتِفْعَال. Sülâsî MÜCERREDDE ise hiç kıyasî değildir: semâîdir, işitilip ezberlenir; kitaplar bunun için otuz iki kadar vezin sayar — قَتْلٌ، فِسْقٌ، شُغْلٌ، رَحْمَةٌ، بُشْرَى، حِرْمَانٌ، طَلَبٌ، ذَهَابٌ، دُخُولٌ، صُهُوبَةٌ ve diğerleri. Uygulanacak bir kaide yoktur; mücerred fiilin masdarı, tıpkı bâbı gibi, fiille birlikte öğrenilir."},"plain":{"en":"The name of the action itself — «entering», «knowing» — a noun made out of a verb.","tr":"İşin kendisinin adı — «girmek», «bilmek» — fiilden yapılmış isim."},"sources":["المقصود","مراح الأرواح","الكافية (ابن الحاجب)"],"examples":[{"ar":"الْبَيْعُ مُبَادَلَةُ مَالٍ بِمَالٍ.","gloss":{"en":"A sale is the exchange of property for property — the khabar is a Form III masdar heading an idafa.","tr":"Bey', bir malın bir malla mübâdelesidir — haber, izafetin başındaki mufâale masdarıdır."},"src":"kitab-al-buyu"},{"ar":"وَالرَّهْنُ حَبْسُ شَيْءٍ بِحَقٍّ.","gloss":{"en":"A pledge is the holding of a thing against a right — حَبْس is a sama'i masdar of the bare verb.","tr":"Rehin, bir hak sebebiyle bir şeyi tutmaktır — حَبْس mücerred fiilin semâî masdarıdır."},"src":"kitab-al-buyu"},{"ar":"وَالْوَكَالَةُ إِقَامَةُ الْغَيْرِ مَقَامَ نَفْسِهِ.","gloss":{"en":"Agency is putting another in one's own place — إِقَامَة is the Form IV masdar of أَقَامَ, its ة standing in for the lost و.","tr":"Vekâlet, başkasını kendi yerine geçirmektir — إِقَامَة, أَقَامَ'nin if'âl masdarıdır; tâsı düşen vâvın yerini tutar."},"src":"kitab-al-buyu"}],"mistakes":[{"wrong":"أَكْرَمَ — إِكْرَامَة","right":"أَكْرَمَ — إِكْرَام","why":{"en":"Form IV's masdar is إِفْعَال. The ة appears only where a weak letter was lost — إِقَامَة for أَقَامَ, إِطَاعَة for أَطَاعَ.","tr":"İf'âl bâbının masdarı إِفْعَال'dir. Tâ yalnız illetli harf düştüğünde gelir: أَقَامَ → إِقَامَة، أَطَاعَ → إِطَاعَة."}},{"wrong":"ذَهَبَ — ذَهْب","right":"ذَهَبَ — ذَهَاب","why":{"en":"There is no rule to fall back on for a bare verb; the masdar is heard, not derived. ذَهَاب is the one that is used.","tr":"Mücerred fiilde başvurulacak bir kaide yoktur; masdar semâîdir. Kullanılan şekil ذَهَاب'tır."}},{"wrong":"«حَبْسُ شَيْءٌ»","right":"«حَبْسُ شَيْءٍ»","why":{"en":"A masdar governs its complement by idafa, so what follows is majrur — not by any verbal force it might seem to have.","tr":"Masdar mütemmimini izafetle alır; sonrası mecrûrdur."}}]},"mithal-verbs":{"title":{"ar":"الْفِعْلُ الْمِثَال","en":"Assimilated verbs (initial و or ي)","tr":"Misal fiil (başı و veya ي)"},"level":3,"group":"sarf","explanation":{"en":"A mithal verb has و or ي as its FIRST radical: وَعَدَ, وَصَلَ, يَسَرَ. The past tense is completely regular — وَعَدْتُ, وَصَلَتْ, conjugated exactly like a sound verb, active and passive alike. Everything interesting happens in the present. The rule is precise: a و caught between the fatha-bearing prefix يَ and an original kasra is dropped. يَوْعِدُ becomes يَعِدُ, يَوْصِلُ becomes يَصِلُ. It disappears from everything built on that present too — لَمْ يَعِدْ, لَنْ يَعِدَ, لِيَعِدْ, and the imperative عِدْ, which is one letter long. Note the two conditions: the vowel after the و must be an original KASRA (so bab 4's يَوْجَلُ keeps its و), and the passive restores it, because there the vowel is damma: يُوعَدُ. A mithal with ي behaves quite differently — the ي is never dropped in any bab: يَيْسِرُ, يَيْمُنُ, يَيْئَسُ. Two further habits: masdars on فِعْلَة shed the و and compensate with a ة (وِعْدَة → عِدَة), and in bab VIII the و or ي turns into ت and merges with the bab's own ت — اِوْتَعَدَ → اِتَّعَدَ.","tr":"Misal fiilin BİRİNCİ harfi و veya ي'dir: وَعَدَ، وَصَلَ، يَسَرَ. Mâzisi tamamen düzgündür — وَعَدْتُ، وَصَلَتْ; malum ve meçhulüyle sahih fiil gibi çekilir. Bütün mesele muzâridedir. Kaide nettir: fethalı يَ ile aslî bir kesre arasında kalan و düşer. يَوْعِدُ → يَعِدُ، يَوْصِلُ → يَصِلُ. Muzâriye tâbi olan her sîgada da düşer — لَمْ يَعِدْ، لَنْ يَعِدَ، لِيَعِدْ ve tek harflik emir عِدْ. İki şarta dikkat: و'dan sonraki hareke aslî KESRE olmalıdır (bu yüzden dördüncü babın يَوْجَلُ'ü و'ını korur) ve meçhulde و geri döner, çünkü orada hareke dammedir: يُوعَدُ. Misal-i yâî ise bambaşkadır — ي hiçbir babda düşmez: يَيْسِرُ، يَيْمُنُ، يَيْئَسُ. İki âdet daha: فِعْلَة vezinli masdarlarda و düşer ve yerine tâ gelir (وِعْدَة → عِدَة); iftiâl bâbında ise و/ي, تا'ya kalbolup bâbın tâsına idgam edilir — اِوْتَعَدَ → اِتَّعَدَ."},"plain":{"en":"Verbs that start with و or ي. The و often drops out in the present and the command: وَقَفَ «he stood» gives قِفْ «stop!».","tr":"Başı و veya ي olan fiiller. و çoğu zaman muzâri ve emirde düşer: وَقَفَ «durdu» → قِفْ «dur!»."},"sources":["مراح الأرواح (ص ٨٣-٨٤)","العزّي (ص ١٤٨-١٥٠)","المقصود (ص ١٨٣، ٢٠٥)","ملخّص الصرف العربي (ص ٦٦)","بناء الأفعال — الأقسام السبعة"],"examples":[{"ar":"وَقَفَ الْفِيلُ أَمَامَ مَكَّةَ.","gloss":{"en":"The elephant stopped before Mecca — وَقَفَ is sound in the past; its present is يَقِفُ, with the و gone.","tr":"Fil Mekke'nin önünde durdu — وَقَفَ mâzide sahihtir; muzârisi يَقِفُ'dur, vâv düşmüştür."},"src":"ashab-al-fil"},{"ar":"مَا وَصَلَ الْجَيْشُ إِلَى مَكَّةَ.","gloss":{"en":"The army did not reach Mecca — وَصَلَ / يَصِلُ, another mithal wawi.","tr":"Ordu Mekke'ye ulaşmadı — وَصَلَ / يَصِلُ, bir başka misal-i vâvî."},"src":"ashab-al-fil"},{"ar":"وَقَعَ يُونُسُ فِي الْبَحْرِ.","gloss":{"en":"Yunus fell into the sea — وَقَعَ / يَقَعُ: bab IV, so the vowel is fatha, yet the و still drops.","tr":"Yunus denize düştü — وَقَعَ / يَقَعُ: dördüncü bâb, hareke fethadır, yine de vâv düşer."},"src":"yunus-wa-al-hut"}],"mistakes":[{"wrong":"لَمْ يَوْصِلْ إِلَى مَكَّةَ","right":"لَمْ يَصِلْ إِلَى مَكَّةَ","why":{"en":"Whatever is built on the present inherits the dropped و — jussive, subjunctive, imperative and prohibition all lose it.","tr":"Muzâriden türeyen her sîga düşen و'ı da devralır: cezm, nasb, emir ve nehiy hepsinde و yoktur."}},{"wrong":"اِوْصِلْ","right":"صِلْ","why":{"en":"The imperative of a mithal is built from the jussive, which has already lost the و — so no connecting hamza is needed and the word is one letter plus its ending.","tr":"Misalin emri meczumdan yapılır ve orada و zaten düşmüştür; bu yüzden vasıl hemzesine gerek kalmaz."}},{"wrong":"يَسَرَ – يَسِرُ","right":"يَسَرَ – يَيْسِرُ","why":{"en":"The rule is for و only. A mithal ya'i keeps its ي in every bab — nothing is dropped.","tr":"Kaide yalnız و içindir. Misal-i yâînin يا'sı hiçbir babda düşmez."}},{"wrong":"يُعَدُ (مَجْهُولُ يَعِدُ)","right":"يُوعَدُ","why":{"en":"The و was dropped because it stood before a kasra. The passive has damma there instead, so the condition fails and the و comes back.","tr":"و, kesreden önce bulunduğu için düşmüştü. Meçhulde orada damme vardır, şart bozulur ve و geri döner."}}]},"mubtada-khabar":{"title":{"ar":"الْمُبْتَدَأُ وَالْخَبَر","en":"The nominal sentence (mubtada and khabar)","tr":"Mübteda ve haber"},"level":2,"group":"nahw","explanation":{"en":"A nominal sentence (الجملة الاسمية) opens with a noun and is built from two marfu' parts: the مُبْتَدَأ (the topic you start with) and the خَبَر (what you say about it). Both are in raf'. Unusually, the governor that raises them is not a spoken word but a meaning — الابتداء, the very act of beginning — which is why grammarians call it an عامل معنوي. The khabar can be a single word (مفرد: زَيْدٌ قَائِمٌ), a phrase (شبه جملة — a jar-majrur or adverb), or a whole sentence. In this story «الْأَعْمَالُ بِالنِّيَّاتِ»: الْأَعْمَالُ is the mubtada (marfu'), and the prepositional phrase بِالنِّيَّاتِ stands in the place of the khabar (attaching to an omitted خبر such as «كائنةٌ» / «معتبرةٌ»). Note too that once إِنَّ or كَانَ enters such a sentence the pair is renamed (ism/khabar) and one of them changes case — but underneath it is still this mubtada–khabar structure. Ibn Ajurrum devotes a chapter to it; Ibn Hisham details the kinds of khabar in Qatr al-Nada.","tr":"İsim cümlesi (الجملة الاسمية) bir isimle başlar ve iki merfu ögeden kurulur: mübteda (başladığın konu) ve haber (onun hakkında söylenen). Her ikisi de merfudur. İlginç olan, bunları ref eden âmilin söylenen bir kelime değil, bir mana olmasıdır — ibtidâ, yani başlama fiili; bu yüzden gramerciler ona âmil-i manevî der. Haber tek kelime (müfred: زَيْدٌ قَائِمٌ), bir öbek (şibh-i cümle — car-mecrur ya da zarf) veya tam bir cümle olabilir. Bu hikâyede «الْأَعْمَالُ بِالنِّيَّاتِ»: الْأَعْمَالُ mübtedadır (merfu) ve بِالنِّيَّاتِ car-mecruru haberin yerini tutar (hazfedilmiş bir habere, mesela «كائنةٌ» / «معتبرةٌ», müteallik). Ayrıca إِنَّ veya كَانَ bu cümleye girince çift yeniden adlandırılır (ism/haber) ve birinin i'rabı değişir — ama alttaki yapı yine bu mübteda–haber yapısıdır."},"plain":{"en":"A sentence with no verb in it: a topic, and what you say about it.","tr":"İçinde fiil bulunmayan cümle: bir konu ve o konu hakkında söylenen."},"mamul":"marfu","sources":["الآجُرُّومِيَّة (ابن آجُرُّوم)","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"question":{"tr":["Nedir?","Kimdir?","Ne iledir?","Kim iledir?","Ne sebebiyledir?","Niçindir?","Nerededir?"],"en":["What is it?","Who is it?","With what is it?","With whom is it?","By what cause is it?","What for is it?","Where is it?"]},"examples":[{"ar":"الْأَعْمَالُ بِالنِّيَّاتِ.","gloss":{"en":"Deeds are by intentions — الْأَعْمَالُ is the mubtada (marfu'); the jar-majrur بِالنِّيَّاتِ takes the place of the khabar.","tr":"Ameller niyetlerledir — الْأَعْمَالُ merfû mübtedadır; بِالنِّيَّاتِ câr-mecrûru haberin yerini tutar."},"src":"deeds-are-by-intentions"},{"ar":"الْعِلْمُ نَافِعٌ.","gloss":{"en":"Knowledge is beneficial — الْعِلْمُ mubtada, نَافِعٌ khabar, both marfu'.","tr":"İlim faydalıdır — الْعِلْمُ mübteda, نَافِعٌ haber, ikisi de merfû."},"src":null},{"ar":"الطَّالِبُ مُجْتَهِدٌ.","gloss":{"en":"The student is diligent — the khabar مُجْتَهِدٌ agrees with the mubtada in gender and number.","tr":"Talebe çalışkandır — haber مُجْتَهِدٌ, mübtedaya cinsiyet ve sayıda uyar."},"src":null}],"mistakes":[{"wrong":"الْعِلْمُ نَافِعًا","right":"الْعِلْمُ نَافِعٌ","why":{"en":"The khabar of a plain nominal sentence is marfu', not mansub. Learners give it nasb by confusing it with the khabar of كان (which really is mansub).","tr":"Sıradan bir isim cümlesinde haber merfudur, mansub değil. Öğrenciler bunu kânenin haberi (ki o gerçekten mansubdur) ile karıştırarak nasb verir."}},{"wrong":"الْأَعْمَالَ بِالنِّيَّاتِ","right":"الْأَعْمَالُ بِالنِّيَّاتِ","why":{"en":"The mubtada is marfu' — الْأَعْمَالُ with a damma. Putting it in nasb (الأعمالَ) treats it as an object, but nothing here governs it in nasb.","tr":"Mübteda merfudur — ötreli الْأَعْمَالُ. Nasb vermek (الأعمالَ) onu nesne saymak olur, oysa burada onu nasb edecek bir âmil yoktur."}}]},"mudari-marfu":{"title":{"ar":"رَفْعُ الْمُضَارِعِ بِالتَّجَرُّد","en":"The present verb in raf' — the abstract governor","tr":"Muzârinin tecerrüdle merfû oluşu"},"level":3,"group":"awamil","explanation":{"en":"Birgivi divides governors into the SPOKEN (عَامِلٌ لَفْظِيٌّ) and the ABSTRACT (عَامِلٌ مَعْنَوِيٌّ). The Izhar defines the first as «مَا يَكُونُ لِلِّسَانِ فِيهِ حَظٌّ» — that in which the tongue has a share, i.e. a governor you can pronounce. The abstract governors are only two, and one of them is this: a present verb is in RAF' precisely because nothing is governing it. Its freedom from any nasib (أَنْ، لَنْ، كَيْ، إِذَنْ) and any jazim (لَمْ، لَا الناهية، and the rest of the fifteen) is itself what raises it. So يَنْتَفِعُ carries a damma not because some word put it there, but because no word took it away. The other abstract governor is the one that raises the mubtada and its khabar.","tr":"Birgivî âmilleri LAFZÎ ve MA'NEVÎ diye ikiye ayırır. İzhâr birincisini «مَا يَكُونُ لِلِّسَانِ فِيهِ حَظٌّ» diye tanımlar — kendisinde dil için bir pay bulunan, yani telaffuz edilebilen âmil. Ma'nevî âmiller yalnız ikidir ve biri budur: muzari fiil, tam da kendisine hiçbir şey amel etmediği için REF hâlindedir. Nâsıblardan (أَنْ، لَنْ، كَيْ، إِذَنْ) ve cezm edatlarından (لَمْ، nehiy لَا ve on beşin geri kalanı) hâlî olması, onu ref eden şeyin ta kendisidir. Yani يَنْتَفِعُ dammeyi bir kelime koyduğu için değil, hiçbir kelime almadığı için taşır. Diğer ma'nevî âmil, mübteda ile haberi ref edendir."},"plain":{"en":"Sometimes nothing visible causes the ending: a present verb is marfu' precisely because no particle is standing in front of it.","tr":"Bazen i'rabı görünür bir şey yapmaz: muzâri fiil, başında bir edat bulunmadığı için merfû olur."},"amil":"الْعَامِلُ الْمَعْنَوِيُّ: تَجَرُّدُ الْمُضَارِعِ عَنِ النَّاصِبِ وَالْجَازِمِ — an abstract governor: the verb's very freedom from any nasib or jazim","mamul":"marfu","sources":["العوامل (البيركوي) — العامل المعنوي","إظهار الأسرار (البيركوي)","الكافية (ابن الحاجب)"],"examples":[{"ar":"تَنْتَفِعُ بِهَا وَتَتَبَاعَدُ عَنْهَا.","gloss":{"en":"You benefit from it and keep your distance — both verbs are marfu' because nothing governs them.","tr":"Ondan faydalanır ve uzak durursun — iki fiil de merfûdur, çünkü onlara amel eden bir şey yoktur."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"كُلُّ أُمَّتِي يَدْخُلُونَ الْجَنَّةَ.","gloss":{"en":"All my community enter the Garden — marfu' by the retained ن, again through sheer freedom from a governor.","tr":"Ümmetimin tamamı cennete girer — sabit kalan nûn ile merfû; yine sırf âmilden hâlî olmakla."},"src":"min-muqaddimat-al-maqsud"},{"ar":"لَنْ يَنْتَفِعَ / لَمْ يَنْتَفِعْ.","gloss":{"en":"Compare: the moment a nasib or a jazim arrives, the raf' is gone.","tr":"Karşılaştırın: bir nâsıb yahut câzim girdiği anda ref kalkar."},"src":null}],"mistakes":[{"wrong":"البحث عن عاملٍ ملفوظٍ يرفع المضارع","right":"رَفْعُهُ بِالتَّجَرُّدِ","why":{"en":"Learners hunt for a word that raises the present verb. There is none — the raising is abstract, and naming a word for it is the error.","tr":"Öğrenciler muzariyi ref eden bir kelime ararlar. Böyle bir kelime yoktur — ref ma'nevîdir; ona bir kelime göstermek hatanın kendisidir."}},{"wrong":"أُرِيدُ أَنْ أَذْهَبُ","right":"أُرِيدُ أَنْ أَذْهَبَ","why":{"en":"Once أَنْ is present the verb is no longer «free», so the raf' lapses and nasb takes over.","tr":"أَنْ geldiği anda fiil artık «hâlî» değildir; ref düşer, yerini nasb alır."}}]},"muqabala":{"title":{"ar":"المُقَابَلَة","en":"Muqabala — a set answered by its counterpart, in order","tr":"Mukâbele — bir kümenin karşısına sırasıyla mukâbilini getirmek"},"level":5,"group":"balagha","explanation":{"en":"Muqabala is tibaq scaled up and put in order: you state two or more meanings that agree with one another, and then bring the counterpart of each, following the same sequence. Two against two: «فَلْيَضْحَكُوا قَلِيلًا وَلْيَبْكُوا كَثِيرًا» — laughing answered by weeping, little answered by much. Three against three, in Abu Dulama's line: how
