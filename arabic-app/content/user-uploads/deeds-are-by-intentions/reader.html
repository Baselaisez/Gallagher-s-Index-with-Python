aber verir, mübalağa sîgası vasfı bildirir. Senâ makamında murad olan mübalağadır."}},{"wrong":"مِفْتَاحٌ — صِيغَةُ مُبَالَغَةٍ","right":"مِفْتَاحٌ اسْمُ آلَةٍ","why":{"en":"مِفْعَال serves both the intensive and the instrument. مِفْتَاح is an instrument — a key — and only its meaning tells you which.","tr":"مِفْعَال hem mübalağa hem ism-i âlet için kullanılır. مِفْتَاح âlettir; hangisi olduğunu ancak mana gösterir."}}]},"tamyiz":{"title":{"ar":"التَّمْيِيز","en":"The tamyiz (accusative of specification)","tr":"Temyîz"},"level":4,"group":"nahw","explanation":{"en":"Defined in the Mansubat as «مَا يَرْفَعُ الْإِبْهَامَ الْمُسْتَقِرَّ عَنْ ذَاتٍ مَذْكُورَةٍ أَوْ مُقَدَّرَةٍ» — the indefinite noun in nasb that clears up an ambiguity already settled in the sentence. It answers «in what respect?». The Mansubat divides it in two: (1) tamyiz of a STATED thing (مَذْكُورَة) — after measures, weights and numbers: رِطْلٌ زَيْتًا, عِشْرُونَ كِتَابًا; (2) tamyiz of an IMPLIED thing (مُقَدَّرَة), which resolves a whole sentence: طَابَ الرَّجُلُ نَفْسًا «the man was good — in soul». The tamyiz is always indefinite and always mansub.","tr":"Mensûbât'ta şöyle tanımlanır: «مَا يَرْفَعُ الْإِبْهَامَ الْمُسْتَقِرَّ عَنْ ذَاتٍ مَذْكُورَةٍ أَوْ مُقَدَّرَةٍ» — cümlede yerleşmiş bir kapalılığı gideren, nekre ve mansub isimdir. «Hangi bakımdan?» sorusuna cevap verir. Mensûbât ikiye ayırır: (1) ZİKREDİLMİŞ bir zâtın temyizi — ölçü, tartı ve sayılardan sonra: رِطْلٌ زَيْتًا, عِشْرُونَ كِتَابًا; (2) MUKADDER bir zâtın temyizi, ki bütün cümlenin kapalılığını giderir: طَابَ الرَّجُلُ نَفْسًا «adam hoş oldu — nefis bakımından». Temyiz daima nekre ve daima mansubdur."},"plain":{"en":"Answers «in what respect?»: «the greatest of people in regret».","tr":"«Hangi cihetten?» sorusuna cevap verir: «insanların hasret bakımından en şiddetlisi»."},"mamul":"mansub","sources":["المنصوبات","العوامل (البيركوي)","قطر الندى (ابن هشام)"],"question":{"tr":["Ne cihetten?"],"en":["In what respect?"]},"examples":[{"ar":"أَشَدُّ النَّاسِ حَسْرَةً يَوْمَ الْقِيَامَةِ.","gloss":{"en":"The people of greatest regret on the Day of Resurrection — حَسْرَةً is the tamyiz after an ism tafdil, naming the respect in which «greatest» holds.","tr":"Kıyamet günü pişmanlığı en büyük olan insanlar — حَسْرَةً, ism-i tafdîlden sonra gelen temyîzdir; «en büyük»ün hangi cihetten olduğunu belirtir."},"src":"min-muqaddimat-al-maqsud"},{"ar":"طَابَ الرَّجُلُ نَفْسًا.","gloss":{"en":"The man was contented — in respect of soul. Tamyiz of an implied thing.","tr":"Adam gönlü hoş oldu — nefis cihetinden. Mukadder bir şeyin temyîzi."},"src":null},{"ar":"اِشْتَرَيْتُ رِطْلًا زَيْتًا.","gloss":{"en":"I bought a pound — of oil. Tamyiz after a measure.","tr":"Bir rıtl satın aldım — yağdan. Ölçüden sonra temyîz."},"src":null},{"ar":"عِشْرُونَ كِتَابًا.","gloss":{"en":"Twenty books — the counted noun after 11-99 is a singular mansub tamyiz.","tr":"Yirmi kitap — 11-99 arasında ma'dûd, mansub müfred temyîzdir."},"src":null}],"mistakes":[{"wrong":"عشرون كُتُبٍ","right":"عشرون كِتَابًا","why":{"en":"After the numbers 11-99 the counted noun is a SINGULAR tamyiz in nasb, not a plural in jarr. This is the most frequent tamyiz error.","tr":"11-99 sayılarından sonra sayılan isim, mecrûr çoğul değil, mansub TEKİL temyizdir. En sık yapılan temyiz hatasıdır."}},{"wrong":"طاب الرجلُ النفسَ","right":"طاب الرجلُ نفسًا","why":{"en":"The tamyiz must stay indefinite — definiteness would make it an object or an apposition instead.","tr":"Temyiz nekre kalmalıdır — marife yapılırsa mef'ûl veya bedel hâline gelir."}},{"wrong":"طاب الرجلُ نفسٌ","right":"طاب الرجلُ نفسًا","why":{"en":"The tamyiz is mansub; giving it raf' makes it read as a second subject of the verb.","tr":"Temyiz mansubdur; ref verilirse fiilin ikinci fâili gibi okunur."}}]},"tanazu":{"title":{"ar":"التَّنَازُعُ فِي الْعَمَلِ","en":"Tanazu': two verbs contending over one noun","tr":"Tenâzu (iki fiilin bir isimde çekişmesi)"},"level":6,"group":"nahw","explanation":{"en":"التَّنَازُع is two verbs (or quasi-verbs) followed by ONE overt noun that either could take, as its fa'il, its maf'ul, or one of each. The Kafiya's three cases: contention over the fa'il — ضَرَبَنِي وَأَكْرَمَنِي زَيْدٌ («he struck me and he honoured me — Zayd»); over the maf'ul — ضَرَبْتُ وَأَكْرَمْتُ زَيْدًا; and mixed — أَكْرَمَنِي وَضَرَبْتُ زَيْدًا. One word cannot carry two governments at once, so one verb wins the noun and the loser governs a concealed pronoun that refers to it. The schools split over who wins: the Basrans prefer the NEARER verb (its claim is adjacent), the Kufans the FIRST (its claim is earlier). The corpus follows the Basran choice, which is also the reading the received examples assume. What the reader needs in practice: when a noun after two verbs seems to belong to both, its i'rab is assigned by exactly one of them — parse it once, not twice.","tr":"التَّنَازُع: iki fiilin (yahut şibh-i fiilin) kendilerinden sonra gelen TEK bir zâhir isimde çekişmesidir — isim her ikisine fâil, her ikisine mef'ûl yahut birine fâil öbürüne mef'ûl olmaya elverişlidir. Kâfiye'nin üç sûreti: fâilde çekişme — ضَرَبَنِي وَأَكْرَمَنِي زَيْدٌ; mef'ûlde çekişme — ضَرَبْتُ وَأَكْرَمْتُ زَيْدًا; ve karışık — أَكْرَمَنِي وَضَرَبْتُ زَيْدًا. Bir kelime iki ameli birden taşıyamaz; fiillerden biri ismi alır, kaybeden ise ona râci gizli bir zamirde amel eder. Kimin kazanacağında mektepler ayrılır: Basralılar YAKIN fiili (komşuluk hakkı), Kûfeliler İLK fiili (öncelik hakkı) tercih eder. Külliyat Basra tercihini takip eder; me'sur misallerin okunuşu da budur. Okuyucu için pratik netice: iki fiilden sonra gelen isim ikisine de ait görünüyorsa, i'rabını yalnız BİRİ vermiştir — bir kere tahlil edin, iki kere değil."},"plain":{"en":"In «he struck me and honoured me — Zayd», two verbs both want زيد. Only one may govern him; the other gets a hidden pronoun instead.","tr":"«Beni dövdü ve bana ikram etti — Zeyd» cümlesinde iki fiil de زيد'i ister. Yalnız biri onda amel edebilir; öbürüne gizli bir zamir düşer."},"sources":["الكافية (ابن الحاجب) — التنازع","قطر الندى (ابن هشام)"],"examples":[{"ar":"ضَرَبَنِي وَأَكْرَمَنِي زَيْدٌ.","gloss":{"en":"Contention over the fa'il: زَيْدٌ is raf' as fa'il of the nearer verb أَكْرَمَنِي; ضَرَبَنِي keeps a hidden «he».","tr":"Fâilde tenâzu: زَيْدٌ yakın fiil أَكْرَمَنِي'nin fâili olarak merfûdur; ضَرَبَنِي'ye gizli bir «o» kalır."},"src":null},{"ar":"ضَرَبْتُ وَأَكْرَمْتُ زَيْدًا.","gloss":{"en":"Contention over the maf'ul: زَيْدًا is nasb by the nearer أَكْرَمْتُ; the first verb's object is an understood pronoun.","tr":"Mef'ûlde tenâzu: زَيْدًا yakın fiil أَكْرَمْتُ ile mensubtur; ilk fiilin mef'ûlü mukadder bir zamirdir."},"src":null}],"mistakes":[{"wrong":"ضَرَبَنِي وَأَكْرَمَنِي زَيْدًا","right":"ضَرَبَنِي وَأَكْرَمَنِي زَيْدٌ","why":{"en":"Both verbs want زيد as their FA'IL here, so whoever wins, the overt noun stands in raf'. Nasb would treat it as an object neither verb is missing.","tr":"Burada iki fiil de زيد'i FÂİL ister; hangisi kazanırsa kazansın zâhir isim merfû olur. Nasb, hiçbir fiilin aramadığı bir mef'ûl uydurmak olur."}},{"wrong":"زَيْدٌ ضَرَبَنِي وَأَكْرَمَنِي (على أنه تنازع)","right":"ضَرَبَنِي وَأَكْرَمَنِي زَيْدٌ","why":{"en":"Tanazu' requires the noun AFTER both governors. With زيد in front there is no contest — he is simply mubteda and the verbs carry his pronouns.","tr":"Tenâzu, ismin iki âmilden SONRA gelmesini ister. زيد başa geçince çekişme kalmaz — o artık mübtedâdır, fiiller onun zamirlerini taşır."}}]},"tashbih":{"title":{"ar":"التَّشْبِيه","en":"Simile — the four pillars","tr":"Teşbih ve dört rüknü"},"level":4,"group":"balagha","explanation":{"en":"A tashbih says that one thing shares a quality with another. It has four pillars: the thing compared (مُشَبَّه), the thing compared to (مُشَبَّهٌ بِهِ), the tool that joins them (أَدَاةُ التَّشْبِيه — كَ, كَأَنَّ, مِثْل, كَمَا), and the point they share (وَجْهُ الشَّبَه). «فَكُنْ مِنْهُ كَمَا أَنْتَ مِنَ النَّارِ» has all four: you and fire, joined by كَمَا, sharing the way one keeps a careful distance. The tradition grades a tashbih by how much it leaves out. Name all four and it is مُرْسَلٌ مُفَصَّل, the plainest kind. Drop the tool and it is مُؤَكَّد; drop the shared point and it is مُجْمَل; drop both — «أَنْتَ بَدْرٌ» — and you have تَشْبِيهٌ بَلِيغ, the strongest, because nothing is left between the two things. That grading is the whole craft: the more the ear has to supply, the more forceful the comparison.","tr":"Teşbih, bir şeyin başka bir şeyle bir vasıfta ortak olduğunu söyler. Dört rüknü vardır: müşebbeh, müşebbehün bih, edât (كَ، كَأَنَّ، مِثْل، كَمَا) ve vech-i şebeh. «فَكُنْ مِنْهُ كَمَا أَنْتَ مِنَ النَّارِ» dördünü de taşır: sen ve ateş, كَمَا ile birleşmiş, ortak nokta ise ölçülü mesafeyi korumaktır. Gelenek teşbihi, ne kadarını hazfettiğine göre derecelendirir. Dördü de zikredilirse mürsel-mufassaldır, en sadesi. Edât hazfedilirse müekked; vech-i şebeh hazfedilirse mücmel; ikisi birden hazfedilirse — «أَنْتَ بَدْرٌ» — teşbîh-i belîğ olur, en kuvvetlisi; çünkü iki şeyin arasında hiçbir şey kalmaz. Bu derecelendirme işin kendisidir: kulak ne kadar çok tamamlarsa teşbih o kadar tesirli olur."},"plain":{"en":"Saying one thing is like another — and the four pieces that make the comparison.","tr":"Bir şeyin başka bir şeye benzediğini söylemek ve teşbihi kuran dört rükün."},"sources":["تلخيص المفتاح (القزويني) — علم البيان","مختصر السعد"],"examples":[{"ar":"فَكُنْ مِنْهُ كَمَا أَنْتَ مِنَ النَّارِ.","gloss":{"en":"Be to him as you are to fire — all four pillars, with كَمَا as the tool.","tr":"Ona karşı ateşe karşı olduğun gibi ol — dört rükün de var, edât كَمَا."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"وَمَاؤُهُ أَبْيَضُ مِنَ اللَّبَنِ وَرِيحُهُ أَطْيَبُ مِنَ الْمِسْكِ.","gloss":{"en":"Its water whiter than milk, its scent sweeter than musk — comparison carried by the elative and مِنْ rather than by an adat.","tr":"Suyu sütten beyaz, kokusu miskten güzel — mukayese, edâtla değil ism-i tafdîl ve مِنْ ile taşınır."},"src":"aqaid-ahl-al-sunna"},{"ar":"أَنْتَ بَدْرٌ.","gloss":{"en":"You are a full moon — tool and shared point both dropped: tashbih baligh.","tr":"Sen bir dolunaysın — edât da vech-i şebeh de hazfedilmiş: teşbîh-i belîğ."},"src":null}],"mistakes":[{"wrong":"«أَنْتَ بَدْرٌ» اسْتِعَارَةٌ","right":"تَشْبِيهٌ بَلِيغٌ، لِأَنَّ الْمُشَبَّهَ مَذْكُورٌ","why":{"en":"Both sides are still named, so it is a tashbih with its tool dropped. An isti'ara names only ONE side.","tr":"İki taraf da zikredilmiştir; bu, edâtı hazfedilmiş bir teşbihtir. İstiârede taraflardan yalnız BİRİ zikredilir."}},{"wrong":"زَيْدٌ كَعَمْرٍو فِي الطُّولِ — تَشْبِيهٌ بَلِيغٌ","right":"مُرْسَلٌ مُفَصَّلٌ","why":{"en":"The tool and the shared point are both stated, which is the plainest grade, not the strongest.","tr":"Edât da vech-i şebeh de zikredilmiştir; bu en sade derecedir, en kuvvetlisi değil."}}]},"tawkid":{"title":{"ar":"التَّوْكِيد","en":"Emphasis (tawkid)","tr":"Te'kîd"},"level":4,"group":"nahw","explanation":{"en":"Tawkid is a follower that removes doubt about what precedes it, and like every tabi' it copies that word's case. It comes in two kinds. LAFZI tawkid simply repeats the word or phrase: جَاءَ زَيْدٌ زَيْدٌ. MA'NAWI tawkid uses a fixed set of words — نَفْس and عَيْن for a single thing, and كُلّ، جَمِيع، أَجْمَع for the whole of it — each made mudaf to a pronoun agreeing with what it emphasizes: جَاءَ الْقَوْمُ كُلُّهُمْ, رَأَيْتُ الْأَمِيرَ نَفْسَهُ. The point of نَفْس and عَيْن is to deny that a deputy is meant; the point of كُلّ is to deny that only a part is meant.","tr":"Te'kîd, kendinden öncekiyle ilgili şüpheyi gideren bir tâbidir ve her tâbi gibi onun i'rabını kopyalar. İki çeşittir. LAFZÎ te'kîd kelimeyi veya terkibi tekrar eder: جَاءَ زَيْدٌ زَيْدٌ. MA'NEVÎ te'kîd belirli kelimelerle yapılır — bir şeyin kendisi için نَفْس ve عَيْن, tamamı için كُلّ، جَمِيع، أَجْمَع — her biri te'kîd ettiği şeye uyan bir zamire muzâf olur: جَاءَ الْقَوْمُ كُلُّهُمْ, رَأَيْتُ الْأَمِيرَ نَفْسَهُ. نَفْس ve عَيْن'in maksadı, bir vekilin kastedilmediğini bildirmektir; كُلّ'ün maksadı ise yalnız bir kısmın kastedilmediğini bildirmektir."},"plain":{"en":"Removing doubt — by repeating the word, or by adding «himself», «all of them».","tr":"Şüpheyi kaldırmak — kelimeyi tekrarlayarak yahut «kendisi», «hepsi» gibi kelimeler ekleyerek."},"mamul":"tabai","sources":["العوامل (البيركوي) — التوابع","إظهار الأسرار (البيركوي)","الكافية (ابن الحاجب)"],"examples":[{"ar":"جَاءَ الْقَوْمُ كُلُّهُمْ.","gloss":{"en":"The people came, all of them — ma'nawi tawkid, copying the raf' of «the people».","tr":"İnsanlar geldi, hepsi — manevî te'kid, «insanlar»ın ref'ini alır."},"src":null},{"ar":"رَأَيْتُ الْأَمِيرَ نَفْسَهُ.","gloss":{"en":"I saw the commander himself — not a messenger on his behalf; the tawkid follows into nasb.","tr":"Emirin bizzat kendisini gördüm — vekilini değil; te'kid nasba da uyar."},"src":null},{"ar":"جَاءَ زَيْدٌ زَيْدٌ.","gloss":{"en":"Zayd came — Zayd! Lafzi tawkid by plain repetition.","tr":"Zeyd geldi — Zeyd! Lafzın tekrarıyla lafzî te'kid."},"src":null}],"mistakes":[{"wrong":"جاء القومُ كلَّهم","right":"جَاءَ الْقَوْمُ كُلُّهُمْ","why":{"en":"Tawkid is a tabi': it copies the case of what it emphasizes. After a marfu' it is marfu', not mansub.","tr":"Te'kîd bir tâbidir: te'kîd ettiği kelimenin i'rabını alır. Merfûdan sonra merfû olur, mansub değil."}},{"wrong":"رأيتُ الأميرَ نفسٌ","right":"رَأَيْتُ الْأَمِيرَ نَفْسَهُ","why":{"en":"Ma'nawi tawkid must be mudaf to a pronoun matching the emphasized word; without that pronoun it is not tawkid at all.","tr":"Ma'nevî te'kîd, te'kîd edilen kelimeye uyan bir zamire muzâf olmalıdır; o zamir olmadan te'kîd sayılmaz."}},{"wrong":"جاء رجلٌ نفسُهُ","right":"جَاءَ الرَّجُلُ نَفْسُهُ","why":{"en":"What is emphasized is normally definite: emphasizing an indefinite says nothing, since there was no particular thing to be doubted.","tr":"Te'kîd edilen kelime çoğunlukla marifedir: nekreyi te'kîd etmek bir şey ifade etmez, çünkü şüphe edilecek belirli bir şey yoktur."}}]},"thulathi-mujarrad-babs":{"title":{"ar":"أَبْوَابُ الثُّلَاثِيِّ الْمُجَرَّد","en":"The six babs of the bare triliteral","tr":"Sülâsî mücerredin altı bâbı"},"level":2,"group":"sarf","explanation":{"en":"Every bare three-letter verb belongs to one of exactly six babs, and the bab is fixed by ONE thing: the vowel on the middle radical in the past and in the present. That pair is the bab's «sign» (عَلَامَة), and the pattern verb is its name. (1) نَصَرَ يَنْصُرُ — fatha then damma. (2) ضَرَبَ يَضْرِبُ — fatha then kasra. (3) فَتَحَ يَفْتَحُ — fatha then fatha, and this one has a condition: the middle or last radical must be a throat letter (ء ه ع ح غ خ), which is why فَتَحَ and ذَهَبَ qualify. (4) عَلِمَ يَعْلَمُ — kasra then fatha. (5) كَرُمَ يَكْرُمُ — damma then damma, and this bab alone is ALWAYS intransitive; it is the bab of settled qualities, حَسُنَ, كَبُرَ, صَغُرَ. (6) حَسِبَ يَحْسِبُ — kasra then kasra, the rarest. The first four and the sixth are usually transitive and sometimes intransitive. You cannot derive the bab from the letters: قَعَدَ is bab 1 and جَلَسَ is bab 2 though they mean the same thing. The bab is learned with the word, which is why every verb in this app carries its bab on the Conjugation tab.","tr":"Her sülâsî mücerred fiil tam olarak altı bâbdan birine girer ve bâbı TEK bir şey belirler: ayne'l-fiilin mâzideki ve muzârideki harekesi. Bu ikili bâbın «alâmet»idir, vezin fiili de adıdır. (1) نَصَرَ يَنْصُرُ — fetha, sonra damme. (2) ضَرَبَ يَضْرِبُ — fetha, sonra kesre. (3) فَتَحَ يَفْتَحُ — fetha, fetha; bunun bir şartı vardır: ayne'l-fiil yahut lâme'l-fiil hurûf-ı halktan (ء ه ع ح غ خ) olmalıdır; فَتَحَ ve ذَهَبَ bu yüzden bu bâbdandır. (4) عَلِمَ يَعْلَمُ — kesre, sonra fetha. (5) كَرُمَ يَكْرُمُ — damme, damme; yalnız bu bâb DAİMA lâzımdır, yerleşik vasıfların bâbıdır: حَسُنَ، كَبُرَ، صَغُرَ. (6) حَسِبَ يَحْسِبُ — kesre, kesre; en az kullanılanıdır. Beşinci dışındakiler çok kere müteaddî, bazen lâzımdır. Bâb harflerden çıkarılamaz: قَعَدَ birinci, جَلَسَ ikinci bâbdandır, hâlbuki manaları aynıdır. Bâb kelimeyle birlikte öğrenilir; uygulamadaki her fiilin Çekim sekmesinde bâbının yazılı olmasının sebebi budur."},"plain":{"en":"Every plain three-letter verb belongs to one of six families, and the family — not the dictionary — tells you the vowel on its present tense.","tr":"Her sülâsî mücerred fiil altı bâbdan birine girer; muzârisinin harekesini sözlük değil, bâbı söyler."},"sources":["الأمثلة المختلفة","بناء الأفعال","مراح الأرواح","المقصود"],"examples":[{"ar":"نَظَرَ يَنْظُرُ — مِنْ بَابِ نَصَرَ.","gloss":{"en":"«He looked» — bab 1, fatha then damma.","tr":"«Baktı» — birinci bâb, fetha sonra damme."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"جَلَسَ يَجْلِسُ — مِنْ بَابِ ضَرَبَ.","gloss":{"en":"«He sat» — bab 2, fatha then kasra, though قَعَدَ with the same meaning is bab 1.","tr":"«Oturdu» — ikinci bâb, fetha sonra kesre; hâlbuki aynı manadaki قَعَدَ birinci bâbdandır."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"ذَهَبَ يَذْهَبُ — مِنْ بَابِ فَتَحَ.","gloss":{"en":"«He went» — bab 3; the ه is a throat letter, which is what admits it.","tr":"«Gitti» — üçüncü bâb; ه hurûf-ı halktandır, bâba girmesini sağlayan da budur."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"صَغُرَ يَصْغُرُ — مِنْ بَابِ كَرُمَ.","gloss":{"en":"«He became small» — bab 5, always intransitive, always a quality.","tr":"«Küçüldü» — beşinci bâb, daima lâzım, daima bir vasıf."},"src":"wasiyyat-abi-yusuf-L5"}],"mistakes":[{"wrong":"ضَرَبَ يَضْرُبُ","right":"ضَرَبَ يَضْرِبُ","why":{"en":"The bab is not a choice. ضَرَبَ is bab 2 and its present takes kasra; changing the vowel changes the word into one that does not exist.","tr":"Bâb keyfî değildir. ضَرَبَ ikinci bâbdandır, muzârisi kesre alır; hareke değişince kelime var olmayan bir şekle döner."}},{"wrong":"كَرُمَ الرَّجُلُ الضَّيْفَ","right":"أَكْرَمَ الرَّجُلُ الضَّيْفَ","why":{"en":"Bab 5 never takes an object. To make it transitive you must move the verb to bab IV: أَكْرَمَ.","tr":"Beşinci bâb mef'ûl almaz. Müteaddî yapmak için fiili if'âl bâbına nakletmek gerekir: أَكْرَمَ."}},{"wrong":"كَتَبَ يَكْتَبُ","right":"كَتَبَ يَكْتُبُ","why":{"en":"Bab 3's fatha-fatha needs a throat letter in the middle or last radical. ك ت ب has none, so كَتَبَ is bab 1.","tr":"Üçüncü bâbın fetha-fethası için ayn yahut lâmda hurûf-ı halktan bir harf gerekir. ك ت ب'de yoktur, dolayısıyla كَتَبَ birinci bâbdandır."}}]},"tibaq":{"title":{"ar":"الطِّبَاق (المُطَابَقَة)","en":"Tibaq — joining a word to its opposite","tr":"Tıbâk (mutâbakat) — bir lafzı zıddıyla birleştirmek"},"level":5,"group":"balagha","explanation":{"en":"Badi' is the third of the three sciences of balagha: after the sense is sound (ma'ani) and the image is clear (bayan), badi' asks what makes the wording beautiful. Its embellishments are of two kinds — of meaning (مَعْنَوِيَّة) and of wording (لَفْظِيَّة) — and the first of the meaning ones is tibaq: bringing two contrary meanings together in a single passage. It is also called المُطَابَقَة and التَّضَادّ. The book sorts it twice over. First by what is paired: two nouns («وَتَحْسَبُهُمْ أَيْقَاظًا وَهُمْ رُقُودٌ»), two verbs («يُحْيِي وَيُمِيتُ»), two particles («لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ»), or two words of different kinds — a noun against a verb, «أَوَمَنْ كَانَ مَيْتًا فَأَحْيَيْنَاهُ». Second by how the opposition is made: طِبَاقُ الإِيجَابِ when both sides are affirmed, and طِبَاقُ السَّلْبِ when one and the same word appears once affirmed and once negated — «وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ · يَعْلَمُونَ ظَاهِرًا مِنَ الْحَيَاةِ الدُّنْيَا». Near-opposites are admitted too. When the two are not strictly contrary but the wording makes them look so — laughter said of grey hair set against weeping — the tradition calls it إِيهَامُ التَّضَادِّ and still counts it under tibaq. Keep one boundary firm: tibaq sets one thing against one thing. The moment a whole set is answered by a whole set, in order, it is muqabala.","tr":"Bedî', belâgatin üç ilminden üçüncüsüdür: mana sağlam (meânî), tasvir açık (beyân) olduktan sonra bedî', lafzı güzelleştiren vecihleri sorar. Bu vecihler iki kısımdır — muhassinât-ı ma'neviyye ve lafziyye — ma'nevî olanların ilki tıbâktır: bir sözde birbirine zıt iki manayı bir araya getirmek. Buna mutâbakat ve tezâd da denir. Kitap bunu iki yönden taksim eder. Önce neyin eşleştiğine göre: iki isim («وَتَحْسَبُهُمْ أَيْقَاظًا وَهُمْ رُقُودٌ»), iki fiil («يُحْيِي وَيُمِيتُ»), iki harf («لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ»), yahut iki ayrı nevden iki lafız — isim karşısında fiil: «أَوَمَنْ كَانَ مَيْتًا فَأَحْيَيْنَاهُ». Sonra zıtlığın nasıl kurulduğuna göre: iki taraf da müsbet ise tıbâku'l-îcâb; aynı lafız bir yerde müsbet bir yerde menfî gelirse tıbâku's-selb — «وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ · يَعْلَمُونَ ظَاهِرًا مِنَ الْحَيَاةِ الدُّنْيَا». Tam zıt olmayanlar da kabul edilir: hakikatte zıt olmadığı hâlde lafız onları zıt gösteriyorsa — ihtiyarlığın «gülmesi» ağlamanın karşısına konulduğu gibi — buna îhâmü't-tezâd denir ve yine tıbâktan sayılır. Bir sınırı sabit tut: tıbâk bir şeyi bir şeyin karşısına koyar. Bir küme, sırasıyla başka bir kümeyle karşılandığı anda o artık mukâbeledir."},"plain":{"en":"Putting a word next to its opposite: near and far, secret and open.","tr":"Bir kelimeyi zıddının yanına koymak: yakın ve uzak, gizli ve açık."},"sources":["تلخيص المفتاح (القزويني) — علم البديع، المحسنات المعنوية","مختصر السعد"],"examples":[{"ar":"الْفِقْهُ مَعْرِفَةُ النَّفْسِ مَا لَهَا وَمَا عَلَيْهَا عَمَلًا.","gloss":{"en":"Tibaq between two particles — لَهَا against عَلَيْهَا — exactly the harf case the Talkhis cites. The definition of fiqh is built on it: what counts for you and what counts against you.","tr":"İki harf arasında tıbâk — لَهَا karşısında عَلَيْهَا — Telhîs'in zikrettiği harf misalinin aynısı. Fıkhın tarifi bunun üzerine kurulmuştur: lehine olan ve aleyhine olan."},"src":"mukhtasar-al-manar"},{"ar":"بَلْ تَقَرَّبْ إِلَيْهِ فَقَطْ وَتَبَاعَدْ عَنْ حَاشِيَتِهِ.","gloss":{"en":"Two verbs: تَقَرَّبْ against تَبَاعَدْ. Draw near, keep away — the advice is the opposition itself.","tr":"İki fiil: تَقَرَّبْ karşısında تَبَاعَدْ. Yaklaş, uzak dur — nasihatin kendisi bu zıtlıktır."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"وَكُنْ لِلَّهِ فِي سِرِّكَ كَمَا أَنْتَ لَهُ فِي عَلَانِيَتِكَ.","gloss":{"en":"Two nouns: سِرّ against عَلَانِيَة, the hidden life against the public one.","tr":"İki isim: سِرّ karşısında عَلَانِيَة, gizli hâl karşısında açık hâl."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"فَإِنَّ السُّلْطَانَ لَا يَرَى لِأَحَدٍ مَا يَرَى لِنَفْسِهِ.","gloss":{"en":"Tibaq al-salb: one and the same verb يَرَى, first negated and then affirmed.","tr":"Tıbâku's-selb: aynı fiil يَرَى, önce menfî sonra müsbet gelmiştir."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"وَالْمُحْدَثُ هُوَ الْمُخْرَجُ مِنَ الْعَدَمِ إِلَى الْوُجُودِ.","gloss":{"en":"الْعَدَم against الْوُجُود — and the two prepositions مِنْ / إِلَى carry the same opposition a second time.","tr":"الْعَدَم karşısında الْوُجُود — ve مِنْ / إِلَى harfleri aynı zıtlığı ikinci defa taşır."},"src":"aqaid-ahl-al-sunna"},{"ar":"لِأَنَّهُ يُصَيِّرُ الْقَلِيلَ مِنَ الْأَفْعَالِ كَثِيرًا.","gloss":{"en":"الْقَلِيل against كَثِيرًا, the two objects of a verb of transformation — the point of tasrif stated as an opposition.","tr":"الْقَلِيل karşısında كَثِيرًا; tasyîr fiilinin iki mefûlü — sarfın gayesi bir zıtlıkla ifade edilmiş."},"src":"min-muqaddimat-al-maqsud"},{"ar":"مَنْ لَمْ يَرْحَمْ صَغِيرَنَا وَلَمْ يُوَقِّرْ كَبِيرَنَا فَلَيْسَ مِنَّا.","gloss":{"en":"صَغِير against كَبِير. Note that this is tibaq, not muqabala: each pair is one word against one word, and the two clauses are not counterparts but a single condition repeated.","tr":"صَغِير karşısında كَبِير. Bunun mukâbele değil tıbâk olduğuna dikkat et: eşleşme bir lafza karşı bir lafızdır; iki cümle birbirinin mukâbili değil, tek şartın tekrarıdır."},"src":"wasiyyat-abi-yusuf-L5"}],"mistakes":[{"wrong":"«مَنْ أَطَاعَنِي دَخَلَ الْجَنَّةَ وَمَنْ عَصَانِي فَقَدْ أَبَى» طِبَاقٌ","right":"مُقَابَلَةٌ، لِأَنَّ الْمُقَابَلَ جُمْلَتَانِ لَا لَفْظَانِ","why":{"en":"Two meanings are set out and then two counterparts follow them in order — obeying and entering, disobeying and refusing. Tibaq is one word against one word; a set answered by a set is muqabala.","tr":"İki mana zikredilip ardından sırasıyla iki mukâbili gelmiştir — itaat ve girmek, isyan ve imtinâ. Tıbâk bir lafza karşı bir lafızdır; bir kümeye karşı küme gelirse o mukâbeledir."}},{"wrong":"«الْبَيْعُ مُبَادَلَةُ مَالٍ بِمَالٍ» طِبَاقٌ","right":"تَكْرَارٌ، وَلَا طِبَاقَ فِيهِ","why":{"en":"The same word repeated is not its own opposite. Tibaq needs two contrary meanings, not one meaning said twice.","tr":"Aynı lafzın tekrarı kendi zıddı değildir. Tıbâk için birbirine zıt iki mana gerekir; bir mananın iki kere söylenmesi yetmez."}},{"wrong":"طِبَاقُ السَّلْبِ يَكُونُ بَيْنَ لَفْظَيْنِ مُخْتَلِفَيْنِ أَحَدُهُمَا مَنْفِيٌّ","right":"طِبَاقُ السَّلْبِ يَكُونُ بِاللَّفْظِ الْوَاحِدِ: مُثْبَتًا وَمَنْفِيًّا","why":{"en":"«لَا تَخْشَوُا النَّاسَ وَاخْشَوْنِ» is tibaq al-salb because خشي is the same verb twice. A negated word set against a different word is ordinary tibaq al-ijab, if it is tibaq at all.","tr":"«لَا تَخْشَوُا النَّاسَ وَاخْشَوْنِ» tıbâku's-selbdir; çünkü خشي aynı fiildir. Menfî bir lafzın başka bir lafızla karşılanması ise — tıbâk sayılırsa — âdî tıbâku'l-îcâbdır."}}]},"vocative-munada":{"title":{"ar":"النِّدَاء وَالْمُنَادَى","en":"The vocative","tr":"Nidâ ve münâdâ"},"level":2,"group":"nahw","explanation":{"en":"After يَا, a single proper name (مفرد علم) is fixed on damma with no tanwin: يَا يُوسُفُ — grammatically \"in the position of nasb\", because the vocative is treated as the object of an implied verb. A mudaf munada, by contrast, takes real nasb: يَا عَبْدَ اللهِ. Nouns with الـ cannot follow يا directly; use أَيُّهَا.","tr":"يَا'dan sonra tek kelimelik özel isim (müfred alem) tenvinsiz ötre üzerine mebnidir: يَا يُوسُفُ — mahallen mansubdur, çünkü münada gizli bir fiilin (أَدْعُو) mef'ulü sayılır. Muzaf münada gerçek nasb alır: يَا عَبْدَ اللهِ. الـ'lı isimler يا'dan sonra doğrudan gelmez; أَيُّهَا kullanılır."},"plain":{"en":"Calling someone: «O Yusuf!»","tr":"Birine seslenmek: «Ey Yûsuf!»"},"amil":"يَا مِنْ عَوَامِلِ النَّصْبِ فِي الْمَعْنَى — the munada counts as the object of an omitted verb (أَدْعُو)","sources":["الكافية (ابن الحاجب) — المنادى","الإظهار (البركوي) — المنادى"],"examples":[{"ar":"يَا يُوسُفُ، اسْمَعْ وَصِيَّتِي.","gloss":{"en":"O Yusuf, listen to my testament.","tr":"Ey Yusuf, vasiyetimi dinle."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"يَا عَبْدَ اللهِ، تَعَالَ.","gloss":{"en":"O Abdullah (mudaf → nasb), come.","tr":"Ey Abdullah (muzâf → nasb), gel."},"src":null},{"ar":"يَا أَيُّهَا الطَّالِبُ.","gloss":{"en":"O student — الـ nouns need أيُّها.","tr":"Ey talebe — ال'lı isimler أيُّها ister."},"src":null}],"mistakes":[{"wrong":"يا يوسفَ","right":"يا يوسفُ","why":{"en":"A single proper name after يا is fixed on damma — learners wrongly give it fatha because it is \"in the position of nasb\".","tr":"يا'dan sonra müfred alem ötre üzerine mebnidir — 'nasb mahallinde' diye fetha vermek yanlıştır."}},{"wrong":"يا الطالبُ","right":"يا أيُّها الطالبُ","why":{"en":"يا never sits directly before الـ — insert أيُّها (masc.) / أيَّتُها (fem.).","tr":"يا, الـ'dan önce doğrudan gelmez — أيُّها (eril) / أيَّتُها (dişil) araya girer."}}]},"zanna-wa-akhawatuha":{"title":{"ar":"ظَنَّ وَأَخَوَاتُهَا (أَفْعَالُ الْقُلُوبِ)","en":"The verbs of the heart: ظَنَّ and its sisters","tr":"Ef'âl-i kulûb (ظَنَّ ve kardeşleri)"},"level":5,"group":"awamil","explanation":{"en":"The أَفْعَالُ الْقُلُوبِ are named for acting through the heart, not the limbs: ظَنَّ، حَسِبَ، خَالَ، زَعَمَ («suppose»), عَلِمَ، رَأَى، وَجَدَ («know for certain»). They enter on a complete nominal sentence and turn BOTH its parts into objects: ظَنَنْتُ زَيْدًا عَالِمًا — mubteda and khabar have become first and second maf'ul, and neither may be dropped alone: mention one and the other becomes obligatory. Two licences soften their rule. الإِلْغَاء (annulment of the government, in word and meaning) is allowed when the verb sits in the middle or at the end: زَيْدٌ ظَنَنْتُ عَالِمٌ. التَّعْلِيق (suspension — the government is blocked in wording only) is forced when what follows has the right to head its own clause: an interrogative, a negation, or the lam of ibtida — عَلِمْتُ أَزَيْدٌ عِنْدَكَ أَمْ عَمْرٌو. The same doubling of objects, without the licences, belongs to the giving-and-making verbs (أَعْطَى, جَعَلَ), and أَعْلَمَ and أَرَى go on to three objects — but ظَنَّ's family is where the madrasah learns the machinery.","tr":"أَفْعَالُ الْقُلُوبِ adını, âzâ ile değil kalp ile işlenmelerinden alır: ظَنَّ، حَسِبَ، خَالَ، زَعَمَ («sanmak»), عَلِمَ، رَأَى، وَجَدَ («kesin bilmek»). Tam bir isim cümlesinin üzerine girer ve İKİ cüzünü birden mef'ûl yaparlar: ظَنَنْتُ زَيْدًا عَالِمًا — mübtedâ ile haber, birinci ve ikinci mef'ûl olmuştur; biri zikredilince öbürünün zikri vâcibtir. İki ruhsat kaidelerini yumuşatır. الإِلْغَاء (amelin hem lafzen hem manen iptali) fiil ortada yahut sonda ise câizdir: زَيْدٌ ظَنَنْتُ عَالِمٌ. التَّعْلِيق (askıya alma — amel yalnız lafzen kesilir) ise kendinden sonrası sadr hakkı taşıyorsa vâcibtir: istifham, nefiy yahut ibtidâ lâmı — عَلِمْتُ أَزَيْدٌ عِنْدَكَ أَمْ عَمْرٌو. Aynı iki-mef'ûllülük, ruhsatlar olmaksızın verme-kılma fiillerinde de vardır (أَعْطَى, جَعَلَ); أَعْلَمَ ve أَرَى üç mef'ûle kadar çıkar — fakat medrese bu mekanizmayı ظَنَّ ailesinde öğrenir."},"plain":{"en":"Verbs of thinking and knowing — ظَنَّ «suppose», عَلِمَ «know» — swallow a whole sentence: «Zayd is learned» becomes two objects, both mansub.","tr":"Zannetme ve bilme fiilleri — ظَنَّ «sanmak», عَلِمَ «bilmek» — bir cümleyi bütünüyle yutar: «Zeyd âlimdir» iki mef'ûle döner, ikisi de mensub."},"mamul":"mansub","sources":["الكافية (ابن الحاجب) — أفعال القلوب","العوامل (البيركوي)"],"examples":[{"ar":"ظَنَنْتُ زَيْدًا عَالِمًا.","gloss":{"en":"I supposed Zayd to be learned — the old mubteda and khabar are now two mansub objects.","tr":"Zeyd'i âlim sandım — eski mübtedâ ve haber artık iki mensub mef'ûldür."},"src":null},{"ar":"عَلِمْتُ أَزَيْدٌ عِنْدَكَ أَمْ عَمْرٌو.","gloss":{"en":"I know — is it Zayd with you, or Amr? The interrogative suspends the government (ta'liq): everything after it stays raf'.","tr":"Bilirim — yanındaki Zeyd mi, Amr mı? İstifham ameli askıya alır (ta'lîk): sonrası merfû kalır."},"src":null}],"mistakes":[{"wrong":"ظَنَنْتُ زَيْدًا","right":"ظَنَنْتُ زَيْدًا عَالِمًا","why":{"en":"The heart-verbs take their two objects as a pair: mentioning only one of them is not allowed, because together they carry the judgement that was the original sentence.","tr":"Kalp fiilleri iki mef'ûlünü çift olarak alır: yalnız birini zikretmek câiz değildir; hüküm — yani asıl cümle — ikisinin üzerinde birden durur."}},{"wrong":"ظَنَنْتُ زَيْدٌ عَالِمٌ","right":"ظَنَنْتُ زَيْدًا عَالِمًا","why":{"en":"With the verb at the HEAD, ilgha is not available — the government must run, and both objects take nasb.","tr":"Fiil BAŞTA iken ilğâ ruhsatı yoktur — amel işler, iki mef'ûl de nasb olur."}}]}};
const REF_GROUPS = [{"id":"sarf","ar":"الصَّرْف","label":{"en":"Morphology — after Emsile & Bina","tr":"Sarf — Emsile ve Binâ'ya göre"}},{"id":"nahw","ar":"النَّحْو","label":{"en":"Syntax — after al-Kafiya & Qatr al-Nada","tr":"Nahiv — Kâfiye ve Katru'n-Nedâ'ya göre"}},{"id":"awamil","ar":"الْعَوَامِل","label":{"en":"Governors — after Birgivi's Awamil","tr":"Âmiller — Birgivî'nin Avâmil'ine göre"}},{"id":"balagha","ar":"الْبَلَاغَة","label":{"en":"Rhetoric — after al-Qazwini's Talkhis","tr":"Belâgat — Kazvînî'nin Telhîs'ine göre"}}];

// Locking every premium story forever shows a Lite reader the same wall every
// day, and there is nothing to come back for. So a couple of them open up each
// week instead — the whole story, not a longer preview.
//
// The window is DERIVED from the date, never stored: every device shows the
// same stories in the same week with no server and no sync, and a reader who
// clears storage does not get a fresh set. It slides forward by its own width
// each week, so it walks the premium catalogue and every story comes round in
// turn rather than the same two recurring.
const FREE_ROTATION = 2;
const DAY_MS = 86400000;
const WEEK_MS = 7 * DAY_MS;

// at local midnight rather than at whatever hour UTC midnight falls on here.
function localMidnight(now){
  const d = now || new Date();
  return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
}
function weekIndex(now){
  return Math.floor((localMidnight(now) - ROTATION_EPOCH) / WEEK_MS);
}

// library must not reshuffle which stories are free this week. STORIES is a
// build-time constant, so this is computed once.
let _premiumIds = null;
function premiumIds(){
  if (!_premiumIds) _premiumIds = STORIES.filter(s => s.access === "premium").map(s => s.id).sort();

}

// through the `now` argument, so a flat cache would both break it and survive
// the local-midnight rollover it is supposed to track.
let _rotWeek = null, _rotSet = null;
function rotatingFree(now){
  const w = weekIndex(now);
  if (w === _rotWeek) return _rotSet;
  const ids = premiumIds();
  const out = new Set();
  if (ids.length) {
    const n = Math.min(FREE_ROTATION, ids.length);
    const start = ((w * n) % ids.length + ids.length) % ids.length; // w is negative before the epoch
    for (let k = 0; k < n; k++) out.add(ids[(start + k) % ids.length]);

  // Both operands are exact UTC midnights and a week is exactly seven days,

  return (ROTATION_EPOCH + (weekIndex(now) + 1) * WEEK_MS - localMidnight(now)) / DAY_MS;

      if (tok.quoteBefore) line.appendChild(document.createTextNode(tok.quoteBefore));
      const w = document.createElement("span");
      w.className = "word"; w.tabIndex = 0; w.setAttribute("role", "button");
      w.dataset.ti = ti; // the playback highlight maps a character offset back to this
      // A token inside an idiom is tinted so the span reads as one unit.
      if (phraseAt(sen, ti)) w.classList.add("in-phrase");
      const entry = GLOSSARY[tok.lex];
      if (state.mode === "medium") {
        // Interlinear: the word above, its meaning directly beneath it, so the
        // reader assembles the sentence themselves instead of reading a ready
        // translation. Proper nouns are left bare — their gloss is the name.
        w.classList.add("stacked");
        const ar = document.createElement("span");
        ar.className = "w-ar"; ar.textContent = tok.s[state.layer];
        w.appendChild(ar);
        const gl = document.createElement("span");
        gl.className = "w-gl";
        gl.textContent = (entry && entry.gloss && entry.level > 0) ? shortGloss(T(entry.gloss)) : "";
        w.appendChild(gl);
      } else {
        w.textContent = tok.s[state.layer];
      }
      if (entry && entry.level > 0) w.dataset.lvl = levelBucket(entry.level);
      w.dataset.lex = tok.lex;
      if (deckLex.has(tok.lex)) w.classList.add("in-deck");
      w.addEventListener("click", () => { markRead(sen.id); openWord(tok, w, null, {sen, ti}); });
      w.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); markRead(sen.id); openWord(tok, w, null, {sen, ti}); } });
      line.appendChild(w);
      if (tok.punctAfter === "•") {
        // A hemistich break: the bayt's two halves part around an ornament,
        // and the whole sentence takes the verse layout.
        const hemi = document.createElement("span");
        hemi.className = "hemi"; hemi.setAttribute("aria-hidden", "true");
        hemi.textContent = "✽";
        line.appendChild(hemi);
        sec.classList.add("verse");
      } else if (tok.punctAfter) line.appendChild(document.createTextNode(tok.punctAfter));
      if (tok.quoteAfter) line.appendChild(document.createTextNode(tok.quoteAfter));
      if (ti < sen.tokens.length - 1) line.appendChild(document.createTextNode(" "));
    });
    sec.appendChild(line);
    SENTENCE_FLAT.push({ sen, sec });
    const tools = document.createElement("div");
    tools.className = "sent-tools";
    const play = document.createElement("button");
    play.className = "play"; play.textContent = "▶"; play.title = "Listen";
    play.setAttribute("aria-label", "Listen to sentence " + (si + 1));
    play.addEventListener("click", () => {
      if (playAllActive) stopPlayAll(); // a manual tap always wins over continuous play
      markRead(sen.id); speak(sen, sec);
    });
    tools.appendChild(play);
    if (sen.tokens.some(t => t.irab)) {
      const irb = document.createElement("button");
      irb.className = "play irab-btn"; irb.lang = "ar";
      irb.style.width = "auto"; irb.style.padding = "0 .5rem"; irb.style.fontSize = ".85rem";
      irb.textContent = ui().sheetBtn;
      irb.title = ui().sheetTitle;
      irb.setAttribute("aria-label", ui().sheetTitle);
      irb.addEventListener("click", () => { markRead(sen.id); openIrabSheet(sen); });
      tools.appendChild(irb);
    }
    if (state.mode !== "easy") {
      // Being stuck should not force a mode change. One sentence, revealed.
      const peek = document.createElement("button");
      peek.className = "peek";
      peek.textContent = ui().peek;
      peek.addEventListener("click", () => {
        const line = sec.querySelector(".trans");
        line.textContent = T(sen.translation);
        line.hidden = false;
        peek.remove();
      });
      tools.appendChild(peek);
    }
    const tr = document.createElement("span");
    tr.className = "trans";
    tr.textContent = state.mode === "easy" ? T(sen.translation) : "";
    tr.hidden = state.mode !== "easy";
    tools.appendChild(tr);
    sec.appendChild(tools);
    storyEl.appendChild(sec);
  });
  });
  if (storyLocked(CUR)) {
    const up = document.createElement("div");
    up.className = "upsell";
    up.innerHTML = `<div class="ut">${ui().upsellTitle}</div><p>${ui().upsellBody}</p>
      <button id="unlockPremium" class="unlock">${ui().upsellBtn}</button>`;
    up.querySelector("#unlockPremium").addEventListener("click", () => {
      setPremium(true);
      openStory(CUR); // re-render the full story and refresh the header chips
    });
    storyEl.appendChild(up);
  }
  // Chapter pills, built from the heads that actually RENDERED — a locked
  // preview may cut chapters off, and a pill must never point at nothing.
  const heads = storyEl.querySelectorAll(".chapter-head");
  if (heads.length > 1) {
    const nav = document.createElement("div");
    nav.className = "ch-nav";
    heads.forEach(h => {
      const b = document.createElement("button");
      b.className = "ch-pill";
      b.textContent = ui().chapter + " " + h.dataset.ch;
      b.addEventListener("click", () => h.scrollIntoView({ block: "start" }));
      nav.appendChild(b);
    });
    storyEl.insertBefore(nav, storyEl.firstChild);
  }
}


// ---------- library / story shell ----------
function accessLabel(st){
  if (st.access === "user-upload") return ui().accessUpload;
  if (st.access === "free") return ui().accessFree;
  if (st.access === "premium") return ui().accessPremium;
  return st.access;
}
// ---------- recency ----------
// The sharpest complaint about the app this one is modelled on is that new
// content is invisible: a reader cannot tell what arrived since they last
// looked, so they stop looking. `published` is authored in the manifest (the
// day a story entered the library, not the day the text was written), and the
// library both badges and sorts on it.
const NEW_FOR_DAYS = 14;
// Both sides of the subtraction in daysSincePublished have to use ONE
// convention: a civil date rendered as a UTC instant. Date.parse("…T00:00:00")
// returns *local* midnight, which mixed against localMidnight()'s Date.UTC made
// a story published today read as −1 days old anywhere west of UTC — so the NEW
// badge never appeared on the day a story shipped for half the world.
function publishedMs(st){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(st.published || "");
  if (!m) return null;
  return Date.UTC(+m[1], +m[2] - 1, +m[3]);
}
function daysSincePublished(st){
  const t = publishedMs(st);
  if (t === null) return null;
  return Math.floor((localMidnight() - t) / DAY_MS);
}
function isNewStory(st){
  const d = daysSincePublished(st);
  return d !== null && d >= 0 && d < NEW_FOR_DAYS;
}
// Both orders are real sorts. "By level" used to be the identity, which quietly
// meant *directory-name* order — the button was labelled for something it did
// not do. Undated stories sort last under "Newest": null is treated as older
// than any real date rather than as the epoch, so it cannot outrank a story.
const LIB_SORTS = {
  level: (a, b) => a.level - b.level || a.id.localeCompare(b.id),
  new: (a, b) => {
    const x = publishedMs(a), y = publishedMs(b);
    if (x === null) return y === null ? a.id.localeCompare(b.id) : 1;
    if (y === null) return -1;
    return y - x || a.id.localeCompare(b.id);   // same-day releases keep a stable order
  },
  foryou: (a, b) => forYouRank(a) - forYouRank(b) || LIB_SORTS.new(a, b),
};
// "For you" is distance from the reader's own level, with easier breaking the
// tie: at-level, one easier, one harder, two easier, two harder… A story just
// above the reader is still closer to useful than one far below, which is why
// the shelves interleave instead of exhausting everything easier first.
// Within a shelf, newest first.
function forYouRank(st){
  const my = state.myLevel || 1;   // a cleared level degrades to the beginner shelf, not a crash
  return st.level === my ? 0 : st.level < my ? 2 * (my - st.level) : 2 * (st.level - my) + 1;
}
function storiesSorted(){
  return STORIES.slice().sort(LIB_SORTS[state.libSort] || LIB_SORTS.level);
}
function setLibSort(v){
  // "For you" before a level is stored is a question, not a sort.
  if (v === "foryou" && !state.myLevel) { openLevelPicker(); return; }
  state.libSort = v;
  localStorage.setItem("qissa-libsort", v);
  renderLibrary();
}
function storyStats(st){
  let total = 0;
  st.chapters.forEach(c => total += c.sentences.length);
  const read = Object.keys(state.progress[st.id] || {}).length;
  return {total, read: Math.min(read, total)};
}
// Words this story would add to the deck: unique token lexes with a teachable
// level (proper nouns are level 0) that are not already saved. The library
// shows it so "what do I read next" can be answered by vocabulary payoff, not
// only by level. Segments are not counted — the reader meets the whole token.
function storyNewWords(st, have){
  const seen = new Set();
  st.chapters.forEach(ch => ch.sentences.forEach(sen => sen.tokens.forEach(tok => {
    const e = st.glossary[tok.lex];
    if (e && e.level >= 1 && !have.has(tok.lex)) seen.add(tok.lex);
  })));
  return seen.size;
}
// A quiet toast for the moments worth marking — completion, never nagging.
let toastTimer = null;
function showToast(msg){
  let t = document.getElementById("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  // Force a reflow so back-to-back toasts restart the slide.
  void t.offsetHeight;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}
function markRead(senId){
  if (!CUR) return;
  const prog = state.progress[CUR.id] || (state.progress[CUR.id] = {});
  if (!prog[senId]) {
    prog[senId] = 1;
    localStorage.setItem("qissa-progress", JSON.stringify(state.progress));
    countActivity("read");
    // The completion moment: exactly once, on the read that finishes the story.
    const st = storyStats(CUR);
    if (st.total && st.read === st.total) showToast(ui().storyDone);
  }
}
function setHeader(titleAr, sub, chipsHtml){
  document.getElementById("storyTitle").textContent = titleAr;
  document.getElementById("storySub").textContent = sub;
  document.getElementById("metaRow").innerHTML = chipsHtml;
  // The open story's level tints the hero, same scale as the shelf's covers.
  const app = document.querySelector("header.app");
  if (CUR) app.dataset.lvlc = Math.min(4, Math.max(1, CUR.level));
  else delete app.dataset.lvlc;
}
function renderLibrary(){
  stopPlayAll();
  CUR = null; GLOSSARY = {}; MORPH = {}; CHAPTERS = [];
  document.body.classList.add("lib-mode");
  document.getElementById("backLib").hidden = true;
  setHeader("\u0642\u0650\u0635\u0651\u064e\u0629", ui().libSub,
    `<span class="chip level">${STORIES.length} ${ui().stories}</span>` +
    (state.premium ? `<button class="chip sib" id="premiumReset">${ui().premiumActive}</button>`
      : (premiumIds().length ? `<span class="chip freeweek" title="${escapeAttr(ui().rotationNote)}">${
          ui().rotationChip.replace("{n}", Math.min(FREE_ROTATION, premiumIds().length))
                           .replace("{d}", daysLeftInRotation())}</span>` : "")));
  const pr = document.getElementById("premiumReset");
  if (pr) pr.addEventListener("click", () => { setPremium(false); renderLibrary(); });
  storyEl.innerHTML = "";
  // The shelf remembers the reader: the last story they opened, resumable in
  // one tap, as long as it is unfinished. A finished story retires the card —
  // its ✓ chip records the achievement and the sorts suggest what is next.
  const lastSt = continueStory();
  if (lastSt) {
    const { total, read } = storyStats(lastSt);
    const hero = document.createElement("button");
    hero.className = "continue-card";
    hero.dataset.storyId = lastSt.id;
    hero.innerHTML = `<span class="cc-lbl">${ui().continueReading}</span>
      <span class="cc-title" lang="ar">${lastSt.title.ar}</span>

      <div class="progress"><div style="width:${total ? Math.round(100 * read / total) : 0}%"></div></div>`;
    hero.addEventListener("click", () => openStory(lastSt, true));
    storyEl.appendChild(hero);
  }
  // Cards waiting for review are surfaced where the reader already is, instead
  // of hoping they think to open the deck.
  const due = dueCards().length;
  if (due) {
    const nudge = document.createElement("button");
    nudge.className = "review-nudge";
    nudge.textContent = "\u{1F514} " + ui().reviewNudge.replace("{n}", due);
    nudge.addEventListener("click", openDeck);
    storyEl.appendChild(nudge);
  }
  const sortBar = document.createElement("div");
  sortBar.className = "lib-sort";
  const fresh = STORIES.filter(isNewStory).length;
  sortBar.innerHTML = `<span class="ls-lbl">${ui().sortBy}</span>
    <div class="seg" role="group" aria-label="${escapeAttr(ui().sortBy)}">
      <button data-sort="foryou" class="${state.libSort === "foryou" ? "on" : ""}">${ui().sortForYou}</button>
      <button data-sort="level" class="${state.libSort === "level" ? "on" : ""}">${ui().sortLevel}</button>
      <button data-sort="new" class="${state.libSort === "new" ? "on" : ""}">${ui().sortNewest}</button>
    </div>
    ${state.myLevel ? `<button class="chip sib" id="myLevelChip" title="${escapeAttr(ui().yourLevelHint)}">${
      ui().yourLevel.replace("{n}", state.myLevel)}</button>` : ""}
    ${fresh ? `<span class="chip newchip">${ui().newCount.replace("{n}", fresh).replace("{d}", NEW_FOR_DAYS)}</span>` : ""}`;
  sortBar.querySelectorAll("[data-sort]").forEach(b =>
    b.addEventListener("click", () => setLibSort(b.dataset.sort)));
  const mlc = sortBar.querySelector("#myLevelChip");
  if (mlc) mlc.addEventListener("click", () => openLevelPicker());
  storyEl.appendChild(sortBar);
  const have = new Set(state.deck.filter(d => d.type === "word").map(d => d.lex));
  storiesSorted().forEach(st => {
    const {total, read} = storyStats(st);
    const nw = storyNewWords(st, have);
    const card = document.createElement("button");
    card.className = "lib-card";
    card.dataset.storyId = st.id; // the cards reorder; identity does not
    // The level's colour as the card's spine — same scale the underlines use;
    // L5/L6 share the top bucket, as levelBucket does for vocabulary.
    card.dataset.lvlc = Math.min(4, Math.max(1, st.level));
    card.innerHTML = `<div class="t" lang="ar">${st.title.ar}</div>
      <div class="s">${T(st.subtitle) || T(st.title) || ""}</div>
      <div class="meta-row">
        ${isNewStory(st) ? `<span class="chip newchip">${ui().newBadge}</span>` : ""}
        <span class="chip level">${ui().level} ${st.level} \u00b7 ${levelName(st)}</span>
        <span class="chip">${st.chapters.length} ${ui().chaptersWord}</span>
        <span class="chip">${accessLabel(st)}</span>
        ${isFreeThisWeek(st) ? `<span class="chip freeweek">${ui().freeWeek}</span>` : ""}
        ${total && read === total ? `<span class="chip done">✓ ${ui().finishedLbl}</span>`
          : `<span class="chip">${read}/${total} ${ui().readLbl}</span>`}
        ${nw ? `<span class="chip newwords">${ui().newWordsChip.replace("{n}", nw)}</span>` : ""}
      </div>
      <div class="progress"><div style="width:${total ? Math.round(100 * read / total) : 0}%"></div></div>`;
    card.addEventListener("click", () => openStory(st));
    storyEl.appendChild(card);
  });
  closeSheet();
}
// ---------- first-run level picker ----------
// The levels on offer come from the shelf itself, not a hardcoded list: a
// library that has no Master story asks no Master question.
function levelChoices(){
  const seen = new Map();
  STORIES.forEach(st => { if (!seen.has(st.level)) seen.set(st.level, st.levelName || ""); });
  return [...seen.entries()].sort((a, b) => a[0] - b[0]);
}
function openLevelPicker(){
  const lvls = levelChoices();
  const lo = lvls[0][0], hi = lvls[lvls.length - 1][0];
  sheetInner.innerHTML = `
    <h3 class="welcome-h">${ui().welcomeTitle}</h3>
    <p class="ref-intro">${ui().welcomeBody.replace("{a}", lo).replace("{b}", hi)}</p>
    <div class="level-pick">
      ${lvls.map(([lv, en]) => `<button class="btn ${state.myLevel === lv ? "saved" : ""}" data-pick-level="${lv}">
        ${ui().level} ${lv} · ${levelLabel(en)}</button>`).join("")}
    </div>

  sheetInner.querySelectorAll("[data-pick-level]").forEach(b =>
    b.addEventListener("click", () => setMyLevel(parseInt(b.dataset.pickLevel, 10))));

}
function setMyLevel(lv){
  state.myLevel = lv;

// ---------- the story's word list ----------
// The lesson vocabulary page every serious reader app has: all teachable words
// of the open story, counted once, easiest first, each saveable to the deck
// without hunting its token in the text. The list reads from GLOSSARY live and
// stores nothing.
function openVocab(){
  if (!CUR) return;
  const seen = new Map();
  CHAPTERS.forEach(ch => ch.sentences.forEach(sen => sen.tokens.forEach(tok => {
    const e = GLOSSARY[tok.lex];
    if (e && e.level >= 1 && !seen.has(tok.lex)) seen.set(tok.lex, tok);
  })));
  const rows = [...seen.keys()].sort((a, b) =>
    GLOSSARY[a].level - GLOSSARY[b].level || GLOSSARY[a].lemma.localeCompare(GLOSSARY[b].lemma));
  sheetInner.innerHTML = `
    <h3 class="welcome-h">${ui().vocabTitle}</h3>
    <p class="ref-intro">${ui().vocabHint}</p>
    <ul class="deck-list vocab-list">` + rows.map(lex => {
      const e = GLOSSARY[lex], on = cardSaved("word:" + lex);
      return `<li><span class="w" lang="ar">${e.lemma}</span>
        <span class="g">${T(e.gloss)}</span>
        <span class="chip level">L${e.level}</span>
        <button data-vocab-save="${escapeAttr(lex)}" class="${on ? "saved" : ""}">${
          on ? ui().saved : ui().save}</button></li>`;
    }).join("") + `</ul>`;
  sheetInner.querySelectorAll("[data-vocab-save]").forEach(b =>
    b.addEventListener("click", () => {
      const lex = b.dataset.vocabSave;
      if (toggleSave(seen.get(lex)) === false) { b.textContent = ui().deckFull; return; }
      const on = cardSaved("word:" + lex);
      b.textContent = on ? ui().saved : ui().save;
      b.classList.toggle("saved", on);
    }));
  showSheet();
}
// sen.id -> {src, span} for every sentence that has BOTH a chapter audio file
// and its own [startMs, endMs]. One without the other plays nothing real —
// half-wired narration must fall back to TTS, never to silence.
let SEN_AUDIO = new Map();
function buildSenAudio(){
  SEN_AUDIO = new Map();
  CHAPTERS.forEach(ch => {
    if (!ch.audioFile) return;
    ch.sentences.forEach(sen => {
      if (sen.audio) SEN_AUDIO.set(sen.id, { src: ch.audioFile, span: sen.audio });
    });
  });
}
// The story a returning reader is offered to pick back up: the last one they
// opened, as long as it exists and is not finished.
function continueStory(){
  const st = STORIES.find(s => s.id === state.lastRead);
  if (!st) return null;
  const { total, read } = storyStats(st);
  return read < total ? st : null;
}
// Land the returning reader on the first sentence they have not read, not at
// the top of a text they have already worked through.
function resumeScroll(){
  const prog = state.progress[CUR ? CUR.id : ""] || {};
  const hit = SENTENCE_FLAT.find(({ sen }) => !prog[sen.id]);
  if (!hit) return;
  hit.sec.scrollIntoView({ block: "center" });
  hit.sec.classList.add("resume-target");
  hit.sec.addEventListener("animationend", () => hit.sec.classList.remove("resume-target"), { once: true });
}
function openStory(st, resume){
  stopPlayAll();
  CUR = st; GLOSSARY = st.glossary; MORPH = st.morph; CHAPTERS = st.chapters;
  if (STORIES.length > 1) {
    state.lastRead = st.id;
    localStorage.setItem("qissa-lastread", st.id);
  }
  buildSenAudio();
  document.body.classList.remove("lib-mode");
  const back = document.getElementById("backLib");
  back.hidden = STORIES.length < 2;
  back.textContent = ui().backLib;
  const siblings = STORIES.filter(s => s.group === st.group && s.id !== st.id);
  // Every teachable word of this story, counted once \u2014 the chip opens the list.
  const vocabCount = (() => {
    const s = new Set();
    st.chapters.forEach(c => c.sentences.forEach(x => x.tokens.forEach(t => {
      const e = st.glossary[t.lex];
      if (e && e.level >= 1) s.add(t.lex);
    })));
    return s.size;
  })();
  setHeader(st.title.ar, T(st.subtitle) || T(st.title) || "",
    `<span class="chip level">${ui().level} ${st.level} \u00b7 ${levelName(st)}</span>
     <span class="chip">${st.chapters.length} ${ui().chaptersWord}</span>
     ${vocabCount ? `<button class="chip vocab" id="vocabChip">${ui().vocabChip.replace("{n}", vocabCount)}</button>` : ""}
     <span class="chip">${accessLabel(st)}</span>` +
    (storyLocked(st) ? `<span class="chip preview">${ui().previewLbl}</span>` : "") +
    (isFreeThisWeek(st) ? `<span class="chip freeweek">${ui().freeWeek} · ${
      ui().freeWeekLeft.replace("{n}", daysLeftInRotation())}</span>` : "") +
    siblings.map(s =>
      `<button class="chip sib" data-sid="${s.id}">${ui().alsoAt} Level ${s.level} \u2192</button>`
    ).join(""));
  document.querySelectorAll("#metaRow .sib").forEach(b =>
    b.addEventListener("click", () => {
      const target = STORIES.find(s => s.id === b.dataset.sid);
      if (target) openStory(target);
    }));
  const vc = document.getElementById("vocabChip");
  if (vc) vc.addEventListener("click", openVocab);

// ---------- the quiz shell ----------
// Six of the seven games are one machine: a round of items, one question at a
// time, a row of options, a reveal that marks right / wrongpick and disables
// the rest, a why panel, zero or one extra action, then next-or-replay. That
// machine lives here ONCE; each game supplies its items and four hooks. The
// copies had already drifted (data-o vs data-k, «____» vs «ـــــ») — which is
// what six transcriptions of one idea do. Match stays outside the shell: a
// pairing grid with no rounds, no reveal and no score-per-question is
// genuinely a different game, not a seventh copy of this one.
function emptyGame(title, msg){
  sheetInner.innerHTML = `<div class="backrow"><button id="gBack">${ui().back2}</button></div>
    <div class="tabs"><button class="on">${title}</button></div>
    <p class="empty">${msg}</p>`;
  document.getElementById("gBack").addEventListener("click", openGames);
}
// cfg: { title, ask, items, restart, question(it), options(it) -> [{html, ok, ar?}],
//        why(it), after?(it), extras?: [{label(it), run(it)}] }
// options() is called once per question and must return the row pre-shuffled —
// the shell deliberately knows nothing about how a game builds distractors.
function runQuiz(cfg){
  const G = { i: 0, score: 0 };
  (function draw(){
    const it = cfg.items[G.i];
    const opts = cfg.options(it);
    sheetInner.innerHTML = `<div class="backrow"><button id="gBack">${ui().back2}</button></div>
      <div class="tabs"><button class="on">${cfg.title} · ${G.i + 1}/${cfg.items.length}</button></div>
      <p class="ref-intro">${cfg.ask}</p>
      ${cfg.question(it)}
      <div class="opts">` + opts.map((o, oi) =>
        `<button data-o="${oi}"${o.ar ? ' lang="ar"' : ""}>${o.html}</button>`).join("") + `</div>
      <div class="game-meta"><span>${ui().score}: ${G.score}</span></div><div id="qWhy"></div>`;
    document.getElementById("gBack").addEventListener("click", openGames);
    sheetInner.querySelectorAll(".opts [data-o]").forEach(b => b.addEventListener("click", () => {
      if (opts[+b.dataset.o].ok) G.score++;
      sheetInner.querySelectorAll(".opts [data-o]").forEach(x => {
        if (opts[+x.dataset.o].ok) x.classList.add("right");
        else if (x === b) x.classList.add("wrongpick");
        x.disabled = true;
      });
      // An extra may declare show(it): an action that would dead-end for THIS
      // item (e.g. jumping to a sentence behind the paywall) is not offered.
      const extras = (cfg.extras || []).filter(x => !x.show || x.show(it));
      document.getElementById("qWhy").innerHTML =
        `<div class="game-why">${cfg.why(it)}</div>
         ${cfg.after ? cfg.after(it) : ""}
         <div class="sheet-actions">` +
        extras.map((x, k) => `<button class="btn" id="qX${k}">${x.label(it)}</button>`).join("") +
        `<button class="btn primary" id="qNext">${G.i + 1 < cfg.items.length ? ui().next : ui().replay}</button>
         </div>`;
      extras.forEach((x, k) =>
        document.getElementById("qX" + k).addEventListener("click", () => x.run(it)));
      document.getElementById("qNext").addEventListener("click", () => {
        if (++G.i < cfg.items.length) draw(); else cfg.restart();
      });
    }));
  })();
}
// The reading line with one token replaced — the question line the sentence
// games share. Same join as the page renders, so the gap sits where the word did.
function senWithSlot(sen, ti, slot){
  return sen.tokens.map((t, k) => (k === ti ? slot(t) : t.s.full) + (t.punctAfter || "")).join(" ");
}
// A token's i'rab, shown as every reveal shows it: the Arabic line, then yours.
function irabWhy(irab){
  return `<span lang="ar" style="font-family:var(--ar-font);font-size:1.2em">${irab.ar}</span><br>${T(irab)}`;
}

// ---------- game: Emsile-i Muhtelife drill ----------
// Name a cell of the fourteen, pick the form. The distractors are other cells
// of the SAME verb, so the learner must know the sigha, not just the root.
function sarfItems(){
  const out = [];
  STORIES.forEach(st => Object.entries(st.morph || {}).forEach(([lex, m]) => {
    const rows = muhtelife(m);
    if (!rows || rows.length < 5) return;
    rows.forEach((row, ri) => out.push({ lex, m, ri, rows, lemma: m.mazi[0] }));
  }));
  return out;
}
function startSarfGame(){
  const items = shuffle(sarfItems()).slice(0, 8);
  if (!items.length) { openGames(); return; }
  runQuiz({
    title: ui().sarfGame, ask: ui().sarfGameAsk, items, restart: startSarfGame,
    question: it => `<div class="game-q"><span lang="ar" style="font-family:var(--ar-font);font-size:1.6rem">${it.lemma}</span>
      <div class="sigha">${state.uiLang === "tr" ? it.rows[it.ri].tr : it.rows[it.ri].en}</div></div>`,
    options: it => {
      const right = it.rows[it.ri];
      const others = it.rows.filter((r, k) => k !== it.ri && r.ar !== right.ar);
      return shuffle([{ html: right.ar, ok: true, ar: true },
        ...shuffle(others).slice(0, 3).map(r => ({ html: r.ar, ok: false, ar: true }))]);
    },
    why: it => `${it.m.bab} — ${it.m.wazn}${it.m.note ? "<br>" + it.m.note : ""}`,
  });
}

// ---------- game: which case? ----------
// Birgivi's classes of governed form, drilled on real sentences. The answer is
// read off the i'rab already written for the token, never guessed.
const CASE_KEYS = [
  { k: "marfu",  re: /مَرْفُوع/ },
  { k: "mansub", re: /مَنْصُوب/ },
  { k: "majrur", re: /مَجْرُور/ },
  { k: "majzum", re: /مَجْزُوم/ },
];
function caseItems(){
  const out = [];
  STORIES.forEach(st => st.chapters.forEach(ch => ch.sentences.forEach(sen =>
    sen.tokens.forEach((t, ti) => {
      if (!t.irab || !t.irab.ar) return;
      const hits = CASE_KEYS.filter(c => c.re.test(t.irab.ar));
      if (hits.length !== 1) return;          // skip tokens naming two cases
      out.push({ sen, ti, tok: t, key: hits[0].k, story: st.id });
    }))));
  return out;
}
function startCaseGame(){
  const items = shuffle(caseItems()).slice(0, 8);
  if (!items.length) { openGames(); return; }
  runQuiz({
    title: ui().caseGame, ask: ui().caseGameAsk, items, restart: startCaseGame,
    question: it => `<div class="game-q" lang="ar">${senWithSlot(it.sen, it.ti,
      t => `<b class="target">${t.s.full}</b>`)}</div>`,
    // The four cases in a fixed order, never shuffled: the learner should find
    // marfu' in the same place every round, like the columns of the table.
    options: it => ["marfu", "mansub", "majrur", "majzum"].map(k => ({
      html: `<span lang="ar">${MAMUL_LABEL[k].ar}</span> · ${MAMUL_LABEL[k][state.uiLang === "tr" ? "tr" : "en"]}`,
      ok: k === it.key,
    })),
    why: it => irabWhy(it.tok.irab),
  });
}

// ---------- game: what is this word doing? ----------
// The case game asks marfu' or mansub; this asks the harder question, because
// four different roles can all be marfu'. Answers are read off the Arabic i'rab
// already written for the token — a token whose i'rab names two roles at once
// («خَبَرُ الْمُبْتَدَإِ») is skipped rather than guessed at.
// `note` points at the registry entry whose question test identifies this role —
// the reveal shows the interrogative that would have given the answer away.
const ROLE_KEYS = [
  { k: "mubtada",   re: /مُبْتَدَأ/,        ar: "مُبْتَدَأ",        en: "mubtada",     tr: "mübteda",
    note: "mubtada-khabar" },
  { k: "khabar",    re: /خَبَر/,            ar: "خَبَر",            en: "khabar",      tr: "haber",
    note: "mubtada-khabar" },
  { k: "fail",      re: /فَاعِل/,           ar: "فَاعِل",           en: "fa'il",       tr: "fâil",
    not: /نَائِب/, note: "fail" },
  { k: "naib",      re: /نَائِبُ? فَاعِل/,  ar: "نَائِبُ الْفَاعِل", en: "na'ib al-fa'il", tr: "nâib-i fâil",
    note: "naib-al-fail" },
  { k: "maful",     re: /مَفْعُولٌ بِه/,    ar: "مَفْعُولٌ بِهِ",   en: "maf'ul bihi", tr: "mef'ûlün bih",
    note: "maful-bihi" },
  // `inner`: the i'rab hands this role to a letter INSIDE the token
  // («وَالْكَافُ مُضَافٌ إِلَيْهِ» in بِعِلْمِكَ), so the token itself is not it.
  // Some sound items are lost with it; a wrong answer would cost more.
  { k: "mudafilayh",re: /مُضَافٌ إِلَيْهِ/, ar: "مُضَافٌ إِلَيْهِ", en: "mudaf ilayh", tr: "muzâfun ileyh",
    inner: /(الْكَافُ|الْهَاءُ|الْيَاءُ|الْمِيمُ|النُّونُ)\s*مُضَافٌ إِلَيْهِ/ },
  { k: "naat",      re: /نَعْت/,            ar: "نَعْت",            en: "na't",        tr: "na't (sıfat)" },
  { k: "matuf",     re: /مَعْطُوف/,         ar: "مَعْطُوف",         en: "ma'tuf",      tr: "matûf" },
];
const ROLE_BY_KEY = Object.fromEntries(ROLE_KEYS.map(r => [r.k, r]));
// Only nominals are eligible. A verb's i'rab routinely names the role of some
// OTHER word — «فِعْلٌ مَاضٍ، وَالْفَاعِلُ ضَمِيرٌ مُسْتَتِرٌ» is not a fa'il, and
// «حَرْفُ جَرٍّ، وَالْجَارُّ وَالْمَجْرُورُ فِي مَحَلِّ رَفْعٍ خَبَرٌ» is not a khabar.
const NOMINAL_POS = ["noun", "propn", "pron", "adv"];
function roleItems(){
  const out = [];
  STORIES.forEach(st => st.chapters.forEach(ch => ch.sentences.forEach(sen =>
    sen.tokens.forEach((t, ti) => {
      if (!t.irab || !t.irab.ar) return;
      if (!NOMINAL_POS.includes(t.pos)) return;
      const hits = ROLE_KEYS.filter(r =>
        r.re.test(t.irab.ar) && !(r.not && r.not.test(t.irab.ar))
        && !(r.inner && r.inner.test(t.irab.ar)));
      // naib al-fa'il also matches fa'il; that pair is resolved, anything else
      // genuinely ambiguous is left out of the pool.
      if (hits.length !== 1) return;
      out.push({ sen, ti, tok: t, key: hits[0].k });
    }))));
  return out;
}
function startRoleGame(){
  const items = shuffle(roleItems()).slice(0, 8);
  if (!items.length) { openGames(); return; }
  runQuiz({
    title: ui().roleGame, ask: ui().roleGameAsk, items, restart: startRoleGame,
    question: it => `<div class="game-q" lang="ar">${senWithSlot(it.sen, it.ti,
      t => `<b class="target">${t.s.full}</b>`)}</div>`,
    options: it => shuffle([ROLE_BY_KEY[it.key],
        ...shuffle(ROLE_KEYS.filter(r => r.k !== it.key)).slice(0, 3)])
      .map(o => ({
        html: `<span lang="ar">${o.ar}</span> · ${state.uiLang === "tr" ? o.tr : o.en}`,
        ok: o.k === it.key,
      })),
    why: it => irabWhy(it.tok.irab),
    // The interrogative that would have given the answer away.
    after: it => questionTestHtml(ROLE_BY_KEY[it.key].note),
    extras: [{ label: () => `${arSpan("إِعْرَاب")} ${ui().sheetTitle}`,
               run: it => openIrabSheet(it.sen) }],
  });
}

// ---------- audio ----------
let arVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  arVoice = vs.find(v => v.lang && v.lang.toLowerCase().startsWith("ar")) || null;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function reducedMotion(){
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}
// speakGen is bumped every time a new speech session starts (single-sentence
// tap, or a step in the "Play all" queue). A speech utterance's onend/onerror
// only acts if its captured generation still matches — this stops a stale
// callback (from a cancelled or superseded utterance) from clearing the
// wrong highlight or advancing a play-all run that has already moved on.
let speakGen = 0;

// Clearing the word highlight is its own function because three things end a
// utterance — finishing, erroring, and being superseded — and every one of them
// has to leave the page without a stranded highlighted word.
// Hold the highlighted element rather than re-querying for it: a boundary event
// arrives several times a second, and `.word.speaking` is a compound selector
// with no fast path, so the document-wide sweep walked hundreds of spans to
// find the one element we had just put the class on ourselves.
let spokenEl = null;
function clearSpokenWord(){
  if (spokenEl) { spokenEl.classList.remove("speaking"); spokenEl = null; }
}

// One statement of what gets spoken. The utterance is a single string and the
// page is a row of spans, so the boundary handler needs the character range of
// each token — and deriving that separately from building the string meant two
// descriptions of one format that had to be kept in step by a test.
function sentenceText(sen){
  const offsets = [];
  let text = "";
  // offsets[i] belongs to token i — the index is the token index, so nothing
  // needs to carry it.
  sen.tokens.forEach((t, ti) => {
    offsets.push({ start: text.length, end: text.length + t.s.full.length });
    text += t.s.full + (t.punctAfter || "");
    if (ti < sen.tokens.length - 1) text += " ";
  });
  return { text, offsets };
}

// One shared element for recorded narration. A chapter's audio is one file;
// each sentence plays its own [startMs, endMs] slice of it.
const narration = new Audio();
narration.preload = "auto";
let narrationTimer = null;
function stopNarration(){
  if (narrationTimer) { clearTimeout(narrationTimer); narrationTimer = null; }
  if (!narration.paused) narration.pause();
}
// Plays [a, b] ms of src, then onDone. The stop is belt-and-braces: a timer
// scaled by the playback rate, plus a timeupdate guard for when the tab was
// throttled and the timer drifted past the segment end.
function playSpan(src, span, gen, onDone, onFail){
  const [a, b] = span;
  // Compare resolved URLs, not suffixes: "ch2/intro.mp3".endsWith("intro.mp3")
  // is true, which would keep playing the WRONG chapter's file — and a raw
  // string never matches the element's percent-encoded absolute src, which
  // would reload the file on every single sentence.
  const abs = new URL(src, location.href).href;
  if (narration.src !== abs) narration.src = abs;
  narration.playbackRate = state.rate || 1;
  narration.currentTime = a / 1000;
  const end = () => {
    if (gen !== speakGen) return;
    stopNarration();
    narration.ontimeupdate = null;
    onDone();
  };
  narration.ontimeupdate = () => { if (narration.currentTime * 1000 >= b) end(); };
  narration.onended = end;
  // The timer is a fallback deadline, but it starts counting at CALL time and
  // playback may still be fetching/buffering — so on firing, check the actual
  // position and re-arm for the remainder instead of truncating the sentence.
  const arm = ms => { narrationTimer = setTimeout(deadline, ms); };
  const deadline = () => {
    if (gen !== speakGen) return;
    const at = narration.currentTime * 1000;
    if (at >= b - 40) { end(); return; }
    arm(Math.max(120, (b - at) / (state.rate || 1) + 120));
  };
  const p = narration.play();
  arm((b - a) / (state.rate || 1) + 120);
  // A refused or failed play() must NOT advance the queue — a 404'd audio file
  // would otherwise race through the whole story in microtasks, marking every
  // sentence read. Same contract as the TTS branch's onerror.
  if (p && p.catch) p.catch(() => { if (gen === speakGen) { stopNarration(); onFail(); } });
}

function speak(sen, sec, onDone){
  // Apply the karaoke highlight synchronously, independent of whether audio
  // actually plays — headless/voiceless environments still get the visual cue.
  document.querySelectorAll(".sentence.playing").forEach(s => s.classList.remove("playing"));
  clearSpokenWord();
  sec.classList.add("playing");
  sec.scrollIntoView({ block: "center", behavior: reducedMotion() ? "auto" : "smooth" });
  speakGen++;
  const gen = speakGen;
  const finish = () => {
    if (gen !== speakGen) return; // superseded by a newer speak() call
    sec.classList.remove("playing");
    clearSpokenWord();
    if (onDone) onDone();
  };
  stopNarration();
  // Recorded narration wins over synthesis wherever it exists. No word-level
  // highlight here — a recording has no boundary events, and interpolating one
  // would be a guess; the sentence highlight is the honest cue.
  const real = SEN_AUDIO.get(sen.id);
  if (real) {
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    playSpan(real.src, real.span, gen, finish, () => {
      if (gen !== speakGen) return;
      sec.classList.remove("playing");
      clearSpokenWord();
      if (playAllActive) stopPlayAll();
    });
    return;
  }
  if (!("speechSynthesis" in window)) { setTimeout(finish, 0); return; }
  speechSynthesis.cancel();
  const { text, offsets } = sentenceText(sen);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ar-SA"; u.rate = state.rate || 1;
  if (arVoice) u.voice = arVoice;
  // Follow the voice word by word. Boundary events are best-effort — Chrome
  // fires them, some engines never do, and none of them are contractual — so
  // this is written as pure enrichment: if nothing arrives, the sentence-level
  // highlight is exactly what it always was.
  // renderStory appends words in token order and stamps data-ti, so the NodeList
  // index is the token index — hoisted out of the handler so a boundary event
  // costs an array lookup rather than a selector match.
  const words = sec.querySelectorAll(".word");
  u.onboundary = e => {
    if (gen !== speakGen) return;
    if (e.name && e.name !== "word") return;
    const ti = offsets.findIndex(o => e.charIndex < o.end);
    const el = ti >= 0 && words[ti];
    if (!el || el === spokenEl) return;   // punctuation resolves back to the same word
    clearSpokenWord();
    el.classList.add("speaking");
    spokenEl = el;
  };
  u.onend = finish;
  // A TTS error (e.g. a browser with no voices installed) must not advance the
  // queue — otherwise "Play all" races through the whole story in silence,
  // marking every sentence read. Clear the highlight and stop cleanly instead.
  u.onerror = () => {
    if (gen !== speakGen) return;
    sec.classList.remove("playing");
    clearSpokenWord();
    if (playAllActive) stopPlayAll();
  };
  speechSynthesis.speak(u);
}

// ---------- audiobook: continuous "Play all" queue ----------
let playAllActive = false;
let playAllIdx = -1;

function updatePlayAllBtn(){
  const btn = document.getElementById("playAll");
  if (!btn) return;
  btn.textContent = playAllActive ? ui().stopAll : ui().playAll;
  btn.classList.toggle("on", playAllActive);
  btn.setAttribute("aria-pressed", String(playAllActive));
}

function stopPlayAll(){
  playAllActive = false;
  playAllIdx = -1;
  speakGen++; // invalidate any utterance still in flight
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  stopNarration();
  document.querySelectorAll(".sentence.playing").forEach(s => s.classList.remove("playing"));
  clearSpokenWord();
  updatePlayAllBtn();
}

function playAllStep(idx){
  if (!playAllActive) return; // stopped between steps
  if (idx >= SENTENCE_FLAT.length) { stopPlayAll(); return; }
  playAllIdx = idx;
  const { sen, sec } = SENTENCE_FLAT[idx];
  markRead(sen.id);
  speak(sen, sec, () => playAllStep(idx + 1));
}

function startPlayAll(){
  if (!SENTENCE_FLAT.length) return;
  // Resume from the first unread sentence in this story, falling back to the
  // very start once everything (or nothing) has been read yet.
  const prog = state.progress[CUR ? CUR.id : ""] || {};
  let idx = SENTENCE_FLAT.findIndex(({ sen }) => !prog[sen.id]);
  if (idx === -1) idx = 0;
  playAllActive = true;
  updatePlayAllBtn();
  playAllStep(idx);
}
