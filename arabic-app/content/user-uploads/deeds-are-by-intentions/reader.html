<meta charset="utf-8">
<title>Qissa — Arabic Reader Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Qissa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<style>
  :root {
    --ground: #FAF6EE;
    --panel: #FFFDF7;
    --ink: #22303A;
    --ink-soft: #5A6B76;
    --line: #E4DCCB;
    --accent: #0E7C74;
    --accent-ink: #FFFFFF;
    --accent-soft: rgba(14,124,116,.10);
    --danger: #B23B3B;
    --ok: #2E7D46;
    --lvl1: #2E7D46;
    --lvl2: #0E7C74;
    --lvl3: #B07A1E;
    --lvl4: #B23B3B;
    --shadow: 0 18px 50px rgba(34,48,58,.22);
    --shadow-sm: 0 3px 14px rgba(34,48,58,.10);
    --radius: 14px;
    --radius-lg: 20px;
    /* ===== the design system: one scale for space, type, motion, touch =====
       Colour was already tokenised; everything ELSE was ad-hoc rem literals,
       which is why two panels built a week apart never quite lined up. These
       are the only sizes the app is allowed to use. The steps are the ones
       the language-learning apps people actually keep on their phones settle
       on: a 4px space grid, a ~1.2 type ratio, one shared easing, and a 44px
       floor under anything a thumb has to hit. */
    --s1: .25rem;  --s2: .5rem;   --s3: .75rem;  --s4: 1rem;
    --s5: 1.5rem;  --s6: 2rem;    --s7: 3rem;
    --t-xs: .72rem; --t-sm: .82rem; --t-md: .94rem; --t-lg: 1.1rem;
    --t-xl: 1.35rem; --t-2xl: 1.7rem;
    --lh-tight: 1.25; --lh-body: 1.6;
    --track-caps: .1em;                     /* the one letter-spacing for label caps */
    --r-sm: 8px; --r-md: 12px; --r-full: 999px;
    --e1: 0 1px 2px rgba(34,48,58,.06), 0 2px 8px rgba(34,48,58,.06);
    --e2: 0 4px 12px rgba(34,48,58,.10);
    --dur-fast: .12s; --dur-base: .2s; --dur-slow: .34s;
    --ease: cubic-bezier(.2, .8, .3, 1);
    --tap: 44px;                            /* the thumb floor — never smaller */
    --measure: 40rem;                       /* the reading column: long enough
                                               to carry a matn line, short
                                               enough that the eye finds the
                                               next one without hunting */
    --ar-font: "Noto Naskh Arabic", "Geeza Pro", "Traditional Arabic", "Amiri", "Scheherazade New", serif;
    --body-font: Charter, Georgia, "Times New Roman", serif;
    --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  /* Manual theme override: html[data-theme] wins over the OS preference.
     The two blocks below repeat the palettes verbatim — keep all three
     var sets (light :root, the media query, these) in step. */
  html[data-theme="light"] {
    --ground: #FAF6EE; --panel: #FFFDF7; --ink: #22303A; --ink-soft: #5A6B76;
    --line: #E4DCCB; --accent: #0E7C74; --accent-ink: #FFFFFF;
    --accent-soft: rgba(14,124,116,.10); --danger: #B23B3B; --ok: #2E7D46;
    --lvl1: #2E7D46; --lvl2: #0E7C74; --lvl3: #B07A1E; --lvl4: #B23B3B;
    --shadow: 0 18px 50px rgba(34,48,58,.22); --shadow-sm: 0 3px 14px rgba(34,48,58,.10);
  }
  html[data-theme="dark"] {
    --ground: #101A20; --panel: #16232B; --ink: #E9E2D2; --ink-soft: #97A6AD;
    --line: #27363F; --accent: #45C2B4; --accent-ink: #08221F;
    --accent-soft: rgba(69,194,180,.14); --danger: #E07A7A; --ok: #7CC98F;
    --lvl1: #7CC98F; --lvl2: #45C2B4; --lvl3: #D9A94E; --lvl4: #E07A7A;
    --shadow: 0 18px 50px rgba(0,0,0,.55);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #101A20;
      --panel: #16232B;
      --ink: #E9E2D2;
      --ink-soft: #97A6AD;
      --line: #27363F;
      --accent: #45C2B4;
      --accent-ink: #08221F;
      --accent-soft: rgba(69,194,180,.14);
      --danger: #E07A7A;
      --ok: #7CC98F;
      --lvl1: #7CC98F;
      --lvl2: #45C2B4;
      --lvl3: #D9A94E;
      --lvl4: #E07A7A;
      --shadow: 0 18px 50px rgba(0,0,0,.55);
      --shadow-sm: 0 3px 14px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"] {
    --ground: #FAF6EE; --panel: #FFFDF7; --ink: #22303A; --ink-soft: #5A6B76; --line: #E4DCCB;
    --accent: #0E7C74; --accent-ink: #FFFFFF; --accent-soft: rgba(14,124,116,.10);
    --danger: #B23B3B; --ok: #2E7D46;
    --lvl1: #2E7D46; --lvl2: #0E7C74; --lvl3: #B07A1E; --lvl4: #B23B3B;
    --shadow: 0 18px 50px rgba(34,48,58,.22); --shadow-sm: 0 3px 14px rgba(34,48,58,.10);
  }
  :root[data-theme="dark"] {
    --ground: #101A20; --panel: #16232B; --ink: #E9E2D2; --ink-soft: #97A6AD; --line: #27363F;
    --accent: #45C2B4; --accent-ink: #08221F; --accent-soft: rgba(69,194,180,.14);
    --danger: #E07A7A; --ok: #7CC98F;
    --lvl1: #7CC98F; --lvl2: #45C2B4; --lvl3: #D9A94E; --lvl4: #E07A7A;
    --shadow: 0 18px 50px rgba(0,0,0,.55); --shadow-sm: 0 3px 14px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--body-font); line-height: 1.55;
  }
  .wrap { max-width: 40rem; margin: 0 auto; padding: 0 1.1rem 6rem; }

  header.app { padding: 1.6rem 0 1rem; border-bottom: 1px solid var(--line); }
  .eyebrow {
    font-family: var(--ui-font); font-size: .68rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--accent); font-weight: 600;
  }
  h1.story-title {
    font-family: var(--ar-font); font-size: 2.3rem; margin: .35rem 0 .1rem;
    direction: rtl; text-align: right; text-wrap: balance; line-height: 1.45; font-weight: 600;
  }
  .story-sub { color: var(--ink-soft); font-size: .92rem; margin: 0; }
  .meta-row { display: flex; gap: .5rem; margin-top: .8rem; flex-wrap: wrap; align-items: center; }
  .chip {
    font-family: var(--ui-font); font-size: .72rem; font-weight: 600;
    padding: .22rem .6rem; border-radius: 999px; border: 1px solid var(--line);
    color: var(--ink-soft); background: var(--panel);
  }
  .chip.level { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .chip.amil { color: var(--danger); border-color: var(--danger); background: transparent; }
  .chip.mamul { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .chip.preview { color: var(--danger); border-color: var(--danger); }
  .chip.freeweek { color: var(--lvl3); border-color: var(--lvl3); background: transparent; font-weight: 700; }
  .chip.newchip { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); font-weight: 700; letter-spacing: .06em; }
  .lib-sort {
    display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
    margin: 0 0 .8rem; font-family: var(--ui-font);
  }
  .lib-sort .ls-lbl { font-size: .78rem; color: var(--ink-soft); }
  .chip.done { color: var(--ok); border-color: var(--ok); font-weight: 700; }
  .chip.newwords { color: var(--accent); border-color: var(--accent); }
  .vocab-list button { white-space: nowrap; }
  .vocab-list button.saved { color: var(--ok); border-color: var(--ok); }
  .vocab-list .chip.level { flex-shrink: 0; }
  .ch-nav { display: flex; gap: .4rem; flex-wrap: wrap; margin: 0 0 .8rem; font-family: var(--ui-font); }
  .ch-pill {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
    border-radius: 999px; padding: .25rem .7rem; font-size: .76rem; cursor: pointer;
  }
  .ch-pill:hover { color: var(--accent); border-color: var(--accent); }
  .jumal-tabs { margin-top: 1.1rem; }
  .jumla-row {
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: .55rem .7rem; margin: .45rem 0;
  }
  .jumla-row .jt { font-family: var(--ar-font); font-size: 1.05rem; }
  .jumla-row .jr { font-family: var(--ar-font); color: var(--accent); font-size: .95rem; margin: .15rem 0; }
  .jumla-row .jg { font-family: var(--ui-font); font-size: .8rem; color: var(--ink-soft); }
  .review-nudge {
    display: block; width: 100%; text-align: left; cursor: pointer;
    border: 1.5px dashed var(--accent); border-radius: 10px; background: transparent;
    color: var(--accent); font-family: var(--ui-font); font-size: .82rem; font-weight: 600;
    padding: .55rem .8rem; margin: 0 0 .8rem;
  }
  .continue-card {
    display: block; width: 100%; text-align: inherit; cursor: pointer;
    border: 1.5px solid var(--accent); border-radius: var(--radius);
    background: linear-gradient(135deg, var(--accent-soft), transparent 70%) var(--panel);
    padding: .85rem 1rem; margin: 0 0 .8rem; font-family: var(--ui-font);
    transition: box-shadow .15s, transform .15s;
  }
  .continue-card:hover { box-shadow: var(--shadow-sm); }
  @media (prefers-reduced-motion: no-preference) {
    .continue-card:hover { transform: translateY(-1px); }
  }
  .continue-card .cc-lbl {
    display: block; font-size: .72rem; text-transform: uppercase;
    letter-spacing: .06em; color: var(--accent); font-weight: 700;
  }
  .continue-card .cc-title { display: block; font-family: var(--ar-font); font-size: 1.3rem; margin: .15rem 0; }
  .continue-card .cc-sub { display: block; font-size: .8rem; color: var(--ink-soft); margin-bottom: .4rem; }
  .sentence.resume-target { animation: resumeflash 1.6s ease 1; }
  @keyframes resumeflash { 0%, 60% { background: var(--accent-soft); } 100% { background: transparent; } }
  .welcome-h { font-family: var(--ui-font); margin: .2rem 0 .4rem; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin: .6rem 0 .4rem; font-family: var(--ui-font); }
  .stat-tile { border: 1px solid var(--line); border-radius: 10px; padding: .6rem .3rem; text-align: center; background: var(--panel); }
  .stat-tile b { display: block; font-size: 1.25rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  .stat-tile span { font-size: .66rem; color: var(--ink-soft); }
  .lvl-row { display: flex; align-items: center; gap: .5rem; font-family: var(--ui-font); font-size: .76rem; margin: .35rem 0; }
  .lvl-row .lv { width: 5.2rem; }
  .lvl-row.mine .lv { color: var(--accent); font-weight: 700; }
  .lvl-row .bar { flex: 1; height: 7px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .lvl-row .bar span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .lvl-row .n { color: var(--ink-soft); min-width: 3.2rem; text-align: right; }
  .level-pick { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin: .8rem 0; font-family: var(--ui-font); }
  .level-pick .btn { margin: 0; text-align: center; transition: border-color .12s, color .12s; }
  .level-pick .btn:hover:not(.saved) { border-color: var(--accent); color: var(--accent); }
  .btn.unsure { width: 100%; margin-top: .2rem; color: var(--ink-soft); }
  .qtest {
    display: flex; flex-wrap: wrap; align-items: center; gap: .35rem;
    margin: .5rem 0 .2rem; font-family: var(--ui-font);
  }
  .qtest .qt-lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
  .gnote p.plain {
    font-size: 1rem; line-height: 1.55; color: var(--ink);
    border-left: 3px solid var(--accent); padding: .1rem 0 .1rem .7rem; margin: .6rem 0 .7rem;
  }
  details.deep > summary {
    cursor: pointer; font-family: var(--ui-font); font-size: .8rem; font-weight: 600;
    color: var(--accent); list-style: none; padding: .2rem 0;
  }
  details.deep > summary::-webkit-details-marker { display: none; }
  details.deep > summary::before { content: "▸ "; }
  details.deep[open] > summary::before { content: "▾ "; }
  .qtest .qt {
    font-size: .82rem; font-weight: 600; padding: .12rem .5rem; border-radius: 999px;
    color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent);
  }
  button.chip.sib, button.chip.vocab { cursor: pointer; color: var(--accent); border-color: var(--accent); background: transparent; }
  button.chip.sib:hover, button.chip.vocab:hover { background: var(--accent-soft); }
  .chip .ar { font-family: var(--ar-font); font-size: 1.05em; }

  .upsell {
    margin: 1.4rem 0; padding: 1.2rem 1.4rem; border: 1.5px solid var(--accent);
    border-radius: var(--radius); text-align: center; font-family: var(--ui-font);
    background: linear-gradient(160deg, var(--accent-soft), transparent 70%) var(--panel);
    box-shadow: var(--shadow-sm);
  }
  .upsell .ut { font-weight: 700; margin-bottom: .4rem; }
  .upsell p { color: var(--ink-soft); font-size: .9rem; margin: 0 0 .9rem; }
  .upsell .unlock {
    font-family: var(--ui-font); font-weight: 700; font-size: .9rem; cursor: pointer;
    padding: .55rem 1.2rem; border-radius: 999px; border: none;
    background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow-sm);
    transition: transform .12s;
  }
  @media (prefers-reduced-motion: no-preference) { .upsell .unlock:hover { transform: translateY(-1px); } }

  nav.controls {
    position: sticky; top: 0; z-index: 5; background: var(--ground);
    padding: .7rem 0; border-bottom: 1px solid var(--line);
    display: flex; gap: .55rem; align-items: center; flex-wrap: wrap;
    font-family: var(--ui-font);
  }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel); }
  .seg button {
    border: 0; background: transparent; color: var(--ink-soft); cursor: pointer;
    font-family: var(--ar-font); font-size: .95rem; padding: .3rem .75rem;
  }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .tbtn {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
    border-radius: var(--r-full); padding: var(--s2) var(--s3); cursor: pointer;
    min-height: 34px;                 /* header chips sit in a dense row; the
                                         44px floor applies to the primary
                                         actions a thumb reaches for, not to
                                         a toolbar the pointer scans */
    display: inline-flex; align-items: center; gap: var(--s1);
    font-family: var(--ui-font); font-size: var(--t-xs); font-weight: 600;
    transition: color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease),
                background var(--dur-fast) var(--ease);
  }
  .tbtn:hover:not(.on) { color: var(--accent); border-color: var(--accent); }
  .tbtn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .tbtn:focus-visible, .seg button:focus-visible, .word:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .spacer { flex: 1; }
  .deckbtn { position: relative; }
  .deckbtn .count {
    position: absolute; top: -7px; inset-inline-end: -7px; background: var(--danger); color: #fff;
    font-size: .62rem; border-radius: 999px; min-width: 1.05rem; height: 1.05rem;
    display: grid; place-items: center; padding: 0 .2rem;
  }
  .deckbtn .count[hidden] { display: none; }

  .chapter-head {
    font-family: var(--ui-font); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-soft); margin: 1.6rem 0 .4rem; display: flex; align-items: center; gap: .7rem;
  }
  /* The rub' al-hizb ornament — serious, classical, and unmistakably ours. */
  .chapter-head::before { content: "۞"; color: var(--accent); font-size: 1.1rem; letter-spacing: 0; }
  .chapter-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .chapter-title-ar { font-family: var(--ar-font); font-size: 1.15rem; color: var(--ink); letter-spacing: 0; text-transform: none; }

  /* The reading column. Arabic is set RTL and the sentence block bleeds a
     little into the gutter so the hover ground reads as a band, not a box. */
  #story:not(:has(.lib-card)) { max-width: var(--measure); margin-inline: auto; }
  section.sentence {
    margin: var(--s5) calc(var(--s2) * -1); padding: var(--s1) var(--s2);
    border-radius: var(--radius);
    transition: background var(--dur-fast) var(--ease);
  }
  section.sentence:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
  section.sentence.playing { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  /* The word currently being spoken. Only ever set while a boundary event is
     actually arriving — a browser that never fires one simply keeps the
     sentence-level highlight, which is the old behaviour. */
  .word.speaking { background: var(--accent); color: var(--accent-ink); }
  @media (prefers-reduced-motion: no-preference) {
    .word.speaking { transition: background .12s linear; }
  }
  .ar-line {
    direction: rtl; text-align: right; font-family: var(--ar-font);
    font-size: var(--ar-size, 1.7rem); line-height: 2.3; padding: 0 var(--s1);
    text-wrap: pretty;
  }
  .word {
    cursor: pointer; border-radius: 6px; padding: 0 .07em;
    text-decoration-thickness: 2px; text-underline-offset: 7px;
    transition: background .12s, color .12s;
  }
  .word:hover { background: var(--accent-soft); }
  .word.active { background: var(--accent); color: var(--accent-ink); }
  .underlines .word[data-lvl="1"] { text-decoration: underline; text-decoration-color: var(--lvl1); }
  .underlines .word[data-lvl="2"] { text-decoration: underline; text-decoration-color: var(--lvl2); }
  .underlines .word[data-lvl="3"] { text-decoration: underline; text-decoration-color: var(--lvl3); }
  .underlines .word[data-lvl="4"] { text-decoration: underline; text-decoration-color: var(--lvl4); }
  /* the role-color layer: paint FUNCTION, not difficulty — the RoleEngine's
     reading of each word's own i'rab. It overrides the level underlines. */
  /* one muted family, defined once — full-strength primaries proved tiring
     over a page of text (the maful red especially), so every role sits at
     the same soft chroma and the underline dropped from 3px to 2px. */
  :root {
    --role-fail:    #5a9e6f;
    --role-maful:   #cd7f7a;
    --role-mubtada: #6b93c4;
    --role-khabar:  #55989b;
    --role-mudaf:   #9a7fb8;
    --role-hal:     #cf9f5d;
    --role-tabi:    #a08878;
    --role-jarr:    #b58bc0;
  }
  body.role-mode .word[data-role] { text-decoration: underline; text-decoration-thickness: 2px;
    text-underline-offset: .18em; }
  body.role-mode .word:not([data-role]) { text-decoration: none; }
  body.role-mode .word[data-role="fail"]    { text-decoration-color: var(--role-fail); }
  body.role-mode .word[data-role="maful"]   { text-decoration-color: var(--role-maful); }
  body.role-mode .word[data-role="mubtada"] { text-decoration-color: var(--role-mubtada); }
  body.role-mode .word[data-role="khabar"]  { text-decoration-color: var(--role-khabar); }
  body.role-mode .word[data-role="mudaf"]   { text-decoration-color: var(--role-mudaf); }
  body.role-mode .word[data-role="hal"]     { text-decoration-color: var(--role-hal); }
  body.role-mode .word[data-role="tabi"]    { text-decoration-color: var(--role-tabi); }
  body.role-mode .word[data-role="jarr"]    { text-decoration-color: var(--role-jarr); }
  #roleLegend { display: flex; flex-wrap: wrap; gap: .3rem .7rem;
    font-family: var(--ui-font); font-size: .68rem; color: var(--ink-soft); margin-top: .45rem; }
  #roleLegend .rl { border-bottom: 2px solid; padding-bottom: 1px; }
  #roleLegend .rl[data-role="fail"]    { border-color: var(--role-fail); }
  #roleLegend .rl[data-role="maful"]   { border-color: var(--role-maful); }
  #roleLegend .rl[data-role="mubtada"] { border-color: var(--role-mubtada); }
  #roleLegend .rl[data-role="khabar"]  { border-color: var(--role-khabar); }
  #roleLegend .rl[data-role="mudaf"]   { border-color: var(--role-mudaf); }
  #roleLegend .rl[data-role="hal"]     { border-color: var(--role-hal); }
  #roleLegend .rl[data-role="tabi"]    { border-color: var(--role-tabi); }
  #roleLegend .rl[data-role="jarr"]    { border-color: var(--role-jarr); }
  #roleToggle.on { background: var(--accent); color: var(--accent-ink); }
  /* Avamil-100 reference (the Curcani count) */
  .av-counts { display: flex; flex-wrap: wrap; gap: .4rem; margin: .6rem 0; font-family: var(--ui-font); font-size: .72rem; color: var(--ink-soft); }
  .av-counts .avc { border: 1px solid var(--line); border-radius: .6rem; padding: .35rem .65rem; }
  .av-counts .avc b { display: block; font-size: 1.1rem; color: var(--ink); }
  table.av-table td:nth-child(2) { font-family: var(--ar-font); font-size: 1.2rem; white-space: nowrap; direction: rtl; }
  table.av-table td:first-child { color: var(--ink-soft); font-size: .72rem; }
  .av-mean { font-family: var(--ar-font); direction: rtl; display: block; margin-bottom: .15rem; }
  .av-ex { display: block; color: var(--ink-soft); font-size: .78rem; }
  .av-ex .ar { font-family: var(--ar-font); font-size: .95rem; direction: rtl; }
  .avamil-card { display: block; width: 100%; text-align: start; border: 1px solid var(--line); border-radius: .8rem;
    background: none; color: inherit; padding: .6rem .8rem; margin: .6rem 0; cursor: pointer; font: inherit; }
  .avamil-card .ar { font-family: var(--ar-font); font-size: 1.05rem; }
  .avamil-card small { display: block; color: var(--ink-soft); font-family: var(--ui-font); }
  /* the coach card */
  .coach { border: 1px solid var(--line); border-radius: .8rem; padding: .7rem .8rem; margin: .6rem 0;
    font-family: var(--ui-font); }
  .coach .co-head { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
  .coach .co-msg { margin: .35rem 0 .5rem; font-size: .88rem; }
  .coach .co-abil { margin-top: .6rem; }
  .coach .co-lbl { display: block; font-size: .64rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-soft); margin-bottom: .25rem; }
  .coach .co-row { display: flex; align-items: center; gap: .5rem; font-size: .72rem; margin: .15rem 0; }
  .coach .co-a { flex: 0 0 6.5rem; color: var(--ink-soft); }
  .coach .co-bar { flex: 1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .coach .co-bar span { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .coach .co-n { flex: 0 0 2.6rem; text-align: end; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .coach .co-spark { flex: 0 0 48px; opacity: .8; }
  .hoca { border: 1px solid var(--line); border-radius: .7rem; padding: .5rem .7rem; margin: .5rem 0;
    font-family: var(--ui-font); font-size: .82rem; }
  .hoca-line { padding: .12rem 0; }
  .hoca-line b { font-family: var(--ar-font); font-size: 1.05rem; }
  .hoca-q { color: var(--accent); font-weight: 600; }
  .ml-vote { color: var(--ink-soft); font-size: .74rem; }
  /* woven cover band on the shelf */
  .lib-card .cover { height: 46px; border-radius: .55rem; margin-bottom: .5rem;
    background-size: 72px 72px; background-position: center;
    border: 1px solid var(--line); }
  /* the sheet wears a drag-handle pill, like every bottom sheet the reader knows */
  #sheet::before { content: ""; display: block; width: 42px; height: 4px; border-radius: 2px;
    background: var(--line); margin: 0 auto .6rem; }
  /* Interlinear (medium mode): each word is a column — Arabic over its gloss. */
  .word.stacked { display: inline-flex; flex-direction: column; align-items: center;
    vertical-align: top; line-height: 1.35; }
  .word.stacked .w-gl { font-family: var(--ui-font); font-size: .58rem; color: var(--ink-soft);
    direction: ltr; letter-spacing: 0; margin-top: .1rem; max-width: 8.5rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .word.stacked.active .w-gl { color: var(--accent-ink); }
  .ar-line:has(.stacked) { line-height: 2.4; }
  #modeSeg button { font-family: var(--ui-font); display: inline-flex; align-items: baseline; gap: .3rem; }
  #modeSeg .m-ar { font-family: var(--ar-font); font-size: 1rem; }
  #modeSeg .m-en { font-size: .7rem; }
  .peek { border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
    cursor: pointer; border-radius: 999px; font-size: .7rem; line-height: 1; flex: none;
    padding: .35rem .6rem; font-family: var(--ui-font); }
  .peek:hover { color: var(--accent); border-color: var(--accent); }
  .sent-tools { display: flex; gap: .6rem; align-items: center; padding: .15rem .3rem 0; font-family: var(--ui-font); }
  .play {
    border: 1px solid var(--line); background: var(--panel); color: var(--accent); cursor: pointer;
    width: 1.7rem; height: 1.7rem; border-radius: 999px; font-size: .75rem; line-height: 1; flex: none;
    transition: border-color .12s, background .12s;
  }
  .play:hover { border-color: var(--accent); background: var(--accent-soft); }
  .trans {
    color: var(--ink-soft); font-size: var(--t-md); line-height: var(--lh-body);
    border-inline-start: 2px solid var(--line); padding-inline-start: var(--s2);
    margin-top: var(--s2);
  }
  .trans[hidden] { display: none; }

  .legend { margin-top: 2rem; border-top: 1px solid var(--line); padding-top: .8rem;
    font-family: var(--ui-font); font-size: .74rem; color: var(--ink-soft);
    display: flex; gap: 1rem; flex-wrap: wrap; }
  .legend .sw { display: inline-block; width: .62em; height: .62em; border-radius: 50%; vertical-align: middle; margin-inline-end: .3em; }
  footer.note { margin-top: 1.2rem; font-family: var(--ui-font); font-size: .74rem; color: var(--ink-soft); }

  /* ---------- bottom sheet ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(10,16,20,.45); z-index: 9; border: 0; padding: 0;
    opacity: 0; pointer-events: none; transition: opacity .2s;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; z-index: 10; left: 50%; bottom: 0; transform: translate(-50%, 105%);
    width: min(40rem, 100%); background: var(--panel); border: 1px solid var(--line); border-bottom: 0;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow);
    transition: transform .25s cubic-bezier(.3,.9,.35,1); max-height: 82vh; overflow-y: auto;
  }
  .sheet.show { transform: translate(-50%, 0); }
  /* the glass sheet: frosted over the page where the browser can afford it */
  @supports (backdrop-filter: blur(4px)) or (-webkit-backdrop-filter: blur(4px)) {
    .sheet {
      background: color-mix(in srgb, var(--panel) 82%, transparent);
      -webkit-backdrop-filter: blur(16px) saturate(1.25);
      backdrop-filter: blur(16px) saturate(1.25);
    }
  }
  /* the i'lal chain: asl ← result, with the rule as recited */
  .ilal {
    border: 1px solid var(--line); border-inline-start: 3px solid var(--lvl3, var(--accent));
    border-radius: 10px; padding: .5rem .7rem; margin: .5rem 0; background: var(--panel);
  }
  .ilal .il-head { font-family: var(--ui-font); font-size: .68rem; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: .25rem; }
  .ilal .il-line { font-family: var(--ar-font); font-size: 1.15rem; }
  .ilal .il-why { font-size: .85rem; color: var(--ink-soft); margin: .1rem 0 .45rem; }
  .ilal .il-why small { font-family: var(--ui-font); font-size: .74rem; }
  .ilal .il-step:last-child .il-why { margin-bottom: 0; }
  @media (prefers-reduced-motion: reduce) { .sheet, .scrim { transition: none; } }
  .sheet-inner { padding: 1rem 1.2rem 1.4rem; }
  .grab { width: 2.4rem; height: 4px; border-radius: 2px; background: var(--line); margin: .6rem auto 0; }
  .tabs { display: flex; gap: .15rem; margin: .4rem 0 .9rem; font-family: var(--ui-font); flex-wrap: wrap; }
  .tabs button {
    border: 0; background: transparent; color: var(--ink-soft); font-weight: 600; font-size: .8rem;
    padding: .35rem .6rem; cursor: pointer; border-bottom: 2px solid transparent;
  }
  .tabs button .ar { font-family: var(--ar-font); font-size: 1.05rem; }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  .lemma {
    font-family: var(--ar-font); font-size: 2.2rem; direction: rtl; text-align: right;
    line-height: 1.5; margin: 0 0 .2rem; padding: .3rem .6rem;
    background: linear-gradient(135deg, var(--accent-soft), transparent 75%); border-radius: 12px;
  }
  .lemma .say {
    font-size: 1.1rem; line-height: 1; cursor: pointer; vertical-align: middle;
    border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
    padding: .3rem .45rem; margin-inline-start: .4rem;
  }
  .lemma .say:hover { border-color: var(--accent); }
  .bab-line { direction: rtl; text-align: right; font-family: var(--ar-font); font-size: 1.05rem; color: var(--ink-soft); margin: .1rem 0 .3rem; }
  .facts { display: flex; gap: .45rem; flex-wrap: wrap; margin: .5rem 0 .7rem; }
  .gloss { font-size: 1.02rem; margin: .2rem 0; }
  .gloss small { color: var(--ink-soft); font-family: var(--ui-font); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; margin-inline-end: .45rem; }
  .segrow {
    direction: rtl; display: flex; gap: .4rem; flex-wrap: wrap; margin: .6rem 0;
    font-family: var(--ar-font); font-size: 1.25rem;
  }
  .segrow .seg-item { background: var(--accent-soft); border: 1px dashed var(--accent); border-radius: 8px; padding: .1rem .55rem; }
  .segrow .seg-item small { display: block; font-family: var(--ui-font); font-size: .62rem; color: var(--ink-soft); direction: ltr; text-align: center; }
  .sheet-actions { display: flex; gap: .6rem; margin-top: 1rem; font-family: var(--ui-font); flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--line); border-radius: var(--r-md);
    padding: var(--s3) var(--s4); cursor: pointer;
    min-height: var(--tap);            /* the thumb floor, not a nice-to-have */
    display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
    font-family: var(--ui-font); font-weight: 600; font-size: var(--t-sm);
    background: var(--panel); color: var(--ink);
    transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease),
                box-shadow var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  }
  .btn:hover { border-color: var(--accent); box-shadow: var(--e1); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) { .btn:active { transform: translateY(1px); } }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.saved { background: var(--ok); border-color: var(--ok); color: #fff; }

  /* ---------- grammar ---------- */
  .gnote h3 { font-size: 1.05rem; margin: .8rem 0 .4rem; }
  .gnote .ar-inline { font-family: var(--ar-font); font-size: 1.25em; }
  .gnote p { margin: .4rem 0; font-size: .95rem; }
  .ex { border-inline-start: 3px solid var(--accent); padding: .3rem .8rem; margin: .55rem 0; background: var(--accent-soft); border-radius: 0 8px 8px 0; }
  .ex .ar { font-family: var(--ar-font); font-size: 1.35rem; direction: rtl; text-align: right; }
  .ex .en { color: var(--ink-soft); font-size: .88rem; }
  .mistake { border: 1px solid var(--line); border-radius: 10px; padding: .6rem .8rem; margin: .6rem 0; }
  .mistake .wrong { color: var(--danger); text-decoration: line-through; font-family: var(--ar-font); font-size: 1.25rem; direction: rtl; display: inline-block; }
  .mistake .right { color: var(--ok); font-family: var(--ar-font); font-size: 1.25rem; direction: rtl; display: inline-block; margin-inline-start: .8rem; }
  .mistake .why { font-size: .87rem; color: var(--ink-soft); margin-top: .3rem; }
  .mlabel { font-family: var(--ui-font); font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; color: var(--danger); font-weight: 700; margin-top: .9rem; }

  /* ---------- sarf (conjugation) ---------- */
  .tense-seg { margin: .6rem 0; }
  .conj-wrap { overflow-x: auto; }
  .word.in-phrase { background: linear-gradient(transparent 72%, var(--accent-soft) 72%); }
  .phrase-banner { border: 1px solid var(--accent); background: var(--accent-soft);
    border-radius: 12px; padding: .7rem .85rem; margin-bottom: .8rem; }
  .phrase-banner .pb-ar { font-family: var(--ar-font); font-size: 1.5rem; direction: rtl; text-align: right; }
  .phrase-banner .pb-gloss { font-family: var(--ui-font); font-weight: 600; margin-top: .25rem; }
  .phrase-banner .pb-lit { font-family: var(--ui-font); font-size: .78rem; color: var(--ink-soft); font-style: italic; }
  .phrase-banner .pb-note { font-family: var(--ui-font); font-size: .8rem; color: var(--ink-soft); margin-top: .35rem; }
  .deck-stats { display: flex; gap: .4rem; flex-wrap: wrap; margin: .6rem 0; font-family: var(--ui-font); font-size: .72rem; }
  .deck-stats .st { padding: .2rem .55rem; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-soft); }
  .deck-stats .fresh { color: var(--accent); border-color: var(--accent); }
  .deck-stats .leech { color: var(--danger); border-color: var(--danger); }
  .deck-stats button.export { cursor: pointer; background: var(--panel); font: inherit; color: var(--accent); border-color: var(--accent); }
  .deck-stats button.export:hover { background: var(--accent-soft); }
  .readbar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 6; pointer-events: none; }
  .readbar div { height: 100%; width: 0%; background: var(--accent); transition: width .1s linear; }
  .lib-mode .readbar { display: none; }
  ::selection { background: var(--accent-soft); }
  .sheet::-webkit-scrollbar { width: 8px; }
  .sheet::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .empty { text-align: center; padding: 1.8rem 1rem; color: var(--ink-soft); }
  #toast {
    position: fixed; left: 50%; bottom: 1.4rem; transform: translate(-50%, 300%);
    background: var(--ink); color: var(--ground); font-family: var(--ui-font);
    font-size: .84rem; font-weight: 600; padding: .6rem 1.15rem; border-radius: 999px;
    box-shadow: var(--shadow-sm); z-index: 20; transition: transform .25s ease; pointer-events: none;
    max-width: min(90vw, 24rem); text-align: center;
  }
  #toast.show { transform: translate(-50%, 0); }
  /* A story should print like a worksheet: text and translations only. */
  /* ================= design wave 2 =======================================
     The opened story gets the same cover treatment the shelf speaks: a
     level-tinted hero band around the title. Sheet tabs become a soft
     segmented pill; the sheet itself opens with a touch more spring and a
     blurred backdrop; the games hub becomes a two-up hall of door-cards.
     Everything degrades: no :has(), no color-mix, no backdrop-filter — the
     older layout simply remains. */
  body:not(.lib-mode) header.app {
    margin: 0 -1.1rem; padding: 1.2rem 1.1rem 1rem; border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    background: linear-gradient(160deg, var(--accent-soft), transparent 78%);
    border-bottom: 1px solid var(--line);
  }
  body:not(.lib-mode) header.app[data-lvlc="1"] { background: linear-gradient(160deg, color-mix(in srgb, var(--lvl1) 15%, transparent), transparent 78%); }
  body:not(.lib-mode) header.app[data-lvlc="2"] { background: linear-gradient(160deg, color-mix(in srgb, var(--lvl2) 15%, transparent), transparent 78%); }
  body:not(.lib-mode) header.app[data-lvlc="3"] { background: linear-gradient(160deg, color-mix(in srgb, var(--lvl3) 15%, transparent), transparent 78%); }
  body:not(.lib-mode) header.app[data-lvlc="4"] { background: linear-gradient(160deg, color-mix(in srgb, var(--lvl4) 15%, transparent), transparent 78%); }
  body:not(.lib-mode) h1.story-title { text-align: center; }
  body:not(.lib-mode) .story-sub { text-align: center; }
  body:not(.lib-mode) #metaRow { justify-content: center; }

  /* focus mode: reading fades the chrome; scrolling back recalls it. The
     header keeps its SPACE — collapsing it shifted the text under the
     reader's finger mid-scroll (and made taps miss), so only the pixels go. */
  body:not(.lib-mode) header.app { transition: opacity .3s ease, transform .3s ease; }
  body.focus-hide:not(.lib-mode) header.app { opacity: 0; transform: translateY(-10px); pointer-events: none; }

  .scrim.show { backdrop-filter: blur(2.5px); }
  .sheet { transition: transform .34s cubic-bezier(.22, 1.08, .36, 1); }
  .grab { width: 3rem; opacity: .8; }

  .tabs {
    gap: .3rem; background: var(--accent-soft); padding: .28rem;
    border-radius: 999px; width: max-content; max-width: 100%;
  }
  .tabs button { border-radius: 999px; padding: .38rem .85rem; border-bottom: 0; }
  .tabs button.on {
    background: var(--panel); color: var(--accent); border-bottom: 0;
    box-shadow: var(--shadow-sm);
  }

  .game-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: var(--s3); }
  .game-pick button {
    position: relative; overflow: hidden; text-align: start;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
    padding: var(--s4); cursor: pointer; color: var(--ink); min-height: var(--tap);
    transition: border-color var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease),
                transform var(--dur-base) var(--ease);
  }
  .game-pick button::after {
    content: "؟"; position: absolute; inset-inline-end: -.35rem; bottom: -1.3rem;
    font-family: var(--ar-font); font-size: 4.2rem; line-height: 1;
    color: var(--accent); opacity: .07; pointer-events: none;
  }
  .game-pick button:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
  @media (prefers-reduced-motion: no-preference) {
    .game-pick button:hover { transform: translateY(-1px); }
  }
  .game-pick .gt { font-weight: 700; font-family: var(--ui-font); }
  .game-pick .gd { color: var(--ink-soft); font-size: var(--t-sm); margin-top: var(--s1); line-height: var(--lh-body); }

  /* ================= design wave 6: the hub finds its faces ==============
     Every game card wears a small emblem and a colored spine — the muted
     role palette reused as wayfinding, so the hub reads at a glance like a
     shelf of distinct drills rather than a list of buttons. The Atölye tabs
     carry the same emblems. Keyboard users get a visible ring everywhere:
     the same accent the pointer already knows. */
  /* `hidden` is a display:none request; a later display rule silently wins,
     which is exactly how the bab row stayed visible under a mazid form. */
  .seg[hidden], [hidden] { display: none !important; }
  .alaqa-card { border-inline-start: 3px solid var(--role-hal); }
  .rz-badge {
    display: inline-block; font-size: .74rem; padding: .05rem .4rem;
    border: 1px solid var(--line); border-radius: 999px; color: var(--ink-soft);
    background: var(--accent-soft);
  }
  .deck-browse { display: grid; gap: .4rem; margin: .6rem 0 .3rem; }
  .deck-filter { flex-wrap: wrap; width: 100%; }
  .deck-filter button { font-size: .78rem; padding: .3rem .6rem; }
  .deck-filter button b { font-weight: 700; opacity: .6; margin-inline-start: .15rem; }
  .deck-filter button.on b { opacity: 1; }
  .alaqa-pair {
    display: grid; gap: .3rem; margin: .5rem 0 .2rem;
    border-inline-start: 3px solid var(--role-hal); padding: .5rem .7rem;
    background: var(--panel); border-radius: var(--radius); font-size: .92rem;
  }
  .alaqa-pair .al-lbl { color: var(--ink-soft); font-size: .8rem; margin-inline-end: .3rem; }
  .alaqa-pair b { font-family: var(--ar-font); font-size: 1.15em; }
  .alaqa-pair .al-qar { color: var(--ink-soft); font-size: .85rem; border-top: 1px solid var(--line); padding-top: .3rem; }
  .game-correct { font-weight: 700; margin-bottom: .3rem; }
  .game-correct b { font-family: var(--ar-font); font-size: 1.25em; }
  .game-wrongwhy {
    border-inline-start: 3px solid var(--role-maful); padding: .4rem .6rem;
    margin-bottom: .4rem; background: var(--accent-soft); border-radius: 6px;
    font-size: .9rem;
  }
  .quiz-return button {
    width: 100%; text-align: center; font-weight: 700;
    border: 1px dashed var(--accent); color: var(--accent);
    background: var(--accent-soft); border-radius: var(--radius); padding: .5rem;
  }
  .game-pick .gi {
    display: inline-grid; place-items: center; width: 1.7rem; height: 1.7rem;
    margin-inline-end: .45rem; border-radius: .55rem; font-size: .95rem;
    background: var(--accent-soft); vertical-align: -.35rem;
  }
  .game-pick button { border-inline-start: 3px solid var(--line); }
  .game-pick button:nth-child(8n+1) { border-inline-start-color: var(--role-fail); }
  .game-pick button:nth-child(8n+2) { border-inline-start-color: var(--role-maful); }
  .game-pick button:nth-child(8n+3) { border-inline-start-color: var(--role-mubtada); }
  .game-pick button:nth-child(8n+4) { border-inline-start-color: var(--role-khabar); }
  .game-pick button:nth-child(8n+5) { border-inline-start-color: var(--role-mudaf); }
  .game-pick button:nth-child(8n+6) { border-inline-start-color: var(--role-hal); }
  .game-pick button:nth-child(8n+7) { border-inline-start-color: var(--role-tabi); }
  .game-pick button:nth-child(8n+8) { border-inline-start-color: var(--role-jarr); }
  :is(button, [tabindex], input, select, a):focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
  }
  .tabs [data-lab] .ar { opacity: .85; }
  .tabs [data-lab]::before { font-size: .8rem; margin-inline-end: .25rem; }
  .tabs [data-lab="sarf"]::before  { content: "⚙️"; }
  .tabs [data-lab="adad"]::before  { content: "🔢"; }
  .tabs [data-lab="jadhr"]::before { content: "🌱"; }
  .tabs [data-lab="mizan"]::before { content: "⚖️"; }
  .tabs [data-lab="ism"]::before   { content: "🏷️"; }
  .tabs [data-lab="jumla"]::before { content: "🧠"; }
  .tabs [data-lab="nida"]::before  { content: "📣"; }
  .tabs [data-lab="ilal"]::before  { content: "🧪"; }
  /* the I'lal Lab: origin and outcome first, then the rules that got there */
  .ilal-flow { display: flex; align-items: center; gap: .8rem; justify-content: center;
    flex-wrap: wrap; margin: .8rem 0; padding: .8rem; border: 1px solid var(--line);
    border-radius: 14px; background: var(--panel); }
  .ilal-flow .if-end { text-align: center; }
  .ilal-flow .if-lbl { display: block; font-size: .7rem; letter-spacing: .09em;
    text-transform: uppercase; opacity: .55; margin-bottom: .15rem; }
  .ilal-flow b { font-family: var(--ar-font); font-size: 1.7rem; direction: rtl; font-weight: 400; }
  .ilal-flow .out b { color: var(--accent); font-weight: 700; }
  .ilal-flow .if-arrow { font-size: 1.3rem; opacity: .45; }
  .ilal-none { font-size: .9rem; opacity: .75; text-align: center; margin: .4rem 0; }
  .ilal-block { border: 1px solid var(--line); border-inline-start: 3px solid var(--lvl3);
    border-radius: var(--r-md); padding: var(--s3); background: var(--panel); }
  .ilal-block .ib-head { font-size: var(--t-xs); letter-spacing: var(--track-caps);
    text-transform: uppercase; font-weight: 700; opacity: .6; margin-bottom: var(--s1); }
  .ilal-block .ib-ar { font-family: var(--ar-font); font-size: var(--t-lg); direction: rtl;
    line-height: var(--lh-body); }
  .ilal-block .ib-gloss { font-size: var(--t-sm); color: var(--ink-soft); margin-top: var(--s1);
    line-height: var(--lh-body); }
  .ilal-block .ib-kind { font-size: var(--t-xs); margin-top: var(--s2); font-weight: 600;
    color: var(--accent); }
  .ilal-steps { list-style: none; margin: .2rem 0 0; padding: 0; display: grid; gap: .5rem; }
  .ilal-steps li { display: flex; gap: .6rem; border: 1px solid var(--line);
    border-radius: 12px; padding: .55rem .7rem; background: var(--panel); }
  .ilal-steps .is-n { flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent); font-weight: 700;
    font-size: .8rem; display: grid; place-items: center; }
  .ilal-steps .is-body { flex: 1; min-width: 0; }
  .ilal-steps .is-forms { font-family: var(--ar-font); font-size: 1.25rem; }
  .ilal-steps .is-to { opacity: .4; font-size: .85em; }
  .ilal-steps .is-rule { font-family: var(--ar-font); font-size: 1.05rem; direction: rtl;
    margin-top: .2rem; }
  .ilal-steps .is-gloss { font-size: .84rem; color: var(--ink-soft); margin-top: .1rem; }
  /* the model's own score, stated where the model does its work */
  .ml-score { font-size: .82rem; line-height: 1.55; opacity: .8; margin: -.2rem 0 .7rem;
    padding: .5rem .65rem; border-inline-start: 3px solid var(--accent);
    background: var(--accent-soft); border-radius: 0 10px 10px 0; }
  /* ============ design wave 8: the hub grows shelves ====================
     Twelve games is a list, not a hub. Grouping them by DISCIPLINE — the
     same four the Elo model already tracks — turns the flat grid back into
     something a learner can scan: what am I training right now? The heading
     spans the grid, so the cards keep their own responsive columns. */
  .game-group {
    grid-column: 1 / -1; display: flex; align-items: baseline; gap: .5rem;
    margin: .8rem 0 -.1rem; font-size: .74rem; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft);
  }
  .game-group:first-child { margin-top: 0; }
  .game-group .ar {
    font-family: var(--ar-font); font-size: 1.2rem; letter-spacing: 0;
    text-transform: none; font-weight: 400; color: var(--accent); opacity: .85;
  }
  .game-group::after {
    content: ""; flex: 1; height: 1px; background: var(--line); align-self: center;
  }
  /* the Nida Lab: the ruling first and large, the derivations under it */
  .nida-verdict { border: 1px solid var(--line); border-radius: 14px; padding: .8rem .9rem;
    margin: .7rem 0; background: var(--panel); }
  .nida-call { font-family: var(--ar-font); font-size: 1.7rem; line-height: 2.1;
    direction: rtl; text-align: center; margin-bottom: .5rem; }
  .nida-call .mn { background: var(--accent-soft); border-radius: 8px; padding: 0 .18em; }
  .nida-call .prt { opacity: .6; }
  .nida-row { display: flex; gap: .5rem; align-items: baseline; padding: .3rem 0;
    border-top: 1px dashed var(--line); }
  .nida-row .k { flex: 0 0 6.5rem; font-size: .78rem; letter-spacing: .04em;
    text-transform: uppercase; opacity: .6; }
  .nida-row .v { flex: 1; }
  .nida-row .v .ar { font-family: var(--ar-font); font-size: 1.15rem; direction: rtl; display: block; }
  .nida-why { font-size: .9rem; opacity: .85; margin-top: .5rem; }
  .nida-derive { display: grid; gap: .6rem; grid-template-columns: 1fr 1fr; margin-top: .6rem; }
  @media (max-width: 460px) { .nida-derive { grid-template-columns: 1fr; } }
  .nida-derive .d { border: 1px solid var(--line); border-radius: 12px; padding: .6rem .7rem; }
  .nida-derive .d h4 { margin: 0 0 .3rem; font-size: .8rem; opacity: .7; font-weight: 600; }
  .nida-derive .d .frm { font-family: var(--ar-font); font-size: 1.5rem; direction: rtl; }
  .nida-derive .d .sub { font-size: .78rem; opacity: .65; margin-top: .2rem; }
  .nida-bad { border: 1px solid var(--danger); border-radius: 12px; padding: .6rem .7rem;
    margin: .7rem 0; font-size: .92rem; }
  .nida-bad .fix { font-family: var(--ar-font); font-size: 1.3rem; direction: rtl; display: block; margin-top: .3rem; }

  /* The nakil table's two chapters: section rows read as headings, and the
     verb's own bab glows the accent it earned. */
  table.conj.nakil .nakil-sec th {
    text-align: center; font-family: var(--ar-font); font-size: 1.02rem;
    padding-top: .8rem; color: var(--ink-soft); border-bottom: 1px solid var(--line);
  }
  table.conj.nakil tr.own-bab td, table.conj.nakil tr.own-bab th {
    background: var(--accent-soft);
  }
  table.conj.nakil tr.own-bab .nakil-out { color: var(--accent); }

  /* The ziyade extension rows: set off from the fourteen by a rule and a
     whisper of the accent — the recitation's second breath. */
  table.conj.muhtelife tr:not(.ext) + tr.ext td, table.conj.muhtelife tr:not(.ext) + tr.ext th { border-top: 2px solid var(--line); }
  table.conj.muhtelife tr.ext th { font-style: italic; }

  /* ================= design wave 3: the learning loop ====================
     The review card becomes a CARD — a lifted face on a stacked deck, the
     word held in the middle of a soft glow, the next cards peeking out
     beneath. Grades speak in four colours (the SRS's own temperament:
     again/hard/good/easy). Quiz options become cards that lift, and the
     right answer rings instead of merely tinting. */
  .deck-card {
    position: relative; text-align: center;
    border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 2rem 1.2rem 0; margin: 1.1rem 2px .9rem;
    background: radial-gradient(120% 95% at 50% 0%, var(--accent-soft), transparent 62%) var(--panel);
    box-shadow: var(--shadow-sm);
  }
  .deck-card::before, .deck-card::after {
    content: ""; position: absolute; z-index: -1; height: 16px;
    border: 1px solid var(--line); background: var(--panel);
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  }
  .deck-card::before { inset: auto 5% -6px 5%; opacity: .8; }
  .deck-card::after { inset: auto 10% -12px 10%; opacity: .5; }
  .deck-card .front { font-size: 2.7rem; line-height: 1.9; }
  .deck-card .step {
    margin-top: 1.1rem; padding: .55rem 0 .7rem;
    border-top: 1px dashed var(--line); font-size: .72rem; letter-spacing: .03em;
  }
  .deck-card .verb-answer, .deck-card .note-ex-gloss { margin-top: .3rem; }
  .grade-row { gap: .45rem; }
  .grade-row .btn.grade {
    border-radius: 12px; border-width: 1.5px; padding: .6rem .2rem .55rem;
    transition: transform .12s, box-shadow .12s, background .12s;
  }
  .grade-row .btn.grade:hover { box-shadow: var(--shadow-sm); }
  @media (prefers-reduced-motion: no-preference) {
    .grade-row .btn.grade:hover { transform: translateY(-1px); }
  }
  .grade-row .hard { border-color: var(--lvl3); color: var(--lvl3); }
  .grade-row .good { border-color: var(--ok); color: var(--ok); }
  .grade-row .again:hover { background: color-mix(in srgb, var(--danger) 8%, transparent); }
  .grade-row .hard:hover  { background: color-mix(in srgb, var(--lvl3) 8%, transparent); }
  .grade-row .good:hover  { background: color-mix(in srgb, var(--ok) 8%, transparent); }
  .grade-row .easy:hover  { background: var(--accent-soft); }
  .deck-list li { padding: .55rem .35rem; border-radius: 10px; border-bottom-color: transparent; transition: background .12s; }
  .deck-list li + li { border-top: 1px solid var(--line); }
  .deck-list li:hover { background: var(--accent-soft); }
  .deck-list button {
    border: 1px solid transparent; border-radius: 999px; padding: .15rem .55rem;
    transition: border-color .12s, background .12s;
  }
  .deck-list button:hover { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 7%, transparent); }

  .game-q {
    text-align: center; background: var(--accent-soft);
    border-radius: var(--radius); padding: .9rem .8rem; margin: .5rem 0 .8rem;
  }
  .opts button {
    border-radius: 12px; padding: .7rem .9rem;
    transition: border-color .12s, background .12s, transform .12s, box-shadow .12s;
  }
  .opts button:hover:not(.right):not(.wrongpick) { box-shadow: var(--shadow-sm); }
  @media (prefers-reduced-motion: no-preference) {
    .opts button:hover:not(.right):not(.wrongpick) { transform: translateY(-1px); }
  }
  .opts button.right {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 30%, transparent);
  }
  .opts button.wrongpick {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 22%, transparent);
  }
  #qWhy {
    border-inline-start: 3px solid var(--accent); background: var(--accent-soft);
    border-radius: 0 var(--radius) var(--radius) 0; padding: .6rem .8rem; margin: .6rem 0;
  }
  #qWhy:empty, #qWhy[hidden] { display: none; }
  /* A saved word's underline turns the deck's green in every story — the
     page shows what is already yours (and flips live on save/remove). */
  .underlines .word.in-deck { text-decoration-color: color-mix(in srgb, var(--ok) 62%, transparent); }
  .word.in-deck:hover { background: color-mix(in srgb, var(--ok) 9%, transparent); }
  /* The card's birth-sentence, shown on reveal: the word at home. */
  .card-ctx {
    font-family: var(--ar-font); font-size: 1.3rem; line-height: 2.1;
    margin: .55rem auto 0; max-width: 32rem; color: var(--ink-soft);
  }
  .card-ctx b { color: var(--accent); font-weight: 700; }
  .card-ctx { cursor: pointer; border-radius: 8px; padding: .15rem .4rem; transition: background .12s; }
  .card-ctx:hover { background: var(--accent-soft); }

  /* The Sarf Lab: one root box, two segmented rows, and the recitation. */
  .conj-lab { display: flex; flex-direction: column; gap: .55rem; margin: .4rem 0 .8rem; }
  .conj-lab input {
    font-family: var(--ar-font); font-size: 1.6rem; text-align: center;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--ground);
    color: var(--ink); padding: .45rem .8rem; letter-spacing: .35em;
  }
  .conj-lab input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  .conj-seg { flex-wrap: wrap; }
  /* The attested dot: the bab/form the corpus actually recites this root in.
     Visible even when the learner clicks away to explore another bab. */
  .conj-seg button.attested::after { content: " ●"; font-size: .55em; color: var(--ok); vertical-align: middle; }
  .conj-seg button.attested.on::after { color: var(--accent-ink); }
  .conj-known {
    font-family: var(--ui-font); font-size: .82rem; line-height: 1.45;
    color: var(--ok); background: color-mix(in srgb, var(--ok) 9%, transparent);
    border-radius: 10px; padding: .45rem .65rem; margin: .5rem 0;
  }
  .conj-known b { font-family: var(--ar-font); font-size: 1.05rem; }
  .conj-known.other { color: var(--ink-soft); background: var(--accent-soft); }
  /* the Aded Lab: the composed number-name large, the counted phrase beneath */
  .adad-big {
    font-family: var(--ar-font); font-size: 1.7rem; text-align: center;
    margin: .8rem 0 .3rem; color: var(--ink);
  }
  .adad-phrase {
    font-family: var(--ar-font); font-size: 1.35rem; text-align: center;
    color: var(--accent); background: var(--accent-soft);
    border-radius: 10px; padding: .45rem .7rem; margin: .4rem 0 .6rem;
  }
  .adad-q b { font-size: 1.5em; margin-inline-end: .3rem; }
  .conj-lab input[type="number"] {
    font-family: var(--ui-font); letter-spacing: .1em; direction: ltr;
  }
  .fsrs-note { font-family: var(--ui-font); font-size: .68rem; color: var(--ink-soft); margin: -.2rem 0 .6rem; }
  .retention-seg { align-items: center; margin: 0 0 .7rem; font-size: .72rem; }
  .retention-seg .ret-lbl { font-family: var(--ui-font); color: var(--ink-soft); padding: 0 .55rem; }
  .fade-note {
    font-family: var(--ui-font); font-size: .78rem; color: var(--accent);
    background: var(--accent-soft); border-radius: 8px; padding: .35rem .6rem; margin: .4rem 0;
  }
  /* the form-in-the-text block: surface form beside the lemma, with the
     cell's name and the meaning of THAT form */
  .intext {
    border: 1px solid var(--line); border-inline-start: 3px solid var(--accent);
    border-radius: 10px; padding: .5rem .7rem; margin: .6rem 0; background: var(--panel);
  }
  .intext .it-head { font-family: var(--ui-font); font-size: .68rem; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: .2rem; }
  .intext .it-row { display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; }
  .intext .it-ar { font-family: var(--ar-font); font-size: 1.5rem; color: var(--accent); }
  .intext .it-gloss { font-family: var(--ui-font); font-size: .95rem; font-weight: 600; }
  .intext .it-cell { font-family: var(--ui-font); font-size: .78rem; color: var(--ink-soft); margin-top: .15rem; }
  .game-pick .gd.fade { color: var(--accent); font-size: .76rem; }
  /* design wave: the shelf breathes in — staggered card entrance, hover lift */
  @media (prefers-reduced-motion: no-preference) {
    .lib-card { animation: cardIn .45s cubic-bezier(.2,.7,.3,1) backwards; }
    .lib-card:nth-child(2)  { animation-delay: .04s; }
    .lib-card:nth-child(3)  { animation-delay: .08s; }
    .lib-card:nth-child(4)  { animation-delay: .12s; }
    .lib-card:nth-child(5)  { animation-delay: .16s; }
    .lib-card:nth-child(6)  { animation-delay: .20s; }
    .lib-card:nth-child(7)  { animation-delay: .24s; }
    .lib-card:nth-child(8)  { animation-delay: .28s; }
    .lib-card:nth-child(n+9){ animation-delay: .32s; }
    .lib-card { transition: transform .18s ease, box-shadow .18s ease; }
    .lib-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } }
  .conj-h {
    text-align: center; font-family: var(--ar-font); font-weight: 600;
    font-size: 1.05rem; margin: .9rem 0 .2rem; color: var(--ink-soft);
  }

  .empty { position: relative; padding-top: 2.6rem; }
  .empty::before {
    content: "﴿ ﴾"; position: absolute; top: .7rem; left: 50%; transform: translateX(-50%);
    letter-spacing: .35em; color: var(--accent); opacity: .45; font-size: .9rem;
  }

  @media print {
    nav.controls, .legend, footer.note, .readbar, .sent-tools .play,
    .peek, .ch-nav, #toast, .scrim, .sheet { display: none !important; }
    body { background: #fff; color: #000; }
    section.sentence { break-inside: avoid; margin: .7rem 0; }
    .wrap { max-width: none; padding: 0; }
  }
  .jumla-row { transition: border-color .12s; }
  .jumla-row:hover { border-color: var(--accent); }
  .ref-list button { border-radius: 8px; transition: background .12s; }
  .grade-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: .35rem; margin: .8rem 0; }
  .grade-row .btn.grade { display: flex; flex-direction: column; align-items: center; gap: .12rem; padding: .5rem .2rem; }
  .grade-row .btn.grade b { font-size: .8rem; }
  .grade-row .btn.grade i { font-style: normal; font-size: .66rem; color: var(--ink-soft); }
  .grade-row .again { border-color: var(--danger); color: var(--danger); }
  .grade-row .easy  { border-color: var(--accent); color: var(--accent); }
  .verb-ask { font-family: var(--ui-font); font-size: .85rem; color: var(--ink-soft); margin-top: .5rem; }
  .verb-answer { font-family: var(--ar-font); font-size: 1.8rem; direction: rtl; margin-top: .3rem; }
  .note-ex-gloss { font-family: var(--ui-font); font-size: .82rem; color: var(--ink-soft); margin-top: .25rem; }
  .game-q .sigha { font-family: var(--ui-font); font-size: .85rem; color: var(--accent); margin-top: .35rem; }
  .game-q .target { color: var(--accent); border-bottom: 2px solid var(--accent); }
  table.conj.muhtelife th.person { text-align: start; font-family: var(--ui-font); font-size: .78rem; white-space: nowrap; }
  table.conj.muhtelife td { font-size: 1.25rem; text-align: right; direction: rtl; }
  table.conj.muhtelife tr.majhul th, table.conj.muhtelife tr.majhul td { background: var(--accent-soft); }
  table.conj {
    width: 100%; border-collapse: collapse; direction: rtl;
    font-family: var(--ar-font); font-size: 1.15rem;
  }
  table.conj th {
    font-family: var(--ui-font); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-soft); font-weight: 600; padding: .3rem .5rem; text-align: center;
    border-bottom: 1px solid var(--line);
  }
  table.conj th.person { font-family: var(--ar-font); font-size: .95rem; letter-spacing: 0; text-transform: none; text-align: right; }
  table.conj td { padding: .35rem .5rem; text-align: center; border-bottom: 1px solid var(--line); }
  table.conj td.hl { background: var(--accent-soft); border-radius: 8px; color: var(--accent); font-weight: 600; }
  .sarf-note { font-size: .85rem; color: var(--ink-soft); font-family: var(--ui-font); margin-top: .6rem; }

  /* ---------- i'rab ---------- */
  .irab-ar { direction: rtl; text-align: right; font-family: var(--ar-font); font-size: 1.25rem; line-height: 2;
    background: var(--accent-soft); border-radius: 10px; padding: .6rem .9rem; margin: .5rem 0; }
  .irab-en { font-size: .9rem; color: var(--ink-soft); }

  /* ---------- sentence i'rab sheet ---------- */
  .sheet-line { direction: rtl; text-align: right; font-family: var(--ar-font); font-size: 1.35rem;
    line-height: 2; margin: .5rem 0 .2rem; }
  .sheet-tr { font-family: var(--ui-font); font-size: .88rem; color: var(--ink-soft); margin-bottom: .8rem; }
  table.irab-sheet { width: 100%; border-collapse: collapse; font-family: var(--ui-font); font-size: .85rem; }
  table.irab-sheet th { text-align: start; font-size: .66rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-soft); font-weight: 600; padding: 0 .4rem .35rem; border-bottom: 1px solid var(--line); }
  table.irab-sheet td { padding: .5rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.irab-sheet tr:last-child td { border-bottom: none; }
  table.irab-sheet td.n { color: var(--ink-soft); font-size: .75rem; width: 1.6rem;
    font-variant-numeric: tabular-nums; }
  table.irab-sheet td.w { font-family: var(--ar-font); font-size: 1.2rem; direction: rtl; text-align: right;
    white-space: nowrap; }
  table.irab-sheet td.w small { display: block; font-family: var(--ui-font); font-size: .68rem;
    direction: ltr; text-align: start; color: var(--ink-soft); white-space: normal; }
  table.irab-sheet .ir-ar { font-family: var(--ar-font); font-size: 1.05rem; direction: rtl; text-align: right;
    display: block; margin-bottom: .2rem; }
  table.irab-sheet button.jump { all: unset; cursor: pointer; color: var(--accent); font-size: .7rem;
    font-family: var(--ui-font); }
  table.irab-sheet button.jump:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sheet-topics { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .9rem; }

  /* ---------- corpus search ---------- */
  .hit-lex { display: flex; align-items: baseline; gap: .5rem; margin: 1rem 0 .3rem;
    padding-bottom: .3rem; border-bottom: 1px solid var(--line); }
  .hit-lex .hl-ar { font-family: var(--ar-font); font-size: 1.3rem; }
  .hit-lex .hl-gl { font-family: var(--ui-font); font-size: .82rem; color: var(--ink-soft); flex: 1; }
  .hit-lex .hl-n { font-family: var(--ui-font); font-size: .7rem; color: var(--ink-soft);
    font-variant-numeric: tabular-nums; }
  .hit { all: unset; display: block; cursor: pointer; width: 100%; box-sizing: border-box;

const GRAMMAR = {"afal-khamsa":{"title":{"ar":"الْأَفْعَالُ الْخَمْسَةُ","en":"The five verbs (raf' by the nun)","tr":"Emsile-i Hamse (beş fiil)"},"level":3,"group":"sarf","explanation":{"en":"Five mudari' patterns end in a pronoun plus nun: يَفْعَلَانِ، تَفْعَلَانِ، يَفْعَلُونَ، تَفْعَلُونَ، تَفْعَلِينَ. In these the ending vowels cannot move, so the nun itself becomes the i'rab sign: its PRESENCE is raf' (ثُبُوتُ النُّونِ), its DROPPING is both nasb and jazm (حَذْفُ النُّونِ) — فَإِنْ لَمْ تَفْعَلُوا وَلَنْ تَفْعَلُوا shows the same حذف under لَمْ and لَنْ alike. That is why a reader cannot tell nasb from jazm by the verb's shape here: only the governor before it decides. The waw, alif or ya that remains is the fa'il, a pronoun in the position of raf'. The madrasah calls these الأمثلة الخمسة — five EXAMPLES, two of them (تفعلان، and the shared يفعلان pattern) covering both genders.","tr":"Beş muzâri kalıbı zamir + nûn ile biter: يَفْعَلَانِ، تَفْعَلَانِ، يَفْعَلُونَ، تَفْعَلُونَ، تَفْعَلِينَ. Bunlarda son hareke oynayamaz; bu yüzden i'rab alâmeti nûnun kendisidir: nûnun SÜBUTU ref (ثُبُوتُ النُّونِ), DÜŞMESİ hem nasb hem cezmdir (حَذْفُ النُّونِ) — فَإِنْ لَمْ تَفْعَلُوا وَلَنْ تَفْعَلُوا âyetinde لَمْ ile لَنْ altında aynı hazf görülür. Bu sebeple burada nasb ile cezm fiilin şeklinden ayırt edilemez: hükmü yalnız baştaki âmil verir. Geriye kalan vâv, elif yahut yâ fâildir — mahallen merfû zamirdir. Medrese bunlara el-Emsiletü'l-Hamse der."},"plain":{"en":"Present verbs ending in -ani, -una or -ina (they-two do, they do, you-fem do) show their case with the NUN: nun present = raf', nun dropped = nasb or jazm.","tr":"Sonu -âni, -ûne, -îne ile biten muzâriler (yaparlar-iki, yaparlar, yaparsın-müennes) i'rabını NÛN ile gösterir: nûn duruyorsa ref, düşmüşse nasb veya cezm."},"sources":["قطر الندى (ابن هشام) — إعراب الأمثلة الخمسة","الكافية (ابن الحاجب)"],"examples":[{"ar":"هُمْ يَعْمَلُونَ الصَّالِحَاتِ.","gloss":{"en":"They do righteous deeds — raf' shown by the nun rincinin DÖNÜŞTÜĞÜ şeydir. Gramerciler bunlara tasyîr fiilleri der: صَيَّرَ، جَعَلَ، اتَّخَذَ، رَدَّ، تَرَكَ. Ölçü şudur: iki mef'ûl, fiilden soyutlandığında sağlam bir isim cümlesi verir: يُصَيِّرُ الْقَلِيلَ كَثِيرًا, aslı الْقَلِيلُ كَثِيرٌ'dur. İkinci mef'ûlün burada nekre olmasının sebebi budur — o bir haberdir, adı konmuş bir nesne değil. Daha geniş aile (kalp fiilleri: ظَنَّ، حَسِبَ، عَلِمَ، رَأَى) aynı şekilde çalışır, fakat değişimi değil bir kanaati bildirir: ظَنَنْتُ الْأَمْرَ سَهْلًا."},"plain":{"en":"A handful of verbs take two objects, and the second is what the first turns into: «it makes the few of verbs many».","tr":"Birkaç fiil iki mef'ûl alır ve ikincisi, birincinin dönüştüğü şeydir: «fiillerin azını çok kılar»."},"mamul":"mansub","sources":["الكافية (ابن الحاجب)","المنصوبات","قطر الندى (ابن هشام)","الفوائد الضيائية (ملا جامي)"],"examples":[{"ar":"لِأَنَّهُ يُصَيِّرُ الْقَلِيلَ مِنَ الْأَفْعَالِ كَثِيرًا.","gloss":{"en":"Because it turns the few of verbs into many — al-Maqsud's reason for studying sarf; الْقَلِيلَ is the first object and كَثِيرًا the second.","tr":"Zira az olan fiilleri çok kılar — Maksûd'un sarf öğrenme gerekçesi; الْقَلِيلَ birinci, كَثِيرًا ikinci mef'ûldür."},"src":"min-muqaddimat-al-maqsud"},{"ar":"جَعَلَ اللَّهُ الْمَاءَ طَهُورًا.","gloss":{"en":"Allah made water purifying — from الْمَاءُ طَهُورٌ.","tr":"Allah suyu temizleyici kıldı — الْمَاءُ طَهُورٌ cümlesinden."},"src":null},{"ar":"ظَنَنْتُ الْأَمْرَ سَهْلًا.","gloss":{"en":"I thought the matter easy — the same two-object shape, reporting a belief.","tr":"İşi kolay zannettim — aynı iki mef'ûllü yapı, bir kanaati haber verir."},"src":null}],"mistakes":[{"wrong":"يُصَيِّرُ الْقَلِيلَ الْكَثِيرَ","right":"يُصَيِّرُ الْقَلِيلَ كَثِيرًا","why":{"en":"The second object is a predicate, so it stays indefinite. Making it definite reads as two separate things being acted on.","tr":"İkinci mef'ûl bir haberdir, bu yüzden nekre kalır. Marife yapılırsa üzerinde iş yapılan iki ayrı şey gibi okunur."}},{"wrong":"يُصَيِّرُ الْقَلِيلَ كَثِيرٌ","right":"يُصَيِّرُ الْقَلِيلَ كَثِيرًا","why":{"en":"Both objects are mansub. Leaving the second in raf' treats it as the original khabar, forgetting that the verb has taken the sentence over.","tr":"Her iki mef'ûl de mansubdur. İkincisi merfû bırakılırsa asıl haber sanılır; hâlbuki fiil cümleyi kendi amelini altına almıştır."}},{"wrong":"يُصَيِّرُ الْقَلِيلَ إِلَى كَثِيرٍ","right":"يُصَيِّرُ الْقَلِيلَ كَثِيرًا","why":{"en":"No preposition is needed: the transformation is carried by the second object itself. Adding إِلَى copies the Turkish or English «into».","tr":"Harf-i cere gerek yoktur: dönüşümü ikinci mef'ûlün kendisi taşır. إِلَى eklemek Türkçedeki «-e» ekini kopyalamaktır."}}]},"al-muthanna":{"title":{"ar":"الْمُثَنَّى وَإِعْرَابُهُ","en":"The dual and how it is declined","tr":"Tesniye ve i'râbı"},"level":2,"group":"nahw","explanation":{"en":"The dual (الْمُثَنَّى) is formed by adding ـَانِ to the singular for raf' and ـَيْنِ for nasb and jarr: مُسْلِمٌ → مُسْلِمَانِ، مُسْلِمَيْنِ. Its i'rab is by LETTERS, not by vowels — which is why it belongs with the five nouns and the sound masculine plural in the chapter on الْإِعْرَابُ بِالْحُرُوفِ. A feminine singular keeps its ta before the ending: مَخْلُوقَةٌ → مَخْلُوقَتَانِ. In idafa the nun DROPS (كِتَابَا الطَّالِبِ, not كِتَابَانِ الطَّالِبِ), exactly as the sound masculine plural's nun drops. The dual VERB works the same way: يَفْنَيَانِ belongs to الْأَفْعَالُ الْخَمْسَةُ — the five verbs that take raf' by the RETAINED NUN and nasb or jazm by DROPPING it (لَنْ يَفْنَيَا، لَمْ يَفْنَيَا). The dual alif inside such a verb is not a letter of i'rab but the FA'IL itself: أَلِفُ الِاثْنَيْنِ. Beside the true dual stand words dual in form only — اثْنَانِ، كِلَا، كِلْتَا — which the books treat with the dual's endings though they have no singular of that shape.","tr":"Tesniye, müfrede ref hâlinde ـَانِ, nasb ve cer hâlinde ـَيْنِ eklenerek yapılır: مُسْلِمٌ → مُسْلِمَانِ، مُسْلِمَيْنِ. İ'râbı harekeyle değil HARFLE olur; bu yüzden esmâ-i hamse ve cem'-i müzekker-i sâlim ile birlikte «harfle i'râb» bahsinde yer alır. Müennes müfred, tâsını koruyarak eki alır: مَخْلُوقَةٌ → مَخْلُوقَتَانِ. İzâfette nûn DÜŞER (كِتَابَا الطَّالِبِ, كِتَابَانِ الطَّالِبِ değil) — tıpkı cem'-i müzekker-i sâlimin nûnu gibi. Tesniye FİİL de aynı yolu tutar: يَفْنَيَانِ, EF'ÂL-İ HAMSE'dendir; bunlar nûnun SÜBÛTUYLA merfû, nûnun HAZFİYLE mansub yahut meczum olurlar (لَنْ يَفْنَيَا، لَمْ يَفْنَيَا). Böyle bir fiildeki tesniye elifi i'râb harfi değil, bizzat FÂİLDİR: elif-i isneyn. Gerçek tesniyenin yanında bir de sadece şeklen tesniye olanlar vardır — اثْنَانِ، كِلَا، كِلْتَا — ki kitaplar bunları, o vezinde müfredleri bulunmasa da tesniye ekleriyle ele alır."},"plain":{"en":"Arabic counts to two with a form of its own. The dual takes ALIF in raf' and YA in nasb and jarr — never a haraka.","tr":"Arapça ikiyi kendine mahsus bir kalıpla sayar. Tesniye ref hâlinde ELİF, nasb ve cer hâlinde YÂ alır — asla hareke almaz."},"sources":["الكافية (ابن الحاجب)","قطر الندى (ابن هشام)","العوامل (البيركوي)"],"question":{"tr":["Kelime ـَانِ mi ـَيْنِ mi ile bitiyor? Tesniyedir.","Fiilin sonunda nûn var mı? Ef'âl-i hamseden olabilir."],"en":["Does it end in ـَانِ or ـَيْنِ? Then it is a dual.","Does the verb keep a final nun? It may be one of the five verbs."]},"examples":[{"ar":"وَهُمَا مَخْلُوقَتَانِ مَوْجُودَتَانِ بَاقِيَتَانِ.","gloss":{"en":"Three duals in a row, all in raf' by the ALIF — the feminine ta is kept before the ending.","tr":"Peş peşe üç tesniye, hepsi ELİF ile merfû — müenneslik tâsı ekten önce korunur."},"src":"aqaid-ahl-al-sunna"},{"ar":"لَا تَفْنَيَانِ وَلَا يَفْنَى أَهْلُهُمَا.","gloss":{"en":"The dual VERB: raf' by the retained nun, and the alif inside it is the fa'il, not a sign of i'rab.","tr":"Tesniye FİİL: nûnun sübûtuyla merfû; içindeki elif i'râb alâmeti değil, fâilin ta kendisidir."},"src":"aqaid-ahl-al-sunna"},{"ar":"حَوْضِي مَسِيرَةُ شَهْرٍ وَزَوَايَاهُ سَوَاءٌ.","gloss":{"en":"Contrast: زَوَايَا is a broken PLURAL, not a dual — the alif here is part of the pattern, and it declines by estimated vowels.","tr":"Karşılaştırın: زَوَايَا tesniye değil cem'-i mükesserdir — buradaki elif vezindendir ve takdîrî hareke ile i'râb alır."},"src":"aqaid-ahl-al-sunna"}],"mistakes":[{"wrong":"رَأَيْتُ الْمُسْلِمَانِ","right":"رَأَيْتُ الْمُسْلِمَيْنِ","why":{"en":"The dual takes the alif ONLY in raf'. After a verb that governs an object, it is mansub — and its nasb sign is the ya.","tr":"Tesniye elifi YALNIZ ref hâlinde alır. Mef'ûl alan bir fiilden sonra mansubdur ve nasb alâmeti yâdır."}},{"wrong":"كِتَابَانِ الطَّالِبِ","right":"كِتَابَا الطَّالِبِ","why":{"en":"In idafa the dual's nun drops, just as the sound masculine plural's does. Keeping it is the commonest slip in the chapter.","tr":"İzâfette tesniyenin nûnu düşer; cem'-i müzekker-i sâlimde olduğu gibi. Nûnu bırakmak bu bahsin en yaygın hatasıdır."}}]},"an-masdariyya":{"title":{"ar":"أَنْ الْمَصْدَرِيَّة","en":"'an + subjunctive","tr":"أَنْ masdariyye + mansub muzâri"},"level":2,"group":"awamil","explanation":{"en":"أَنْ turns a verb into the equivalent of a masdar (\"that he return\" = \"his returning\") and forces the present verb into the subjunctive (mansub): a fatha replaces the final damma. In Birgivi's Awamil it is listed first among the four nasb particles: أَنْ، لَنْ، كَيْ، إِذَنْ. The whole clause then acts as a noun — in this story, أَنْ يَرْجِعَ is the object of أَرَادَ.","tr":"أَنْ fiili masdar hükmüne sokar ve muzariyi nasbeder: son ötre fetha olur. Birgivî'nin Avâmil'inde nasb edatlarının ilki sayılır: أَنْ، لَنْ، كَيْ، إِذَنْ. Cümle isim gibi işlem görür — bu hikâyede أَنْ يَرْجِعَ, أَرَادَ fiilinin mef'ulüdür."},"plain":{"en":"أَنْ before a present verb turns the clause into a noun — «to return» — and changes the verb's ending.","tr":"Muzârinin başındaki أَنْ cümleyi isme çevirir — «dönmek» — ve fiilin sonunu değiştirir."},"amil":"مِنْ نَوَاصِبِ الْمُضَارِعِ — a governor (amil) that puts the following verb in nasb","sources":["عوامل البركوي — النواصب الأربعة: أَنْ لَنْ كَيْ إِذَنْ","الكافية (ابن الحاجب) — الحروف المصدرية"],"examples":[{"ar":"أَرَادَ يُوسُفُ أَنْ يَرْجِعَ.","gloss":{"en":"Yusuf wanted to return.","tr":"Yusuf dönmek istedi."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"أُحِبُّ أَنْ أَقْرَأَ.","gloss":{"en":"I love to read.","tr":"Okumayı severim."},"src":null},{"ar":"يَجِبُ أَنْ تَذْهَبُوا.","gloss":{"en":"You (pl.) must go — the نون drops: تَذْهَبُونَ → تَذْهَبُوا.","tr":"Gitmeniz gerekir — nûn düşer: تَذْهَبُونَ → تَذْهَبُوا."},"src":null}],"mistakes":[{"wrong":"أراد أن يرجعُ","right":"أراد أن يرجعَ","why":{"en":"The damma stays by habit. After أَنْ the verb is mansub: fatha, not damma.","tr":"Ötre alışkanlıkla kalıyor; أَنْ'den sonra fiil mansubdur: fetha, ötre değil."}},{"wrong":"أريد أَنَّ أذهبَ","right":"أريد أَنْ أذهبَ","why":{"en":"Confusing أَنْ (with verbs) and أَنَّ (with a following noun, from the إنّ family). Before a verb use أَنْ.","tr":"أَنْ (fiille) ile أَنَّ (isimle, إنّ ailesinden) karıştırılıyor. Fiilden önce أَنْ kullanılır."}},{"wrong":"يجب أن تذهبونَ","right":"يجب أن تذهبوا","why":{"en":"The five verbs (الأفعال الخمسة) mark nasb by dropping the ن — keeping it is a very common error.","tr":"Ef'al-i hamse nasbı نون düşmesiyle gösterir: تذهبون → أن تذهبوا."}}]},"anwa-al-jumal":{"title":{"ar":"أَنْوَاعُ الْجُمَلِ وَمَحَلُّهَا مِنَ الْإِعْرَابِ","en":"Kinds of clauses, and their place in i'rab","tr":"Cümle çeşitleri ve i'rabdan mahalleri"},"level":6,"group":"nahw","explanation":{"en":"A sentence that begins with a noun is ISMIYYA; with a verb, FI'LIYYA. Ibn Hisham's Qawa'id al-I'rab then divides all clauses into two sevens. Clauses WITH a place in i'rab: (1) a khabar clause — raf' after a mubtada or إِنَّ, nasb after كَانَ; (2) a hal clause — nasb; (3) an object clause — nasb, chiefly the quoted speech after قَالَ; (4) a mudaf-ilayh clause — jarr, after إِذَا، لَمَّا، حَيْثُ; (5) the answer of a JAZM condition — jazm, but only when it is tied on with فَ or the إِذَا of surprise; (6) a clause standing as sifa to a noun — matching its noun's case; (7) any clause joined by atf to one of these. Clauses WITHOUT a place: (1) the opener (ibtida'iyya / isti'nafiyya); (2) the sila of a relative — including the sila of a harfi mawsul like أَنْ; (3) the parenthetical (mu'tarida), such as a دُعَاء dropped mid-sentence; (4) the explanatory (tafsiriyya); (5) the answer of an oath; (6) the answer of a NON-jazm condition (لَوْ، لَوْلَا، إِذَا) — and the answer of a jazm condition NOT tied on with فَ; (7) whatever follows one of these by atf. The i'rab sheet of every analysed sentence in this app names its clauses by exactly this list.","tr":"İsimle başlayan cümle İSMİYYE, fiille başlayan FİİLİYYE'dir. İbn Hişâm'ın Kavâidü'l-İ'râb'ı bütün cümleleri iki yediliye ayırır. İ'rabdan MAHALLİ OLAN cümleler: (1) haber cümlesi — mübteda ve إِنَّ'den sonra ref, كَانَ'den sonra nasb; (2) hâl cümlesi — nasb; (3) mef'ûl cümlesi — nasb, en çok قَالَ'den sonraki makûlü'l-kavl; (4) muzâfun ileyh cümlesi — cer, إِذَا، لَمَّا، حَيْثُ'den sonra; (5) CEZM eden şartın cevabı — yalnız فَ yahut izâ-i fücâiyye ile bağlandığında cezm; (6) bir isme sıfat olan cümle — mevsufunun i'rabınca; (7) bunlardan birine atıfla bağlanan cümle. MAHALLİ OLMAYAN cümleler: (1) ibtidâiyye/isti'nâfiyye; (2) sıla cümlesi — أَنْ gibi harfî mevsûlün sılası dahil; (3) mu'tarıza (ara) cümlesi — cümle ortasına düşen duâ gibi; (4) tefsiriyye; (5) kasemin cevabı; (6) cezmedici OLMAYAN şartın (لَوْ، لَوْلَا، إِذَا) cevabı — ve cezmedici şarta فَ'sız gelen cevap; (7) bunlara tâbi olan. Bu uygulamada tahlilli her cümlenin i'rab sayfası, cümleleri tam bu listeyle adlandırır."},"plain":{"en":"A whole clause can sit where a single word would sit — as a khabar, a hal, an object — and then it takes that word's case «by position». Other clauses (openers, relative clauses, asides) sit nowhere, and have no case at all.","tr":"Bütün bir cümle, tek bir kelimenin oturacağı yere oturabilir — haber, hâl, mef'ûl olarak — ve o kelimenin i'rabını «mahallen» alır. Başka cümleler (başlangıç, sıla, ara cümleleri) hiçbir yere oturmaz; onların i'rabdan mahalli yoktur."},"sources":["الإعراب عن قواعد الإعراب (ابن هشام) — الباب الأول","مغني اللبيب (ابن هشام)"],"examples":[{"ar":"هٰذِهِ وَصِيَّةُ الْإِمَامِ — رَحِمَهُ اللهُ — لِتِلْمِيذِهِ.","gloss":{"en":"The opener is an ismiyya with no place in i'rab; «may Allah have mercy on him» is a mu'tarida — also i'rabless, an aside of supplication.","tr":"Baştaki cümle ismiyye-ibtidâiyyedir, mahalli yoktur; «رحمه الله» mu'tarızadır — duâ arası, onun da mahalli yoktur."},"src":"wasiyyat-abi-hanifa-samti"},{"ar":"كَأَنِّي بِكَ وَقَدْ دَخَلْتَ بَصْرَةَ.","gloss":{"en":"«You have entered Basra» is a hal clause — in the position of nasb, licensed by the waw and قَدْ.","tr":"«دخلت بصرة» hâl cümlesidir — vâv ve قَدْ ile mahallen mensubtur."},"src":null}],"mistakes":[{"wrong":"جُمْلَةُ الصِّلَةِ فِي مَحَلِّ رَفْعٍ","right":"جُمْلَةُ الصِّلَةِ لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ","why":{"en":"The relative NOUN takes the case; its sila never does. Giving the sila a mahall doubles one seat of i'rab into two.","tr":"İ'rabı alan İSM-İ MEVSÛLDÜR; sılası asla almaz. Sılaya mahall vermek, tek i'rab makamını ikiye katlamaktır."}},{"wrong":"مَتَى أَسَأْتَ صَارُوا لَكَ أَعْدَاءً — جُمْلَةُ الْجَوَابِ فِي مَحَلِّ جَزْمٍ","right":"جُمْلَةُ الْجَوَابِ لَا مَحَلَّ لَهَا لِأَنَّهَا لَمْ تَقْتَرِنْ بِالْفَاءِ","why":{"en":"Only an answer tied on with فَ (or the إِذَا of surprise) occupies the position of jazm; a bare answer leaves the jazm on the verb itself and the clause i'rabless.","tr":"Yalnız فَ (yahut izâ-i fücâiyye) ile bağlanan cevap cezm mahallini tutar; çıplak cevapta cezm fiilin kendisindedir, cümlenin mahalli yoktur."}}]},"anwa-al-khabar":{"title":{"ar":"أَنْوَاعُ الْخَبَر","en":"The three kinds of khabar","tr":"Haberin üç çeşidi"},"level":3,"group":"na
