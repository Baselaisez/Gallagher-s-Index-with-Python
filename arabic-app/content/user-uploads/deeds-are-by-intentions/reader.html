erir — hâlbuki mef'ûl fîh, on üç mensûbâttan biridir."}},{"wrong":"جلستُ في أمامِ البيتِ","right":"جلستُ أمامَ البيتِ","why":{"en":"Do not write فِي before a zarf: the zarf already carries that sense, which is exactly why it takes nasb. Writing فِي makes the noun majrur instead.","tr":"Zarfın önüne فِي yazılmaz: zarf o mânâyı zaten taşır, nasb almasının sebebi de budur. فِي yazılırsa isim mecrûr olur."}},{"wrong":"أمامَ الْبَيْتُ","right":"أمامَ الْبَيْتِ","why":{"en":"A zarf is normally mudaf, so what follows it is in jarr — nasb on the zarf, jarr on its mudaf ilayh.","tr":"Zarf çoğunlukla muzâftır; ardından geleni mecrûr yapar — zarf mansub, muzâfun ileyh mecrûrdur."}}]},"maful-lah":{"title":{"ar":"الْمَفْعُولُ لَهُ (لِأَجْلِهِ)","en":"The maf'ul lah (accusative of purpose)","tr":"Mef'ûl leh (li-eclih)"},"level":4,"group":"nahw","explanation":{"en":"Defined in the Mansubat as «هُوَ مَا فُعِلَ لِأَجْلِهِ فِعْلٌ مَذْكُورٌ» — the noun naming the REASON for which the stated action was done. It answers «why?» and takes nasb: قُمْتُ إِجْلَالًا لِلْعَالِمِ «I stood out of respect for the scholar». For it to take nasb rather than a preposition, three things are normally required: it must be a masdar (a قلبي one, an act of the heart — fear, desire, respect), and it must share the doer and the time of the main verb. When any of those fails, Arabic uses لِ instead: جِئْتُ لِلْعِلْمِ.","tr":"Mensûbât'ta şöyle tanımlanır: «هُوَ مَا فُعِلَ لِأَجْلِهِ فِعْلٌ مَذْكُورٌ» — zikredilen işin kendisi SEBEBİYLE yapıldığı şeyin ismidir. «Niçin?» sorusuna cevap verir ve nasb alır: قُمْتُ إِجْلَالًا لِلْعَالِمِ «Âlime saygıdan dolayı ayağa kalktım». Harf-i cer yerine nasb alabilmesi için genelde üç şart aranır: masdar olması (kalbî bir masdar — korku, arzu, saygı gibi), fâilinin ve zamanının asıl fiille aynı olması. Bunlardan biri düşerse لِ kullanılır: جِئْتُ لِلْعِلْمِ."},"plain":{"en":"Why — the reason the act was done.","tr":"Niçin — işin yapılma sebebi."},"mamul":"mansub","sources":["المنصوبات","العوامل (البيركوي)","قطر الندى (ابن هشام)"],"question":{"tr":["Niçin?","Kim için?"],"en":["Why? / What for?","For whom?"]},"examples":[{"ar":"قُمْتُ إِجْلَالًا لِلْعَالِمِ.","gloss":{"en":"I stood out of respect for the scholar — the reason, in nasb.","tr":"Âlime hürmeten ayağa kalktım — sebep, mansub olarak."},"src":null},{"ar":"وَإِنَّمَا أُوصِيكَ لِمَصْلَحَتِكَ وَمَصْلَحَةِ الْمُسْلِمِينَ.","gloss":{"en":"I counsel you only for your good and the good of the Muslims — the reason, carried by لِ rather than nasb because it is not a heart-masdar.","tr":"Sana ancak senin ve Müslümanların iyiliği için nasihat ediyorum — sebep, kalb masdarı olmadığı için nasb ile değil لِ ile gelir."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"وَإِنَّمَا أُوصِيكَ لِمَصْلَحَتِكَ وَمَصْلَحَةِ الْمُسْلِمِينَ.","gloss":{"en":"I counsel you only for your good and the good of the Muslims — here the reason is carried by لِ, not by nasb, because it is not a heart-masdar. From Abu Hanifa's testament to Abu Yusuf.","tr":"Sana ancak senin ve Müslümanların iyiliği için nasihat ediyorum — sebep burada nasb ile değil لِ ile taşınır, çünkü kalb masdarı değildir. Ebû Hanîfe'nin Ebû Yusuf'a vasiyetinden."},"src":null},{"ar":"تَرَكْتُ الْمَعْصِيَةَ خَوْفًا مِنَ اللَّهِ.","gloss":{"en":"I abandoned the sin out of fear of Allah.","tr":"Allah korkusuyla günahı terk ettim."},"src":null}],"mistakes":[{"wrong":"قمتُ إجلالٌ للعالمِ","right":"قمتُ إجلالًا للعالمِ","why":{"en":"The maf'ul lah is mansub — it is one of the thirteen mansubat, not a subject.","tr":"Mef'ûl leh mansubdur — on üç mensûbâttan biridir, fâil değildir."}},{"wrong":"جئتُ الْعِلْمَ (يريد: لطلب العلم)","right":"جئتُ لِلْعِلْمِ","why":{"en":"A non-masdar, or one whose doer differs from the verb's, cannot take nasb as maf'ul lah — it needs لِ. Putting it in nasb makes it read as a direct object.","tr":"Masdar olmayan veya fâili asıl fiilden farklı olan kelime mef'ûl leh olarak nasb alamaz — لِ gerekir. Nasb yapılırsa mef'ûlün bih gibi okunur."}},{"wrong":"ضربتُه تأديبًا لأخيه","right":"ضربتُه تأديبًا لَهُ","why":{"en":"The maf'ul lah must share the doer of the main verb; if the purpose belongs to someone else, the sentence must be recast.","tr":"Mef'ûl leh, asıl fiilin fâiliyle aynı fâile sahip olmalıdır; maksat başkasına aitse cümle yeniden kurulmalıdır."}}]},"maful-maah":{"title":{"ar":"الْمَفْعُولُ مَعَهُ","en":"The maf'ul ma'ah (accusative of accompaniment)","tr":"Mef'ûl maah"},"level":5,"group":"nahw","explanation":{"en":"Defined in the Mansubat as «هُوَ مَذْكُورٌ بَعْدَ الْوَاوِ لِمُصَاحَبَةِ مَعْمُولِ فِعْلٍ لَفْظًا أَوْ مَعْنًى» — a noun after a وَ that means «together with» rather than «and», put in nasb: سِرْتُ وَالنِّيلَ «I travelled alongside the Nile». The test is whether the two are true partners in the action. If they are, the وَ is a connective and the noun follows the case of what precedes; if the second merely accompanies, the وَ is وَاوُ الْمَعِيَّةِ and the noun is mansub. Compare جَاءَ زَيْدٌ وَعَمْرٌو (both came) with اِسْتَوَى الْمَاءُ وَالْخَشَبَةَ (the water rose level with the plank — the plank did not rise).","tr":"Mensûbât'ta şöyle tanımlanır: «هُوَ مَذْكُورٌ بَعْدَ الْوَاوِ لِمُصَاحَبَةِ مَعْمُولِ فِعْلٍ لَفْظًا أَوْ مَعْنًى» — «ve» değil «ile birlikte» mânâsındaki bir وَ'dan sonra gelen ve nasb alan isimdir: سِرْتُ وَالنِّيلَ «Nil boyunca yürüdüm». Ölçü, ikisinin fiilde gerçekten ortak olup olmadığıdır. Ortaksalar وَ atıf harfidir ve isim öncekinin i'rabını alır; ikincisi sadece eşlik ediyorsa وَ vâvü'l-maiyyedir ve isim mansub olur. Karşılaştır: جَاءَ زَيْدٌ وَعَمْرٌو (ikisi de geldi) ile اِسْتَوَى الْمَاءُ وَالْخَشَبَةَ (su tahta ile aynı seviyeye geldi — tahta yükselmedi)."},"plain":{"en":"What or who it happened alongside.","tr":"İşin kiminle yahut neyle beraber olduğu."},"mamul":"mansub","sources":["المنصوبات","العوامل (البيركوي)","الكافية (ابن الحاجب)"],"question":{"tr":["Ne ile beraber?","Kim ile beraber?"],"en":["Together with what?","Together with whom?"]},"examples":[{"ar":"سِرْتُ وَالنِّيلَ.","gloss":{"en":"I travelled alongside the Nile — the Nile did not travel; it accompanies.","tr":"Nil boyunca yolculuk ettim — Nil yolculuk etmedi, beraberlik bildirir."},"src":null},{"ar":"اِسْتَوَى الْمَاءُ وَالْخَشَبَةَ.","gloss":{"en":"The water became level with the plank — the classic test case.","tr":"Su tahta ile bir hizaya geldi — klasik ölçü örneği."},"src":null},{"ar":"جَاءَ زَيْدٌ وَعَمْرٌو.","gloss":{"en":"Zayd and Amr came — here both are doers, so the وَ is a plain connective and عمرو is marfu'.","tr":"Zeyd ve Amr geldi — burada ikisi de fâildir, dolayısıyla vâv atıf harfidir ve عمرو merfûdur."},"src":null}],"mistakes":[{"wrong":"سرتُ والنيلُ","right":"سرتُ والنيلَ","why":{"en":"When the وَ means «together with», the noun after it is mansub. Reading it as a connective and giving it raf' claims the Nile travelled too.","tr":"وَ «ile birlikte» mânâsındaysa sonrası mansub olur. Atıf sayıp ref verilirse Nil'in de yürüdüğü iddia edilmiş olur."}},{"wrong":"جاء زيدٌ وعمرًا","right":"جاء زيدٌ وعمرٌو","why":{"en":"The opposite error: when both are genuinely doers, the وَ is a connective and the second follows the first in raf'. Not every وَ is waw al-ma'iyya.","tr":"Bunun tersi hata: ikisi de gerçekten fâilse وَ atıf harfidir ve ikincisi birinciye ref'de uyar. Her وَ vâvü'l-maiyye değildir."}}]},"maful-mutlaq":{"title":{"ar":"الْمَفْعُولُ الْمُطْلَق","en":"The maf'ul mutlaq (cognate accusative)","tr":"Mef'ûl-i mutlak"},"level":4,"group":"nahw","explanation":{"en":"Defined in the Mansubat as «هُوَ اسْمُ مَا فَعَلَهُ فَاعِلُ فِعْلٍ مَذْكُورٍ بِمَعْنَاهُ» — the masdar of the very verb that governs it, put in nasb. English has no equivalent; it is the Arabic way of intensifying or specifying an action. The Mansubat divides it into three: (1) تَأْكِيدِيّ, which merely emphasizes — ضَرَبْتُ ضَرْبًا «I struck a striking» = I really struck; (2) نَوْعِيّ, which specifies the KIND, and then it is normally described or made mudaf — ضَرَبْتُ ضَرْبًا شَدِيدًا, يَطْمَعُونَ غَايَةَ الطَّمَعِ; (3) عَدَدِيّ, which counts the times — ضَرَبْتُ ضَرْبَتَيْنِ.","tr":"Mensûbât'ta şöyle tanımlanır: «هُوَ اسْمُ مَا فَعَلَهُ فَاعِلُ فِعْلٍ مَذْكُورٍ بِمَعْنَاهُ» — kendisini amel eden fiilin masdarıdır, mansub gelir. Türkçede tam karşılığı yoktur; fiili pekiştirmenin veya belirlemenin Arapça yoludur. Mensûbât üçe ayırır: (1) te'kîdî, sadece pekiştirir — ضَرَبْتُ ضَرْبًا «vurdum da vurdum»; (2) nev'î, çeşidini belirtir, çoğunlukla sıfatlanır veya muzâf olur — ضَرَبْتُ ضَرْبًا شَدِيدًا, يَطْمَعُونَ غَايَةَ الطَّمَعِ; (3) adedî, kaç kez olduğunu sayar — ضَرَبْتُ ضَرْبَتَيْنِ."},"plain":{"en":"Saying the action again as a noun, to strengthen or qualify it: «they covet it utterly».","tr":"İşi bir de isim olarak söyleyip pekiştirmek yahut nitelemek: «ona son derece tamah ederler»."},"mamul":"mansub","sources":["المنصوبات","العوامل (البيركوي)","الكافية (ابن الحاجب)"],"examples":[{"ar":"يَأْخُذُونَ أَمْوَالَكَ وَيَطْمَعُونَ فِيهَا غَايَةَ الطَّمَعِ.","gloss":{"en":"They take your wealth and covet it utterly — غَايَةَ الطَّمَعِ is a maf'ul mutlaq of the naw'i kind, mudaf to the masdar of the governing verb.","tr":"Malını alırlar ve son derece tamah ederler — غَايَةَ الطَّمَعِ nev'î mef'ûl-i mutlaktır, âmil fiilin masdarına muzâftır."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"ضَرَبْتُ ضَرْبًا شَدِيدًا.","gloss":{"en":"I struck a severe striking — naw'i, specified by an adjective.","tr":"Şiddetli bir vuruşla vurdum — nev'î, sıfatla belirtilmiş."},"src":null},{"ar":"ضَرَبْتُ ضَرْبَتَيْنِ.","gloss":{"en":"I struck twice — adadi, counting the occurrences.","tr":"İki kere vurdum — adedî, tekrarı sayar."},"src":null}],"mistakes":[{"wrong":"ضربتُ ضربٌ شديدٌ","right":"ضربتُ ضربًا شديدًا","why":{"en":"The maf'ul mutlaq is mansub, and its adjective follows it in nasb. It is not a second subject.","tr":"Mef'ûl-i mutlak mansubdur, sıfatı da nasbda ona uyar. İkinci bir fâil değildir."}},{"wrong":"ضربتُ بِضَرْبٍ شديدٍ","right":"ضربتُ ضربًا شديدًا","why":{"en":"No preposition is used: the masdar goes straight into nasb. Adding بِ turns it into an ordinary prepositional phrase and loses the emphasis.","tr":"Harf-i cer kullanılmaz: masdar doğrudan nasb alır. بِ eklenirse sıradan bir câr-mecrûr olur ve pekiştirme kaybolur."}},{"wrong":"جلستُ قُعُودًا","right":"جلستُ جُلُوسًا","why":{"en":"The maf'ul mutlaq must be the masdar of the SAME verb that governs it — بِمَعْنَاهُ in the definition. A synonym's masdar does not qualify.","tr":"Mef'ûl-i mutlak, kendisini amel eden fiilin AYNI masdarı olmalıdır — tanımdaki بِمَعْنَاهُ kaydı budur. Eş anlamlı bir fiilin masdarı olmaz."}}]},"mamnu-min-sarf":{"title":{"ar":"الْمَمْنُوعُ مِنَ الصَّرْف","en":"The diptote (mamnu' min as-sarf)","tr":"Gayr-ı munsarif isim"},"level":2,"group":"nahw","explanation":{"en":"A diptote is a noun \"barred from full inflection\": it refuses tanwin, and in the jarr position it takes fatha instead of kasra. The label lives on the border of sarf and nahw — the *reasons* it is barred are morphological (the causes are sarf: proper-name + feminine, proper-name + foreignness, the plural pattern مَفَاعِل/مَفَاعِيل, the adjectival أَفْعَل pattern, ألف التأنيث…), but the *effect* is a nahw rule about case endings, which is why al-Ajurrumiyya files it under علامات الجر (\"jarr is shown by fatha in the noun that does not inflect fully\"). In this story حَنِيفَة is a diptote through عَلَمِيَّة + تَأْنِيث (a feminine proper name), so «أَبِي حَنِيفَةَ» ends in fatha though it is majrur. يُوسُف is a diptote through عَلَمِيَّة + عُجْمَة (a foreign proper name): notice it never takes tanwin even in raf' (يُوسُفُ). One escape hatch: add الـ or make it a mudaf, and the kasra returns (فِي الْمَسَاجِدِ).","tr":"Gayr-ı munsarif, \"tam çekimden men edilmiş\" isimdir: tenvin almaz ve cer halinde kesre yerine fetha alır. Terim sarf ile nahiv sınırındadır — men sebepleri sarfîdir (alemiyet + te'nis, alemiyet + ucme, مَفَاعِل/مَفَاعِيل müntehe'l-cumû kalıbı, أَفْعَل sıfat kalıbı, elif-i te'nis…), ama sonucu i'rab (harekeler) ile ilgili bir nahiv kuralıdır; bu yüzden Âcurrûmiyye onu cer alâmetleri babında zikreder. Bu hikâyede حَنِيفَة alemiyet + te'nis ile gayr-ı munsariftir; bu yüzden «أَبِي حَنِيفَةَ» mecrur olduğu halde fetha ile biter. يُوسُف alemiyet + ucme ile gayr-ı munsariftir: ref halinde bile tenvin almaz (يُوسُفُ). İstisna: başına الـ gelirse veya muzaf olursa kesre geri döner (فِي الْمَسَاجِدِ)."},"plain":{"en":"Words that refuse tanwin and take fatha where other nouns take kasra.","tr":"Tenvin almayan ve başka isimlerin kesre aldığı yerde fetha alan kelimeler."},"sources":["الآجُرُّومِيَّة (ابن آجُرُّوم)","الكافية (ابن الحاجب)","الشافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"examples":[{"ar":"قَالَ أَبُو حَنِيفَةَ.","gloss":{"en":"Abu Hanifa said — حَنِيفَةَ is mudaf ilayh, majrur but marked by fatha because it is a diptote (feminine proper name).","tr":"Ebû Hanîfe dedi — حَنِيفَةَ muzâfun ileyhtir, mecrûrdur fakat gayr-i munsarif olduğu için fetha ile (müennes alem)."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"أَرَادَ يُوسُفُ أَنْ يَرْجِعَ.","gloss":{"en":"Yusuf wanted to return — يُوسُفُ is marfu' with a bare damma and no tanwin: a foreign proper name is a diptote.","tr":"Yusuf dönmek istedi — يُوسُفُ tenvinsiz sade damme ile merfûdur: yabancı alem gayr-i munsariftir."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"صَلَّيْتُ فِي مَسَاجِدَ كَثِيرَةٍ.","gloss":{"en":"I prayed in many mosques — مَسَاجِدَ (pattern مَفَاعِل) is a diptote: majrur but with fatha and no tanwin.","tr":"Birçok mescitte namaz kıldım — مَسَاجِدَ (مَفَاعِل vezni) gayr-i munsariftir: mecrûrdur ama fetha ile ve tenvinsiz."},"src":null}],"mistakes":[{"wrong":"قَالَ أَبُو حَنِيفَةٍ","right":"قَالَ أَبُو حَنِيفَةَ","why":{"en":"A diptote never takes tanwin and shows jarr by fatha, so «حنيفة» must end in a plain fatha — not the kasra-with-tanwin (ـةٍ) that a normal noun would take as mudaf ilayh.","tr":"Gayr-ı munsarif tenvin almaz ve cerri fetha ile gösterir; bu yüzden «حنيفة» düz fetha ile bitmeli — sıradan bir muzafun ileyhin alacağı tenvinli kesre (ـةٍ) ile değil."}},{"wrong":"جَاءَ يُوسُفٌ","right":"جَاءَ يُوسُفُ","why":{"en":"Even in raf' a diptote refuses tanwin: يُوسُفُ takes a single damma, not tanwin damma (ـٌ). Learners add tanwin by analogy with ordinary triptote nouns.","tr":"Ref halinde bile gayr-ı munsarif tenvin almaz: يُوسُفُ tek ötre alır, tenvinli ötre (ـٌ) değil. Öğrenciler sıradan munsarif isimlere kıyasla tenvin ekler."}}]},"mana-al-fil":{"title":{"ar":"مَعْنَى الْفِعْلِ (الْعَامِلُ الْمَعْنَوِيُّ فِي الْحَالِ)","en":"Verbal force without a verb (ma'na al-fi'l)","tr":"Mana-yı fiil (fiil manası taşıyan âmil)"},"level":5,"group":"awamil","explanation":{"en":"The governor of a HAL is usually a verb (ضَرَبْتُ زَيْدًا قَائِمًا) or a quasi-verb like an ism fa'il (زَيْدٌ فِي الدَّارِ قَائِمًا has the sense of «being»). The Kafiya adds a third class: مَعْنَى الْفِعْلِ — a word with no verbal form at all whose meaning performs an act. In هٰذَا زَيْدٌ قَائِمًا («here is Zayd, standing»), nothing looks like a verb, yet قَائِمًا stands in nasb as hal: the pointing word هٰذَا carries the force of أُشِيرُ «I point», and that hidden act is the governor. The same account covers the tanbih and tamanni particles and expressions like كَأَنَّ (تَشْبِيه = «I liken»). This is the item the Ottoman ma'mul tables list as «manayı fiil» among the governors: a reminder that government needs an act — but the act may live inside a meaning, not a conjugation.","tr":"HÂL'in âmili çoğu zaman bir fiildir (ضَرَبْتُ زَيْدًا قَائِمًا) yahut ism-i fâil gibi bir şibh-i fiildir (زَيْدٌ فِي الدَّارِ قَائِمًا «bulunma» manası taşır). Kâfiye üçüncü bir sınıf ekler: مَعْنَى الْفِعْلِ — şeklen fiil olmayan fakat manasıyla bir iş gören kelime. هٰذَا زَيْدٌ قَائِمًا («işte Zeyd, ayakta») cümlesinde fiile benzer hiçbir şey yoktur; yine de قَائِمًا hâl olarak mensubtur: işaret kelimesi هٰذَا, أُشِيرُ «işaret ederim» kuvvetini taşır ve âmil o gizli iştir. Tenbih ve temenni harfleri ile كَأَنَّ (teşbih = «benzetirim») gibi ifadeler de aynı hesaba girer. Osmanlı ma'mûl cetvellerinin âmiller arasında «manayı fiil» diye yazdığı madde budur: amel bir iş ister — fakat o iş bir çekimde değil, bir manada da yaşayabilir."},"plain":{"en":"Some words are not verbs but carry a verb's meaning — «this is…» secretly says «I point at…». That hidden verbal force can govern a hal.","tr":"Bazı kelimeler fiil değildir ama fiil manası taşır — «işte bu…» gizlice «işaret ederim» der. O gizli fiil kuvveti bir hâli nasb edebilir."},"mamul":"mansub","sources":["الكافية (ابن الحاجب) — عامل الحال","العوامل (البيركوي)"],"examples":[{"ar":"هٰذَا زَيْدٌ قَائِمًا.","gloss":{"en":"Here is Zayd, standing — قَائِمًا is hal, governed by the pointing force inside هٰذَا.","tr":"İşte Zeyd, ayakta — قَائِمًا hâldir; âmili هٰذَا'nın içindeki işaret kuvvetidir."},"src":null},{"ar":"كَأَنَّكَ شَمْسٌ طَالِعَةً.","gloss":{"en":"As if you were a sun, rising — the likening force of كَأَنَّ governs the hal.","tr":"Sanki doğan bir güneşsin — hâli, كَأَنَّ'deki benzetme kuvveti nasb eder."},"src":null}],"mistakes":[{"wrong":"هٰذَا زَيْدٌ قَائِمٌ (مُرَادًا بِهِ الْحَال)","right":"هٰذَا زَيْدٌ قَائِمًا","why":{"en":"If «standing» describes the state of the act of pointing, it is hal and must be mansub. Raf' would make it a second khabar instead.","tr":"«Ayakta» işaret etme ânındaki hâli anlatıyorsa hâldir, mensub olmalıdır. Merfû okunursa ikinci haber olur."}},{"wrong":"قَائِمًا هٰذَا زَيْدٌ","right":"هٰذَا زَيْدٌ قَائِمًا","why":{"en":"A hal governed by mere verbal force may not precede its governor — that licence belongs to real verbs.","tr":"Âmili yalnız mana-yı fiil olan hâl, âmilinin önüne geçemez — o ruhsat gerçek fiillere aittir."}}]},"masdar":{"title":{"ar":"الْمَصْدَر","en":"The masdar (verbal noun)","tr":"Masdar"},"level":3,"group":"sarf","explanation":{"en":"The masdar names the act itself, with no doer and no time: نَقْل «transferring», حَبْس «holding», تَمْلِيك «conveying ownership». It is a NOUN, so it takes case endings and can head an idafa — and that is why almost every classical definition is built on one. «الرَّهْنُ حَبْسُ شَيْءٍ» is mubtada and khabar, and the khabar is a masdar governing what follows. For the augmented babs the masdar is regular and can simply be learned with the pattern: أَفْعَلَ → إِفْعَال, فَعَّلَ → تَفْعِيل, فَاعَلَ → مُفَاعَلَة, تَفَعَّلَ → تَفَعُّل, تَفَاعَلَ → تَفَاعُل, اِنْفَعَلَ → اِنْفِعَال, اِفْتَعَلَ → اِفْتِعَال, اِسْتَفْعَلَ → اِسْتِفْعَال. For the BARE triliteral it is not regular at all: it is سَمَاعِيّ, heard and memorised, and the manuals count some thirty-two patterns for it — قَتْلٌ, فِسْقٌ, شُغْلٌ, رَحْمَةٌ, بُشْرَى, حِرْمَانٌ, طَلَبٌ, ذَهَابٌ, دُخُولٌ, صُهُوبَةٌ and the rest. There is no rule to apply; the masdar of a bare verb is learned with the verb, exactly like its bab.","tr":"Masdar, fâili ve zamanı olmaksızın işin kendisini adlandırır: نَقْل «devretme», حَبْس «tutma», تَمْلِيك «temlik». İSİMDİR; i'rab alır ve izafetin başına geçer — klasik tariflerin neredeyse tamamının masdarla kurulmasının sebebi budur. «الرَّهْنُ حَبْسُ شَيْءٍ» mübteda ve haberdir, haber ise sonrasını izafetle alan bir masdardır. Mezîd bablarda masdar kıyasîdir ve vezniyle birlikte öğrenilir: أَفْعَلَ → إِفْعَال، فَعَّلَ → تَفْعِيل، فَاعَلَ → مُفَاعَلَة، تَفَعَّلَ → تَفَعُّل، تَفَاعَلَ → تَفَاعُل، اِنْفَعَلَ → اِنْفِعَال، اِفْتَعَلَ → اِفْتِعَال، اِسْتَفْعَلَ → اِسْتِفْعَال. Sülâsî MÜCERREDDE ise hiç kıyasî değildir: semâîdir, işitilip ezberlenir; kitaplar bunun için otuz iki kadar vezin sayar — قَتْلٌ، فِسْقٌ، شُغْلٌ، رَحْمَةٌ، بُشْرَى، حِرْمَانٌ، طَلَبٌ، ذَهَابٌ، دُخُولٌ، صُهُوبَةٌ ve diğerleri. Uygulanacak bir kaide yoktur; mücerred fiilin masdarı, tıpkı bâbı gibi, fiille birlikte öğrenilir."},"plain":{"en":"The name of the action itself — «entering», «knowing» — a noun made out of a verb.","tr":"İşin kendisinin adı — «girmek», «bilmek» — fiilden yapılmış isim."},"sources":["المقصود","مراح الأرواح","الكافية (ابن الحاجب)"],"examples":[{"ar":"الْبَيْعُ مُبَادَلَةُ مَالٍ بِمَالٍ.","gloss":{"en":"A sale is the exchange of property for property — the khabar is a Form III masdar heading an idafa.","tr":"Bey', bir malın bir malla mübâdelesidir — haber, izafetin başındaki mufâale masdarıdır."},"src":"kitab-al-buyu"},{"ar":"وَالرَّهْنُ حَبْسُ شَيْءٍ بِحَقٍّ.","gloss":{"en":"A pledge is the holding of a thing against a right — حَبْس is a sama'i masdar of the bare verb.","tr":"Rehin, bir hak sebebiyle bir şeyi tutmaktır — حَبْس mücerred fiilin semâî masdarıdır."},"src":"kitab-al-buyu"},{"ar":"وَالْوَكَالَةُ إِقَامَةُ الْغَيْرِ مَقَامَ نَفْسِهِ.","gloss":{"en":"Agency is putting another in one's own place — إِقَامَة is the Form IV masdar of أَقَامَ, its ة standing in for the lost و.","tr":"Vekâlet, başkasını kendi yerine geçirmektir — إِقَامَة, أَقَامَ'nin if'âl masdarıdır; tâsı düşen vâvın yerini tutar."},"src":"kitab-al-buyu"}],"mistakes":[{"wrong":"أَكْرَمَ — إِكْرَامَة","right":"أَكْرَمَ — إِكْرَام","why":{"en":"Form IV's masdar is إِفْعَال. The ة appears only where a weak letter was lost — إِقَامَة for أَقَامَ, إِطَاعَة for أَطَاعَ.","tr":"İf'âl bâbının masdarı إِفْعَال'dir. Tâ yalnız illetli harf düştüğünde gelir: أَقَامَ → إِقَامَة، أَطَاعَ → إِطَاعَة."}},{"wrong":"ذَهَبَ — ذَهْب","right":"ذَهَبَ — ذَهَاب","why":{"en":"There is no rule to fall back on for a bare verb; the masdar is heard, not derived. ذَهَاب is the one that is used.","tr":"Mücerred fiilde başvurulacak bir kaide yoktur; masdar semâîdir. Kullanılan şekil ذَهَاب'tır."}},{"wrong":"«حَبْسُ شَيْءٌ»","right":"«حَبْسُ شَيْءٍ»","why":{"en":"A masdar governs its complement by idafa, so what follows is majrur — not by any verbal force it might seem to have.","tr":"Masdar mütemmimini izafetle alır; sonrası mecrûrdur."}}]},"mithal-verbs":{"title":{"ar":"الْفِعْلُ الْمِثَال","en":"Assimilated verbs (initial و or ي)","tr":"Misal fiil (başı و veya ي)"},"level":3,"group":"sarf","explanation":{"en":"A mithal verb has و or ي as its FIRST radical: وَعَدَ, وَصَلَ, يَسَرَ. The past tense is completely regular — وَعَدْتُ, وَصَلَتْ, conjugated exactly like a sound verb, active and passive alike. Everything interesting happens in the present. The rule is precise: a و caught between the fatha-bearing prefix يَ and an original kasra is dropped. يَوْعِدُ becomes يَعِدُ, يَوْصِلُ becomes يَصِلُ. It disappears from everything built on that present too — لَمْ يَعِدْ, لَنْ يَعِدَ, لِيَعِدْ, and the imperative عِدْ, which is one letter long. Note the two conditions: the vowel after the و must be an original KASRA (so bab 4's يَوْجَلُ keeps its و), and the passive restores it, because there the vowel is damma: يُوعَدُ. A mithal with ي behaves quite differently — the ي is never dropped in any bab: يَيْسِرُ, يَيْمُنُ, يَيْئَسُ. Two further habits: masdars on فِعْلَة shed the و and compensate with a ة (وِعْدَة → عِدَة), and in bab VIII the و or ي turns into ت and merges with the bab's own ت — اِوْتَعَدَ → اِتَّعَدَ.","tr":"Misal fiilin BİRİNCİ harfi و veya ي'dir: وَعَدَ، وَصَلَ، يَسَرَ. Mâzisi tamamen düzgündür — وَعَدْتُ، وَصَلَتْ; malum ve meçhulüyle sahih fiil gibi çekilir. Bütün mesele muzâridedir. Kaide nettir: fethalı يَ ile aslî bir kesre arasında kalan و düşer. يَوْعِدُ → يَعِدُ، يَوْصِلُ → يَصِلُ. Muzâriye tâbi olan her sîgada da düşer — لَمْ يَعِدْ، لَنْ يَعِدَ، لِيَعِدْ ve tek harflik emir عِدْ. İki şarta dikkat: و'dan sonraki hareke aslî KESRE olmalıdır (bu yüzden dördüncü babın يَوْجَلُ'ü و'ını korur) ve meçhulde و geri döner, çünkü orada hareke dammedir: يُوعَدُ. Misal-i yâî ise bambaşkadır — ي hiçbir babda düşmez: يَيْسِرُ، يَيْمُنُ، يَيْئَسُ. İki âdet daha: فِعْلَة vezinli masdarlarda و düşer ve yerine tâ gelir (وِعْدَة → عِدَة); iftiâl bâbında ise و/ي, تا'ya kalbolup bâbın tâsına idgam edilir — اِوْتَعَدَ → اِتَّعَدَ."},"plain":{"en":"Verbs that start with و or ي. The و often drops out in the present and the command: وَقَفَ «he stood» gives قِفْ «stop!».","tr":"Başı و veya ي olan fiiller. و çoğu zaman muzâri ve emirde düşer: وَقَفَ «durdu» → قِفْ «dur!»."},"sources":["مراح الأرواح (ص ٨٣-٨٤)","العزّي (ص ١٤٨-١٥٠)","المقصود (ص ١٨٣، ٢٠٥)","ملخّص الصرف العربي (ص ٦٦)","بناء الأفعال — الأقسام السبعة"],"examples":[{"ar":"وَقَفَ الْفِيلُ أَمَامَ مَكَّةَ.","gloss":{"en":"The elephant stopped before Mecca — وَقَفَ is sound in the past; its present is يَقِفُ, with the و gone.","tr":"Fil Mekke'nin önünde durdu — وَقَفَ mâzide sahihtir; muzârisi يَقِفُ'dur, vâv düşmüştür."},"src":"ashab-al-fil"},{"ar":"مَا وَصَلَ الْجَيْشُ إِلَى مَكَّةَ.","gloss":{"en":"The army did not reach Mecca — وَصَلَ / يَصِلُ, another mithal wawi.","tr":"Ordu Mekke'ye ulaşmadı — وَصَلَ / يَصِلُ, bir başka misal-i vâvî."},"src":"ashab-al-fil"},{"ar":"وَقَعَ يُونُسُ فِي الْبَحْرِ.","gloss":{"en":"Yunus fell into the sea — وَقَعَ / يَقَعُ: bab IV, so the vowel is fatha, yet the و still drops.","tr":"Yunus denize düştü — وَقَعَ / يَقَعُ: dördüncü bâb, hareke fethadır, yine de vâv düşer."},"src":"yunus-wa-al-hut"}],"mistakes":[{"wrong":"لَمْ يَوْصِلْ إِلَى مَكَّةَ","right":"لَمْ يَصِلْ إِلَى مَكَّةَ","why":{"en":"Whatever is built on the present inherits the dropped و — jussive, subjunctive, imperative and prohibition all lose it.","tr":"Muzâriden türeyen her sîga düşen و'ı da devralır: cezm, nasb, emir ve nehiy hepsinde و yoktur."}},{"wrong":"اِوْصِلْ","right":"صِلْ","why":{"en":"The imperative of a mithal is built from the jussive, which has already lost the و — so no connecting hamza is needed and the word is one letter plus its ending.","tr":"Misalin emri meczumdan yapılır ve orada و zaten düşmüştür; bu yüzden vasıl hemzesine gerek kalmaz."}},{"wrong":"يَسَرَ – يَسِرُ","right":"يَسَرَ – يَيْسِرُ","why":{"en":"The rule is for و only. A mithal ya'i keeps its ي in every bab — nothing is dropped.","tr":"Kaide yalnız و içindir. Misal-i yâînin يا'sı hiçbir babda düşmez."}},{"wrong":"يُعَدُ (مَجْهُولُ يَعِدُ)","right":"يُوعَدُ","why":{"en":"The و was dropped because it stood before a kasra. The passive has damma there instead, so the condition fails and the و comes back.","tr":"و, kesreden önce bulunduğu için düşmüştü. Meçhulde orada damme vardır, şart bozulur ve و geri döner."}}]},"mubtada-khabar":{"title":{"ar":"الْمُبْتَدَأُ وَالْخَبَر","en":"The nominal sentence (mubtada and khabar)","tr":"Mübteda ve haber"},"level":2,"group":"nahw","explanation":{"en":"A nominal sentence (الجملة الاسمية) opens with a noun and is built from two marfu' parts: the مُبْتَدَأ (the topic you start with) and the خَبَر (what you say about it). Both are in raf'. Unusually, the governor that raises them is not a spoken word but a meaning — الابتداء, the very act of beginning — which is why grammarians call it an عامل معنوي. The khabar can be a single word (مفرد: زَيْدٌ قَائِمٌ), a phrase (شبه جملة — a jar-majrur or adverb), or a whole sentence. In this story «الْأَعْمَالُ بِالنِّيَّاتِ»: الْأَعْمَالُ is the mubtada (marfu'), and the prepositional phrase بِالنِّيَّاتِ stands in the place of the khabar (attaching to an omitted خبر such as «كائنةٌ» / «معتبرةٌ»). Note too that once إِنَّ or كَانَ enters such a sentence the pair is renamed (ism/khabar) and one of them changes case — but underneath it is still this mubtada–khabar structure. Ibn Ajurrum devotes a chapter to it; Ibn Hisham details the kinds of khabar in Qatr al-Nada.","tr":"İsim cümlesi (الجملة الاسمية) bir isimle başlar ve iki merfu ögeden kurulur: mübteda (başladığın konu) ve haber (onun hakkında söylenen). Her ikisi de merfudur. İlginç olan, bunları ref eden âmilin söylenen bir kelime değil, bir mana olmasıdır — ibtidâ, yani başlama fiili; bu yüzden gramerciler ona âmil-i manevî der. Haber tek kelime (müfred: زَيْدٌ قَائِمٌ), bir öbek (şibh-i cümle — car-mecrur ya da zarf) veya tam bir cümle olabilir. Bu hikâyede «الْأَعْمَالُ بِالنِّيَّاتِ»: الْأَعْمَالُ mübtedadır (merfu) ve بِالنِّيَّاتِ car-mecruru haberin yerini tutar (hazfedilmiş bir habere, mesela «كائنةٌ» / «معتبرةٌ», müteallik). Ayrıca إِنَّ veya كَانَ bu cümleye girince çift yeniden adlandırılır (ism/haber) ve birinin i'rabı değişir — ama alttaki yapı yine bu mübteda–haber yapısıdır."},"plain":{"en":"A sentence with no verb in it: a topic, and what you say about it.","tr":"İçinde fiil bulunmayan cümle: bir konu ve o konu hakkında söylenen."},"mamul":"marfu","sources":["الآجُرُّومِيَّة (ابن آجُرُّوم)","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"question":{"tr":["Nedir?","Kimdir?","Ne iledir?","Kim iledir?","Ne sebebiyledir?","Niçindir?","Nerededir?"],"en":["What is it?","Who is it?","With what is it?","With whom is it?","By what cause is it?","What for is it?","Where is it?"]},"examples":[{"ar":"الْأَعْمَالُ بِالنِّيَّاتِ.","gloss":{"en":"Deeds are by intentions — الْأَعْمَالُ is the mubtada (marfu'); the jar-majrur بِالنِّيَّاتِ takes the place of the khabar.","tr":"Ameller niyetlerledir — الْأَعْمَالُ merfû mübtedadır; بِالنِّيَّاتِ câr-mecrûru haberin yerini tutar."},"src":"deeds-are-by-intentions"},{"ar":"الْعِلْمُ نَافِعٌ.","gloss":{"en":"Knowledge is beneficial — الْعِلْمُ mubtada, نَافِعٌ khabar, both marfu'.","tr":"İlim faydalıdır — الْعِلْمُ mübteda, نَافِعٌ haber, ikisi de merfû."},"src":null},{"ar":"الطَّالِبُ مُجْتَهِدٌ.","gloss":{"en":"The student is diligent — the khabar مُجْتَهِدٌ agrees with the mubtada in gender and number.","tr":"Talebe çalışkandır — haber مُجْتَهِدٌ, mübtedaya cinsiyet ve sayıda uyar."},"src":null}],"mistakes":[{"wrong":"الْعِلْمُ نَافِعًا","right":"الْعِلْمُ نَافِعٌ","why":{"en":"The khabar of a plain nominal sentence is marfu', not mansub. Learners give it nasb by confusing it with the khabar of كان (which really is mansub).","tr":"Sıradan bir isim cümlesinde haber merfudur, mansub değil. Öğrenciler bunu kânenin haberi (ki o gerçekten mansubdur) ile karıştırarak nasb verir."}},{"wrong":"الْأَعْمَالَ بِالنِّيَّاتِ","right":"الْأَعْمَالُ بِالنِّيَّاتِ","why":{"en":"The mubtada is marfu' — الْأَعْمَالُ with a damma. Putting it in nasb (الأعمالَ) treats it as an object, but nothing here governs it in nasb.","tr":"Mübteda merfudur — ötreli الْأَعْمَالُ. Nasb vermek (الأعمالَ) onu nesne saymak olur, oysa burada onu nasb edecek bir âmil yoktur."}}]},"mudari-marfu":{"title":{"ar":"رَفْعُ الْمُضَارِعِ بِالتَّجَرُّد","en":"The present verb in raf' — the abstract governor","tr":"Muzârinin tecerrüdle merfû oluşu"},"level":3,"group":"awamil","explanation":{"en":"Birgivi divides governors into the SPOKEN (عَامِلٌ لَفْظِيٌّ) and the ABSTRACT (عَامِلٌ مَعْنَوِيٌّ). The Izhar defines the first as «مَا يَكُونُ لِلِّسَانِ فِيهِ حَظٌّ» — that in which the tongue has a share, i.e. a governor you can pronounce. The abstract governors are only two, and one of them is this: a present verb is in RAF' precisely because nothing is governing it. Its freedom from any nasib (أَنْ، لَنْ، كَيْ، إِذَنْ) and any jazim (لَمْ، لَا الناهية، and the rest of the fifteen) is itself what raises it. So يَنْتَفِعُ carries a damma not because some word put it there, but because no word took it away. The other abstract governor is the one that raises the mubtada and its khabar.","tr":"Birgivî âmilleri LAFZÎ ve MA'NEVÎ diye ikiye ayırır. İzhâr birincisini «مَا يَكُونُ لِلِّسَانِ فِيهِ حَظٌّ» diye tanımlar — kendisinde dil için bir pay bulunan, yani telaffuz edilebilen âmil. Ma'nevî âmiller yalnız ikidir ve biri budur: muzari fiil, tam da kendisine hiçbir şey amel etmediği için REF hâlindedir. Nâsıblardan (أَنْ، لَنْ، كَيْ، إِذَنْ) ve cezm edatlarından (لَمْ، nehiy لَا ve on beşin geri kalanı) hâlî olması, onu ref eden şeyin ta kendisidir. Yani يَنْتَفِعُ dammeyi bir kelime koyduğu için değil, hiçbir kelime almadığı için taşır. Diğer ma'nevî âmil, mübteda ile haberi ref edendir."},"plain":{"en":"Sometimes nothing visible causes the ending: a present verb is marfu' precisely because no particle is standing in front of it.","tr":"Bazen i'rabı görünür bir şey yapmaz: muzâri fiil, başında bir edat bulunmadığı için merfû olur."},"amil":"الْعَامِلُ الْمَعْنَوِيُّ: تَجَرُّدُ الْمُضَارِعِ عَنِ النَّاصِبِ وَالْجَازِمِ — an abstract governor: the verb's very freedom from any nasib or jazim","mamul":"marfu","sources":["العوامل (البيركوي) — العامل المعنوي","إظهار الأسرار (البيركوي)","الكافية (ابن الحاجب)"],"examples":[{"ar":"تَنْتَفِعُ بِهَا وَتَتَبَاعَدُ عَنْهَا.","gloss":{"en":"You benefit from it and keep your distance — both verbs are marfu' because nothing governs them.","tr":"Ondan faydalanır ve uzak durursun — iki fiil de merfûdur, çünkü onlara amel eden bir şey yoktur."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"كُلُّ أُمَّتِي يَدْخُلُونَ الْجَنَّةَ.","gloss":{"en":"All my community enter the Garden — marfu' by the retained ن, again through sheer freedom from a governor.","tr":"Ümmetimin tamamı cennete girer — sabit kalan nûn ile merfû; yine sırf âmilden hâlî olmakla."},"src":"min-muqaddimat-al-maqsud"},{"ar":"لَنْ يَنْتَفِعَ / لَمْ يَنْتَفِعْ.","gloss":{"en":"Compare: the moment a nasib or a jazim arrives, the raf' is gone.","tr":"Karşılaştırın: bir nâsıb yahut câzim girdiği anda ref kalkar."},"src":null}],"mistakes":[{"wrong":"البحث عن عاملٍ ملفوظٍ يرفع المضارع","right":"رَفْعُهُ بِالتَّجَرُّدِ","why":{"en":"Learners hunt for a word that raises the present verb. There is none — the raising is abstract, and naming a word for it is the error.","tr":"Öğrenciler muzariyi ref eden bir kelime ararlar. Böyle bir kelime yoktur — ref ma'nevîdir; ona bir kelime göstermek hatanın kendisidir."}},{"wrong":"أُرِيدُ أَنْ أَذْهَبُ","right":"أُرِيدُ أَنْ أَذْهَبَ","why":{"en":"Once أَنْ is present the verb is no longer «free», so the raf' lapses and nasb takes over.","tr":"أَنْ geldiği anda fiil artık «hâlî» değildir; ref düşer, yerini nasb alır."}}]},"muqabala":{"title":{"ar":"المُقَابَلَة","en":"Muqabala — a set answered by its counterpart, in order","tr":"Mukâbele — bir kümenin karşısına sırasıyla mukâbilini getirmek"},"level":5,"group":"balagha","explanation":{"en":"Muqabala is tibaq scaled up and put in order: you state two or more meanings that agree with one another, and then bring the counterpart of each, following the same sequence. Two against two: «فَلْيَضْحَكُوا قَلِيلًا وَلْيَبْكُوا كَثِيرًا» — laughing answered by weeping, little answered by much. Three against three, in Abu Dulama's line: how fine are religion and this world together, how ugly unbelief and destitution in a man. Four against four in Surat al-Layl: «فَأَمَّا مَنْ أَعْطَى وَاتَّقَى وَصَدَّقَ بِالْحُسْنَىٰ فَسَنُيَسِّرُهُ لِلْيُسْرَىٰ · وَأَمَّا مَنْ بَخِلَ وَاسْتَغْنَىٰ وَكَذَّبَ بِالْحُسْنَىٰ فَسَنُيَسِّرُهُ لِلْعُسْرَىٰ». Sakkaki drew the lesson out: when one side is made the condition of a thing, the other side's contraries are made the condition of that thing's contrary — giving, fearing and affirming share ease; withholding, self-sufficiency and denial share hardship. The order is not decoration. If the counterparts arrive out of sequence, or if one of them is missing, what remains is a heap of opposites, not a muqabala. This is why the figure is at home in law and creed, where a ruling and its converse have to be stated together.","tr":"Mukâbele, tıbâkın büyütülmüş ve sıraya konulmuş hâlidir: birbirine muvâfık iki veya daha çok mana zikredilir, sonra her birinin mukâbili aynı sıra üzere getirilir. İkiye iki: «فَلْيَضْحَكُوا قَلِيلًا وَلْيَبْكُوا كَثِيرًا» — gülmenin karşısında ağlamak, azın karşısında çok. Üçe üç, Ebû Dülâme'nin beytinde: bir insanda din ile dünyanın birleşmesi ne güzel, küfür ile iflâsın birleşmesi ne çirkindir. Dörde dört, Leyl sûresinde: «فَأَمَّا مَنْ أَعْطَى وَاتَّقَى وَصَدَّقَ بِالْحُسْنَىٰ فَسَنُيَسِّرُهُ لِلْيُسْرَىٰ · وَأَمَّا مَنْ بَخِلَ وَاسْتَغْنَىٰ وَكَذَّبَ بِالْحُسْنَىٰ فَسَنُيَسِّرُهُ لِلْعُسْرَىٰ». İmam Sekkâkî bundan şu neticeyi çıkarır: bir taraf bir şeye şart kılınınca, öbür tarafın zıtları da o şeyin zıddına şart kılınır — i'tâ, ittikâ ve tasdîk teysîrde ortaktır; buhl, istiğnâ ve tekzîb ta'sîrde ortaktır. Sıra tezyînat değildir. Mukâbiller sırasız gelir yahut biri eksik kalırsa geriye mukâbele değil, dağınık bir zıtlar yığını kalır. Bu sebeple bu sanat, bir hükmün ve aksinin birlikte söylenmesi gereken fıkıh ve akâid metinlerinde çokça bulunur."},"plain":{"en":"Setting out several things, then answering each of them with its opposite, in the same order.","tr":"Birkaç şeyi sıralayıp sonra her birinin karşılığını aynı sırayla getirmek."},"sources":["تلخيص المفتاح (القزويني) — علم البديع، المحسنات المعنوية","مختصر السعد"],"examples":[{"ar":"الْبَيِّنَةُ لِلْمُدَّعِي وَالْيَمِينُ عَلَى مَنْ أَنْكَرَ.","gloss":{"en":"Two against two, and the order holds: proof belongs to the claimant, oath falls on the denier. Even the two prepositions are counterparts — لِـ for what is in your favour, عَلَى for what is against you.","tr":"İkiye iki, sıra da korunmuş: beyyine müddeîye, yemin münkire. İki harf bile mukâbildir — lehte olan için لِـ, aleyhte olan için عَلَى."},"src":"aqaid-ahl-al-sunna"},{"ar":"مَنْ أَطَاعَنِي دَخَلَ الْجَنَّةَ وَمَنْ عَصَانِي فَقَدْ أَبَى.","gloss":{"en":"Obeying against disobeying, entering the Garden against refusing it — the second half answers the first term for term.","tr":"İtaatin karşısında isyan, cennete girmenin karşısında imtinâ — ikinci yarı, birincisini kelime kelime karşılar."},"src":"min-muqaddimat-al-maqsud"},{"ar":"فَلْيَضْحَكُوا قَلِيلًا وَلْيَبْكُوا كَثِيرًا.","gloss":{"en":"The Talkhis's own example of two against two (al-Tawba 82).","tr":"Telhîs'in ikiye iki için verdiği misal (Tevbe 82)."},"src":null}],"mistakes":[{"wrong":"«وَكُنْ لِلَّهِ فِي سِرِّكَ كَمَا أَنْتَ لَهُ فِي عَلَانِيَتِكَ» مُقَابَلَةٌ","right":"طِبَاقٌ، لِأَنَّ الْمُقَابَلَ لَفْظٌ وَاحِدٌ بِلَفْظٍ وَاحِدٍ","why":{"en":"Only one pair of opposites is in play, سِرّ and عَلَانِيَة. Muqabala needs at least two meanings on each side.","tr":"Ortada tek bir zıt çift vardır: سِرّ ve عَلَانِيَة. Mukâbele için her tarafta en az iki mana bulunmalıdır."}},{"wrong":"«أَعْطَى وَاتَّقَى وَصَدَّقَ ... بَخِلَ وَاسْتَغْنَىٰ وَكَذَّبَ» طِبَاقٌ","right":"مُقَابَلَةٌ بَيْنَ ثَلَاثَةٍ وَثَلَاثَةٍ","why":{"en":"Each of the three has its own counterpart and they arrive in the same order. Calling it tibaq loses the very thing the verse is doing.","tr":"Üçün her birinin kendi mukâbili vardır ve hepsi aynı sıra üzere gelir. Buna tıbâk demek, âyetin yaptığı şeyi kaçırmaktır."}},{"wrong":"يَكْفِي فِي الْمُقَابَلَةِ اجْتِمَاعُ الْأَضْدَادِ وَإِنِ اخْتَلَّ التَّرْتِيبُ","right":"لَا بُدَّ مِنْ مَجِيءِ الْمُقَابِلَاتِ عَلَى تَرْتِيبِ الْأُوَلِ","why":{"en":"The definition says «then the counterpart of each is brought on the order». Shuffle them and the correspondence the hearer is meant to feel is gone.","tr":"Tarif «sonra her birinin mukâbili tertip üzere getirilir» der. Sıra bozulursa dinleyicinin hissetmesi istenen tekâbül kalmaz."}}]},"muraat-al-nazir":{"title":{"ar":"مُرَاعَاةُ النَّظِير (التَّنَاسُب)","en":"Mura'at al-nazir — gathering things that belong together","tr":"Mürâât-ı nazîr (tenâsüb) — birbirine münasip şeyleri bir arada anmak"},"level":5,"group":"balagha","explanation":{"en":"The mirror image of tibaq. There you joined a thing to its opposite; here you join it to its congener — «وَالشَّمْسُ وَالْقَمَرُ بِحُسْبَانٍ», sun kept company by moon. It is also called التَّنَاسُب and التَّوْفِيق. Al-Buhturi's line piles up a whole family at once: the camels are like bent bows, no — like planed arrows, no — like bowstrings; bow, arrow and string all belong to one world, and the ear is satisfied before the sense is. One recognised branch is تَشَابُهُ الأَطْرَافِ, where a passage is ended with something congenial to how it began: «لَا تُدْرِكُهُ الْأَبْصَارُ وَهُوَ يُدْرِكُ الْأَبْصَارَ وَهُوَ اللَّطِيفُ الْخَبِيرُ» — اللَّطِيف, who knows the fine and the hidden, answers the first clause; الْخَبِير, who knows things as they appear, answers the second. And there is a shadow kind, إِيهَامُ التَّنَاسُبِ, where the congeniality holds only through a meaning that is not the one intended: النَّجْم beside الشَّجَر means a stemless plant, but النَّجْم beside الشَّمْس and الْقَمَر sounds like a star. Practically: when you are naming several things in a definition or a description, the tradition asks you to draw them from one field. That is why creed texts list الْحَوَاسّ, الْخَبَر, الْعَقْل together and not knowledge alongside, say, wealth.","tr":"Tıbâkın aynadaki aksi. Orada bir şey zıddıyla birleştiriliyordu; burada nazîriyle birleştirilir — «وَالشَّمْسُ وَالْقَمَرُ بِحُسْبَانٍ»: güneşin yanında ay. Buna tenâsüb ve tevfîk de denir. Buhtürî'nin beyti bütün bir aileyi bir arada anar: develer eğilmiş yaylar gibi, hayır yontulmuş oklar gibi, hayır kirişler gibi; yay, ok ve kiriş tek bir âleme aittir, mana tamamlanmadan kulak razı olur. Bilinen bir dalı teşâbühü'l-etrâftır: sözün, başlangıcına münasip bir şeyle bitirilmesi — «لَا تُدْرِكُهُ الْأَبْصَارُ وَهُوَ يُدْرِكُ الْأَبْصَارَ وَهُوَ اللَّطِيفُ الْخَبِيرُ»: işlerin inceliğini bilen اللَّطِيف birinci cümleye, eşyanın zâhirini bilen الْخَبِير ikinci cümleye münasiptir. Bir de gölge kısmı vardır, îhâmü't-tenâsüb: münasebet ancak murad edilmeyen bir mana yoluyla kurulur — النَّجْم, الشَّجَر yanında gövdesiz bitki demektir, fakat الشَّمْس ve الْقَمَر yanında yıldız gibi işitilir. Amelî neticesi: bir tarifte yahut tavsifte birkaç şey sayarken gelenek onları tek bir sahadan seçmeni ister. Akâid metinlerinin الْحَوَاسّ, الْخَبَر ve الْعَقْل'ı birlikte sayıp yanına meselâ malı koymamasının sebebi budur."},"plain":{"en":"Gathering things that belong to one world: sun with moon, tree with fruit.","tr":"Aynı âleme ait şeyleri bir arada anmak: ay ile güneş, ağaç ile meyve."},"sources":["تلخيص المفتاح (القزويني) — علم البديع، المحسنات المعنوية","مختصر السعد"],"examples":[{"ar":"وَمَاؤُهُ أَبْيَضُ مِنَ اللَّبَنِ وَرِيحُهُ أَطْيَبُ مِنَ الْمِسْكِ.","gloss":{"en":"Water is measured against milk and scent against musk — each comparison drawn from the field its own subject belongs to. Swap them and the tanasub collapses.","tr":"Su süte, koku miske kıyaslanır — her mukayese, kendi mevzuunun ait olduğu sahadan seçilmiştir. Yer değiştirseler tenâsüb bozulur."},"src":"aqaid-ahl-al-sunna"},{"ar":"وَأَسْبَابُ الْعِلْمِ لِلْخَلْقِ ثَلَاثَةٌ: الْحَوَاسُّ السَّلِيمَةُ وَالْخَبَرُ الصَّادِقُ وَالْعَقْلُ.","gloss":{"en":"Three sources of knowledge named together: sense, report, intellect. They are congeners, not opposites — this is the ordinary shape of a definition in the creed books.","tr":"İlmin üç sebebi bir arada anılır: havâss, haber, akıl. Bunlar zıt değil nazîrdir — akâid kitaplarında tarifin âdet üzere aldığı şekil budur."},"src":"aqaid-ahl-al-sunna"},{"ar":"إِنَّ الْعِلْمَ بِلَا عَمَلٍ كَشَجَرٍ بِلَا ثَمَرٍ.","gloss":{"en":"Tree and fruit inside a tashbih: the second term is congenial to the first, which is what makes the image land.","tr":"Bir teşbih içinde ağaç ve meyve: ikinci lafız birincinin nazîridir; tasvirin tutmasını sağlayan da budur."},"src":"wasiyyat-abi-hanifa-L4"},{"ar":"لَا تُدْرِكُهُ الْأَبْصَارُ وَهُوَ يُدْرِكُ الْأَبْصَارَ وَهُوَ اللَّطِيفُ الْخَبِيرُ.","gloss":{"en":"The Talkhis's example of تَشَابُهُ الأَطْرَافِ (al-An'am 103).","tr":"Telhîs'in teşâbühü'l-etrâf için verdiği misal (En'âm 103)."},"src":null}],"mistakes":[{"wrong":"«وَالشَّمْسُ وَالْقَمَرُ» طِبَاقٌ","right":"مُرَاعَاةُ النَّظِيرِ، لِأَنَّهُمَا مُتَنَاسِبَانِ لَا مُتَضَادَّانِ","why":{"en":"Sun and moon are of one field, not two poles. Day against night would be tibaq; sun beside moon is tanasub.","tr":"Güneş ve ay tek bir sahadandır, iki kutup değildir. Gece karşısında gündüz tıbâk olurdu; ayın yanındaki güneş tenâsübdür."}},{"wrong":"كُلُّ لَفْظَيْنِ اجْتَمَعَا فِي جُمْلَةٍ فَبَيْنَهُمَا مُرَاعَاةُ النَّظِيرِ","right":"لَا بُدَّ مِنْ مُنَاسَبَةٍ فِي الْمَعْنَى بَيْنَ الْمُجْتَمِعَيْنِ","why":{"en":"Being in the same sentence is not congeniality. The two have to belong to one kind or one field before the figure is present at all.","tr":"Aynı cümlede bulunmak münasebet değildir. Sanatın var sayılması için iki lafzın tek bir nev'e yahut tek bir sahaya ait olması gerekir."}}]},"naat-sifa":{"title":{"ar":"النَّعْت (الصِّفَة)","en":"The na't (adjective)","tr":"Na't (sıfat)"},"level":3,"group":"nahw","explanation":{"en":"The na't (also called sifa) is the first of the followers (التوابع): it follows its noun (المنعوت) in FOUR things — case, definiteness, gender, and number. In this story: عَزِيزًا مُحْتَرَمًا — «honored» follows «dear» in nasb and indefiniteness. Contrast with the hal: a definite word after a definite noun is a na't (الرَّجُلُ الْكَرِيمُ, the generous man); an indefinite mansub after a definite noun is a hal. Birgivi lists the followers at the end of the Awamil as governed «by way of following» (بالتبعية).","tr":"Na't (sıfat) tâbilerin ilkidir: mevsûfuna (men'ût) DÖRT şeyde uyar — i'rab, marifelik-nekrelik, müzekkerlik-müenneslik ve sayı. Hikâyede: عَزِيزًا مُحْتَرَمًا — «saygın», «aziz» kelimesine nasbda ve nekrelikte uyar. Hâl ile farkı: marife isimden sonra marife kelime sıfattır (الرَّجُلُ الْكَرِيمُ); marife isimden sonra nekre mansub ise hâldir. Birgivî, Avâmil'in sonunda tâbileri «tebe'iyyet yoluyla» âmillenmiş sayar."},"plain":{"en":"An adjective. It copies its noun in case, number, gender and definiteness.","tr":"Sıfat. Nitelediği ismi i'rabda, sayıda, cinste ve belirlilikte takip eder."},"mamul":"tabai","sources":["العوامل (البيركوي) — التوابع","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"examples":[{"ar":"صِرْتَ فِيهِمْ عَزِيزًا مُحْتَرَمًا.","gloss":{"en":"You become dear and honored among them — the na't follows its noun in nasb.","tr":"Aralarında aziz ve saygın olursun — na't, mevsûfuna nasbda uyar."},"src":"wasiyyat-abi-hanifa-L4"},{"ar":"الرَّجُلُ الْكَرِيمُ مَحْبُوبٌ.","gloss":{"en":"The generous man is beloved — definite noun, definite na't.","tr":"Cömert adam sevilir — marife isim, marife na't."},"src":null},{"ar":"قَرَأْتُ كِتَابًا مُفِيدًا.","gloss":{"en":"I read a useful book — indefinite noun, indefinite na't.","tr":"Faydalı bir kitap okudum — nekre isim, nekre na't."},"src":null}],"mistakes":[{"wrong":"قرأتُ كتابًا مفيدٌ","right":"قرأتُ كتابًا مفيدًا","why":{"en":"The na't must match its noun's case — after a mansub noun the adjective takes nasb too.","tr":"Sıfat, mevsûfun i'rabına uymalıdır — mansub isimden sonra sıfat da nasb alır."}},{"wrong":"الرجلُ كريمُ (نعتًا)","right":"الرجلُ الْكَرِيمُ","why":{"en":"A na't of a definite noun must itself be definite; without ال the sentence turns into mubtada + khabar («the man is generous»).","tr":"Marife ismin sıfatı da marife olmalıdır; ال düşerse cümle mübteda-haber olur («adam cömerttir»)."}},{"wrong":"طالبةٌ مجتهدٌ","right":"طالبةٌ مجتهدةٌ","why":{"en":"The na't follows in gender as well — feminine noun takes a feminine adjective.","tr":"Sıfat cinsiyette de uyar — müennes isme müennes sıfat gelir."}}]},"naib-al-fail":{"title":{"ar":"نَائِبُ الْفَاعِل (الْمَبْنِيُّ لِلْمَجْهُول)","en":"The naib al-fail (passive and its deputy subject)","tr":"Nâib-i fâil (meçhul sîga)"},"level":4,"group":"nahw","explanation":{"en":"When the doer is not named, Arabic rebuilds the verb rather than adding a word for «by». The verb is put into the majhul pattern and the former direct object steps up into the doer's place, in RAF', as the نَائِبُ الْفَاعِل — the deputy subject. The vowelling is fixed: in the past, damma on the first letter and kasra on the letter before the last (سَأَلَ ← سُئِلَ, كَتَبَ ← كُتِبَ); in the present, damma on the prefix and fatha before the last (يَسْأَلُ ← يُسْأَلُ, يَكْتُبُ ← يُكْتَبُ). Hollow verbs shift to kasra instead: قَالَ ← قِيلَ, يَقُولُ ← يُقَالُ. Birgivi counts the naib al-fail second among the nine marfu'at, immediately after the fa'il, because it occupies the same position.","tr":"Fâil zikredilmediğinde Arapça, «tarafından» diye bir kelime eklemek yerine fiili yeniden kurar. Fiil meçhul kalıbına sokulur ve önceki mef'ûlün bih, fâilin yerine geçerek REF hâlini alır: NÂİB-İ FÂİL. Harekeleme sabittir: mazide ilk harf ötreli, son harften önceki kesreli olur (سَأَلَ ← سُئِلَ, كَتَبَ ← كُتِبَ); muzaride önek ötreli, son harften önceki fethalı olur (يَسْأَلُ ← يُسْأَلُ, يَكْتُبُ ← يُكْتَبُ). Ecvef fiiller kesreye döner: قَالَ ← قِيلَ, يَقُولُ ← يُقَالُ. Birgivî, nâib-i fâili dokuz merfûâtın ikincisi sayar, hemen fâilden sonra; çünkü onun yerini tutar."},"plain":{"en":"When nobody is named as doing it, the thing acted on moves into the doer's place.","tr":"Yapan anılmadığında, kendisine iş yapılan şey fâilin yerine geçer."},"mamul":"marfu","sources":["العوامل (البيركوي) — المرفوعات","إظهار الأسرار (البيركوي)","الفوائد الضيائية (ملا جامي)","الكافية (ابن الحاجب)"],"question":{"tr":["Ne?","Kim?"],"en":["What?","Who?"]},"examples":[{"ar":"وَلَا تَتَكَلَّمْ بَيْنَ يَدَيِ الْعَامَّةِ إِلَّا بِمَا تُسْأَلُ عَنْهُ.","gloss":{"en":"Do not speak before the common people except about what you are asked — تُسْأَلُ is majhul; its deputy subject is the hidden «you».","tr":"Avamın huzurunda ancak sorulan şey hakkında konuş — تُسْأَلُ meçhuldür, nâib-i fâili gizli «sen» zamiridir."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"كُتِبَ الدَّرْسُ.","gloss":{"en":"The lesson was written — the former object الدَّرْسَ now stands in raf' as naib al-fail.","tr":"Ders yazıldı — eskiden mef'ûl olan الدَّرْسَ şimdi nâib-i fâil olarak ref hâlindedir."},"src":null},{"ar":"قِيلَ لَهُ.","gloss":{"en":"It was said to him — a hollow verb takes kasra in the passive, not damma.","tr":"Ona denildi — ecvef fiil meçhulde damme değil kesre alır."},"src":null}],"mistakes":[{"wrong":"كُتِبَ الدَّرْسَ","right":"كُتِبَ الدَّرْسُ","why":{"en":"Once the verb is passive its object BECOMES the deputy subject and must take raf'. Leaving it in nasb is the commonest passive error.","tr":"Fiil meçhul olunca mef'ûl, nâib-i fâile DÖNÜŞÜR ve ref alır. Onu mansub bırakmak en sık yapılan meçhul hatasıdır."}},{"wrong":"كُتِبَ الدَّرْسُ مِنْ قِبَلِ الطَّالِبِ (في الفصيح)","right":"كَتَبَ الطَّالِبُ الدَّرْسَ","why":{"en":"Classical Arabic does not name the doer of a passive verb — that is the whole point of «majhul» (unknown). If the doer matters, use the active. The «مِنْ قِبَلِ» construction is a modern calque.","tr":"Klasik Arapçada meçhul fiilin fâili zikredilmez — «meçhul» (bilinmeyen) denmesinin sebebi budur. Fâil önemliyse malum sîga kullanılır. «مِنْ قِبَلِ» kalıbı modern bir çeviri alışkanlığıdır."}},{"wrong":"قُولَ لَهُ","right":"قِيلَ لَهُ","why":{"en":"Hollow verbs take kasra on the first letter in the passive, and the weak letter turns to ي: قَالَ ← قِيلَ, not *قُولَ.","tr":"Ecvef fiiller meçhulde ilk harflerini kesreli alır ve illet harfi yâya döner: قَالَ ← قِيلَ, *قُولَ değil."}}]},"naqis-verbs":{"title":{"ar":"الْفِعْلُ النَّاقِص","en":"Defective verbs (final و or ي)","tr":"Nâkıs fiil (sonu و veya ي)"},"level":3,"group":"sarf","explanation":{"en":"A naqis verb ends in و or ي: رَمَى (رَمَيَ), دَعَا (دَعَوَ), خَلَا, عَصَى. Four rules do almost all the work. FIRST, a voweled و or ي preceded by fatha turns into alif — that is why the past looks like رَمَى and غَزَا rather than رَمَيَ and غَزَوَ. SECOND, a damma on a final و or ي is simply dropped as too heavy: يَغْزُوُ → يَغْزُو, يَرْمِيُ → يَرْمِي. So the present ends in a long vowel with no visible case ending, and its raf' is مُقَدَّر — implied. THIRD, a kasra in the same position goes the same way: تَغْزُوِينَ → تَغْزِينَ, تَرْمِيِينَ → تَرْمِينَ. FOURTH, in anything longer than three letters a final و turns into ي: أَعْطَوَ → أَعْطَى, اِعْتَدَوَ → اِعْتَدَى — which is why ادَّعَى, from the root د ع و, still ends in ى. The practical consequences: before تْ the weak letter vanishes (رَمَتْ, خَلَتْ); in the jussive it vanishes too (لَمْ يَرْمِ, لَمْ يَخْلُ); the imperative is bare (اِرْمِ, اُخْلُ); and the ism fa'il is manqus (رَامٍ / الرَّامِي, مُدَّعٍ / الْمُدَّعِي). This is precisely why the app stores these forms rather than deriving them.","tr":"Nâkıs fiilin sonu و veya ي'dir: رَمَى (رَمَيَ), دَعَا (دَعَوَ), خَلَا، عَصَى. Dört kaide işin neredeyse tamamını görür. BİRİNCİ: harekeli و/ي, öncesi fethalı ise elife kalbolur — mâzinin رَمَى ve غَزَا görünmesinin sebebi budur. İKİNCİ: sondaki و/ي üzerindeki damme ağır geldiği için düşer: يَغْزُوُ → يَغْزُو، يَرْمِيُ → يَرْمِي. Böylece muzâri uzun bir sesle biter, i'rab alâmeti görünmez ve ref takdîrî olur. ÜÇÜNCÜ: aynı yerdeki kesre de düşer: تَغْزُوِينَ → تَغْزِينَ، تَرْمِيِينَ → تَرْمِينَ. DÖRDÜNCÜ: üç harften uzun kelimelerde sondaki و, يا'ya kalbolur: أَعْطَوَ → أَعْطَى، اِعْتَدَوَ → اِعْتَدَى — د ع و kökünden gelen ادَّعَى'nın ى ile bitmesi bundandır. Pratik neticeler: tâ-i te'nisten önce illetli harf düşer (رَمَتْ، خَلَتْ); cezmde de düşer (لَمْ يَرْمِ، لَمْ يَخْلُ); emir çıplaktır (اِرْمِ، اُخْلُ); ism-i fâili mankûstur (رَامٍ / الرَّامِي، مُدَّعٍ / الْمُدَّعِي). Uygulamanın bu şekilleri türetmek yerine saklamasının sebebi tam olarak budur."},"plain":{"en":"Verbs ending in و or ي, like رَمَى. The final letter shifts or falls away depending on what comes after it.","tr":"Sonu و veya ي olan fiiller (رَمَى gibi). Son harf, gelen eke göre değişir yahut düşer."},"sources":["مراح الأرواح","بناء الأفعال — الأقسام السبعة","المقصود"],"examples":[{"ar":"رَمَتْهُمْ بِحِجَارَةٍ.","gloss":{"en":"They pelted them with stones — before the feminine تْ the ي of رَمَى disappears.","tr":"Onlara taşlar attılar — tâ-i te'nisten önce رَمَى'nın yâsı düşer."},"src":"ashab-al-fil"},{"ar":"قَدْ خَلَتْ مِنْ قَبْلِهِ الرُّسُلُ.","gloss":{"en":"Messengers have passed away before him — the same loss in خَلَا, a defective wawi.","tr":"Ondan önce resuller gelip geçti — nâkıs-ı vâvî olan خَلَا'da da aynı düşme."},"src":"aqaid-ahl-al-sunna"},{"ar":"صِدْقِ مَنِ ادَّعَى أَنَّهُ رَسُولٌ.","gloss":{"en":"…of one who claims to be a messenger — ادَّعَى is from د ع و, yet ends in ى because the word runs past three letters.","tr":"…resul olduğunu iddia eden kimsenin — ادَّعَى, د ع و kökündendir, fakat kelime üç harfi aştığı için ى ile biter."},"src":"aqaid-ahl-al-sunna"},{"ar":"الْبَيِّنَةُ لِلْمُدَّعِي.","gloss":{"en":"The proof is on the claimant — the ism fa'il of a defective verb is a manqus noun.","tr":"Beyyine davacıya aittir — nâkıs fiilin ism-i fâili mankûs isimdir."},"src":"aqaid-ahl-al-sunna"}],"mistakes":[{"wrong":"لَمْ يَرْمِي","right":"لَمْ يَرْمِ","why":{"en":"The jussive of a defective verb is marked by DROPPING the weak letter, not by a sukun. Nothing is left to carry one.","tr":"Nâkıs fiilin cezmi sükûnla değil, illetli harfin HAZFİYLE olur. Sükûn taşıyacak harf kalmaz."}},{"wrong":"رَمَيَتْ الطُّيُورُ","right":"رَمَتِ الطُّيُورُ","why":{"en":"Before تْ the ي falls away: رَمَتْ, not رَمَيَتْ.","tr":"Tâ-i te'nisten önce ي düşer: رَمَتْ، رَمَيَتْ değil."}},{"wrong":"جَاءَ الْقَاضِي — «الْقَاضِي» مَرْفُوعٌ بِضَمَّةٍ ظَاهِرَةٍ","right":"مَرْفُوعٌ بِضَمَّةٍ مُقَدَّرَةٍ عَلَى الْيَاءِ","why":{"en":"The damma was dropped as too heavy on the ي. It is still raf' — but the mark is implied, and saying it is visible misreads the whole class.","tr":"Damme, يا üzerinde ağır geldiği için düşmüştür. İ'rab yine reftir, fakat alâmeti takdîrîdir."}},{"wrong":"اِرْمِي الْحَجَرَ (أَمْرًا لِلْمُذَكَّرِ)","right":"اِرْمِ الْحَجَرَ","why":{"en":"اِرْمِي is the feminine singular imperative. The masculine drops the weak letter entirely: اِرْمِ.","tr":"اِرْمِي müennes tekil emirdir. Müzekkerde illetli harf tamamen düşer: اِرْمِ."}}]},"nun-tawkid":{"title":{"ar":"نُونُ التَّوْكِيدِ","en":"The nun of emphasis","tr":"Te'kid nûnu"},"level":4,"group":"nahw","explanation":{"en":"The نُونُ التَّوْكِيدِ comes heavy (ـنَّ) or light (ـنْ) and fastens to the mudari' — most often after a prohibition, a command, an oath's lam (وَاللهِ لَأَفْعَلَنَّ), or a question. When it attaches directly, the verb becomes MABNI on fatha: the fatha of تَحْقِرَنَّ is building, not nasb, and if a jazim like لَا النَّاهِيَة stands before the verb, the jazm survives «in position» (فِي مَحَلِّ جَزْمٍ). The five-verbs endings interact with it: their nun of raf' drops before the nun of emphasis (تَفْعَلُونَ + نَّ → تَفْعَلُنَّ). The wasiyya's counsel list runs on this nun: لَا تَحْقِرَنَّ، لَا تُقَصِّرَنَّ، لَا تُخْرِجَنَّ، لَا تَثِقَنَّ، لَا تَقُولَنَّ — five prohibitions, each nailed shut.","tr":"Te'kid nûnu şeddeli (ـنَّ) yahut sâkin (ـنْ) gelir ve muzâriye bitişir — en çok nehiyden, emirden, kasem lâmından (وَاللهِ لَأَفْعَلَنَّ) yahut istifhamdan sonra. Doğrudan bitiştiğinde fiil fetha üzere MEBNÎ olur: تَحْقِرَنَّ'deki fetha binâdır, nasb değildir; başta لَا النَّاهِيَة gibi bir câzim varsa cezm «mahallen» devam eder (فِي مَحَلِّ جَزْمٍ). Beş fiilin sonlarıyla da etkileşir: ref nûnları, te'kid nûnundan önce düşer (تَفْعَلُونَ + نَّ → تَفْعَلُنَّ). Vasiyetin nasihat listesi bu nûnla yürür: لَا تَحْقِرَنَّ، لَا تُقَصِّرَنَّ، لَا تُخْرِجَنَّ، لَا تَثِقَنَّ، لَا تَقُولَنَّ — beş nehiy, beşi de perçinli."},"plain":{"en":"A doubled nun on the end of a present verb — لَا تَحْقِرَنَّ «do not EVER despise» — hammers the verb home. The verb ends in fatha because of the nun, not because anything made it nasb.","tr":"Muzârinin sonuna gelen şeddeli nûn — لَا تَحْقِرَنَّ «sakın hor görme» — fiili perçinler. Fiilin sonundaki fetha nûn yüzündendir; hiçbir âmil onu nasb etmiş değildir."},"sources":["قطر الندى (ابن هشام) — إعراب المضارع","الكافية (ابن الحاجب)"],"examples":[{"ar":"وَلَا تَحْقِرَنَّ أَحَدًا يَقْصِدُكَ.","gloss":{"en":"«And do not EVER despise anyone who seeks you out» — the verb is built on fatha by the heavy nun, in the position of jazm under لا.","tr":"«Sana yönelen hiç kimseyi sakın hor görme» — fiil, şeddeli nûnla fetha üzere mebnîdir; لا altında mahallen meczumdur."},"src":"wasiyyat-abi-hanifa-samti"},{"ar":"وَتَاللهِ لَأَكِيدَنَّ أَصْنَامَكُمْ.","gloss":{"en":"«By Allah, I shall surely scheme against your idols» (al-Anbiya 21:57) — the oath's lam and the heavy nun clamp the verb from both ends.","tr":"«Vallahi putlarınıza mutlaka bir tuzak kuracağım» (Enbiyâ 21:57) — kasem lâmı ile şeddeli nûn fiili iki uçtan kenetler."},"src":null}],"mistakes":[{"wrong":"لَا تَحْقِرَنَّ — فِعْلٌ مَنْصُوبٌ","right":"فِعْلٌ مَبْنِيٌّ عَلَى الْفَتْحِ فِي مَحَلِّ جَزْمٍ بِلَا النَّاهِيَةِ","why":{"en":"The fatha before the nun of emphasis is building, not nasb — no nasb governor is anywhere in the sentence; لا of prohibition still holds the verb in the position of jazm.","tr":"Te'kid nûnundan önceki fetha binâdır, nasb değildir — cümlede hiçbir nasb âmili yoktur; nehiy lâ'sı fiili mahallen cezimde tutar."}},{"wrong":"لَا تَقُولُنَّ","right":"لَا تَقُولَنَّ","why":{"en":"Directly attached, the nun of emphasis takes fatha before it; damma would pretend the raf' survived the prohibition.","tr":"Doğrudan bitişen te'kid nûnundan önce fetha gelir; zamme, nehye rağmen ref sürüyormuş gibi olurdu."}}]},"qad-harf":{"title":{"ar":"قَدْ (حَرْفُ التَّحْقِيقِ وَالتَّقْلِيلِ)","en":"The particle قَدْ","tr":"قَدْ (tahkîk ve taklîl harfi)"},"level":3,"group":"nahw","explanation":{"en":"قَدْ enters only on verbs, and what it does depends on the tense. Before a MADI it is تَحْقِيق — it affirms the act and pulls it close to the present: قَدْ خَلَتْ, «they have indeed passed away» rather than a bare «they passed». Before a MUDARI' it usually means the opposite, تَقْلِيل — «sometimes, it may be»: قَدْ يَصْدُقُ الْكَذُوبُ, «a liar does sometimes tell the truth». It governs nothing, so it changes no ending; it only conditions the reading. One consequence matters in i'rab: قَدْ + madi is one of the standard ways a past clause is licensed to serve as a hal — قَدْ is what makes «جَاءَ وَقَدْ غَابَتِ الشَّمْسُ» acceptable.","tr":"قَدْ yalnız fiillerin başına gelir ve işlevi zamana göre değişir. MÂZİ'nin başında tahkîk içindir; fiili te'kid eder ve hâle yaklaştırır: قَدْ خَلَتْ, «gelip geçmişlerdir». MUZÂRİ'nin başında ise çoğunlukla tersini, taklîli ifade eder: قَدْ يَصْدُقُ الْكَذُوبُ, «yalancı bazen doğru söyler». Amel etmez, hiçbir i'rabı değiştirmez; sadece manayı belirler. İ'rab açısından şu önemlidir: قَدْ + mâzi, mâzi cümlesinin hâl olabilmesinin standart yollarından biridir — «جَاءَ وَقَدْ غَابَتِ الشَّمْسُ» ifadesini caiz kılan قَدْ'dir."},"plain":{"en":"قَدْ before a past verb means «has indeed»; before a present verb it usually means «sometimes».","tr":"قَدْ mâzînin başında «gerçekten…-dı», muzârinin başında çoğunlukla «bazen» manası verir."},"sources":["العوامل (البيركوي) — الحروف","قطر الندى (ابن هشام)"],"examples":[{"ar":"قَدْ خَلَتْ مِنْ قَبْلِهِ الرُّسُلُ.","gloss":{"en":"Messengers have indeed passed away before him — قَدْ before a past verb affirms it.","tr":"Ondan önce resuller muhakkak gelip geçti — قَدْ mâzinin başında onu te'kid eder."},"src":"aqaid-ahl-al-sunna"},{"ar":"قَدْ يَصْدُقُ الْكَذُوبُ.","gloss":{"en":"A habitual liar does sometimes tell the truth — قَدْ before a mudari' means «sometimes».","tr":"Yalancı bazen doğru söyler — قَدْ muzârinin başında «bazen» manasındadır."},"src":null}],"mistakes":[{"wrong":"قَدْ الرَّجُلُ ذَهَبَ","right":"قَدْ ذَهَبَ الرَّجُلُ","why":{"en":"قَدْ attaches directly to the verb; nothing may come between them.","tr":"قَدْ doğrudan fiile bitişir; araya hiçbir kelime giremez."}},{"wrong":"قَدْ يَذْهَبُ أَمْسِ","right":"قَدْ ذَهَبَ أَمْسِ","why":{"en":"قَدْ with a mudari' reads as «sometimes / may», which cannot be combined with «yesterday». For a completed past act use قَدْ + madi.","tr":"قَدْ + muzâri «bazen / olabilir» manasındadır ve «dün» ile birleşmez. Tamamlanmış geçmiş için قَدْ + mâzi kullanılır."}}]},"qasr":{"title":{"ar":"الْقَصْر (الْحَصْر)","en":"Restriction — «only this, and nothing else»","tr":"Kasr (hasr) — «ancak bu»"},"level":4,"group":"balagha","explanation":{"en":"Qasr is confining one thing to another: this predicate to this subject and to nothing else. Arabic has four standard ways to do it, and they are not interchangeable. (1) NEGATION THEN EXCEPTION — مَا مُحَمَّدٌ إِلَّا رَسُولٌ. This is the strongest and the most explicit; it is used when the listener firmly believes the opposite, and it denies before it affirms. (2) إِنَّمَا — إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ. Softer, and used when the point is treated as already granted or easily granted; it affirms without a preceding denial. (3) FRONTING what would normally come later — إِيَّاكَ نَعْبُدُ puts the object first and thereby confines the worship. (4) The particles إِنَّمَا's cousins, بَلْ and لَا and لَكِنْ, which restrict by correcting. Reading the choice is the skill: the hadith says إِنَّمَا الْأَعْمَالُ because nobody was denying it, while the verse says مَا مُحَمَّدٌ إِلَّا رَسُولٌ at a moment when people were doing exactly that.","tr":"Kasr, bir şeyi başka bir şeye hasretmektir: bu hükmü bu konuya, başkasına değil. Arapçada dört yolu vardır ve birbirinin yerine geçmezler. (1) NEFY VE İSTİSNÂ — مَا مُحَمَّدٌ إِلَّا رَسُولٌ. En kuvvetli ve en açık olanıdır; muhatap aksine kesin inandığında kullanılır, ispattan önce nefyeder. (2) إِنَّمَا — إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ. Daha yumuşaktır; hüküm zaten kabul edilmiş yahut kolay kabul edilir sayıldığında kullanılır, öncesinde nefy olmadan ispat eder. (3) TAKDÎM — normalde sonra gelecek olanı öne almak: إِيَّاكَ نَعْبُدُ mef'ûlü öne alır ve ibadeti böylece hasreder. (4) بَلْ، لَا، لَكِنْ gibi tashih yoluyla hasreden edatlar. Hangisinin seçildiğini okumak asıl hünerdir: hadis إِنَّمَا الْأَعْمَالُ der, çünkü kimse bunu inkâr etmiyordu; âyet ise insanların tam da bunu yaptığı bir anda مَا مُحَمَّدٌ إِلَّا رَسُولٌ der."},"plain":{"en":"The ways of saying «only this, and nothing else».","tr":"«Yalnız bu, başkası değil» demenin yolları."},"sources":["تلخيص المفتاح (القزويني) — علم المعاني","مختصر السعد","الكافية (ابن الحاجب)"],"examples":[{"ar":"إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ.","gloss":{"en":"Deeds are only by intentions — إِنَّمَا, affirming what nobody was contesting.","tr":"Ameller ancak niyetlerledir — kimsenin itiraz etmediğini ispat eden إِنَّمَا."},"src":"deeds-are-by-intentions"},{"ar":"وَمَا مُحَمَّدٌ إِلَّا رَسُولٌ.","gloss":{"en":"Muhammad is but a messenger — negation then exception, at a moment when people believed otherwise.","tr":"Muhammed ancak bir resuldür — insanların aksine inandığı bir anda nefy ve istisnâ."},"src":"aqaid-ahl-al-sunna"},{"ar":"وَإِنَّمَا أُوصِيكَ لِمَصْلَحَتِكَ وَمَصْلَحَةِ الْمُسْلِمِينَ.","gloss":{"en":"I counsel you only for your good and the good of the Muslims — إِنَّمَا confining the motive.","tr":"Sana ancak senin ve Müslümanların iyiliği için nasihat ediyorum — sebebi hasreden إِنَّمَا."},"src":"wasiyyat-abi-yusuf-L5"}],"mistakes":[{"wrong":"إِنَّمَا وَمَا … إِلَّا سَوَاءٌ","right":"لَا؛ «مَا … إِلَّا» لِلْمُنْكِرِ، وَ«إِنَّمَا» لِغَيْرِ الْمُنْكِرِ","why":{"en":"They restrict the same thing but address different listeners. Choosing the wrong one is a mistake of tone, and tone is what balagha is about.","tr":"İkisi de aynı şeyi hasreder fakat farklı muhataba hitap eder. Yanlışını seçmek üslup hatasıdır; belâgat da zaten üsluptur."}},{"wrong":"«إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ» — «الْأَعْمَالُ» اسْمُ إِنَّ مَنْصُوبٌ","right":"مَرْفُوعٌ، لِأَنَّ «مَا» كَفَّتْ «إِنَّ» عَنِ الْعَمَلِ","why":{"en":"The مَا that turns إِنَّ into a restrictor also strips its government, so the noun goes back to raf'. The rhetoric and the grammar move together.","tr":"إِنَّ'yi hasr edatına çeviren مَا, aynı zamanda amelini de düşürür; isim ref'e döner. Belâgat ile nahiv birlikte hareket eder."}}]},"saj":{"title":{"ar":"السَّجْع","en":"Saj' — prose that agrees at the pause","tr":"Seci — nesirde fâsılaların bir harf üzerinde birleşmesi"},"level":6,"group":"balagha","explanation":{"en":"Saj' is the agreement of two فَوَاصِل — the last word of each clause — upon one letter. Al-Sakkaki put it in a sentence: saj' is to prose what qafiya is to verse. The kinds are told apart by how the two fawasil stand to each other. If they differ in wazn, it is مُطَرَّف: «مَا لَكُمْ لَا تَرْجُونَ لِلَّهِ وَقَارًا · وَقَدْ خَلَقَكُمْ أَطْوَارًا». If they do not differ, and most or all of the words of one clause match their counterparts in the other in wazn and in rhyme, it is تَرْصِيع — the tightest weave, as in al-Hariri's «يَطْبَعُ الْأَسْجَاعَ بِجَوَاهِرِ لَفْظِهِ وَيَقْرَعُ الْأَسْمَاعَ بِزَوَاجِرِ وَعْظِهِ». Anything else is مُتَوَازٍ: «فِيهَا سُرُرٌ مَرْفُوعَةٌ وَأَكْوَابٌ مَوْضُوعَةٌ», where only the fawasil answer each other. On length: the finest saj' has clauses of equal measure; after that, the one whose second clause is the longer; and bringing a second or third clause much shorter than the first is held to be ugly. Saj' is built on sukun at the pause — «مَا أَبْعَدَ مَا فَاتْ وَمَا أَقْرَبَ مَا هُوَ آتْ» — so the ending you hear is the one that counts, not the case vowel on the page. Two cautions the books add themselves. Many scholars decline to use the word for the Qur'an and say فَاصِلَة instead. And لُزُومُ مَا لَا يَلْزَمُ is the further refinement of matching a letter the rhyme never required: «فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ · وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ», where both fawasil agree on ه before the ر that alone was needed.","tr":"Seci, iki fâsılanın — her karînenin son kelimesinin — bir harf üzerinde ittifak etmesidir. Sekkâkî bunu tek cümlede söyler: nesirde seci, şiirde kafiye gibidir. Kısımlar, iki fâsılanın birbirine nispetine göre ayrılır. Vezinde ihtilâf ederlerse mutarraf olur: «مَا لَكُمْ لَا تَرْجُونَ لِلَّهِ وَقَارًا · وَقَدْ خَلَقَكُمْ أَطْوَارًا». İhtilâf etmez ve bir karînedeki lafızların çoğu yahut hepsi, öbür karînedeki mukâbilinin vezin ve kafiyede misli olursa tersî' olur — en sıkı dokuma; Harîrî'nin «يَطْبَعُ الْأَسْجَاعَ بِجَوَاهِرِ لَفْظِهِ وَيَقْرَعُ الْأَسْمَاعَ بِزَوَاجِرِ وَعْظِهِ» sözünde olduğu gibi. Bunun dışındakine mütevâzî denir: «فِيهَا سُرُرٌ مَرْفُوعَةٌ وَأَكْوَابٌ مَوْضُوعَةٌ»; burada yalnız fâsılalar birbirini karşılar. Uzunluk bahsinde: secinin en güzeli karîneleri müsâvî olanıdır; sonra ikinci karînesi daha uzun olanı; ikinci yahut üçüncü karîneyi birincisinden çok kısa getirmek güzel görülmemiştir. Seciler sonlarının sükûnu üzerine mebnîdir — «مَا أَبْعَدَ مَا فَاتْ وَمَا أَقْرَبَ مَا هُوَ آتْ» — yani hesaba giren, sayfadaki i'râb harekesi değil, vakıfta işitilen sondur. Kitapların kendi koyduğu iki kayıt: birçok âlim Kur'an için bu kelimeyi kullanmaz, fâsıla der. Ve lüzûm-ı mâ lâ yelzem, kafiyenin hiç istemediği bir harfte dahi ittifak etmektir: «فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ · وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ» — yalnız ر kâfî iken iki fâsıla ondan önceki ه'da da birleşmiştir."},"plain":{"en":"Prose whose clauses end on the same sound, the way verse rhymes.","tr":"Cümleleri, şiirin kafiyesi gibi aynı sesle biten nesir."},"sources":["تلخيص المفتاح (القزويني) — علم البديع، المحسنات اللفظية","مختصر السعد"],"examples":[{"ar":"أَكْرِمِ الْعُلَمَاءَ وَاحْتَرِمِ الْكِبَارَ وَارْحَمِ الصِّغَارَ.","gloss":{"en":"الْكِبَارَ and الصِّغَارَ are the two fawasil: one wazn, one rhyme letter — and also a tibaq. The imperatives do not match in wazn (اِفْتَعِلْ against اِفْعَلْ), so it is مُتَوَازٍ and not tarsi'.","tr":"الْكِبَارَ ve الصِّغَارَ iki fâsıladır: vezin bir, kafiye harfi bir — üstelik aralarında tıbâk vardır. Emirler vezinde uyuşmadığı için (اِفْتَعِلْ karşısında اِفْعَلْ) bu, tersî' değil mütevâzî secidir."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"فِيهَا سُرُرٌ مَرْفُوعَةٌ وَأَكْوَابٌ مَوْضُوعَةٌ.","gloss":{"en":"The Talkhis's example of مُتَوَازٍ: the fawasil agree, while سُرُر and أَكْوَاب do not (al-Ghashiya 13-14).","tr":"Telhîs'in mütevâzî için verdiği misal: fâsılalar birleşir, سُرُر ile أَكْوَاب birleşmez (Ğâşiye 13-14)."},"src":null},{"ar":"مَا أَبْعَدَ مَا فَاتْ وَمَا أَقْرَبَ مَا هُوَ آتْ.","gloss":{"en":"An Arab saying quoted to show that saj' is built on the pausal sukun — فَاتْ and آتْ rhyme only when they are stopped on.","tr":"Secinin vakıf sükûnu üzerine kurulduğunu göstermek için nakledilen bir Arap sözü — فَاتْ ile آتْ ancak üzerinde vakfedilince kafiyeleşir."},"src":null}],"mistakes":[{"wrong":"«إِنَّ الْعِلْمَ بِلَا عَمَلٍ كَشَجَرٍ بِلَا ثَمَرٍ» سَجْعٌ","right":"لَيْسَ بِسَجْعٍ لِاخْتِلَافِ حَرْفِ الْفَاصِلَتَيْنِ (ل / ر)، وَإِنَّمَا اتَّفَقَا فِي الْوَزْنِ","why":{"en":"عَمَل and ثَمَر are both فَعَل and the two clauses are perfectly parallel, which is why the sentence sounds like saj'. But saj' is defined by agreement on the final letter, and these two end on different ones.","tr":"عَمَل ve ثَمَر ikisi de فَعَل vezninde ve iki karîne tam mütenâzırdır; cümlenin seci gibi işitilmesinin sebebi budur. Fakat seci son harfteki ittifakla tarif edilir ve bu ikisi ayrı harflerle biter."}},{"wrong":"يُعْتَبَرُ فِي السَّجْعِ آخِرُ الْكَلِمَةِ بِحَرَكَةِ الْإِعْرَابِ","right":"الْأَسْجَاعُ مَبْنِيَّةٌ عَلَى الْوَقْفِ وَالسُّكُونِ","why":{"en":"The rhyme is heard where the reciter stops. Judging it by the i'rab vowel would break pairs the ear accepts and admit pairs it rejects.","tr":"Kafiye, okuyanın vakfettiği yerde işitilir. İ'râb harekesine göre hüküm vermek, kulağın kabul ettiği çiftleri bozar, reddettiklerini kabul ettirir."}},{"wrong":"كُلَّمَا تَقَارَبَتِ الْفَوَاصِلُ حَسُنَ السَّجْعُ وَلَوْ قَصُرَتِ الْقَرِينَةُ الثَّانِيَةُ جِدًّا","right":"أَحْسَنُهُ مَا تَسَاوَتْ قَرَائِنُهُ، ثُمَّ مَا طَالَتْ ثَانِيَتُهُ","why":{"en":"The book rules a second or third clause much shorter than the first to be ugly. The rhyme is not enough on its own; the measure has to carry it.","tr":"Kitap, ikinci yahut üçüncü karîneyi birincisinden çok kısa getirmeyi güzel saymaz. Kafiye tek başına yetmez; ölçünün de onu taşıması gerekir."}}]},"sifa-mushabbaha":{"title":{"ar":"الصِّفَةُ الْمُشَبَّهَة","en":"The sifa mushabbaha (adjective of permanent quality)","tr":"Sıfat-ı müşebbehe"},"level":6,"group":"nahw","explanation":{"en":"The sifa mushabbaha is «likened» to the ism fail because it too is derived and governs like a verb — but it names a SETTLED quality rather than a passing act: حَسَن «beautiful» as against ضَارِب «striking (now)». Like its verb it needs a doer, and here is the whole difficulty: the noun after it (وَجْه, «face») may be read in raf', nasb or jarr, and the sifa itself may be bare or carry ال. That is eighteen possible constructions, and the tradition grades each as أَحْسَن (best), حَسَن (good), قَبِيح (poor) or مُمْتَنِع (not permitted).\n\nOne rule explains almost all of them: COUNT THE PRONOUNS. If the noun after the sifa is marfu', it IS the doer, and no hidden pronoun exists; in nasb or jarr the doer is a hidden pronoun inside the sifa. Add to that any pronoun attached to the noun itself (وَجْهُهُ). A construction carrying exactly ONE pronoun is best; TWO is merely good; NONE is poor — a derived word governing with no doer at all in sight is weak Arabic. Separately, a sifa carrying ال may only be made mudaf to a noun that also carries ال, which is why الْحَسَنُ وَجْهِهِ and الْحَسَنُ وَجْهٍ are simply not said.\n\nThat rule settles seventeen of the eighteen. The one it leaves open — حَسَنُ وَجْهِهِ — is precisely the case the tables mark اخْتِلَاف, disputed among the grammarians.","tr":"Sıfat-ı müşebbehe, ism-i fâile «benzetilmiştir»; çünkü o da müştaktır ve fiil gibi amel eder — fakat geçici bir işi değil, SABİT bir vasfı bildirir: حَسَن «güzel», ضَارِب «(şimdi) vuran»ın karşısında. Fiili gibi bir fâile ihtiyaç duyar ve bütün güçlük buradadır: ardından gelen isim (وَجْه) ref, nasb veya cer ile okunabilir; sıfatın kendisi de ال'lı veya ال'sız olabilir. Bu on sekiz vecih eder ve gelenek her birini اَحْسَن (en güzel), حَسَن (güzel), قَبِيح (çirkin) veya مُمْتَنِع (caiz değil) diye derecelendirir.\n\nNeredeyse hepsini tek bir kural açıklar: ZAMİRLERİ SAY. Sıfattan sonraki isim merfû ise fâilin kendisidir ve gizli zamir yoktur; nasb veya cer ile okunursa fâil, sıfatın içindeki gizli zamirdir. Buna ismin kendisine bitişen zamiri ekle (وَجْهُهُ). Tam BİR zamir taşıyan vecih en güzeldir; İKİ taşıyan yalnızca güzeldir; HİÇ taşımayan çirkindir — ortada hiçbir fâil görünmeden amel eden müştak kelime zayıf Arapçadır. Ayrıca ال taşıyan bir sıfat, yalnızca yine ال taşıyan bir isme muzâf olabilir; الْحَسَنُ وَجْهِهِ ve الْحَسَنُ وَجْهٍ'in söylenmemesinin sebebi budur.\n\nBu kural on sekizden on yedisini çözer. Açık bıraktığı tek vecih — حَسَنُ وَجْهِهِ — tam da cetvellerin اِخْتِلَاف, yani gramerciler arasında ihtilaflı diye işaretlediği vecihtir."},"plain":{"en":"An adjective for a settled quality rather than something happening right now: «beautiful», as against «striking (at this moment)».","tr":"Geçici bir işi değil, yerleşik bir vasfı bildiren sıfat: «güzel», «(şu anda) vuran»ın karşısında."},"mamul":"marfu","sources":["أوزان صفة مشبهة (جدول المدرسة)","الفوائد الضيائية (ملا جامي)","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"examples":[{"ar":"زَيْدٌ حَسَنٌ وَجْهُهُ.","gloss":{"en":"Zayd is beautiful of face — أَحْسَن: the noun is marfu' as the doer, and carries one pronoun.","tr":"Zeyd yüzü güzeldir — أَحْسَن: isim fâil olarak merfûdur ve bir zamir taşır."},"src":null},{"ar":"زَيْدٌ حَسَنٌ الْوَجْهَ.","gloss":{"en":"Same sense, the noun in nasb — also أَحْسَن: the doer is a hidden pronoun, one pronoun in all.","tr":"Aynı mana, isim nasb hâlinde — yine أَحْسَن: fâil müstetir zamirdir, toplamda bir zamir."},"src":null},{"ar":"زَيْدٌ حَسَنٌ الْوَجْهُ.","gloss":{"en":"قَبِيح: the noun is marfu' as doer and carries no pronoun, so nothing pronominal remains anywhere.","tr":"قَبِيح: isim fâil olarak merfûdur ve zamir taşımaz, dolayısıyla hiçbir yerde zamir kalmaz."},"src":null},{"ar":"زَيْدٌ الْحَسَنُ وَجْهِهِ.","gloss":{"en":"مُمْتَنِع: a sifa carrying ال cannot be mudaf to a noun made definite by a pronoun.","tr":"مُمْتَنِع: ال taşıyan bir sıfat, zamirle marife olmuş bir isme muzâf olamaz."},"src":null}],"mistakes":[{"wrong":"زيدٌ حسنٌ الوجهُ","right":"زَيْدٌ حَسَنٌ الْوَجْهَ / حَسَنُ الْوَجْهِ","why":{"en":"Reading the noun in raf' after a bare sifa leaves the construction with no pronoun at all — the grammarians call this qabih. Put it in nasb or make it mudaf instead.","tr":"ال'sız bir sıfattan sonra ismi merfû okumak, terkibi hiç zamirsiz bırakır — gramerciler buna kabîh der. Onun yerine nasb ile oku veya muzâf yap."}},{"wrong":"زيدٌ الحسنُ وجهٍ","right":"زَيْدٌ الْحَسَنُ الْوَجْهِ","why":{"en":"Once the sifa carries ال, whatever it is mudaf to must carry ال too. Otherwise the idafa is not permitted at all.","tr":"Sıfat ال aldıysa, muzâf olduğu isim de ال almalıdır. Aksi hâlde izafet hiç caiz olmaz."}},{"wrong":"عَدُّ الصِّفَةِ الْمُشَبَّهَةِ كَاسْمِ الْفَاعِلِ فِي الدَّلَالَةِ","right":"الصِّفَةُ الْمُشَبَّهَةُ لِلثُّبُوتِ وَاسْمُ الْفَاعِلِ لِلْحُدُوثِ","why":{"en":"They are not interchangeable: حَسَن states a settled quality, حَاسِن would state an act in progress. The sifa mushabbaha is also built only from an intransitive verb.","tr":"Birbirinin yerine geçmezler: حَسَن sabit bir vasfı, حَاسِن ise sürmekte olan bir işi bildirir. Ayrıca sıfat-ı müşebbehe yalnız lâzım fiilden yapılır."}}]},"sighat-mubalagha":{"title":{"ar":"صِيَغُ الْمُبَالَغَة","en":"The intensive forms of the ism fa'il","tr":"Mübalağa sîgaları"},"level":5,"group":"sarf","explanation":{"en":"When the plain ism fa'il is not strong enough, Arabic reshapes it. صَادِق is «truthful»; صِدِّيق is truthful through and through. The tradition counts eight patterns for the intensive of the doer — فَعُول (جَهُول), فِعِّيل (صِدِّيق), فَعَّال (كَذَّاب), فُعُل (غُفُل), فَعِل (يَقِظ), مِفْعَال (مِدْرَار), مِفْعِيل (مِكْثِير), فُعَلَة (لُعَنَة) — and one for the intensive of the thing done to, فُعْلَة (لُعْنَة, «much cursed»). Three of these are worth knowing well because they are everywhere in the divine names and in classical prose: فَعُول (غَفُور, شَكُور), فَعَّال (غَفَّار, قَهَّار) and فِعِّيل (صِدِّيق). Do not confuse مِفْعَال and مِفْعِيل here with the ism ala, which uses the same shapes for instruments — مِفْتَاح is a key, not an intense opener; only the context decides. The intensive is a noun, so it takes the case its position calls for and can govern an object just as its verb would.","tr":"Sade ism-i fâil yetmediğinde Arapça onu yeniden döker. صَادِق «doğru sözlü»dür; صِدِّيق ise özü sözü doğru olandır. Gelenek, fâilin mübalağası için sekiz vezin sayar — فَعُول (جَهُول)، فِعِّيل (صِدِّيق)، فَعَّال (كَذَّاب)، فُعُل (غُفُل)، فَعِل (يَقِظ)، مِفْعَال (مِدْرَار)، مِفْعِيل (مِكْثِير)، فُعَلَة (لُعَنَة) — ve mef'ûlün mübalağası için bir vezin: فُعْلَة (لُعْنَة). Bunlardan üçü esmâ-i hüsnâda ve klasik nesirde çok geçtiği için iyi bilinmelidir: فَعُول (غَفُور، شَكُور)، فَعَّال (غَفَّار، قَهَّار) ve فِعِّيل (صِدِّيق). Buradaki مِفْعَال ve مِفْعِيل'i, aynı kalıpları âlet için kullanan ism-i âletle karıştırmayın — مِفْتَاح anahtardır, «çok açan» değil; ayrımı ancak siyak yapar. Mübalağa sîgası isimdir; bulunduğu mahallin i'rabını alır ve fiili gibi mef'ûl de alabilir."},"plain":{"en":"For when «truthful» is not strong enough: a set of patterns that intensify a doer. صَادِق is truthful; صِدِّيق is truthful through and through.","tr":"«Doğru» yetmediğinde: fâili kuvvetlendiren kalıplar. صَادِق doğrudur; صِدِّيق ise özü sözü doğru olandır."},"sources":["مراح الأرواح","المقصود","الكافية (ابن الحاجب)"],"examples":[{"ar":"وَالْخَبَرُ الصَّادِقُ.","gloss":{"en":"…and the truthful report — the plain ism fa'il. Intensify it and you get صِدِّيق, a person truthful to the core.","tr":"…ve sâdık haber — sade ism-i fâil. Mübalağalandırınca صِدِّيق olur: özü sözü doğru kimse."},"src":"aqaid-ahl-al-sunna"},{"ar":"إِنَّ اللهَ غَفُورٌ رَحِيمٌ.","gloss":{"en":"Allah is much-forgiving, merciful — فَعُول, the commonest intensive of them all.","tr":"Allah çok bağışlayıcı ve merhametlidir — فَعُول, mübalağa vezinlerinin en yaygını."},"src":null},{"ar":"رَجُلٌ كَذَّابٌ.","gloss":{"en":"An inveterate liar — فَعَّال, the pattern of habit and profession alike.","tr":"İflah olmaz bir yalancı — فَعَّال, hem alışkanlık hem meslek vezni."},"src":null}],"mistakes":[{"wrong":"اللهُ غَافِرٌ لِلذُّنُوبِ جَمِيعًا (فِي مَقَامِ الثَّنَاءِ)","right":"اللهُ غَفَّارٌ / غَفُورٌ","why":{"en":"The plain ism fa'il states the act; the intensive states the quality. In praise the intensive is what is meant.","tr":"Sade ism-i fâil fiili h
