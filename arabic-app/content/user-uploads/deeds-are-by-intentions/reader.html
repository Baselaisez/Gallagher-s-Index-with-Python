wa'l-Jama‘a — the fasl pronoun also appears after إِنَّ.","tr":"Kurtuluş yolu Ehl-i Sünnet ve'l-Cemaat'e tâbi olmaktır — zamîr-i fasl إِنَّ'den sonra da gelir."},"src":"aqaid-ahl-al-sunna"},{"ar":"وَالْخَبَرُ الْمُتَوَاتِرُ هُوَ الْخَبَرُ الثَّابِتُ عَلَى أَلْسِنَةِ قَوْمٍ.","gloss":{"en":"The mass-transmitted report is the report established upon the tongues of a people.","tr":"Mütevâtir haber, bir topluluğun dilleriyle sabit olan haberdir."},"src":"aqaid-ahl-al-sunna"}],"mistakes":[{"wrong":"زَيْدٌ هُوَ الْقَائِمُ — «هُوَ» مُبْتَدَأٌ ثَانٍ","right":"«هُوَ» ضَمِيرُ فَصْلٍ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ","why":{"en":"The fasl pronoun is not an element of the sentence. Parsing it as a second mubtada leaves the first without a khabar.","tr":"Zamîr-i fasl cümlenin öğesi değildir. İkinci mübteda sayılırsa birinci mübteda habersiz kalır."}},{"wrong":"جَاءَ رَجُلٌ هُوَ كَرِيمٌ (فَصْلًا)","right":"لَا يُؤْتَى بِضَمِيرِ الْفَصْلِ إِلَّا بَيْنَ مَعْرِفَتَيْنِ (أَوْ مَا يُشْبِهُ الْمَعْرِفَةَ)","why":{"en":"The fasl pronoun belongs between two definites. After an indefinite there is nothing to separate — no adjective reading was possible.","tr":"Zamîr-i fasl iki marife arasında gelir. Nekreden sonra ayrılacak bir şey yoktur; sıfat okunuşu zaten söz konusu değildir."}}]},"doubled-verbs":{"title":{"ar":"الْفِعْلُ الْمُضَاعَف","en":"The doubled verb","tr":"Muzâaf fiil"},"level":3,"group":"sarf","explanation":{"en":"A doubled verb has the same letter for its second and third radicals — عَدَّ (ع د د), مَدَّ, اِسْتَعَدَّ. The two are written as one letter with a shadda whenever they can be, and pulled apart — فَكُّ الْإِدْغَامِ — whenever the second of them would have to take sukun. That happens in exactly two places: before the moving subject pronouns of the past (اِسْتَعْدَدْتُ, not *اِسْتَعَدَّتُ) and before نُونُ النِّسْوَةِ (يَسْتَعْدِدْنَ). Everywhere else the shadda stands: يَسْتَعِدُّ, اِسْتَعَدُّوا. The jussive and the imperative allow BOTH, which is worth knowing before you mark someone wrong: لَمْ يَسْتَعِدَّ and لَمْ يَسْتَعْدِدْ are equally correct, and so are اِسْتَعِدَّ and اِسْتَعْدِدْ.","tr":"Muzâaf fiil, ayn'ı ile lâm'ı aynı harf olan fiildir: عَدَّ (ع د د)، مَدَّ، اِسْتَعَدَّ. İki harf mümkün olduğunca şeddeli tek harf yazılır; ikincisinin sükûn alması gerektiğinde ise idgam çözülür (fekkü'l-idgâm). Bu da tam olarak iki yerde olur: mâzide müteharrik fâil zamirlerinden önce (اِسْتَعْدَدْتُ, *اِسْتَعَدَّتُ değil) ve nûnu'n-nisveden önce (يَسْتَعْدِدْنَ). Bunun dışında şedde durur: يَسْتَعِدُّ، اِسْتَعَدُّوا. Cezm ve emirde İKİ vecih de caizdir; birini yanlış saymadan önce bunu bilmek gerekir: لَمْ يَسْتَعِدَّ ile لَمْ يَسْتَعْدِدْ eşit derecede doğrudur, اِسْتَعِدَّ ile اِسْتَعْدِدْ de öyle."},"plain":{"en":"Verbs whose last two root letters are the same, like مَدَّ. They merge into one doubled letter — except where the grammar pulls them apart again.","tr":"Son iki kök harfi aynı olan fiiller (مَدَّ gibi). İki harf tek şeddeli harfe birleşir; ancak bazı yerlerde tekrar ayrılır."},"sources":["مراح الأرواح","بناء الأفعال","المقصود"],"examples":[{"ar":"قُوَّةٌ لِلنَّفْسِ بِهَا تَسْتَعِدُّ لِلْعُلُومِ.","gloss":{"en":"…a faculty by which it is made ready for the sciences — the shadda stands, since nothing forces a sukun.","tr":"…kendisiyle ilimlere hazır hâle geldiği bir kuvvet — sükûnu gerektiren bir şey olmadığı için şedde durur."},"src":"aqaid-ahl-al-sunna"},{"ar":"اِسْتَعْدَدْتُ لِلِامْتِحَانِ.","gloss":{"en":"I prepared for the examination — the ت of the speaker forces the doubling apart.","tr":"İmtihana hazırlandım — mütekellim tâsı idgamı çözer."},"src":null},{"ar":"لَمْ يَسْتَعِدَّ / لَمْ يَسْتَعْدِدْ.","gloss":{"en":"He did not prepare — the jussive permits both forms.","tr":"Hazırlanmadı — cezimde iki vecih de caizdir."},"src":null}],"mistakes":[{"wrong":"مَدَّتُ يَدِي","right":"مَدَدْتُ يَدِي","why":{"en":"Before تُ the doubling must be pulled apart; a shadda cannot survive there.","tr":"تُ zamirinden önce idgam çözülmelidir; orada şedde duramaz."}},{"wrong":"النِّسَاءُ يَمْدُدْنَ — أَوْ يَمُدَّنَ؟ الْأَوَّلُ خَطَأٌ","right":"يَمْدُدْنَ صَحِيحٌ","why":{"en":"Before the ن of the feminine plural the letters separate — يَمْدُدْنَ is the correct form, not يَمُدَّنَ.","tr":"Nûnu'n-nisveden önce harfler ayrılır: doğru şekil يَمْدُدْنَ'dir, يَمُدَّنَ değil."}}]},"fail":{"title":{"ar":"الْفَاعِل","en":"The subject of a verb (fa'il)","tr":"Fâil (özne)"},"level":2,"group":"nahw","explanation":{"en":"The fa'il is the doer — the noun in raf' that comes after a complete active verb and performs its action. Its governor (عامل) is the verb itself, and it is always marfu'. In Arabic the verb comes first (VSO), so the fa'il follows it: «أَرَادَ يُوسُفُ» — يُوسُفُ is the fa'il, marfu' by damma. The fa'il may be a visible noun (اسم ظاهر) or a hidden pronoun (ضمير مستتر): in «ذَهَبَ» the doer is a concealed «هو» (he). One rule surprises beginners: when the fa'il is a visible noun, the verb stays singular even if that noun is dual or plural — قَامَ الرِّجَالُ, not قاموا الرجالُ; number and gender are shown on the verb only by the ت/ا endings of agreement, not by plural marking. Ibn Ajurrum defines it as \"the marfu' noun whose verb is mentioned before it\"; it is the first of the مرفوعات in the Ajurrumiyya and Qatr al-Nada.","tr":"Fâil, işi yapandır — tam bir malum fiilden sonra gelen ve fiilin işini yapan merfu isimdir. Âmili fiilin kendisidir ve daima merfudur. Arapçada fiil önce gelir (fiil-özne-nesne), fâil onu takip eder: «أَرَادَ يُوسُفُ» — يُوسُفُ fâildir, ötre ile merfu. Fâil açık bir isim (ism-i zâhir) ya da gizli bir zamir (zamir-i müstetir) olabilir: «ذَهَبَ»de yapan gizli bir «هو» (o)'dur. Yeni başlayanları şaşırtan bir kural: fâil açık bir isimse, o isim tesniye ya da cemi olsa bile fiil müfred kalır — قَامَ الرِّجَالُ, قاموا الرجالُ değil; sayı ve cinsiyet fiilde yalnız ت/ا uyum ekleriyle gösterilir. İbn Âcurrûm onu \"fiili kendinden önce zikredilen merfu isim\" diye tanımlar; Âcurrûmiyye ve Katru'n-Nedâ'da merfûâtın ilkidir."},"plain":{"en":"Who or what did it.","tr":"İşi kim yaptı, ne yaptı."},"mamul":"marfu","sources":["الآجُرُّومِيَّة (ابن آجُرُّوم)","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"question":{"tr":["Ne?","Kim?"],"en":["What?","Who?"]},"examples":[{"ar":"أَرَادَ يُوسُفُ أَنْ يَرْجِعَ.","gloss":{"en":"Yusuf wanted to return — يُوسُفُ is the fa'il of أراد, marfu' by damma.","tr":"Yusuf dönmek istedi — يُوسُفُ, أراد fiilinin fâilidir, damme ile merfûdur."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"قَالَ أَبُو حَنِيفَةَ.","gloss":{"en":"Abu Hanifa said — أَبُو is the fa'il of قال, marfu' by و (one of the five nouns).","tr":"Ebû Hanîfe dedi — أَبُو, قال fiilinin fâilidir, vâv ile merfûdur (esmâ-i hamse)."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"قَالَ رَسُولُ اللهِ.","gloss":{"en":"The Messenger of Allah said — رَسُولُ is the fa'il, marfu' and mudaf.","tr":"Allah'ın Resulü buyurdu — رَسُولُ merfû fâil ve muzâftır."},"src":"deeds-are-by-intentions"}],"mistakes":[{"wrong":"أَرَادَ يُوسُفَ أَنْ يَرْجِعَ","right":"أَرَادَ يُوسُفُ أَنْ يَرْجِعَ","why":{"en":"The fa'il is marfu'. Giving يوسف a fatha treats the doer as an object — but يوسف here is who wanted, so it must be marfu' (a bare damma, since it is also a diptote).","tr":"Fâil merfudur. يوسف'a fetha vermek yapanı nesne saymaktır — oysa يوسف isteyen kişidir, bu yüzden merfu olmalı (gayr-ı munsarif olduğu için düz ötre)."}},{"wrong":"قَالُوا الْعُلَمَاءُ","right":"قَالَ الْعُلَمَاءُ","why":{"en":"With a following visible fa'il the verb stays singular: قَالَ الْعُلَمَاءُ, not قالوا. Plural marking on the verb (قالوا) is only for a pronoun subject.","tr":"Ardından açık bir fâil gelince fiil müfred kalır: قَالَ الْعُلَمَاءُ, قالوا değil. Fiildeki cemi işareti (قالوا) yalnız zamir özne içindir."}}]},"five-nouns":{"title":{"ar":"الأَسْمَاء الْخَمْسَة","en":"The five nouns (abu / abi / aba)","tr":"Esmâ-i hamse (أبو / أبي / أبا)"},"level":2,"group":"nahw","explanation":{"en":"أَب، أَخ، حَم، فُو، ذُو show case with long vowels instead of harakat when they are mudaf: raf' with و (أَبُو), nasb with ا (أَبَا), jarr with ي (أَبِي). Watch the same kunya change through this story: قَالَ أَبُو حَنِيفَةَ (subject) but ذَهَبَ إِلَى أَبِي حَنِيفَةَ (after a preposition).","tr":"أَب، أَخ، حَم، فُو، ذُو muzaf olduklarında i'rabı uzun harflerle gösterir: ref و ile (أَبُو), nasb ا ile (أَبَا), cer ي ile (أَبِي). Hikâyede aynı künye değişir: قَالَ أَبُو حَنِيفَةَ ama إِلَى أَبِي حَنِيفَةَ."},"plain":{"en":"Five nouns — «father», «brother», «mouth» and two more — that show their case with a long letter (أَبُو / أَبِي / أَبَا) instead of a vowel.","tr":"Beş isim — «baba», «kardeş», «ağız» ve ikisi daha — i'rablarını harekeyle değil, uzun harfle gösterir: أَبُو / أَبِي / أَبَا."},"sources":["الكافية (ابن الحاجب) — الأسماء الستة","الإظهار (البركوي) — المعرب بالحروف"],"examples":[{"ar":"قَالَ لَهُ أَبُو حَنِيفَةَ.","gloss":{"en":"Abu Hanifa (subject → أبو) said to him.","tr":"Ebû Hanîfe (fâil → أبو) ona dedi."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"ذَهَبَ إِلَى مُعَلِّمِهِ أَبِي حَنِيفَةَ.","gloss":{"en":"…to his teacher Abu Hanifa (after إلى → أبي).","tr":"…hocası Ebû Hanîfe'ye (إلى'den sonra → أبي)."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"رَأَيْتُ أَبَا حَنِيفَةَ.","gloss":{"en":"I saw Abu Hanifa (object → أبا).","tr":"Ebû Hanîfe'yi gördüm (mef'ûl → أبا)."},"src":null}],"mistakes":[{"wrong":"ذهبتُ إلى أبو حنيفة","right":"ذهبتُ إلى أبي حنيفة","why":{"en":"The kunya must show jarr with ي after a preposition — treating أبو as frozen is one of the most common learner errors.","tr":"Harf-i cerden sonra künye cerri ي ile göstermeli — أبو'yu donmuş saymak en yaygın öğrenci hatalarındandır."}},{"wrong":"جاء أبي حنيفة إلى الدرس","right":"جاء أبو حنيفة إلى الدرس","why":{"en":"As subject it must be أبو (raf' with و).","tr":"Fail olduğunda أبو olmalıdır (ref, و ile)."}}]},"form-ii-verbs":{"title":{"ar":"الْبَاب الثَّانِي فَعَّلَ","en":"Form II verbs","tr":"İkinci bâb: فَعَّلَ (tef'îl)"},"level":3,"group":"sarf","explanation":{"en":"Form II doubles the middle radical: فَعَّلَ يُفَعِّلُ, masdar تَفْعِيل. It often makes a verb transitive or intensive: وَدَّعَ (to bid farewell), عَلِمَ (to know) → عَلَّمَ (to teach). In the Bina's ordering of the mazid forms this is باب التفعيل. The shadda is meaning-bearing — dropping it in speech or writing changes the verb.","tr":"İkinci bab orta harfi şeddeler: فَعَّلَ يُفَعِّلُ, masdarı تَفْعِيل. Çoğu kez geçişlilik veya pekiştirme katar: وَدَّعَ (uğurlamak), عَلِمَ (bilmek) → عَلَّمَ (öğretmek). Şedde anlam taşır — düşürülürse fiil değişir."},"plain":{"en":"Doubling the middle letter usually means making someone else do it, or doing it hard and often: عَلِمَ «to know» becomes عَلَّمَ «to teach».","tr":"Orta harfin şeddelenmesi çoğunlukla başkasına yaptırmak yahut işi çokça yapmak demektir: عَلِمَ «bilmek» → عَلَّمَ «öğretmek»."},"sources":["الأمثلة المختلفة","بناء الأفعال — أبواب الثلاثي المزيد","المقصود"],"examples":[{"ar":"ذَهَبَ لِيُوَدِّعَهُ.","gloss":{"en":"He went to bid him farewell.","tr":"Ona veda etmeye gitti."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"عَلَّمَ أَبُو حَنِيفَةَ تَلَامِيذَهُ الْفِقْهَ.","gloss":{"en":"Abu Hanifa taught his students fiqh.","tr":"Ebû Hanîfe talebelerine fıkıh öğretti."},"src":null}],"mistakes":[{"wrong":"عَلِمْتُ الطُّلَّابَ الدَّرْسَ","right":"عَلَّمْتُ الطُّلَّابَ الدَّرْسَ","why":{"en":"Form I عَلِمَ means \"to know\"; teaching someone requires Form II عَلَّمَ with the shadda.","tr":"Birinci bab عَلِمَ 'bilmek'tir; birine öğretmek şeddeli ikinci bab عَلَّمَ ister."}},{"wrong":"ودعتُه (بدون شدة، بمعنى التوديع)","right":"وَدَّعْتُهُ","why":{"en":"Without the shadda the verb is a different word — always write and pronounce the doubling in Form II.","tr":"Şeddesiz yazılırsa başka bir kelime olur — ikinci babda şedde daima yazılmalı ve söylenmelidir."}}]},"form-iii-verbs":{"title":{"ar":"الْبَابُ الثَّالِثُ: فَاعَلَ يُفَاعِلُ","en":"Form III verbs (fā'ala)","tr":"Üçüncü bâb: فَاعَلَ (mufâale)"},"level":4,"group":"sarf","explanation":{"en":"Form III adds an alif after the first radical: فَاعَلَ يُفَاعِلُ مُفَاعَلَةً (also the masdar فِعَال). Its core meaning is المشاركة — doing the action WITH or AT someone: جَادَلَ «to argue with», كَاتَبَ «to correspond with», قَاتَلَ «to fight against». In this story: لَا تُجَادِلْ أَحَدًا — do not argue with anyone; the other party comes as a direct object, where English says «with». The mudari' keeps damma on the prefix (يُفَاعِلُ), like all verbs whose mazi has four letters.","tr":"Üçüncü bâb ilk harften sonra elif ekler: فَاعَلَ يُفَاعِلُ مُفَاعَلَةً (masdarı فِعَال da olur). Temel anlamı müşârekettir — işi biriyle KARŞILIKLI yapmak: جَادَلَ «tartışmak», كَاتَبَ «yazışmak», قَاتَلَ «savaşmak». Hikâyede: لَا تُجَادِلْ أَحَدًا — kimseyle tartışma; Türkçede «ile» denen taraf Arapçada doğrudan mef'ûl olur. Mazisi dört harfli bütün fiillerde olduğu gibi muzari öneki ötreli gelir (يُفَاعِلُ)."},"plain":{"en":"A long vowel after the first letter aims the action at someone else — you do it to them or with them: قَتَلَ «to kill» becomes قَاتَلَ «to fight someone».","tr":"İlk harften sonraki uzatma, fiili bir başkasına yöneltir — ona veya onunla yaparsınız: قَتَلَ «öldürmek» → قَاتَلَ «biriyle savaşmak»."},"sources":["الأمثلة المختلفة","بناء الأفعال — أبواب الثلاثي المزيد"],"examples":[{"ar":"وَلَا تُجَادِلْ أَحَدًا فِي الْبَاطِلِ.","gloss":{"en":"And do not argue with anyone in falsehood.","tr":"Ve hiç kimseyle bâtıl üzere tartışma."},"src":"wasiyyat-abi-hanifa-L4"},{"ar":"كَاتَبَ الْعَالِمُ تَلَامِيذَهُ.","gloss":{"en":"The scholar corresponded with his students.","tr":"Âlim talebeleriyle mektuplaştı."},"src":null},{"ar":"سَاعَدَ الرَّجُلُ جَارَهُ.","gloss":{"en":"The man helped his neighbor — Form III without a mutual sense; the pattern is broader than pure reciprocity.","tr":"Adam komşusuna yardım etti — müşâreket manası olmaksızın mufâale; vezin sırf karşılıklılıktan geniştir."},"src":null}],"mistakes":[{"wrong":"لا تجادلْ مع أحدٍ","right":"لا تجادلْ أحدًا","why":{"en":"Form III already contains the «with»: its partner is a direct object in nasb. Adding مع copies the Turkish/English preposition.","tr":"Üçüncü bâb «ile» anlamını kendinde taşır: muhatap doğrudan mef'ûldür. مع eklemek Türkçe «ile»yi kopyalamaktır."}},{"wrong":"يَجَادِلُ (بفتح الياء)","right":"يُجَادِلُ (بضم الياء)","why":{"en":"Every verb whose mazi has four letters (Forms II, III, IV) takes damma on the mudari' prefix.","tr":"Mazisi dört harfli fiillerin (II, III, IV. bâblar) muzari öneki ötrelidir."}},{"wrong":"جادَلَ masdarı «جَدَل» sanmak","right":"مُجَادَلَة / جِدَال","why":{"en":"Form III's masdars are مُفَاعَلَة and فِعَال; the bare جَدَل belongs to the Form I root, not to جادل.","tr":"Üçüncü bâbın masdarları مُفَاعَلَة ve فِعَال'dir; yalın جَدَل birinci bâbın masdarıdır, جادل'inki değildir."}}]},"form-iv-verbs":{"title":{"ar":"الْبَاب الرَّابِع أَفْعَلَ","en":"Form IV verbs","tr":"Dördüncü bâb: أَفْعَلَ (if'âl)"},"level":3,"group":"sarf","explanation":{"en":"Form IV prefixes a hamza: أَفْعَلَ يُفْعِلُ, masdar إِفْعَال. It is usually causative/transitive: رَجَعَ (to return, intransitive) → أَرْجَعَ (to give something back). أَرَادَ (to want) is Form IV of ر-و-د. Its hamza is hamzat qat' — written with the seat (أ) and never dropping: قَالَ وَأَرَادَ, unlike the wasl of Form I imperatives.","tr":"Dördüncü bab başa hemze getirir: أَفْعَلَ يُفْعِلُ, masdarı إِفْعَال. Genellikle geçişlilik katar: رَجَعَ (dönmek) → أَرْجَعَ (geri vermek). أَرَادَ, ر-و-د kökünün dördüncü babıdır. Hemzesi kat' hemzesidir: düşmez ve أ ile yazılır."},"plain":{"en":"A prefixed أ makes it causative — someone makes the action happen: دَخَلَ «to enter» becomes أَدْخَلَ «to bring in».","tr":"Başa gelen أ fiili yaptırma manasına çevirir: دَخَلَ «girmek» → أَدْخَلَ «sokmak»."},"sources":["الأمثلة المختلفة","بناء الأفعال — أبواب الثلاثي المزيد","المقصود"],"examples":[{"ar":"أَرَادَ يُوسُفُ أَنْ يَرْجِعَ.","gloss":{"en":"Yusuf wanted to return.","tr":"Yusuf dönmek istedi."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"أَرْجَعْتُ الْكِتَابَ إِلَى الْمَكْتَبَةِ.","gloss":{"en":"I returned the book to the library.","tr":"Kitabı kütüphaneye iade ettim."},"src":null}],"mistakes":[{"wrong":"رَجَعْتُ الْكِتَابَ","right":"أَرْجَعْتُ الْكِتَابَ","why":{"en":"رَجَعَ is intransitive (\"to come back\"); giving something back needs the Form IV causative أَرْجَعَ.","tr":"رَجَعَ geçişsizdir ('geri dönmek'); bir şeyi geri vermek dördüncü bab أَرْجَعَ ister."}},{"wrong":"اراد ان يرجع (بألف وصل)","right":"أَرَادَ أَنْ يَرْجِعَ","why":{"en":"Form IV takes hamzat qat' — spell it أَرَادَ, never اراد. In careful writing the hamza is not optional.","tr":"Dördüncü bab hemze-i kat' alır — أَرَادَ diye yazılır, asla اراد değil."}}]},"form-v-verbs":{"title":{"ar":"الْبَابُ الْخَامِسُ: تَفَعَّلَ يَتَفَعَّلُ","en":"Form V verbs (tafa''ala)","tr":"Beşinci bâb: تَفَعَّلَ (tefe'ul)"},"level":3,"group":"sarf","explanation":{"en":"Form V is Form II (فَعَّلَ) with a تَ prefixed: تَفَعَّلَ يَتَفَعَّلُ تَفَعُّلًا. Its core sense is the reflexive or the gradual taking-on of what Form II does to something else: عَلَّمَ «he taught» → تَعَلَّمَ «he taught himself, he learned»; كَلَّمَ «he spoke to» → تَكَلَّمَ «he spoke». Like Form VI, its mazi has five letters, so the present prefix takes FATHA (يَتَفَعَّلُ), never damma.","tr":"Beşinci bâb, ikinci bâbın (فَعَّلَ) başına تَ eklenmişidir: تَفَعَّلَ يَتَفَعَّلُ تَفَعُّلًا. Temel mânâsı dönüşlülük veya bir hâli tedricen edinmektir: عَلَّمَ «öğretti» → تَعَلَّمَ «öğrendi»; كَلَّمَ «konuştu (birine)» → تَكَلَّمَ «konuştu». Altıncı bâb gibi mazisi beş harflidir, bu yüzden muzari öneki FETHALIDIR (يَتَفَعَّلُ), asla ötreli değil."},"plain":{"en":"Form II with تَ in front: the action comes back on the doer. عَلَّمَ «to teach» becomes تَعَلَّمَ «to learn».","tr":"Başına تَ gelen tef'îl kalıbı: fiil, yapanın kendisine döner. عَلَّمَ «öğretmek» → تَعَلَّمَ «öğrenmek»."},"sources":["الأمثلة المختلفة","بناء الأفعال — أبواب الثلاثي المزيد"],"examples":[{"ar":"وَلَا تَتَكَلَّمْ بَيْنَ يَدَيِ الْعَامَّةِ.","gloss":{"en":"Do not speak before the common people.","tr":"Avamın huzurunda konuşma."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"تَعَلَّمَ الطَّالِبُ النَّحْوَ.","gloss":{"en":"The student learned grammar — the reflexive of «taught».","tr":"Talebe nahiv öğrendi — «öğretti»nin dönüşlüsü."},"src":null}],"mistakes":[{"wrong":"يُتَكَلَّمُ (لِلْمَعْلُومِ)","right":"يَتَكَلَّمُ","why":{"en":"Form V takes a fatha prefix in the present; the damma prefix belongs to Forms II/III/IV, whose mazi has four letters.","tr":"Beşinci bâbın muzari öneki fethalıdır; ötreli önek mazisi dört harfli olan II/III/IV. bâblara aittir."}},{"wrong":"مَصْدَرُ تَكَلَّمَ: تَكْلِيم","right":"تَكَلُّم","why":{"en":"تَكْلِيم is the masdar of Form II (كَلَّمَ). Form V's masdar is on the pattern تَفَعُّل.","tr":"تَكْلِيم ikinci bâbın (كَلَّمَ) masdarıdır. Beşinci bâbın masdarı تَفَعُّل veznindedir."}}]},"form-vi-verbs":{"title":{"ar":"الْبَابُ السَّادِسُ: تَفَاعَلَ يَتَفَاعَلُ","en":"Form VI verbs (tafā'ala)","tr":"Altıncı bâb: تَفَاعَلَ (tefâul)"},"level":3,"group":"sarf","explanation":{"en":"Form VI is Form III (فَاعَلَ) with a تَ prefixed: تَفَاعَلَ يَتَفَاعَلُ تَفَاعُلًا. Its two core senses are (1) mutual participation shared between a plural subject — تَقَاتَلَ الْقَوْمُ (the people fought one another), تَبَاعَدَا (the two moved apart); and (2) pretense or gradual assumption of a state — تَمَارَضَ (to feign illness), تَنَاوَمَ (to pretend to sleep), and in this testament تَهَاوَنَ بِكَ (he made light of you) and تَتَبَاعَدُ عَنْهَا (you keep your distance from it, little by little). Because its mazi is five letters, the present prefix carries FATHA (يَتَفَاعَلُ) — unlike Forms II, III, IV, whose four-letter mazi gives a damma prefix.","tr":"Altıncı bâb, üçüncü bâbın (فَاعَلَ) başına تَ eklenmişidir: تَفَاعَلَ يَتَفَاعَلُ تَفَاعُلًا. İki temel anlamı vardır: (1) çoğul fâil arasında karşılıklılık — تَقَاتَلَ الْقَوْمُ (halk birbiriyle savaştı), تَبَاعَدَا (ikisi uzaklaştı); (2) yapmacıklık ya da bir hâli tedricen alma — تَمَارَضَ (hasta numarası yapmak), ve bu vasiyette تَهَاوَنَ بِكَ (seni küçümsedi), تَتَبَاعَدُ عَنْهَا (ondan yavaş yavaş uzaklaşırsın). Mazisi beş harfli olduğundan muzari öneki FETHALIDIR (يَتَفَاعَلُ) — dört harfli maziye sahip II, III, IV. bâbların aksine (onlar ötreli önek alır)."},"plain":{"en":"Form III with تَ in front: two or more sides do it to each other. قَاتَلَ «to fight» becomes تَقَاتَلُوا «they fought one another».","tr":"Başına تَ gelen mufâale kalıbı: iki veya daha çok taraf birbirine yapar. قَاتَلَ «savaşmak» → تَقَاتَلُوا «birbirleriyle savaştılar»."},"sources":["الأمثلة المختلفة","بناء الأفعال — أبواب الثلاثي المزيد"],"examples":[{"ar":"تَهَاوَنَ بِكَ السُّلْطَانُ.","gloss":{"en":"The ruler made light of you — pretense/attitude sense of Form VI.","tr":"Sultan seni hafife aldı — tefâulün «öyle davranma» manası."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"تَنْتَفِعُ بِهَا وَتَتَبَاعَدُ عَنْهَا.","gloss":{"en":"You benefit from it and keep your distance from it — gradual sense.","tr":"Ondan faydalanır ve uzak durursun — tedrîcî mana."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"تَقَاتَلَ الْقَوْمُ.","gloss":{"en":"The people fought one another — the mutual sense.","tr":"İnsanlar birbirleriyle savaştı — müşâreket manası."},"src":null}],"mistakes":[{"wrong":"يُتَبَاعَدُ","right":"يَتَبَاعَدُ","why":{"en":"The present prefix of Form VI is fatha, not damma. The damma prefix belongs to Forms II/III/IV, whose mazi has four letters; Form VI's mazi has five.","tr":"Altıncı bâbın muzari öneki fethadır, ötre değil. Ötreli önek, mazisi dört harfli olan II/III/IV. bâblara aittir; altıncı bâbın mazisi beş harflidir."}},{"wrong":"مَصْدَرُ تَبَاعَدَ: تَبْعِيد","right":"تَبَاعُد","why":{"en":"Form VI's masdar is on the pattern تَفَاعُل (تَبَاعُد). تَبْعِيد is the masdar of Form II (بَعَّدَ), a different verb.","tr":"Altıncı bâbın masdarı تَفَاعُل vezninde gelir (تَبَاعُد). تَبْعِيد ise ikinci bâbın (بَعَّدَ) masdarıdır, farklı bir fiildir."}},{"wrong":"تَبَاعَدَ الرَّجُلُ (بِمَعْنَى الْمُشَارَكَةِ)","right":"تَبَاعَدَ الرَّجُلَانِ / الْقَوْمُ","why":{"en":"The mutual sense needs a plural or dual subject — one person cannot «mutually» do anything. A singular subject forces the pretense/gradual reading instead.","tr":"Karşılıklılık anlamı çoğul veya tesniye fâil gerektirir — tek kişi «karşılıklı» bir şey yapamaz. Tekil fâil, yapmacıklık/tedricîlik anlamını gerektirir."}}]},"form-vii-verbs":{"title":{"ar":"بَابُ الِانْفِعَال: اِنْفَعَلَ يَنْفَعِلُ","en":"Form VII — the verb that happens to you","tr":"İnfiâl bâbı: اِنْفَعَلَ — sana olan fiil"},"level":4,"group":"sarf","explanation":{"en":"Prefix اِنْ to the bare verb and you get Form VII, whose whole business is مُطَاوَعَة — «responding». Someone breaks the glass, and the glass ANSWERS by breaking: كَسَرْتُ الزُّجَاجَ فَانْكَسَرَ. Someone ties the contract, and the contract answers by being tied: عَقَدَهُ فَانْعَقَدَ. Two consequences follow from the meaning and are worth holding onto. First, Form VII is ALWAYS intransitive — the object of the first verb has become the subject of this one, so there is nothing left for it to govern, and it therefore has no passive. Second, it is close to a passive in sense but is not one: the passive names an unspoken doer, while Form VII says the thing simply gave way. Its hamza is a connecting hamza, so it vanishes in continuous speech (فَانْكَسَرَ), and its masdar is اِنْفِعَال.","tr":"Mücerred fiilin başına اِنْ getirilirse infiâl bâbı olur; bu bâbın bütün işi mutâvaattır — «cevap verme». Biri camı kırar, cam da kırılarak CEVAP verir: كَسَرْتُ الزُّجَاجَ فَانْكَسَرَ. Biri akdi bağlar, akit de bağlanarak cevap verir: عَقَدَهُ فَانْعَقَدَ. Manadan iki netice çıkar. Birincisi, infiâl bâbı DAİMA lâzımdır — birinci fiilin mef'ûlü bunun fâili olmuştur, dolayısıyla amel edeceği bir şey kalmaz ve meçhulü de olmaz. İkincisi, mana bakımından meçhule yakındır ama meçhul değildir: meçhul söylenmemiş bir fâili ima eder, infiâl ise şeyin kendiliğinden boyun eğdiğini söyler. Hemzesi vasıl hemzesidir, kelâmın ortasında düşer (فَانْكَسَرَ); masdarı اِنْفِعَال'dir."},"plain":{"en":"The verb that happens to you, with nobody named as doing it: كَسَرَ «to break» becomes اِنْكَسَرَ «to get broken».","tr":"Yapanı anılmayan, size olan fiil: كَسَرَ «kırmak» → اِنْكَسَرَ «kırılmak»."},"sources":["بناء الأفعال","مراح الأرواح","المقصود"],"examples":[{"ar":"وَيَنْعَقِدُ بِالْإِيجَابِ وَالْقَبُولِ.","gloss":{"en":"It is concluded by offer and acceptance — the contract is not «concluded by someone» here; it simply comes to be tied.","tr":"İcap ve kabul ile in'ikad eder — akit burada «biri tarafından bağlanmaz», kendiliğinden bağlanmış olur."},"src":"kitab-al-buyu"},{"ar":"كَسَرْتُ الزُّجَاجَ فَانْكَسَرَ.","gloss":{"en":"I broke the glass and it broke — the pattern case of muta'awa'a, given in the Bina itself.","tr":"Camı kırdım, o da kırıldı — Binâ'nın kendi verdiği mutâvaat örneği."},"src":null},{"ar":"قَلَبَهُ فَانْقَلَبَ.","gloss":{"en":"He turned it over and it turned over.","tr":"Onu çevirdi, o da çevrildi."},"src":null}],"mistakes":[{"wrong":"اِنْكَسَرَ الْوَلَدُ الزُّجَاجَ","right":"كَسَرَ الْوَلَدُ الزُّجَاجَ","why":{"en":"Form VII cannot take an object. If there is a doer acting on something, the bare verb is what you want.","tr":"İnfiâl bâbı mef'ûl almaz. Bir şeye tesir eden fâil varsa mücerred fiil kullanılır."}},{"wrong":"اُنْعُقِدَ الْعَقْدُ","right":"اِنْعَقَدَ الْعَقْدُ","why":{"en":"There is no passive of Form VII — it is already intransitive, and the sense it would carry is the sense it already has.","tr":"İnfiâl bâbının meçhulü yoktur; zaten lâzımdır ve meçhulden beklenen manayı kendisi taşır."}}]},"form-viii-verbs":{"title":{"ar":"بَاب الِافْتِعَال اِفْتَعَلَ","en":"Form VIII verbs","tr":"İftiâl bâbı: اِفْتَعَلَ"},"level":3,"group":"sarf","explanation":{"en":"Form VIII infixes ت after the first radical: اِفْتَعَلَ يَفْتَعِلُ, masdar اِفْتِعَال. Often reflexive or intensive in meaning: اِحْتَرَمَ (to respect), اِحْتَقَرَ (to belittle), اِسْتَمَعَ (to listen attentively). Its initial hamza is hamzat wasl — it drops in connected speech (وَاحْتَرِمْ) and is never written with the seat أ. With emphatic or assimilating first radicals the ت changes: ص → اِصْطَبَرَ, ز → اِزْدَهَرَ, د/ذ → اِدَّكَرَ.","tr":"İftial babı ilk kök harfinden sonra ت ekler: اِفْتَعَلَ يَفْتَعِلُ, masdarı اِفْتِعَال. Çoğu kez dönüşlülük katar: اِحْتَرَمَ (saygı göstermek), اِسْتَمَعَ (dinlemek). Hemzesi vasl hemzesidir: vasıl halinde düşer (وَاحْتَرِمْ). Kalın harflerden sonra ت değişir: اِصْطَبَرَ، اِزْدَهَرَ."},"plain":{"en":"A ت slipped inside the root, usually meaning you do it for yourself, or it happens of its own accord.","tr":"Kökün içine giren bir ت; çoğunlukla işi kendiniz için yapmak yahut işin kendiliğinden olması manasını verir."},"sources":["بناء الأفعال","الأمثلة المختلفة"],"examples":[{"ar":"وَاحْتَرِمِ الْكِبَارَ.","gloss":{"en":"And respect the elders.","tr":"Ve büyüklere hürmet et."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"لَا تَحْتَقِرْ أَحَدًا.","gloss":{"en":"Do not belittle anyone.","tr":"Hiç kimseyi küçümseme."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"اِسْتَمَعَ الطُّلَّابُ إِلَى الدَّرْسِ.","gloss":{"en":"The students listened to the lesson.","tr":"Talebeler dersi dinledi."},"src":null}],"mistakes":[{"wrong":"إِحْتَرَمَ الكبارَ (بهمزة قطع)","right":"اِحْتَرَمَ الكبارَ","why":{"en":"Form VIII takes hamzat wasl — writing إ (qat') is a very common spelling error; the hamza also must not be pronounced after و: وَاحْتَرِمْ, not وَإِحْتَرِمْ.","tr":"İftial babı hemze-i vasl alır — إ (kat') ile yazmak yaygın imla hatasıdır; و'dan sonra da okunmaz: وَاحْتَرِمْ."}},{"wrong":"اِصْتَبَرَ","right":"اِصْطَبَرَ","why":{"en":"After emphatic ص the infixed ت becomes ط — learners often keep the plain ت.","tr":"Kalın ص'dan sonra ت, ط olur — öğrenciler çoğu kez düz ت bırakır."}}]},"form-x-verbs":{"title":{"ar":"الْبَابُ الْعَاشِرُ: اسْتَفْعَلَ يَسْتَفْعِلُ","en":"Form X verbs (istaf'ala)","tr":"Onuncu bâb: اِسْتَفْعَلَ (istif'âl)"},"level":5,"group":"sarf","explanation":{"en":"Form X prefixes اسْتَ: اسْتَفْعَلَ يَسْتَفْعِلُ اسْتِفْعَالًا. Its commonest sense is SEEKING or asking for what the root means: غَفَرَ «he forgave» → اسْتَغْفَرَ «he sought forgiveness»; أَفْتَى «he gave a ruling» → اسْتَفْتَى «he sought a ruling». It can also mean judging something to have a quality (اسْتَحْسَنَ «he deemed good»). The initial hamza is a hamzat wasl and drops in continuous speech.","tr":"Onuncu bâb başına اسْتَ ekler: اسْتَفْعَلَ يَسْتَفْعِلُ اسْتِفْعَالًا. En yaygın mânâsı kökün anlamını İSTEMEK, talep etmektir: غَفَرَ «bağışladı» → اسْتَغْفَرَ «bağışlanma diledi»; أَفْتَى «fetva verdi» → اسْتَفْتَى «fetva sordu». Bir şeyi bir vasıfla nitelemek anlamı da vardır (اسْتَحْسَنَ «güzel gördü»). Baştaki hemze vasl hemzesidir, geçişte düşer."},"plain":{"en":"اِسْتَ in front usually means asking for the thing, or reckoning something to be so: غَفَرَ «to forgive» becomes اِسْتَغْفَرَ «to ask forgiveness».","tr":"Başa gelen اِسْتَ çoğunlukla istemek yahut öyle saymak manasını verir: غَفَرَ «bağışlamak» → اِسْتَغْفَرَ «bağışlanma dilemek»."},"sources":["الأمثلة المختلفة","بناء الأفعال — أبواب الثلاثي المزيد"],"examples":[{"ar":"وَمَنْ جَاءَكَ يَسْتَفْتِيكَ.","gloss":{"en":"Whoever comes to you seeking a ruling — the «seeking» sense of Form X.","tr":"Sana fetva sormaya gelen kimse — istif'âlin «talep» manası."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"اِسْتَغْفَرَ الْمُؤْمِنُ رَبَّهُ.","gloss":{"en":"The believer sought his Lord's forgiveness.","tr":"Mümin Rabbinden mağfiret diledi."},"src":null}],"mistakes":[{"wrong":"مَصْدَرُ اسْتَغْفَرَ: اِسْتِغْفِير","right":"اِسْتِغْفَار","why":{"en":"Form X's masdar is on the pattern اِسْتِفْعَال, with an alif before the last radical.","tr":"Onuncu bâbın masdarı اِسْتِفْعَال veznindedir, son harften önce elif bulunur."}},{"wrong":"يُسْتَفْتِي (لِلْمَعْلُومِ)","right":"يَسْتَفْتِي","why":{"en":"The active present of Form X takes a fatha prefix; a damma prefix would make it passive.","tr":"Onuncu bâbın malum muzarisi fethalı önek alır; ötreli önek meçhul yapar."}}]},"hal":{"title":{"ar":"الْحَال","en":"The hal (circumstantial accusative)","tr":"Hâl"},"level":4,"group":"nahw","explanation":{"en":"The hal is an indefinite, derived noun in nasb that describes the STATE of its owner (صاحب الحال) at the moment of the action — it answers «how?». Ibn al-Hajib defines it in the Kafiya as «ما يبين هيئة الفاعل أو المفعول». In this story: أَتَى أَبَا حَنِيفَةَ مُوَدِّعًا — he came «in the state of bidding farewell». The hal is typically an ism fail or ism maful, stays indefinite, and its owner is typically definite. Several hals can stack without a conjunction: خَرَجَ شَاكِرًا عَامِلًا.","tr":"Hâl; işin yapıldığı andaki DURUMU bildiren, nekre ve müştak, mansub bir isimdir — «nasıl?» sorusuna cevap verir. İbnü'l-Hâcib Kâfiye'de «fâilin veya mef'ûlün heyetini açıklayan» diye tanımlar. Hikâyede: أَتَى أَبَا حَنِيفَةَ مُوَدِّعًا — «vedalaşır hâlde» geldi. Hâl çoğunlukla ism-i fâil veya ism-i mef'ûldür, nekre kalır; sahibi (zü'l-hâl) çoğunlukla marifedir. Birden çok hâl atıfsız arka arkaya gelebilir: خَرَجَ شَاكِرًا عَامِلًا."},"plain":{"en":"Describes the state someone was in while doing the thing: «he left thankful».","tr":"İşi yaparken kişinin hâlini bildirir: «şükrederek çıktı»."},"mamul":"mansub","sources":["الكافية (ابن الحاجب)","قطر الندى (ابن هشام)","إظهار الأسرار (البيركوي)"],"question":{"tr":["Ne olduğu halde?"],"en":["In what state?"]},"examples":[{"ar":"أَتَى أَبَا حَنِيفَةَ مُوَدِّعًا.","gloss":{"en":"He came to Abu Hanifa to bid him farewell (lit. «in a farewelling state»).","tr":"Ona veda ederek geldi (lafzen «veda eder hâlde»)."},"src":"wasiyyat-abi-hanifa-L4"},{"ar":"فَخَرَجَ يُوسُفُ شَاكِرًا عَامِلًا بِوَصِيَّةِ إِمَامِهِ.","gloss":{"en":"Yusuf left thankful, acting on his imam's testament — two stacked hals.","tr":"Yusuf şükrederek ve imamının vasiyetiyle amel ederek ayrıldı — üst üste iki hâl."},"src":"wasiyyat-abi-hanifa-L4"},{"ar":"جَاءَ الطَّالِبُ مُسْرِعًا.","gloss":{"en":"The student came hurrying.","tr":"Talebe koşarak geldi."},"src":null}],"mistakes":[{"wrong":"جاء الطالبُ مسرعٌ","right":"جاء الطالبُ مسرعًا","why":{"en":"The hal is always mansub — learners let it agree with the marfu' subject as if it were an adjective.","tr":"Hâl daima mansubdur — öğrenciler onu sıfat sanıp merfu fâile uydurur."}},{"wrong":"جاء الطالبُ المسرعَ (بمعنى الحال)","right":"جاء الطالبُ مُسْرِعًا","why":{"en":"A definite word after a definite noun is a na't (adjective), not a hal. The hal must stay indefinite: definite owner + indefinite state.","tr":"Marife isimden sonra gelen marife kelime sıfattır, hâl değil. Hâl nekre kalmalıdır: sahibi marife, hâl nekre."}},{"wrong":"جاء مسرعًا الطالبُ… (والصاحب نكرة)","right":"صاحِبُ الحالِ الأصلُ فيه أن يكون معرفةً","why":{"en":"The owner of the hal should normally be definite; with an indefinite owner, classical usage prefers fronting the hal or reading the phrase as a na't.","tr":"Zü'l-hâlin aslı marife olmasıdır; nekre olursa klasik kullanım hâli öne almayı veya terkibi sıfat saymayı tercih eder."}}]},"haqiqa-majaz":{"title":{"ar":"الْحَقِيقَةُ وَالْمَجَاز","en":"Literal and figurative","tr":"Hakikat ve mecaz"},"level":5,"group":"balagha","explanation":{"en":"A word used for what it was coined for is حَقِيقَة. Used for something else it is مَجَاز, and the tradition defines it tightly: لَفْظٌ مُسْتَعْمَلٌ فِي غَيْرِ مَا وُضِعَ لَهُ بِعَلَاقَةٍ بَيْنَهُمَا مَعَ قَرِينَةٍ مَانِعَةٍ عَنْ إِرَادَةِ الْمَوْضُوعِ لَهُ — a word used for other than what it was coined for, by a RELATION between the two, with a CLUE that blocks the literal reading. Four things are therefore always present: what the word was coined for, what it is being used for, the relation, and the blocking clue. The textbook case: رَأَيْتُ أَسَدًا فِي يَدِهِ سَيْفٌ. أَسَد was coined for the beast; it is used here for a brave man; the relation is resemblance; and the clue that stops you reading «lion» is فِي يَدِهِ سَيْفٌ — lions do not carry swords. When the relation IS resemblance the majaz has its own name, اِسْتِعَارَة. When it is anything else — the part for the whole, the container for the contained, the cause for the effect, what a thing used to be or will become — it is مَجَازٌ مُرْسَل. بَيْنَ يَدَيْهِ is that second kind: the hands stand for the presence, part for whole.","tr":"Bir kelime konulduğu mana için kullanılırsa hakikattir. Başka bir mana için kullanılırsa mecazdır ve gelenek onu şöyle tarif eder: لَفْظٌ مُسْتَعْمَلٌ فِي غَيْرِ مَا وُضِعَ لَهُ بِعَلَاقَةٍ بَيْنَهُمَا مَعَ قَرِينَةٍ مَانِعَةٍ عَنْ إِرَادَةِ الْمَوْضُوعِ لَهُ — aralarındaki bir ALÂKA ile, hakikî manayı murad etmeye engel olan bir KARÎNE ile birlikte, konulduğu mananın dışında kullanılan lafız. Böylece dört şey daima bulunur: mâ vuzia leh, müsta'melün fîh, alâka ve karîne-i mânia. Ders kitabı örneği: رَأَيْتُ أَسَدًا فِي يَدِهِ سَيْفٌ. أَسَد yırtıcı hayvan için konulmuştur; burada cesur adam için kullanılmıştır; alâka müşâbehettir; «aslan» diye okumayı engelleyen karîne ise فِي يَدِهِ سَيْفٌ'dir — aslanın elinde kılıç olmaz. Alâka müşâbehet ise mecazın adı istiâredir. Başka bir şey ise — cüz-kül, zarf-mazrûf, sebep-müsebbep, olduğu yahut olacağı hâl — mecâz-ı mürseldir. بَيْنَ يَدَيْهِ bu ikinci türdendir: eller huzurun yerini tutar, cüz külün."},"plain":{"en":"Using a word for what it actually means, or for something connected to it.","tr":"Bir kelimeyi ya kendi manasında ya da onunla alâkalı bir manada kullanmak."},"sources":["تلخيص المفتاح (القزويني) — علم البيان","علاقات المجاز","مختصر السعد"],"examples":[{"ar":"وَإِيَّاكَ وَالْكَذِبَ بَيْنَ يَدَيْهِ.","gloss":{"en":"Beware of lying in his presence — «between his two hands» stands for being before him: majaz mursal, the part for the whole.","tr":"Onun huzurunda yalandan sakın — «iki eli arasında», huzurunda bulunmanın yerini tutar: cüz-kül alâkasıyla mecâz-ı mürsel."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"رَأَيْتُ أَسَدًا فِي يَدِهِ سَيْفٌ.","gloss":{"en":"I saw a lion with a sword in his hand — the sword is the clue that blocks the literal lion.","tr":"Elinde kılıç olan bir aslan gördüm — kılıç, hakikî aslanı engelleyen karînedir."},"src":null},{"ar":"وَاسْأَلِ الْقَرْيَةَ.","gloss":{"en":"Ask the town — the place for its people: the container for what it contains.","tr":"Köye sor — mahal ehli için: zarf, mazrûf yerine."},"src":null}],"mistakes":[{"wrong":"رَأَيْتُ أَسَدًا — مَجَازٌ بِلَا قَرِينَةٍ","right":"لَا مَجَازَ بِلَا قَرِينَةٍ مَانِعَةٍ","why":{"en":"Without something in the sentence that blocks the literal reading, «I saw a lion» just means a lion. The clue is part of the definition, not an optional extra.","tr":"Cümlede hakikî manayı engelleyen bir şey yoksa «bir aslan gördüm» gerçekten aslandır. Karîne tarifin parçasıdır, fazladan bir süs değildir."}},{"wrong":"كُلُّ مَجَازٍ اسْتِعَارَةٌ","right":"الِاسْتِعَارَةُ مَجَازٌ عَلَاقَتُهُ الْمُشَابَهَة، وَغَيْرُهَا مُرْسَلٌ","why":{"en":"Only a resemblance-relation makes an isti'ara. Part-for-whole, cause-for-effect and the rest are majaz mursal.","tr":"İstiâre yalnız müşâbehet alâkasıyla olur. Cüz-kül, sebep-müsebbep ve benzerleri mecâz-ı mürseldir."}}]},"hollow-verbs":{"title":{"ar":"الْفِعْل الأَجْوَف","en":"Hollow verbs","tr":"Ecvef fiil"},"level":3,"group":"sarf","explanation":{"en":"A hollow (ajwaf) verb has و or ي as its middle radical: قَالَ (aslu-hu قَوَلَ), خَافَ (خَوِفَ), أَرَادَ (أَرْوَدَ). Two rules explain almost every form. FIRST, a voweled و or ي moves its vowel onto the preceding sound letter: يَقْوُلُ → يَقُولُ, and if that vowel is a fatha the letter becomes alif instead: يَخْوَفُ → يَخَافُ. SECOND, when that move would leave two vowelless letters together, the weak letter is dropped outright: لَمْ يَقْوُلْ → لَمْ يَقُلْ, قَوَلْنَ → قُلْنَ. The vowel left behind is not arbitrary — it points to what was lost: damma for a dropped و (قُلْنَ, قُمْنَ), kasra for a dropped ي (بِعْنَ, كِلْنَ). The passive follows the same logic from the other side: قُوِلَ → قِيلَ, بُيِعَ → بِيعَ, خُوِفَ → خِيفَ. Two limits are worth memorising. In the augmented babs, i'lal happens only in إِفْعَال, اِنْفِعَال, اِفْتِعَال and اِسْتِفْعَال; فَعَّلَ, فَاعَلَ, تَفَعَّلَ, تَفَاعَلَ and اِفْعَلَّ keep the weak letter intact — طَوَّلَ, طَاوَلَ, تَحَوَّلَ, تَصَوَّرَ. And the masdars of if'al and istif'al compensate for the lost و with a final ة: إِقْوَام → إِقَامَة, اِسْتِقْوَام → اِسْتِقَامَة. The Bina counts these among the seven irregular classes.","tr":"Ecvef fiilin orta harfi و veya ي'dir: قَالَ (aslı قَوَلَ), خَافَ (خَوِفَ), أَرَادَ (أَرْوَدَ). Neredeyse bütün şekilleri iki kaide açıklar. BİRİNCİ: harekeli و/ي harekesini kendinden önceki sahih sâkin harfe nakleder: يَقْوُلُ → يَقُولُ; o hareke fetha ise harf elife kalbolur: يَخْوَفُ → يَخَافُ. İKİNCİ: bu nakil iki sâkini bir araya getirecekse illetli harf tamamen düşer: لَمْ يَقْوُلْ → لَمْ يَقُلْ، قَوَلْنَ → قُلْنَ. Geriye kalan hareke keyfî değildir, düşen harfe delâlet eder: و düşmüşse damme (قُلْنَ، قُمْنَ), ي düşmüşse kesre (بِعْنَ، كِلْنَ). Meçhul de aynı mantığı öbür yönden izler: قُوِلَ → قِيلَ، بُيِعَ → بِيعَ، خُوِفَ → خِيفَ. Ezberlenmesi gereken iki sınır vardır. Mezîd bablarda i'lal yalnız إِفْعَال، اِنْفِعَال، اِفْتِعَال ve اِسْتِفْعَال'de olur; فَعَّلَ، فَاعَلَ، تَفَعَّلَ، تَفَاعَلَ ve اِفْعَلَّ illetli harfi olduğu gibi korur — طَوَّلَ، طَاوَلَ، تَحَوَّلَ، تَصَوَّرَ. Ayrıca if'âl ve istif'âl masdarlarında düşen و'ın yerine sona tâ getirilir: إِقْوَام → إِقَامَة، اِسْتِقْوَام → اِسْتِقَامَة. Binâ bunları aksâm-ı seb'a içinde sayar."},"plain":{"en":"Verbs with و or ي in the middle, like قَالَ. The weak letter shortens or vanishes in some forms — which is why «he did not say» is لَمْ يَقُلْ and not لَمْ يَقُولْ.","tr":"Ortası و veya ي olan fiiller (قَالَ gibi). İllet harfi bazı sîgalarda kısalır veya düşer; «demedi» bu yüzden لَمْ يَقُلْ'dur, لَمْ يَقُولْ değil."},"sources":["بناء الأفعال — الأقسام السبعة","المقصود — الأجوف","مراح الأرواح"],"examples":[{"ar":"قَالَ لَهُ أَبُو حَنِيفَةَ.","gloss":{"en":"Abu Hanifa said to him.","tr":"Ebû Hanîfe ona dedi."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"قُلْتُ الْحَقَّ وَقَالُوا كَذِبًا.","gloss":{"en":"I spoke the truth and they spoke a lie — long and short stems side by side.","tr":"Ben doğruyu söyledim, onlar yalan söylediler — uzun ve kısa gövde yan yana."},"src":null},{"ar":"خَافَ يُونُسُ فَدَعَا رَبَّهُ.","gloss":{"en":"Yunus was afraid and called upon his Lord — خَافَ shows the fatha route: خَوِفَ → خَافَ.","tr":"Yunus korktu ve Rabbine dua etti — خَافَ fetha yolunu gösterir: خَوِفَ → خَافَ."},"src":"yunus-wa-al-hut"}],"mistakes":[{"wrong":"قَالْتُ لك","right":"قُلْتُ لك","why":{"en":"Before the consonant suffix ـتُ the long alif must shorten to damma: قُلْتُ.","tr":"ـتُ ünsüz ekinden önce uzun elif ötreye kısalmalıdır: قُلْتُ."}},{"wrong":"لم يَقُولْ شيئًا","right":"لم يَقُلْ شيئًا","why":{"en":"In the jussive after لم the long vowel shortens: لم يَقُلْ.","tr":"لم'den sonra meczumda uzun ünlü kısalır: لم يَقُلْ."}},{"wrong":"قُوِلَ الْحَقُّ","right":"قِيلَ الْحَقُّ","why":{"en":"In the passive of a hollow verb the damma before the weak letter goes and its kasra moves back: قُوِلَ → قِيلَ.","tr":"Ecvefin meçhulünde illetli harften önceki damme düşer ve kesre öne nakledilir: قُوِلَ → قِيلَ."}},{"wrong":"تَصَاوَرَ / يَتَصَاوَرُ","right":"تَصَوَّرَ / يَتَصَوَّرُ","why":{"en":"No i'lal in bab V. The و is doubled and stable there, so the verb conjugates exactly like a sound one.","tr":"Tefe'ul bâbında i'lal yoktur. و şeddeli ve sabittir, fiil sahih gibi çekilir."}},{"wrong":"إِقْوَامٌ","right":"إِقَامَةٌ","why":{"en":"The masdar of أَقَامَ loses its و and takes a ة in compensation — the same happens in اِسْتِقَامَة.","tr":"أَقَامَ'nin masdarı و'ını kaybeder ve karşılığında tâ alır; اِسْتِقَامَة'de de böyledir."}}]},"huruf-jarr-nawadir":{"title":{"ar":"نَوَادِرُ حُرُوفِ الْجَرِّ","en":"The rarer jarr letters — the tail of Birgivi's twenty","tr":"Nâdir cer harfleri — Birgivî'nin yirmisinin son sekizi"},"level":6,"group":"awamil","explanation":{"en":"The Awamil's inventory of jarr letters runs to twenty, and the tail is where each letter carries a restriction. مُذْ and مُنْذُ give jarr only to expressions of TIME — مَا رَأَيْتُهُ مُذْ يَوْمِ الْجُمُعَةِ, «I have not seen him since Friday»; before a raf' reading they are nouns instead. خَلَا, عَدَا and حَاشَا mean «except» and give jarr when bare: قَامُوا خَلَا زَيْدٍ. Put مَا in front of خَلَا or عَدَا and they turn back into verbs, and the excepted thing must take nasb — مَا خَلَا زَيْدًا. حَاشَا is the odd one out: it does not take مَا at all in the received doctrine — Ibn Malik says so in one line, وَحَاشَا لَا تَصْحَبُ مَا — and the rare مَا حَاشَا the books quote is an anomaly, not a pattern. This split is why the same names appear in the istithna chapter with the other reading. لَوْلَا counts as a jarr letter only where an attached pronoun follows it — لَوْلَايَ, لَوْلَاكَ, «if not for me / for you» — as in the poet's لَوْلَاكَ … لَمْ أَحْجُجِ; before a plain noun it is not a governor of jarr at all but the لَوْلَا of the conditional, and the noun after it stands in raf' as a mubtada. كَيْ gives jarr to one word only: the questioning مَا — its alif dropping after the jarr letter to give كَيْمَ, and in pause a هْ of rest is added: كَيْمَهْ, «what for?». And لَعَلَّ, everywhere else a sister of إِنَّ, gives jarr in the dialect of the tribe of ʿUqayl — the books quote it, and a reader of classical texts should recognise it rather than emend it. The lesson of the tail is the lesson of the whole inventory: a governor is defined by what it does and under what conditions, not by how often it occurs.","tr":"Avâmil'in cer harfleri envanteri yirmiye varır ve kuyruk kısmında her harf bir kayıtla gelir. مُذْ ve مُنْذُ yalnız ZAMAN ifadelerini cer eder — مَا رَأَيْتُهُ مُذْ يَوْمِ الْجُمُعَةِ, «Cuma'dan beri onu görmedim»; ref okunduklarında ise isimdirler. خَلَا, عَدَا ve حَاشَا «hariç» demektir ve yalnız yalın hâlde cer verir: قَامُوا خَلَا زَيْدٍ. خَلَا ile عَدَا'nın başına مَا gelince fiile dönerler ve müstesnâ nasb almak zorundadır — مَا خَلَا زَيْدًا. حَاشَا ise ayrıdır: mütevâres kaidede مَا almaz — İbn Mâlik bunu tek satırda söyler: وَحَاشَا لَا تَصْحَبُ مَا — kitapların naklettiği nadir مَا حَاشَا bir şâzdır, kaide değil. Aynı isimlerin istisna bahsinde öbür okunuşla da geçmesinin sebebi bu ikiliktir. لَوْلَا ancak bitişik zamir izlediğinde cer harfi sayılır — لَوْلَايَ, لَوْلَاكَ, «ben/sen olmasaydım» — şairin لَوْلَاكَ … لَمْ أَحْجُجِ mısraındaki gibi; açık isimden önce ise cer âmili değil şart لَوْلَا'sıdır ve sonraki isim mübteda olarak ref'te durur. كَيْ yalnız tek kelimeyi cer eder: soru مَا'sı — cer harfinden sonra elifi düşüp كَيْمَ olur; vakıfta bir sekte hâsı eklenir: كَيْمَهْ, «niçin?». لَعَلَّ ise her yerde إِنَّ'nin kardeşiyken Ukayl kabilesinin lehçesinde cer verir — kitaplar bunu nakleder; klasik metin okuyan onu düzeltmeye kalkmadan tanımalıdır. Kuyruğun dersi bütün envanterin dersidir: âmil, ne sıklıkta geçtiğiyle değil, ne yaptığı ve hangi şartla yaptığıyla tarif edilir."},"plain":{"en":"Birgivi counts twenty jarr letters. After the twelve everyday ones come eight you meet rarely — «since», «except», «if not for» — each with its own restriction.","tr":"Birgivî yirmi cer harfi sayar. Her günkü on ikisinden sonra, seyrek karşılaşılan sekizi gelir — «-den beri», «hariç», «olmasaydı» — her birinin kendi kaydı vardır."},"sources":["العوامل (البركوي) — حروف الجرّ العشرون","قطر الندى (ابن هشام)","الكافية (ابن الحاجب)"],"examples":[{"ar":"مَا رَأَيْتُهُ مُذْ يَوْمِ الْجُمُعَةِ.","gloss":{"en":"مُذْ giving jarr to a time expression — its only office as a jarr letter.","tr":"مُذْ bir zaman ifadesini cer ediyor — cer harfi olarak tek vazifesi budur."},"src":null},{"ar":"قَامُوا خَلَا زَيْدٍ — وَمَا خَلَا زَيْدًا.","gloss":{"en":"The same word both ways: bare خَلَا gives jarr; after مَا it is a verb and the excepted noun must take nasb.","tr":"Aynı kelimenin iki hâli: yalın خَلَا cer verir; مَا'dan sonra fiildir ve müstesnâ nasb almak zorundadır."},"src":null},{"ar":"لَوْلَاكَ فِي ذَا الْعَامِ لَمْ أَحْجُجِ.","gloss":{"en":"The poet's لَوْلَاكَ — the one setting where لَوْلَا is counted a jarr letter, an attached pronoun following it.","tr":"Şairin لَوْلَاكَ'i — لَوْلَا'nın cer harfi sayıldığı tek yer: ardından bitişik zamir gelmesi."},"src":null}],"mistakes":[{"wrong":"مَا خَلَا زَيْدٍ","right":"مَا خَلَا زَيْدًا — وَبِلَا «مَا»: خَلَا زَيْدٍ","why":{"en":"مَا makes خَلَا a verb, and a verb takes an object in nasb. The jarr reading exists only for the bare letter.","tr":"مَا, خَلَا'yı fiil yapar ve fiil mef'ûlünü nasb eder. Cer okunuşu yalnız yalın harf içindir."}},{"wrong":"لَوْلَا الْعِلْمِ لَهَلَكَ النَّاسُ (بِالْجَرِّ)","right":"لَوْلَا الْعِلْمُ لَهَلَكَ النَّاسُ — الِاسْمُ الظَّاهِرُ بَعْدَهَا مُبْتَدَأٌ مَرْفُوعٌ","why":{"en":"Before a plain noun لَوْلَا is the conditional, not a jarr letter; the noun stands in raf' as a mubtada with its khabar omitted. The jarr reading belongs only to the attached pronouns.","tr":"Açık isimden önce لَوْلَا şart edatıdır, cer harfi değil; isim, haberi hazfedilmiş mübteda olarak ref'te durur. Cer okunuşu yalnız bitişik zamirlere aittir."}},{"wrong":"مُذْ زَيْدٍ","right":"مُذْ يَوْمِ الْجُمُعَةِ — فَمُذْ لَا تَجُرُّ إِلَّا الزَّمَانَ","why":{"en":"مُذْ and مُنْذُ give jarr to time and to nothing else. A person or a place after them is simply wrong.","tr":"مُذْ ve مُنْذُ yalnız zamanı cer eder. Arkalarına kişi veya mekân getirmek düpedüz yanlıştır."}},{"wrong":"مَا حَاشَا زَيْدًا (قِيَاسًا عَلَى مَا خَلَا)","right":"حَاشَا زَيْدٍ — فَحَاشَا لَا تَصْحَبُ «مَا» فِي الْمُخْتَارِ","why":{"en":"The ma-rule belongs to خَلَا and عَدَا. For حَاشَا the received doctrine is the reverse — Ibn Malik: وَحَاشَا لَا تَصْحَبُ مَا — and the attested مَا حَاشَا is an anomaly the books quote, not a construction to build on.","tr":"مَا kaidesi خَلَا ile عَدَا'ya aittir. حَاشَا'da mütevâres hüküm tersinedir — İbn Mâlik: وَحَاشَا لَا تَصْحَبُ مَا — nakledilen مَا حَاشَا, üzerine bina edilecek bir yapı değil, şâzdır."}}]},"huruf-jarr":{"title":{"ar":"حُرُوف الْجَرّ","en":"Prepositions","tr":"Cer harfleri"},"level":1,"group":"awamil","explanation":{"en":"Birgivi opens the Awamil with them: مِنْ، إِلَى، عَنْ، عَلَى، فِي، بِـ، لِـ، كَـ، حَتَّى، رُبَّ، وَاو الْقَسَم، تَاء الْقَسَم … Every noun after them takes kasra (or its substitute). In this story: إِلَى مَدِينَتِهِ، إِلَى مُعَلِّمِهِ، لَهُ.","tr":"Birgivî Avâmil'e bunlarla başlar: مِنْ، إِلَى، عَنْ، عَلَى، فِي، بِـ، لِـ، كَـ، حَتَّى، رُبَّ... Bunlardan sonra gelen isim daima mecrurdur (kesre veya naibi). Hikâyede: إِلَى مَدِينَتِهِ، إِلَى مُعَلِّمِهِ، لَهُ."},"plain":{"en":"The small words — in, from, to, with — that put the noun after them into the genitive.","tr":"Kendinden sonraki ismi cer eden küçük kelimeler: -de, -den, -e, ile."},"amil":"تَجُرُّ الِاسْمَ — the largest family of governors in the Awamil: they put the noun in jarr","mamul":"majrur","sources":["عوامل البركوي — حروف الجر العشرون","الكافية (ابن الحاجب) — حروف الجر","الإظهار (البركوي)"],"question":{"tr":["Ne ile?","Ne sebebi ile?","Kim ile?","Kim sebebi ile?","Neden?","Neden dolayı?","Ne üzerine?","Kim üzerine?"],"en":["With what?","By what cause?","With whom?","Caused by whom?","From what?","Because of what?","Upon what?","Upon whom?"]},"examples":[{"ar":"أَرَادَ أَنْ يَرْجِعَ إِلَى مَدِينَتِهِ.","gloss":{"en":"…to return to his city.","tr":"…şehrine dönmek için."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"قَالَ لَهُ أَبُو حَنِيفَةَ.","gloss":{"en":"Abu Hanifa said to him.","tr":"Ebû Hanîfe ona dedi."},"src":"wasiyyat-abi-hanifa-L2"}],"mistakes":[{"wrong":"ذهبتُ إلى البيتَ","right":"ذهبتُ إلى البيتِ","why":{"en":"After a preposition the noun is majrur — kasra, never fatha.","tr":"Harf-i cerden sonra isim mecrurdur — kesre, asla fetha değil."}},{"wrong":"سلّمتُ على أبو حنيفة","right":"سلّمتُ على أبي حنيفة","why":{"en":"The five nouns show jarr with ي: على أَبِي، not على أبو.","tr":"Esma-i hamse cerri ي ile gösterir: على أَبِي، على أبو değil."}}]},"huruf-tanbih":{"title":{"ar":"حُرُوفُ التَّنْبِيهِ (أَلَا، أَمَا، هَا)","en":"The particles of alerting: أَلَا، أَمَا، هَا","tr":"Tenbih harfleri (أَلَا، أَمَا، هَا)"},"level":4,"group":"nahw","explanation":{"en":"The حُرُوفُ التَّنْبِيهِ are three: أَلَا، أَمَا، هَا. They stand at the head of the sentence (they have صَدْرُ الْكَلَامِ), alert the listener, and then leave the sentence exactly as it was — they govern nothing. أَلَا very often introduces إِنَّ: «أَلَا إِنَّ أَوْلِيَاءَ اللهِ لَا خَوْفٌ عَلَيْهِمْ». That habit of standing directly before إِنَّ is why the Ottoman amil tables print أَلَا in the same row as إِنَّ and its sisters — but the government in أَلَا إِنَّ زَيْدًا قَائِمٌ belongs wholly to إِنَّ; أَلَا only knocks on the door. هَا is the same particle seen fused in هٰذَا (هَا + ذَا). A separate أَلَا exists among the حُرُوفُ التَّحْضِيضِ (urging: «why not…?» — أَلَا تَنْزِلُ؟); context separates them: tanbih-أَلَا precedes a statement, tahdid-أَلَا precedes a verb being urged.","tr":"Tenbih harfleri üçtür: أَلَا، أَمَا، هَا. Cümlenin başında bulunurlar (sadr-ı kelâm hakları vardır), dinleyeni uyarırlar ve cümleyi olduğu gibi bırakırlar — amel etmezler. أَلَا çok defa إِنَّ'nin önünde gelir: «أَلَا إِنَّ أَوْلِيَاءَ اللهِ لَا خَوْفٌ عَلَيْهِمْ». Osmanlı avâmil cetvellerinin أَلَا'yı إِنَّ ve kardeşleriyle aynı satırda göstermesi bu alışkanlıktandır — hâlbuki أَلَا إِنَّ زَيْدًا قَائِمٌ cümlesindeki amel tamamen إِنَّ'nindir; أَلَا yalnız kapıyı çalar. هَا aynı harfin هٰذَا (هَا + ذَا) içinde bitişmiş hâlidir. Bir de tahdîd (teşvik) harfleri arasında ayrı bir أَلَا vardır («niçin…-mıyorsun?» — أَلَا تَنْزِلُ؟); ikisini bağlam ayırır: tenbih أَلَا'sı bir haberin, tahdîd أَلَا'sı teşvik edilen bir fiilin önüne gelir."},"plain":{"en":"أَلَا، أَمَا and هَا open a sentence to say «listen — what follows matters». They change no endings; they only wake the listener.","tr":"أَلَا، أَمَا ve هَا cümlenin başında «dikkat — şimdi söylenecek şey mühim» demektir. Hiçbir i'rabı değiştirmezler; sadece dinleyeni uyandırırlar."},"sources":["الكافية (ابن الحاجب) — حروف التنبيه","قطر الندى (ابن هشام)"],"examples":[{"ar":"أَلَا إِنَّ زَيْدًا قَائِمٌ.","gloss":{"en":"Listen — Zayd is indeed standing. أَلَا alerts; the nasb of زَيْدًا is إِنَّ's work alone.","tr":"Dikkat — Zeyd gerçekten ayaktadır. أَلَا uyarır; زَيْدًا'in nasbı yalnız إِنَّ'nin amelidir."},"src":null},{"ar":"أَمَا وَاللهِ لَقَدْ صَدَقَ.","gloss":{"en":"Truly, by Allah, he spoke the truth — أَمَا readies the listener for the oath.","tr":"Gerçekten, vallahi doğru söyledi — أَمَا dinleyeni yemine hazırlar."},"src":null}],"mistakes":[{"wrong":"أَلَا زَيْدًا قَائِمٌ","right":"أَلَا إِنَّ زَيْدًا قَائِمٌ","why":{"en":"أَلَا itself governs nothing, so it cannot put زيد into nasb. The amil-table row that seats الا beside إِنَّ records its habit of preceding إِنَّ, not a government of its own.","tr":"أَلَا kendisi amel etmez, زيد'i nasb edemez. Avâmil cetvelinin الا'yı إِنَّ yanına oturtması onun إِنَّ önünde gelme âdetini kaydeder, kendi amelini değil."}},{"wrong":"إِنَّ أَلَا زَيْدًا قَائِمٌ","right":"أَلَا إِنَّ زَيْدًا قَائِمٌ","why":{"en":"The tanbih particles hold the head of the sentence; nothing may precede them, least of all the very إِنَّ they introduce.","tr":"Tenbih harflerinin sadr-ı kelâm hakkı vardır; önlerine hiçbir şey geçemez — hele takdim ettikleri إِنَّ hiç geçemez."}}]},"idafa-definiteness":{"title":{"ar":"الإِضَافَة","en":"Idafa (possessive construction)","tr":"İzâfet (tamlama)"},"level":2,"group":"nahw","explanation":{"en":"Two nouns chained: the first (mudaf) never takes الـ or tanwin; the second (mudaf ilayh) is always majrur and supplies the definiteness. مُعَلِّمِهِ = مُعَلِّم + ه: \"his teacher\" — definite because of the pronoun, though مُعَلِّم itself carries no الـ. An attached pronoun (ـه، ـي…) counts as a mudaf ilayh in the position of jarr.","tr":"İki isim tamlaması: birincisi (muzaf) asla الـ ve tenvin almaz; ikincisi (muzafun ileyh) daima mecrurdur ve belirliliği sağlar. مُعَلِّمِهِ = مُعَلِّم + ه: 'onun hocası'. Bitişik zamir, cer mahallinde muzafun ileyhtir."},"plain":{"en":"Two nouns joined to mean «the X of Y». The second one decides whether the whole thing counts as definite.","tr":"«Bir şeyin bir şeyi» manasında iki ismin birleşmesi. Bütünün belirli olup olmadığını ikincisi tayin eder."},"mamul":"majrur","sources":["الكافية (ابن الحاجب) — المضاف إليه","الإظهار (البركوي) — الإضافة"],"examples":[{"ar":"ذَهَبَ إِلَى مُعَلِّمِهِ.","gloss":{"en":"He went to his teacher.","tr":"Hocasına gitti."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"اسْمَعْ وَصِيَّتِي.","gloss":{"en":"Listen to my testament (وصيّة + ي).","tr":"Vasiyetimi dinle (وصيّة + ي)."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"كِتَابُ الطَّالِبِ جَدِيدٌ.","gloss":{"en":"The student's book is new.","tr":"Talebenin kitabı yenidir."},"src":null}],"mistakes":[{"wrong":"الْكِتَابُ الطَّالِبِ","right":"كِتَابُ الطَّالِبِ","why":{"en":"The mudaf never takes الـ — definiteness flows up from the mudaf ilayh.","tr":"Muzaf asla الـ almaz — belirlilik muzafun ileyhten gelir."}},{"wrong":"كِتَابٌ الطَّالِبِ","right":"كِتَابُ الطَّالِبِ","why":{"en":"The mudaf also never takes tanwin — tanwin and idafa exclude each other.","tr":"Muzaf tenvin de almaz — tenvin ile izafet bir arada bulunmaz."}}]},"idha-shartiyya":{"title":{"ar":"إِذَا الشَّرْطِيَّة","en":"Conditional idha","tr":"إِذَا şartiyye"},"level":2,"group":"nahw","explanation":{"en":"إِذَا is an adverb of future time carrying conditional meaning (\"when/whenever\"): ظرف لما يستقبل من الزمان متضمن معنى الشرط. Unlike إِنْ, it does not put verbs in jazm in standard prose — its verb is usually a past form understood as future: إِذَا دَخَلْتَ الْبَصْرَةَ (when you enter Basra). When the answer clause is a future statement, request, or nominal sentence, it is introduced by ف: فَسَيَأْتِيكَ النَّاسُ. Ibn Hisham treats إذا at length in Qatr al-Nada.","tr":"إِذَا gelecek zaman zarfıdır ve şart anlamı taşır. إِنْ'den farklı olarak nesirde cezmetmez; fiili çoğu kez gelecek anlamlı mazidir: إِذَا دَخَلْتَ الْبَصْرَةَ. Cevap cümlesi gelecek, talep veya isim cümlesi ise ف ile bağlanır: فَسَيَأْتِيكَ النَّاسُ. İbn Hişâm Katru'n-Nedâ'da إذا'yı genişçe işler."},"plain":{"en":"«When…» — used for something you expect to happen.","tr":"«…-dığı zaman» — olması beklenen bir şey için."},"sources":["قطر الندى (ابن هشام)","الكافية (ابن الحاجب)"],"examples":[{"ar":"إِذَا دَخَلْتَ الْبَصْرَةَ فَسَيَأْتِيكَ النَّاسُ.","gloss":{"en":"When you enter Basra, the people will come to you.","tr":"Basra'ya girdiğinde insanlar sana gelecek."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"إِذَا جَاءَ نَصْرُ اللهِ وَالْفَتْحُ.","gloss":{"en":"When Allah's help and the victory come… (Quran 110:1)","tr":"Allah'ın yardımı ve fetih geldiğinde… (Nasr 110:1)"},"src":null}],"mistakes":[{"wrong":"إذا تدخلْ البصرةَ","right":"إذا دخلتَ البصرةَ","why":{"en":"Treating إذا like إنْ and jazming the verb. In prose إذا does not govern jazm; it prefers a past-tense verb with future meaning.","tr":"إذا, إنْ gibi cezmetmez; nesirde gelecek anlamlı mazi fiil tercih edilir."}},{"wrong":"إذا دخلتَ البصرةَ سيأتيك الناسُ","right":"إذا دخلتَ البصرةَ فسيأتيك الناسُ","why":{"en":"When the answer clause starts with س/سوف (or is a command or nominal sentence), it must be tied with the answer ف.","tr":"Cevap س/سوف ile, emirle veya isim cümlesiyle başlıyorsa cevap fâsı (ف) gerekir."}}]},"imperative-amr":{"title":{"ar":"فِعْل الأَمْر","en":"The Imperative (fi'l al-amr)","tr":"Emir fiili"},"level":2,"group":"sarf","explanation":{"en":"The imperative commands someone to do something. It is built from the present-tense (مضارع) stem: drop the prefix, and if the result starts with a consonant cluster, add a helping alif. From تَسْمَعُ (you listen) → اسْمَعْ (listen!). The final letter takes sukun (or drops for weak-final verbs).","tr":"Emir fiili, muzari gövdesinden yapılır: muzaraat harfi atılır, gerekirse başa hemze getirilir. تَسْمَعُ → اسْمَعْ (dinle!). Son harf cezimlenir."},"plain":{"en":"How you tell someone to do something.","tr":"Birine bir işi yapmasını söyleme şekli."},"sources":["الأمثلة المطردة — الأمر الحاضر","بناء الأفعال","المقصود — بناء الأمر"],"examples":[{"ar":"اسْمَعْ وَصِيَّتِي.","gloss":{"en":"Listen to my testament.","tr":"Vasiyetimi dinle."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"اُكْتُبْ دَرْسَكَ.","gloss":{"en":"Write your lesson.","tr":"Dersini yaz."},"src":null},{"ar":"قُلِ الْحَقَّ.","gloss":{"en":"Speak the truth. (hollow verb: قال → قُلْ)","tr":"Doğruyu söyle. (ecvef fiil: قال → قُلْ)"},"src":null}],"mistakes":[{"wrong":"اِسْمَعُ وصيتي","right":"اسْمَعْ وصيتي","why":{"en":"Learners keep the present-tense damma on the last letter. The imperative ends in sukun: اسْمَعْ, not اسمَعُ.","tr":"Öğrenciler son harfte muzarinin ötresini bırakır; emirde son harf cezimli olmalı."}},{"wrong":"أَسْمَعْ! (meaning: listen!)","right":"اسْمَعْ!","why":{"en":"Using hamzat qat' (أَ) instead of hamzat wasl (ا). أَسْمَعُ means 'I hear'. The Form-I imperative takes hamzat wasl, which drops in connected speech: يا يوسفُ اسْمَعْ.","tr":"Hemze-i kat' değil hemze-i vasl gelir; أَسْمَعُ 'duyuyorum' demektir."}},{"wrong":"اِسْمَعْ إلى وصيتي","right":"اسْمَعْ وصيتي / اِسْتَمِعْ إِلَى وصيتي","why":{"en":"Preposition transfer from English 'listen TO'. سَمِعَ takes a direct object; only اِسْتَمَعَ (Form VIII) takes إلى.","tr":"İngilizce 'listen to'dan aktarma; سمع nesneyi doğrudan alır, إلى yalnız استمع ile kullanılır."}}]},"in-shartiyya":{"title":{"ar":"إِنْ الشَّرْطِيَّة وَأَدَوَاتُ الشَّرْطِ الْجَازِمَة","en":"The conditional that puts two verbs in jazm","tr":"İki fiili cezmeden şart edatları"},"level":4,"group":"awamil","explanation":{"en":"إِنْ is the conditional particle proper, and unlike إِذَا it GOVERNS: it puts two verbs in jazm at once — the condition (فِعْلُ الشَّرْطِ) and its answer (جَوَابُ الشَّرْطِ). إِنْ طَلَبْتَ الْمَالَ … عَجَزْتَ: both are past in form, and both stand in the position of jazm even though a past verb shows nothing. With a present verb the jazm is visible: إِنْ تَطْلُبْ تَعْجِزْ. A family of NOUNS does the same work and is governed by nothing: مَنْ, مَا, مَتَى, أَيْنَ, أَيُّ, حَيْثُمَا — and, rarer but on the same list of fifteen, مَهْمَا «whatever», أَنَّى «wherever / however», and the compounds إِذْمَا and إِذَا مَا «whenever», which give jazm where bare إِذَا never does. مَنْ لَمْ يَرْحَمْ … فَلَيْسَ مِنَّا — مَنْ is a mubtada in the position of raf', and its two verbs are in jazm. Two practical points. When the answer cannot itself take jazm — a nominal sentence, a لَيْسَ, an imperative, a prohibition — it must be tied on with فَ: فَلَا تُجِبْهُ, فَلَيْسَ مِنَّا. And إِنْ differs from إِذَا in meaning as well as in government: إِذَا is for what will certainly happen and إِنْ for what may or may not, which is why «even if» is وَإِنْ and never وَإِذَا.","tr":"إِنْ asıl şart harfidir ve إِذَا'nın aksine AMEL EDER: iki fiili birden cezmeder — şart fiilini ve cevabını. إِنْ طَلَبْتَ الْمَالَ … عَجَزْتَ: ikisi de mâzi şeklindedir ve mâzi cezm alâmeti göstermese de ikisi de cezm mahallindedir. Muzâri ile cezm görünür: إِنْ تَطْلُبْ تَعْجِزْ. Aynı işi gören ve kendisi âmilsiz olan bir İSİM ailesi vardır: مَنْ، مَا، مَتَى، أَيْنَ، أَيُّ، حَيْثُمَا — ve on beşlik listenin daha nadir kalanları: مَهْمَا «her ne», أَنَّى «her nerede/nasıl», bir de yalın إِذَا'nın asla yapmadığı cezmi yapan إِذْمَا ile إِذَا مَا «her ne zaman» bileşikleri. مَنْ لَمْ يَرْحَمْ … فَلَيْسَ مِنَّا — مَنْ ref mahallinde mübtedadır, iki fiili de meczûmdur. İki amelî not: cevap kendisi cezm alamayacak bir yapıysa — isim cümlesi, لَيْسَ, emir, nehiy — فَ ile bağlanmalıdır: فَلَا تُجِبْهُ، فَلَيْسَ مِنَّا. Ayrıca إِنْ manaca da إِذَا'dan ayrılır: إِذَا kesin olacak için, إِنْ ise olabilir de olmayabilir de olan için gelir; «velev ki» ifadesinin وَإِنْ olup وَإِذَا olmamasının sebebi budur."},"plain":{"en":"«If…» — and it changes the ending of both verbs it governs.","tr":"«Eğer…» — kendisine bağlı iki fiilin de sonunu değiştirir."},"mamul":"majzum","sources":["العوامل (البيركوي) — الجوازم","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"examples":[{"ar":"فَإِنَّكَ إِنْ طَلَبْتَ الْمَالَ فِي وَقْتِ التَّعَلُّمِ عَجَزْتَ عَنْ طَلَبِ الْعِلْمِ.","gloss":{"en":"If you seek wealth while you are learning, you will fall short of seeking knowledge — two past-form verbs, both in the position of jazm.","tr":"İlim tahsili vaktinde mal talep edersen ilim talebinden âciz kalırsın — mâzi şeklinde iki fiil, ikisi de cezm mahallinde."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"مَنْ لَمْ يَرْحَمْ صَغِيرَنَا وَلَمْ يُوَقِّرْ كَبِيرَنَا فَلَيْسَ مِنَّا.","gloss":{"en":"Whoever does not show mercy to our young nor honour our old is not one of us — the answer is a لَيْسَ clause, so فَ is required.","tr":"Küçüğümüze merhamet etmeyen, büyüğümüzü saymayan bizden değildir — cevap لَيْسَ cümlesidir, bu yüzden فَ zorunludur."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"وَمَنْ دَعَاكَ مِنْ خَلْفِكَ فَلَا تُجِبْهُ.","gloss":{"en":"Whoever calls you from behind, do not answer him — a prohibition as the answer, again tied on with فَ.","tr":"Arkandan çağırana cevap verme — cevap nehiydir, yine فَ ile bağlanır."},"src":"wasiyyat-abi-yusuf-L5"}],"mistakes":[{"wrong":"إِنْ تَجْتَهِدُ تَنْجَحُ","right":"إِنْ تَجْتَهِدْ تَنْجَحْ","why":{"en":"إِنْ governs BOTH verbs. Leaving either in raf' means the condition was never built.","tr":"إِنْ İKİ fiili birden cezmeder. Birini merfû bırakmak şartı kurmamak demektir."}},{"wrong":"مَنْ يَجْتَهِدْ هُوَ نَاجِحٌ","right":"مَنْ يَجْتَهِدْ فَهُوَ نَاجِحٌ","why":{"en":"A nominal sentence cannot take jazm, so it can only serve as the answer when فَ ties it on.","tr":"İsim cümlesi cezm alamaz; ancak فَ ile bağlanırsa cevap olabilir."}},{"wrong":"إِذَا اجْتَهَدْتَ تَنْجَحْ","right":"إِذَا اجْتَهَدْتَ نَجَحْتَ / إِنْ تَجْتَهِدْ تَنْجَحْ","why":{"en":"إِذَا does not govern. Only إِنْ and the conditional nouns give jazm; إِذَا is an adverb annexed to the clause after it.","tr":"إِذَا amel etmez. Cezmi ancak إِنْ ve şart isimleri verir; إِذَا, sonrasına muzâf olan bir zarftır."}}]},"inna-wa-akhawatuha":{"title":{"ar":"إِنَّ وَأَخَوَاتُهَا","en":"Inna and its sisters","tr":"إِنَّ ve kardeşleri"},"level":2,"group":"awamil","explanation":{"en":"The six particles resembling verbs (الحروف المشبهة بالفعل): إِنَّ، أَنَّ، كَأَنَّ، لَكِنَّ، لَيْتَ، لَعَلَّ. They enter a nominal sentence and reverse كان's work: the subject (now the ism) takes nasb, the predicate (khabar) stays in raf'. In this story: إِنَّ الْعِلْمَ أَمَانَةٌ — knowledge (nasb) is a trust (raf'). Birgivi counts them among the strongest of the sixty governors; Ibn Hisham devotes a chapter of Qatr al-Nada to them.","tr":"Fiile benzeyen altı harf: إِنَّ، أَنَّ، كَأَنَّ، لَكِنَّ، لَيْتَ، لَعَلَّ. İsim cümlesine girer, ismini nasbeder, haberini ref eder. Hikâyede: إِنَّ الْعِلْمَ أَمَانَةٌ — ilim (mansub) bir emanettir (merfu). Birgivî bunları avâmilin en güçlülerinden sayar; İbn Hişâm Katru'n-Nedâ'da ayrı bab ayırır."},"plain":{"en":"إِنَّ and its family put the topic in the accusative and leave the predicate alone — the mirror image of كَانَ.","tr":"إِنَّ ve kardeşleri mübtedayı nasb eder, haberi olduğu gibi bırakır — كَانَ'nin tam tersi."},"amil":"تَنْصِبُ الِاسْمَ وَتَرْفَعُ الْخَبَرَ — governors that put the subject in nasb and keep the predicate in raf'","mamul":"marfu","sources":["العوامل (البيركوي)","إظهار الأسرار (البيركوي)","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"question":{"tr":["Nedir? Kimdir?","Ne iledir? Nerededir?"],"en":["What is it? Who is it?","With what — or where — is it?"]},"examples":[{"ar":"إِنَّ الْعِلْمَ أَمَانَةٌ.","gloss":{"en":"Indeed knowledge is a trust.","tr":"Muhakkak ilim bir emanettir."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"وَإِنَّ النَّاسَ يَنْظُرُونَ إِلَيْكَ.","gloss":{"en":"And people are watching you — the khabar can be a whole verbal clause.","tr":"Ve insanlar seni gözetliyor — haber tam bir fiil cümlesi olabilir."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"لَعَلَّ الطَّالِبَ نَاجِحٌ.","gloss":{"en":"Perhaps the student will succeed.","tr":"Umulur ki talebe başarır."},"src":null}],"mistakes":[{"wrong":"إنّ العلمُ أمانةٌ","right":"إنّ العلمَ أمانةٌ","why":{"en":"The ism of إنّ must be mansub — learners keep the mubtada's damma out of habit.","tr":"إنّ'nin ismi mansub olmalıdır — mübtedanın ötresi alışkanlıkla bırakılıyor."}},{"wrong":"إنّ العلمَ أمانةً","right":"إنّ العلمَ أمانةٌ","why":{"en":"Over-correction: only the ism takes nasb; the khabar stays marfu'. Double nasb is the classic second-stage error.","tr":"Aşırı düzeltme: yalnız isim nasb alır; haber merfu kalır. Çift nasb klasik ikinci aşama hatasıdır."}},{"wrong":"إنّ يذهبُ الطالبُ","right":"إنّ الطالبَ يذهبُ","why":{"en":"إنّ enters nominal sentences — a noun must follow it, never a verb directly.","tr":"إنّ isim cümlesine girer — hemen ardından fiil gelmez; önce isim gelmelidir."}}]},"innama-kaffa":{"title":{"ar":"إِنَّمَا الْكَافَّة وَالْمَكْفُوفَة","en":"innama — restriction (kaffa wa-makfufa)","tr":"إِنَّمَا — kâffe ve mekfûfe (hasr)"},"level":3,"group":"awamil","explanation":{"en":"When ما attaches to إِنَّ, the compound إِنَّمَا loses inna's governing power (the ما is called kaffa, 'the restrainer', and inna is makfufa, 'restrained'): no ism in nasb, no khabar — the sentence after it is an ordinary nominal sentence with both parts in raf'. In exchange, إنما adds the meaning of restriction (hasr): 'only, nothing but'. In the hadith: إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ — deeds are ONLY by intentions, with الأعمال in plain raf' as mubtada.","tr":"ما, إِنَّ'ye bitişince إِنَّمَا bileşiği إنّ'nin amelini kaybeder (bu ما'ya kâffe 'engelleyici', إنّ'ye mekfûfe denir): mansub isim ve haber kalmaz — sonrası mübteda ve haberi merfu, sıradan bir isim cümlesidir. Buna karşılık إنما hasr ('ancak, yalnızca') anlamı katar. Hadiste: إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ — ameller ANCAK niyetlere göredir; الأعمال merfu mübtedadır."},"plain":{"en":"In إِنَّمَا the ما strips إِنَّ of its power and adds the meaning «only».","tr":"إِنَّمَا'da ما, إِنَّ'nin amelini keser ve «ancak» manasını katar."},"amil":"كَفَّتْ مَا إِنَّ عَنِ الْعَمَلِ — the attached ما neutralizes inna's government; the sentence returns to plain mubtada + khabar","sources":["الكافية (ابن الحاجب)","قطر الندى (ابن هشام)","إظهار الأسرار (البيركوي)"],"examples":[{"ar":"إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ.","gloss":{"en":"Deeds are only by intentions. (hadith)","tr":"Ameller ancak niyetlerledir. (hadis)"},"src":"deeds-are-by-intentions"},{"ar":"إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ.","gloss":{"en":"The believers are but brothers. (Quran 49:10)","tr":"Müminler ancak kardeştir. (Hucurât 49:10)"},"src":null},{"ar":"إِنَّ الْعِلْمَ أَمَانَةٌ / إِنَّمَا الْعِلْمُ أَمَانَةٌ.","gloss":{"en":"Contrast: with إنّ the noun is mansub; with إنما it returns to raf'.","tr":"Mukayese: إنّ ile isim mansub olur; إنما ile ref'e döner."},"src":null}],"mistakes":[{"wrong":"إنما الأعمالَ بالنيات","right":"إنما الأعمالُ بالنيات","why":{"en":"Keeping inna's nasb after إنما. The kaffa ما cancels the government — the noun goes back to raf'.","tr":"إنما'dan sonra إنّ'nin nasbını sürdürmek yanlıştır. Kâffe ما ameli düşürür — isim ref'e döner."}},{"wrong":"إنما تفعلُه حسنٌ (بمعنى: الذي تفعله)","right":"إنَّ ما تفعلُه حسنٌ","why":{"en":"Confusing fused إنما (restriction) with separate إنَّ + ما الموصولة ('that which'). When ما means 'what/that which', write it separately and inna keeps its government.","tr":"Bitişik إنما (hasr) ile ayrı إنَّ + ism-i mevsul ما ('şey ki') karıştırılıyor. ما 'şey' anlamındaysa ayrı yazılır ve إنّ ameline devam eder."}}]},"ism-fail":{"title":{"ar":"اسْمُ الْفَاعِلِ وَعَمَلُهُ","en":"The ism fa'il — a doer-noun that governs like its verb","tr":"İsm-i fâil ve ameli — fiili gibi amel eden isim"},"level":5,"group":"awamil","explanation":{"en":"The ism fa'il names the one doing the act: فَاعِل from the bare triliteral (شَاكِر «thanking», خَالِص «pure»), and for every augmented bab the mudari' shape with مُ and a kasra before the end — مُوَدِّع from وَدَّعَ, مُخْلِص from أَخْلَصَ. Birgivi counts it among the nine QIYASI governors, and the Kafiya states the terms of its amal: it works the work of its verb — raising a doer, and if the verb is transitive putting an object in nasb — on two conditions. It must carry the meaning of the present or the future, not the past; and it must LEAN (اِعْتِمَاد) on something before it: a negation, a question, a mubtada it serves as khabar, or a noun it describes or accompanies as hal. So in عَامِلًا بِوَصِيَّةِ إِمَامِهِ the ism fa'il, standing as hal, still reaches its object through the بِ exactly as the verb عَمِلَ بِ would. With الـ in front (الضَّارِبُ) it governs unconditionally, because the tradition reads it there as standing for a relative clause: الَّذِي يَضْرِبُ. Where both conditions fail — a past-meaning doer with no support — the amal is gone and the construction falls back to idafa: ضَارِبُ زَيْدٍ أَمْسِ, with jarr, not nasb.","tr":"İsm-i fâil işi yapanı adlandırır: sülâsî mücerredden فَاعِل vezni (شَاكِر «şükreden», خَالِص «hâlis»), mezîd bâbların hepsinden ise muzâri şekli başında مُ ve sondan önce kesre ile — وَدَّعَ'dan مُوَدِّع, أَخْلَصَ'dan مُخْلِص. Birgivî onu dokuz KIYASÎ âmilden sayar; Kâfiye amelinin şartlarını söyler: fiilinin amelini yapar — fâilini ref eder, fiili müteaddî ise mef'ûlünü nasb eder — iki şartla. Manası hâl veya istikbâl olmalı, mâzî olmamalı; ve kendinden önce bir şeye DAYANMALI (i'timâd): bir nefiy, bir istifham, haberi olduğu bir mübteda, yahut sıfatı veya hâli olduğu bir isim. عَامِلًا بِوَصِيَّةِ إِمَامِهِ'de hâl olarak duran ism-i fâil, mef'ûlüne بِ üzerinden tıpkı عَمِلَ بِ fiili gibi ulaşır. Başında الـ varsa (الضَّارِبُ) kayıtsız şartsız amel eder; çünkü gelenek onu orada bir sıla hükmünde okur: الَّذِي يَضْرِبُ. İki şart da düşerse — dayanaksız, mâzî manalı bir fâil ismi — amel gider ve terkip izafete döner: ضَارِبُ زَيْدٍ أَمْسِ, nasb ile değil cer ile."},"plain":{"en":"The noun for the one doing the action — «striking», «thanking» — and it can take a subject and an object exactly as its verb would.","tr":"İşi yapanın ismi — «vuran», «şükreden» — ve tıpkı fiili gibi fâil ve mef'ûl alabilir."},"sources":["الكافية (ابن الحاجب) — اسم الفاعل","العوامل (البركوي) — العامل القياسي","قطر الندى (ابن هشام)"],"examples":[{"ar":"فَخَرَجَ يُوسُفُ مِنْ عِنْدِهِ شَاكِرًا عَامِلًا بِوَصِيَّةِ إِمَامِهِ.","gloss":{"en":"Two doer-nouns as hal, and the second still governs: عَامِلًا reaches its object through بِ exactly as the verb عَمِلَ would.","tr":"Hâl olarak iki ism-i fâil; ikincisi amel etmeye devam eder: عَامِلًا, mef'ûlüne tıpkı عَمِلَ fiili gibi بِ ile ulaşır."},"src":"wasiyyat-abi-hanifa-L4"},{"ar":"مَنْ قَالَ … خَالِصًا وَمُخْلِصًا دَخَلَ الْجَنَّةَ.","gloss":{"en":"The bare-bab shape beside the augmented one in a single breath: خَالِص is فَاعِل from خَلَصَ, and مُخْلِص is the mim-shape from أَخْلَصَ.","tr":"Mücerred vezinle mezîd vezin yan yana: خَالِص, خَلَصَ'dan فَاعِل; مُخْلِص ise أَخْلَصَ'dan mimli şekildir."},"src":"aqaid-ahl-al-sunna"},{"ar":"أَتَى أَبَا حَنِيفَةَ مُوَدِّعًا.","gloss":{"en":"The Form II doer-noun as hal — «he came to bid farewell», the ism fa'il carrying the still-unfolding act.","tr":"Tef'îl bâbının ism-i fâili hâl olarak — «vedalaşmak üzere geldi»; ism-i fâil henüz sürmekte olan işi taşır."},"src":"wasiyyat-abi-hanifa-L4"}],"mistakes":[{"wrong":"هٰذَا ضَارِبٌ زَيْدًا أَمْسِ","right":"هٰذَا ضَارِبُ زَيْدٍ أَمْسِ","why":{"en":"With past meaning the ism fa'il loses its amal. The object can no longer stand in nasb; the construction becomes an idafa and the noun takes jarr.","tr":"Mâzî manasında ism-i fâilin ameli düşer. Mef'ûl artık nasb alamaz; terkip izafete döner ve isim cer olur."}},{"wrong":"كُلُّ اسْمِ فَاعِلٍ يَعْمَلُ أَيْنَمَا وَقَعَ","right":"يَعْمَلُ بِشَرْطَيْنِ: مَعْنَى الْحَالِ أَوِ الِاسْتِقْبَالِ، وَالِاعْتِمَادُ — إِلَّا الْمُحَلَّى بِالـ","why":{"en":"The amal is conditional: present-or-future meaning, and support from a negation, question, mubtada or described noun. Only the الـ-form governs unconditionally, being read as الَّذِي with its verb.","tr":"Amel şartlıdır: hâl-istikbâl manası ve nefiy, istifham, mübteda yahut mevsûfa i'timâd. Yalnız الـ'lı şekil kayıtsız amel eder; çünkü الَّذِي ve fiili hükmünde okunur."}},{"wrong":"حَسَنٌ = اسْمُ فَاعِلٍ","right":"حَسَنٌ صِفَةٌ مُشَبَّهَةٌ، وَضَارِبٌ اسْمُ فَاعِلٍ","why":{"en":"The ism fa'il names an act in motion; the sifa mushabbaha names a settled quality. The two govern differently, which is why the books keep them apart.","tr":"İsm-i fâil süren bir işi, sıfat-ı müşebbehe yerleşik bir vasfı adlandırır. Amelleri de farklıdır; kitapların onları ayrı tutmasının sebebi budur."}}]},"ism-fil":{"title":{"ar":"أَسْمَاءُ الْأَفْعَالِ","en":"Noun-verbs (asma' al-af'al)","tr":"İsim fiiller (esmâ-i ef'âl)"},"level":5,"group":"nahw","explanation":{"en":"The أَسْمَاءُ الْأَفْعَالِ carry a verb's meaning and government in a noun's clothing. Three tenses: هَيْهَاتَ = بَعُدَ (a past: «it is far indeed»), أُفٍّ = أَتَضَجَّرُ (a present: «ugh»), and the largest family are commands — صَهْ = اُسْكُتْ, مَهْ = اِنْكَفِفْ, رُوَيْدَ = أَمْهِلْ, دُونَكَ = خُذْ, and عَلَيْكَ = اِلْزَمْ, whose object routinely arrives through an extra بِ: عَلَيْكَ بِالصَّبْرِ «hold fast to patience» — majrur in form, its position that of a maf'ul bih. All of them are MABNI, all take a concealed fa'il, none may be omitted, and their ma'mul does not precede them. One live consequence from Qatr al-Nada: a mudari' answering a noun-verb of command is in JAZM, exactly as if a true imperative had preceded — مَكَانَكَ تُحْمَدْ «stay put — you will be praised».","tr":"أَسْمَاءُ الْأَفْعَالِ, isim kılığında fiil manası ve ameli taşır. Üç zamanı vardır: هَيْهَاتَ = بَعُدَ (mâzî: «ne kadar uzak»), أُفٍّ = أَتَضَجَّرُ (muzâri: «of!»), en kalabalık aile ise emirlerdir — صَهْ = اُسْكُتْ, مَهْ = vazgeç, رُوَيْدَ = mühlet ver, دُونَكَ = al, ve عَلَيْكَ = اِلْزَمْ; mef'ûlü çoğu zaman zâid بِ ile gelir: عَلَيْكَ بِالصَّبْرِ «sabra sarıl» — lafzen mecrûr, mahallen mef'ûlün bih. Hepsi MEBNÎDİR, hepsi gizli fâil alır, hiçbiri hazfedilmez ve ma'mulleri önlerine geçmez. Katru'n-Nedâ'dan canlı bir netice: emir manalı isim fiile cevap olan muzâri MECZUM olur — gerçek bir emir geçmiş gibi: مَكَانَكَ تُحْمَدْ «yerinde dur — övülürsün»."},"plain":{"en":"Some words LOOK like nouns but WORK like verbs: عَلَيْكَ «hold to!», صَهْ «hush!», هَيْهَاتَ «how far-fetched!». They conjugate for nothing and no one — yet they take a fa'il like any verb.","tr":"Bazı kelimeler İSME benzer ama FİİL gibi çalışır: عَلَيْكَ «elzem tut!», صَهْ «sus!», هَيْهَاتَ «ne uzak!». Hiçbir kip ve şahıs için çekilmezler — yine de her fiil gibi fâil alırlar."},"sources":["قطر الندى (ابن هشام) — أسماء الأفعال","الكافية (ابن الحاجب) — المبنيات"],"examples":[{"ar":"وَعَلَيْكَ بِالْمُدَارَاةِ وَالصَّبْرِ.","gloss":{"en":"«Hold fast to tact and patience» — عَلَيْكَ works as the imperative «keep to», its fa'il a concealed «you», its object behind the extra بِ.","tr":"«Müdârâya ve sabra sarıl» — عَلَيْكَ, «elzem tut» emri gibi çalışır; fâili gizli «sen», mef'ûlü zâid بِ'nin ardındadır."},"src":"wasiyyat-abi-hanifa-samti"},{"ar":"هَيْهَاتَ هَيْهَاتَ لِمَا تُوعَدُونَ.","gloss":{"en":"«Far, far indeed is what you are promised» (al-Mu'minun 23:36) — a noun with a past verb's force.","tr":"«Size vaad edilen ne uzak, ne uzak!» (Mü'minûn 23:36) — mâzî fiil kuvvetinde bir isim."},"src":null}],"mistakes":[{"wrong":"صَهْ، يَصِهُ، صَاهٍ","right":"صَهْ (لَا يَتَصَرَّفُ)","why":{"en":"Noun-verbs do not conjugate — no mudari', no ism fa'il, no other person. The single frozen form IS the whole verb.","tr":"İsim fiiller çekilmez — muzârisi, ism-i fâili, başka şahsı yoktur. O tek donmuş kalıp, fiilin tamamıdır."}},{"wrong":"عَلَيْكَ بِالصَّبْرِ — جَارٌّ وَمَجْرُورٌ خَبَرٌ مُقَدَّمٌ","right":"عَلَيْكَ اسْمُ فِعْلِ أَمْرٍ، وَالْبَاءُ زَائِدَةٌ وَمَجْرُورُهَا مَفْعُولٌ بِهِ مَحَلًّا","why":{"en":"In the command reading there is no mubtada anywhere: عَلَيْكَ is itself the verb-force, and what follows the extra بِ is its object, not a subject waiting for news.","tr":"Emir okuyuşunda ortada mübteda yoktur: عَلَيْكَ bizzat fiil kuvvetidir; zâid بِ'den sonrası haber bekleyen özne değil, mef'ûlüdür."}}]},"ism-maful":{"title":{"ar":"اسْمُ الْمَفْعُولِ وَعَمَلُهُ","en":"The ism maf'ul — the done-to noun, governing like a passive verb","tr":"İsm-i mef'ûl ve ameli — meçhul fiili gibi amel eden isim"},"level":5,"group":"awamil","explanation":{"en":"The ism maf'ul names what the act landed on: مَفْعُول from the bare triliteral (مَكْتُوب «written»), and for every augmented bab the same مُ-shape as the ism fa'il but with FATHA before the end — مُخْرَج «brought out» against مُخْرِج «the one bringing out». One vowel carries the whole difference between doer and done-to. It is the second of Birgivi's qiyasi governors from this family, and it works the work of its verb IN THE PASSIVE: it raises a deputy subject (نَائِبُ الْفَاعِل), under the same two conditions as the ism fa'il — present-or-future meaning, and support to lean on. So in فَضْلٌ … مَشْرُوطٌ لِأَحَدِ الْمُتَعَاقِدَيْنِ the ism maf'ul describes فَضْل, and its deputy subject is the hidden pronoun هُوَ standing for that excess, while the لِ-phrase hangs from it exactly as it would from the verb شُرِطَ. The الـ-form governs unconditionally, read as الَّذِي with a passive verb: الْمُخْرَجُ مِنَ الْعَدَمِ is «that which was brought out from non-existence», the jarr phrase attaching as it would to أُخْرِجَ.","tr":"İsm-i mef'ûl işin üzerine indiği şeyi adlandırır: sülâsî mücerredden مَفْعُول vezn
