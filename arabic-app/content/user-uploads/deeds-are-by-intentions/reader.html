rekesini kendinden önceki sahih sâkin harfe nakleder: يَقْوُلُ → يَقُولُ; o hareke fetha ise harf elife kalbolur: يَخْوَفُ → يَخَافُ. İKİNCİ: bu nakil iki sâkini bir araya getirecekse illetli harf tamamen düşer: لَمْ يَقْوُلْ → لَمْ يَقُلْ، قَوَلْنَ → قُلْنَ. Geriye kalan hareke keyfî değildir, düşen harfe delâlet eder: و düşmüşse damme (قُلْنَ، قُمْنَ), ي düşmüşse kesre (بِعْنَ، كِلْنَ). Meçhul de aynı mantığı öbür yönden izler: قُوِلَ → قِيلَ، بُيِعَ → بِيعَ، خُوِفَ → خِيفَ. Ezberlenmesi gereken iki sınır vardır. Mezîd bablarda i'lal yalnız إِفْعَال، اِنْفِعَال، اِفْتِعَال ve اِسْتِفْعَال'de olur; فَعَّلَ، فَاعَلَ، تَفَعَّلَ، تَفَاعَلَ ve اِفْعَلَّ illetli harfi olduğu gibi korur — طَوَّلَ، طَاوَلَ، تَحَوَّلَ، تَصَوَّرَ. Ayrıca if'âl ve istif'âl masdarlarında düşen و'ın yerine sona tâ getirilir: إِقْوَام → إِقَامَة، اِسْتِقْوَام → اِسْتِقَامَة. Binâ bunları aksâm-ı seb'a içinde sayar."},"plain":{"en":"Verbs with و or ي in the middle, like قَالَ. The weak letter shortens or vanishes in some forms — which is why «he did not say» is لَمْ يَقُلْ and not لَمْ يَقُولْ.","tr":"Ortası و veya ي olan fiiller (قَالَ gibi). İllet harfi bazı sîgalarda kısalır veya düşer; «demedi» bu yüzden لَمْ يَقُلْ'dur, لَمْ يَقُولْ değil."},"sources":["بناء الأفعال — الأقسام السبعة","المقصود — الأجوف","مراح الأرواح"],"examples":[{"ar":"قَالَ لَهُ أَبُو حَنِيفَةَ.","gloss":{"en":"Abu Hanifa said to him.","tr":"Ebû Hanîfe ona dedi."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"قُلْتُ الْحَقَّ وَقَالُوا كَذِبًا.","gloss":{"en":"I spoke the truth and they spoke a lie — long and short stems side by side.","tr":"Ben doğruyu söyledim, onlar yalan söylediler — uzun ve kısa gövde yan yana."},"src":null},{"ar":"خَافَ يُونُسُ فَدَعَا رَبَّهُ.","gloss":{"en":"Yunus was afraid and called upon his Lord — خَافَ shows the fatha route: خَوِفَ → خَافَ.","tr":"Yunus korktu ve Rabbine dua etti — خَافَ fetha yolunu gösterir: خَوِفَ → خَافَ."},"src":"yunus-wa-al-hut"}],"mistakes":[{"wrong":"قَالْتُ لك","right":"قُلْتُ لك","why":{"en":"Before the consonant suffix ـتُ the long alif must shorten to damma: قُلْتُ.","tr":"ـتُ ünsüz ekinden önce uzun elif ötreye kısalmalıdır: قُلْتُ."}},{"wrong":"لم يَقُولْ شيئًا","right":"لم يَقُلْ شيئًا","why":{"en":"In the jussive after لم the long vowel shortens: لم يَقُلْ.","tr":"لم'den sonra meczumda uzun ünlü kısalır: لم يَقُلْ."}},{"wrong":"قُوِلَ الْحَقُّ","right":"قِيلَ الْحَقُّ","why":{"en":"In the passive of a hollow verb the damma before the weak letter goes and its kasra moves back: قُوِلَ → قِيلَ.","tr":"Ecvefin meçhulünde illetli harften önceki damme düşer ve kesre öne nakledilir: قُوِلَ → قِيلَ."}},{"wrong":"تَصَاوَرَ / يَتَصَاوَرُ","right":"تَصَوَّرَ / يَتَصَوَّرُ","why":{"en":"No i'lal in bab V. The و is doubled and stable there, so the verb conjugates exactly like a sound one.","tr":"Tefe'ul bâbında i'lal yoktur. و şeddeli ve sabittir, fiil sahih gibi çekilir."}},{"wrong":"إِقْوَامٌ","right":"إِقَامَةٌ","why":{"en":"The masdar of أَقَامَ loses its و and takes a ة in compensation — the same happens in اِسْتِقَامَة.","tr":"أَقَامَ'nin masdarı و'ını kaybeder ve karşılığında tâ alır; اِسْتِقَامَة'de de böyledir."}}]},"huruf-jarr-nawadir":{"title":{"ar":"نَوَادِرُ حُرُوفِ الْجَرِّ","en":"The rarer jarr letters — the tail of Birgivi's twenty","tr":"Nâdir cer harfleri — Birgivî'nin yirmisinin son sekizi"},"level":6,"group":"awamil","explanation":{"en":"The Awamil's inventory of jarr letters runs to twenty, and the tail is where each letter carries a restriction. مُذْ and مُنْذُ give jarr only to expressions of TIME — مَا رَأَيْتُهُ مُذْ يَوْمِ الْجُمُعَةِ, «I have not seen him since Friday»; before a raf' reading they are nouns instead. خَلَا, عَدَا and حَاشَا mean «except» and give jarr when bare: قَامُوا خَلَا زَيْدٍ. Put مَا in front of خَلَا or عَدَا and they turn back into verbs, and the excepted thing must take nasb — مَا خَلَا زَيْدًا. حَاشَا is the odd one out: it does not take مَا at all in the received doctrine — Ibn Malik says so in one line, وَحَاشَا لَا تَصْحَبُ مَا — and the rare مَا حَاشَا the books quote is an anomaly, not a pattern. This split is why the same names appear in the istithna chapter with the other reading. لَوْلَا counts as a jarr letter only where an attached pronoun follows it — لَوْلَايَ, لَوْلَاكَ, «if not for me / for you» — as in the poet's لَوْلَاكَ … لَمْ أَحْجُجِ; before a plain noun it is not a governor of jarr at all but the لَوْلَا of the conditional, and the noun after it stands in raf' as a mubtada. كَيْ gives jarr to one word only: the questioning مَا — its alif dropping after the jarr letter to give كَيْمَ, and in pause a هْ of rest is added: كَيْمَهْ, «what for?». And لَعَلَّ, everywhere else a sister of إِنَّ, gives jarr in the dialect of the tribe of ʿUqayl — the books quote it, and a reader of classical texts should recognise it rather than emend it. The lesson of the tail is the lesson of the whole inventory: a governor is defined by what it does and under what conditions, not by how often it occurs.","tr":"Avâmil'in cer harfleri envanteri yirmiye varır ve kuyruk kısmında her harf bir kayıtla gelir. مُذْ ve مُنْذُ yalnız ZAMAN ifadelerini cer eder — مَا رَأَيْتُهُ مُذْ يَوْمِ الْجُمُعَةِ, «Cuma'dan beri onu görmedim»; ref okunduklarında ise isimdirler. خَلَا, عَدَا ve حَاشَا «hariç» demektir ve yalnız yalın hâlde cer verir: قَامُوا خَلَا زَيْدٍ. خَلَا ile عَدَا'nın başına مَا gelince fiile dönerler ve müstesnâ nasb almak zorundadır — مَا خَلَا زَيْدًا. حَاشَا ise ayrıdır: mütevâres kaidede مَا almaz — İbn Mâlik bunu tek satırda söyler: وَحَاشَا لَا تَصْحَبُ مَا — kitapların naklettiği nadir مَا حَاشَا bir şâzdır, kaide değil. Aynı isimlerin istisna bahsinde öbür okunuşla da geçmesinin sebebi bu ikiliktir. لَوْلَا ancak bitişik zamir izlediğinde cer harfi sayılır — لَوْلَايَ, لَوْلَاكَ, «ben/sen olmasaydım» — şairin لَوْلَاكَ … لَمْ أَحْجُجِ mısraındaki gibi; açık isimden önce ise cer âmili değil şart لَوْلَا'sıdır ve sonraki isim mübteda olarak ref'te durur. كَيْ yalnız tek kelimeyi cer eder: soru مَا'sı — cer harfinden sonra elifi düşüp كَيْمَ olur; vakıfta bir sekte hâsı eklenir: كَيْمَهْ, «niçin?». لَعَلَّ ise her yerde إِنَّ'nin kardeşiyken Ukayl kabilesinin lehçesinde cer verir — kitaplar bunu nakleder; klasik metin okuyan onu düzeltmeye kalkmadan tanımalıdır. Kuyruğun dersi bütün envanterin dersidir: âmil, ne sıklıkta geçtiğiyle değil, ne yaptığı ve hangi şartla yaptığıyla tarif edilir."},"plain":{"en":"Birgivi counts twenty jarr letters. After the twelve everyday ones come eight you meet rarely — «since», «except», «if not for» — each with its own restriction.","tr":"Birgivî yirmi cer harfi sayar. Her günkü on ikisinden sonra, seyrek karşılaşılan sekizi gelir — «-den beri», «hariç», «olmasaydı» — her birinin kendi kaydı vardır."},"sources":["العوامل (البركوي) — حروف الجرّ العشرون","قطر الندى (ابن هشام)","الكافية (ابن الحاجب)"],"examples":[{"ar":"مَا رَأَيْتُهُ مُذْ يَوْمِ الْجُمُعَةِ.","gloss":{"en":"مُذْ giving jarr to a time expression — its only office as a jarr letter.","tr":"مُذْ bir zaman ifadesini cer ediyor — cer harfi olarak tek vazifesi budur."},"src":null},{"ar":"قَامُوا خَلَا زَيْدٍ — وَمَا خَلَا زَيْدًا.","gloss":{"en":"The same word both ways: bare خَلَا gives jarr; after مَا it is a verb and the excepted noun must take nasb.","tr":"Aynı kelimenin iki hâli: yalın خَلَا cer verir; مَا'dan sonra fiildir ve müstesnâ nasb almak zorundadır."},"src":null},{"ar":"لَوْلَاكَ فِي ذَا الْعَامِ لَمْ أَحْجُجِ.","gloss":{"en":"The poet's لَوْلَاكَ — the one setting where لَوْلَا is counted a jarr letter, an attached pronoun following it.","tr":"Şairin لَوْلَاكَ'i — لَوْلَا'nın cer harfi sayıldığı tek yer: ardından bitişik zamir gelmesi."},"src":null}],"mistakes":[{"wrong":"مَا خَلَا زَيْدٍ","right":"مَا خَلَا زَيْدًا — وَبِلَا «مَا»: خَلَا زَيْدٍ","why":{"en":"مَا makes خَلَا a verb, and a verb takes an object in nasb. The jarr reading exists only for the bare letter.","tr":"مَا, خَلَا'yı fiil yapar ve fiil mef'ûlünü nasb eder. Cer okunuşu yalnız yalın harf içindir."}},{"wrong":"لَوْلَا الْعِلْمِ لَهَلَكَ النَّاسُ (بِالْجَرِّ)","right":"لَوْلَا الْعِلْمُ لَهَلَكَ النَّاسُ — الِاسْمُ الظَّاهِرُ بَعْدَهَا مُبْتَدَأٌ مَرْفُوعٌ","why":{"en":"Before a plain noun لَوْلَا is the conditional, not a jarr letter; the noun stands in raf' as a mubtada with its khabar omitted. The jarr reading belongs only to the attached pronouns.","tr":"Açık isimden önce لَوْلَا şart edatıdır, cer harfi değil; isim, haberi hazfedilmiş mübteda olarak ref'te durur. Cer okunuşu yalnız bitişik zamirlere aittir."}},{"wrong":"مُذْ زَيْدٍ","right":"مُذْ يَوْمِ الْجُمُعَةِ — فَمُذْ لَا تَجُرُّ إِلَّا الزَّمَانَ","why":{"en":"مُذْ and مُنْذُ give jarr to time and to nothing else. A person or a place after them is simply wrong.","tr":"مُذْ ve مُنْذُ yalnız zamanı cer eder. Arkalarına kişi veya mekân getirmek düpedüz yanlıştır."}},{"wrong":"مَا حَاشَا زَيْدًا (قِيَاسًا عَلَى مَا خَلَا)","right":"حَاشَا زَيْدٍ — فَحَاشَا لَا تَصْحَبُ «مَا» فِي الْمُخْتَارِ","why":{"en":"The ma-rule belongs to خَلَا and عَدَا. For حَاشَا the received doctrine is the reverse — Ibn Malik: وَحَاشَا لَا تَصْحَبُ مَا — and the attested مَا حَاشَا is an anomaly the books quote, not a construction to build on.","tr":"مَا kaidesi خَلَا ile عَدَا'ya aittir. حَاشَا'da mütevâres hüküm tersinedir — İbn Mâlik: وَحَاشَا لَا تَصْحَبُ مَا — nakledilen مَا حَاشَا, üzerine bina edilecek bir yapı değil, şâzdır."}}]},"huruf-jarr":{"title":{"ar":"حُرُوف الْجَرّ","en":"Prepositions","tr":"Cer harfleri"},"level":1,"group":"awamil","explanation":{"en":"Birgivi opens the Awamil with them: مِنْ، إِلَى، عَنْ، عَلَى، فِي، بِـ، لِـ، كَـ، حَتَّى، رُبَّ، وَاو الْقَسَم، تَاء الْقَسَم … Every noun after them takes kasra (or its substitute). In this story: إِلَى مَدِينَتِهِ، إِلَى مُعَلِّمِهِ، لَهُ.","tr":"Birgivî Avâmil'e bunlarla başlar: مِنْ، إِلَى، عَنْ، عَلَى، فِي، بِـ، لِـ، كَـ، حَتَّى، رُبَّ... Bunlardan sonra gelen isim daima mecrurdur (kesre veya naibi). Hikâyede: إِلَى مَدِينَتِهِ، إِلَى مُعَلِّمِهِ، لَهُ."},"plain":{"en":"The small words — in, from, to, with — that put the noun after them into the genitive.","tr":"Kendinden sonraki ismi cer eden küçük kelimeler: -de, -den, -e, ile."},"amil":"تَجُرُّ الِاسْمَ — the largest family of governors in the Awamil: they put the noun in jarr","mamul":"majrur","sources":["عوامل البركوي — حروف الجر العشرون","الكافية (ابن الحاجب) — حروف الجر","الإظهار (البركوي)"],"question":{"tr":["Ne ile?","Ne sebebi ile?","Kim ile?","Kim sebebi ile?","Neden?","Neden dolayı?","Ne üzerine?","Kim üzerine?"],"en":["With what?","By what cause?","With whom?","Caused by whom?","From what?","Because of what?","Upon what?","Upon whom?"]},"examples":[{"ar":"أَرَادَ أَنْ يَرْجِعَ إِلَى مَدِينَتِهِ.","gloss":{"en":"…to return to his city.","tr":"…şehrine dönmek için."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"قَالَ لَهُ أَبُو حَنِيفَةَ.","gloss":{"en":"Abu Hanifa said to him.","tr":"Ebû Hanîfe ona dedi."},"src":"wasiyyat-abi-hanifa-L2"}],"mistakes":[{"wrong":"ذهبتُ إلى البيتَ","right":"ذهبتُ إلى البيتِ","why":{"en":"After a preposition the noun is majrur — kasra, never fatha.","tr":"Harf-i cerden sonra isim mecrurdur — kesre, asla fetha değil."}},{"wrong":"سلّمتُ على أبو حنيفة","right":"سلّمتُ على أبي حنيفة","why":{"en":"The five nouns show jarr with ي: على أَبِي، not على أبو.","tr":"Esma-i hamse cerri ي ile gösterir: على أَبِي، على أبو değil."}}]},"huruf-tanbih":{"title":{"ar":"حُرُوفُ التَّنْبِيهِ (أَلَا، أَمَا، هَا)","en":"The particles of alerting: أَلَا، أَمَا، هَا","tr":"Tenbih harfleri (أَلَا، أَمَا، هَا)"},"level":4,"group":"nahw","explanation":{"en":"The حُرُوفُ التَّنْبِيهِ are three: أَلَا، أَمَا، هَا. They stand at the head of the sentence (they have صَدْرُ الْكَلَامِ), alert the listener, and then leave the sentence exactly as it was — they govern nothing. أَلَا very often introduces إِنَّ: «أَلَا إِنَّ أَوْلِيَاءَ اللهِ لَا خَوْفٌ عَلَيْهِمْ». That habit of standing directly before إِنَّ is why the Ottoman amil tables print أَلَا in the same row as إِنَّ and its sisters — but the government in أَلَا إِنَّ زَيْدًا قَائِمٌ belongs wholly to إِنَّ; أَلَا only knocks on the door. هَا is the same particle seen fused in هٰذَا (هَا + ذَا). A separate أَلَا exists among the حُرُوفُ التَّحْضِيضِ (urging: «why not…?» — أَلَا تَنْزِلُ؟); context separates them: tanbih-أَلَا precedes a statement, tahdid-أَلَا precedes a verb being urged.","tr":"Tenbih harfleri üçtür: أَلَا، أَمَا، هَا. Cümlenin başında bulunurlar (sadr-ı kelâm hakları vardır), dinleyeni uyarırlar ve cümleyi olduğu gibi bırakırlar — amel etmezler. أَلَا çok defa إِنَّ'nin önünde gelir: «أَلَا إِنَّ أَوْلِيَاءَ اللهِ لَا خَوْفٌ عَلَيْهِمْ». Osmanlı avâmil cetvellerinin أَلَا'yı إِنَّ ve kardeşleriyle aynı satırda göstermesi bu alışkanlıktandır — hâlbuki أَلَا إِنَّ زَيْدًا قَائِمٌ cümlesindeki amel tamamen إِنَّ'nindir; أَلَا yalnız kapıyı çalar. هَا aynı harfin هٰذَا (هَا + ذَا) içinde bitişmiş hâlidir. Bir de tahdîd (teşvik) harfleri arasında ayrı bir أَلَا vardır («niçin…-mıyorsun?» — أَلَا تَنْزِلُ؟); ikisini bağlam ayırır: tenbih أَلَا'sı bir haberin, tahdîd أَلَا'sı teşvik edilen bir fiilin önüne gelir."},"plain":{"en":"أَلَا، أَمَا and هَا open a sentence to say «listen — what follows matters». They change no endings; they only wake the listener.","tr":"أَلَا، أَمَا ve هَا cümlenin başında «dikkat — şimdi söylenecek şey mühim» demektir. Hiçbir i'rabı değiştirmezler; sadece dinleyeni uyandırırlar."},"sources":["الكافية (ابن الحاجب) — حروف التنبيه","قطر الندى (ابن هشام)"],"examples":[{"ar":"أَلَا إِنَّ زَيْدًا قَائِمٌ.","gloss":{"en":"Listen — Zayd is indeed standing. أَلَا alerts; the nasb of زَيْدًا is إِنَّ's work alone.","tr":"Dikkat — Zeyd gerçekten ayaktadır. أَلَا uyarır; زَيْدًا'in nasbı yalnız إِنَّ'nin amelidir."},"src":null},{"ar":"أَمَا وَاللهِ لَقَدْ صَدَقَ.","gloss":{"en":"Truly, by Allah, he spoke the truth — أَمَا readies the listener for the oath.","tr":"Gerçekten, vallahi doğru söyledi — أَمَا dinleyeni yemine hazırlar."},"src":null}],"mistakes":[{"wrong":"أَلَا زَيْدًا قَائِمٌ","right":"أَلَا إِنَّ زَيْدًا قَائِمٌ","why":{"en":"أَلَا itself governs nothing, so it cannot put زيد into nasb. The amil-table row that seats الا beside إِنَّ records its habit of preceding إِنَّ, not a government of its own.","tr":"أَلَا kendisi amel etmez, زيد'i nasb edemez. Avâmil cetvelinin الا'yı إِنَّ yanına oturtması onun إِنَّ önünde gelme âdetini kaydeder, kendi amelini değil."}},{"wrong":"إِنَّ أَلَا زَيْدًا قَائِمٌ","right":"أَلَا إِنَّ زَيْدًا قَائِمٌ","why":{"en":"The tanbih particles hold the head of the sentence; nothing may precede them, least of all the very إِنَّ they introduce.","tr":"Tenbih harflerinin sadr-ı kelâm hakkı vardır; önlerine hiçbir şey geçemez — hele takdim ettikleri إِنَّ hiç geçemez."}}]},"idafa-definiteness":{"title":{"ar":"الإِضَافَة","en":"Idafa (possessive construction)","tr":"İzâfet (tamlama)"},"level":2,"group":"nahw","explanation":{"en":"Two nouns chained: the first (mudaf) never takes الـ or tanwin; the second (mudaf ilayh) is always majrur and supplies the definiteness. مُعَلِّمِهِ = مُعَلِّم + ه: \"his teacher\" — definite because of the pronoun, though مُعَلِّم itself carries no الـ. An attached pronoun (ـه، ـي…) counts as a mudaf ilayh in the position of jarr.","tr":"İki isim tamlaması: birincisi (muzaf) asla الـ ve tenvin almaz; ikincisi (muzafun ileyh) daima mecrurdur ve belirliliği sağlar. مُعَلِّمِهِ = مُعَلِّم + ه: 'onun hocası'. Bitişik zamir, cer mahallinde muzafun ileyhtir."},"plain":{"en":"Two nouns joined to mean «the X of Y». The second one decides whether the whole thing counts as definite.","tr":"«Bir şeyin bir şeyi» manasında iki ismin birleşmesi. Bütünün belirli olup olmadığını ikincisi tayin eder."},"mamul":"majrur","sources":["الكافية (ابن الحاجب) — المضاف إليه","الإظهار (البركوي) — الإضافة"],"examples":[{"ar":"ذَهَبَ إِلَى مُعَلِّمِهِ.","gloss":{"en":"He went to his teacher.","tr":"Hocasına gitti."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"اسْمَعْ وَصِيَّتِي.","gloss":{"en":"Listen to my testament (وصيّة + ي).","tr":"Vasiyetimi dinle (وصيّة + ي)."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"كِتَابُ الطَّالِبِ جَدِيدٌ.","gloss":{"en":"The student's book is new.","tr":"Talebenin kitabı yenidir."},"src":null}],"mistakes":[{"wrong":"الْكِتَابُ الطَّالِبِ","right":"كِتَابُ الطَّالِبِ","why":{"en":"The mudaf never takes الـ — definiteness flows up from the mudaf ilayh.","tr":"Muzaf asla الـ almaz — belirlilik muzafun ileyhten gelir."}},{"wrong":"كِتَابٌ الطَّالِبِ","right":"كِتَابُ الطَّالِبِ","why":{"en":"The mudaf also never takes tanwin — tanwin and idafa exclude each other.","tr":"Muzaf tenvin de almaz — tenvin ile izafet bir arada bulunmaz."}}]},"idha-shartiyya":{"title":{"ar":"إِذَا الشَّرْطِيَّة","en":"Conditional idha","tr":"إِذَا şartiyye"},"level":2,"group":"nahw","explanation":{"en":"إِذَا is an adverb of future time carrying conditional meaning (\"when/whenever\"): ظرف لما يستقبل من الزمان متضمن معنى الشرط. Unlike إِنْ, it does not put verbs in jazm in standard prose — its verb is usually a past form understood as future: إِذَا دَخَلْتَ الْبَصْرَةَ (when you enter Basra). When the answer clause is a future statement, request, or nominal sentence, it is introduced by ف: فَسَيَأْتِيكَ النَّاسُ. Ibn Hisham treats إذا at length in Qatr al-Nada.","tr":"إِذَا gelecek zaman zarfıdır ve şart anlamı taşır. إِنْ'den farklı olarak nesirde cezmetmez; fiili çoğu kez gelecek anlamlı mazidir: إِذَا دَخَلْتَ الْبَصْرَةَ. Cevap cümlesi gelecek, talep veya isim cümlesi ise ف ile bağlanır: فَسَيَأْتِيكَ النَّاسُ. İbn Hişâm Katru'n-Nedâ'da إذا'yı genişçe işler."},"plain":{"en":"«When…» — used for something you expect to happen.","tr":"«…-dığı zaman» — olması beklenen bir şey için."},"sources":["قطر الندى (ابن هشام)","الكافية (ابن الحاجب)"],"examples":[{"ar":"إِذَا دَخَلْتَ الْبَصْرَةَ فَسَيَأْتِيكَ النَّاسُ.","gloss":{"en":"When you enter Basra, the people will come to you.","tr":"Basra'ya girdiğinde insanlar sana gelecek."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"إِذَا جَاءَ نَصْرُ اللهِ وَالْفَتْحُ.","gloss":{"en":"When Allah's help and the victory come… (Quran 110:1)","tr":"Allah'ın yardımı ve fetih geldiğinde… (Nasr 110:1)"},"src":null}],"mistakes":[{"wrong":"إذا تدخلْ البصرةَ","right":"إذا دخلتَ البصرةَ","why":{"en":"Treating إذا like إنْ and jazming the verb. In prose إذا does not govern jazm; it prefers a past-tense verb with future meaning.","tr":"إذا, إنْ gibi cezmetmez; nesirde gelecek anlamlı mazi fiil tercih edilir."}},{"wrong":"إذا دخلتَ البصرةَ سيأتيك الناسُ","right":"إذا دخلتَ البصرةَ فسيأتيك الناسُ","why":{"en":"When the answer clause starts with س/سوف (or is a command or nominal sentence), it must be tied with the answer ف.","tr":"Cevap س/سوف ile, emirle veya isim cümlesiyle başlıyorsa cevap fâsı (ف) gerekir."}}]},"imperative-amr":{"title":{"ar":"فِعْل الأَمْر","en":"The Imperative (fi'l al-amr)","tr":"Emir fiili"},"level":2,"group":"sarf","explanation":{"en":"The imperative commands someone to do something. It is built from the present-tense (مضارع) stem: drop the prefix, and if the result starts with a consonant cluster, add a helping alif. From تَسْمَعُ (you listen) → اسْمَعْ (listen!). The final letter takes sukun (or drops for weak-final verbs).","tr":"Emir fiili, muzari gövdesinden yapılır: muzaraat harfi atılır, gerekirse başa hemze getirilir. تَسْمَعُ → اسْمَعْ (dinle!). Son harf cezimlenir."},"plain":{"en":"How you tell someone to do something.","tr":"Birine bir işi yapmasını söyleme şekli."},"sources":["الأمثلة المطردة — الأمر الحاضر","بناء الأفعال","المقصود — بناء الأمر"],"examples":[{"ar":"اسْمَعْ وَصِيَّتِي.","gloss":{"en":"Listen to my testament.","tr":"Vasiyetimi dinle."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"اُكْتُبْ دَرْسَكَ.","gloss":{"en":"Write your lesson.","tr":"Dersini yaz."},"src":null},{"ar":"قُلِ الْحَقَّ.","gloss":{"en":"Speak the truth. (hollow verb: قال → قُلْ)","tr":"Doğruyu söyle. (ecvef fiil: قال → قُلْ)"},"src":null}],"mistakes":[{"wrong":"اِسْمَعُ وصيتي","right":"اسْمَعْ وصيتي","why":{"en":"Learners keep the present-tense damma on the last letter. The imperative ends in sukun: اسْمَعْ, not اسمَعُ.","tr":"Öğrenciler son harfte muzarinin ötresini bırakır; emirde son harf cezimli olmalı."}},{"wrong":"أَسْمَعْ! (meaning: listen!)","right":"اسْمَعْ!","why":{"en":"Using hamzat qat' (أَ) instead of hamzat wasl (ا). أَسْمَعُ means 'I hear'. The Form-I imperative takes hamzat wasl, which drops in connected speech: يا يوسفُ اسْمَعْ.","tr":"Hemze-i kat' değil hemze-i vasl gelir; أَسْمَعُ 'duyuyorum' demektir."}},{"wrong":"اِسْمَعْ إلى وصيتي","right":"اسْمَعْ وصيتي / اِسْتَمِعْ إِلَى وصيتي","why":{"en":"Preposition transfer from English 'listen TO'. سَمِعَ takes a direct object; only اِسْتَمَعَ (Form VIII) takes إلى.","tr":"İngilizce 'listen to'dan aktarma; سمع nesneyi doğrudan alır, إلى yalnız استمع ile kullanılır."}}]},"in-shartiyya":{"title":{"ar":"إِنْ الشَّرْطِيَّة وَأَدَوَاتُ الشَّرْطِ الْجَازِمَة","en":"The conditional that puts two verbs in jazm","tr":"İki fiili cezmeden şart edatları"},"level":4,"group":"awamil","explanation":{"en":"إِنْ is the conditional particle proper, and unlike إِذَا it GOVERNS: it puts two verbs in jazm at once — the condition (فِعْلُ الشَّرْطِ) and its answer (جَوَابُ الشَّرْطِ). إِنْ طَلَبْتَ الْمَالَ … عَجَزْتَ: both are past in form, and both stand in the position of jazm even though a past verb shows nothing. With a present verb the jazm is visible: إِنْ تَطْلُبْ تَعْجِزْ. A family of NOUNS does the same work and is governed by nothing: مَنْ, مَا, مَتَى, أَيْنَ, أَيُّ, حَيْثُمَا — and, rarer but on the same list of fifteen, مَهْمَا «whatever», أَنَّى «wherever / however», and the compounds إِذْمَا and إِذَا مَا «whenever», which give jazm where bare إِذَا never does. مَنْ لَمْ يَرْحَمْ … فَلَيْسَ مِنَّا — مَنْ is a mubtada in the position of raf', and its two verbs are in jazm. Two practical points. When the answer cannot itself take jazm — a nominal sentence, a لَيْسَ, an imperative, a prohibition — it must be tied on with فَ: فَلَا تُجِبْهُ, فَلَيْسَ مِنَّا. And إِنْ differs from إِذَا in meaning as well as in government: إِذَا is for what will certainly happen and إِنْ for what may or may not, which is why «even if» is وَإِنْ and never وَإِذَا.","tr":"إِنْ asıl şart harfidir ve إِذَا'nın aksine AMEL EDER: iki fiili birden cezmeder — şart fiilini ve cevabını. إِنْ طَلَبْتَ الْمَالَ … عَجَزْتَ: ikisi de mâzi şeklindedir ve mâzi cezm alâmeti göstermese de ikisi de cezm mahallindedir. Muzâri ile cezm görünür: إِنْ تَطْلُبْ تَعْجِزْ. Aynı işi gören ve kendisi âmilsiz olan bir İSİM ailesi vardır: مَنْ، مَا، مَتَى، أَيْنَ، أَيُّ، حَيْثُمَا — ve on beşlik listenin daha nadir kalanları: مَهْمَا «her ne», أَنَّى «her nerede/nasıl», bir de yalın إِذَا'nın asla yapmadığı cezmi yapan إِذْمَا ile إِذَا مَا «her ne zaman» bileşikleri. مَنْ لَمْ يَرْحَمْ … فَلَيْسَ مِنَّا — مَنْ ref mahallinde mübtedadır, iki fiili de meczûmdur. İki amelî not: cevap kendisi cezm alamayacak bir yapıysa — isim cümlesi, لَيْسَ, emir, nehiy — فَ ile bağlanmalıdır: فَلَا تُجِبْهُ، فَلَيْسَ مِنَّا. Ayrıca إِنْ manaca da إِذَا'dan ayrılır: إِذَا kesin olacak için, إِنْ ise olabilir de olmayabilir de olan için gelir; «velev ki» ifadesinin وَإِنْ olup وَإِذَا olmamasının sebebi budur."},"plain":{"en":"«If…» — and it changes the ending of both verbs it governs.","tr":"«Eğer…» — kendisine bağlı iki fiilin de sonunu değiştirir."},"mamul":"majzum","sources":["العوامل (البيركوي) — الجوازم","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"examples":[{"ar":"فَإِنَّكَ إِنْ طَلَبْتَ الْمَالَ فِي وَقْتِ التَّعَلُّمِ عَجَزْتَ عَنْ طَلَبِ الْعِلْمِ.","gloss":{"en":"If you seek wealth while you are learning, you will fall short of seeking knowledge — two past-form verbs, both in the position of jazm.","tr":"İlim tahsili vaktinde mal talep edersen ilim talebinden âciz kalırsın — mâzi şeklinde iki fiil, ikisi de cezm mahallinde."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"مَنْ لَمْ يَرْحَمْ صَغِيرَنَا وَلَمْ يُوَقِّرْ كَبِيرَنَا فَلَيْسَ مِنَّا.","gloss":{"en":"Whoever does not show mercy to our young nor honour our old is not one of us — the answer is a لَيْسَ clause, so فَ is required.","tr":"Küçüğümüze merhamet etmeyen, büyüğümüzü saymayan bizden değildir — cevap لَيْسَ cümlesidir, bu yüzden فَ zorunludur."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"وَمَنْ دَعَاكَ مِنْ خَلْفِكَ فَلَا تُجِبْهُ.","gloss":{"en":"Whoever calls you from behind, do not answer him — a prohibition as the answer, again tied on with فَ.","tr":"Arkandan çağırana cevap verme — cevap nehiydir, yine فَ ile bağlanır."},"src":"wasiyyat-abi-yusuf-L5"}],"mistakes":[{"wrong":"إِنْ تَجْتَهِدُ تَنْجَحُ","right":"إِنْ تَجْتَهِدْ تَنْجَحْ","why":{"en":"إِنْ governs BOTH verbs. Leaving either in raf' means the condition was never built.","tr":"إِنْ İKİ fiili birden cezmeder. Birini merfû bırakmak şartı kurmamak demektir."}},{"wrong":"مَنْ يَجْتَهِدْ هُوَ نَاجِحٌ","right":"مَنْ يَجْتَهِدْ فَهُوَ نَاجِحٌ","why":{"en":"A nominal sentence cannot take jazm, so it can only serve as the answer when فَ ties it on.","tr":"İsim cümlesi cezm alamaz; ancak فَ ile bağlanırsa cevap olabilir."}},{"wrong":"إِذَا اجْتَهَدْتَ تَنْجَحْ","right":"إِذَا اجْتَهَدْتَ نَجَحْتَ / إِنْ تَجْتَهِدْ تَنْجَحْ","why":{"en":"إِذَا does not govern. Only إِنْ and the conditional nouns give jazm; إِذَا is an adverb annexed to the clause after it.","tr":"إِذَا amel etmez. Cezmi ancak إِنْ ve şart isimleri verir; إِذَا, sonrasına muzâf olan bir zarftır."}}]},"inna-am-anna":{"title":{"ar":"إِنَّ أَمْ أَنَّ؟ — كَسْرُ الْهَمْزَةِ وَفَتْحُهَا","en":"Inna or anna? Kasra and fatha of the hamza","tr":"İnne mi enne mi? Hemzenin kesri ve fethi"},"level":3,"group":"nahw","explanation":{"en":"Ibn Hisham's rule in Qatr al-Nada: the hamza takes KASRA (إِنَّ) wherever the clause cannot be traded for a masdar — at the very start of speech (إِنَّ طَرِيقَ النَّجَاةِ...), after قَالَ and the qawl family (قَالَ إِنَّ اللهَ قَادِرٌ — the saying is quoted whole, not melted down), after the oath (وَاللهِ إِنَّ...), at the head of a sila clause, and before a khabar carrying the lam (إِنَّ زَيْدًا لَقَائِمٌ). It takes FATHA (أَنَّ) wherever the clause DOES stand as a masdar in the outer sentence — as fa'il (بَلَغَنِي أَنَّكَ مُسَافِرٌ = بَلَغَنِي سَفَرُكَ), as maf'ul after verbs of knowing (عَلِمْتُ أَنَّ اللهَ قَادِرٌ = عَلِمْتُ قُدْرَةَ اللهِ), or after a jarr letter. So the learner's working test: sentence-initial → kasra; after a verb → usually fatha, EXCEPT the qawl verbs, which keep kasra because speech is reported, not nominalized. Turkish gives the fatha away: أَنَّ renders as -dığını/-diğini.","tr":"İbn Hişâm'ın Katrü'n-Nedâ'daki kaidesi: cümle bir masdarla DEĞİŞTİRİLEMİYORSA hemze KESRALIDIR (إِنَّ) — kelâmın başında (إِنَّ طَرِيقَ النَّجَاةِ...), «قَالَ» ve kavil fiillerinden sonra (قَالَ إِنَّ اللهَ قَادِرٌ — söz olduğu gibi aktarılır, masdara erimez), kasemden sonra (وَاللهِ إِنَّ...), sıla cümlesinin başında ve haberi lâm taşıyorken (إِنَّ زَيْدًا لَقَائِمٌ). Cümle dış cümleye bir MASDAR olarak yerleşiyorsa hemze FETHALIDIR (أَنَّ) — fâil olarak (بَلَغَنِي أَنَّكَ مُسَافِرٌ = بَلَغَنِي سَفَرُكَ), bilme fiillerinden sonra mef'ûl olarak (عَلِمْتُ أَنَّ اللهَ قَادِرٌ = عَلِمْتُ قُدْرَةَ اللهِ) veya cer harfinden sonra. Talebenin pratik testi: cümle başında → kesra; fiilden sonra → çoğunlukla fetha, İSTİSNASI kavil fiilleridir — onlardan sonra kesra kalır. Türkçe fethayı ele verir: أَنَّ, -dığını/-diğini diye çevrilir."},"plain":{"en":"Same particle, two vowels. Where the clause STANDS ON ITS OWN, the hamza takes kasra: إِنَّ. Where the clause can be melted into a masdar and slotted into the outer sentence, it takes fatha: أَنَّ.","tr":"Aynı harf, iki hareke. Cümle KENDİ BAŞINA duruyorsa hemze kesralıdır: إِنَّ. Cümle bir masdara dönüştürülüp dış cümleye yerleşebiliyorsa fethalıdır: أَنَّ."},"sources":["قطر الندى (ابن هشام)","مغني اللبيب (ابن هشام)","الكافية (ابن الحاجب)"],"question":{"tr":["Cümlenin başında mı? → إِنَّ","«قَالَ»den sonra mı? → إِنَّ","Masdarla değişebilir mi (-dığını / -diğini)? → أَنَّ"],"en":["At the sentence's opening? → إِنَّ","After قَالَ? → إِنَّ","Replaceable by a masdar ('that…')? → أَنَّ"]},"examples":[{"ar":"إِنَّ طَرِيقَ النَّجَاةِ هُوَ مُتَابَعَةُ أَهْلِ السُّنَّةِ وَالْجَمَاعَةِ.","gloss":{"en":"Sentence-initial — nothing before it to melt into: KASRA.","tr":"Cümle başı — öncesinde eriyeceği bir şey yok: KESRA."},"src":"aqaid-ahl-al-sunna"},{"ar":"ادَّعَى أَنَّهُ رَسُولٌ مِنَ اللهِ.","gloss":{"en":"After a verb, the clause is its maf'ul (= he claimed his being-a-messenger): FATHA.","tr":"Fiilden sonra, cümle onun mef'ûlüdür (= rasûl olduğunu iddia etti): FETHA."},"src":"aqaid-ahl-al-sunna"},{"ar":"قَالَ زَيْدٌ إِنَّ اللهَ قَادِرٌ عَلَى كُلِّ شَيْءٍ.","gloss":{"en":"After قَالَ the hamza keeps KASRA — the saying is quoted whole; the books except the qawl verbs from the after-a-verb fatha.","tr":"«قَالَ»den sonra hemze KESRALI kalır — söz olduğu gibi nakledilir; kitaplar kavil fiillerini fiilden-sonra-fetha kaidesinden istisna eder."},"src":null}],"mistakes":[{"wrong":"عَلِمْتُ إِنَّ اللهَ قَادِرٌ","right":"عَلِمْتُ أَنَّ اللهَ قَادِرٌ","why":{"en":"After عَلِمَ the clause stands as the verb's object — a masdar in disguise (= I knew Allah's ability) — so the hamza opens: أَنَّ.","tr":"«عَلِمَ»den sonra cümle, fiilin mef'ûlü yerindedir — gizli bir masdardır (= Allah'ın kudretini bildim) — bu yüzden hemze fethalanır: أَنَّ."}},{"wrong":"قَالَ زَيْدٌ أَنَّ اللهَ قَادِرٌ","right":"قَالَ زَيْدٌ إِنَّ اللهَ قَادِرٌ","why":{"en":"After most verbs the fatha test works (علم أنّ، بلغ أنّ) — but قَالَ reports speech as speech. A quoted sentence opens fresh, so its hamza is sentence-initial kasra. Fatha after قال is allowed only when قال means ظنّ ('to reckon'), as some Arabs use it.","tr":"Çoğu fiilden sonra fetha testi işler (علم أنّ، بلغ أنّ) — fakat قَالَ sözü söz olarak aktarır. Nakledilen cümle yeniden başlar; hemzesi cümle-başı kesrasıdır. قال'den sonra fetha ancak قال «zannetmek» manasına geldiğinde caizdir."}}]},"inna-wa-akhawatuha":{"title":{"ar":"إِنَّ وَأَخَوَاتُهَا","en":"Inna and its sisters","tr":"إِنَّ ve kardeşleri"},"level":2,"group":"awamil","explanation":{"en":"The six particles resembling verbs (الحروف المشبهة بالفعل): إِنَّ، أَنَّ، كَأَنَّ، لَكِنَّ، لَيْتَ، لَعَلَّ. They enter a nominal sentence and reverse كان's work: the subject (now the ism) takes nasb, the predicate (khabar) stays in raf'. In this story: إِنَّ الْعِلْمَ أَمَانَةٌ — knowledge (nasb) is a trust (raf'). Birgivi counts them among the strongest of the sixty governors; Ibn Hisham devotes a chapter of Qatr al-Nada to them.","tr":"Fiile benzeyen altı harf: إِنَّ، أَنَّ، كَأَنَّ، لَكِنَّ، لَيْتَ، لَعَلَّ. İsim cümlesine girer, ismini nasbeder, haberini ref eder. Hikâyede: إِنَّ الْعِلْمَ أَمَانَةٌ — ilim (mansub) bir emanettir (merfu). Birgivî bunları avâmilin en güçlülerinden sayar; İbn Hişâm Katru'n-Nedâ'da ayrı bab ayırır."},"plain":{"en":"إِنَّ and its family put the topic in the accusative and leave the predicate alone — the mirror image of كَانَ.","tr":"إِنَّ ve kardeşleri mübtedayı nasb eder, haberi olduğu gibi bırakır — كَانَ'nin tam tersi."},"amil":"تَنْصِبُ الِاسْمَ وَتَرْفَعُ الْخَبَرَ — governors that put the subject in nasb and keep the predicate in raf'","mamul":"marfu","sources":["العوامل (البيركوي)","إظهار الأسرار (البيركوي)","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"question":{"tr":["Nedir? Kimdir?","Ne iledir? Nerededir?"],"en":["What is it? Who is it?","With what — or where — is it?"]},"examples":[{"ar":"إِنَّ الْعِلْمَ أَمَانَةٌ.","gloss":{"en":"Indeed knowledge is a trust.","tr":"Muhakkak ilim bir emanettir."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"وَإِنَّ النَّاسَ يَنْظُرُونَ إِلَيْكَ.","gloss":{"en":"And people are watching you — the khabar can be a whole verbal clause.","tr":"Ve insanlar seni gözetliyor — haber tam bir fiil cümlesi olabilir."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"لَعَلَّ الطَّالِبَ نَاجِحٌ.","gloss":{"en":"Perhaps the student will succeed.","tr":"Umulur ki talebe başarır."},"src":null}],"mistakes":[{"wrong":"إنّ العلمُ أمانةٌ","right":"إنّ العلمَ أمانةٌ","why":{"en":"The ism of إنّ must be mansub — learners keep the mubtada's damma out of habit.","tr":"إنّ'nin ismi mansub olmalıdır — mübtedanın ötresi alışkanlıkla bırakılıyor."}},{"wrong":"إنّ العلمَ أمانةً","right":"إنّ العلمَ أمانةٌ","why":{"en":"Over-correction: only the ism takes nasb; the khabar stays marfu'. Double nasb is the classic second-stage error.","tr":"Aşırı düzeltme: yalnız isim nasb alır; haber merfu kalır. Çift nasb klasik ikinci aşama hatasıdır."}},{"wrong":"إنّ يذهبُ الطالبُ","right":"إنّ الطالبَ يذهبُ","why":{"en":"إنّ enters nominal sentences — a noun must follow it, never a verb directly.","tr":"إنّ isim cümlesine girer — hemen ardından fiil gelmez; önce isim gelmelidir."}}]},"innama-kaffa":{"title":{"ar":"إِنَّمَا الْكَافَّة وَالْمَكْفُوفَة","en":"innama — restriction (kaffa wa-makfufa)","tr":"إِنَّمَا — kâffe ve mekfûfe (hasr)"},"level":3,"group":"awamil","explanation":{"en":"When ما attaches to إِنَّ, the compound إِنَّمَا loses inna's governing power (the ما is called kaffa, 'the restrainer', and inna is makfufa, 'restrained'): no ism in nasb, no khabar — the sentence after it is an ordinary nominal sentence with both parts in raf'. In exchange, إنما adds the meaning of restriction (hasr): 'only, nothing but'. In the hadith: إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ — deeds are ONLY by intentions, with الأعمال in plain raf' as mubtada.","tr":"ما, إِنَّ'ye bitişince إِنَّمَا bileşiği إنّ'nin amelini kaybeder (bu ما'ya kâffe 'engelleyici', إنّ'ye mekfûfe denir): mansub isim ve haber kalmaz — sonrası mübteda ve haberi merfu, sıradan bir isim cümlesidir. Buna karşılık إنما hasr ('ancak, yalnızca') anlamı katar. Hadiste: إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ — ameller ANCAK niyetlere göredir; الأعمال merfu mübtedadır."},"plain":{"en":"In إِنَّمَا the ما strips إِنَّ of its power and adds the meaning «only».","tr":"إِنَّمَا'da ما, إِنَّ'nin amelini keser ve «ancak» manasını katar."},"amil":"كَفَّتْ مَا إِنَّ عَنِ الْعَمَلِ — the attached ما neutralizes inna's government; the sentence returns to plain mubtada + khabar","sources":["الكافية (ابن الحاجب)","قطر الندى (ابن هشام)","إظهار الأسرار (البيركوي)"],"examples":[{"ar":"إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ.","gloss":{"en":"Deeds are only by intentions. (hadith)","tr":"Ameller ancak niyetlerledir. (hadis)"},"src":"deeds-are-by-intentions"},{"ar":"إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ.","gloss":{"en":"The believers are but brothers. (Quran 49:10)","tr":"Müminler ancak kardeştir. (Hucurât 49:10)"},"src":null},{"ar":"إِنَّ الْعِلْمَ أَمَانَةٌ / إِنَّمَا الْعِلْمُ أَمَانَةٌ.","gloss":{"en":"Contrast: with إنّ the noun is mansub; with إنما it returns to raf'.","tr":"Mukayese: إنّ ile isim mansub olur; إنما ile ref'e döner."},"src":null}],"mistakes":[{"wrong":"إنما الأعمالَ بالنيات","right":"إنما الأعمالُ بالنيات","why":{"en":"Keeping inna's nasb after إنما. The kaffa ما cancels the government — the noun goes back to raf'.","tr":"إنما'dan sonra إنّ'nin nasbını sürdürmek yanlıştır. Kâffe ما ameli düşürür — isim ref'e döner."}},{"wrong":"إنما تفعلُه حسنٌ (بمعنى: الذي تفعله)","right":"إنَّ ما تفعلُه حسنٌ","why":{"en":"Confusing fused إنما (restriction) with separate إنَّ + ما الموصولة ('that which'). When ما means 'what/that which', write it separately and inna keeps its government.","tr":"Bitişik إنما (hasr) ile ayrı إنَّ + ism-i mevsul ما ('şey ki') karıştırılıyor. ما 'şey' anlamındaysa ayrı yazılır ve إنّ ameline devam eder."}}]},"ism-fail":{"title":{"ar":"اسْمُ الْفَاعِلِ وَعَمَلُهُ","en":"The ism fa'il — a doer-noun that governs like its verb","tr":"İsm-i fâil ve ameli — fiili gibi amel eden isim"},"level":5,"group":"awamil","explanation":{"en":"The ism fa'il names the one doing the act: فَاعِل from the bare triliteral (شَاكِر «thanking», خَالِص «pure»), and for every augmented bab the mudari' shape with مُ and a kasra before the end — مُوَدِّع from وَدَّعَ, مُخْلِص from أَخْلَصَ. Birgivi counts it among the nine QIYASI governors, and the Kafiya states the terms of its amal: it works the work of its verb — raising a doer, and if the verb is transitive putting an object in nasb — on two conditions. It must carry the meaning of the present or the future, not the past; and it must LEAN (اِعْتِمَاد) on something before it: a negation, a question, a mubtada it serves as khabar, or a noun it describes or accompanies as hal. So in عَامِلًا بِوَصِيَّةِ إِمَامِهِ the ism fa'il, standing as hal, still reaches its object through the بِ exactly as the verb عَمِلَ بِ would. With الـ in front (الضَّارِبُ) it governs unconditionally, because the tradition reads it there as standing for a relative clause: الَّذِي يَضْرِبُ. Where both conditions fail — a past-meaning doer with no support — the amal is gone and the construction falls back to idafa: ضَارِبُ زَيْدٍ أَمْسِ, with jarr, not nasb.","tr":"İsm-i fâil işi yapanı adlandırır: sülâsî mücerredden فَاعِل vezni (شَاكِر «şükreden», خَالِص «hâlis»), mezîd bâbların hepsinden ise muzâri şekli başında مُ ve sondan önce kesre ile — وَدَّعَ'dan مُوَدِّع, أَخْلَصَ'dan مُخْلِص. Birgivî onu dokuz KIYASÎ âmilden sayar; Kâfiye amelinin şartlarını söyler: fiilinin amelini yapar — fâilini ref eder, fiili müteaddî ise mef'ûlünü nasb eder — iki şartla. Manası hâl veya istikbâl olmalı, mâzî olmamalı; ve kendinden önce bir şeye DAYANMALI (i'timâd): bir nefiy, bir istifham, haberi olduğu bir mübteda, yahut sıfatı veya hâli olduğu bir isim. عَامِلًا بِوَصِيَّةِ إِمَامِهِ'de hâl olarak duran ism-i fâil, mef'ûlüne بِ üzerinden tıpkı عَمِلَ بِ fiili gibi ulaşır. Başında الـ varsa (الضَّارِبُ) kayıtsız şartsız amel eder; çünkü gelenek onu orada bir sıla hükmünde okur: الَّذِي يَضْرِبُ. İki şart da düşerse — dayanaksız, mâzî manalı bir fâil ismi — amel gider ve terkip izafete döner: ضَارِبُ زَيْدٍ أَمْسِ, nasb ile değil cer ile."},"plain":{"en":"The noun for the one doing the action — «striking», «thanking» — and it can take a subject and an object exactly as its verb would.","tr":"İşi yapanın ismi — «vuran», «şükreden» — ve tıpkı fiili gibi fâil ve mef'ûl alabilir."},"sources":["الكافية (ابن الحاجب) — اسم الفاعل","العوامل (البركوي) — العامل القياسي","قطر الندى (ابن هشام)"],"examples":[{"ar":"فَخَرَجَ يُوسُفُ مِنْ عِنْدِهِ شَاكِرًا عَامِلًا بِوَصِيَّةِ إِمَامِهِ.","gloss":{"en":"Two doer-nouns as hal, and the second still governs: عَامِلًا reaches its object through بِ exactly as the verb عَمِلَ would.","tr":"Hâl olarak iki ism-i fâil; ikincisi amel etmeye devam eder: عَامِلًا, mef'ûlüne tıpkı عَمِلَ fiili gibi بِ ile ulaşır."},"src":"wasiyyat-abi-hanifa-L4"},{"ar":"مَنْ قَالَ … خَالِصًا وَمُخْلِصًا دَخَلَ الْجَنَّةَ.","gloss":{"en":"The bare-bab shape beside the augmented one in a single breath: خَالِص is فَاعِل from خَلَصَ, and مُخْلِص is the mim-shape from أَخْلَصَ.","tr":"Mücerred vezinle mezîd vezin yan yana: خَالِص, خَلَصَ'dan فَاعِل; مُخْلِص ise أَخْلَصَ'dan mimli şekildir."},"src":"aqaid-ahl-al-sunna"},{"ar":"أَتَى أَبَا حَنِيفَةَ مُوَدِّعًا.","gloss":{"en":"The Form II doer-noun as hal — «he came to bid farewell», the ism fa'il carrying the still-unfolding act.","tr":"Tef'îl bâbının ism-i fâili hâl olarak — «vedalaşmak üzere geldi»; ism-i fâil henüz sürmekte olan işi taşır."},"src":"wasiyyat-abi-hanifa-L4"}],"mistakes":[{"wrong":"هٰذَا ضَارِبٌ زَيْدًا أَمْسِ","right":"هٰذَا ضَارِبُ زَيْدٍ أَمْسِ","why":{"en":"With past meaning the ism fa'il loses its amal. The object can no longer stand in nasb; the construction becomes an idafa and the noun takes jarr.","tr":"Mâzî manasında ism-i fâilin ameli düşer. Mef'ûl artık nasb alamaz; terkip izafete döner ve isim cer olur."}},{"wrong":"كُلُّ اسْمِ فَاعِلٍ يَعْمَلُ أَيْنَمَا وَقَعَ","right":"يَعْمَلُ بِشَرْطَيْنِ: مَعْنَى الْحَالِ أَوِ الِاسْتِقْبَالِ، وَالِاعْتِمَادُ — إِلَّا الْمُحَلَّى بِالـ","why":{"en":"The amal is conditional: present-or-future meaning, and support from a negation, question, mubtada or described noun. Only the الـ-form governs unconditionally, being read as الَّذِي with its verb.","tr":"Amel şartlıdır: hâl-istikbâl manası ve nefiy, istifham, mübteda yahut mevsûfa i'timâd. Yalnız الـ'lı şekil kayıtsız amel eder; çünkü الَّذِي ve fiili hükmünde okunur."}},{"wrong":"حَسَنٌ = اسْمُ فَاعِلٍ","right":"حَسَنٌ صِفَةٌ مُشَبَّهَةٌ، وَضَارِبٌ اسْمُ فَاعِلٍ","why":{"en":"The ism fa'il names an act in motion; the sifa mushabbaha names a settled quality. The two govern differently, which is why the books keep them apart.","tr":"İsm-i fâil süren bir işi, sıfat-ı müşebbehe yerleşik bir vasfı adlandırır. Amelleri de farklıdır; kitapların onları ayrı tutmasının sebebi budur."}}]},"ism-fil":{"title":{"ar":"أَسْمَاءُ الْأَفْعَالِ","en":"Noun-verbs (asma' al-af'al)","tr":"İsim fiiller (esmâ-i ef'âl)"},"level":5,"group":"nahw","explanation":{"en":"The أَسْمَاءُ الْأَفْعَالِ carry a verb's meaning and government in a noun's clothing. Three tenses: هَيْهَاتَ = بَعُدَ (a past: «it is far indeed»), أُفٍّ = أَتَضَجَّرُ (a present: «ugh»), and the largest family are commands — صَهْ = اُسْكُتْ, مَهْ = اِنْكَفِفْ, رُوَيْدَ = أَمْهِلْ, دُونَكَ = خُذْ, and عَلَيْكَ = اِلْزَمْ, whose object routinely arrives through an extra بِ: عَلَيْكَ بِالصَّبْرِ «hold fast to patience» — majrur in form, its position that of a maf'ul bih. All of them are MABNI, all take a concealed fa'il, none may be omitted, and their ma'mul does not precede them. One live consequence from Qatr al-Nada: a mudari' answering a noun-verb of command is in JAZM, exactly as if a true imperative had preceded — مَكَانَكَ تُحْمَدْ «stay put — you will be praised».","tr":"أَسْمَاءُ الْأَفْعَالِ, isim kılığında fiil manası ve ameli taşır. Üç zamanı vardır: هَيْهَاتَ = بَعُدَ (mâzî: «ne kadar uzak»), أُفٍّ = أَتَضَجَّرُ (muzâri: «of!»), en kalabalık aile ise emirlerdir — صَهْ = اُسْكُتْ, مَهْ = vazgeç, رُوَيْدَ = mühlet ver, دُونَكَ = al, ve عَلَيْكَ = اِلْزَمْ; mef'ûlü çoğu zaman zâid بِ ile gelir: عَلَيْكَ بِالصَّبْرِ «sabra sarıl» — lafzen mecrûr, mahallen mef'ûlün bih. Hepsi MEBNÎDİR, hepsi gizli fâil alır, hiçbiri hazfedilmez ve ma'mulleri önlerine geçmez. Katru'n-Nedâ'dan canlı bir netice: emir manalı isim fiile cevap olan muzâri MECZUM olur — gerçek bir emir geçmiş gibi: مَكَانَكَ تُحْمَدْ «yerinde dur — övülürsün»."},"plain":{"en":"Some words LOOK like nouns but WORK like verbs: عَلَيْكَ «hold to!», صَهْ «hush!», هَيْهَاتَ «how far-fetched!». They conjugate for nothing and no one — yet they take a fa'il like any verb.","tr":"Bazı kelimeler İSME benzer ama FİİL gibi çalışır: عَلَيْكَ «elzem tut!», صَهْ «sus!», هَيْهَاتَ «ne uzak!». Hiçbir kip ve şahıs için çekilmezler — yine de her fiil gibi fâil alırlar."},"sources":["قطر الندى (ابن هشام) — أسماء الأفعال","الكافية (ابن الحاجب) — المبنيات"],"examples":[{"ar":"وَعَلَيْكَ بِالْمُدَارَاةِ وَالصَّبْرِ.","gloss":{"en":"«Hold fast to tact and patience» — عَلَيْكَ works as the imperative «keep to», its fa'il a concealed «you», its object behind the extra بِ.","tr":"«Müdârâya ve sabra sarıl» — عَلَيْكَ, «elzem tut» emri gibi çalışır; fâili gizli «sen», mef'ûlü zâid بِ'nin ardındadır."},"src":"wasiyyat-abi-hanifa-samti"},{"ar":"هَيْهَاتَ هَيْهَاتَ لِمَا تُوعَدُونَ.","gloss":{"en":"«Far, far indeed is what you are promised» (al-Mu'minun 23:36) — a noun with a past verb's force.","tr":"«Size vaad edilen ne uzak, ne uzak!» (Mü'minûn 23:36) — mâzî fiil kuvvetinde bir isim."},"src":null}],"mistakes":[{"wrong":"صَهْ، يَصِهُ، صَاهٍ","right":"صَهْ (لَا يَتَصَرَّفُ)","why":{"en":"Noun-verbs do not conjugate — no mudari', no ism fa'il, no other person. The single frozen form IS the whole verb.","tr":"İsim fiiller çekilmez — muzârisi, ism-i fâili, başka şahsı yoktur. O tek donmuş kalıp, fiilin tamamıdır."}},{"wrong":"عَلَيْكَ بِالصَّبْرِ — جَارٌّ وَمَجْرُورٌ خَبَرٌ مُقَدَّمٌ","right":"عَلَيْكَ اسْمُ فِعْلِ أَمْرٍ، وَالْبَاءُ زَائِدَةٌ وَمَجْرُورُهَا مَفْعُولٌ بِهِ مَحَلًّا","why":{"en":"In the command reading there is no mubtada anywhere: عَلَيْكَ is itself the verb-force, and what follows the extra بِ is its object, not a subject waiting for news.","tr":"Emir okuyuşunda ortada mübteda yoktur: عَلَيْكَ bizzat fiil kuvvetidir; zâid بِ'den sonrası haber bekleyen özne değil, mef'ûlüdür."}}]},"ism-maful":{"title":{"ar":"اسْمُ الْمَفْعُولِ وَعَمَلُهُ","en":"The ism maf'ul — the done-to noun, governing like a passive verb","tr":"İsm-i mef'ûl ve ameli — meçhul fiili gibi amel eden isim"},"level":5,"group":"awamil","explanation":{"en":"The ism maf'ul names what the act landed on: مَفْعُول from the bare triliteral (مَكْتُوب «written»), and for every augmented bab the same مُ-shape as the ism fa'il but with FATHA before the end — مُخْرَج «brought out» against مُخْرِج «the one bringing out». One vowel carries the whole difference between doer and done-to. It is the second of Birgivi's qiyasi governors from this family, and it works the work of its verb IN THE PASSIVE: it raises a deputy subject (نَائِبُ الْفَاعِل), under the same two conditions as the ism fa'il — present-or-future meaning, and support to lean on. So in فَضْلٌ … مَشْرُوطٌ لِأَحَدِ الْمُتَعَاقِدَيْنِ the ism maf'ul describes فَضْل, and its deputy subject is the hidden pronoun هُوَ standing for that excess, while the لِ-phrase hangs from it exactly as it would from the verb شُرِطَ. The الـ-form governs unconditionally, read as الَّذِي with a passive verb: الْمُخْرَجُ مِنَ الْعَدَمِ is «that which was brought out from non-existence», the jarr phrase attaching as it would to أُخْرِجَ.","tr":"İsm-i mef'ûl işin üzerine indiği şeyi adlandırır: sülâsî mücerredden مَفْعُول vezni (مَكْتُوب «yazılmış»), mezîd bâbların hepsinden ise ism-i fâille aynı مُ'lu şekil, fakat sondan önce FETHA ile — مُخْرَج «çıkarılan», مُخْرِج «çıkaran» karşısında. Yapanla yapılan arasındaki bütün farkı tek hareke taşır. Birgivî'nin bu aileden saydığı ikinci kıyasî âmildir ve fiilinin amelini MEÇHUL olarak yapar: nâib-i fâil ref eder — ism-i fâille aynı iki şartla: hâl-istikbâl manası ve i'timâd. فَضْلٌ … مَشْرُوطٌ لِأَحَدِ الْمُتَعَاقِدَيْنِ'de ism-i mef'ûl فَضْل'i vasıflar; nâib-i fâili o fazlalığa dönen gizli هُوَ zamiridir ve لِ'li ifade ona tıpkı شُرِطَ fiiline asılır gibi asılır. الـ'lı şekil kayıtsız amel eder; meçhul fiilli bir الَّذِي hükmünde okunur: الْمُخْرَجُ مِنَ الْعَدَمِ «yokluktan çıkarılmış olan» demektir; câr-mecrûr ona أُخْرِجَ fiiline bağlanır gibi bağlanır."},"plain":{"en":"The noun for what the action was done to — «written», «stipulated» — and it takes a deputy subject exactly as a passive verb would.","tr":"İşin kendisine yapıldığını bildiren isim — «yazılmış», «şart koşulmuş» — ve tıpkı meçhul fiil gibi nâib-i fâil alır."},"sources":["الكافية (ابن الحاجب) — اسم المفعول","العوامل (البركوي) — العامل القياسي","قطر الندى (ابن هشام)"],"examples":[{"ar":"وَالْمُحْدَثُ هُوَ الْمُخْرَجُ مِنَ الْعَدَمِ إِلَى الْوُجُودِ.","gloss":{"en":"The الـ-form governing unconditionally: الْمُخْرَج is the ism maf'ul of أَخْرَجَ, and the two jarr phrases attach to it exactly as they would to the passive verb أُخْرِجَ.","tr":"Kayıtsız amel eden الـ'lı şekil: الْمُخْرَج, أَخْرَجَ'nın ism-i mef'ûlüdür ve iki câr-mecrûr ona tıpkı meçhul أُخْرِجَ fiiline bağlanır gibi bağlanır."},"src":"aqaid-ahl-al-sunna"},{"ar":"وَالرِّبَا فَضْلٌ خَالٍ عَنْ عِوَضٍ مَشْرُوطٌ لِأَحَدِ الْمُتَعَاقِدَيْنِ.","gloss":{"en":"مَشْرُوط as an adjective still does its verb's passive work: its deputy subject is the hidden pronoun, and the لِ-phrase hangs from it as from شُرِطَ.","tr":"Sıfat olan مَشْرُوط, fiilinin meçhul amelini yapmayı sürdürür: nâib-i fâili gizli zamirdir; لِ'li ifade ona شُرِطَ'ye asılır gibi asılır."},"src":"kitab-al-buyu"},{"ar":"مُخْرِجٌ / مُخْرَجٌ.","gloss":{"en":"The pair that trains the eye: kasra before the end is the doer, fatha the done-to. Every augmented bab makes both the same way.","tr":"Gözü eğiten çift: sondan önce kesre yapan, fetha yapılandır. Her mezîd bâb ikisini de aynı yolla kurar."},"src":null}],"mistakes":[{"wrong":"الْمُخْرِجُ مِنَ الْعَدَمِ (بِالْكَسْرِ) بِمَعْنَى مَا أُخْرِجَ","right":"الْمُخْرَجُ (بِالْفَتْحِ) — فَالْكَسْرُ لِلْفَاعِلِ وَالْفَتْحُ لِلْمَفْعُولِ","why":{"en":"In the augmented babs one vowel separates the bringer-out from the brought-out. Reading the kasra where the sense needs the fatha turns the created thing into its own creator.","tr":"Mezîd bâblarda çıkaranla çıkarılanı tek hareke ayırır. Mana fetha isterken kesre okumak, yaratılmışı kendi yaratıcısı hâline getirir."}},{"wrong":"اسْمُ الْمَفْعُولِ يَنْصِبُ مَفْعُولًا بِهِ","right":"يَرْفَعُ نَائِبَ فَاعِلٍ، كَفِعْلِهِ الْمَبْنِيِّ لِلْمَجْهُولِ","why":{"en":"Its verb-work is the passive's: the thing acted on has moved into the subject's place, so there is a deputy subject in raf', not an object in nasb.","tr":"Ameli meçhul fiilinkidir: iş yapılan şey fâilin yerine geçmiştir; nasb edilen mef'ûl değil, ref edilen nâib-i fâil vardır."}},{"wrong":"مَفْعُولٌ وَزْنُ اسْمِ الْمَفْعُولِ مِنْ كُلِّ فِعْلٍ","right":"مَفْعُولٌ لِلثُّلَاثِيِّ الْمُجَرَّدِ فَقَطْ؛ وَلِلْمَزِيدِ صِيغَةُ الْمُضَارِعِ بِمِيمٍ وَفَتْحٍ","why":{"en":"*مَخْرُوج from أَخْرَجَ is the classic slip. The مَفْعُول pattern serves only the bare triliteral; the augmented babs build on the mudari' with مُ and fatha: مُخْرَج.","tr":"أَخْرَجَ'dan *مَخْرُوج üretmek klasik hatadır. مَفْعُول vezni yalnız sülâsî mücerrede aittir; mezîd bâblar muzâriden مُ ve fetha ile kurar: مُخْرَج."}}]},"ism-maqsur-manqus":{"title":{"ar":"الِاسْمُ الْمَقْصُورُ وَالْمَنْقُوص","en":"Nouns ending in a weak letter","tr":"İsm-i maksûr ve mankûs"},"level":5,"group":"nahw","explanation":{"en":"Two classes of noun cannot carry their case vowel where you expect it. The MAQSUR ends in a fixed alif — مَعْنًى, هُدًى, مُصْطَفَى. No vowel can sit on an alif, so all three cases are مُقَدَّر, implied: raf', nasb and jarr look identical and only the governor tells you which one you have. The MANQUS ends in an unstressed ي — الْمُدَّعِي, الْقَاضِي, الرَّامِي. Here raf' and jarr are implied on the ي, but NASB appears normally: رَأَيْتُ الْقَاضِيَ, with a visible fatha. That asymmetry is the whole point of learning the pair. One further habit of the manqus: when it is indefinite and not in nasb, the ي is dropped and tanwin takes its place — قَاضٍ, مُدَّعٍ, رَامٍ; the ي returns with ال or in idafa.","tr":"İki isim sınıfı, i'rab harekesini beklendiği yerde taşıyamaz. MAKSÛR, sabit bir elif ile biter: مَعْنًى، هُدًى، مُصْطَفَى. Elif üzerine hareke gelemediği için üç i'rab da takdîrîdir; ref, nasb ve cer aynı görünür ve hangisi olduğunu ancak âmil gösterir. MANKÛS ise harekesiz bir yâ ile biter: الْمُدَّعِي، الْقَاضِي، الرَّامِي. Burada ref ve cer yâ üzerinde takdîrîdir, fakat NASB açıkça görünür: رَأَيْتُ الْقَاضِيَ, fetha zâhirdir. Bu ikisini birlikte öğrenmenin asıl sebebi bu farktır. Mankûsun bir âdeti daha vardır: nekre olup nasb hâlinde değilken yâ düşer ve yerine tenvin gelir — قَاضٍ، مُدَّعٍ، رَامٍ; ال ile veya izafette yâ geri döner."},"plain":{"en":"Nouns ending in a weak letter that cannot carry a case vowel, so all three cases look identical and only the governor tells you which one it is.","tr":"Sonu illet harfiyle biten ve hareke taşıyamayan isimler; üç i'rab da aynı görünür, hangisi olduğunu ancak âmil söyler."},"sources":["الكافية (ابن الحاجب)","مراح الأرواح","قطر الندى (ابن هشام)"],"examples":[{"ar":"وَالْإِلْهَامُ إِلْقَاءُ مَعْنًى فِي الْقَلْبِ.","gloss":{"en":"…the casting of a meaning into the heart — مَعْنًى is a mudaf ilayh in jarr with an implied kasra.","tr":"…kalbe bir mananın bırakılması — مَعْنًى takdîrî kesre ile mecrûr muzâfun ileyhtir."},"src":"aqaid-ahl-al-sunna"},{"ar":"الْبَيِّنَةُ لِلْمُدَّعِي.","gloss":{"en":"The proof is on the claimant — a manqus in jarr, the kasra implied on the ي.","tr":"Beyyine davacıya aittir — cer hâlinde mankûs, kesre yâ üzerinde takdîrîdir."},"src":"aqaid-ahl-al-sunna"},{"ar":"الْعَالَمُ مَا سِوَى اللهِ تَعَالَى.","gloss":{"en":"…what is other than Allah — سِوَى is a maqsur adverb in nasb with an implied fatha.","tr":"…Allah'ın dışındaki — سِوَى takdîrî fetha ile mansub maksûr zarftır."},"src":null}],"mistakes":[{"wrong":"رَأَيْتُ الْقَاضِي","right":"رَأَيْتُ الْقَاضِيَ","why":{"en":"The manqus is the one weak-ended noun that DOES show nasb. Leaving the ي bare hides the only case it can display.","tr":"Mankûs, nasbı gösteren tek illetli isimdir. Yâyı harekesiz bırakmak, gösterebildiği tek i'rabı gizler."}},{"wrong":"جَاءَ قَاضِي","right":"جَاءَ قَاضٍ","why":{"en":"An indefinite manqus in raf' or jarr drops its ي and takes tanwin instead.","tr":"Nekre mankûs, ref ve cer hâlinde yâsını düşürür ve yerine tenvin alır."}},{"wrong":"رَأَيْتُ الْفَتَى — بِفَتْحَةٍ ظَاهِرَةٍ","right":"الْفَتَى مَنْصُوبٌ بِفَتْحَةٍ مُقَدَّرَةٍ عَلَى الْأَلِفِ لِلتَّعَذُّرِ","why":{"en":"A maqsur shows nothing at all. Writing a fatha on the alif is not possible — the case is implied in every position.","tr":"Maksûr hiçbir i'rabı göstermez. Elif üzerine fetha yazılamaz; her hâlde i'rab takdîrîdir."}}]},"ism-mawsul":{"title":{"ar":"الِاسْمُ الْمَوْصُولُ وَصِلَتُهُ","en":"The relative noun and its clause","tr":"İsm-i mevsûl ve sılası"},"level":4,"group":"nahw","explanation":{"en":"A relative noun — اَلَّذِي, اَلَّتِي, مَنْ (for people), مَا (for things) — is a definite noun that cannot stand on its own. It needs a clause after it, the صِلَة, and that clause must contain a pronoun pointing back at it, the عَائِد. All three parts count as one noun for i'rab: «الْجُزْءُ الَّذِي لَا يَتَجَزَّى» is one thing, «the part that admits of no division». Two consequences fall out of this. First, the sila itself has NO case position (لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ) — you never i'rab it as subject or object of anything; it belongs to the relative. Second, the relative noun is مَبْنِيّ: اَلَّذِي and مَنْ never change their ending, so you say «in the position of raf'» rather than «in raf'». Drop the ‘aid and the sentence collapses — «مَا يُعْلَمُ بِهِ الصَّانِعُ» needs that بِهِ to tie the clause back to مَا.","tr":"İsm-i mevsûl — اَلَّذِي، اَلَّتِي، مَنْ (âkil için), مَا (gayr-i âkil için) — tek başına anlam vermeyen marife isimdir. Kendisinden sonra bir cümleye, yani sılaya muhtaçtır; o cümlede de mevsûle dönen bir zamir, âid bulunmalıdır. Üçü birlikte i'rab bakımından tek bir isim sayılır: «الْجُزْءُ الَّذِي لَا يَتَجَزَّى» tek bir şeydir. Bundan iki sonuç çıkar. Birincisi, sıla cümlesinin i'rabdan mahalli yoktur; onu fâil veya mef'ûl diye tahlil etmezsiniz, mevsûle aittir. İkincisi, ism-i mevsûl mebnîdir: اَلَّذِي ve مَنْ sonu değişmez, bu yüzden «merfû» değil «ref mahallinde» denir. Âid düşerse cümle çöker — «مَا يُعْلَمُ بِهِ الصَّانِعُ» ifadesinde بِهِ, cümleyi مَا'ya bağlayan âiddir."},"plain":{"en":"«the one who…», «that which…», and the clause that completes it.","tr":"«…-en kimse», «…olan şey» ve onu tamamlayan cümle."},"sources":["الكافية (ابن الحاجب) — المعارف","إظهار الأسرار (البركوي)","قطر الندى (ابن هشام)"],"examples":[{"ar":"وَالْجَوْهَرُ هُوَ الْجُزْءُ الَّذِي لَا يَتَجَزَّى.","gloss":{"en":"The atom is the part that admits of no division — الَّذِي is definite, so it can be the na't of the definite الْجُزْءُ.","tr":"Cevher, bölünemeyen cüzdür — الَّذِي marifedir, bu yüzden marife olan الْجُزْءُ'ya na't olabilir."},"src":"aqaid-ahl-al-sunna"},{"ar":"الْبَيِّنَةُ لِلْمُدَّعِي وَالْيَمِينُ عَلَى مَنْ أَنْكَرَ.","gloss":{"en":"…and the oath on the one who denies — مَنْ is in jarr after عَلَى, and أَنْكَرَ is its sila.","tr":"…yemin ise inkâr edene aittir — مَنْ, عَلَى'dan sonra cer mahallindedir, أَنْكَرَ onun sılasıdır."},"src":"aqaid-ahl-al-sunna"},{"ar":"الْعَالَمُ مَا سِوَى اللهِ تَعَالَى.","gloss":{"en":"The world is what is other than Allah — مَا stands in the position of raf' as the khabar.","tr":"Âlem, Allah'ın dışındaki şeydir — مَا haber olarak ref mahallindedir."},"src":null}],"mistakes":[{"wrong":"الرَّجُلُ الَّذِي جَاءَ أَمْسِ كَرِيمٌ — «الَّذِي جَاءَ» فَاعِلٌ","right":"«جَاءَ أَمْسِ» صِلَةُ الْمَوْصُولِ لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ","why":{"en":"Beginners parse the sila as though it were a clause of the main sentence. It is not — it has no case position at all; only the relative noun carries the i'rab.","tr":"Sıla cümlesi ana cümlenin bir öğesi gibi tahlil edilir; hâlbuki i'rabdan mahalli yoktur, i'rabı taşıyan sadece mevsûldür."}},{"wrong":"هَذَا هُوَ الْكِتَابُ الَّذِي قَرَأْتُ","right":"هَذَا هُوَ الْكِتَابُ الَّذِي قَرَأْتُهُ","why":{"en":"The sila needs the ‘aid. Without the ـهُ nothing ties «I read» back to «the book».","tr":"Sıla âidsiz olmaz. ـهُ olmadan «okudum» fiili «kitap»a bağlanmaz."}},{"wrong":"جَاءَ الَّذِينَ اجْتَهَدُوا — «الَّذِينَ» مَرْفُوعٌ بِالْوَاوِ","right":"«الَّذِينَ» مَبْنِيٌّ عَلَى الْفَتْحِ فِي مَحَلِّ رَفْعٍ فَاعِلٌ","why":{"en":"Relative nouns are mabni — they do not take case endings. Say «in the position of raf'», never «in raf' with a waw».","tr":"İsm-i mevsûller mebnîdir, i'rab alâmeti almaz. «Vâv ile merfû» değil, «ref mahallinde» denir."}}]},"ism-tafdil":{"title":{"ar":"اسْمُ التَّفْضِيل","en":"The ism tafdil (comparative and superlative)","tr":"İsm-i tafdîl (üstünlük)"},"level":3,"group":"sarf","explanation":{"en":"The ism tafdil is built on the pattern أَفْعَل and says that one thing has a quality MORE than another: أَبْيَضُ مِنَ اللَّبَنِ «whiter than milk». Three things follow from that pattern. First, it is a DIPTOTE (مَمْنُوعٌ مِنَ الصَّرْفِ) — it never takes tanwin, and in jarr it takes fatha instead of kasra. Second, the thing compared against is introduced by مِنْ, never by a separate word for «than». Third, in its bare أَفْعَل form it does not change for gender or number: هُوَ أَكْبَرُ, هِيَ أَكْبَرُ. It only inflects when made definite (الْأَكْبَرُ، الْكُبْرَى) or made mudaf. The Emsile lists it among the forms derived from every verb, and it is built only from a three-letter verb whose meaning admits degrees.","tr":"İsm-i tafdîl «ef'al» vezninde kurulur ve bir şeyin bir vasıfta diğerinden ÜSTÜN olduğunu bildirir: أَبْيَضُ مِنَ اللَّبَنِ «sütten daha beyaz». Bu vezinden üç şey doğar. Birincisi, GAYR-İ MUNSARİFTİR — tenvin almaz, cer hâlinde kesre yerine fetha alır. İkincisi, kendisine üstünlük verilen «min» ile gelir; ayrıca «-den daha» diye bir kelime kullanılmaz. Üçüncüsü, yalın «ef'al» şeklinde cinsiyet ve sayıya göre değişmez: هُوَ أَكْبَرُ, هِيَ أَكْبَرُ. Ancak marife yapılınca (الْأَكْبَرُ، الْكُبْرَى) veya muzâf olunca çekimlenir. Emsile onu her fiilden türeyen sîgalar arasında sayar; yalnız mânâsı derecelenebilen üç harfli fiilden yapılır."},"plain":{"en":"The أَفْعَل pattern, meaning «more X than»: أَبْيَضُ مِنَ اللَّبَنِ, «whiter than milk».","tr":"«Daha çok» manası veren أَفْعَل kalıbı: أَبْيَضُ مِنَ اللَّبَنِ, «sütten beyaz»."},"sources":["الأمثلة المختلفة","بناء الأفعال","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"examples":[{"ar":"وَمَاؤُهُ أَبْيَضُ مِنَ اللَّبَنِ.","gloss":{"en":"Its water is whiter than milk — أَبْيَضُ is a diptote, and مِنْ names what it is compared against.","tr":"Suyu sütten daha beyazdır — أَبْيَضُ gayr-i munsariftir, مِنْ kendisiyle kıyaslananı gösterir."},"src":"aqaid-ahl-al-sunna"},{"ar":"وَرِيحُهُ أَطْيَبُ مِنَ الْمِسْكِ.","gloss":{"en":"And its scent sweeter than musk.","tr":"Ve kokusu miskten daha güzeldir."},"src":"aqaid-ahl-al-sunna"},{"ar":"وَكِيزَانُهُ أَكْثَرُ مِنْ نُجُومِ السَّمَاءِ.","gloss":{"en":"And its cups more numerous than the stars of the sky.","tr":"Ve kâseleri gökyüzünün yıldızlarından daha çoktur."},"src":"aqaid-ahl-al-sunna"}],"mistakes":[{"wrong":"مَاؤُهُ أَبْيَضٌ مِنَ اللَّبَنِ","right":"مَاؤُهُ أَبْيَضُ مِنَ اللَّبَنِ","why":{"en":"The ism tafdil is a diptote: no tanwin, ever. Writing أَبْيَضٌ treats it as an ordinary noun.","tr":"İsm-i tafdîl gayr-i munsariftir: asla tenvin almaz. أَبْيَضٌ yazmak onu sıradan bir isim saymaktır."}},{"wrong":"مَرَرْتُ بِأَكْبَرِ مِنْهُ","right":"مَرَرْتُ بِأَكْبَرَ مِنْهُ","why":{"en":"As a diptote it takes FATHA in jarr, not kasra — unless it is made definite or mudaf, when the kasra returns.","tr":"Gayr-i munsarif olduğu için cer hâlinde kesre değil FETHA alır — marife veya muzâf yapılırsa kesre geri döner."}},{"wrong":"هِيَ أَكْبَرَةُ مِنْهَا","right":"هِيَ أَكْبَرُ مِنْهَا","why":{"en":"The bare أَفْعَل form does not take a feminine ending. Feminine appears only in the definite form الْكُبْرَى.","tr":"Yalın «ef'al» şekli müenneslik alâmeti almaz. Müenneslik ancak marife şekilde görülür: الْكُبْرَى."}}]},"istiara":{"title":{"ar":"الِاسْتِعَارَة","en":"Metaphor — a simile with one side removed","tr":"İstiâre — bir tarafı hazfedilmiş teşbih"},"level":5,"group":"balagha","explanation":{"en":"An isti'ara is a majaz whose relation is resemblance — which is to say, a tashbih with one of its two sides deleted and the tool gone with it. If what is named is the thing compared TO, the metaphor is مُصَرَّحَة (declared): «رَأَيْتُ أَسَدًا» names the lion and leaves the man out. If what is named is the thing compared and something belonging to the other side is attached to it instead, it is مَكْنِيَّة (implicit): «أَنْشَبَتِ الْمَنِيَّةُ أَظْفَارَهَا» never says «beast», but claws give it away — and the claws themselves are called تَخْيِيلِيَّة, the imagined trace of the deleted side. That second kind is what the wasiyya uses when it says laughter «kills» the heart: death belongs to a living thing, so the heart is being treated as one, and يُمِيتُ is the trace. Test it the same way every time: name the two sides, ask which one is missing from the words, and the answer tells you which kind you have.","tr":"İstiâre, alâkası müşâbehet olan mecazdır; yani iki tarafından biri ve onunla birlikte edâtı hazfedilmiş bir teşbihtir. Zikredilen müşebbehün bih ise istiâre musarrahadır: «رَأَيْتُ أَسَدًا» aslanı zikreder, adamı bırakır. Zikredilen müşebbeh olup öbür tarafın levazımından biri ona eklenmişse mekniyyedir: «أَنْشَبَتِ الْمَنِيَّةُ أَظْفَارَهَا» hiç «yırtıcı» demez, fakat pençeler ele verir — pençelerin kendisine de tahyîliyye denir, hazfedilen tarafın hayalî izidir. Vasiyet, gülmenin kalbi «öldürdüğünü» söylerken bu ikinciyi kullanır: ölmek diriye ait olduğu için kalp diri sayılmıştır, يُمِيتُ ise izidir. Ölçü her seferinde aynıdır: iki tarafı adlandırın, hangisinin lafızda bulunmadığını sorun; cevap türü söyler."},"plain":{"en":"A comparison with one of its two sides taken away — what English calls a metaphor.","tr":"İki tarafından biri kaldırılmış teşbih — istiare."},"sources":["تلخيص المفتاح (القزويني) — علم البيان","علاقات المجاز","مختصر السعد"],"examples":[{"ar":"وَإِيَّاكَ أَنْ تُكْثِرَ الضَّحِكَ فَإِنَّهُ يُمِيتُ الْقَلْبَ.","gloss":{"en":"Beware of laughing much, for it kills the heart — the heart is treated as a living thing and «kills» is the trace: isti'ara makniyya.","tr":"Çok gülmekten sakın, zira kalbi öldürür — kalp diri sayılmış, «öldürür» izdir: istiâre-i mekniyye."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"تَهَاوَنَ بِكَ وَصَغُرَتْ مَنْزِلَتُكَ عِنْدَهُ.","gloss":{"en":"Your standing shrank with him — a standing has no size; smallness is borrowed from bodies.","tr":"Yanında mevkiin küçüldü — mevkiin bir boyu yoktur; küçüklük cisimlerden ödünç alınmıştır."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"أَنْشَبَتِ الْمَنِيَّةُ أَظْفَارَهَا.","gloss":{"en":"Death sank its claws in — the beast is never named; the claws are the whole clue.","tr":"Ölüm pençelerini geçirdi — yırtıcı hiç anılmaz; bütün karîne pençelerdir."},"src":null}],"mistakes":[{"wrong":"«يُمِيتُ الْقَلْبَ» مَجَازٌ مُرْسَلٌ","right":"اسْتِعَارَةٌ، لِأَنَّ الْعَلَاقَةَ مُشَابَهَةٌ","why":{"en":"The relation here is likeness — the heart is being likened to something that can die. That makes it an isti'ara, not a mursal.","tr":"Buradaki alâka benzerliktir — kalp, ölebilen bir şeye benzetilmiştir. Bu mürsel değil istiâredir."}},{"wrong":"الِاسْتِعَارَةُ الْمَكْنِيَّةُ تَذْكُرُ الْمُشَبَّهَ بِهِ","right":"الْمَكْنِيَّةُ تَحْذِفُ الْمُشَبَّهَ بِهِ وَتُبْقِي مِنْ لَوَازِمِهِ شَيْئًا","why":{"en":"It is the makniyya that deletes the thing compared to; naming it makes the metaphor musarraha instead.","tr":"Müşebbehün bihi hazfeden mekniyyedir; onu zikretmek istiâreyi musarraha yapar."}}]},"istithna-mufarragh":{"title":{"ar":"الِاسْتِثْنَاءُ الْمُفَرَّغ (مَا … إِلَّا)","en":"Restriction: «nothing but…»","tr":"İstisnâ-i müferrağ (مَا … إِلَّا)"},"level":5,"group":"nahw","explanation":{"en":"When a negation is followed by إِلَّا and no مُسْتَثْنَى مِنْهُ has been mentioned, the sentence is «emptied» — مُفَرَّغ — and إِلَّا governs nothing at all. The word after it simply takes whatever case the sentence would have given it if the negation and the إِلَّا were both deleted. Test it: مَا مُحَمَّدٌ إِلَّا رَسُولٌ → remove both → مُحَمَّدٌ رَسُولٌ, mubtada and khabar, so رَسُولٌ is marfu'. There is a second effect worth naming. مَا can otherwise act like لَيْسَ and put its khabar in nasb (مَا مُحَمَّدٌ رَسُولًا). The moment إِلَّا arrives, that governing power lapses — النَّفْيُ مُنْتَقِضٌ بِإِلَّا — and raf' is the only option. The meaning is restriction, not exception: «Muhammad is nothing but a messenger».","tr":"Nefyden sonra إِلَّا gelir ve müstesnâ minh zikredilmezse cümle «boşaltılmış» (müferrağ) olur; إِلَّا hiçbir amel yapmaz. Ondan sonraki kelime, nefy ve إِلَّا kaldırılsaydı hangi i'rabı alacaksa onu alır. Deneyin: مَا مُحَمَّدٌ إِلَّا رَسُولٌ → ikisini kaldırın → مُحَمَّدٌ رَسُولٌ; mübteda ve haber, dolayısıyla رَسُولٌ merfûdur. İkinci bir netice daha vardır: مَا, aksi hâlde لَيْسَ gibi amel edip haberini nasb edebilir (مَا مُحَمَّدٌ رَسُولًا). إِلَّا geldiği anda bu amel düşer — النَّفْيُ مُنْتَقِضٌ بِإِلَّا — ve tek seçenek ref olur. Mana istisnâ değil hasrdır: «Muhammed ancak bir resuldür»."},"plain":{"en":"«nothing but…». With a negation, إِلَّا, and nothing named in between, إِلَّا governs nothing at all — the word after it takes the case it would have had anyway.","tr":"«…-den başkası değil». Nefy ve إِلَّا arasında bir şey anılmazsa إِلَّا hiçbir şeyi amel etmez; sonraki kelime zaten alacağı i'rabı alır."},"sources":["الكافية (ابن الحاجب) — الاستثناء","العوامل (البيركوي)","قطر الندى (ابن هشام)"],"examples":[{"ar":"وَمَا مُحَمَّدٌ إِلَّا رَسُولٌ قَدْ خَلَتْ مِنْ قَبْلِهِ الرُّسُلُ.","gloss":{"en":"Muhammad is but a messenger; messengers have passed away before him. (Al ‘Imran 144)","tr":"Muhammed ancak bir resuldür; ondan önce de resuller gelip geçti. (Âl-i İmrân 144)"},"src":"aqaid-ahl-al-sunna"},{"ar":"مَا جَاءَ إِلَّا زَيْدٌ.","gloss":{"en":"No one came but Zayd — delete مَا and إِلَّا and زَيْدٌ is the fa'il, so it stays marfu'.","tr":"Zeyd'den başkası gelmedi — مَا ile إِلَّا'yı kaldırın, زَيْدٌ fâildir, dolayısıyla merfû kalır."},"src":null},{"ar":"مَا رَأَيْتُ إِلَّا زَيْدًا.","gloss":{"en":"I saw none but Zayd — here the emptied position is the object, so nasb.","tr":"Zeyd'den başkasını görmedim — burada boşalan mahal mef'ûldür, o hâlde nasb."},"src":null}],"mistakes":[{"wrong":"مَا مُحَمَّدٌ إِلَّا رَسُولًا","right":"مَا مُحَمَّدٌ إِلَّا رَسُولٌ","why":{"en":"إِلَّا cancels مَا's power to give nasb. Once the negation is broken by إِلَّا, the khabar returns to raf'.","tr":"إِلَّا, مَا'nın nasb etme amelini iptal eder. Nefy إِلَّا ile bozulunca haber ref'e döner."}},{"wrong":"مَا جَاءَ إِلَّا زَيْدًا","right":"مَا جَاءَ إِلَّا زَيْدٌ","why":{"en":"In the emptied construction the case comes from the role, not from إِلَّا. Here زَيْد is the doer, so raf' — nasb would only be right if a مُسْتَثْنَى مِنْهُ had been mentioned.","tr":"Müferrağ istisnâda i'rab, إِلَّا'dan değil kelimenin görevinden gelir. Burada زَيْد fâildir, dolayısıyla ref alır; nasb ancak müstesnâ minh zikredilseydi doğru olurdu."}},{"wrong":"مَا جَاءَ الْقَوْمُ إِلَّا زَيْدٌ","right":"مَا جَاءَ الْقَوْمُ إِلَّا زَيْدًا (وَيَجُوزُ الْبَدَلُ: إِلَّا زَيْدٌ)","why":{"en":"This one is NOT emptied — الْقَوْمُ is the mustathna minhu, so the ordinary rules of istithna apply again.","tr":"Bu cümle müferrağ değildir; الْقَوْمُ müstesnâ minhtir, dolayısıyla normal istisnâ kuralları geçerlidir."}}]},"istithna":{"title":{"ar":"الِاسْتِثْنَاء (الْمُسْتَثْنَى)","en":"Exception (the mustathna)","tr":"İstisnâ (müstesnâ)"},"level":4,"group":"nahw","explanation":{"en":"The mustathna is what إِلَّا and its sisters (غَيْر، سِوَى، خَلَا، عَدَا، حَاشَا) take OUT of a larger group. The Mansubat divides it in two: (1) مُتَّصِل, «هُوَ الْمُخْرَجُ عَنْ مُتَعَدِّدٍ لَفْظًا أَوْ تَقْدِيرًا بِإِلَّا وَأَخَوَاتِهَا» — the excepted thing belongs to the group it is taken from (جَاءَ الْقَوْمُ إِلَّا زَيْدًا); (2) مُنْقَطِع, where it does not (مَا جَاءَ أَحَدٌ إِلَّا حِمَارًا). The case follows the sentence: after a COMPLETE AFFIRMATIVE sentence the mustathna is mansub. After a negative sentence with the excepted-from mentioned, it may either be mansub or follow the case of that noun. In a sentence where the excepted-from is dropped (مُفَرَّغ), إِلَّا governs nothing at all and the noun simply takes whatever the verb requires: مَا جَاءَ إِلَّا زَيْدٌ.","tr":"Müstesnâ, إِلَّا ve kardeşlerinin (غَيْر، سِوَى، خَلَا، عَدَا، حَاشَا) daha büyük bir topluluktan ÇIKARDIĞI şeydir. Mensûbât ikiye ayırır: (1) muttasıl, «هُوَ الْمُخْرَجُ عَنْ مُتَعَدِّدٍ لَفْظًا أَوْ تَقْدِيرًا بِإِلَّا وَ أَخَوَاتِهَا» — çıkarılan, çıkarıldığı cinsten olur (جَاءَ الْقَوْمُ إِلَّا زَيْدًا); (2) munkatı', olmaz (مَا جَاءَ أَحَدٌ إِلَّا حِمَارًا). İ'rabı cümleye bağlıdır: TAM ve MÛCEB bir cümleden sonra müstesnâ mansubdur. Menfî cümlede müstesnâ minh zikredilmişse ya mansub olur ya da ondan bedel olarak i'rabına uyar. Müstesnâ minh hazfedilmişse (müferrağ), إِلَّا hiçbir amel yapmaz ve isim fiilin gerektirdiği i'rabı alır: مَا جَاءَ إِلَّا زَيْدٌ."},"plain":{"en":"«except» — taking something back out of what you just said.","tr":"«…-den başka» — söylediğiniz şeyden bir kısmını dışarıda bırakmak."},"mamul":"mansub","sources":["المنصوبات","العوامل (البيركوي)","إظهار الأسرار (البيركوي)","قطر الندى (ابن هشام)"],"question":{"tr":["Ne müstesna?","Kim müstesna?"],"en":["What is excepted?","Who is excepted?"]},"examples":[{"ar":"وَمَنْ جَاءَكَ يَسْتَفْتِيكَ فَلَا تُجِبْ إِلَّا عَنْ سُؤَالِهِ.","gloss":{"en":"Whoever comes asking you for a ruling — answer nothing but his question. A mufarragh exception: إلا governs nothing, so the phrase simply takes the case its position requires.","tr":"Sana fetva sormaya gelene, ancak sorduğu şeyi cevapla. Müferrağ istisnâ: إلا amel etmez, kelime bulunduğu mahallin i'rabını alır."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"وَمَنْ جَاءَكَ يَسْتَفْتِيكَ فَلَا تُجِبْ إِلَّا عَنْ سُؤَالِهِ.","gloss":{"en":"Whoever comes asking you for a ruling — answer only his question. A mufarragh exception: إِلَّا governs nothing, the phrase simply completes the verb. From Abu Hanifa's testament to Abu Yusuf.","tr":"Sana fetva sormaya gelene yalnız sorusunu cevapla. Müferrağ istisnâ: إِلَّا amel etmez, ifade fiili tamamlar. Ebû Hanîfe'nin Ebû Yusuf'a vasiyetinden."},"src":null},{"ar":"جَاءَ الْقَوْمُ إِلَّا زَيْدًا.","gloss":{"en":"The people came except Zayd — complete affirmative sentence, so the mustathna is mansub.","tr":"Zeyd hariç insanlar geldi — tam ve müsbet cümle, dolayısıyla müstesnâ mansubdur."},"src":null},{"ar":"مَا جَاءَ أَحَدٌ إِلَّا زَيْدًا / إِلَّا زَيْدٌ.","gloss":{"en":"No one came except Zayd — negative sentence: nasb, or badal following أَحَدٌ, are both allowed.","tr":"Zeyd'den başka kimse gelmedi — menfî cümle: nasb da أَحَدٌ'den bedel de caizdir."},"src":null}],"mistakes":[{"wrong":"ما جاء إلا زيدًا","right":"ما جاء إلا زيدٌ","why":{"en":"When the excepted-from is not mentioned (mufarragh), إِلَّا governs nothing — the noun takes the case its position requires, here fa'il in raf'. This is the single most common exception error.","tr":"Müstesnâ minh zikredilmemişse (müferrağ) إِلَّا amel etmez — isim, konumunun gerektirdiği i'rabı alır, burada fâil olarak merfû. En sık yapılan istisna hatasıdır."}},{"wrong":"جاء القومُ إلا زيدٌ","right":"جاء القومُ إلا زيدًا","why":{"en":"After a complete affirmative sentence the mustathna must be mansub; it does not follow the case of the group.","tr":"Tam ve mûceb cümleden sonra müstesnâ mansub olmalıdır; topluluğun i'rabına uymaz."}},{"wrong":"جاء القومُ غيرًا زيدٍ","right":"جاء القومُ غَيْرَ زَيْدٍ","why":{"en":"With غَيْر and سِوَى the exception is expressed by idafa: غَيْر itself takes the case the mustathna would have taken, and the excepted noun goes into jarr after it.","tr":"غَيْر ve سِوَى ile istisna izafetle yapılır: غَيْر, müstesnânın alacağı i'rabı alır, istisna edilen isim ondan sonra mecrûr olur."}}]},"jam-muannath-salim":{"title":{"ar":"جَمْعُ الْمُؤَنَّثِ السَّالِم","en":"The sound feminine plural","tr":"Cem-i müennes-i sâlim"},"level":3,"group":"nahw","explanation":{"en":"Add ـَات to the singular and you have the sound feminine plural: إِدْرَاك → إِدْرَاكَات, مَوْجُود → مَوْجُودَات. Its i'rab has one peculiarity that must be memorised: it takes damma in raf' as expected, but KASRA in nasb — not fatha. So «رَأَيْتُ الْمُؤْمِنَاتِ» and «مَرَرْتُ بِالْمُؤْمِنَاتِ» look identical at the ending, and only the governor tells you which case it is. That makes this plural the mirror image of the sound masculine plural, which uses ـُونَ for raf' and ـِينَ for both nasb and jarr. Note also that the plural does not require a feminine singular — حَمَّامَات and إِدْرَاكَات are built on masculine words; what makes it «feminine» is the ending, not the sense.","tr":"Tekile ـَات eklenerek yapılır: إِدْرَاك → إِدْرَاكَات، مَوْجُود → مَوْجُودَات. İ'rabında ezberlenmesi gereken bir özellik vardır: ref hâlinde beklendiği gibi damme alır, fakat NASB hâlinde fetha değil KESRE alır. Bu yüzden «رَأَيْتُ الْمُؤْمِنَاتِ» ile «مَرَرْتُ بِالْمُؤْمِنَاتِ» sonlarında aynı görünür; hangi i'rabda olduğunu ancak âmil belirler. Böylece bu cemi, ref için ـُونَ, nasb ve cer için ـِينَ kullanan cem-i müzekker-i sâlimin aynadaki görüntüsüdür. Ayrıca tekilinin müennes olması şart değildir: حَمَّامَات ve إِدْرَاكَات müzekker kelimelerden yapılmıştır; «müennes» sayılmasının sebebi manası değil, ekidir."},"plain":{"en":"The regular feminine plural in ـَات — and it takes kasra where you would expect fatha.","tr":"ـَات ile yapılan düzenli müennes çoğul; fetha beklediğiniz yerde kesre alır."},"sources":["العوامل (البيركوي)","الكافية (ابن الحاجب)","مراح الأرواح"],"examples":[{"ar":"بِهَا تَسْتَعِدُّ لِلْعُلُومِ وَالْإِدْرَاكَاتِ.","gloss":{"en":"…is made ready for the sciences and the perceptions — kasra here is the mark of jarr.","tr":"…ilimlere ve idraklere hazır hâle gelir — buradaki kesre cer alâmetidir."},"src":"aqaid-ahl-al-sunna"},{"ar":"مَا سِوَى اللهِ تَعَالَى مِنَ الْمَوْجُودَاتِ.","gloss":{"en":"…among the existent things.","tr":"…mevcudat arasından."},"src":"aqaid-ahl-al-sunna"},{"ar":"إِنَّ الْمُسْلِمَاتِ وَالْمُؤْمِنَاتِ.","gloss":{"en":"Indeed the Muslim women and the believing women — after إِنَّ the case is nasb, but the mark is kasra.","tr":"Muhakkak Müslüman ve mümin kadınlar — إِنَّ'den sonra i'rab nasbdır, fakat alâmeti kesredir."},"src":null}],"mistakes":[{"wrong":"رَأَيْتُ الْمُسْلِمَاتَ","right":"رَأَيْتُ الْمُسْلِمَاتِ","why":{"en":"The sound feminine plural never takes fatha in nasb. Kasra stands in for it — this is the single rule that governs the form.","tr":"Cem-i müennes-i sâlim nasb hâlinde asla fetha almaz; onun yerine kesre gelir. Bu şeklin tek kuralı budur."}},{"wrong":"جَاءَتِ الْمُسْلِمَاتِ","right":"جَاءَتِ الْمُسْلِمَاتُ","why":{"en":"In raf' it is perfectly ordinary — damma. The kasra substitution applies to nasb only.","tr":"Ref hâlinde tamamen olağandır: damme. Kesre ikamesi yalnız nasb hâline mahsustur."}}]},"jam-mudhakkar-salim":{"title":{"ar":"جَمْعُ الْمُذَكَّرِ السَّالِم","en":"The sound masculine plural","tr":"Cem-i müzekker-i sâlim"},"level":3,"group":"nahw","explanation":{"en":"Nouns pluralized with ـُونَ / ـِينَ take their i'rab BY LETTERS, not vowels: raf' with و (الصَّالِحُونَ) and both nasb AND jarr with ي (الصَّالِحِينَ). So one form covers two cases — the sentence position tells you which. In this story: اصْحَبِ الصَّالِحِينَ — object in nasb, marked by ي. The final نَ drops in idafa: مُعَلِّمُو الْمَدْرَسَةِ. Only rational masculine nouns (and their adjectives) form this plural; broken plurals (كِبَار، عُلَمَاء) decline with ordinary vowels instead.","tr":"ـُونَ / ـِينَ ile yapılan çoğullar i'rabını harekelerle değil HARFLERLE alır: ref hali و ile (الصَّالِحُونَ), nasb VE cer halleri ي ile (الصَّالِحِينَ). Tek şekil iki hali karşılar — hangisi olduğunu cümledeki konum belirler. Hikâyede: اصْحَبِ الصَّالِحِينَ — mef'ûlün bih, nasb alâmeti ي. İzafette sondaki نَ düşer: مُعَلِّمُو الْمَدْرَسَةِ. Bu çoğul yalnız akıllı müzekker isimlerde kurulur; mükesser çoğullar (كِبَار، عُلَمَاء) normal harekelerle i'rablanır."},"plain":{"en":"The regular masculine plural in ـُونَ and ـِينَ.","tr":"ـُونَ ve ـِينَ ile yapılan düzenli müzekker çoğul."},"sources":["الكافية (ابن الحاجب) — المعربات بالحروف","قطر الندى (ابن هشام)","بناء الأفعال — للمقارنة مع جمع التكسير"],"examples":[{"ar":"اصْحَبِ الصَّالِحِينَ.","gloss":{"en":"Keep the company of the righteous — nasb marked by ي.","tr":"Sâlihlerle arkadaşlık et — nasb alâmeti yâdır."},"src":"wasiyyat-abi-hanifa-L4"},{"ar":"جَاءَ الصَّالِحُونَ.","gloss":{"en":"The righteous came — raf' marked by و.","tr":"Sâlihler geldi — ref alâmeti vâvdır."},"src":null},{"ar":"مَرَرْتُ بِالْمُعَلِّمِينَ.","gloss":{"en":"I passed by the teachers — jarr with the same ي form as nasb.","tr":"Hocalara uğradım — cerde de nasbdaki gibi yâ gelir."},"src":null}],"mistakes":[{"wrong":"اصحبِ الصالحونَ","right":"اصحبِ الصالحينَ","why":{"en":"Learners freeze the raf' form ـُونَ everywhere. As a direct object the plural must switch to ـِينَ.","tr":"Öğrenciler ref şekli ـُونَ'yi her yerde dondurur. Mef'ûl konumunda çoğul ـِينَ'ye dönmelidir."}},{"wrong":"جاء الصالحينَ","right":"جاء الصالحونَ","why":{"en":"The reverse error: as subject (fa'il) the plural must show و, not the ي of nasb/jarr.","tr":"Tersi hata: fâil konumunda çoğul و almalıdır, nasb/cer yâsı değil."}},{"wrong":"معلمونَ المدرسةِ","right":"معلمو المدرسةِ","why":{"en":"In idafa the final نَ drops — it stands in for tanwin, and mudaf nouns take neither.","tr":"İzafette sondaki نَ düşer — o tenvin yerine geçer; muzâf isim ikisini de almaz."}}]},"jinas":{"title":{"ar":"الجِنَاس وَمَا يُلْحَقُ بِهِ","en":"Jinas — two words that sound alike","tr":"Cinâs — telaffuzda birbirine benzeyen iki lafız"},"level":6,"group":"balagha","explanation":{"en":"With jinas we cross from the embellishments of meaning to those of wording. Jinas is the resemblance of two words in the way they are pronounced, and it is either complete or deficient. Complete (تَامّ) when the two agree in the kind of their letters, their number, their vowelling and their order. If both are of one part of speech it is مُمَاثِل — «وَيَوْمَ تَقُومُ السَّاعَةُ يُقْسِمُ الْمُجْرِمُونَ مَا لَبِثُوا غَيْرَ سَاعَةٍ», the Hour and an hour. If they are of two parts of speech it is مُسْتَوْفَى, as in the two يَحْيَى, one a verb and one a name. If one side is a compound the names change again: تَرْكِيب, and مُتَشَابِه or مَفْرُوق according to whether the two are written alike. Deficient (نَاقِص) when they fall short of that agreement: differing only in vowelling is مُحَرَّف; differing in the number of letters is the ordinary نَاقِص, and if the extra letter sits at the end it is مُطَرَّف — عَوَاصٍ beside عَوَاصِم — while a longer tail gives مُذَيَّل. Two further things are *joined* to jinas without being jinas proper: words that share a derivation, «فَأَقِمْ وَجْهَكَ لِلدِّينِ الْقَيِّمِ», and words that merely look derived from one root, «إِنِّي لِعَمَلِكُمْ مِنَ الْقَالِينَ» beside قَالَ. This last family — الِاشْتِقَاق — is the one that classical prose actually lives on, and it is what our texts have: a masdar set beside its own verb, a noun beside the verb it was cut from. Read it as a discipline rather than a trick. The tradition praises jinas only
