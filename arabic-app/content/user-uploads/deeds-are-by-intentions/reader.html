hw","explanation":{"en":"The khabar comes in three shapes and only the first shows a case ending. (1) مُفْرَد — a single word: «الْعِلْمُ صِفَةٌ», and here the damma is visible. (2) جُمْلَة — a whole clause, verbal or nominal, which then stands «in the position of raf'». (3) شِبْهُ جُمْلَة — a preposition with its noun, or an adverb: «الْبَيِّنَةُ لِلْمُدَّعِي», «the proof is on the claimant». That third kind trips people up because there is no marfu' word to point at. The classical answer is that the phrase is attached to an omitted word — كَائِنٌ or مُسْتَقِرٌّ, «existing / located» — and THAT is the real khabar; the phrase merely occupies its position. Note that كَانَ and its sisters take the same three shapes for their khabar, and لَيْسَ in «وَالْإِلْهَامُ لَيْسَ مِنْ أَسْبَابِ الْمَعْرِفَةِ» has a shibh jumla khabar standing in nasb.","tr":"Haber üç şekilde gelir ve yalnız birincisinde i'rab alâmeti görünür. (1) Müfred — tek kelime: «الْعِلْمُ صِفَةٌ»; damme açıkça görülür. (2) Cümle — fiil veya isim cümlesi; bu durumda «ref mahallinde» bulunur. (3) Şibh-i cümle — câr-mecrûr yahut zarf: «الْبَيِّنَةُ لِلْمُدَّعِي». Üçüncüsü zorlayıcıdır, çünkü işaret edilecek merfû bir kelime yoktur. Klasik cevap şudur: bu terkip mahzûf bir kelimeye — كَائِنٌ veya مُسْتَقِرٌّ — mütealliktir ve asıl haber odur; terkip sadece onun yerini tutar. كَانَ ve kardeşlerinin haberi de aynı üç şekilde gelir; «وَالْإِلْهَامُ لَيْسَ مِنْ أَسْبَابِ الْمَعْرِفَةِ» cümlesinde لَيْسَ'nin haberi nasb mahallinde şibh-i cümledir."},"plain":{"en":"What you say about the topic can be one word, a whole clause, or a preposition with its noun. Only the first kind shows a case ending.","tr":"Mübteda hakkında söylenen şey tek kelime, tam bir cümle yahut bir harf-i cerle ismi olabilir. Yalnız birincisinde i'rab görünür."},"mamul":"marfu","sources":["العوامل (البيركوي)","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"question":{"tr":["Nedir? Kimdir?","Niçindir? Nerededir?"],"en":["What is it? Who is it?","For what — or where — is it?"]},"examples":[{"ar":"الْبَيِّنَةُ لِلْمُدَّعِي وَالْيَمِينُ عَلَى مَنْ أَنْكَرَ.","gloss":{"en":"Both khabars here are shibh jumla — prepositional phrases standing in the position of raf'.","tr":"Buradaki iki haber de şibh-i cümledir — ref mahallinde câr-mecrûrdur."},"src":"aqaid-ahl-al-sunna"},{"ar":"وَالْإِلْهَامُ لَيْسَ مِنْ أَسْبَابِ الْمَعْرِفَةِ بِصِحَّةِ الشَّيْءِ.","gloss":{"en":"Inspiration is not among the causes of knowing — the khabar of لَيْسَ is a prepositional phrase in nasb.","tr":"İlham, bilmenin sebeplerinden değildir — لَيْسَ'nin haberi nasb mahallinde câr-mecrûrdur."},"src":"aqaid-ahl-al-sunna"},{"ar":"وَالْأَعْيَانُ مَا يَكُونُ لَهُ قِيَامٌ بِذَاتِهِ.","gloss":{"en":"…that which has subsistence by itself — لَهُ is the fronted khabar of يَكُونُ.","tr":"…kendi zatıyla kâim olan şey — لَهُ, يَكُونُ'nun mukaddem haberidir."},"src":"aqaid-ahl-al-sunna"}],"mistakes":[{"wrong":"الْكِتَابُ عَلَى الطَّاوِلَةِ — لَا خَبَرَ لِلْجُمْلَةِ","right":"«عَلَى الطَّاوِلَةِ» فِي مَحَلِّ رَفْعٍ خَبَرٌ","why":{"en":"A prepositional phrase can be the khabar. The sentence is complete — «the book is on the table» — even though no word carries a damma.","tr":"Câr-mecrûr haber olabilir. Hiçbir kelime damme almasa da cümle tamamdır: «kitap masanın üstündedir»."}},{"wrong":"الطَّالِبُ يَجْتَهِدُ — «يَجْتَهِدُ» خَبَرٌ مَرْفُوعٌ بِالضَّمَّةِ","right":"الْجُمْلَةُ الْفِعْلِيَّةُ «يَجْتَهِدُ» فِي مَحَلِّ رَفْعٍ خَبَرٌ","why":{"en":"The damma on يَجْتَهِدُ is its own raf' as an unmarked mudari', not the raf' of a khabar. The CLAUSE is what occupies the khabar position.","tr":"يَجْتَهِدُ üzerindeki damme, muzârinin kendi merfûluğudur, haberin i'rabı değil. Haber mahallini tutan CÜMLEdir."}}]},"anwa-al-majaz":{"title":{"ar":"أَنْوَاعُ الْمَجَازِ — اللُّغَوِيُّ وَالْعَقْلِيُّ","en":"The kinds of majaz — of word and of attribution","tr":"Mecâzın çeşitleri — lugavî ve aklî"},"level":5,"group":"balagha","explanation":{"en":"The books divide majaz first by WHERE the transfer happens. (1) مَجَازٌ لُغَوِيٌّ — the transfer is in the WORD: لَفْظٌ مُسْتَعْمَلٌ فِي غَيْرِ مَا وُضِعَ لَهُ… بِعَلَاقَةٍ بَيْنَهُمَا مَعَ قَرِينَةٍ مَانِعَةٍ عَنْ إِرَادَةِ الْمَوْضُوعِ لَهُ. If the ʿalaqa between the two meanings is LIKENESS, the majaz is an isti'ara; if it is anything else, it is مَجَازٌ مُرْسَلٌ, and the tradition names its relations one by one — سَبَبِيَّة (naming the cause for the effect), مُسَبَّبِيَّة (the effect for the cause), جُزْئِيَّة (the part for the whole), كُلِّيَّة (the whole for the part), مَحَلِّيَّة (the place for what is in it), حَالِّيَّة (what is in a place for the place), مَصْدَرِيَّة، مَظْهَرِيَّة، مُجَاوَرَة, and كَوْنٌ سَابِقٌ / كَوْنٌ لَاحِقٌ (naming a thing by what it WAS or by what it WILL BE). (2) مَجَازٌ عَقْلِيٌّ — nothing is wrong with any single word; the ATTRIBUTION is moved: نِسْبَةُ الشَّيْءِ إِلَى غَيْرِ مَا هُوَ لَهُ فِي ظَاهِرِ حَالِ الْمُتَكَلِّمِ. أَنْبَتَ الرَّبِيعُ الْبَقْلَ — spring did not make the herbs grow, Allah did; spring is the time, not the doer. هَزَمَ الْأَمِيرُ الْجُنْدَ — the commander did not rout the army with his own hands; he is the cause. Every word is in its own meaning, so the majaz is in the isnad, not the lafz. Two further kinds turn on the SHAPE of the sentence rather than its meaning: (3) مَجَازٌ بِالزِّيَادَةِ — لَفْظٌ تَغَيَّرَ إِعْرَابُهُ بِشَيْءٍ زَائِدٍ عَلَى الْمُرَادِ, as in لَيْسَ كَمِثْلِهِ شَيْءٌ, where the كَ is extra and the sense is «there is nothing like Him»; and (4) مَجَازٌ بِالنُّقْصَانِ — لَفْظٌ تَغَيَّرَ إِعْرَابُهُ بِنُقْصَانٍ فِي اللَّفْظِ, as in وَاسْأَلِ الْقَرْيَةَ, «ask the village», where أَهْل has been dropped and القرية took its i'rab. Notice what those two share with the nahw chapters: the i'rab itself is the evidence that something was added or taken away.","tr":"Kitaplar mecazı önce nakil NEREDE oldu diye ayırır. (1) MECÂZ-I LUGAVÎ — nakil KELİMEDEDİR: لَفْظٌ مُسْتَعْمَلٌ فِي غَيْرِ مَا وُضِعَ لَهُ… بِعَلَاقَةٍ بَيْنَهُمَا مَعَ قَرِينَةٍ مَانِعَةٍ. İki mana arasındaki alâka BENZERLİK ise mecaz istiâredir; benzerlikten başka bir şey ise MECÂZ-I MÜRSELDİR ve gelenek alâkalarını tek tek sayar: sebebiyye (sebebi söyleyip müsebbebi kastetmek), müsebbebiyye, cüz'iyye (parçayı söyleyip bütünü), külliyye, mahalliyye (yeri söyleyip içindekini), hâlliyye, masdariyye, mazhariyye, mücâvere ve kevn-i sâbık / kevn-i lâhık (bir şeyi ÖNCEKİ yahut SONRAKİ hâliyle adlandırmak). (2) MECÂZ-I AKLÎ — hiçbir kelimede bir sorun yoktur; kaydırılan İSNÂDIN kendisidir: نِسْبَةُ الشَّيْءِ إِلَى غَيْرِ مَا هُوَ لَهُ فِي ظَاهِرِ حَالِ الْمُتَكَلِّمِ. أَنْبَتَ الرَّبِيعُ الْبَقْلَ — otu bahar bitirmedi, Allah bitirdi; bahar zamandır, fâil değil. هَزَمَ الْأَمِيرُ الْجُنْدَ — orduyu kumandan kendi eliyle bozmadı; o sebeptir. Her kelime kendi manasındadır; öyleyse mecaz lafızda değil isnâddadır. İki çeşit daha manadan çok cümlenin ŞEKLİNE dayanır: (3) MECÂZ Bİ'Z-ZİYÂDE — لَفْظٌ تَغَيَّرَ إِعْرَابُهُ بِشَيْءٍ زَائِدٍ عَلَى الْمُرَادِ; لَيْسَ كَمِثْلِهِ شَيْءٌ'de kâf zâiddir, mana «O'nun benzeri hiçbir şey yoktur»dur. (4) MECÂZ Bİ'N-NUKSÂN — لَفْظٌ تَغَيَّرَ إِعْرَابُهُ بِنُقْصَانٍ فِي اللَّفْظِ; وَاسْأَلِ الْقَرْيَةَ'de «ehl» düşmüş, i'râbını القرية almıştır. Bu ikisinin nahiv bahisleriyle ortak yanına dikkat edin: bir şeyin eklendiğine yahut düştüğüne delil, i'râbın kendisidir."},"plain":{"en":"A word can be moved off its meaning — that is the majaz you know. But a whole ATTRIBUTION can be moved too, and two more kinds arise from a word merely added or dropped.","tr":"Bir kelime manasından kaydırılabilir — bildiğiniz mecaz budur. Fakat bütün bir NİSBET de kaydırılabilir; bir de lafza bir şey eklenmesi yahut ondan düşmesiyle iki çeşit daha doğar."},"sources":["تلخيص المفتاح (القزويني)","دروس علم البيان (المدرسة العثمانية)"],"question":{"tr":["Kaydırılan kelime mi, yoksa isnâdın kendisi mi? İkincisi ise mecâz-ı aklîdir.","Fiil gerçek fâiline mi isnâd edilmiş? Değilse aklîdir.","Lafızda bir ziyade yahut bir eksik var mı? O zaman ziyâde/noksan mecazıdır."],"en":["Is it the word that moved, or the ATTRIBUTION itself? The second is majaz aqli.","Is the verb attributed to its real doer? If not, it is aqli.","Has a word been added, or dropped? Then it is the majaz of addition or omission."]},"examples":[{"ar":"أَنْبَتَ الرَّبِيعُ الْبَقْلَ.","gloss":{"en":"Majaz aqli: every word is literal, but spring is the TIME of the growing, not its doer — the attribution is what moved.","tr":"Mecâz-ı aklî: her kelime hakikattedir; fakat bahar bitmenin ZAMANIDIR, fâili değil — kayan, isnâdın kendisidir."},"src":null},{"ar":"لَيْسَ كَمِثْلِهِ شَيْءٌ.","gloss":{"en":"Majaz of addition: the kaf is extra, and its being extra is exactly why the verse does not say «there is nothing like His like».","tr":"Ziyâde mecazı: kâf zâiddir; zâid oluşu, âyetin «O'nun benzerinin benzeri yoktur» demediğinin ta kendisidir."},"src":null},{"ar":"وَاسْأَلِ الْقَرْيَةَ.","gloss":{"en":"Majaz of omission: أَهْل is dropped and the village takes its nasb — the i'rab is the fingerprint of what was removed.","tr":"Noksan mecazı: «ehl» düşmüş, nasbını köy almıştır — i'râb, düşenin parmak izidir."},"src":null},{"ar":"وَفِي قَلْبِهِ وَصِيَّةُ مُعَلِّمِهِ.","gloss":{"en":"Contrast, from the corpus: this is no majaz at all — the heart holds the testament by mahalliyya only if you press it; read plainly it is a hal clause, and the app's own note treats it as one.","tr":"Külliyattan bir karşılaştırma: bu hiç mecaz değildir — zorlarsanız mahalliyye alâkası kurulur, fakat düz okunuşta hâl cümlesidir ve uygulamanın notu onu öyle işler."},"src":"wasiyyat-abi-hanifa-L2"}],"mistakes":[{"wrong":"أَنْبَتَ الرَّبِيعُ الْبَقْلَ — «الرَّبِيع» مَجَازٌ لُغَوِيٌّ","right":"أَنْبَتَ الرَّبِيعُ الْبَقْلَ — الْمَجَازُ فِي الْإِسْنَادِ لَا فِي اللَّفْظِ","why":{"en":"Ask which word is out of its meaning. رَبِيع means spring, بَقْل means herbs, أَنْبَتَ means made-grow — every one is literal. What is displaced is the attaching of the verb to spring, so the majaz is aqli, not lughawi.","tr":"Hangi kelimenin manasından çıktığını sorun. رَبِيع bahardır, بَقْل ottur, أَنْبَتَ bitirdidir — hepsi hakikattedir. Yerinden oynayan, fiilin bahara isnâd edilmesidir; öyleyse mecaz lugavî değil aklîdir."}}]},"anwa-al-waw":{"title":{"ar":"أَنْوَاعُ الْوَاوِ","en":"The kinds of waw","tr":"Vav'ın çeşitleri"},"level":4,"group":"nahw","explanation":{"en":"The same letter و does very different work, and the i'rab must name which. (1) THE JOINING WAW (عاطفة) ties a follower to what precedes and shares its case — the workhorse. (2) THE WAW OF CIRCUMSTANCE (حالية) opens a clause that describes the STATE of someone in the main clause; the whole clause sits in nasb position as a hal. Test it by substituting «while / إِذْ»: in this story, وَرَجَعَ يُوسُفُ إِلَى الْبَصْرَةِ وَفِي قَلْبِهِ وَصِيَّةُ مُعَلِّمِهِ — Yusuf returned WHILE his teacher's testament lay in his heart. The waw before فِي is not joining two journeys; it paints his state on the road. A telltale: after a waw haliyya a nominal clause often begins with a fronted jarr phrase or carries a pronoun binding it to its owner (قَلْبِـهِ → يُوسُفُ). (3) THE RESUMPTIVE WAW (استئنافية) simply starts a new sentence with no i'rab tie. (4) THE OATH WAW (واو القسم) is a jarr letter: وَاللَّهِ. (5) THE WAW OF ACCOMPANIMENT (واو المعية) puts what follows in nasb as maf'ul ma'ah. And the plural waw (واو الجماعة) is not a particle at all but a pronoun — the fa'il inside كُونُوا.","tr":"Aynı و harfi çok farklı işler görür; i'rab hangisi olduğunu söylemek zorundadır. (1) ATIF VAVI (عاطفة) sonrakini öncekine bağlar, i'rabını paylaştırır — en yaygını. (2) VAV-I HÂLİYE (حالية) ana cümledeki birinin HÂLİNİ anlatan bir cümle açar; cümle bütünüyle hâl olarak mahallen mensubdur. Denemesi: yerine «-iken / إِذْ» koyun. Bu hikâyede: وَرَجَعَ يُوسُفُ إِلَى الْبَصْرَةِ وَفِي قَلْبِهِ وَصِيَّةُ مُعَلِّمِهِ — Yusuf, hocasının vasiyeti kalbinde OLDUĞU HÂLDE döndü. فِي'den önceki vav iki yolculuğu bağlamıyor; yoldaki hâlini çiziyor. İpucu: vav-ı hâliyeden sonra gelen isim cümlesi çoğu kez öne alınmış câr-mecrurla başlar ve sahibine dönen bir zamir taşır (قَلْبِـهِ → يُوسُفُ). (3) İSTİ'NÂFİYE VAVI yeni bir cümleye başlar; i'rab bağı yoktur. (4) KASEM VAVI cer harfidir: وَاللَّهِ. (5) MAİYYE VAVI sonrasını mef'ûlün maah olarak nasb eder. Cemaat vâvı (واو الجماعة) ise harf değil zamirdir — كُونُوا'daki fâil odur."},"plain":{"en":"One letter, several jobs: joining («and»), circumstance («while»), a fresh start, an oath. Misread the waw and the sentence changes meaning.","tr":"Tek harf, birkaç görev: bağlama («ve»), hâl («-iken»), yeni başlangıç, yemin. Vav yanlış okunursa cümlenin anlamı değişir."},"sources":["إظهار الأسرار (البيركوي)","قواعد الإعراب (ابن هشام)","العوامل المائة (الجرجاني)"],"question":{"tr":["Ne olduğu hâlde? (hâliye ise)"],"en":["While in what state? (if haliyya)"]},"examples":[{"ar":"وَرَجَعَ يُوسُفُ إِلَى الْبَصْرَةِ، وَفِي قَلْبِهِ وَصِيَّةُ مُعَلِّمِهِ.","gloss":{"en":"Yusuf returned to Basra — WHILE his teacher's testament lay in his heart (waw haliyya; the clause is a hal in nasb position).","tr":"Yusuf, hocasının vasiyeti kalbinde OLDUĞU HÂLDE Basra'ya döndü (vav-ı hâliye; cümle, hâl olarak mahallen mensub)."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"وَكُونُوا عَوْنَ هَذَا الْعَبْدِ دَهْرًا.","gloss":{"en":"«And be this servant's helper…» — a joining waw tying imperative to imperative; the waw INSIDE كُونُوا is the plural pronoun, kana's noun.","tr":"«Ve bu kulun yardımcısı olun…» — emri emre bağlayan atıf vavı; كُونُوا'nun İÇİNDEKİ vav ise cemaat zamiri, «kâne»nin ismidir."},"src":"bad-al-amali"},{"ar":"وَاللَّهِ لَأَفْعَلَنَّ.","gloss":{"en":"«By Allah, I will surely do it» — the oath waw, a jarr letter (Jurjani counts it among the seventeen).","tr":"«Vallahi mutlaka yapacağım» — kasem vavı, bir cer harfidir (Cürcânî on yedi harfin içinde sayar)."},"src":null}],"mistakes":[{"wrong":"وَفِي قَلْبِهِ وَصِيَّةُ مُعَلِّمِهِ — «الْوَاوُ عَاطِفَةٌ»","right":"وَفِي قَلْبِهِ وَصِيَّةُ مُعَلِّمِهِ — «الْوَاوُ حَالِيَّةٌ»","why":{"en":"Calling this waw a conjunction leaves the clause dangling — joined to what, sharing which case? The clause describes Yusuf's STATE while returning, so the waw is haliyya and the whole clause is a hal in nasb position. The «while»-substitution test decides it.","tr":"Bu vava atıf demek cümleyi boşta bırakır — neye bağlanıyor, hangi i'rabı paylaşıyor? Cümle Yusuf'un dönerkenki HÂLİNİ anlatır; öyleyse vav hâliyedir ve cümle bütünüyle mahallen mensub hâldir. «-iken» koyma denemesi bunu kestirir."}},{"wrong":"جَاءَ الطُّلَّابُ وَالْمُعَلِّمَ — «الْوَاوُ عَاطِفَةٌ»","right":"جَاءَ الطُّلَّابُ وَالْمُعَلِّمَ — «وَاوُ الْمَعِيَّةِ»","why":{"en":"The fatha on الْمُعَلِّمَ betrays the waw: a joining waw would share the fa'il's damma. Nasb after the waw marks accompaniment — «the students came ALONG WITH the teacher» — the maf'ul ma'ah.","tr":"الْمُعَلِّمَ'deki fetha vavı ele verir: atıf vavı olsa fâilin zammesini paylaşırdı. Vavdan sonraki nasb maiyyet gösterir — «öğrenciler öğretmenLE BİRLİKTE geldi» — mef'ûlün maah."}}]},"anwa-ma":{"title":{"ar":"أَنْوَاعُ «مَا» — الْوُجُوهُ الِاثْنَا عَشَرَ","en":"The kinds of ma — its twelve readings","tr":"«Mâ»nın çeşitleri — on iki vecih"},"level":4,"group":"nahw","explanation":{"en":"Ibn Hisham gives مَا its own chapter because nothing else in the language carries so many jobs on one spelling. As a NOUN it is: (1) the relative مَا الْمَوْصُولَة — «that which»; (2) the conditional مَا الشَّرْطِيَّة, putting two verbs in jazm (مَا تَفْعَلْ مِنْ خَيْرٍ يَعْلَمْهُ اللهُ); (3) the interrogative مَا الِاسْتِفْهَامِيَّة (مَا هٰذَا؟); (4) the ma of wonder مَا التَّعَجُّبِيَّة, which needs أَفْعَلَ after it and a mansub noun after that (مَا أَحْسَنَ زَيْدًا!); (5) the described indefinite مَا النَّكِرَة الْمَوْصُوفَة (مَرَرْتُ بِمَا مُعْجِبٍ لَكَ); (6) the bare indefinite مَا النَّكِرَة التَّامَّة, «a thing», which needs no description after it (نِعِمَّا); and (7) the tamma/naqisa split, which belongs to this indefinite ma — tamma when it stands alone, naqisa when a description completes it. As a PARTICLE: (8) the plain negation مَا النَّافِيَة; (9) the Hijazi negation مَا الْحِجَازِيَّة, which works like لَيْسَ — raf' on its noun, NASB on its khabar (مَا هٰذَا بَشَرًا); (10) the masdar-maker مَا الْمَصْدَرِيَّة (عَجِبْتُ مِمَّا صَنَعْتَ = مِنْ صُنْعِكَ); (11) the same with a time sense, مَا الْمَصْدَرِيَّة الظَّرْفِيَّة (مَا دُمْتُ حَيًّا = مُدَّةَ دَوَامِي); and (12) the restraining مَا الْكَافَّة, which disarms the governor it sits on — إِنَّمَا, رُبَّمَا, قَلَّمَا — plus the plain extra مَا الزَّائِدَة. The Atölye's sentence analyzer applies these signals live: it names the reading AND the neighbour that proposed it, and offers the runners-up when the signal is weak.","tr":"İbn Hişâm «mâ»ya müstakil bir bâb ayırır; çünkü dilde tek yazılışla bu kadar görev taşıyan başka kelime yoktur. İSİM olarak: (1) mevsûle mâ — «o şey ki»; (2) şart mâsı, iki fiili cezmeder (مَا تَفْعَلْ مِنْ خَيْرٍ يَعْلَمْهُ اللهُ); (3) istifham mâsı (مَا هٰذَا؟); (4) taaccüb mâsı — ardından أَفْعَلَ, ondan sonra mensub isim ister (مَا أَحْسَنَ زَيْدًا!); (5) mevsûfe nekre mâ (مَرَرْتُ بِمَا مُعْجِبٍ لَكَ); (6) tâmme nekre mâ — «bir şey», ardından sıfat istemez (نِعِمَّا); (7) tâmme/nâkısa ayrımı, ki bu ayrım NEKRE mâya aittir: tek başına dururken tâmme, bir sıfat onu tamamlarken nâkısadır. HARF olarak: (8) sade nefiy mâsı; (9) hicâzî nefiy mâsı — leyse gibi amel eder, ismini ref haberini NASB eder (مَا هٰذَا بَشَرًا); (10) masdariyye mâ (عَجِبْتُ مِمَّا صَنَعْتَ = مِنْ صُنْعِكَ); (11) zarfiyye masdariyye (مَا دُمْتُ حَيًّا = مُدَّةَ دَوَامِي); (12) kâffe mâ — üzerine bindiği âmilin amelini keser: إِنَّمَا، رُبَّمَا، قَلَّمَا — ve zâid mâ. Atölye'deki cümle çözücü bu işaretleri canlı uygular: hem vechi hem onu öneren komşuyu söyler, işaret zayıfsa diğer ihtimalleri de sıralar."},"plain":{"en":"One spelling, twelve jobs. Seven times a NOUN, five times a PARTICLE — and only the neighbours tell you which.","tr":"Tek yazılış, on iki görev. Yedisinde İSİM, beşinde HARF — hangisi olduğunu ancak komşuları söyler."},"sources":["قواعد الإعراب (ابن هشام)","مغني اللبيب (ابن هشام)","الكافية (ابن الحاجب)"],"question":{"tr":["Sonrasında fiil mi var? Nefiy yahut şart olabilir.","«O şey ki» diye çevrilebiliyor mu? Mevsûldür.","Bir âmilin üstüne mi binmiş? Kâffedir."],"en":["Does a verb follow? Then negation — or the conditional.","Can you read it «that which»? Then it is the relative.","Does it ride a governor? Then it is the restraining ma."]},"examples":[{"ar":"مَا أَحْسَنَ زَيْدًا!","gloss":{"en":"Wonder: أَفْعَلَ follows, and the noun after it is mansub — that pair is the signature.","tr":"Taaccüb: ardından أَفْعَلَ, ondan sonraki isim mensub — bu ikili onun imzasıdır."},"src":null},{"ar":"مَا هٰذَا بَشَرًا.","gloss":{"en":"Hijazi: a noun follows and the khabar is MANSUB — that accusative is this ma's own work, exactly as laysa would do it.","tr":"Hicâzî: ardından isim, haberi MENSUB — o mensub, bu mânın kendi amelidir; tıpkı leyse gibi."},"src":null},{"ar":"إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ.","gloss":{"en":"Restraining: it rides إِنَّ and disarms it — الْأَعْمَالُ stands in raf' as a plain mubtada, not in nasb.","tr":"Kâffe: إِنَّ'nin üzerine binip amelini keser — الْأَعْمَالُ mensub değil, sade mübteda olarak merfûdur."},"src":"deeds-are-by-intentions"},{"ar":"فَبِمَا رَحْمَةٍ مِنَ اللهِ لِنْتَ لَهُمْ.","gloss":{"en":"Extra ma: رَحْمَةٍ is majrur by the ba itself — the ma between them governs nothing at all.","tr":"Zâid mâ: رَحْمَةٍ bizzat bâ ile mecrurdur — aradaki mâ hiçbir amel etmez."},"src":null},{"ar":"عَمَّ يَتَسَاءَلُونَ؟","gloss":{"en":"The alif of ما is elided after the jarr letter — a contraction that happens ONLY when the ma is interrogative.","tr":"Cer harfinden sonra مَا'nın elifi düşmüştür — bu hazif YALNIZ mâ istifhâmiyye olduğunda olur."},"src":null}],"mistakes":[{"wrong":"مَا هٰذَا بَشَرٌ","right":"مَا هٰذَا بَشَرًا","why":{"en":"If the ma is the Hijazi one, it governs: its khabar takes nasb. Leaving the khabar in raf' is the Tamimi dialect's reading, in which ma governs nothing — a different choice, not a free one.","tr":"Mâ hicâzî ise amel eder: haberi mansub olur. Haberi merfû bırakmak Temîm lehçesinin okuyuşudur; orada mâ amel etmez — bu başka bir tercihtir, serbestlik değil."}},{"wrong":"إِنَّمَا الْأَعْمَالَ بِالنِّيَّاتِ","right":"إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ","why":{"en":"The kaffa ma has already disarmed إِنَّ; there is no governor left to put الأعمال in nasb.","tr":"Kâffe mâ إِنَّ'nin amelini çoktan kesmiştir; الأعمال'i nasbedecek âmil kalmamıştır."}}]},"at-tahdhir":{"title":{"ar":"التَّحْذِير (إِيَّاكَ وَ...)","en":"The tahdhir (warning) construction","tr":"Tahzîr (إِيَّاكَ وَ...)"},"level":4,"group":"nahw","explanation":{"en":"Tahdhir is warning the listener away from something. Its most famous vehicle is إِيَّاكَ: a detached object pronoun that is the object of a verb left unsaid — «احْذَرْ» (beware!). The thing warned against (الْمُحَذَّر مِنْه) then follows, and it too is mansub as the object of that same hidden verb. When a وَ links them — إِيَّاكَ وَالْكَذِبَ — the noun after the و takes nasb (احْذَرِ الْكَذِبَ). This testament opens counsel after counsel with it: إِيَّاكَ وَالْكَذِبَ، إِيَّاكَ وَكَثْرَةَ الْكَلَامِ. The ـكَ is a particle of address (حَرْف خِطَاب) and changes with the addressee: إِيَّاكِ (to a woman), إِيَّاكُمْ (to a group).","tr":"Tahzir, muhatabı bir şeyden sakındırmaktır. En meşhur kalıbı إِيَّاكَ'dir: hazfedilmiş bir fiilin («احْذَرْ» = sakın!) mef'ûlü olan munfasıl nasb zamiri. Sakındırılan şey (muhazzerun minh) ardından gelir ve o da aynı gizli fiilin mef'ûlü olarak mansubdur. Aralarını bir وَ bağladığında — إِيَّاكَ وَالْكَذِبَ — و'dan sonraki isim nasb alır (احْذَرِ الْكَذِبَ). Bu vasiyet öğüt üstüne öğüdü bununla açar: إِيَّاكَ وَالْكَذِبَ، إِيَّاكَ وَكَثْرَةَ الْكَلَامِ. ـكَ hitap harfidir ve muhataba göre değişir: إِيَّاكِ (bir kadına), إِيَّاكُمْ (topluluğa)."},"plain":{"en":"Warning someone away from something — إِيَّاكَ, «watch out!» — where the verb «beware» is left unsaid.","tr":"Birini bir şeyden sakındırmak — إِيَّاكَ, «sakın!» — «sakın» fiili söylenmeden bırakılır."},"mamul":"mansub","sources":["الكافية (ابن الحاجب)","قطر الندى (ابن هشام)","إظهار الأسرار (البيركوي)"],"examples":[{"ar":"وَإِيَّاكَ وَالْكَذِبَ بَيْنَ يَدَيْهِ.","gloss":{"en":"And beware of lying in his presence — «lying» is mansub, object of the implied «beware».","tr":"Onun huzurunda yalandan sakın — «yalan», gizli «sakın» fiilinin mansub mef'ûlüdür."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"وَإِيَّاكَ وَكَثْرَةَ الْكَلَامِ بَيْنَ يَدَيْهِ.","gloss":{"en":"And beware of talking too much before him.","tr":"Onun huzurunda çok konuşmaktan sakın."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"إِيَّاكَ وَالْأَسَدَ.","gloss":{"en":"Beware of the lion! — the schoolbook example of tahdhir.","tr":"Aslandan sakın! — tahzîrin ders kitabı örneği."},"src":null}],"mistakes":[{"wrong":"إِيَّاكَ وَالْكَذِبُ","right":"إِيَّاكَ وَالْكَذِبَ","why":{"en":"The thing warned against is mansub — it is the object of the hidden «beware», not a subject. Learners leave the damma out of habit.","tr":"Sakındırılan şey mansubdur — gizli «احذر»in mef'ûlüdür, fâil değil. Öğrenciler alışkanlıkla ötreyi bırakır."}},{"wrong":"اِحْذَرْ إِيَّاكَ مِنَ الْكَذِبِ","right":"إِيَّاكَ وَالْكَذِبَ","why":{"en":"Do not add an explicit «beware»: إِيَّاكَ already stands in for it. Nor does it need مِنْ — the classical construction is إِيَّاكَ وَ + a mansub noun.","tr":"Açık bir «احذر» ekleme: إِيَّاكَ zaten onun yerini tutar. مِنْ'e de gerek yok — klasik kalıp إِيَّاكَ وَ + mansub isimdir."}},{"wrong":"إِيَّاكُمْ وَالْكَذِبَ (لِمُخَاطَبٍ وَاحِدٍ)","right":"إِيَّاكَ وَالْكَذِبَ","why":{"en":"The attached ـكَ must agree with the addressee: singular masculine is كَ, not the plural كُمْ.","tr":"Bitişik ـكَ muhataba uymalıdır: tekil müzekker كَ'dir, çoğul كُمْ değil."}}]},"atf-bayan":{"title":{"ar":"عَطْفُ الْبَيَان","en":"Explicative apposition (atf al-bayan)","tr":"Atf-ı beyân"},"level":5,"group":"nahw","explanation":{"en":"Atf al-bayan is a follower that clarifies what precedes it — like an adjective in office, but a NOUN in form rather than a derived word. It agrees with what it follows in case, definiteness, gender and number: أَقْسَمَ بِاللَّهِ أَبُو حَفْصٍ عُمَرُ, where عُمَرُ names the man whose kunya was just given. The classical difficulty is telling it from badal, since both are nouns following nouns. The usual test: a badal is meant to STAND IN for what precedes it — you could drop the first word and the sentence would still work — whereas atf al-bayan is meant only to explain, and dropping the first would lose the point. Birgivi lists it fifth and last among the tawabi'.","tr":"Atf-ı beyân, kendinden öncekini açıklayan bir tâbidir — görev bakımından sıfat gibi, fakat şekil bakımından müştak değil CÂMİD bir isimdir. Tâbi olduğu kelimeye i'rabda, marifelikte, cinsiyette ve sayıda uyar: أَقْسَمَ بِاللَّهِ أَبُو حَفْصٍ عُمَرُ; burada عُمَرُ, künyesi az önce verilen zatın adını bildirir. Klasik güçlük, onu bedelden ayırmaktır; çünkü ikisi de isimden sonra gelen isimdir. Alışılmış ölçü: bedel, öncekinin YERİNE geçmek üzere getirilir — birinci kelime düşse cümle yine işler; atf-ı beyân ise yalnız açıklamak için gelir, birinci düşerse maksat kaybolur. Birgivî onu tâbilerin beşincisi ve sonuncusu olarak sayar."},"plain":{"en":"A noun put straight after another to say more exactly who is meant: «Abu Hafs, Umar».","tr":"Kimin kastedildiğini daha açık söylemek için hemen ardından gelen isim: «Ebû Hafs, Ömer»."},"mamul":"tabai","sources":["العوامل (البيركوي) — التوابع","إظهار الأسرار (البيركوي)","الكافية (ابن الحاجب)"],"examples":[{"ar":"أَقْسَمَ بِاللَّهِ أَبُو حَفْصٍ عُمَرُ.","gloss":{"en":"Abu Hafs — Umar — swore by Allah. The name explains the kunya; both are marfu'.","tr":"Ebû Hafs — Ömer — Allah'a yemin etti. İsim künyeyi açıklar; ikisi de merfûdur."},"src":null},{"ar":"ذَهَبَ إِلَى مُعَلِّمِهِ أَبِي حَنِيفَةَ.","gloss":{"en":"He went to his teacher, Abu Hanifa — the same shape the wasiyya uses, there analyzed as badal.","tr":"Hocası Ebû Hanîfe'ye gitti — vasiyetteki aynı yapı, orada bedel olarak tahlil edilmiştir."},"src":null},{"ar":"جَاءَ أَخُوكَ زَيْدٌ.","gloss":{"en":"Your brother — Zayd — came.","tr":"Kardeşin — Zeyd — geldi."},"src":null}],"mistakes":[{"wrong":"أقسم بالله أبو حفصٍ عمرًا","right":"أَقْسَمَ بِاللَّهِ أَبُو حَفْصٍ عُمَرُ","why":{"en":"Atf al-bayan is a tabi': it copies the case of what it explains. Here that word is the marfu' subject, so the name is marfu' too.","tr":"Atf-ı beyân bir tâbidir: açıkladığı kelimenin i'rabını alır. Burada o kelime merfû fâildir, dolayısıyla isim de merfûdur."}},{"wrong":"جاء الرجلُ الكريمُ (على أنه عطف بيان)","right":"عَطْفُ الْبَيَانِ يَكُونُ جَامِدًا","why":{"en":"A derived word like «generous» following a noun is a na't, not atf al-bayan. Atf al-bayan is a solid noun — a name or the like.","tr":"İsimden sonra gelen «kerîm» gibi müştak bir kelime na't'tır, atf-ı beyân değildir. Atf-ı beyân câmid bir isimdir — özel isim ve benzeri."}},{"wrong":"عدّ كل اسمٍ بعد اسمٍ بدلًا","right":"الْفَرْقُ بِالْقَصْدِ: الْبَدَلُ مَقْصُودٌ بِالْحُكْمِ، وَعَطْفُ الْبَيَانِ لِلتَّوْضِيحِ","why":{"en":"Not every noun after a noun is badal. Ask what is intended: if the second is what the ruling really falls on, it is badal; if it merely clarifies the first, it is atf al-bayan.","tr":"İsimden sonra gelen her isim bedel değildir. Maksada bakılır: hüküm gerçekte ikinciye aitse bedeldir; yalnız birinciyi açıklıyorsa atf-ı beyândır."}}]},"atf-nasaq":{"title":{"ar":"عَطْفُ النَّسَق","en":"Coupling (atf al-nasaq)","tr":"Atf-ı nesak (bağlama)"},"level":2,"group":"nahw","explanation":{"en":"Coupling joins a second word to a first through one of the letters of atf, and the second then takes the FIRST'S CASE — it is governed «by way of following» (بِالتَّبَعِيَّةِ), which is why Birgivi puts it among the tawabi' rather than among the governed-by-a-word. The Awamil lists ten letters: وَ (mere joining), فَ (joining with sequence), ثُمَّ (sequence with delay), حَتَّى (up to and including), أَوْ and إِمَّا (alternatives), أَمْ (in questions), لَا and بَلْ and لَكِنْ (correcting or setting aside). The rule to hold onto is that the conjunct copies whatever case the first word had: after a mansub it is mansub, after a majrur it is majrur.","tr":"Atf, ikinci bir kelimeyi atıf harflerinden biriyle birinciye bağlar; ikinci kelime böylece BİRİNCİNİN İ'RABINI alır — «tebe'iyyet yoluyla» âmillenmiştir; Birgivî'nin onu bir kelimeyle âmillenenler arasında değil, tâbiler arasında sayması bundandır. Avâmil on harf sayar: وَ (mutlak bağlama), فَ (tertip ile), ثُمَّ (tertip ve mühlet ile), حَتَّى (gaye ile), أَوْ ve إِمَّا (tercih), أَمْ (soruda), لَا ile بَلْ ve لَكِنْ (idrâb ve istidrâk). Akılda tutulacak kural: ma'tûf, birincinin i'rabını kopyalar — mansubdan sonra mansub, mecrûrdan sonra mecrûr olur."},"plain":{"en":"Joining words with «and», «or», «then». The joined word copies the case of the one before it.","tr":"Kelimeleri «ve», «veya», «sonra» ile bağlamak. Bağlanan kelime, öncekinin i'rabını alır."},"mamul":"tabai","sources":["العوامل (البيركوي) — التوابع","إظهار الأسرار (البيركوي)","قطر الندى (ابن هشام)"],"examples":[{"ar":"وَاعْمَلْ بِهَا يَنْفَعْكَ اللَّهُ بِعِلْمِكَ.","gloss":{"en":"And act upon it — the وَ couples this command to the one before it.","tr":"Ve onunla amel et — vâv bu emri öncekine bağlar."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"لِمَصْلَحَتِكَ وَمَصْلَحَةِ الْمُسْلِمِينَ.","gloss":{"en":"For your good and the good of the Muslims — the conjunct copies the jarr of the first.","tr":"Senin ve Müslümanların iyiliği için — matûf, birincinin cerrini alır."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"جَاءَ زَيْدٌ فَعَمْرٌو ثُمَّ بَكْرٌ.","gloss":{"en":"Zayd came, then Amr, then later Bakr — فَ marks immediate sequence, ثُمَّ a delayed one.","tr":"Zeyd geldi, sonra Amr, sonra da Bekir — فَ hemen ardından, ثُمَّ araya zaman girerek."},"src":null}],"mistakes":[{"wrong":"مررتُ بزيدٍ وعمرٌو","right":"مَرَرْتُ بِزَيْدٍ وَعَمْرٍو","why":{"en":"The conjunct follows the first word's case. After a majrur it must be majrur, not raf'.","tr":"Ma'tûf, birincinin i'rabına uyar. Mecrûrdan sonra mecrûr olmalıdır, merfû değil."}},{"wrong":"رأيتُ زيدًا وعمرٌ","right":"رَأَيْتُ زَيْدًا وَعَمْرًا","why":{"en":"Same rule after a mansub: the conjunct takes nasb.","tr":"Mansubdan sonra da aynı kural: ma'tûf nasb alır."}},{"wrong":"جاء زيدٌ ثُمَّ عمرٌو فورًا","right":"جَاءَ زَيْدٌ فَعَمْرٌو","why":{"en":"ثُمَّ carries a gap in time; for «immediately after», the letter is فَ.","tr":"ثُمَّ arada mühlet bulunduğunu bildirir; «hemen ardından» için فَ kullanılır."}}]},"augmented-babs":{"title":{"ar":"النَّقْلُ إِلَى الْأَبْوَابِ الْمَزِيدَة","en":"Deriving a root through the augmented babs","tr":"Bablara nakil — mezîd bablar"},"level":4,"group":"sarf","explanation":{"en":"The madrasah exercise called «bablara nakil» takes one bare triliteral and runs it through every augmented pattern in turn. With ضَرَبَ: أَضْرَبَ (IV), ضَرَّبَ (II), ضَارَبَ (III), اِنْضَرَبَ (VII), اِضْطَرَبَ (VIII), اِضْرَبَّ (IX), تَضَرَّبَ (V), تَضَارَبَ (VI), اِسْتَضْرَبَ (X), and the three rare ones اِضْرَوْرَبَ, اِضْرَوَّبَ, اِضْرَابَّ. The point is NOT that all twelve are words anyone uses — most are not. The point is the wazn: once you can pour any root into any mould, you can read a form you have never met and know what it is doing. Each mould carries a meaning. أَفْعَلَ and فَعَّلَ make a verb transitive or intensive; فَاعَلَ does the act WITH someone; اِنْفَعَلَ and تَفَعَّلَ are مُطَاوَعَة, submitting to an act done to you; اِفْتَعَلَ does it for oneself; تَفَاعَلَ is mutual; اِسْتَفْعَلَ asks or seeks; اِفْعَلَّ and اِفْعَالَّ are for colours and bodily defects. Watch اِضْطَرَبَ: the ت of bab VIII turns into ط after ض, which is a sound change, not a different bab.","tr":"Medresede «bablara nakil» denen alıştırma, bir sülâsî mücerredi bütün mezîd vezinlere sırayla döker. ضَرَبَ ile: أَضْرَبَ، ضَرَّبَ، ضَارَبَ، اِنْضَرَبَ، اِضْطَرَبَ، اِضْرَبَّ، تَضَرَّبَ، تَضَارَبَ، اِسْتَضْرَبَ ve nadir üçü اِضْرَوْرَبَ، اِضْرَوَّبَ، اِضْرَابَّ. Maksat on ikisinin de kullanılan kelime olması DEĞİLDİR — çoğu değildir. Maksat vezindir: her kökü her kalıba dökebilirseniz, hiç görmediğiniz bir şekli okuyup ne yaptığını bilirsiniz. Her kalıbın bir manası vardır. أَفْعَلَ ve فَعَّلَ fiili müteaddî yahut mübalağalı kılar; فَاعَلَ işi biriyle BERABER yapmaktır; اِنْفَعَلَ ve تَفَعَّلَ mutâvaattır; اِفْتَعَلَ işi kendi nefsi için yapmaktır; تَفَاعَلَ müşârekedir; اِسْتَفْعَلَ talep ifade eder; اِفْعَلَّ ve اِفْعَالَّ renk ve kusurlar içindir. اِضْطَرَبَ'ye dikkat: iftiâl bâbının tâsı ض'dan sonra ط'ya döner; bu ses hâdisesidir, ayrı bir bab değildir."},"plain":{"en":"Arabic grows new verbs out of one root by adding letters to it, and each pattern adds a predictable shade: making someone do it, doing it to each other, asking for it.","tr":"Arapça tek bir kökten harf ekleyerek yeni fiiller türetir; her kalıp manaya tahmin edilebilir bir şey katar: yaptırma, karşılıklı yapma, isteme."},"sources":["بناء الأفعال","مراح الأرواح","المقصود"],"examples":[{"ar":"عَلَّمَ — بَابُ التَّفْعِيلِ مِنْ «عَلِمَ».","gloss":{"en":"«He taught» — Form II turns «he knew» into causing someone else to know.","tr":"«Öğretti» — tef'îl bâbı «bildi»yi «başkasına bildirdi»ye çevirir."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"جَادَلَ — بَابُ الْمُفَاعَلَةِ مِنْ «جَدَلَ».","gloss":{"en":"«He disputed with» — Form III is the act done WITH another party.","tr":"«Tartıştı» — mufâale bâbı işi bir başkasıyla BERABER yapmaktır."},"src":"wasiyyat-abi-hanifa-L4"},{"ar":"اِسْتَفْتَى — بَابُ الِاسْتِفْعَالِ مِنْ «فَتَا».","gloss":{"en":"«He asked for a fatwa» — Form X is asking for the thing the root names.","tr":"«Fetva istedi» — istif'âl bâbı, kökün adlandırdığı şeyi talep etmektir."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"تَبَاعَدَ — بَابُ التَّفَاعُلِ مِنْ «بَعُدَ».","gloss":{"en":"«He kept his distance» — Form VI, two sides in the act at once.","tr":"«Uzak durdu» — tefâul bâbı, işte iki tarafın birden bulunmasıdır."},"src":"wasiyyat-abi-yusuf-L5"}],"mistakes":[{"wrong":"اِضْتَرَبَ","right":"اِضْطَرَبَ","why":{"en":"After the emphatic ض the ت of bab VIII becomes ط. The same happens after ص, ط and ظ — اِصْطَبَرَ, not اِصْتَبَرَ.","tr":"Tefhim harfi ض'dan sonra iftiâl bâbının tâsı ط olur. ص، ط، ظ'dan sonra da böyledir: اِصْطَبَرَ، اِصْتَبَرَ değil."}},{"wrong":"أَعَلَّمَ الْأُسْتَاذُ الطَّالِبَ","right":"عَلَّمَ الْأُسْتَاذُ الطَّالِبَ","why":{"en":"One augmentation is enough. Form II and Form IV both make the verb transitive; stacking them is not a form.","tr":"Bir ziyade yeterlidir. Fiili müteaddî yapmak için hem tef'îl hem if'âl kullanılmaz; böyle bir vezin yoktur."}},{"wrong":"تَرْجَمَ — بَابُ التَّفَعُّلِ","right":"تَرْجَمَ رُبَاعِيٌّ مُجَرَّدٌ عَلَى «فَعْلَلَ»","why":{"en":"Not every initial ت is the ت of Form V. تَرْجَمَ is a bare quadriliteral on فَعْلَلَ, and its root has four letters.","tr":"Baştaki her تا tefe'ul tâsı değildir. تَرْجَمَ, فَعْلَلَ vezninde rubâî mücerreddir ve kökü dört harflidir."}}]},"badal":{"title":{"ar":"الْبَدَل","en":"Badal (apposition / substitution)","tr":"Bedel"},"level":2,"group":"nahw","explanation":{"en":"The badal is one of the four followers (التوابع): a noun that follows the word before it (the مُبْدَل مِنْه) and takes the very same case — raf', nasb, or jarr. It is \"the intended one\": you could delete the first noun and the badal alone would carry the meaning. The commonest kind is بَدَل كُلٍّ مِنْ كُلٍّ (total apposition), where the two words name the same thing — «مَدِينَتِهِ الْبَصْرَةِ» (his city, [namely] Basra) and «مُعَلِّمِهِ أَبِي حَنِيفَةَ» (his teacher, [namely] Abu Hanifa). Because the badal merely follows, whatever case the first noun has, the badal copies: both majrur here. Other kinds are بَدَل بَعْضٍ مِنْ كُلٍّ (part from whole) and بَدَل اشْتِمَال (of inclusion). Ibn Hisham treats the badal among the التوابع in Qatr al-Nada, as does Ibn Ajurrum in the Ajurrumiyya.","tr":"Bedel, dört tâbiden (uyanlar) biridir: kendinden önceki kelimeye (mübdelün minh) uyan ve onun i'rabını (ref, nasb, cer) aynen alan isimdir. Bedel asıl kastedilen kelimedir; birinciyi silsen, bedel tek başına manayı taşır. En yaygın türü bedel-i küll min küll'dür (mutabık bedel): iki kelime aynı şeyi gösterir — «مَدِينَتِهِ الْبَصْرَةِ» (şehri, yani Basra) ve «مُعَلِّمِهِ أَبِي حَنِيفَةَ» (hocası, yani Ebu Hanife). Bedel tâbi olduğu için, birinci ismin i'rabı ne ise onu alır: burada her ikisi de mecrurdur. Diğer türleri bedel-i ba'z min küll ve bedel-i iştimâldir. İbn Hişâm Katru'n-Nedâ'da bedeli tevâbi arasında ele alır."},"plain":{"en":"A word that steps in for the one before it and takes over its job: «the causes are three — sense, report, intellect».","tr":"Kendinden öncekinin yerine geçip onun vazifesini üstlenen kelime: «sebepler üçtür: havâss, haber, akıl»."},"mamul":"tabai","sources":["الآجُرُّومِيَّة (ابن آجُرُّوم)","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"examples":[{"ar":"أَرَادَ أَنْ يَرْجِعَ إِلَى مَدِينَتِهِ الْبَصْرَةِ.","gloss":{"en":"He wanted to return to his city, Basra — الْبَصْرَةِ is badal of مَدِينَتِهِ, majrur like it.","tr":"Şehri Basra'ya dönmek istedi — الْبَصْرَةِ, مَدِينَتِهِ'nin bedelidir, onun gibi mecrûrdur."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"ذَهَبَ إِلَى مُعَلِّمِهِ أَبِي حَنِيفَةَ.","gloss":{"en":"He went to his teacher, Abu Hanifa — أَبِي is badal of مُعَلِّمِهِ, in jarr (shown by ي, a five-noun).","tr":"Hocası Ebû Hanîfe'ye gitti — أَبِي, مُعَلِّمِهِ'nin bedelidir, cerri yâ iledir (esmâ-i hamse)."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"جَاءَ الْخَلِيفَةُ عُمَرُ.","gloss":{"en":"The caliph Umar came — عُمَرُ is badal of الْخَلِيفَةُ, marfu' like it.","tr":"Halife Ömer geldi — عُمَرُ, الْخَلِيفَةُ'nun bedelidir, onun gibi merfûdur."},"src":null}],"mistakes":[{"wrong":"إِلَى مَدِينَتِهِ الْبَصْرَةُ","right":"إِلَى مَدِينَتِهِ الْبَصْرَةِ","why":{"en":"The badal must copy the case of the word it follows. Since مَدِينَتِهِ is majrur after إلى, الْبَصْرَة must be majrur too — kasra, not the raf' damma learners default to.","tr":"Bedel, uyduğu kelimenin i'rabını almalıdır. مَدِينَتِهِ, إلى'den sonra mecrur olduğu için الْبَصْرَة da mecrur olmalı — kesre, öğrencilerin alışkanlıkla verdiği ref ötresi değil."}},{"wrong":"ذَهَبَ إِلَى مُعَلِّمِهِ أَبُو حَنِيفَةَ","right":"ذَهَبَ إِلَى مُعَلِّمِهِ أَبِي حَنِيفَةَ","why":{"en":"أب as a badal here is majrur, so among the five nouns its jarr sign is ي (أَبِي), never the raf' و (أَبُو). Mistaking the badal for a fresh subject produces أبو.","tr":"Buradaki bedel olan أب mecrurdur; esmâ-i hamseden olduğu için cer alâmeti ي'dir (أَبِي), ref و'ı (أَبُو) değil. Bedeli yeni bir özne sanmak أبو hatasına yol açar."}}]},"damir-fasl":{"title":{"ar":"ضَمِيرُ الْفَصْل","en":"The pronoun of separation","tr":"Zamîr-i fasl"},"level":5,"group":"nahw","explanation":{"en":"Between a definite mubtada and a definite khabar the language inserts a detached pronoun — هُوَ, هِيَ, هُمْ — that is not a word in the sentence at all. It has no case position (لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ) and no meaning of its own; its job is to stop the reader from taking the second definite noun as a further adjective. «الْمُحْدَثُ الْمُخْرَجُ…» would read as «the originated brought-out thing…», a phrase still waiting for its predicate; «الْمُحْدَثُ هُوَ الْمُخْرَجُ…» is a complete statement: «the originated IS what is brought out». That is exactly the work of the English «is» in a definition, and it is why the creed's ta'rifat use it so heavily. It also adds restriction — «the atom is THE part that admits of no division», and nothing else is.","tr":"Marife mübteda ile marife haber arasına, cümlenin öğesi olmayan munfasıl bir zamir — هُوَ، هِيَ، هُمْ — girer. İ'rabdan mahalli yoktur ve müstakil bir manası da yoktur; görevi, ikinci marife ismin sıfat sanılmasını önlemektir. «الْمُحْدَثُ الْمُخْرَجُ…» dendiğinde «çıkarılmış olan hâdis…» diye okunur ve cümle hâlâ haberini bekler; «الْمُحْدَثُ هُوَ الْمُخْرَجُ…» ise tam bir hükümdür: «Hâdis, çıkarılan şeyDİR». Ta'rif cümlelerinde bu kadar sık geçmesinin sebebi budur. Ayrıca hasr da katar: «cevher, bölünemeyen cüzDÜR», başkası değil."},"plain":{"en":"A pronoun dropped between the topic and what is said about it, purely to stop you reading the second word as an adjective. It means nothing by itself.","tr":"İkinci kelimeyi sıfat sanmayasınız diye mübteda ile haber arasına konan zamir. Kendi başına bir mana taşımaz."},"sources":["الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"examples":[{"ar":"وَالْمُحْدَثُ هُوَ الْمُخْرَجُ مِنَ الْعَدَمِ إِلَى الْوُجُودِ.","gloss":{"en":"The originated is that which is brought out from non-existence into existence.","tr":"Hâdis, yokluktan varlığa çıkarılan şeydir."},"src":"aqaid-ahl-al-sunna"},{"ar":"إِنَّ طَرِيقَ النَّجَاةِ هُوَ مُتَابَعَةُ أَهْلِ السُّنَّةِ وَالْجَمَاعَةِ.","gloss":{"en":"The path of deliverance is following Ahl al-Sunna wa'l-Jama‘a — the fasl pronoun also appears after إِنَّ.","tr":"Kurtuluş yolu Ehl-i Sünnet ve'l-Cemaat'e tâbi olmaktır — zamîr-i fasl إِنَّ'den sonra da gelir."},"src":"aqaid-ahl-al-sunna"},{"ar":"وَالْخَبَرُ الْمُتَوَاتِرُ هُوَ الْخَبَرُ الثَّابِتُ عَلَى أَلْسِنَةِ قَوْمٍ.","gloss":{"en":"The mass-transmitted report is the report established upon the tongues of a people.","tr":"Mütevâtir haber, bir topluluğun dilleriyle sabit olan haberdir."},"src":"aqaid-ahl-al-sunna"}],"mistakes":[{"wrong":"زَيْدٌ هُوَ الْقَائِمُ — «هُوَ» مُبْتَدَأٌ ثَانٍ","right":"«هُوَ» ضَمِيرُ فَصْلٍ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ","why":{"en":"The fasl pronoun is not an element of the sentence. Parsing it as a second mubtada leaves the first without a khabar.","tr":"Zamîr-i fasl cümlenin öğesi değildir. İkinci mübteda sayılırsa birinci mübteda habersiz kalır."}},{"wrong":"جَاءَ رَجُلٌ هُوَ كَرِيمٌ (فَصْلًا)","right":"لَا يُؤْتَى بِضَمِيرِ الْفَصْلِ إِلَّا بَيْنَ مَعْرِفَتَيْنِ (أَوْ مَا يُشْبِهُ الْمَعْرِفَةَ)","why":{"en":"The fasl pronoun belongs between two definites. After an indefinite there is nothing to separate — no adjective reading was possible.","tr":"Zamîr-i fasl iki marife arasında gelir. Nekreden sonra ayrılacak bir şey yoktur; sıfat okunuşu zaten söz konusu değildir."}}]},"doubled-verbs":{"title":{"ar":"الْفِعْلُ الْمُضَاعَف","en":"The doubled verb","tr":"Muzâaf fiil"},"level":3,"group":"sarf","explanation":{"en":"A doubled verb has the same letter for its second and third radicals — عَدَّ (ع د د), مَدَّ, اِسْتَعَدَّ. The two are written as one letter with a shadda whenever they can be, and pulled apart — فَكُّ الْإِدْغَامِ — whenever the second of them would have to take sukun. That happens in exactly two places: before the moving subject pronouns of the past (اِسْتَعْدَدْتُ, not *اِسْتَعَدَّتُ) and before نُونُ النِّسْوَةِ (يَسْتَعْدِدْنَ). Everywhere else the shadda stands: يَسْتَعِدُّ, اِسْتَعَدُّوا. The jussive and the imperative allow BOTH, which is worth knowing before you mark someone wrong: لَمْ يَسْتَعِدَّ and لَمْ يَسْتَعْدِدْ are equally correct, and so are اِسْتَعِدَّ and اِسْتَعْدِدْ.","tr":"Muzâaf fiil, ayn'ı ile lâm'ı aynı harf olan fiildir: عَدَّ (ع د د)، مَدَّ، اِسْتَعَدَّ. İki harf mümkün olduğunca şeddeli tek harf yazılır; ikincisinin sükûn alması gerektiğinde ise idgam çözülür (fekkü'l-idgâm). Bu da tam olarak iki yerde olur: mâzide müteharrik fâil zamirlerinden önce (اِسْتَعْدَدْتُ, *اِسْتَعَدَّتُ değil) ve nûnu'n-nisveden önce (يَسْتَعْدِدْنَ). Bunun dışında şedde durur: يَسْتَعِدُّ، اِسْتَعَدُّوا. Cezm ve emirde İKİ vecih de caizdir; birini yanlış saymadan önce bunu bilmek gerekir: لَمْ يَسْتَعِدَّ ile لَمْ يَسْتَعْدِدْ eşit derecede doğrudur, اِسْتَعِدَّ ile اِسْتَعْدِدْ de öyle."},"plain":{"en":"Verbs whose last two root letters are the same, like مَدَّ. They merge into one doubled letter — except where the grammar pulls them apart again.","tr":"Son iki kök harfi aynı olan fiiller (مَدَّ gibi). İki harf tek şeddeli harfe birleşir; ancak bazı yerlerde tekrar ayrılır."},"sources":["مراح الأرواح","بناء الأفعال","المقصود"],"examples":[{"ar":"قُوَّةٌ لِلنَّفْسِ بِهَا تَسْتَعِدُّ لِلْعُلُومِ.","gloss":{"en":"…a faculty by which it is made ready for the sciences — the shadda stands, since nothing forces a sukun.","tr":"…kendisiyle ilimlere hazır hâle geldiği bir kuvvet — sükûnu gerektiren bir şey olmadığı için şedde durur."},"src":"aqaid-ahl-al-sunna"},{"ar":"اِسْتَعْدَدْتُ لِلِامْتِحَانِ.","gloss":{"en":"I prepared for the examination — the ت of the speaker forces the doubling apart.","tr":"İmtihana hazırlandım — mütekellim tâsı idgamı çözer."},"src":null},{"ar":"لَمْ يَسْتَعِدَّ / لَمْ يَسْتَعْدِدْ.","gloss":{"en":"He did not prepare — the jussive permits both forms.","tr":"Hazırlanmadı — cezimde iki vecih de caizdir."},"src":null}],"mistakes":[{"wrong":"مَدَّتُ يَدِي","right":"مَدَدْتُ يَدِي","why":{"en":"Before تُ the doubling must be pulled apart; a shadda cannot survive there.","tr":"تُ zamirinden önce idgam çözülmelidir; orada şedde duramaz."}},{"wrong":"النِّسَاءُ يَمْدُدْنَ — أَوْ يَمُدَّنَ؟ الْأَوَّلُ خَطَأٌ","right":"يَمْدُدْنَ صَحِيحٌ","why":{"en":"Before the ن of the feminine plural the letters separate — يَمْدُدْنَ is the correct form, not يَمُدَّنَ.","tr":"Nûnu'n-nisveden önce harfler ayrılır: doğru şekil يَمْدُدْنَ'dir, يَمُدَّنَ değil."}}]},"fail":{"title":{"ar":"الْفَاعِل","en":"The subject of a verb (fa'il)","tr":"Fâil (özne)"},"level":2,"group":"nahw","explanation":{"en":"The fa'il is the doer — the noun in raf' that comes after a complete active verb and performs its action. Its governor (عامل) is the verb itself, and it is always marfu'. In Arabic the verb comes first (VSO), so the fa'il follows it: «أَرَادَ يُوسُفُ» — يُوسُفُ is the fa'il, marfu' by damma. The fa'il may be a visible noun (اسم ظاهر) or a hidden pronoun (ضمير مستتر): in «ذَهَبَ» the doer is a concealed «هو» (he). One rule surprises beginners: when the fa'il is a visible noun, the verb stays singular even if that noun is dual or plural — قَامَ الرِّجَالُ, not قاموا الرجالُ; number and gender are shown on the verb only by the ت/ا endings of agreement, not by plural marking. Ibn Ajurrum defines it as \"the marfu' noun whose verb is mentioned before it\"; it is the first of the مرفوعات in the Ajurrumiyya and Qatr al-Nada.","tr":"Fâil, işi yapandır — tam bir malum fiilden sonra gelen ve fiilin işini yapan merfu isimdir. Âmili fiilin kendisidir ve daima merfudur. Arapçada fiil önce gelir (fiil-özne-nesne), fâil onu takip eder: «أَرَادَ يُوسُفُ» — يُوسُفُ fâildir, ötre ile merfu. Fâil açık bir isim (ism-i zâhir) ya da gizli bir zamir (zamir-i müstetir) olabilir: «ذَهَبَ»de yapan gizli bir «هو» (o)'dur. Yeni başlayanları şaşırtan bir kural: fâil açık bir isimse, o isim tesniye ya da cemi olsa bile fiil müfred kalır — قَامَ الرِّجَالُ, قاموا الرجالُ değil; sayı ve cinsiyet fiilde yalnız ت/ا uyum ekleriyle gösterilir. İbn Âcurrûm onu \"fiili kendinden önce zikredilen merfu isim\" diye tanımlar; Âcurrûmiyye ve Katru'n-Nedâ'da merfûâtın ilkidir."},"plain":{"en":"Who or what did it.","tr":"İşi kim yaptı, ne yaptı."},"mamul":"marfu","sources":["الآجُرُّومِيَّة (ابن آجُرُّوم)","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"question":{"tr":["Ne?","Kim?"],"en":["What?","Who?"]},"examples":[{"ar":"أَرَادَ يُوسُفُ أَنْ يَرْجِعَ.","gloss":{"en":"Yusuf wanted to return — يُوسُفُ is the fa'il of أراد, marfu' by damma.","tr":"Yusuf dönmek istedi — يُوسُفُ, أراد fiilinin fâilidir, damme ile merfûdur."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"قَالَ أَبُو حَنِيفَةَ.","gloss":{"en":"Abu Hanifa said — أَبُو is the fa'il of قال, marfu' by و (one of the five nouns).","tr":"Ebû Hanîfe dedi — أَبُو, قال fiilinin fâilidir, vâv ile merfûdur (esmâ-i hamse)."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"قَالَ رَسُولُ اللهِ.","gloss":{"en":"The Messenger of Allah said — رَسُولُ is the fa'il, marfu' and mudaf.","tr":"Allah'ın Resulü buyurdu — رَسُولُ merfû fâil ve muzâftır."},"src":"deeds-are-by-intentions"}],"mistakes":[{"wrong":"أَرَادَ يُوسُفَ أَنْ يَرْجِعَ","right":"أَرَادَ يُوسُفُ أَنْ يَرْجِعَ","why":{"en":"The fa'il is marfu'. Giving يوسف a fatha treats the doer as an object — but يوسف here is who wanted, so it must be marfu' (a bare damma, since it is also a diptote).","tr":"Fâil merfudur. يوسف'a fetha vermek yapanı nesne saymaktır — oysa يوسف isteyen kişidir, bu yüzden merfu olmalı (gayr-ı munsarif olduğu için düz ötre)."}},{"wrong":"قَالُوا الْعُلَمَاءُ","right":"قَالَ الْعُلَمَاءُ","why":{"en":"With a following visible fa'il the verb stays singular: قَالَ الْعُلَمَاءُ, not قالوا. Plural marking on the verb (قالوا) is only for a pronoun subject.","tr":"Ardından açık bir fâil gelince fiil müfred kalır: قَالَ الْعُلَمَاءُ, قالوا değil. Fiildeki cemi işareti (قالوا) yalnız zamir özne içindir."}}]},"five-nouns":{"title":{"ar":"الأَسْمَاء الْخَمْسَة","en":"The five nouns (abu / abi / aba)","tr":"Esmâ-i hamse (أبو / أبي / أبا)"},"level":2,"group":"nahw","explanation":{"en":"أَب، أَخ، حَم، فُو، ذُو show case with long vowels instead of harakat when they are mudaf: raf' with و (أَبُو), nasb with ا (أَبَا), jarr with ي (أَبِي). Watch the same kunya change through this story: قَالَ أَبُو حَنِيفَةَ (subject) but ذَهَبَ إِلَى أَبِي حَنِيفَةَ (after a preposition).","tr":"أَب، أَخ، حَم، فُو، ذُو muzaf olduklarında i'rabı uzun harflerle gösterir: ref و ile (أَبُو), nasb ا ile (أَبَا), cer ي ile (أَبِي). Hikâyede aynı künye değişir: قَالَ أَبُو حَنِيفَةَ ama إِلَى أَبِي حَنِيفَةَ."},"plain":{"en":"Five nouns — «father», «brother», «mouth» and two more — that show their case with a long letter (أَبُو / أَبِي / أَبَا) instead of a vowel.","tr":"Beş isim — «baba», «kardeş», «ağız» ve ikisi daha — i'rablarını harekeyle değil, uzun harfle gösterir: أَبُو / أَبِي / أَبَا."},"sources":["الكافية (ابن الحاجب) — الأسماء الستة","الإظهار (البركوي) — المعرب بالحروف"],"examples":[{"ar":"قَالَ لَهُ أَبُو حَنِيفَةَ.","gloss":{"en":"Abu Hanifa (subject → أبو) said to him.","tr":"Ebû Hanîfe (fâil → أبو) ona dedi."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"ذَهَبَ إِلَى مُعَلِّمِهِ أَبِي حَنِيفَةَ.","gloss":{"en":"…to his teacher Abu Hanifa (after إلى → أبي).","tr":"…hocası Ebû Hanîfe'ye (إلى'den sonra → أبي)."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"رَأَيْتُ أَبَا حَنِيفَةَ.","gloss":{"en":"I saw Abu Hanifa (object → أبا).","tr":"Ebû Hanîfe'yi gördüm (mef'ûl → أبا)."},"src":null}],"mistakes":[{"wrong":"ذهبتُ إلى أبو حنيفة","right":"ذهبتُ إلى أبي حنيفة","why":{"en":"The kunya must show jarr with ي after a preposition — treating أبو as frozen is one of the most common learner errors.","tr":"Harf-i cerden sonra künye cerri ي ile göstermeli — أبو'yu donmuş saymak en yaygın öğrenci hatalarındandır."}},{"wrong":"جاء أبي حنيفة إلى الدرس","right":"جاء أبو حنيفة إلى الدرس","why":{"en":"As subject it must be أبو (raf' with و).","tr":"Fail olduğunda أبو olmalıdır (ref, و ile)."}}]},"form-ii-verbs":{"title":{"ar":"الْبَاب الثَّانِي فَعَّلَ","en":"Form II verbs","tr":"İkinci bâb: فَعَّلَ (tef'îl)"},"level":3,"group":"sarf","explanation":{"en":"Form II doubles the middle radical: فَعَّلَ يُفَعِّلُ, masdar تَفْعِيل. It often makes a verb transitive or intensive: وَدَّعَ (to bid farewell), عَلِمَ (to know) → عَلَّمَ (to teach). In the Bina's ordering of the mazid forms this is باب التفعيل. The shadda is meaning-bearing — dropping it in speech or writing changes the verb.","tr":"İkinci bab orta harfi şeddeler: فَعَّلَ يُفَعِّلُ, masdarı تَفْعِيل. Çoğu kez geçişlilik veya pekiştirme katar: وَدَّعَ (uğurlamak), عَلِمَ (bilmek) → عَلَّمَ (öğretmek). Şedde anlam taşır — düşürülürse fiil değişir."},"plain":{"en":"Doubling the middle letter usually means making someone else do it, or doing it hard and often: عَلِمَ «to know» becomes عَلَّمَ «to teach».","tr":"Orta harfin şeddelenmesi çoğunlukla başkasına yaptırmak yahut işi çokça yapmak demektir: عَلِمَ «bilmek» → عَلَّمَ «öğretmek»."},"sources":["الأمثلة المختلفة","بناء الأفعال — أبواب الثلاثي المزيد","المقصود"],"examples":[{"ar":"ذَهَبَ لِيُوَدِّعَهُ.","gloss":{"en":"He went to bid him farewell.","tr":"Ona veda etmeye gitti."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"عَلَّمَ أَبُو حَنِيفَةَ تَلَامِيذَهُ الْفِقْهَ.","gloss":{"en":"Abu Hanifa taught his students fiqh.","tr":"Ebû Hanîfe talebelerine fıkıh öğretti."},"src":null}],"mistakes":[{"wrong":"عَلِمْتُ الطُّلَّابَ الدَّرْسَ","right":"عَلَّمْتُ الطُّلَّابَ الدَّرْسَ","why":{"en":"Form I عَلِمَ means \"to know\"; teaching someone requires Form II عَلَّمَ with the shadda.","tr":"Birinci bab عَلِمَ 'bilmek'tir; birine öğretmek şeddeli ikinci bab عَلَّمَ ister."}},{"wrong":"ودعتُه (بدون شدة، بمعنى التوديع)","right":"وَدَّعْتُهُ","why":{"en":"Without the shadda the verb is a different word — always write and pronounce the doubling in Form II.","tr":"Şeddesiz yazılırsa başka bir kelime olur — ikinci babda şedde daima yazılmalı ve söylenmelidir."}}]},"form-iii-verbs":{"title":{"ar":"الْبَابُ الثَّالِثُ: فَاعَلَ يُفَاعِلُ","en":"Form III verbs (fā'ala)","tr":"Üçüncü bâb: فَاعَلَ (mufâale)"},"level":4,"group":"sarf","explanation":{"en":"Form III adds an alif after the first radical: فَاعَلَ يُفَاعِلُ مُفَاعَلَةً (also the masdar فِعَال). Its core meaning is المشاركة — doing the action WITH or AT someone: جَادَلَ «to argue with», كَاتَبَ «to correspond with», قَاتَلَ «to fight against». In this story: لَا تُجَادِلْ أَحَدًا — do not argue with anyone; the other party comes as a direct object, where English says «with». The mudari' keeps damma on the prefix (يُفَاعِلُ), like all verbs whose mazi has four letters.","tr":"Üçüncü bâb ilk harften sonra elif ekler: فَاعَلَ يُفَاعِلُ مُفَاعَلَةً (masdarı فِعَال da olur). Temel anlamı müşârekettir — işi biriyle KARŞILIKLI yapmak: جَادَلَ «tartışmak», كَاتَبَ «yazışmak», قَاتَلَ «savaşmak». Hikâyede: لَا تُجَادِلْ أَحَدًا — kimseyle tartışma; Türkçede «ile» denen taraf Arapçada doğrudan mef'ûl olur. Mazisi dört harfli bütün fiillerde olduğu gibi muzari öneki ötreli gelir (يُفَاعِلُ)."},"plain":{"en":"A long vowel after the first letter aims the action at someone else — you do it to them or with them: قَتَلَ «to kill» becomes قَاتَلَ «to fight someone».","tr":"İlk harften sonraki uzatma, fiili bir başkasına yöneltir — ona veya onunla yaparsınız: قَتَلَ «öldürmek» → قَاتَلَ «biriyle savaşmak»."},"sources":["الأمثلة المختلفة","بناء الأفعال — أبواب الثلاثي المزيد"],"examples":[{"ar":"وَلَا تُجَادِلْ أَحَدًا فِي الْبَاطِلِ.","gloss":{"en":"And do not argue with anyone in falsehood.","tr":"Ve hiç kimseyle bâtıl üzere tartışma."},"src":"wasiyyat-abi-hanifa-L4"},{"ar":"كَاتَبَ الْعَالِمُ تَلَامِيذَهُ.","gloss":{"en":"The scholar corresponded with his students.","tr":"Âlim talebeleriyle mektuplaştı."},"src":null},{"ar":"سَاعَدَ الرَّجُلُ جَارَهُ.","gloss":{"en":"The man helped his neighbor — Form III without a mutual sense; the pattern is broader than pure reciprocity.","tr":"Adam komşusuna yardım etti — müşâreket manası olmaksızın mufâale; vezin sırf karşılıklılıktan geniştir."},"src":null}],"mistakes":[{"wrong":"لا تجادلْ مع أحدٍ","right":"لا تجادلْ أحدًا","why":{"en":"Form III already contains the «with»: its partner is a direct object in nasb. Adding مع copies the Turkish/English preposition.","tr":"Üçüncü bâb «ile» anlamını kendinde taşır: muhatap doğrudan mef'ûldür. مع eklemek Türkçe «ile»yi kopyalamaktır."}},{"wrong":"يَجَادِلُ (بفتح الياء)","right":"يُجَادِلُ (بضم الياء)","why":{"en":"Every verb whose mazi has four letters (Forms II, III, IV) takes damma on the mudari' prefix.","tr":"Mazisi dört harfli fiillerin (II, III, IV. bâblar) muzari öneki ötrelidir."}},{"wrong":"جادَلَ masdarı «جَدَل» sanmak","right":"مُجَادَلَة / جِدَال","why":{"en":"Form III's masdars are مُفَاعَلَة and فِعَال; the bare جَدَل belongs to the Form I root, not to جادل.","tr":"Üçüncü bâbın masdarları مُفَاعَلَة ve فِعَال'dir; yalın جَدَل birinci bâbın masdarıdır, جادل'inki değildir."}}]},"form-iv-verbs":{"title":{"ar":"الْبَاب الرَّابِع أَفْعَلَ","en":"Form IV verbs","tr":"Dördüncü bâb: أَفْعَلَ (if'âl)"},"level":3,"group":"sarf","explanation":{"en":"Form IV prefixes a hamza: أَفْعَلَ يُفْعِلُ, masdar إِفْعَال. It is usually causative/transitive: رَجَعَ (to return, intransitive) → أَرْجَعَ (to give something back). أَرَادَ (to want) is Form IV of ر-و-د. Its hamza is hamzat qat' — written with the seat (أ) and never dropping: قَالَ وَأَرَادَ, unlike the wasl of Form I imperatives.","tr":"Dördüncü bab başa hemze getirir: أَفْعَلَ يُفْعِلُ, masdarı إِفْعَال. Genellikle geçişlilik katar: رَجَعَ (dönmek) → أَرْجَعَ (geri vermek). أَرَادَ, ر-و-د kökünün dördüncü babıdır. Hemzesi kat' hemzesidir: düşmez ve أ ile yazılır."},"plain":{"en":"A prefixed أ makes it causative — someone makes the action happen: دَخَلَ «to enter» becomes أَدْخَلَ «to bring in».","tr":"Başa gelen أ fiili yaptırma manasına çevirir: دَخَلَ «girmek» → أَدْخَلَ «sokmak»."},"sources":["الأمثلة المختلفة","بناء الأفعال — أبواب الثلاثي المزيد","المقصود"],"examples":[{"ar":"أَرَادَ يُوسُفُ أَنْ يَرْجِعَ.","gloss":{"en":"Yusuf wanted to return.","tr":"Yusuf dönmek istedi."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"أَرْجَعْتُ الْكِتَابَ إِلَى الْمَكْتَبَةِ.","gloss":{"en":"I returned the book to the library.","tr":"Kitabı kütüphaneye iade ettim."},"src":null}],"mistakes":[{"wrong":"رَجَعْتُ الْكِتَابَ","right":"أَرْجَعْتُ الْكِتَابَ","why":{"en":"رَجَعَ is intransitive (\"to come back\"); giving something back needs the Form IV causative أَرْجَعَ.","tr":"رَجَعَ geçişsizdir ('geri dönmek'); bir şeyi geri vermek dördüncü bab أَرْجَعَ ister."}},{"wrong":"اراد ان يرجع (بألف وصل)","right":"أَرَادَ أَنْ يَرْجِعَ","why":{"en":"Form IV takes hamzat qat' — spell it أَرَادَ, never اراد. In careful writing the hamza is not optional.","tr":"Dördüncü bab hemze-i kat' alır — أَرَادَ diye yazılır, asla اراد değil."}}]},"form-v-verbs":{"title":{"ar":"الْبَابُ الْخَامِسُ: تَفَعَّلَ يَتَفَعَّلُ","en":"Form V verbs (tafa''ala)","tr":"Beşinci bâb: تَفَعَّلَ (tefe'ul)"},"level":3,"group":"sarf","explanation":{"en":"Form V is Form II (فَعَّلَ) with a تَ prefixed: تَفَعَّلَ يَتَفَعَّلُ تَفَعُّلًا. Its core sense is the reflexive or the gradual taking-on of what Form II does to something else: عَلَّمَ «he taught» → تَعَلَّمَ «he taught himself, he learned»; كَلَّمَ «he spoke to» → تَكَلَّمَ «he spoke». Like Form VI, its mazi has five letters, so the present prefix takes FATHA (يَتَفَعَّلُ), never damma.","tr":"Beşinci bâb, ikinci bâbın (فَعَّلَ) başına تَ eklenmişidir: تَفَعَّلَ يَتَفَعَّلُ تَفَعُّلًا. Temel mânâsı dönüşlülük veya bir hâli tedricen edinmektir: عَلَّمَ «öğretti» → تَعَلَّمَ «öğrendi»; كَلَّمَ «konuştu (birine)» → تَكَلَّمَ «konuştu». Altıncı bâb gibi mazisi beş harflidir, bu yüzden muzari öneki FETHALIDIR (يَتَفَعَّلُ), asla ötreli değil."},"plain":{"en":"Form II with تَ in front: the action comes back on the doer. عَلَّمَ «to teach» becomes تَعَلَّمَ «to learn».","tr":"Başına تَ gelen tef'îl kalıbı: fiil, yapanın kendisine döner. عَلَّمَ «öğretmek» → تَعَلَّمَ «öğrenmek»."},"sources":["الأمثلة المختلفة","بناء الأفعال — أبواب الثلاثي المزيد"],"examples":[{"ar":"وَلَا تَتَكَلَّمْ بَيْنَ يَدَيِ الْعَامَّةِ.","gloss":{"en":"Do not speak before the common people.","tr":"Avamın huzurunda konuşma."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"تَعَلَّمَ الطَّالِبُ النَّحْوَ.","gloss":{"en":"The student learned grammar — the reflexive of «taught».","tr":"Talebe nahiv öğrendi — «öğretti»nin dönüşlüsü."},"src":null}],"mistakes":[{"wrong":"يُتَكَلَّمُ (لِلْمَعْلُومِ)","right":"يَتَكَلَّمُ","why":{"en":"Form V takes a fatha prefix in the present; the damma prefix belongs to Forms II/III/IV, whose mazi has four letters.","tr":"Beşinci bâbın muzari öneki fethalıdır; ötreli önek mazisi dört harfli olan II/III/IV. bâblara aittir."}},{"wrong":"مَصْدَرُ تَكَلَّمَ: تَكْلِيم","right":"تَكَلُّم","why":{"en":"تَكْلِيم is the masdar of Form II (كَلَّمَ). Form V's masdar is on the pattern تَفَعُّل.","tr":"تَكْلِيم ikinci bâbın (كَلَّمَ) masdarıdır. Beşinci bâbın masdarı تَفَعُّل veznindedir."}}]},"form-vi-verbs":{"title":{"ar":"الْبَابُ السَّادِسُ: تَفَاعَلَ يَتَفَاعَلُ","en":"Form VI verbs (tafā'ala)","tr":"Altıncı bâb: تَفَاعَلَ (tefâul)"},"level":3,"group":"sarf","explanation":{"en":"Form VI is Form III (فَاعَلَ) with a تَ prefixed: تَفَاعَلَ يَتَفَاعَلُ تَفَاعُلًا. Its two core senses are (1) mutual participation shared between a plural subject — تَقَاتَلَ الْقَوْمُ (the people fought one another), تَبَاعَدَا (the two moved apart); and (2) pretense or gradual assumption of a state — تَمَارَضَ (to feign illness), تَنَاوَمَ (to pretend to sleep), and in this testament تَهَاوَنَ بِكَ (he made light of you) and تَتَبَاعَدُ عَنْهَا (you keep your distance from it, little by little). Because its mazi is five letters, the present prefix carries FATHA (يَتَفَاعَلُ) — unlike Forms II, III, IV, whose four-letter mazi gives a damma prefix.","tr":"Altıncı bâb, üçüncü bâbın (فَاعَلَ) başına تَ eklenmişidir: تَفَاعَلَ يَتَفَاعَلُ تَفَاعُلًا. İki temel anlamı vardır: (1) çoğul fâil arasında karşılıklılık — تَقَاتَلَ الْقَوْمُ (halk birbiriyle savaştı), تَبَاعَدَا (ikisi uzaklaştı); (2) yapmacıklık ya da bir hâli tedricen alma — تَمَارَضَ (hasta numarası yapmak), ve bu vasiyette تَهَاوَنَ بِكَ (seni küçümsedi), تَتَبَاعَدُ عَنْهَا (ondan yavaş yavaş uzaklaşırsın). Mazisi beş harfli olduğundan muzari öneki FETHALIDIR (يَتَفَاعَلُ) — dört harfli maziye sahip II, III, IV. bâbların aksine (onlar ötreli önek alır)."},"plain":{"en":"Form III with تَ in front: two or more sides do it to each other. قَاتَلَ «to fight» becomes تَقَاتَلُوا «they fought one another».","tr":"Başına تَ gelen mufâale kalıbı: iki veya daha çok taraf birbirine yapar. قَاتَلَ «savaşmak» → تَقَاتَلُوا «birbirleriyle savaştılar»."},"sources":["الأمثلة المختلفة","بناء الأفعال — أبواب الثلاثي المزيد"],"examples":[{"ar":"تَهَاوَنَ بِكَ السُّلْطَانُ.","gloss":{"en":"The ruler made light of you — pretense/attitude sense of Form VI.","tr":"Sultan seni hafife aldı — tefâulün «öyle davranma» manası."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"تَنْتَفِعُ بِهَا وَتَتَبَاعَدُ عَنْهَا.","gloss":{"en":"You benefit from it and keep your distance from it — gradual sense.","tr":"Ondan faydalanır ve uzak durursun — tedrîcî mana."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"تَقَاتَلَ الْقَوْمُ.","gloss":{"en":"The people fought one another — the mutual sense.","tr":"İnsanlar birbirleriyle savaştı — müşâreket manası."},"src":null}],"mistakes":[{"wrong":"يُتَبَاعَدُ","right":"يَتَبَاعَدُ","why":{"en":"The present prefix of Form VI is fatha, not damma. The damma prefix belongs to Forms II/III/IV, whose mazi has four letters; Form VI's mazi has five.","tr":"Altıncı bâbın muzari öneki fethadır, ötre değil. Ötreli önek, mazisi dört harfli olan II/III/IV. bâblara aittir; altıncı bâbın mazisi beş harflidir."}},{"wrong":"مَصْدَرُ تَبَاعَدَ: تَبْعِيد","right":"تَبَاعُد","why":{"en":"Form VI's masdar is on the pattern تَفَاعُل (تَبَاعُد). تَبْعِيد is the masdar of Form II (بَعَّدَ), a different verb.","tr":"Altıncı bâbın masdarı تَفَاعُل vezninde gelir (تَبَاعُد). تَبْعِيد ise ikinci bâbın (بَعَّدَ) masdarıdır, farklı bir fiildir."}},{"wrong":"تَبَاعَدَ الرَّجُلُ (بِمَعْنَى الْمُشَارَكَةِ)","right":"تَبَاعَدَ الرَّجُلَانِ / الْقَوْمُ","why":{"en":"The mutual sense needs a plural or dual subject — one person cannot «mutually» do anything. A singular subject forces the pretense/gradual reading instead.","tr":"Karşılıklılık anlamı çoğul veya tesniye fâil gerektirir — tek kişi «karşılıklı» bir şey yapamaz. Tekil fâil, yapmacıklık/tedricîlik anlamını gerektirir."}}]},"form-vii-verbs":{"title":{"ar":"بَابُ الِانْفِعَال: اِنْفَعَلَ يَنْفَعِلُ","en":"Form VII — the verb that happens to you","tr":"İnfiâl bâbı: اِنْفَعَلَ — sana olan fiil"},"level":4,"group":"sarf","explanation":{"en":"Prefix اِنْ to the bare verb and you get Form VII, whose whole business is مُطَاوَعَة — «responding». Someone breaks the glass, and the glass ANSWERS by breaking: كَسَرْتُ الزُّجَاجَ فَانْكَسَرَ. Someone ties the contract, and the contract answers by being tied: عَقَدَهُ فَانْعَقَدَ. Two consequences follow from the meaning and are worth holding onto. First, Form VII is ALWAYS intransitive — the object of the first verb has become the subject of this one, so there is nothing left for it to govern, and it therefore has no passive. Second, it is close to a passive in sense but is not one: the passive names an unspoken doer, while Form VII says the thing simply gave way. Its hamza is a connecting hamza, so it vanishes in continuous speech (فَانْكَسَرَ), and its masdar is اِنْفِعَال.","tr":"Mücerred fiilin başına اِنْ getirilirse infiâl bâbı olur; bu bâbın bütün işi mutâvaattır — «cevap verme». Biri camı kırar, cam da kırılarak CEVAP verir: كَسَرْتُ الزُّجَاجَ فَانْكَسَرَ. Biri akdi bağlar, akit de bağlanarak cevap verir: عَقَدَهُ فَانْعَقَدَ. Manadan iki netice çıkar. Birincisi, infiâl bâbı DAİMA lâzımdır — birinci fiilin mef'ûlü bunun fâili olmuştur, dolayısıyla amel edeceği bir şey kalmaz ve meçhulü de olmaz. İkincisi, mana bakımından meçhule yakındır ama meçhul değildir: meçhul söylenmemiş bir fâili ima eder, infiâl ise şeyin kendiliğinden boyun eğdiğini söyler. Hemzesi vasıl hemzesidir, kelâmın ortasında düşer (فَانْكَسَرَ); masdarı اِنْفِعَال'dir."},"plain":{"en":"The verb that happens to you, with nobody named as doing it: كَسَرَ «to break» becomes اِنْكَسَرَ «to get broken».","tr":"Yapanı anılmayan, size olan fiil: كَسَرَ «kırmak» → اِنْكَسَرَ «kırılmak»."},"sources":["بناء الأفعال","مراح الأرواح","المقصود"],"examples":[{"ar":"وَيَنْعَقِدُ بِالْإِيجَابِ وَالْقَبُولِ.","gloss":{"en":"It is concluded by offer and acceptance — the contract is not «concluded by someone» here; it simply comes to be tied.","tr":"İcap ve kabul ile in'ikad eder — akit burada «biri tarafından bağlanmaz», kendiliğinden bağlanmış olur."},"src":"kitab-al-buyu"},{"ar":"كَسَرْتُ الزُّجَاجَ فَانْكَسَرَ.","gloss":{"en":"I broke the glass and it broke — the pattern case of muta'awa'a, given in the Bina itself.","tr":"Camı kırdım, o da kırıldı — Binâ'nın kendi verdiği mutâvaat örneği."},"src":null},{"ar":"قَلَبَهُ فَانْقَلَبَ.","gloss":{"en":"He turned it over and it turned over.","tr":"Onu çevirdi, o da çevrildi."},"src":null}],"mistakes":[{"wrong":"اِنْكَسَرَ الْوَلَدُ الزُّجَاجَ","right":"كَسَرَ الْوَلَدُ الزُّجَاجَ","why":{"en":"Form VII cannot take an object. If there is a doer acting on something, the bare verb is what you want.","tr":"İnfiâl bâbı mef'ûl almaz. Bir şeye tesir eden fâil varsa mücerred fiil kullanılır."}},{"wrong":"اُنْعُقِدَ الْعَقْدُ","right":"اِنْعَقَدَ الْعَقْدُ","why":{"en":"There is no passive of Form VII — it is already intransitive, and the sense it would carry is the sense it already has.","tr":"İnfiâl bâbının meçhulü yoktur; zaten lâzımdır ve meçhulden beklenen manayı kendisi taşır."}}]},"form-viii-verbs":{"title":{"ar":"بَاب الِافْتِعَال اِفْتَعَلَ","en":"Form VIII verbs","tr":"İftiâl bâbı: اِفْتَعَلَ"},"level":3,"group":"sarf","explanation":{"en":"Form VIII infixes ت after the first radical: اِفْتَعَلَ يَفْتَعِلُ, masdar اِفْتِعَال. Often reflexive or intensive in meaning: اِحْتَرَمَ (to respect), اِحْتَقَرَ (to belittle), اِسْتَمَعَ (to listen attentively). Its initial hamza is hamzat wasl — it drops in connected speech (وَاحْتَرِمْ) and is never written with the seat أ. With emphatic or assimilating first radicals the ت changes: ص → اِصْطَبَرَ, ز → اِزْدَهَرَ, د/ذ → اِدَّكَرَ.","tr":"İftial babı ilk kök harfinden sonra ت ekler: اِفْتَعَلَ يَفْتَعِلُ, masdarı اِفْتِعَال. Çoğu kez dönüşlülük katar: اِحْتَرَمَ (saygı göstermek), اِسْتَمَعَ (dinlemek). Hemzesi vasl hemzesidir: vasıl halinde düşer (وَاحْتَرِمْ). Kalın harflerden sonra ت değişir: اِصْطَبَرَ، اِزْدَهَرَ."},"plain":{"en":"A ت slipped inside the root, usually meaning you do it for yourself, or it happens of its own accord.","tr":"Kökün içine giren bir ت; çoğunlukla işi kendiniz için yapmak yahut işin kendiliğinden olması manasını verir."},"sources":["بناء الأفعال","الأمثلة المختلفة"],"examples":[{"ar":"وَاحْتَرِمِ الْكِبَارَ.","gloss":{"en":"And respect the elders.","tr":"Ve büyüklere hürmet et."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"لَا تَحْتَقِرْ أَحَدًا.","gloss":{"en":"Do not belittle anyone.","tr":"Hiç kimseyi küçümseme."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"اِسْتَمَعَ الطُّلَّابُ إِلَى الدَّرْسِ.","gloss":{"en":"The students listened to the lesson.","tr":"Talebeler dersi dinledi."},"src":null}],"mistakes":[{"wrong":"إِحْتَرَمَ الكبارَ (بهمزة قطع)","right":"اِحْتَرَمَ الكبارَ","why":{"en":"Form VIII takes hamzat wasl — writing إ (qat') is a very common spelling error; the hamza also must not be pronounced after و: وَاحْتَرِمْ, not وَإِحْتَرِمْ.","tr":"İftial babı hemze-i vasl alır — إ (kat') ile yazmak yaygın imla hatasıdır; و'dan sonra da okunmaz: وَاحْتَرِمْ."}},{"wrong":"اِصْتَبَرَ","right":"اِصْطَبَرَ","why":{"en":"After emphatic ص the infixed ت becomes ط — learners often keep the plain ت.","tr":"Kalın ص'dan sonra ت, ط olur — öğrenciler çoğu kez düz ت bırakır."}}]},"form-x-verbs":{"title":{"ar":"الْبَابُ الْعَاشِرُ: اسْتَفْعَلَ يَسْتَفْعِلُ","en":"Form X verbs (istaf'ala)","tr":"Onuncu bâb: اِسْتَفْعَلَ (istif'âl)"},"level":5,"group":"sarf","explanation":{"en":"Form X prefixes اسْتَ: اسْتَفْعَلَ يَسْتَفْعِلُ اسْتِفْعَالًا. Its commonest sense is SEEKING or asking for what the root means: غَفَرَ «he forgave» → اسْتَغْفَرَ «he sought forgiveness»; أَفْتَى «he gave a ruling» → اسْتَفْتَى «he sought a ruling». It can also mean judging something to have a quality (اسْتَحْسَنَ «he deemed good»). The initial hamza is a hamzat wasl and drops in continuous speech.","tr":"Onuncu bâb başına اسْتَ ekler: اسْتَفْعَلَ يَسْتَفْعِلُ اسْتِفْعَالًا. En yaygın mânâsı kökün anlamını İSTEMEK, talep etmektir: غَفَرَ «bağışladı» → اسْتَغْفَرَ «bağışlanma diledi»; أَفْتَى «fetva verdi» → اسْتَفْتَى «fetva sordu». Bir şeyi bir vasıfla nitelemek anlamı da vardır (اسْتَحْسَنَ «güzel gördü»). Baştaki hemze vasl hemzesidir, geçişte düşer."},"plain":{"en":"اِسْتَ in front usually means asking for the thing, or reckoning something to be so: غَفَرَ «to forgive» becomes اِسْتَغْفَرَ «to ask forgiveness».","tr":"Başa gelen اِسْتَ çoğunlukla istemek yahut öyle saymak manasını verir: غَفَرَ «bağışlamak» → اِسْتَغْفَرَ «bağışlanma dilemek»."},"sources":["الأمثلة المختلفة","بناء الأفعال — أبواب الثلاثي المزيد"],"examples":[{"ar":"وَمَنْ جَاءَكَ يَسْتَفْتِيكَ.","gloss":{"en":"Whoever comes to you seeking a ruling — the «seeking» sense of Form X.","tr":"Sana fetva sormaya gelen kimse — istif'âlin «talep» manası."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"اِسْتَغْفَرَ الْمُؤْمِنُ رَبَّهُ.","gloss":{"en":"The believer sought his Lord's forgiveness.","tr":"Mümin Rabbinden mağfiret diledi."},"src":null}],"mistakes":[{"wrong":"مَصْدَرُ اسْتَغْفَرَ: اِسْتِغْفِير","right":"اِسْتِغْفَار","why":{"en":"Form X's masdar is on the pattern اِسْتِفْعَال, with an alif before the last radical.","tr":"Onuncu bâbın masdarı اِسْتِفْعَال veznindedir, son harften önce elif bulunur."}},{"wrong":"يُسْتَفْتِي (لِلْمَعْلُومِ)","right":"يَسْتَفْتِي","why":{"en":"The active present of Form X takes a fatha prefix; a damma prefix would make it passive.","tr":"Onuncu bâbın malum muzarisi fethalı önek alır; ötreli önek meçhul yapar."}}]},"hal":{"title":{"ar":"الْحَال","en":"The hal (circumstantial accusative)","tr":"Hâl"},"level":4,"group":"nahw","explanation":{"en":"The hal is an indefinite, derived noun in nasb that describes the STATE of its owner (صاحب الحال) at the moment of the action — it answers «how?». Ibn al-Hajib defines it in the Kafiya as «ما يبين هيئة الفاعل أو المفعول». In this story: أَتَى أَبَا حَنِيفَةَ مُوَدِّعًا — he came «in the state of bidding farewell». The hal is typically an ism fail or ism maful, stays indefinite, and its owner is typically definite. Several hals can stack without a conjunction: خَرَجَ شَاكِرًا عَامِلًا.","tr":"Hâl; işin yapıldığı andaki DURUMU bildiren, nekre ve müştak, mansub bir isimdir — «nasıl?» sorusuna cevap verir. İbnü'l-Hâcib Kâfiye'de «fâilin veya mef'ûlün heyetini açıklayan» diye tanımlar. Hikâyede: أَتَى أَبَا حَنِيفَةَ مُوَدِّعًا — «vedalaşır hâlde» geldi. Hâl çoğunlukla ism-i fâil veya ism-i mef'ûldür, nekre kalır; sahibi (zü'l-hâl) çoğunlukla marifedir. Birden çok hâl atıfsız arka arkaya gelebilir: خَرَجَ شَاكِرًا عَامِلًا."},"plain":{"en":"Describes the state someone was in while doing the thing: «he left thankful».","tr":"İşi yaparken kişinin hâlini bildirir: «şükrederek çıktı»."},"mamul":"mansub","sources":["الكافية (ابن الحاجب)","قطر الندى (ابن هشام)","إظهار الأسرار (البيركوي)"],"question":{"tr":["Ne olduğu halde?"],"en":["In what state?"]},"examples":[{"ar":"أَتَى أَبَا حَنِيفَةَ مُوَدِّعًا.","gloss":{"en":"He came to Abu Hanifa to bid him farewell (lit. «in a farewelling state»).","tr":"Ona veda ederek geldi (lafzen «veda eder hâlde»)."},"src":"wasiyyat-abi-hanifa-L4"},{"ar":"فَخَرَجَ يُوسُفُ شَاكِرًا عَامِلًا بِوَصِيَّةِ إِمَامِهِ.","gloss":{"en":"Yusuf left thankful, acting on his imam's testament — two stacked hals.","tr":"Yusuf şükrederek ve imamının vasiyetiyle amel ederek ayrıldı — üst üste iki hâl."},"src":"wasiyyat-abi-hanifa-L4"},{"ar":"جَاءَ الطَّالِبُ مُسْرِعًا.","gloss":{"en":"The student came hurrying.","tr":"Talebe koşarak geldi."},"src":null}],"mistakes":[{"wrong":"جاء الطالبُ مسرعٌ","right":"جاء الطالبُ مسرعًا","why":{"en":"The hal is always mansub — learners let it agree with the marfu' subject as if it were an adjective.","tr":"Hâl daima mansubdur — öğrenciler onu sıfat sanıp merfu fâile uydurur."}},{"wrong":"جاء الطالبُ المسرعَ (بمعنى الحال)","right":"جاء الطالبُ مُسْرِعًا","why":{"en":"A definite word after a definite noun is a na't (adjective), not a hal. The hal must stay indefinite: definite owner + indefinite state.","tr":"Marife isimden sonra gelen marife kelime sıfattır, hâl değil. Hâl nekre kalmalıdır: sahibi marife, hâl nekre."}},{"wrong":"جاء مسرعًا الطالبُ… (والصاحب نكرة)","right":"صاحِبُ الحالِ الأصلُ فيه أن يكون معرفةً","why":{"en":"The owner of the hal should normally be definite; with an indefinite owner, classical usage prefers fronting the hal or reading the phrase as a na't.","tr":"Zü'l-hâlin aslı marife olmasıdır; nekre olursa klasik kullanım hâli öne almayı veya terkibi sıfat saymayı tercih eder."}}]},"haqiqa-majaz":{"title":{"ar":"الْحَقِيقَةُ وَالْمَجَاز","en":"Literal and figurative","tr":"Hakikat ve mecaz"},"level":5,"group":"balagha","explanation":{"en":"A word used for what it was coined for is حَقِيقَة. Used for something else it is مَجَاز, and the tradition defines it tightly: لَفْظٌ مُسْتَعْمَلٌ فِي غَيْرِ مَا وُضِعَ لَهُ بِعَلَاقَةٍ بَيْنَهُمَا مَعَ قَرِينَةٍ مَانِعَةٍ عَنْ إِرَادَةِ الْمَوْضُوعِ لَهُ — a word used for other than what it was coined for, by a RELATION between the two, with a CLUE that blocks the literal reading. Four things are therefore always present: what the word was coined for, what it is being used for, the relation, and the blocking clue. The textbook case: رَأَيْتُ أَسَدًا فِي يَدِهِ سَيْفٌ. أَسَد was coined for the beast; it is used here for a brave man; the relation is resemblance; and the clue that stops you reading «lion» is فِي يَدِهِ سَيْفٌ — lions do not carry swords. When the relation IS resemblance the majaz has its own name, اِسْتِعَارَة. When it is anything else — the part for the whole, the container for the contained, the cause for the effect, what a thing used to be or will become — it is مَجَازٌ مُرْسَل. بَيْنَ يَدَيْهِ is that second kind: the hands stand for the presence, part for whole.","tr":"Bir kelime konulduğu mana için kullanılırsa hakikattir. Başka bir mana için kullanılırsa mecazdır ve gelenek onu şöyle tarif eder: لَفْظٌ مُسْتَعْمَلٌ فِي غَيْرِ مَا وُضِعَ لَهُ بِعَلَاقَةٍ بَيْنَهُمَا مَعَ قَرِينَةٍ مَانِعَةٍ عَنْ إِرَادَةِ الْمَوْضُوعِ لَهُ — aralarındaki bir ALÂKA ile, hakikî manayı murad etmeye engel olan bir KARÎNE ile birlikte, konulduğu mananın dışında kullanılan lafız. Böylece dört şey daima bulunur: mâ vuzia leh, müsta'melün fîh, alâka ve karîne-i mânia. Ders kitabı örneği: رَأَيْتُ أَسَدًا فِي يَدِهِ سَيْفٌ. أَسَد yırtıcı hayvan için konulmuştur; burada cesur adam için kullanılmıştır; alâka müşâbehettir; «aslan» diye okumayı engelleyen karîne ise فِي يَدِهِ سَيْفٌ'dir — aslanın elinde kılıç olmaz. Alâka müşâbehet ise mecazın adı istiâredir. Başka bir şey ise — cüz-kül, zarf-mazrûf, sebep-müsebbep, olduğu yahut olacağı hâl — mecâz-ı mürseldir. بَيْنَ يَدَيْهِ bu ikinci türdendir: eller huzurun yerini tutar, cüz külün."},"plain":{"en":"Using a word for what it actually means, or for something connected to it.","tr":"Bir kelimeyi ya kendi manasında ya da onunla alâkalı bir manada kullanmak."},"sources":["تلخيص المفتاح (القزويني) — علم البيان","علاقات المجاز","مختصر السعد"],"examples":[{"ar":"وَإِيَّاكَ وَالْكَذِبَ بَيْنَ يَدَيْهِ.","gloss":{"en":"Beware of lying in his presence — «between his two hands» stands for being before him: majaz mursal, the part for the whole.","tr":"Onun huzurunda yalandan sakın — «iki eli arasında», huzurunda bulunmanın yerini tutar: cüz-kül alâkasıyla mecâz-ı mürsel."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"رَأَيْتُ أَسَدًا فِي يَدِهِ سَيْفٌ.","gloss":{"en":"I saw a lion with a sword in his hand — the sword is the clue that blocks the literal lion.","tr":"Elinde kılıç olan bir aslan gördüm — kılıç, hakikî aslanı engelleyen karînedir."},"src":null},{"ar":"وَاسْأَلِ الْقَرْيَةَ.","gloss":{"en":"Ask the town — the place for its people: the container for what it contains.","tr":"Köye sor — mahal ehli için: zarf, mazrûf yerine."},"src":null}],"mistakes":[{"wrong":"رَأَيْتُ أَسَدًا — مَجَازٌ بِلَا قَرِينَةٍ","right":"لَا مَجَازَ بِلَا قَرِينَةٍ مَانِعَةٍ","why":{"en":"Without something in the sentence that blocks the literal reading, «I saw a lion» just means a lion. The clue is part of the definition, not an optional extra.","tr":"Cümlede hakikî manayı engelleyen bir şey yoksa «bir aslan gördüm» gerçekten aslandır. Karîne tarifin parçasıdır, fazladan bir süs değildir."}},{"wrong":"كُلُّ مَجَازٍ اسْتِعَارَةٌ","right":"الِاسْتِعَارَةُ مَجَازٌ عَلَاقَتُهُ الْمُشَابَهَة، وَغَيْرُهَا مُرْسَلٌ","why":{"en":"Only a resemblance-relation makes an isti'ara. Part-for-whole, cause-for-effect and the rest are majaz mursal.","tr":"İstiâre yalnız müşâbehet alâkasıyla olur. Cüz-kül, sebep-müsebbep ve benzerleri mecâz-ı mürseldir."}}]},"hollow-verbs":{"title":{"ar":"الْفِعْل الأَجْوَف","en":"Hollow verbs","tr":"Ecvef fiil"},"level":3,"group":"sarf","explanation":{"en":"A hollow (ajwaf) verb has و or ي as its middle radical: قَالَ (aslu-hu قَوَلَ), خَافَ (خَوِفَ), أَرَادَ (أَرْوَدَ). Two rules explain almost every form. FIRST, a voweled و or ي moves its vowel onto the preceding sound letter: يَقْوُلُ → يَقُولُ, and if that vowel is a fatha the letter becomes alif instead: يَخْوَفُ → يَخَافُ. SECOND, when that move would leave two vowelless letters together, the weak letter is dropped outright: لَمْ يَقْوُلْ → لَمْ يَقُلْ, قَوَلْنَ → قُلْنَ. The vowel left behind is not arbitrary — it points to what was lost: damma for a dropped و (قُلْنَ, قُمْنَ), kasra for a dropped ي (بِعْنَ, كِلْنَ). The passive follows the same logic from the other side: قُوِلَ → قِيلَ, بُيِعَ → بِيعَ, خُوِفَ → خِيفَ. Two limits are worth memorising. In the augmented babs, i'lal happens only in إِفْعَال, اِنْفِعَال, اِفْتِعَال and اِسْتِفْعَال; فَعَّلَ, فَاعَلَ, تَفَعَّلَ, تَفَاعَلَ and اِفْعَلَّ keep the weak letter intact — طَوَّلَ, طَاوَلَ, تَحَوَّلَ, تَصَوَّرَ. And the masdars of if'al and istif'al compensate for the lost و with a final ة: إِقْوَام → إِقَامَة, اِسْتِقْوَام → اِسْتِقَامَة. The Bina counts these among the seven irregular classes.","tr":"Ecvef fiilin orta harfi و veya ي'dir: قَالَ (aslı قَوَلَ), خَافَ (خَوِفَ), أَرَادَ (أَرْوَدَ). Neredeyse bütün şekilleri iki kaide açıklar. BİRİNCİ: harekeli و/ي ha
