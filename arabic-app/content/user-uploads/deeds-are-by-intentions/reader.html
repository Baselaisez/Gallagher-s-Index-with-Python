<meta charset="utf-8">
<title>Qissa — Arabic Reader Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Qissa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<style>
  :root {
    --ground: #FAF6EE;
    --panel: #FFFDF7;
    --ink: #22303A;
    --ink-soft: #5A6B76;
    --line: #E4DCCB;
    --accent: #0E7C74;
    --accent-ink: #FFFFFF;
    --accent-soft: rgba(14,124,116,.10);
    --danger: #B23B3B;
    --ok: #2E7D46;
    --lvl1: #2E7D46;
    --lvl2: #0E7C74;
    --lvl3: #B07A1E;
    --lvl4: #B23B3B;
    --shadow: 0 18px 50px rgba(34,48,58,.22);
    --shadow-sm: 0 3px 14px rgba(34,48,58,.10);
    --radius: 14px;
    --radius-lg: 20px;
    --ar-font: "Noto Naskh Arabic", "Geeza Pro", "Traditional Arabic", "Amiri", "Scheherazade New", serif;
    --body-font: Charter, Georgia, "Times New Roman", serif;
    --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #101A20;
      --panel: #16232B;
      --ink: #E9E2D2;
      --ink-soft: #97A6AD;
      --line: #27363F;
      --accent: #45C2B4;
      --accent-ink: #08221F;
      --accent-soft: rgba(69,194,180,.14);
      --danger: #E07A7A;
      --ok: #7CC98F;
      --lvl1: #7CC98F;
      --lvl2: #45C2B4;
      --lvl3: #D9A94E;
      --lvl4: #E07A7A;
      --shadow: 0 18px 50px rgba(0,0,0,.55);
      --shadow-sm: 0 3px 14px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"] {
    --ground: #FAF6EE; --panel: #FFFDF7; --ink: #22303A; --ink-soft: #5A6B76; --line: #E4DCCB;
    --accent: #0E7C74; --accent-ink: #FFFFFF; --accent-soft: rgba(14,124,116,.10);
    --danger: #B23B3B; --ok: #2E7D46;
    --lvl1: #2E7D46; --lvl2: #0E7C74; --lvl3: #B07A1E; --lvl4: #B23B3B;
    --shadow: 0 18px 50px rgba(34,48,58,.22); --shadow-sm: 0 3px 14px rgba(34,48,58,.10);
  }
  :root[data-theme="dark"] {
    --ground: #101A20; --panel: #16232B; --ink: #E9E2D2; --ink-soft: #97A6AD; --line: #27363F;
    --accent: #45C2B4; --accent-ink: #08221F; --accent-soft: rgba(69,194,180,.14);
    --danger: #E07A7A; --ok: #7CC98F;
    --lvl1: #7CC98F; --lvl2: #45C2B4; --lvl3: #D9A94E; --lvl4: #E07A7A;
    --shadow: 0 18px 50px rgba(0,0,0,.55); --shadow-sm: 0 3px 14px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--body-font); line-height: 1.55;
  }
  .wrap { max-width: 40rem; margin: 0 auto; padding: 0 1.1rem 6rem; }

  header.app { padding: 1.6rem 0 1rem; border-bottom: 1px solid var(--line); }
  .eyebrow {
    font-family: var(--ui-font); font-size: .68rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--accent); font-weight: 600;
  }
  h1.story-title {
    font-family: var(--ar-font); font-size: 2.3rem; margin: .35rem 0 .1rem;
    direction: rtl; text-align: right; text-wrap: balance; line-height: 1.45; font-weight: 600;
  }
  .story-sub { color: var(--ink-soft); font-size: .92rem; margin: 0; }
  .meta-row { display: flex; gap: .5rem; margin-top: .8rem; flex-wrap: wrap; align-items: center; }
  .chip {
    font-family: var(--ui-font); font-size: .72rem; font-weight: 600;
    padding: .22rem .6rem; border-radius: 999px; border: 1px solid var(--line);
    color: var(--ink-soft); background: var(--panel);
  }
  .chip.level { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .chip.amil { color: var(--danger); border-color: var(--danger); background: transparent; }
  .chip.mamul { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .chip.preview { color: var(--danger); border-color: var(--danger); }
  .chip.freeweek { color: var(--lvl3); border-color: var(--lvl3); background: transparent; font-weight: 700; }
  .chip.newchip { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); font-weight: 700; letter-spacing: .06em; }
  .lib-sort {
    display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
    margin: 0 0 .8rem; font-family: var(--ui-font);
  }
  .lib-sort .ls-lbl { font-size: .78rem; color: var(--ink-soft); }
  .chip.done { color: var(--ok); border-color: var(--ok); font-weight: 700; }
  .chip.newwords { color: var(--accent); border-color: var(--accent); }
  .vocab-list button { white-space: nowrap; }
  .vocab-list button.saved { color: var(--ok); border-color: var(--ok); }
  .vocab-list .chip.level { flex-shrink: 0; }
  .ch-nav { display: flex; gap: .4rem; flex-wrap: wrap; margin: 0 0 .8rem; font-family: var(--ui-font); }
  .ch-pill {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
    border-radius: 999px; padding: .25rem .7rem; font-size: .76rem; cursor: pointer;
  }
  .ch-pill:hover { color: var(--accent); border-color: var(--accent); }
  .jumal-tabs { margin-top: 1.1rem; }
  .jumla-row {
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: .55rem .7rem; margin: .45rem 0;
  }
  .jumla-row .jt { font-family: var(--ar-font); font-size: 1.05rem; }
  .jumla-row .jr { font-family: var(--ar-font); color: var(--accent); font-size: .95rem; margin: .15rem 0; }
  .jumla-row .jg { font-family: var(--ui-font); font-size: .8rem; color: var(--ink-soft); }
  .review-nudge {
    display: block; width: 100%; text-align: left; cursor: pointer;
    border: 1.5px dashed var(--accent); border-radius: 10px; background: transparent;
    color: var(--accent); font-family: var(--ui-font); font-size: .82rem; font-weight: 600;
    padding: .55rem .8rem; margin: 0 0 .8rem;
  }
  .continue-card {
    display: block; width: 100%; text-align: inherit; cursor: pointer;
    border: 1.5px solid var(--accent); border-radius: var(--radius);
    background: linear-gradient(135deg, var(--accent-soft), transparent 70%) var(--panel);
    padding: .85rem 1rem; margin: 0 0 .8rem; font-family: var(--ui-font);
    transition: box-shadow .15s, transform .15s;
  }
  .continue-card:hover { box-shadow: var(--shadow-sm); }
  @media (prefers-reduced-motion: no-preference) {
    .continue-card:hover { transform: translateY(-1px); }
  }
  .continue-card .cc-lbl {
    display: block; font-size: .72rem; text-transform: uppercase;
    letter-spacing: .06em; color: var(--accent); font-weight: 700;
  }
  .continue-card .cc-title { display: block; font-family: var(--ar-font); font-size: 1.3rem; margin: .15rem 0; }
  .continue-card .cc-sub { display: block; font-size: .8rem; color: var(--ink-soft); margin-bottom: .4rem; }
  .sentence.resume-target { animation: resumeflash 1.6s ease 1; }
  @keyframes resumeflash { 0%, 60% { background: var(--accent-soft); } 100% { background: transparent; } }
  .welcome-h { font-family: var(--ui-font); margin: .2rem 0 .4rem; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin: .6rem 0 .4rem; font-family: var(--ui-font); }
  .stat-tile { border: 1px solid var(--line); border-radius: 10px; padding: .6rem .3rem; text-align: center; background: var(--panel); }
  .stat-tile b { display: block; font-size: 1.25rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  .stat-tile span { font-size: .66rem; color: var(--ink-soft); }
  .lvl-row { display: flex; align-items: center; gap: .5rem; font-family: var(--ui-font); font-size: .76rem; margin: .35rem 0; }
  .lvl-row .lv { width: 5.2rem; }
  .lvl-row.mine .lv { color: var(--accent); font-weight: 700; }
  .lvl-row .bar { flex: 1; height: 7px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .lvl-row .bar span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .lvl-row .n { color: var(--ink-soft); min-width: 3.2rem; text-align: right; }
  .level-pick { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin: .8rem 0; font-family: var(--ui-font); }
  .level-pick .btn { margin: 0; text-align: center; transition: border-color .12s, color .12s; }
  .level-pick .btn:hover:not(.saved) { border-color: var(--accent); color: var(--accent); }
  .btn.unsure { width: 100%; margin-top: .2rem; color: var(--ink-soft); }
  .qtest {
    display: flex; flex-wrap: wrap; align-items: center; gap: .35rem;
    margin: .5rem 0 .2rem; font-family: var(--ui-font);
  }
  .qtest .qt-lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
  .gnote p.plain {
    font-size: 1rem; line-height: 1.55; color: var(--ink);
    border-left: 3px solid var(--accent); padding: .1rem 0 .1rem .7rem; margin: .6rem 0 .7rem;
  }
  details.deep > summary {
    cursor: pointer; font-family: var(--ui-font); font-size: .8rem; font-weight: 600;
    color: var(--accent); list-style: none; padding: .2rem 0;
  }
  details.deep > summary::-webkit-details-marker { display: none; }
  details.deep > summary::before { content: "▸ "; }
  details.deep[open] > summary::before { content: "▾ "; }
  .qtest .qt {
    font-size: .82rem; font-weight: 600; padding: .12rem .5rem; border-radius: 999px;
    color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent);
  }
  button.chip.sib, button.chip.vocab { cursor: pointer; color: var(--accent); border-color: var(--accent); background: transparent; }
  button.chip.sib:hover, button.chip.vocab:hover { background: var(--accent-soft); }
  .chip .ar { font-family: var(--ar-font); font-size: 1.05em; }

  .upsell {
    margin: 1.4rem 0; padding: 1.2rem 1.4rem; border: 1.5px solid var(--accent);
    border-radius: var(--radius); text-align: center; font-family: var(--ui-font);
    background: linear-gradient(160deg, var(--accent-soft), transparent 70%) var(--panel);
    box-shadow: var(--shadow-sm);
  }
  .upsell .ut { font-weight: 700; margin-bottom: .4rem; }
  .upsell p { color: var(--ink-soft); font-size: .9rem; margin: 0 0 .9rem; }
  .upsell .unlock {
    font-family: var(--ui-font); font-weight: 700; font-size: .9rem; cursor: pointer;
    padding: .55rem 1.2rem; border-radius: 999px; border: none;
    background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow-sm);
    transition: transform .12s;
  }
  @media (prefers-reduced-motion: no-preference) { .upsell .unlock:hover { transform: translateY(-1px); } }

  nav.controls {
    position: sticky; top: 0; z-index: 5; background: var(--ground);
    padding: .7rem 0; border-bottom: 1px solid var(--line);
    display: flex; gap: .55rem; align-items: center; flex-wrap: wrap;
    font-family: var(--ui-font);
  }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel); }
  .seg button {
    border: 0; background: transparent; color: var(--ink-soft); cursor: pointer;
    font-family: var(--ar-font); font-size: .95rem; padding: .3rem .75rem;
  }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .tbtn {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
    border-radius: 999px; padding: .32rem .7rem; cursor: pointer;
    font-family: var(--ui-font); font-size: .76rem; font-weight: 600;
    transition: color .12s, border-color .12s, background .12s;
  }
  .tbtn:hover:not(.on) { color: var(--accent); border-color: var(--accent); }
  .tbtn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .tbtn:focus-visible, .seg button:focus-visible, .word:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .spacer { flex: 1; }
  .deckbtn { position: relative; }
  .deckbtn .count {
    position: absolute; top: -7px; inset-inline-end: -7px; background: var(--danger); color: #fff;
    font-size: .62rem; border-radius: 999px; min-width: 1.05rem; height: 1.05rem;
    display: grid; place-items: center; padding: 0 .2rem;
  }
  .deckbtn .count[hidden] { display: none; }

  .chapter-head {
    font-family: var(--ui-font); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-soft); margin: 1.6rem 0 .4rem; display: flex; align-items: center; gap: .7rem;
  }
  /* The rub' al-hizb ornament — serious, classical, and unmistakably ours. */
  .chapter-head::before { content: "۞"; color: var(--accent); font-size: 1.1rem; letter-spacing: 0; }
  .chapter-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .chapter-title-ar { font-family: var(--ar-font); font-size: 1.15rem; color: var(--ink); letter-spacing: 0; text-transform: none; }

  section.sentence {
    margin: 1.05rem -0.55rem; padding: .35rem .55rem; border-radius: var(--radius);
    transition: background .15s;
  }
  section.sentence:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
  section.sentence.playing { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  /* The word currently being spoken. Only ever set while a boundary event is
     actually arriving — a browser that never fires one simply keeps the
     sentence-level highlight, which is the old behaviour. */
  .word.speaking { background: var(--accent); color: var(--accent-ink); }
  @media (prefers-reduced-motion: no-preference) {
    .word.speaking { transition: background .12s linear; }
  }
  .ar-line {
    direction: rtl; text-align: right; font-family: var(--ar-font);
    font-size: var(--ar-size, 1.7rem); line-height: 2.15; padding: 0 .3rem;
  }
  .word {
    cursor: pointer; border-radius: 6px; padding: 0 .07em;
    text-decoration-thickness: 2px; text-underline-offset: 7px;
    transition: background .12s, color .12s;
  }
  .word:hover { background: var(--accent-soft); }
  .word.active { background: var(--accent); color: var(--accent-ink); }
  .underlines .word[data-lvl="1"] { text-decoration: underline; text-decoration-color: var(--lvl1); }
  .underlines .word[data-lvl="2"] { text-decoration: underline; text-decoration-color: var(--lvl2); }
  .underlines .word[data-lvl="3"] { text-decoration: underline; text-decoration-color: var(--lvl3); }
  .underlines .word[data-lvl="4"] { text-decoration: underline; text-decoration-color: var(--lvl4); }
  /* Interlinear (medium mode): each word is a column — Arabic over its gloss. */
  .word.stacked { display: inline-flex; flex-direction: column; align-items: center;
    vertical-align: top; line-height: 1.35; }
  .word.stacked .w-gl { font-family: var(--ui-font); font-size: .58rem; color: var(--ink-soft);
    direction: ltr; letter-spacing: 0; margin-top: .1rem; max-width: 8.5rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .word.stacked.active .w-gl { color: var(--accent-ink); }
  .ar-line:has(.stacked) { line-height: 2.4; }
  #modeSeg button { font-family: var(--ui-font); display: inline-flex; align-items: baseline; gap: .3rem; }
  #modeSeg .m-ar { font-family: var(--ar-font); font-size: 1rem; }
  #modeSeg .m-en { font-size: .7rem; }
  .peek { border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
    cursor: pointer; border-radius: 999px; font-size: .7rem; line-height: 1; flex: none;
    padding: .35rem .6rem; font-family: var(--ui-font); }
  .peek:hover { color: var(--accent); border-color: var(--accent); }
  .sent-tools { display: flex; gap: .6rem; align-items: center; padding: .15rem .3rem 0; font-family: var(--ui-font); }
  .play {
    border: 1px solid var(--line); background: var(--panel); color: var(--accent); cursor: pointer;
    width: 1.7rem; height: 1.7rem; border-radius: 999px; font-size: .75rem; line-height: 1; flex: none;
    transition: border-color .12s, background .12s;
  }
  .play:hover { border-color: var(--accent); background: var(--accent-soft); }
  .trans {
    color: var(--ink-soft); font-size: .95rem;
    border-inline-start: 2px solid var(--line); padding-inline-start: .55rem;
  }
  .trans[hidden] { display: none; }

  .legend { margin-top: 2rem; border-top: 1px solid var(--line); padding-top: .8rem;
    font-family: var(--ui-font); font-size: .74rem; color: var(--ink-soft);
    display: flex; gap: 1rem; flex-wrap: wrap; }
  .legend .sw { display: inline-block; width: .62em; height: .62em; border-radius: 50%; vertical-align: middle; margin-inline-end: .3em; }
  footer.note { margin-top: 1.2rem; font-family: var(--ui-font); font-size: .74rem; color: var(--ink-soft); }

  /* ---------- bottom sheet ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(10,16,20,.45); z-index: 9; border: 0; padding: 0;
    opacity: 0; pointer-events: none; transition: opacity .2s;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; z-index: 10; left: 50%; bottom: 0; transform: translate(-50%, 105%);
    width: min(40rem, 100%); background: var(--panel); border: 1px solid var(--line); border-bottom: 0;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow);
    transition: transform .25s cubic-bezier(.3,.9,.35,1); max-height: 82vh; overflow-y: auto;
  }
  .sheet.show { transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .sheet, .scrim { transition: none; } }
  .sheet-inner { padding: 1rem 1.2rem 1.4rem; }
  .grab { width: 2.4rem; height: 4px; border-radius: 2px; background: var(--line); margin: .6rem auto 0; }
  .tabs { display: flex; gap: .15rem; margin: .4rem 0 .9rem; font-family: var(--ui-font); flex-wrap: wrap; }
  .tabs button {
    border: 0; background: transparent; color: var(--ink-soft); font-weight: 600; font-size: .8rem;
    padding: .35rem .6rem; cursor: pointer; border-bottom: 2px solid transparent;
  }
  .tabs button .ar { font-family: var(--ar-font); font-size: 1.05rem; }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  .lemma {
    font-family: var(--ar-font); font-size: 2.2rem; direction: rtl; text-align: right;
    line-height: 1.5; margin: 0 0 .2rem; padding: .3rem .6rem;
    background: linear-gradient(135deg, var(--accent-soft), transparent 75%); border-radius: 12px;
  }
  .lemma .say {
    font-size: 1.1rem; line-height: 1; cursor: pointer; vertical-align: middle;
    border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
    padding: .3rem .45rem; margin-inline-start: .4rem;
  }
  .lemma .say:hover { border-color: var(--accent); }
  .bab-line { direction: rtl; text-align: right; font-family: var(--ar-font); font-size: 1.05rem; color: var(--ink-soft); margin: .1rem 0 .3rem; }
  .facts { display: flex; gap: .45rem; flex-wrap: wrap; margin: .5rem 0 .7rem; }
  .gloss { font-size: 1.02rem; margin: .2rem 0; }
  .gloss small { color: var(--ink-soft); font-family: var(--ui-font); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; margin-inline-end: .45rem; }
  .segrow {
    direction: rtl; display: flex; gap: .4rem; flex-wrap: wrap; margin: .6rem 0;
    font-family: var(--ar-font); font-size: 1.25rem;
  }
  .segrow .seg-item { background: var(--accent-soft); border: 1px dashed var(--accent); border-radius: 8px; padding: .1rem .55rem; }
  .segrow .seg-item small { display: block; font-family: var(--ui-font); font-size: .62rem; color: var(--ink-soft); direction: ltr; text-align: center; }
  .sheet-actions { display: flex; gap: .6rem; margin-top: 1rem; font-family: var(--ui-font); flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--line); border-radius: 10px; padding: .55rem .9rem; cursor: pointer;
    font-family: var(--ui-font); font-weight: 600; font-size: .84rem; background: var(--panel); color: var(--ink);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.saved { background: var(--ok); border-color: var(--ok); color: #fff; }

  /* ---------- grammar ---------- */
  .gnote h3 { font-size: 1.05rem; margin: .8rem 0 .4rem; }
  .gnote .ar-inline { font-family: var(--ar-font); font-size: 1.25em; }
  .gnote p { margin: .4rem 0; font-size: .95rem; }
  .ex { border-inline-start: 3px solid var(--accent); padding: .3rem .8rem; margin: .55rem 0; background: var(--accent-soft); border-radius: 0 8px 8px 0; }
  .ex .ar { font-family: var(--ar-font); font-size: 1.35rem; direction: rtl; text-align: right; }
  .ex .en { color: var(--ink-soft); font-size: .88rem; }
  .mistake { border: 1px solid var(--line); border-radius: 10px; padding: .6rem .8rem; margin: .6rem 0; }
  .mistake .wrong { color: var(--danger); text-decoration: line-through; font-family: var(--ar-font); font-size: 1.25rem; direction: rtl; display: inline-block; }
  .mistake .right { color: var(--ok); font-family: var(--ar-font); font-size: 1.25rem; direction: rtl; display: inline-block; margin-inline-start: .8rem; }
  .mistake .why { font-size: .87rem; color: var(--ink-soft); margin-top: .3rem; }
  .mlabel { font-family: var(--ui-font); font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; color: var(--danger); font-weight: 700; margin-top: .9rem; }

  /* ---------- sarf (conjugation) ---------- */
  .tense-seg { margin: .6rem 0; }
  .conj-wrap { overflow-x: auto; }
  .word.in-phrase { background: linear-gradient(transparent 72%, var(--accent-soft) 72%); }
  .phrase-banner { border: 1px solid var(--accent); background: var(--accent-soft);
    border-radius: 12px; padding: .7rem .85rem; margin-bottom: .8rem; }
  .phrase-banner .pb-ar { font-family: var(--ar-font); font-size: 1.5rem; direction: rtl; text-align: right; }
  .phrase-banner .pb-gloss { font-family: var(--ui-font); font-weight: 600; margin-top: .25rem; }
  .phrase-banner .pb-lit { font-family: var(--ui-font); font-size: .78rem; color: var(--ink-soft); font-style: italic; }
  .phrase-banner .pb-note { font-family: var(--ui-font); font-size: .8rem; color: var(--ink-soft); margin-top: .35rem; }
  .deck-stats { display: flex; gap: .4rem; flex-wrap: wrap; margin: .6rem 0; font-family: var(--ui-font); font-size: .72rem; }
  .deck-stats .st { padding: .2rem .55rem; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-soft); }
  .deck-stats .fresh { color: var(--accent); border-color: var(--accent); }
  .deck-stats .leech { color: var(--danger); border-color: var(--danger); }
  .deck-stats button.export { cursor: pointer; background: var(--panel); font: inherit; color: var(--accent); border-color: var(--accent); }
  .deck-stats button.export:hover { background: var(--accent-soft); }
  .readbar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 6; pointer-events: none; }
  .readbar div { height: 100%; width: 0%; background: var(--accent); transition: width .1s linear; }
  .lib-mode .readbar { display: none; }
  ::selection { background: var(--accent-soft); }
  .sheet::-webkit-scrollbar { width: 8px; }
  .sheet::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .empty { text-align: center; padding: 1.8rem 1rem; color: var(--ink-soft); }
  #toast {
    position: fixed; left: 50%; bottom: 1.4rem; transform: translate(-50%, 300%);
    background: var(--ink); color: var(--ground); font-family: var(--ui-font);
    font-size: .84rem; font-weight: 600; padding: .6rem 1.15rem; border-radius: 999px;
    box-shadow: var(--shadow-sm); z-index: 20; transition: transform .25s ease; pointer-events: none;
    max-width: min(90vw, 24rem); text-align: center;
  }
  #toast.show { transform: translate(-50%, 0); }
  /* A story should print like a worksheet: text and translations only. */
  /* ================= design wave 2 =======================================
     The opened story gets the same cover treatment the shelf speaks: a
     level-tinted hero band around the title. Sheet tabs become a soft
     segmented pill; the sheet itself opens with a touch more spring and a
     blurred backdrop; the games hub becomes a two-up hall of door-cards.
     Everything degrades: no :has(), no color-mix, no backdrop-filter — the
     older layout simply remains. */
  body:not(.lib-mode) header.app {
    margin: 0 -1.1rem; padding: 1.2rem 1.1rem 1rem; border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    background: linear-gradient(160deg, var(--accent-soft), transparent 78%);
    border-bottom: 1px solid var(--line);
  }
  body:not(.lib-mode) header.app[data-lvlc="1"] { background: linear-gradient(160deg, color-mix(in srgb, var(--lvl1) 15%, transparent), transparent 78%); }
  body:not(.lib-mode) header.app[data-lvlc="2"] { background: linear-gradient(160deg, color-mix(in srgb, var(--lvl2) 15%, transparent), transparent 78%); }
  body:not(.lib-mode) header.app[data-lvlc="3"] { background: linear-gradient(160deg, color-mix(in srgb, var(--lvl3) 15%, transparent), transparent 78%); }
  body:not(.lib-mode) header.app[data-lvlc="4"] { background: linear-gradient(160deg, color-mix(in srgb, var(--lvl4) 15%, transparent), transparent 78%); }
  body:not(.lib-mode) h1.story-title { text-align: center; }
  body:not(.lib-mode) .story-sub { text-align: center; }
  body:not(.lib-mode) #metaRow { justify-content: center; }

  .scrim.show { backdrop-filter: blur(2.5px); }
  .sheet { transition: transform .34s cubic-bezier(.22, 1.08, .36, 1); }
  .grab { width: 3rem; opacity: .8; }

  .tabs {
    gap: .3rem; background: var(--accent-soft); padding: .28rem;
    border-radius: 999px; width: max-content; max-width: 100%;
  }
  .tabs button { border-radius: 999px; padding: .38rem .85rem; border-bottom: 0; }
  .tabs button.on {
    background: var(--panel); color: var(--accent); border-bottom: 0;
    box-shadow: var(--shadow-sm);
  }

  .game-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: .7rem; }
  .game-pick button {
    position: relative; overflow: hidden; text-align: start;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
    padding: .9rem 1rem; cursor: pointer; color: var(--ink);
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .game-pick button::after {
    content: "؟"; position: absolute; inset-inline-end: -.35rem; bottom: -1.3rem;
    font-family: var(--ar-font); font-size: 4.2rem; line-height: 1;
    color: var(--accent); opacity: .07; pointer-events: none;
  }
  .game-pick button:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
  @media (prefers-reduced-motion: no-preference) {
    .game-pick button:hover { transform: translateY(-1px); }
  }
  .game-pick .gt { font-weight: 700; font-family: var(--ui-font); }
  .game-pick .gd { color: var(--ink-soft); font-size: .82rem; margin-top: .15rem; }

  /* The nakil table's two chapters: section rows read as headings, and the
     verb's own bab glows the accent it earned. */
  table.conj.nakil .nakil-sec th {
    text-align: center; font-family: var(--ar-font); font-size: 1.02rem;
    padding-top: .8rem; color: var(--ink-soft); border-bottom: 1px solid var(--line);
  }
  table.conj.nakil tr.own-bab td, table.conj.nakil tr.own-bab th {
    background: var(--accent-soft);
  }
  table.conj.nakil tr.own-bab .nakil-out { color: var(--accent); }

  /* The ziyade extension rows: set off from the fourteen by a rule and a
     whisper of the accent — the recitation's second breath. */
  table.conj.muhtelife tr:not(.ext) + tr.ext td, table.conj.muhtelife tr:not(.ext) + tr.ext th { border-top: 2px solid var(--line); }
  table.conj.muhtelife tr.ext th { font-style: italic; }

  /* ================= design wave 3: the learning loop ====================
     The review card becomes a CARD — a lifted face on a stacked deck, the
     word held in the middle of a soft glow, the next cards peeking out
     beneath. Grades speak in four colours (the SRS's own temperament:
     again/hard/good/easy). Quiz options become cards that lift, and the
     right answer rings instead of merely tinting. */
  .deck-card {
    position: relative; text-align: center;
    border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 2rem 1.2rem 0; margin: 1.1rem 2px .9rem;
    background: radial-gradient(120% 95% at 50% 0%, var(--accent-soft), transparent 62%) var(--panel);
    box-shadow: var(--shadow-sm);
  }
  .deck-card::before, .deck-card::after {
    content: ""; position: absolute; z-index: -1; height: 16px;
    border: 1px solid var(--line); background: var(--panel);
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  }
  .deck-card::before { inset: auto 5% -6px 5%; opacity: .8; }
  .deck-card::after { inset: auto 10% -12px 10%; opacity: .5; }
  .deck-card .front { font-size: 2.7rem; line-height: 1.9; }
  .deck-card .step {
    margin-top: 1.1rem; padding: .55rem 0 .7rem;
    border-top: 1px dashed var(--line); font-size: .72rem; letter-spacing: .03em;
  }
  .deck-card .verb-answer, .deck-card .note-ex-gloss { margin-top: .3rem; }
  .grade-row { gap: .45rem; }
  .grade-row .btn.grade {
    border-radius: 12px; border-width: 1.5px; padding: .6rem .2rem .55rem;
    transition: transform .12s, box-shadow .12s, background .12s;
  }
  .grade-row .btn.grade:hover { box-shadow: var(--shadow-sm); }
  @media (prefers-reduced-motion: no-preference) {
    .grade-row .btn.grade:hover { transform: translateY(-1px); }
  }
  .grade-row .hard { border-color: var(--lvl3); color: var(--lvl3); }
  .grade-row .good { border-color: var(--ok); color: var(--ok); }
  .grade-row .again:hover { background: color-mix(in srgb, var(--danger) 8%, transparent); }
  .grade-row .hard:hover  { background: color-mix(in srgb, var(--lvl3) 8%, transparent); }
  .grade-row .good:hover  { background: color-mix(in srgb, var(--ok) 8%, transparent); }
  .grade-row .easy:hover  { background: var(--accent-soft); }
  .deck-list li { padding: .55rem .35rem; border-radius: 10px; border-bottom-color: transparent; transition: background .12s; }
  .deck-list li + li { border-top: 1px solid var(--line); }
  .deck-list li:hover { background: var(--accent-soft); }
  .deck-list button {
    border: 1px solid transparent; border-radius: 999px; padding: .15rem .55rem;
    transition: border-color .12s, background .12s;
  }
  .deck-list button:hover { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 7%, transparent); }

  .game-q {
    text-align: center; background: var(--accent-soft);
    border-radius: var(--radius); padding: .9rem .8rem; margin: .5rem 0 .8rem;
  }
  .opts button {
    border-radius: 12px; padding: .7rem .9rem;
    transition: border-color .12s, background .12s, transform .12s, box-shadow .12s;
  }
  .opts button:hover:not(.right):not(.wrongpick) { box-shadow: var(--shadow-sm); }
  @media (prefers-reduced-motion: no-preference) {
    .opts button:hover:not(.right):not(.wrongpick) { transform: translateY(-1px); }
  }
  .opts button.right {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 30%, transparent);
  }
  .opts button.wrongpick {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 22%, transparent);
  }
  #qWhy {
    border-inline-start: 3px solid var(--accent); background: var(--accent-soft);
    border-radius: 0 var(--radius) var(--radius) 0; padding: .6rem .8rem; margin: .6rem 0;
  }
  #qWhy:empty, #qWhy[hidden] { display: none; }
  /* A saved word's underline turns the deck's green in every story — the
     page shows what is already yours (and flips live on save/remove). */
  .underlines .word.in-deck { text-decoration-color: color-mix(in srgb, var(--ok) 62%, transparent); }
  .word.in-deck:hover { background: color-mix(in srgb, var(--ok) 9%, transparent); }
  /* The card's birth-sentence, shown on reveal: the word at home. */
  .card-ctx {
    font-family: var(--ar-font); font-size: 1.3rem; line-height: 2.1;
    margin: .55rem auto 0; max-width: 32rem; color: var(--ink-soft);
  }
  .card-ctx b { color: var(--accent); font-weight: 700; }
  .card-ctx { cursor: pointer; border-radius: 8px; padding: .15rem .4rem; transition: background .12s; }
  .card-ctx:hover { background: var(--accent-soft); }

  .empty { position: relative; padding-top: 2.6rem; }
  .empty::before {
    content: "﴿ ﴾"; position: absolute; top: .7rem; left: 50%; transform: translateX(-50%);
    letter-spacing: .35em; color: var(--accent); opacity: .45; font-size: .9rem;
  }

  @media print {
    nav.controls, .legend, footer.note, .readbar, .sent-tools .play,
    .peek, .ch-nav, #toast, .scrim, .sheet { display: none !important; }
    body { background: #fff; color: #000; }
    section.sentence { break-inside: avoid; margin: .7rem 0; }
    .wrap { max-width: none; padding: 0; }
  }
  .jumla-row { transition: border-color .12s; }
  .jumla-row:hover { border-color: var(--accent); }
  .ref-list button { border-radius: 8px; transition: background .12s; }
  .grade-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: .35rem; margin: .8rem 0; }
  .grade-row .btn.grade { display: flex; flex-direction: column; align-items: center; gap: .12rem; padding: .5rem .2rem; }
  .grade-row .btn.grade b { font-size: .8rem; }
  .grade-row .btn.grade i { font-style: normal; font-size: .66rem; color: var(--ink-soft); }
  .grade-row .again { border-color: var(--danger); color: var(--danger); }
  .grade-row .easy  { border-color: var(--accent); color: var(--accent); }
  .verb-ask { font-family: var(--ui-font); font-size: .85rem; color: var(--ink-soft); margin-top: .5rem; }
  .verb-answer { font-family: var(--ar-font); font-size: 1.8rem; direction: rtl; margin-top: .3rem; }
  .note-ex-gloss { font-family: var(--ui-font); font-size: .82rem; color: var(--ink-soft); margin-top: .25rem; }
  .game-q .sigha { font-family: var(--ui-font); font-size: .85rem; color: var(--accent); margin-top: .35rem; }
  .game-q .target { color: var(--accent); border-bottom: 2px solid var(--accent); }
  table.conj.muhtelife th.person { text-align: start; font-family: var(--ui-font); font-size: .78rem; white-space: nowrap; }
  table.conj.muhtelife td { font-size: 1.25rem; text-align: right; direction: rtl; }
  table.conj.muhtelife tr.majhul th, table.conj.muhtelife tr.majhul td { background: var(--accent-soft); }
  table.conj {
    width: 100%; border-collapse: collapse; direction: rtl;
    font-family: var(--ar-font); font-size: 1.15rem;
  }
  table.conj th {
    font-family: var(--ui-font); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-soft); font-weight: 600; padding: .3rem .5rem; text-align: center;
    border-bottom: 1px solid var(--line);
  }
  table.conj th.person { font-family: var(--ar-font); font-size: .95rem; letter-spacing: 0; text-transform: none; text-align: right; }
  table.conj td { padding: .35rem .5rem; text-align: center; border-bottom: 1px solid var(--line); }
  table.conj td.hl { background: var(--accent-soft); border-radius: 8px; color: var(--accent); font-weight: 600; }
  .sarf-note { font-size: .85rem; color: var(--ink-soft); font-family: var(--ui-font); margin-top: .6rem; }

  /* ---------- i'rab ---------- */
  .irab-ar { direction: rtl; text-align: right; font-family: var(--ar-font); font-size: 1.25rem; line-height: 2;
    background: var(--accent-soft); border-radius: 10px; padding: .6rem .9rem; margin: .5rem 0; }
  .irab-en { font-size: .9rem; color: var(--ink-soft); }

  /* ---------- sentence i'rab sheet ---------- */
  .sheet-line { direction: rtl; text-align: right; font-family: var(--ar-font); font-size: 1.35rem;
    line-height: 2; margin: .5rem 0 .2rem; }
  .sheet-tr { font-family: var(--ui-font); font-size: .88rem; color: var(--ink-soft); margin-bottom: .8rem; }
  table.irab-sheet { width: 100%; border-collapse: collapse; font-family: var(--ui-font); font-size: .85rem; }
  table.irab-sheet th { text-align: start; font-size: .66rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-soft); font-weight: 600; padding: 0 .4rem .35rem; border-bottom: 1px solid var(--line); }
  table.irab-sheet td { padding: .5rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.irab-sheet tr:last-child td { border-bottom: none; }
  table.irab-sheet td.n { color: var(--ink-soft); font-size: .75rem; width: 1.6rem;
    font-variant-numeric: tabular-nums; }
  table.irab-sheet td.w { font-family: var(--ar-font); font-size: 1.2rem; direction: rtl; text-align: right;
    white-space: nowrap; }
  table.irab-sheet td.w small { display: block; font-family: var(--ui-font); font-size: .68rem;
    direction: ltr; text-align: start; color: var(--ink-soft); white-space: normal; }
  table.irab-sheet .ir-ar { font-family: var(--ar-font); font-size: 1.05rem; direction: rtl; text-align: right;
    display: block; margin-bottom: .2rem; }
  table.irab-sheet button.jump { all: unset; cursor: pointer; color: var(--accent); font-size: .7rem;
    font-family: var(--ui-font); }
  table.irab-sheet button.jump:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sheet-topics { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .9rem; }

  /* ---------- corpus search ---------- */
  .hit-lex { display: flex; align-items: baseline; gap: .5rem; margin: 1rem 0 .3rem;
    padding-bottom: .3rem; border-bottom: 1px solid var(--line); }
  .hit-lex .hl-ar { font-family: var(--ar-font); font-size: 1.3rem; }
  .hit-lex .hl-gl { font-family: var(--ui-font); font-size: .82rem; color: var(--ink-soft); flex: 1; }
  .hit-lex .hl-n { font-family: var(--ui-font); font-size: .7rem; color: var(--ink-soft);
    font-variant-numeric: tabular-nums; }
  .hit { all: unset; display: block; cursor: pointer; width: 100%; box-sizing: border-box;
    padding: .5rem .6rem; border-radius: 10px; border: 1px solid transparent; }
  .hit:hover, .hit:focus-visible { border-color: var(--accent); background: var(--accent-soft); }
  .hit .h-ar { font-family: var(--ar-font); font-size: 1.15rem; direction: rtl; text-align: right;
    line-height: 1.9; }
  .hit .h-ar b { color: var(--accent); font-weight: inherit;
    background: linear-gradient(transparent 70%, var(--accent-soft) 70%); }
  .hit .h-src { font-family: var(--ui-font); font-size: .7rem; color: var(--ink-soft); margin-top: .15rem; }
  .tbtn.streak { font-family: var(--ui-font); font-size: .78rem; font-variant-numeric: tabular-nums; }
  .daily { border: 1px solid var(--line); border-radius: 12px; padding: .7rem .8rem; margin: .6rem 0;
    font-family: var(--ui-font); }
  .daily .d-head { display: flex; align-items: baseline; gap: .6rem; margin-bottom: .5rem; }
  .daily .d-streak { font-weight: 700; font-size: .95rem; flex: 1; }
  .daily .d-goal { all: unset; cursor: pointer; color: var(--accent); font-size: .74rem; }
  .daily .d-goal:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .daily .d-bar { height: 7px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: .35rem; }
  .daily .d-bar span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .daily .d-bar.new span { background: var(--lvl3, var(--accent)); }
  .daily .d-lbl { font-size: .72rem; color: var(--ink-soft); margin-top: .2rem;
    font-variant-numeric: tabular-nums; }
  .daily .d-learn { display: block; width: 100%; margin-top: .7rem; text-align: center; }
  .root-btn { all: unset; cursor: pointer; }
  .root-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip.tappable { cursor: pointer; }
  .chip.tappable:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- grammar reference ---------- */
  .ref-group { font-family: var(--ui-font); font-size: .68rem; letter-spacing: .13em; text-transform: uppercase;
    color: var(--ink-soft); margin: 1.1rem 0 .3rem; display: flex; align-items: center; gap: .6rem; }
  .ref-group .ar { font-family: var(--ar-font); font-size: 1rem; letter-spacing: 0; text-transform: none; color: var(--ink); }
  .ref-group::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .ref-list { list-style: none; margin: 0; padding: 0; }
  .ref-list li { border-bottom: 1px solid var(--line); }
  .ref-list button {
    width: 100%; border: 0; background: none; cursor: pointer; color: var(--ink);
    display: flex; align-items: baseline; gap: .7rem; padding: .55rem .2rem; text-align: start;
  }
  .ref-list button:hover { background: var(--accent-soft); }
  .ref-list .t-ar { font-family: var(--ar-font); font-size: 1.25rem; direction: rtl; }
  .ref-list .t-en { color: var(--ink-soft); font-family: var(--ui-font); font-size: .8rem; flex: 1; }
  .ref-intro { font-size: .85rem; color: var(--ink-soft); font-family: var(--ui-font); margin: .2rem 0 .4rem; }
  .ref-search-row { margin: .6rem 0 .5rem; }
  .ref-search {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
    color: var(--ink); font-family: var(--ui-font); font-size: .9rem; padding: .55rem .75rem;
  }
  .ref-search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ref-levels { flex-wrap: wrap; margin-bottom: .3rem; }
  .ref-levels button { font-family: var(--ui-font); font-size: .78rem; padding: .3rem .7rem; }
  .ref-empty { font-size: .88rem; color: var(--ink-soft); font-family: var(--ui-font); margin: 1.2rem 0; text-align: center; }

  /* ---------- library ---------- */
  .lib-mode .reader-only { display: none !important; }
  .lib-card {
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
    padding: 1rem 1.1rem 1rem 1.25rem; cursor: pointer; display: block; width: 100%; text-align: start;
    margin: .8rem 0; color: var(--ink); font-family: var(--body-font);
    position: relative; overflow: hidden;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  /* The level's colour, as a spine on the card — the same colour system the

const GRAMMAR = {"afal-khamsa":{"title":{"ar":"الْأَفْعَالُ الْخَمْسَةُ","en":"The five verbs (raf' by the nun)","tr":"Emsile-i Hamse (beş fiil)"},"level":3,"group":"sarf","explanation":{"en":"Five mudari' patterns end in a pronoun plus nun: يَفْعَلَانِ، تَفْعَلَانِ، يَفْعَلُونَ، تَفْعَلُونَ، تَفْعَلِينَ. In these the ending vowels cannot move, so the nun itself becomes the i'rab sign: its PRESENCE is raf' (ثُبُوتُ النُّونِ), its DROPPING is both nasb and jazm (حَذْفُ النُّونِ) — فَإِنْ لَمْ تَفْعَلُوا وَلَنْ تَفْعَلُوا shows the same حذف under لَمْ and لَنْ alike. That is why a reader cannot tell nasb from jazm by the verb's shape here: only the governor before it decides. The waw, alif or ya that remains is the fa'il, a pronoun in the position of raf'. The madrasah calls these الأمثلة الخمسة — five EXAMPLES, two of them (تفعلان، and the shared يفعلان pattern) covering both genders.","tr":"Beş muzâri kalıbı zamir + nûn ile biter: يَفْعَلَانِ، تَفْعَلَانِ، يَفْعَلُونَ، تَفْعَلُونَ، تَفْعَلِينَ. Bunlarda son hareke oynayamaz; bu yüzden i'rab alâmeti nûnun kendisidir: nûnun SÜBUTU ref (ثُبُوتُ النُّونِ), DÜŞMESİ hem nasb hem cezmdir (حَذْفُ النُّونِ) — فَإِنْ لَمْ تَفْعَلُوا وَلَنْ تَفْعَلُوا âyetinde لَمْ ile لَنْ altında aynı hazf görülür. Bu sebeple burada nasb ile cezm fiilin şeklinden ayırt edilemez: hükmü yalnız baştaki âmil verir. Geriye kalan vâv, elif yahut yâ fâildir — mahallen merfû zamirdir. Medrese bunlara el-Emsiletü'l-Hamse der."},"plain":{"en":"Present verbs ending in -ani, -una or -ina (they-two do, they do, you-fem do) show their case with the NUN: nun present = raf', nun dropped = nasb or jazm.","tr":"Sonu -âni, -ûne, -îne ile biten muzâriler (yaparlar-iki, yaparlar, yaparsın-müennes) i'rabını NÛN ile gösterir: nûn duruyorsa ref, düşmüşse nasb veya cezm."},"sources":["قطر الندى (ابن هشام) — إعراب الأمثلة الخمسة","الكافية (ابن الحاجب)"],"examples":[{"ar":"هُمْ يَعْمَلُونَ الصَّالِحَاتِ.","gloss":{"en":"They do righteous deeds — raf' shown by the nun staying (ثبوت النون).","tr":"Onlar salih ameller işlerler — ref, nûnun sübutuyladır."},"src":null},{"ar":"فَإِنْ لَمْ تَفْعَلُوا وَلَنْ تَفْعَلُوا…","gloss":{"en":"«If you do not — and you never will…» (al-Baqara 2:24): the SAME dropped nun serves لَمْ as jazm and لَنْ as nasb.","tr":"«Yapmadıysanız — ki asla yapamayacaksınız…» (Bakara 2:24): AYNI nûn hazfi, لَمْ altında cezm, لَنْ altında nasbdır."},"src":null}],"mistakes":[{"wrong":"لَمْ يَفْعَلُونَ","right":"لَمْ يَفْعَلُوا","why":{"en":"A jazm governor must drop the nun of the five verbs; keeping it leaves the verb marfu' under a jazim.","tr":"Cezm eden âmil, beş fiilin nûnunu düşürmek zorundadır; nûn kalırsa fiil câzimin altında merfû kalmış olur."}},{"wrong":"أَنْتِ تَفْعَلِي (مرفوعًا)","right":"أَنْتِ تَفْعَلِينَ","why":{"en":"With no nasb or jazm governor, the nun must stay — تفعلي without a governor is not raf', it is a mistake.","tr":"Nasb veya cezm eden âmil yokken nûn durmalıdır — âmilsiz تفعلي ref değil, hatadır."}}]},"afal-tasyir":{"title":{"ar":"أَفْعَالُ التَّصْيِيرِ (الَّتِي تَنْصِبُ مَفْعُولَيْنِ)","en":"Verbs of transformation — two objects","tr":"Tasyîr fiilleri (iki mef'ûl alanlar)"},"level":5,"group":"nahw","explanation":{"en":"Most verbs take one object. A small family takes TWO, and the second is not a second thing acted on — it is what the first BECOMES. Grammarians call these أَفْعَالُ التَّصْيِير, the verbs of turning-into: صَيَّرَ، جَعَلَ، اتَّخَذَ، رَدَّ، تَرَكَ. The test is that the two objects, stripped of the verb, would make a sound nominal sentence: يُصَيِّرُ الْقَلِيلَ كَثِيرًا comes from الْقَلِيلُ كَثِيرٌ. That is why the second object is indefinite here — it is a predicate, not a named thing. The wider family (أَفْعَالُ الْقُلُوبِ: ظَنَّ، حَسِبَ، عَلِمَ، رَأَى) works the same way but reports a belief rather than a change: ظَنَنْتُ الْأَمْرَ سَهْلًا.","tr":"Fiillerin çoğu bir mef'ûl alır. Küçük bir grup İKİ mef'ûl alır ve ikincisi, üzerinde iş yapılan ikinci bir şey değildir — birincinin DÖNÜŞTÜĞÜ şeydir. Gramerciler bunlara tasyîr fiilleri der: صَيَّرَ، جَعَلَ، اتَّخَذَ، رَدَّ، تَرَكَ. Ölçü şudur: iki mef'ûl, fiilden soyutlandığında sağlam bir isim cümlesi verir: يُصَيِّرُ الْقَلِيلَ كَثِيرًا, aslı الْقَلِيلُ كَثِيرٌ'dur. İkinci mef'ûlün burada nekre olmasının sebebi budur — o bir haberdir, adı konmuş bir nesne değil. Daha geniş aile (kalp fiilleri: ظَنَّ، حَسِبَ، عَلِمَ، رَأَى) aynı şekilde çalışır, fakat değişimi değil bir kanaati bildirir: ظَنَنْتُ الْأَمْرَ سَهْلًا."},"plain":{"en":"A handful of verbs take two objects, and the second is what the first turns into: «it makes the few of verbs many».","tr":"Birkaç fiil iki mef'ûl alır ve ikincisi, birincinin dönüştüğü şeydir: «fiillerin azını çok kılar»."},"mamul":"mansub","sources":["الكافية (ابن الحاجب)","المنصوبات","قطر الندى (ابن هشام)","الفوائد الضيائية (ملا جامي)"],"examples":[{"ar":"لِأَنَّهُ يُصَيِّرُ الْقَلِيلَ مِنَ الْأَفْعَالِ كَثِيرًا.","gloss":{"en":"Because it turns the few of verbs into many — al-Maqsud's reason for studying sarf; الْقَلِيلَ is the first object and كَثِيرًا the second.","tr":"Zira az olan fiilleri çok kılar — Maksûd'un sarf öğrenme gerekçesi; الْقَلِيلَ birinci, كَثِيرًا ikinci mef'ûldür."},"src":"min-muqaddimat-al-maqsud"},{"ar":"جَعَلَ اللَّهُ الْمَاءَ طَهُورًا.","gloss":{"en":"Allah made water purifying — from الْمَاءُ طَهُورٌ.","tr":"Allah suyu temizleyici kıldı — الْمَاءُ طَهُورٌ cümlesinden."},"src":null},{"ar":"ظَنَنْتُ الْأَمْرَ سَهْلًا.","gloss":{"en":"I thought the matter easy — the same two-object shape, reporting a belief.","tr":"İşi kolay zannettim — aynı iki mef'ûllü yapı, bir kanaati haber verir."},"src":null}],"mistakes":[{"wrong":"يُصَيِّرُ الْقَلِيلَ الْكَثِيرَ","right":"يُصَيِّرُ الْقَلِيلَ كَثِيرًا","why":{"en":"The second object is a predicate, so it stays indefinite. Making it definite reads as two separate things being acted on.","tr":"İkinci mef'ûl bir haberdir, bu yüzden nekre kalır. Marife yapılırsa üzerinde iş yapılan iki ayrı şey gibi okunur."}},{"wrong":"يُصَيِّرُ الْقَلِيلَ كَثِيرٌ","right":"يُصَيِّرُ الْقَلِيلَ كَثِيرًا","why":{"en":"Both objects are mansub. Leaving the second in raf' treats it as the original khabar, forgetting that the verb has taken the sentence over.","tr":"Her iki mef'ûl de mansubdur. İkincisi merfû bırakılırsa asıl haber sanılır; hâlbuki fiil cümleyi kendi amelini altına almıştır."}},{"wrong":"يُصَيِّرُ الْقَلِيلَ إِلَى كَثِيرٍ","right":"يُصَيِّرُ الْقَلِيلَ كَثِيرًا","why":{"en":"No preposition is needed: the transformation is carried by the second object itself. Adding إِلَى copies the Turkish or English «into».","tr":"Harf-i cere gerek yoktur: dönüşümü ikinci mef'ûlün kendisi taşır. إِلَى eklemek Türkçedeki «-e» ekini kopyalamaktır."}}]},"an-masdariyya":{"title":{"ar":"أَنْ الْمَصْدَرِيَّة","en":"'an + subjunctive","tr":"أَنْ masdariyye + mansub muzâri"},"level":2,"group":"awamil","explanation":{"en":"أَنْ turns a verb into the equivalent of a masdar (\"that he return\" = \"his returning\") and forces the present verb into the subjunctive (mansub): a fatha replaces the final damma. In Birgivi's Awamil it is listed first among the four nasb particles: أَنْ، لَنْ، كَيْ، إِذَنْ. The whole clause then acts as a noun — in this story, أَنْ يَرْجِعَ is the object of أَرَادَ.","tr":"أَنْ fiili masdar hükmüne sokar ve muzariyi nasbeder: son ötre fetha olur. Birgivî'nin Avâmil'inde nasb edatlarının ilki sayılır: أَنْ، لَنْ، كَيْ، إِذَنْ. Cümle isim gibi işlem görür — bu hikâyede أَنْ يَرْجِعَ, أَرَادَ fiilinin mef'ulüdür."},"plain":{"en":"أَنْ before a present verb turns the clause into a noun — «to return» — and changes the verb's ending.","tr":"Muzârinin başındaki أَنْ cümleyi isme çevirir — «dönmek» — ve fiilin sonunu değiştirir."},"amil":"مِنْ نَوَاصِبِ الْمُضَارِعِ — a governor (amil) that puts the following verb in nasb","sources":["عوامل البركوي — النواصب الأربعة: أَنْ لَنْ كَيْ إِذَنْ","الكافية (ابن الحاجب) — الحروف المصدرية"],"examples":[{"ar":"أَرَادَ يُوسُفُ أَنْ يَرْجِعَ.","gloss":{"en":"Yusuf wanted to return.","tr":"Yusuf dönmek istedi."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"أُحِبُّ أَنْ أَقْرَأَ.","gloss":{"en":"I love to read.","tr":"Okumayı severim."},"src":null},{"ar":"يَجِبُ أَنْ تَذْهَبُوا.","gloss":{"en":"You (pl.) must go — the نون drops: تَذْهَبُونَ → تَذْهَبُوا.","tr":"Gitmeniz gerekir — nûn düşer: تَذْهَبُونَ → تَذْهَبُوا."},"src":null}],"mistakes":[{"wrong":"أراد أن يرجعُ","right":"أراد أن يرجعَ","why":{"en":"The damma stays by habit. After أَنْ the verb is mansub: fatha, not damma.","tr":"Ötre alışkanlıkla kalıyor; أَنْ'den sonra fiil mansubdur: fetha, ötre değil."}},{"wrong":"أريد أَنَّ أذهبَ","right":"أريد أَنْ أذهبَ","why":{"en":"Confusing أَنْ (with verbs) and أَنَّ (with a following noun, from the إنّ family). Before a verb use أَنْ.","tr":"أَنْ (fiille) ile أَنَّ (isimle, إنّ ailesinden) karıştırılıyor. Fiilden önce أَنْ kullanılır."}},{"wrong":"يجب أن تذهبونَ","right":"يجب أن تذهبوا","why":{"en":"The five verbs (الأفعال الخمسة) mark nasb by dropping the ن — keeping it is a very common error.","tr":"Ef'al-i hamse nasbı نون düşmesiyle gösterir: تذهبون → أن تذهبوا."}}]},"anwa-al-jumal":{"title":{"ar":"أَنْوَاعُ الْجُمَلِ وَمَحَلُّهَا مِنَ الْإِعْرَابِ","en":"Kinds of clauses, and their place in i'rab","tr":"Cümle çeşitleri ve i'rabdan mahalleri"},"level":6,"group":"nahw","explanation":{"en":"A sentence that begins with a noun is ISMIYYA; with a verb, FI'LIYYA. Ibn Hisham's Qawa'id al-I'rab then divides all clauses into two sevens. Clauses WITH a place in i'rab: (1) a khabar clause — raf' after a mubtada or إِنَّ, nasb after كَانَ; (2) a hal clause — nasb; (3) an object clause — nasb, chiefly the quoted speech after قَالَ; (4) a mudaf-ilayh clause — jarr, after إِذَا، لَمَّا، حَيْثُ; (5) the answer of a JAZM condition — jazm, but only when it is tied on with فَ or the إِذَا of surprise; (6) a clause standing as sifa to a noun — matching its noun's case; (7) any clause joined by atf to one of these. Clauses WITHOUT a place: (1) the opener (ibtida'iyya / isti'nafiyya); (2) the sila of a relative — including the sila of a harfi mawsul like أَنْ; (3) the parenthetical (mu'tarida), such as a دُعَاء dropped mid-sentence; (4) the explanatory (tafsiriyya); (5) the answer of an oath; (6) the answer of a NON-jazm condition (لَوْ، لَوْلَا، إِذَا) — and the answer of a jazm condition NOT tied on with فَ; (7) whatever follows one of these by atf. The i'rab sheet of every analysed sentence in this app names its clauses by exactly this list.","tr":"İsimle başlayan cümle İSMİYYE, fiille başlayan FİİLİYYE'dir. İbn Hişâm'ın Kavâidü'l-İ'râb'ı bütün cümleleri iki yediliye ayırır. İ'rabdan MAHALLİ OLAN cümleler: (1) haber cümlesi — mübteda ve إِنَّ'den sonra ref, كَانَ'den sonra nasb; (2) hâl cümlesi — nasb; (3) mef'ûl cümlesi — nasb, en çok قَالَ'den sonraki makûlü'l-kavl; (4) muzâfun ileyh cümlesi — cer, إِذَا، لَمَّا، حَيْثُ'den sonra; (5) CEZM eden şartın cevabı — yalnız فَ yahut izâ-i fücâiyye ile bağlandığında cezm; (6) bir isme sıfat olan cümle — mevsufunun i'rabınca; (7) bunlardan birine atıfla bağlanan cümle. MAHALLİ OLMAYAN cümleler: (1) ibtidâiyye/isti'nâfiyye; (2) sıla cümlesi — أَنْ gibi harfî mevsûlün sılası dahil; (3) mu'tarıza (ara) cümlesi — cümle ortasına düşen duâ gibi; (4) tefsiriyye; (5) kasemin cevabı; (6) cezmedici OLMAYAN şartın (لَوْ، لَوْلَا، إِذَا) cevabı — ve cezmedici şarta فَ'sız gelen cevap; (7) bunlara tâbi olan. Bu uygulamada tahlilli her cümlenin i'rab sayfası, cümleleri tam bu listeyle adlandırır."},"plain":{"en":"A whole clause can sit where a single word would sit — as a khabar, a hal, an object — and then it takes that word's case «by position». Other clauses (openers, relative clauses, asides) sit nowhere, and have no case at all.","tr":"Bütün bir cümle, tek bir kelimenin oturacağı yere oturabilir — haber, hâl, mef'ûl olarak — ve o kelimenin i'rabını «mahallen» alır. Başka cümleler (başlangıç, sıla, ara cümleleri) hiçbir yere oturmaz; onların i'rabdan mahalli yoktur."},"sources":["الإعراب عن قواعد الإعراب (ابن هشام) — الباب الأول","مغني اللبيب (ابن هشام)"],"examples":[{"ar":"هٰذِهِ وَصِيَّةُ الْإِمَامِ — رَحِمَهُ اللهُ — لِتِلْمِيذِهِ.","gloss":{"en":"The opener is an ismiyya with no place in i'rab; «may Allah have mercy on him» is a mu'tarida — also i'rabless, an aside of supplication.","tr":"Baştaki cümle ismiyye-ibtidâiyyedir, mahalli yoktur; «رحمه الله» mu'tarızadır — duâ arası, onun da mahalli yoktur."},"src":"wasiyyat-abi-hanifa-samti"},{"ar":"كَأَنِّي بِكَ وَقَدْ دَخَلْتَ بَصْرَةَ.","gloss":{"en":"«You have entered Basra» is a hal clause — in the position of nasb, licensed by the waw and قَدْ.","tr":"«دخلت بصرة» hâl cümlesidir — vâv ve قَدْ ile mahallen mensubtur."},"src":null}],"mistakes":[{"wrong":"جُمْلَةُ الصِّلَةِ فِي مَحَلِّ رَفْعٍ","right":"جُمْلَةُ الصِّلَةِ لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ","why":{"en":"The relative NOUN takes the case; its sila never does. Giving the sila a mahall doubles one seat of i'rab into two.","tr":"İ'rabı alan İSM-İ MEVSÛLDÜR; sılası asla almaz. Sılaya mahall vermek, tek i'rab makamını ikiye katlamaktır."}},{"wrong":"مَتَى أَسَأْتَ صَارُوا لَكَ أَعْدَاءً — جُمْلَةُ الْجَوَابِ فِي مَحَلِّ جَزْمٍ","right":"جُمْلَةُ الْجَوَابِ لَا مَحَلَّ لَهَا لِأَنَّهَا لَمْ تَقْتَرِنْ بِالْفَاءِ","why":{"en":"Only an answer tied on with فَ (or the إِذَا of surprise) occupies the position of jazm; a bare answer leaves the jazm on the verb itself and the clause i'rabless.","tr":"Yalnız فَ (yahut izâ-i fücâiyye) ile bağlanan cevap cezm mahallini tutar; çıplak cevapta cezm fiilin kendisindedir, cümlenin mahalli yoktur."}}]},"anwa-al-khabar":{"title":{"ar":"أَنْوَاعُ الْخَبَر","en":"The three kinds of khabar","tr":"Haberin üç çeşidi"},"level":3,"group":"nahw","explanation":{"en":"The khabar comes in three shapes and only the first shows a case ending. (1) مُفْرَد — a single word: «الْعِلْمُ صِفَةٌ», and here the damma is visible. (2) جُمْلَة — a whole clause, verbal or nominal, which then stands «in the position of raf'». (3) شِبْهُ جُمْلَة — a preposition with its noun, or an adverb: «الْبَيِّنَةُ لِلْمُدَّعِي», «the proof is on the claimant». That third kind trips people up because there is no marfu' word to point at. The classical answer is that the phrase is attached to an omitted word — كَائِنٌ or مُسْتَقِرٌّ, «existing / located» — and THAT is the real khabar; the phrase merely occupies its position. Note that كَانَ and its sisters take the same three shapes for their khabar, and لَيْسَ in «وَالْإِلْهَامُ لَيْسَ مِنْ أَسْبَابِ الْمَعْرِفَةِ» has a shibh jumla khabar standing in nasb.","tr":"Haber üç şekilde gelir ve yalnız birincisinde i'rab alâmeti görünür. (1) Müfred — tek kelime: «الْعِلْمُ صِفَةٌ»; damme açıkça görülür. (2) Cümle — fiil veya isim cümlesi; bu durumda «ref mahallinde» bulunur. (3) Şibh-i cümle — câr-mecrûr yahut zarf: «الْبَيِّنَةُ لِلْمُدَّعِي». Üçüncüsü zorlayıcıdır, çünkü işaret edilecek merfû bir kelime yoktur. Klasik cevap şudur: bu terkip mahzûf bir kelimeye — كَائِنٌ veya مُسْتَقِرٌّ — mütealliktir ve asıl haber odur; terkip sadece onun yerini tutar. كَانَ ve kardeşlerinin haberi de aynı üç şekilde gelir; «وَالْإِلْهَامُ لَيْسَ مِنْ أَسْبَابِ الْمَعْرِفَةِ» cümlesinde لَيْسَ'nin haberi nasb mahallinde şibh-i cümledir."},"plain":{"en":"What you say about the topic can be one word, a whole clause, or a preposition with its noun. Only the first kind shows a case ending.","tr":"Mübteda hakkında söylenen şey tek kelime, tam bir cümle yahut bir harf-i cerle ismi olabilir. Yalnız birincisinde i'rab görünür."},"mamul":"marfu","sources":["العوامل (البيركوي)","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"question":{"tr":["Nedir? Kimdir?","Niçindir? Nerededir?"],"en":["What is it? Who is it?","For what — or where — is it?"]},"examples":[{"ar":"الْبَيِّنَةُ لِلْمُدَّعِي وَالْيَمِينُ عَلَى مَنْ أَنْكَرَ.","gloss":{"en":"Both khabars here are shibh jumla — prepositional phrases standing in the position of raf'.","tr":"Buradaki iki haber de şibh-i cümledir — ref mahallinde câr-mecrûrdur."},"src":"aqaid-ahl-al-sunna"},{"ar":"وَالْإِلْهَامُ لَيْسَ مِنْ أَسْبَابِ الْمَعْرِفَةِ بِصِحَّةِ الشَّيْءِ.","gloss":{"en":"Inspiration is not among the causes of knowing — the khabar of لَيْسَ is a prepositional phrase in nasb.","tr":"İlham, bilmenin sebeplerinden değildir — لَيْسَ'nin haberi nasb mahallinde câr-mecrûrdur."},"src":"aqaid-ahl-al-sunna"},{"ar":"وَالْأَعْيَانُ مَا يَكُونُ لَهُ قِيَامٌ بِذَاتِهِ.","gloss":{"en":"…that which has subsistence by itself — لَهُ is the fronted khabar of يَكُونُ.","tr":"…kendi zatıyla kâim olan şey — لَهُ, يَكُونُ'nun mukaddem haberidir."},"src":"aqaid-ahl-al-sunna"}],"mistakes":[{"wrong":"الْكِتَابُ عَلَى الطَّاوِلَةِ — لَا خَبَرَ لِلْجُمْلَةِ","right":"«عَلَى الطَّاوِلَةِ» فِي مَحَلِّ رَفْعٍ خَبَرٌ","why":{"en":"A prepositional phrase can be the khabar. The sentence is complete — «the book is on the table» — even though no word carries a damma.","tr":"Câr-mecrûr haber olabilir. Hiçbir kelime damme almasa da cümle tamamdır: «kitap masanın üstündedir»."}},{"wrong":"الطَّالِبُ يَجْتَهِدُ — «يَجْتَهِدُ» خَبَرٌ مَرْفُوعٌ بِالضَّمَّةِ","right":"الْجُمْلَةُ الْفِعْلِيَّةُ «يَجْتَهِدُ» فِي مَحَلِّ رَفْعٍ خَبَرٌ","why":{"en":"The damma on يَجْتَهِدُ is its own raf' as an unmarked mudari', not the raf' of a khabar. The CLAUSE is what occupies the khabar position.","tr":"يَجْتَهِدُ üzerindeki damme, muzârinin kendi merfûluğudur, haberin i'rabı değil. Haber mahallini tutan CÜMLEdir."}}]},"at-tahdhir":{"title":{"ar":"التَّحْذِير (إِيَّاكَ وَ...)","en":"The tahdhir (warning) construction","tr":"Tahzîr (إِيَّاكَ وَ...)"},"level":4,"group":"nahw","explanation":{"en":"Tahdhir is warning the listener away from something. Its most famous vehicle is إِيَّاكَ: a detached object pronoun that is the object of a verb left unsaid — «احْذَرْ» (beware!). The thing warned against (الْمُحَذَّر مِنْه) then follows, and it too is mansub as the object of that same hidden verb. When a وَ links them — إِيَّاكَ وَالْكَذِبَ — the noun after the و takes nasb (احْذَرِ الْكَذِبَ). This testament opens counsel after counsel with it: إِيَّاكَ وَالْكَذِبَ، إِيَّاكَ وَكَثْرَةَ الْكَلَامِ. The ـكَ is a particle of address (حَرْف خِطَاب) and changes with the addressee: إِيَّاكِ (to a woman), إِيَّاكُمْ (to a group).","tr":"Tahzir, muhatabı bir şeyden sakındırmaktır. En meşhur kalıbı إِيَّاكَ'dir: hazfedilmiş bir fiilin («احْذَرْ» = sakın!) mef'ûlü olan munfasıl nasb zamiri. Sakındırılan şey (muhazzerun minh) ardından gelir ve o da aynı gizli fiilin mef'ûlü olarak mansubdur. Aralarını bir وَ bağladığında — إِيَّاكَ وَالْكَذِبَ — و'dan sonraki isim nasb alır (احْذَرِ الْكَذِبَ). Bu vasiyet öğüt üstüne öğüdü bununla açar: إِيَّاكَ وَالْكَذِبَ، إِيَّاكَ وَكَثْرَةَ الْكَلَامِ. ـكَ hitap harfidir ve muhataba göre değişir: إِيَّاكِ (bir kadına), إِيَّاكُمْ (topluluğa)."},"plain":{"en":"Warning someone away from something — إِيَّاكَ, «watch out!» — where the verb «beware» is left unsaid.","tr":"Birini bir şeyden sakındırmak — إِيَّاكَ, «sakın!» — «sakın» fiili söylenmeden bırakılır."},"mamul":"mansub","sources":["الكافية (ابن الحاجب)","قطر الندى (ابن هشام)","إظهار الأسرار (البيركوي)"],"examples":[{"ar":"وَإِيَّاكَ وَالْكَذِبَ بَيْنَ يَدَيْهِ.","gloss":{"en":"And beware of lying in his presence — «lying» is mansub, object of the implied «beware».","tr":"Onun huzurunda yalandan sakın — «yalan», gizli «sakın» fiilinin mansub mef'ûlüdür."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"وَإِيَّاكَ وَكَثْرَةَ الْكَلَامِ بَيْنَ يَدَيْهِ.","gloss":{"en":"And beware of talking too much before him.","tr":"Onun huzurunda çok konuşmaktan sakın."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"إِيَّاكَ وَالْأَسَدَ.","gloss":{"en":"Beware of the lion! — the schoolbook example of tahdhir.","tr":"Aslandan sakın! — tahzîrin ders kitabı örneği."},"src":null}],"mistakes":[{"wrong":"إِيَّاكَ وَالْكَذِبُ","right":"إِيَّاكَ وَالْكَذِبَ","why":{"en":"The thing warned against is mansub — it is the object of the hidden «beware», not a subject. Learners leave the damma out of habit.","tr":"Sakındırılan şey mansubdur — gizli «احذر»in mef'ûlüdür, fâil değil. Öğrenciler alışkanlıkla ötreyi bırakır."}},{"wrong":"اِحْذَرْ إِيَّاكَ مِنَ الْكَذِبِ","right":"إِيَّاكَ وَالْكَذِبَ","why":{"en":"Do not add an explicit «beware»: إِيَّاكَ already stands in for it. Nor does it need مِنْ — the classical construction is إِيَّاكَ وَ + a mansub noun.","tr":"Açık bir «احذر» ekleme: إِيَّاكَ zaten onun yerini tutar. مِنْ'e de gerek yok — klasik kalıp إِيَّاكَ وَ + mansub isimdir."}},{"wrong":"إِيَّاكُمْ وَالْكَذِبَ (لِمُخَاطَبٍ وَاحِدٍ)","right":"إِيَّاكَ وَالْكَذِبَ","why":{"en":"The attached ـكَ must agree with the addressee: singular masculine is كَ, not the plural كُمْ.","tr":"Bitişik ـكَ muhataba uymalıdır: tekil müzekker كَ'dir, çoğul كُمْ değil."}}]},"atf-bayan":{"title":{"ar":"عَطْفُ الْبَيَان","en":"Explicative apposition (atf al-bayan)","tr":"Atf-ı beyân"},"level":5,"group":"nahw","explanation":{"en":"Atf al-bayan is a follower that clarifies what precedes it — like an adjective in office, but a NOUN in form rather than a derived word. It agrees with what it follows in case, definiteness, gender and number: أَقْسَمَ بِاللَّهِ أَبُو حَفْصٍ عُمَرُ, where عُمَرُ names the man whose kunya was just given. The classical difficulty is telling it from badal, since both are nouns following nouns. The usual test: a badal is meant to STAND IN for what precedes it — you could drop the first word and the sentence would still work — whereas atf al-bayan is meant only to explain, and dropping the first would lose the point. Birgivi lists it fifth and last among the tawabi'.","tr":"Atf-ı beyân, kendinden öncekini açıklayan bir tâbidir — görev bakımından sıfat gibi, fakat şekil bakımından müştak değil CÂMİD bir isimdir. Tâbi olduğu kelimeye i'rabda, marifelikte, cinsiyette ve sayıda uyar: أَقْسَمَ بِاللَّهِ أَبُو حَفْصٍ عُمَرُ; burada عُمَرُ, künyesi az önce verilen zatın adını bildirir. Klasik güçlük, onu bedelden ayırmaktır; çünkü ikisi de isimden sonra gelen isimdir. Alışılmış ölçü: bedel, öncekinin YERİNE geçmek üzere getirilir — birinci kelime düşse cümle yine işler; atf-ı beyân ise yalnız açıklamak için gelir, birinci düşerse maksat kaybolur. Birgivî onu tâbilerin beşincisi ve sonuncusu olarak sayar."},"plain":{"en":"A noun put straight after another to say more exactly who is meant: «Abu Hafs, Umar».","tr":"Kimin kastedildiğini daha açık söylemek için hemen ardından gelen isim: «Ebû Hafs, Ömer»."},"mamul":"tabai","sources":["العوامل (البيركوي) — التوابع","إظهار الأسرار (البيركوي)","الكافية (ابن الحاجب)"],"examples":[{"ar":"أَقْسَمَ بِاللَّهِ أَبُو حَفْصٍ عُمَرُ.","gloss":{"en":"Abu Hafs — Umar — swore by Allah. The name explains the kunya; both are marfu'.","tr":"Ebû Hafs — Ömer — Allah'a yemin etti. İsim künyeyi açıklar; ikisi de merfûdur."},"src":null},{"ar":"ذَهَبَ إِلَى مُعَلِّمِهِ أَبِي حَنِيفَةَ.","gloss":{"en":"He went to his teacher, Abu Hanifa — the same shape the wasiyya uses, there analyzed as badal.","tr":"Hocası Ebû Hanîfe'ye gitti — vasiyetteki aynı yapı, orada bedel olarak tahlil edilmiştir."},"src":null},{"ar":"جَاءَ أَخُوكَ زَيْدٌ.","gloss":{"en":"Your brother — Zayd — came.","tr":"Kardeşin — Zeyd — geldi."},"src":null}],"mistakes":[{"wrong":"أقسم بالله أبو حفصٍ عمرًا","right":"أَقْسَمَ بِاللَّهِ أَبُو حَفْصٍ عُمَرُ","why":{"en":"Atf al-bayan is a tabi': it copies the case of what it explains. Here that word is the marfu' subject, so the name is marfu' too.","tr":"Atf-ı beyân bir tâbidir: açıkladığı kelimenin i'rabını alır. Burada o kelime merfû fâildir, dolayısıyla isim de merfûdur."}},{"wrong":"جاء الرجلُ الكريمُ (على أنه عطف بيان)","right":"عَطْفُ الْبَيَانِ يَكُونُ جَامِدًا","why":{"en":"A derived word like «generous» following a noun is a na't, not atf al-bayan. Atf al-bayan is a solid noun — a name or the like.","tr":"İsimden sonra gelen «kerîm» gibi müştak bir kelime na't'tır, atf-ı beyân değildir. Atf-ı beyân câmid bir isimdir — özel isim ve benzeri."}},{"wrong":"عدّ كل اسمٍ بعد اسمٍ بدلًا","right":"الْفَرْقُ بِالْقَصْدِ: الْبَدَلُ مَقْصُودٌ بِالْحُكْمِ، وَعَطْفُ الْبَيَانِ لِلتَّوْضِيحِ","why":{"en":"Not every noun after a noun is badal. Ask what is intended: if the second is what the ruling really falls on, it is badal; if it merely clarifies the first, it is atf al-bayan.","tr":"İsimden sonra gelen her isim bedel değildir. Maksada bakılır: hüküm gerçekte ikinciye aitse bedeldir; yalnız birinciyi açıklıyorsa atf-ı beyândır."}}]},"atf-nasaq":{"title":{"ar":"عَطْفُ النَّسَق","en":"Coupling (atf al-nasaq)","tr":"Atf-ı nesak (bağlama)"},"level":2,"group":"nahw","explanation":{"en":"Coupling joins a second word to a first through one of the letters of atf, and the second then takes the FIRST'S CASE — it is governed «by way of following» (بِالتَّبَعِيَّةِ), which is why Birgivi puts it among the tawabi' rather than among the governed-by-a-word. The Awamil lists ten letters: وَ (mere joining), فَ (joining with sequence), ثُمَّ (sequence with delay), حَتَّى (up to and including), أَوْ and إِمَّا (alternatives), أَمْ (in questions), لَا and بَلْ and لَكِنْ (correcting or setting aside). The rule to hold onto is that the conjunct copies whatever case the first word had: after a mansub it is mansub, after a majrur it is majrur.","tr":"Atf, ikinci bir kelimeyi atıf harflerinden biriyle birinciye bağlar; ikinci kelime böylece BİRİNCİNİN İ'RABINI alır — «tebe'iyyet yoluyla» âmillenmiştir; Birgivî'nin onu bir kelimeyle âmillenenler arasında değil, tâbiler arasında sayması bundandır. Avâmil on harf sayar: وَ (mutlak bağlama), فَ (tertip ile), ثُمَّ (tertip ve mühlet ile), حَتَّى (gaye ile), أَوْ ve إِمَّا (tercih), أَمْ (soruda), لَا ile بَلْ ve لَكِنْ (idrâb ve istidrâk). Akılda tutulacak kural: ma'tûf, birincinin i'rabını kopyalar — mansubdan sonra mansub, mecrûrdan sonra mecrûr olur."},"plain":{"en":"Joining words with «and», «or», «then». The joined word copies the case of the one before it.","tr":"Kelimeleri «ve», «veya», «sonra» ile bağlamak. Bağlanan kelime, öncekinin i'rabını alır."},"mamul":"tabai","sources":["العوامل (البيركوي) — التوابع","إظهار الأسرار (البيركوي)","قطر الندى (ابن هشام)"],"examples":[{"ar":"وَاعْمَلْ بِهَا يَنْفَعْكَ اللَّهُ بِعِلْمِكَ.","gloss":{"en":"And act upon it — the وَ couples this command to the one before it.","tr":"Ve onunla amel et — vâv bu emri öncekine bağlar."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"لِمَصْلَحَتِكَ وَمَصْلَحَةِ الْمُسْلِمِينَ.","gloss":{"en":"For your good and the good of the Muslims — the conjunct copies the jarr of the first.","tr":"Senin ve Müslümanların iyiliği için — matûf, birincinin cerrini alır."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"جَاءَ زَيْدٌ فَعَمْرٌو ثُمَّ بَكْرٌ.","gloss":{"en":"Zayd came, then Amr, then later Bakr — فَ marks immediate sequence, ثُمَّ a delayed one.","tr":"Zeyd geldi, sonra Amr, sonra da Bekir — فَ hemen ardından, ثُمَّ araya zaman girerek."},"src":null}],"mistakes":[{"wrong":"مررتُ بزيدٍ وعمرٌو","right":"مَرَرْتُ بِزَيْدٍ وَعَمْرٍو","why":{"en":"The conjunct follows the first word's case. After a majrur it must be majrur, not raf'.","tr":"Ma'tûf, birincinin i'rabına uyar. Mecrûrdan sonra mecrûr olmalıdır, merfû değil."}},{"wrong":"رأيتُ زيدًا وعمرٌ","right":"رَأَيْتُ زَيْدًا وَعَمْرًا","why":{"en":"Same rule after a mansub: the conjunct takes nasb.","tr":"Mansubdan sonra da aynı kural: ma'tûf nasb alır."}},{"wrong":"جاء زيدٌ ثُمَّ عمرٌو فورًا","right":"جَاءَ زَيْدٌ فَعَمْرٌو","why":{"en":"ثُمَّ carries a gap in time; for «immediately after», the letter is فَ.","tr":"ثُمَّ arada mühlet bulunduğunu bildirir; «hemen ardından» için فَ kullanılır."}}]},"augmented-babs":{"title":{"ar":"النَّقْلُ إِلَى الْأَبْوَابِ الْمَزِيدَة","en":"Deriving a root through the augmented babs","tr":"Bablara nakil — mezîd bablar"},"level":4,"group":"sarf","explanation":{"en":"The madrasah exercise called «bablara nakil» takes one bare triliteral and runs it through every augmented pattern in turn. With ضَرَبَ: أَضْرَبَ (IV), ضَرَّبَ (II), ضَارَبَ (III), اِنْضَرَبَ (VII), اِضْطَرَبَ (VIII), اِضْرَبَّ (IX), تَضَرَّبَ (V), تَضَارَبَ (VI), اِسْتَضْرَبَ (X), and the three rare ones اِضْرَوْرَبَ, اِضْرَوَّبَ, اِضْرَابَّ. The point is NOT that all twelve are words anyone uses — most are not. The point is the wazn: once you can pour any root into any mould, you can read a form you have never met and know what it is doing. Each mould carries a meaning. أَفْعَلَ and فَعَّلَ make a verb transitive or intensive; فَاعَلَ does the act WITH someone; اِنْفَعَلَ and تَفَعَّلَ are مُطَاوَعَة, submitting to an act done to you; اِفْتَعَلَ does it for oneself; تَفَاعَلَ is mutual; اِسْتَفْعَلَ asks or seeks; اِفْعَلَّ and اِفْعَالَّ are for colours and bodily defects. Watch اِضْطَرَبَ: the ت of bab VIII turns into ط after ض, which is a sound change, not a different bab.","tr":"Medresede «bablara nakil» denen alıştırma, bir sülâsî mücerredi bütün mezîd vezinlere sırayla döker. ضَرَبَ ile: أَضْرَبَ، ضَرَّبَ، ضَارَبَ، اِنْضَرَبَ، اِضْطَرَبَ، اِضْرَبَّ، تَضَرَّبَ، تَضَارَبَ، اِسْتَضْرَبَ ve nadir üçü اِضْرَوْرَبَ، اِضْرَوَّبَ، اِضْرَابَّ. Maksat on ikisinin de kullanılan kelime olması DEĞİLDİR — çoğu değildir. Maksat vezindir: her kökü her kalıba dökebilirseniz, hiç görmediğiniz bir şekli okuyup ne yaptığını bilirsiniz. Her kalıbın bir manası vardır. أَفْعَلَ ve فَعَّلَ fiili müteaddî yahut mübalağalı kılar; فَاعَلَ işi biriyle BERABER yapmaktır; اِنْفَعَلَ ve تَفَعَّلَ mutâvaattır; اِفْتَعَلَ işi kendi nefsi için yapmaktır; تَفَاعَلَ müşârekedir; اِسْتَفْعَلَ talep ifade eder; اِفْعَلَّ ve اِفْعَالَّ renk ve kusurlar içindir. اِضْطَرَبَ'ye dikkat: iftiâl bâbının tâsı ض'dan sonra ط'ya döner; bu ses hâdisesidir, ayrı bir bab değildir."},"plain":{"en":"Arabic grows new verbs out of one root by adding letters to it, and each pattern adds a predictable shade: making someone do it, doing it to each other, asking for it.","tr":"Arapça tek bir kökten harf ekleyerek yeni fiiller türetir; her kalıp manaya tahmin edilebilir bir şey katar: yaptırma, karşılıklı yapma, isteme."},"sources":["بناء الأفعال","مراح الأرواح","المقصود"],"examples":[{"ar":"عَلَّمَ — بَابُ التَّفْعِيلِ مِنْ «عَلِمَ».","gloss":{"en":"«He taught» — Form II turns «he knew» into causing someone else to know.","tr":"«Öğretti» — tef'îl bâbı «bildi»yi «başkasına bildirdi»ye çevirir."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"جَادَلَ — بَابُ الْمُفَاعَلَةِ مِنْ «جَدَلَ».","gloss":{"en":"«He disputed with» — Form III is the act done WITH another party.","tr":"«Tartıştı» — mufâale bâbı işi bir başkasıyla BERABER yapmaktır."},"src":"wasiyyat-abi-hanifa-L4"},{"ar":"اِسْتَفْتَى — بَابُ الِاسْتِفْعَالِ مِنْ «فَتَا».","gloss":{"en":"«He asked for a fatwa» — Form X is asking for the thing the root names.","tr":"«Fetva istedi» — istif'âl bâbı, kökün adlandırdığı şeyi talep etmektir."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"تَبَاعَدَ — بَابُ التَّفَاعُلِ مِنْ «بَعُدَ».","gloss":{"en":"«He kept his distance» — Form VI, two sides in the act at once.","tr":"«Uzak durdu» — tefâul bâbı, işte iki tarafın birden bulunmasıdır."},"src":"wasiyyat-abi-yusuf-L5"}],"mistakes":[{"wrong":"اِضْتَرَبَ","right":"اِضْطَرَبَ","why":{"en":"After the emphatic ض the ت of bab VIII becomes ط. The same happens after ص, ط and ظ — اِصْطَبَرَ, not اِصْتَبَرَ.","tr":"Tefhim harfi ض'dan sonra iftiâl bâbının tâsı ط olur. ص، ط، ظ'dan sonra da böyledir: اِصْطَبَرَ، اِصْتَبَرَ değil."}},{"wrong":"أَعَلَّمَ الْأُسْتَاذُ الطَّالِبَ","right":"عَلَّمَ الْأُسْتَاذُ الطَّالِبَ","why":{"en":"One augmentation is enough. Form II and Form IV both make the verb transitive; stacking them is not a form.","tr":"Bir ziyade yeterlidir. Fiili müteaddî yapmak için hem tef'îl hem if'âl kullanılmaz; böyle bir vezin yoktur."}},{"wrong":"تَرْجَمَ — بَابُ التَّفَعُّلِ","right":"تَرْجَمَ رُبَاعِيٌّ مُجَرَّدٌ عَلَى «فَعْلَلَ»","why":{"en":"Not every initial ت is the ت of Form V. تَرْجَمَ is a bare quadriliteral on فَعْلَلَ, and its root has four letters.","tr":"Baştaki her تا tefe'ul tâsı değildir. تَرْجَمَ, فَعْلَلَ vezninde rubâî mücerreddir ve kökü dört harflidir."}}]},"badal":{"title":{"ar":"الْبَدَل","en":"Badal (apposition / substitution)","tr":"Bedel"},"level":2,"group":"nahw","explanation":{"en":"The badal is one of the four followers (التوابع): a noun that follows the word before it (the مُبْدَل مِنْه) and takes the very same case — raf', nasb, or jarr. It is \"the intended one\": you could delete the first noun and the badal alone would carry the meaning. The commonest kind is بَدَل كُلٍّ مِنْ كُلٍّ (total apposition), where the two words name the same thing — «مَدِينَتِهِ الْبَصْرَةِ» (his city, [namely] Basra) and «مُعَلِّمِهِ أَبِي حَنِيفَةَ» (his teacher, [namely] Abu Hanifa). Because the badal merely follows, whatever case the first noun has, the badal copies: both majrur here. Other kinds are بَدَل بَعْضٍ مِنْ كُلٍّ (part from whole) and بَدَل اشْتِمَال (of inclusion). Ibn Hisham treats the badal among the التوابع in Qatr al-Nada, as does Ibn Ajurrum in the Ajurrumiyya.","tr":"Bedel, dört tâbiden (uyanlar) biridir: kendinden önceki kelimeye (mübdelün minh) uyan ve onun i'rabını (ref, nasb, cer) aynen alan isimdir. Bedel asıl kastedilen kelimedir; birinciyi silsen, bedel tek başına manayı taşır. En yaygın türü bedel-i küll min küll'dür (mutabık bedel): iki kelime aynı şeyi gösterir — «مَدِينَتِهِ الْبَصْرَةِ» (şehri, yani Basra) ve «مُعَلِّمِهِ أَبِي حَنِيفَةَ» (hocası, yani Ebu Hanife). Bedel tâbi olduğu için, birinci ismin i'rabı ne ise onu alır: burada her ikisi de mecrurdur. Diğer türleri bedel-i ba'z min küll ve bedel-i iştimâldir. İbn Hişâm Katru'n-Nedâ'da bedeli tevâbi arasında ele alır."},"plain":{"en":"A word that steps in for the one before it and takes over its job: «the causes are three — sense, report, intellect».","tr":"Kendinden öncekinin yerine geçip onun vazifesini üstlenen kelime: «sebepler üçtür: havâss, haber, akıl»."},"mamul":"tabai","sources":["الآجُرُّومِيَّة (ابن آجُرُّوم)","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"examples":[{"ar":"أَرَادَ أَنْ يَرْجِعَ إِلَى مَدِينَتِهِ الْبَصْرَةِ.","gloss":{"en":"He wanted to return to his city, Basra — الْبَصْرَةِ is badal of مَدِينَتِهِ, majrur like it.","tr":"Şehri Basra'ya dönmek istedi — الْبَصْرَةِ, مَدِينَتِهِ'nin bedelidir, onun gibi mecrûrdur."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"ذَهَبَ إِلَى مُعَلِّمِهِ أَبِي حَنِيفَةَ.","gloss":{"en":"He went to his teacher, Abu Hanifa — أَبِي is badal of مُعَلِّمِهِ, in jarr (shown by ي, a five-noun).","tr":"Hocası Ebû Hanîfe'ye gitti — أَبِي, مُعَلِّمِهِ'nin bedelidir, cerri yâ iledir (esmâ-i hamse)."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"جَاءَ الْخَلِيفَةُ عُمَرُ.","gloss":{"en":"The caliph Umar came — عُمَرُ is badal of الْخَلِيفَةُ, marfu' like it.","tr":"Halife Ömer geldi — عُمَرُ, الْخَلِيفَةُ'nun bedelidir, onun gibi merfûdur."},"src":null}],"mistakes":[{"wrong":"إِلَى مَدِينَتِهِ الْبَصْرَةُ","right":"إِلَى مَدِينَتِهِ الْبَصْرَةِ","why":{"en":"The badal must copy the case of the word it follows. Since مَدِينَتِهِ is majrur after إلى, الْبَصْرَة must be majrur too — kasra, not the raf' damma learners default to.","tr":"Bedel, uyduğu kelimenin i'rabını almalıdır. مَدِينَتِهِ, إلى'den sonra mecrur olduğu için الْبَصْرَة da mecrur olmalı — kesre, öğrencilerin alışkanlıkla verdiği ref ötresi değil."}},{"wrong":"ذَهَبَ إِلَى مُعَلِّمِهِ أَبُو حَنِيفَةَ","right":"ذَهَبَ إِلَى مُعَلِّمِهِ أَبِي حَنِيفَةَ","why":{"en":"أب as a badal here is majrur, so among the five nouns its jarr sign is ي (أَبِي), never the raf' و (أَبُو). Mistaking the badal for a fresh subject produces أبو.","tr":"Buradaki bedel olan أب mecrurdur; esmâ-i hamseden olduğu için cer alâmeti ي'dir (أَبِي), ref و'ı (أَبُو) değil. Bedeli yeni bir özne sanmak أبو hatasına yol açar."}}]},"damir-fasl":{"title":{"ar":"ضَمِيرُ الْفَصْل","en":"The pronoun of separation","tr":"Zamîr-i fasl"},"level":5,"group":"nahw","explanation":{"en":"Between a definite mubtada and a definite khabar the language inserts a detached pronoun — هُوَ, هِيَ, هُمْ — that is not a word in the sentence at all. It has no case position (لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ) and no meaning of its own; its job is to stop the reader from taking the second definite noun as a further adjective. «الْمُحْدَثُ الْمُخْرَجُ…» would read as «the originated brought-out thing…», a phrase still waiting for its predicate; «الْمُحْدَثُ هُوَ الْمُخْرَجُ…» is a complete statement: «the originated IS what is brought out». That is exactly the work of the English «is» in a definition, and it is why the creed's ta'rifat use it so heavily. It also adds restriction — «the atom is THE part that admits of no division», and nothing else is.","tr":"Marife mübteda ile marife haber arasına, cümlenin öğesi olmayan munfasıl bir zamir — هُوَ، هِيَ، هُمْ — girer. İ'rabdan mahalli yoktur ve müstakil bir manası da yoktur; görevi, ikinci marife ismin sıfat sanılmasını önlemektir. «الْمُحْدَثُ الْمُخْرَجُ…» dendiğinde «çıkarılmış olan hâdis…» diye okunur ve cümle hâlâ haberini bekler; «الْمُحْدَثُ هُوَ الْمُخْرَجُ…» ise tam bir hükümdür: «Hâdis, çıkarılan şeyDİR». Ta'rif cümlelerinde bu kadar sık geçmesinin sebebi budur. Ayrıca hasr da katar: «cevher, bölünemeyen cüzDÜR», başkası değil."},"plain":{"en":"A pronoun dropped between the topic and what is said about it, purely to stop you reading the second word as an adjective. It means nothing by itself.","tr":"İkinci kelimeyi sıfat sanmayasınız diye mübteda ile haber arasına konan zamir. Kendi başına bir mana taşımaz."},"sources":["الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"examples":[{"ar":"وَالْمُحْدَثُ هُوَ الْمُخْرَجُ مِنَ الْعَدَمِ إِلَى الْوُجُودِ.","gloss":{"en":"The originated is that which is brought out from non-existence into existence.","tr":"Hâdis, yokluktan varlığa çıkarılan şeydir."},"src":"aqaid-ahl-al-sunna"},{"ar":"إِنَّ طَرِيقَ النَّجَاةِ هُوَ مُتَابَعَةُ أَهْلِ السُّنَّةِ وَالْجَمَاعَةِ.","gloss":{"en":"The path of deliverance is following Ahl al-Sunna
