];

function stripAr(s){ return (s || "").replace(/[ً-ٰٕ]/g, ""); }
function conjTable(forms, rows, highlight){
  const hlBare = stripAr(highlight);
  let h = `<div class="conj-wrap"><table class="conj">
    <tr><th class="person"></th><th>المفرد</th><th>المثنى</th><th>الجمع</th></tr>`;
  rows.forEach(r => {
    h += `<tr><th class="person">${r.label}</th>`;
    r.idx.forEach(i => {
      const f = forms[i] === undefined ? "" : forms[i];
      const hit = f === highlight || (hlBare && stripAr(f) === hlBare);
      h += `<td class="${hit ? "hl" : ""}">${f}</td>`;
    });
    if (r.idx.length === 2) h += `<td></td>`;
    h += `</tr>`;
  });
  return h + `</table></div>`;
}

// ---------- Emsile-i Muhtelife ----------
// The other half of the Emsile: not the person-by-person conjugation
// (muttarida) but the fourteen FORMS built from one verb — the first table a
// madrasah student memorizes. Order and Turkish names follow the classical
// Emsile tables (see research/sources/). The governed forms come from the
// package data, never derived here, because hollow and defective verbs do not
// follow the sound-verb rule (يَقُولُ → لَمْ يَقُلْ, يَرْمِي → لَمْ يَرْمِ).
function muhtelife(morph){
  // The table needs the governed forms AND an amr row — مَا زَالَ has the
  // first (لَمْ يَزَلْ is real) but no imperative exists, so no muhtelife.
  if (!morph || !morph.majzum || !morph.mansub || !morph.majzum2
      || !(morph.amr && morph.amr.length)) return null;
  const mazi = morph.mazi[0], mudari = morph.mudari[0], amr = morph.amr[0];
  return [
    { ar: mazi,                      tr: "Fiil-i mâzî",                en: "Past tense" },
    { ar: mudari,                    tr: "Fiil-i muzâri",              en: "Present / future" },
    { ar: morph.masdar,              tr: "Masdar (gayr-i mîmî)",       en: "Verbal noun" },
    { ar: "فَهُوَ " + morph.fail,     tr: "İsm-i fâil",                 en: "Active participle" },
    ...(morph.maful ? [{ ar: "وَذَاكَ " + morph.maful, tr: "İsm-i mef'ûl", en: "Passive participle" }] : []),
    { ar: "لَمْ " + morph.majzum,     tr: "Cahd-ı mutlak",              en: "Absolute negation of the past" },
    { ar: "لَمَّا " + morph.majzum,   tr: "Cahd-ı müstağrak",           en: "Negation of the past, up to now" },
    { ar: "مَا " + mudari,           tr: "Nefy-i hâl",                 en: "Negation of the present" },
    { ar: "لَا " + mudari,           tr: "Nefy-i istikbâl",            en: "Negation of the future" },
    { ar: "لَنْ " + morph.mansub,     tr: "Te'kîd-i nefy-i istikbâl",   en: "Emphatic negation of the future" },
    { ar: "لِ" + morph.majzum,        tr: "Emr-i gâib",                 en: "Third-person command" },
    { ar: "لَا " + morph.majzum,      tr: "Nehy-i gâib",                en: "Third-person prohibition" },
    { ar: amr,                       tr: "Emr-i hâzır",                en: "Second-person command" },
    { ar: "لَا " + morph.majzum2,     tr: "Nehy-i hâzır",               en: "Second-person prohibition" },
    // The worksheet's ma'lum/majhul column. Absent for intransitive verbs,
    // where the data deliberately carries no passive rather than a guess.
    ...(morph.majhulMazi ? [
      { ar: morph.majhulMazi,   tr: "Fiil-i mâzî meçhûl",   en: "Past passive", majhul: true },
      { ar: morph.majhulMudari, tr: "Fiil-i muzâri meçhûl", en: "Present passive", majhul: true },
    ] : []),
    ...ziyadeExt(morph),
  ];
}
// The ziyade-bab recitation's extension rows, from the received table
// (research/sources/ziyade-bab-muhtelife-cekimi.txt, modelled on أَكْرَمَ):
// mimi masdar (= the maf'ul form), the once- and manner-nouns, the relational
// adjective, and the paraphrased comparative and wonder forms. All are exact
// templates around the STORED masdar, so deriving them breaks nothing — and a
// masdar the templates cannot carry (manqus, bracketed, multiword) simply
// opts out, row by row, rather than being guessed at.
const ZIYADE_HEADS = ["أَفْعَلَ", "فَعَّلَ", "فَاعَلَ", "تَفَعَّلَ", "تَفَاعَلَ",
                      "اِنْفَعَلَ", "اِفْتَعَلَ", "اِسْتَفْعَلَ", "اسْتَفْعَلَ"]
  .map(w => w.normalize("NFC"));
function ziyadeExt(morph){
  const head = (morph.wazn || "").split(/\s+/)[0].normalize("NFC");
  if (!ZIYADE_HEADS.includes(head)) return [];
  const m = (morph.masdar || "").normalize("NFC");
  if (!/^[ء-ْ]+$/.test(m) || /[ىٍ]$/.test(m) || /ً/.test(m)) return [];
  const taFinal = m.endsWith("ة");
  const stemSuf = taFinal ? m.slice(0, -1) + "ت" : m;      // تَسْمِيَة ← تَسْمِيَت + ـهُ
  const acc = taFinal || /[ءا]$/.test(m) ? m + "ً" : m + "ًا";
  const merreBase = taFinal ? m + "ً" : m + "َةً";
  const out = [
    ...(morph.maful ? [{ ar: morph.maful + "ٌ",
      tr: "Masdar-ı mîmî; ism-i zaman ve mekân", en: "Mimic masdar; noun of time and place", ext: true }] : []),
    { ar: merreBase + " وَاحِدَةً", tr: "Binâ-i merre", en: "The once-noun", ext: true },
    { ar: merreBase + " شَدِيدَةً", tr: "Binâ-i nev'", en: "The manner-noun", ext: true },
    ...(!taFinal && !/[ءا]$/.test(m) ? [{ ar: m + "ِيٌّ",
      tr: "İsm-i mensûb", en: "Relational adjective", ext: true }] : []),
    { ar: "هُوَ أَشَدُّ مِنْهُ " + acc, tr: "İsm-i tafdîl (şedde ile)", en: "Comparative, paraphrased", ext: true },
    { ar: "مَا أَشَدَّ " + stemSuf + "َهُ", tr: "Fiil-i taaccüb-i evvel", en: "The first wonder form", ext: true },
    { ar: "وَأَشْدِدْ بِ" + stemSuf + "ِهِ", tr: "Fiil-i taaccüb-i sânî", en: "The second wonder form", ext: true },
  ];
  return out.map(r => ({ ...r, ar: r.ar.normalize("NFC") }));
}
function muhtelifeTable(morph, highlight){
  const hlBare = highlight ? stripAr(highlight) : "";
  let h = `<div class="conj-wrap"><table class="conj muhtelife">`;
  muhtelife(morph).forEach(row => {
    const hit = row.ar === highlight || (hlBare && stripAr(row.ar) === hlBare);
    h += `<tr class="${row.majhul ? "majhul" : ""}${row.ext ? " ext" : ""}"><th class="person">${state.uiLang === "tr" ? row.tr : row.en}</th>
          <td class="${hit ? "hl" : ""}" lang="ar">${row.ar}</td></tr>`;
  });
  return h + `</table></div>`;
}

// ---------- Diğer Bablara Nakil ----------
// The madrasah transfer drill: one sound root recited through the twelve
// augmented wazns, exactly as the received table does (research/sources/
// bablara-nakil-12-wazn.txt). Deliberately FORMAL — the table itself recites
// اِنْنَصَرَ uncontracted, and attestation in the lexicon is not claimed; the
// point is command of the patterns. Only fully sound Form I roots qualify:
// weak radicals belong to the i'lal rules (research/sources/
// ilal-kaideleri-turkce.txt), not to letter substitution. The iftial row
// applies the ibdal the table demonstrates: اِضْطَرَبَ، اِذَّهَبَ، اِزْدَجَرَ.
// The iftial ta after C1, with the ibdal the table demonstrates. The same
// chunk serves every class: اِزْدَ + ادَ gives اِزْدَادَ, اِصْطَ + ادَ gives اِصْطَادَ.
function nakilT(f){
  if ("صضطظ".includes(f)) return `اِ${f}ْطَ`;
  if (f === "ز") return `اِزْدَ`;
  if ("دذ".includes(f)) return `اِ${f}َّ`;
  return `اِ${f}ْتَ`;
}
// Each maker receives (f, a, l, type) and returns the bab's mazi — or null,
// where the tradition recites no such form for that class. The weak-class
// shapes are the i'lal rules' own outputs (ilal-kaideleri-turkce.txt) and
// the received table's own rows (اِتَّجَلَ، اِيجَلَّ، اِيجَوْجَلَ for وجل):
// mithal keeps its waw except iftial (اِتَّـ) and the اِفْـ babs (اِوْ ← اِي);
// ajwaf melts to alif exactly in IV/VII/VIII/X and stays a sound letter in
// the rest; naqis ends every mazi in ى; the geminate contracts wherever the
// pattern brings its twins together.
const NAKIL_BABS = [
  { wazn: "أَفْعَلَ", tr: "İf'âl", en: "Form IV", make: (f,a,l,t) =>
      t === "ajwaf" ? `أَ${f}َا${l}َ` : t === "naqis" ? `أَ${f}ْ${a}َى`
      : t === "gem" ? `أَ${f}َ${a}َّ` : `أَ${f}ْ${a}َ${l}َ` },
  { wazn: "فَعَّلَ", tr: "Tef'îl", en: "Form II", make: (f,a,l,t) =>
      t === "naqis" ? `${f}َ${a}َّى` : `${f}َ${a}َّ${l}َ` },
  { wazn: "فَاعَلَ", tr: "Müfâale", en: "Form III", make: (f,a,l,t) =>
      t === "naqis" ? `${f}َا${a}َى` : t === "gem" ? `${f}َا${a}َّ` : `${f}َا${a}َ${l}َ` },
  { wazn: "اِنْفَعَلَ", tr: "İnfiâl", en: "Form VII", make: (f,a,l,t) =>
      t === "ajwaf" ? `اِنْ${f}َا${l}َ` : t === "naqis" ? `اِنْ${f}َ${a}َى`
      : t === "gem" ? `اِنْ${f}َ${a}َّ` : `اِنْ${f}َ${a}َ${l}َ` },
  { wazn: "اِفْتَعَلَ", tr: "İftiâl", en: "Form VIII", make: (f,a,l,t) =>
      t === "mithal" ? `اِتَّ${a}َ${l}َ` : t === "ajwaf" ? nakilT(f) + `ا${l}َ`
      : t === "naqis" ? nakilT(f) + `${a}َى` : t === "gem" ? nakilT(f) + `${a}َّ`
      : nakilT(f) + `${a}َ${l}َ` },
  { wazn: "اِفْعَلَّ", tr: "İf'ilâl", en: "Form IX", make: (f,a,l,t) =>
      t === "naqis" || t === "gem" ? null
      : t === "mithal" ? `اِي${a}َ${l}َّ` : `اِ${f}ْ${a}َ${l}َّ` },
  { wazn: "تَفَعَّلَ", tr: "Tefe''ul", en: "Form V", make: (f,a,l,t) =>
      t === "naqis" ? `تَ${f}َ${a}َّى` : `تَ${f}َ${a}َّ${l}َ` },
  { wazn: "تَفَاعَلَ", tr: "Tefâul", en: "Form VI", make: (f,a,l,t) =>
      t === "naqis" ? `تَ${f}َا${a}َى` : t === "gem" ? `تَ${f}َا${a}َّ` : `تَ${f}َا${a}َ${l}َ` },
  { wazn: "اِسْتَفْعَلَ", tr: "İstif'âl", en: "Form X", make: (f,a,l,t) =>
      t === "ajwaf" ? `اِسْتَ${f}َا${l}َ` : t === "naqis" ? `اِسْتَ${f}ْ${a}َى`
      : t === "gem" ? `اِسْتَ${f}َ${a}َّ` : `اِسْتَ${f}ْ${a}َ${l}َ` },
  { wazn: "اِفْعَوْعَلَ", tr: "İf'îâl", en: "Form XII", make: (f,a,l,t) =>
      t === "mithal" ? `اِي${a}َوْ${a}َ${l}َ`
      : t === "sound" ? `اِ${f}ْ${a}َوْ${a}َ${l}َ` : null },
  { wazn: "اِفْعَوَّلَ", tr: "İf'ivvâl", en: "Form XIII", make: (f,a,l,t) =>
      t === "mithal" ? `اِي${a}َوَّ${l}َ`
      : t === "sound" ? `اِ${f}ْ${a}َوَّ${l}َ` : null },
  { wazn: "اِفْعَالَّ", tr: "İf'îlâl", en: "Form XI", make: (f,a,l,t) =>
      t === "naqis" || t === "gem" ? null
      : t === "mithal" ? `اِي${a}َا${l}َّ` : `اِ${f}ْ${a}َا${l}َّ` },

// Classify the root: any verb may ride the drill through ITS ROOT — Form II
// عَلَّمَ still transfers ع ل م, with its own bab highlighted. Hamzated roots
// stay out (hamza-seat orthography is not a substitution), and so do roots
// with two weak radicals (the lafif belongs wholly to the i'lal chapter).
function nakilClass(entry){
  if (!entry || !entry.root) return null;
  const rs = entry.root.split(/\s+/).filter(Boolean);
  if (rs.length !== 3 || rs.some(r => r.length !== 1)) return null;
  const [f, a, l] = rs;
  if ([f, a, l].some(r => "ءأإئؤا".includes(r))) return null;
  const wf = "وي".includes(f), wa = "وي".includes(a), wl = "وي".includes(l) || l === "ى";
  if (wf + wa + wl > 1) return null;
  const type = wf ? "mithal" : wa ? "ajwaf" : wl ? "naqis" : a === l ? "gem" : "sound";
  return { rs, type };
}
// The Bina's six mujarrad babs — the vowel pairs from the received 35-bab
// table (research/sources/sarf-35-bab-tablosu.txt, the موزون column). The
// same root is recited through all six; the verb's OWN bab is highlighted,
// because that is the fact the drill exists to fix in memory.
const MUJARRAD_BABS = [
  { model: "نَصَرَ", tr: "1. bâb · fetha–damme", en: "Bab I · a–u",  v1: "َ", v2: "ُ" },
  { model: "ضَرَبَ", tr: "2. bâb · fetha–kesre", en: "Bab II · a–i", v1: "َ", v2: "ِ" },
  { model: "فَتَحَ", tr: "3. bâb · fethateyn",   en: "Bab III · a–a", v1: "َ", v2: "َ" },
  { model: "عَلِمَ", tr: "4. bâb · kesre–fetha", en: "Bab IV · i–a", v1: "ِ", v2: "َ" },
  { model: "حَسُنَ", tr: "5. bâb · dammeteyn",   en: "Bab V · u–u",  v1: "ُ", v2: "ُ" },
  { model: "حَسِبَ", tr: "6. bâb · kesreteyn",   en: "Bab VI · i–i", v1: "ِ", v2: "ِ" },
];
function nakilTable(cls, morph){
  const [f, a, l] = cls.rs;
  const ownWazn = (morph && morph.wazn ? morph.wazn : "").normalize("NFC");
  const ownHead = ownWazn.split(/\s+/)[0] || "";
  let h = `<div class="conj-wrap"><table class="conj nakil">`;
  // The six-bab recitation needs sound radicals in every slot — a weak root's
  // mujarrad shapes are the i'lal chapter's business, so the section appears
  // for sound roots only; the mazid drill below serves every class.
  if (cls.type === "sound") {
    h += `<tr class="nakil-sec"><th colspan="3" lang="ar">الثُّلَاثِيُّ الْمُجَرَّدُ — السِّتَّةُ الْأَبْوَابُ</th></tr>`;
    MUJARRAD_BABS.forEach(b => {
      const wazn = `فَع${b.v1}لَ يَفْع${b.v2}لُ`.normalize("NFC");
      const out = `${f}َ${a}${b.v1}${l}َ ي${"َ"}${f}ْ${a}${b.v2}${l}ُ`.normalize("NFC");
      h += `<tr class="${wazn === ownWazn ? "own-bab" : ""}">
        <th class="person">${state.uiLang === "tr" ? b.tr : b.en}</th>
        <td lang="ar">${wazn}</td>
        <td lang="ar" class="nakil-out">${out}</td></tr>`;
    });
  }
  h += `<tr class="nakil-sec"><th colspan="3" lang="ar">الثُّلَاثِيُّ الْمَزِيدُ — النَّقْلُ إِلَى اثْنَيْ عَشَرَ بَابًا</th></tr>`;
  NAKIL_BABS.forEach(b => {
    const out = b.make(f, a, l, cls.type);
    if (!out) return;                     // no such form for this class — no row
    h += `<tr class="${b.wazn.normalize("NFC") === ownHead ? "own-bab" : ""}">
      <th class="person">${state.uiLang === "tr" ? b.tr : b.en}</th>
      <td lang="ar">${b.wazn}</td>
      <td lang="ar" class="nakil-out">${out.normalize("NFC")}</td></tr>`;
  });
  return h + `</table></div>`;
}

// Birgivi's five classes of governed form (Awamil, «معمول» tables).
const MAMUL_LABEL = {
  marfu:  { ar: "مَعْمُولٌ مَرْفُوع", en: "governed in raf'",  tr: "merfû ma'mûl" },
  mansub: { ar: "مَعْمُولٌ مَنْصُوب", en: "governed in nasb",  tr: "mansub ma'mûl" },
  majrur: { ar: "مَعْمُولٌ مَجْرُور", en: "governed in jarr",  tr: "mecrûr ma'mûl" },
  majzum: { ar: "مَعْمُولٌ مَجْزُوم", en: "governed in jazm",  tr: "meczûm ma'mûl" },
  tabai:  { ar: "مَعْمُولٌ بِالتَّبَعِيَّة", en: "governed by following", tr: "tebe'iyyetle ma'mûl" },
};

let sarfTense = "mazi";
let wordCtx = null;
function openWord(tok, el, tab, ctx){
  if (ctx) wordCtx = ctx;
  if (activeWordEl) activeWordEl.classList.remove("active");
  activeWordEl = el; if (el) el.classList.add("active");
  const entry = GLOSSARY[tok.lex] || {lemma: tok.s.full, gloss:{en:"—",tr:"—"}, pos:""};
  const morph = MORPH[tok.lex];
  const hasGrammar = tok.grammar && tok.grammar.length;
  const mode = tab || "word";
  let html = "";
  html += `<div class="tabs" role="tablist">
    <button class="${mode==="word"?"on":""}" data-tab="word">${ui().word}</button>
    ${morph ? `<button class="${mode==="sarf"?"on":""}" data-tab="sarf">${arSpan("صَرْف")} ${ui().sarf}</button>` : ""}
    ${tok.irab ? `<button class="${mode==="irab"?"on":""}" data-tab="irab">${arSpan("إِعْرَاب")} ${ui().irab}</button>` : ""}
    ${hasGrammar ? `<button class="${mode==="grammar"?"on":""}" data-tab="grammar">${ui().grammar}</button>` : ""}
  </div>`;

  // The idiom, when the tapped word is part of one — shown for every tab, since
  // it governs how the whole span is read.
  const ph = wordCtx ? phraseAt(wordCtx.sen, wordCtx.ti) : null;
  const phEntry = ph ? GLOSSARY[ph.lex] : null;
  if (phEntry) {
    html += `<div class="phrase-banner">
      <div class="pb-ar" lang="ar">${phraseText(wordCtx.sen, ph)}</div>
      <div class="pb-gloss">${T(phEntry.gloss)}</div>
      ${phEntry.literal ? `<div class="pb-lit">${T(phEntry.literal)}</div>` : ""}
      ${phEntry.note ? `<div class="pb-note">${T(phEntry.note)}</div>` : ""}
    </div>`;
  }
  if (mode === "word") {
    html += `<p class="lemma">${entry.lemma} <button class="say" id="sayWord" aria-label="${ui().sayWord}" title="${ui().sayWord}">🔊</button></p>`;
    if (morph) html += `<p class="bab-line">${morph.bab} — ${morph.wazn}</p>`;
    html += `<div class="facts">`;
    if (entry.pos) html += chip(posLabel(entry.pos));
    if (entry.form) html += chip(ui().formChip + " " + entry.form);
    if (entry.root) html += `<button class="root-btn" data-root="${escapeAttr(entry.root)}">` +
      chip(ui().rootChip + " " + arSpan(entry.root), "tappable") + `</button>`;
    if (entry.plural) html += chip(ui().pluralChip + " " + arSpan(entry.plural));
    if (entry.level > 0) html += chip(ui().level + " " + entry.level, "level");
    html += `</div>
      <p class="gloss"><small>EN</small>${entry.gloss.en}</p>
      <p class="gloss"><small>TR</small>${entry.gloss.tr}</p>`;
    if (tok.segments) {
      html += `<div class="segrow">` + tok.segments.map(sg => {
        const e = GLOSSARY[sg.lex];
        return `<span class="seg-item">${sg.form}<small>${e ? T(e.gloss) : ""}</small></span>`;
      }).join("") + `</div>`;
    }
    const saved = cardSaved("word:" + tok.lex);
    const full = !saved && deckFull();
    html += `<div class="sheet-actions">
      <button class="btn ${saved ? "saved" : "primary"}" id="saveBtn" ${full ? "disabled" : ""}>${
        saved ? ui().saved : full ? ui().deckFull : ui().save}</button>
      ${hasGrammar ? `<button class="btn" id="toGrammar">${ui().gnote}</button>` : ""}
    </div>`;
  } else if (mode === "sarf" && morph) {
    // A jamid verb does not conjugate fully — the data carries exactly the
    // tenses that exist (لَيْسَ: mazi only; مَا زَالَ: mazi + mudari, no amr),
    // so the tab offers what is present rather than rendering empty tables.
    const nakil = morph.jamid ? null : nakilClass(entry);
    let tense = morph.jamid && !(morph[sarfTense] && morph[sarfTense].length)
      ? "mazi" : sarfTense;
    if (tense === "nakil" && !nakil) tense = "mazi";
    html += `<p class="lemma">${entry.lemma}</p>
      <p class="bab-line">${morph.bab} — ${morph.wazn}</p>`;
    if (!morph.jamid) html += `<div class="facts">
        ${chip("المصدر: " + arSpan(morph.masdar))}
        ${chip("اسم الفاعل: " + arSpan(morph.fail))}
        ${morph.maful ? chip("اسم المفعول: " + arSpan(morph.maful)) : ""}
      </div>`;
    html += `<div class="seg tense-seg" role="group" aria-label="Tense">
        <button data-tense="mazi" class="${tense==="mazi"?"on":""}">الماضي</button>
        ${!morph.jamid || morph.mudari ? `
        <button data-tense="mudari" class="${tense==="mudari"?"on":""}">المضارع</button>` : ""}
        ${morph.jamid ? "" : `
        <button data-tense="amr" class="${tense==="amr"?"on":""}">الأمر</button>
        ${muhtelife(morph) ? `<button data-tense="muhtelife" class="${tense==="muhtelife"?"on":""}">المُخْتَلِفَة</button>` : ""}
        ${nakil ? `<button data-tense="nakil" class="${tense==="nakil"?"on":""}">النَّقْل</button>` : ""}`}
      </div>`;
    const highlight = tok.s.full.replace(/[«»،:.]/g, "");
    if (tense === "nakil" && nakil) html += nakilTable(nakil, morph);
    else if (tense === "muhtelife" && muhtelife(morph)) html += muhtelifeTable(morph, highlight);
    else if (tense === "amr") html += conjTable(morph.amr, AMR_ROWS, highlight);
    else if (tense === "muhtelife") html += conjTable(morph.mazi, PERSON_ROWS, highlight);
    else html += conjTable(morph[tense], PERSON_ROWS, highlight);
    html += `<p class="sarf-note">${
      tense === "nakil" ? ui().nakilNote
      : tense === "muhtelife" ? ui().muhtelifeNote
        + (ziyadeExt(morph).length ? " " + ui().ziyadeNote : "")
      : ui().sarfNote}${
      tense === "nakil" ? "" : morph.note ? " " + morph.note : ""}</p>`;
    // Saving a verb adds a conjugation card, not a meaning card.
    if (muhtelife(morph)) {
      const savedV = cardSaved("verb:" + tok.lex);
      const fullV = !savedV && deckFull();
      html += `<div class="sheet-actions"><button class="btn ${savedV ? "" : "primary"}" id="saveConjBtn" ${fullV ? "disabled" : ""}>${
        savedV ? ui().savedConj : fullV ? ui().deckFull : ui().saveConj}</button></div>`;
    }
  } else if (mode === "irab" && tok.irab) {
    html += `<p class="lemma">${tok.s.full}</p>
      <div class="irab-ar" lang="ar">${tok.irab.ar}</div>
      <p class="irab-en">${tok.irab[state.uiLang] || tok.irab.en}</p>
      <p class="sarf-note">${ui().irabNote}</p>`;
  } else {
    tok.grammar.forEach(gid => { html += renderNote(gid); });
  }
  sheetInner.innerHTML = html;
  sheetInner.querySelectorAll("[data-tab]").forEach(b =>
    b.addEventListener("click", () => openWord(tok, el, b.dataset.tab)));
  sheetInner.querySelectorAll("[data-tense]").forEach(b =>
    b.addEventListener("click", () => { sarfTense = b.dataset.tense; openWord(tok, el, "sarf"); }));
  const sb = document.getElementById("saveBtn");
  if (sb) sb.addEventListener("click", () => {
    toggleSave(tok, wordCtx);
    // The page's copies of this word flip their in-deck marking live.
    document.querySelectorAll(`.word[data-lex="${CSS.escape(tok.lex)}"]`).forEach(x =>
      x.classList.toggle("in-deck", cardSaved("word:" + tok.lex)));
    openWord(tok, el, "word");
  });
  const tg = document.getElementById("toGrammar");
  if (tg) tg.addEventListener("click", () => openWord(tok, el, "grammar"));
  sheetInner.querySelectorAll(".root-btn").forEach(b =>
    b.addEventListener("click", () => openRoot(b.dataset.root)));
  const sc = document.getElementById("saveConjBtn");
  if (sc) sc.addEventListener("click", () => { toggleSaveVerb(tok.lex); openWord(tok, el, "sarf"); });
  const say = document.getElementById("sayWord");
  if (say) say.addEventListener("click", () => {
    const entry = GLOSSARY[tok.lex];
    if (!entry || !("speechSynthesis" in window)) return;
    // Pronouncing a word interrupts whatever is playing — including a recorded
    // sentence, which speechSynthesis.cancel() alone would leave running
    // underneath the TTS lemma.
    if (playAllActive) stopPlayAll(); else { speakGen++; stopNarration(); }
    document.querySelectorAll(".sentence.playing").forEach(x => x.classList.remove("playing"));
    clearSpokenWord();
    const u = new SpeechSynthesisUtterance(entry.lemma);
    u.lang = arVoice ? arVoice.lang : "ar";
    if (arVoice) u.voice = arVoice;
    u.rate = state.rate;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  });
  showSheet();
}

// The madrasah's own answer to "how do I know which i'rab this is?": each role
// is identified by the question it answers — fa'il answers «Ne? Kim?», maf'ul
// fih answers «Nerede? Ne zaman?». The device is Turkish because Turkish case
// endings line up with Arabic's; the English is a functional equivalent rather
// than a translation, since English has no cases to line up.
function questionTestHtml(gid){
  const g = GRAMMAR[gid];
  const qs = g && g.question && g.question[state.uiLang === "tr" ? "tr" : "en"];
  if (!qs || !qs.length) return "";
  return `<div class="qtest"><span class="qt-lbl">${ui().questionTest}</span>` +
    qs.map(q => `<span class="qt">${q}</span>`).join("") + `</div>`;
}
function renderNote(gid){
  const g = GRAMMAR[gid];
  if (!g) return "";
  let html = `<div class="gnote"><h3><span class="ar-inline">${g.title.ar}</span> — ${T(g.title)}
    ${g.level ? " " + chip(ui().level + " " + g.level, "level") : ""}</h3>`;
  if (g.amil || g.mamul) {
    let facts = "";
    // Where this topic sits in Birgivi's scheme of the governed forms.
    if (g.mamul) facts += chip(arSpan(MAMUL_LABEL[g.mamul].ar) + " · " + MAMUL_LABEL[g.mamul][state.uiLang === "tr" ? "tr" : "en"], "mamul");
    if (g.amil) facts += chip("العوامل: " + arSpan(g.amil.split(" — ")[0]) + (g.amil.includes(" — ") ? " — " + g.amil.split(" — ")[1] : ""), "amil");
    html += `<div class="facts">${facts}</div>`;
  }
  // The question test comes FIRST, above the explanation: a reader who has just
  // tapped a word wants "how do I recognise this?" before "what is it?".
  html += questionTestHtml(gid);
  // A jargon-free line first, then the classical account behind one tap. The
  // toggle is remembered, so a reader who wants the full text opens it once and
  // it stays open — a beginner is not walled off and a student is not nagged.
  if (g.plain) html += `<p class="plain">${T(g.plain)}</p>`;
  html += `<details class="deep"${state.deepNotes ? " open" : ""}>
      <summary>${ui().fullExplanation}</summary>
      <p>${T(g.explanation)}</p>`;
  if (g.sources && g.sources.length) html += `<p class="sarf-note">${ui().sources}: <span lang="ar" style="font-family:var(--ar-font)">${g.sources.join(" · ")}</span></p>`;
  html += `</details>`;
  (g.examples || []).forEach(x => html += `<div class="ex"><div class="ar" lang="ar">${x.ar}</div><div class="en">${T(x.gloss)}${x.src && CUR && x.src === CUR.id ? " " + ui().fromThisStory : ""}</div></div>`);
  if (g.mistakes && g.mistakes.length) {
    html += `<p class="mlabel">${ui().mistakes}</p>`;
    g.mistakes.forEach(m => html += `<div class="mistake"><span class="wrong" lang="ar">${m.wrong}</span><span class="right" lang="ar">${m.right}</span><div class="why">${T(m.why)}</div></div>`);
  }
  // Words and verb paradigms were already reviewable; the topics themselves
  // were not. Bound by delegation on sheetInner, because renderNote's output is
  // inlined in three different views.
  const noteFull = !noteSaved(gid) && deckFull();
  html += `<div class="sheet-actions"><button class="btn ${noteSaved(gid) ? "saved" : ""}" data-note-save="${gid}" ${
    noteFull ? "disabled" : ""}>${noteSaved(gid) ? ui().noteAdded : noteFull ? ui().deckFull : ui().addNote}</button></div>`;
  return html + `</div>`;
}

// ---------- grammar reference browser ----------
// Search + level-filter state for the browse/index view. Reset whenever the
// bottom sheet is closed (see closeSheet) — deliberately not persisted.
let refQuery = "";
let refLevel = "all";

function escapeAttr(s){
  return (s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

// Case-insensitive, tashkeel-insensitive match against a note's title (ar/en/tr)
// and explanation (en/tr). stripAr() only strips Arabic diacritics, so running it
// over the whole haystack + query before a plain lowercase substring check makes
// one comparison serve both the Arabic (tashkeel-stripped) and Latin (EN/TR) cases.
function refNoteMatches(g, query){
  const needle = stripAr(query || "").trim().toLowerCase();
  if (!needle) return true;
  const hay = stripAr([
    g.title.ar, g.title.en, g.title.tr,
    g.explanation && g.explanation.en, g.explanation && g.explanation.tr
  ].filter(Boolean).join(" \n ")).toLowerCase();
  return hay.includes(needle);
}

// Notes with no level are only shown under "All" (never under a specific level chip).
function refLevelMatches(g, level){
  if (level === "all") return true;
  if (!g.level) return false;
  return String(g.level) === String(level);
}

function refAvailableLevels(){
  const set = new Set();
  Object.values(GRAMMAR).forEach(g => { if (g.level) set.add(g.level); });
  return [...set].sort((a, b) => a - b);
}

function refListHtml(){
  let html = "";
  let any = false;
  REF_GROUPS.forEach(gr => {
    const notes = Object.entries(GRAMMAR).filter(([, g]) =>
      g.group === gr.id && refLevelMatches(g, refLevel) && refNoteMatches(g, refQuery));
    if (!notes.length) return;
    any = true;
    html += `<div class="ref-group"><span class="ar">${gr.ar}</span><span>${T(gr.label)}</span></div><ul class="ref-list">`;
    notes.forEach(([id, g]) => {
      html += `<li><button data-note="${id}"><span class="t-ar">${g.title.ar}</span><span class="t-en">${T(g.title)}</span>${g.level ? chip("L" + g.level, "level") : ""}</button></li>`;
    });
    html += `</ul>`;
  });
  if (!any) html += `<p class="ref-empty">${ui().noResults}</p>`;
  return html;
}

function bindRefListEvents(){
  document.querySelectorAll("#refListWrap [data-note]").forEach(b =>
    b.addEventListener("click", () => openRef(b.dataset.note)));
}

function refRerenderList(){
  document.getElementById("refListWrap").innerHTML = refListHtml();
  bindRefListEvents();
}

function bindRefIndexEvents(){
  const search = document.getElementById("refSearch");
  if (search) {
    search.addEventListener("input", () => { refQuery = search.value; refRerenderList(); });
  }
  document.querySelectorAll("#refLevels [data-level]").forEach(b =>
    b.addEventListener("click", () => {
      refLevel = b.dataset.level;
      document.querySelectorAll("#refLevels [data-level]").forEach(x => x.classList.toggle("on", x === b));
      refRerenderList();
    }));
  bindRefListEvents();
}

// ---------- corpus search ----------
// Ten stories in, "where else does this word appear?" stopped being answerable
// by scrolling. The index is built once, lazily, over every token in every
// story; a story's own glossary is the only place a lemma or root is recorded,
// so the walk has to carry it rather than read the global GLOSSARY.
let CORPUS = null;
function buildCorpus(){
  if (CORPUS) return CORPUS;
  CORPUS = [];
  STORIES.forEach(st => st.chapters.forEach(ch => ch.sentences.forEach(sen =>
    sen.tokens.forEach((tok, ti) => {
      const e = st.glossary[tok.lex] || {};
      CORPUS.push({
        st, ch, sen, ti, tok, entry: e,
        // The root is stored spaced but a learner types it closed up, so index both.
        hay: [tok.s.bare, strip(e.lemma || ""), strip(e.root || ""), strip(e.root || "").replace(/\s+/g, ""),
              (e.gloss && e.gloss.en || "").toLowerCase(),
              (e.gloss && e.gloss.tr || "").toLowerCase()].join("␀"),
      });
    }))));
  return CORPUS;
}
const DIACRITICS_RE = /[ً-ْٓ-ٰٕ]/g;
function strip(t){ return String(t).replace(DIACRITICS_RE, ""); }
// ا / أ / إ / آ and ة / ه are the two spellings learners actually get wrong when
// typing, so fold them before matching.
function foldAr(t){ return strip(t).replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي"); }

let searchQuery = "";
function searchCorpus(q){
  const needle = q.trim();
  if (needle.length < 2) return [];
  const nAr = foldAr(needle), nLat = needle.toLowerCase();
  return buildCorpus().filter(r =>
    foldAr(r.hay).includes(nAr) || r.hay.includes(nLat));
}
function openSearch(q){
  if (q !== undefined) searchQuery = q;
  if (activeWordEl) { activeWordEl.classList.remove("active"); activeWordEl = null; }
  const hits = searchCorpus(searchQuery);
  // Group by lex so a word with twenty occurrences is one heading, not twenty.
  const byLex = new Map();
  hits.forEach(h => {
    if (!byLex.has(h.tok.lex)) byLex.set(h.tok.lex, []);
    byLex.get(h.tok.lex).push(h);
  });
  const groups = [...byLex.entries()].sort((a, b) => b[1].length - a[1].length).slice(0, 12);
  let body = "";
  if (searchQuery.trim().length < 2) {
    body = `<p class="ref-intro">${ui().searchHint}</p>`;
  } else if (!groups.length) {
    body = `<p class="ref-intro">${ui().searchNone}</p>`;
  } else {
    body = `<p class="ref-intro">${ui().searchFound
      .replace("{n}", hits.length).replace("{w}", byLex.size)}</p>`;
    groups.forEach(([lex, rows]) => {
      const e = rows[0].entry;
      body += `<div class="hit-lex"><span class="hl-ar" lang="ar">${e.lemma || lex}</span>
        <span class="hl-gl">${e.gloss ? T(e.gloss) : ""}</span>
        <span class="hl-n">${rows.length}</span></div>`;
      rows.slice(0, 4).forEach(r => {
        const line = r.sen.tokens.map((t, i) =>
          (i === r.ti ? `<b>${t.s.full}</b>` : t.s.full) + (t.punctAfter || "")).join(" ");
        body += `<button class="hit" data-sid="${escapeAttr(r.st.id)}" data-ch="${r.ch.n}"
            data-sen="${escapeAttr(r.sen.id)}" data-ti="${r.ti}">
          <div class="h-ar" lang="ar" dir="rtl">${line}</div>
          <div class="h-src">${r.st.title.ar} · ${ui().chapter} ${r.ch.n}</div>
        </button>`;
      });
      if (rows.length > 4)
        body += `<div class="h-src" style="padding:0 .6rem">${ui().searchMore
          .replace("{n}", rows.length - 4)}</div>`;
    });
  }
  sheetInner.innerHTML = `<div class="tabs"><button class="on">${arSpan("بَحْث")} ${ui().searchTitle}</button></div>
    <div class="ref-search-row">
      <input type="search" id="corpusSearch" class="ref-search" autocomplete="off"
        placeholder="${escapeAttr(ui().searchPlaceholder)}" aria-label="${escapeAttr(ui().searchTitle)}"
        value="${escapeAttr(searchQuery)}">
    </div>${body}`;
  const input = document.getElementById("corpusSearch");
  input.addEventListener("input", () => {
    searchQuery = input.value;
    const at = input.selectionStart;
    openSearch();
    const again = document.getElementById("corpusSearch");
    again.focus();
    try { again.setSelectionRange(at, at); } catch (e) {}
  });
  sheetInner.querySelectorAll(".hit").forEach(b =>
    b.addEventListener("click", () => jumpTo(b.dataset.sid, b.dataset.sen, Number(b.dataset.ti))));
  showSheet();
  if (q !== undefined) input.focus();
}
// Jumping across stories has to survive the paywall: a locked premium story
// renders only its preview, so the target sentence may not be on the page.
function jumpTo(storyId, senId, ti){
  const st = STORIES.find(s => s.id === storyId);
  if (!st) return;
  if (!CUR || CUR.id !== st.id) openStory(st);
  closeSheet();
  const found = SENTENCE_FLAT.find(({ sen }) => sen.id === senId);
  if (!found) {                       // behind the paywall — say so instead of failing silently
    setTimeout(() => { openSearch(); }, 0);
    return;
  }
  found.sec.scrollIntoView({ block: "center" });
  const words = found.sec.querySelectorAll(".word");
  const w = words[ti];
  if (w) { markRead(senId); openWord(found.sen.tokens[ti], w, null, { sen: found.sen, ti }); }
}

// Every word from one root, across every story. The root chip in the word sheet
// runs this — it is the same index, queried by root rather than by spelling.
function openRoot(root){
  searchQuery = strip(root);
  openSearch(searchQuery);
}

// The whole sentence analysed at once — what a student actually writes out in
// the madrasah. The word sheet answers "what is this word?"; this answers
// "how does the sentence hold together?", which is a different question.
function openIrabSheet(sen){
  if (activeWordEl) { activeWordEl.classList.remove("active"); activeWordEl = null; }
  const topics = [];
  sen.tokens.forEach(t => (t.grammar || []).forEach(g => {
    if (GRAMMAR[g] && !topics.includes(g)) topics.push(g);
  }));
  // A sentence with clause-level i'rab teaches the jumla doctrine too.
  if (sen.jumal && GRAMMAR["anwa-al-jumal"] && !topics.includes("anwa-al-jumal"))
    topics.push("anwa-al-jumal");
  const rows = sen.tokens.map((tok, ti) => {
    const entry = GLOSSARY[tok.lex] || {};
    const ir = tok.irab || {};
    const gloss = entry.gloss ? T(entry.gloss) : "";
    return `<tr>
      <td class="n">${ti + 1}</td>
      <td class="w"><button class="jump" data-ti="${ti}" lang="ar">${tok.s.full}</button>
        ${gloss ? `<small>${gloss}</small>` : ""}</td>
      <td>${ir.ar ? `<span class="ir-ar" lang="ar">${ir.ar}</span>` : ""}${T(ir) || ""}</td>
    </tr>`;
  }).join("");
  // TARKIB is the word-by-word table; I'RAB (below) reads the same sentence
  // as CLAUSES, each named — or denied — its mahall per Qawa'id al-I'rab.
  const jumalHtml = sen.jumal ? `
    <div class="tabs jumal-tabs"><button class="on">${arSpan("إِعْرَابُ الْجُمَلِ")} ${ui().jumalTitle}</button></div>
    <p class="ref-intro">${ui().jumalHint}</p>
    <div class="jumal">${sen.jumal.map(j => `
      <div class="jumla-row">
        <div class="jt" lang="ar" dir="rtl">«${j.text}»</div>
        <div class="jr" lang="ar" dir="rtl">${j.ar}</div>
        <div class="jg">${state.uiLang === "tr" ? j.tr : j.en}</div>
      </div>`).join("")}</div>` : "";
  sheetInner.innerHTML = `<div class="tabs"><button class="on">${arSpan("تَرْكِيبُ الْجُمْلَة")} ${ui().sheetTitle}</button></div>
    <p class="sheet-line" lang="ar" dir="rtl">${sen.tokens.map(t => t.s.full).join(" ")}</p>
    <p class="sheet-tr">${T(sen.translation)}</p>
    <p class="ref-intro">${ui().sheetHint}</p>
    <div style="overflow-x:auto">
      <table class="irab-sheet">
        <thead><tr><th></th><th>${ui().colWord}</th><th>${ui().colIrab}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${jumalHtml}
    ${topics.length ? `<div class="ref-group">${ui().sheetTopics}</div>
      <div class="sheet-topics">${topics.map(g =>
        `<button class="btn" data-note="${escapeAttr(g)}">${arSpan(GRAMMAR[g].title.ar)}</button>`).join("")}</div>` : ""}`;
  sheetInner.querySelectorAll(".jump").forEach(b => b.addEventListener("click", () => {
    const ti = Number(b.dataset.ti);
    openWord(sen.tokens[ti], null, null, {sen, ti});
  }));
  sheetInner.querySelectorAll("[data-note]").forEach(b =>
    b.addEventListener("click", () => openRef(b.dataset.note)));
  showSheet();
}

function openRef(noteId){
  if (activeWordEl) { activeWordEl.classList.remove("active"); activeWordEl = null; }
  if (noteId) {
    sheetInner.innerHTML = `<div class="backrow"><button id="refBack">${ui().back}</button></div>` + renderNote(noteId);
    const back = document.getElementById("refBack");
    if (back) back.addEventListener("click", () => openRef());
  } else {
    const levels = refAvailableLevels();
    sheetInner.innerHTML = `<div class="tabs"><button class="on">${ui().refTitle}</button></div>
      <p class="ref-intro"><span lang="ar" style="font-family:var(--ar-font)">الأمثلة المختلفة، بناء الأفعال، العوامل، الكافية، قطر الندى</span> — ${ui().refIntro}</p>
      <div class="ref-search-row">
        <input type="search" id="refSearch" class="ref-search" placeholder="${escapeAttr(ui().searchGrammar)}" aria-label="${escapeAttr(ui().searchGrammar)}" value="${escapeAttr(refQuery)}">
      </div>
      <div class="seg ref-levels" id="refLevels" role="group" aria-label="${escapeAttr(ui().level)}">
        <button data-level="all" class="${refLevel === "all" ? "on" : ""}">${ui().allLevels}</button>
        ${levels.map(l => `<button data-level="${l}" class="${String(refLevel) === String(l) ? "on" : ""}">${l}</button>`).join("")}
      </div>
      <div id="refListWrap">${refListHtml()}</div>`;
    bindRefIndexEvents();
  }
  showSheet();
}

// ---------- deck (SRS scheduling) ----------
// SM-2. Each card carries an ease factor that rises when recall is easy and
// falls when it is not, so a card you keep failing comes back faster than one
// you keep getting right — a fixed multiplier cannot do that.
const DAY = 86400000;
const MIN_EASE = 1.3, START_EASE = 2.5, LEECH_AT = 8;
function ensureSrs(c){
  if (!c.srs) c.srs = { due: 0, ivl: 0 };
  const s = c.srs;
  if (s.ease === undefined) s.ease = START_EASE;
  if (s.reps === undefined) s.reps = s.ivl ? 2 : 0;   // migrate older decks
  if (s.lapses === undefined) s.lapses = 0;
  return c;
}
function isLeech(c){ return ensureSrs(c).srs.lapses >= LEECH_AT; }

// ---------- the daily loop ----------
// Local date, not UTC: a streak is about the learner's day, and midnight in
// Istanbul is not midnight in London.
function todayKey(d){
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
       + "-" + String(d.getDate()).padStart(2, "0");
}
function rollDay(){
  const k = todayKey();
  if (state.today.date !== k) {
    state.today = { date: k, reviewed: 0, learned: 0, read: 0 };
    localStorage.setItem("qissa-today", JSON.stringify(state.today));
  }
  return state.today;
}
// Called on any act of study. A day already counted does nothing; yesterday
// extends the streak; anything older starts a new one.
// The shield's calendar: one mercy per local week. Approximate week numbering
// is fine — the shield is a kindness, not an accounting system.
function weekKey(){
  const d = new Date();
  const jan1 = new Date(d.getFullYear(), 0, 1);
  return d.getFullYear() + "-" + Math.floor(((d - jan1) / 86400000 + jan1.getDay()) / 7);
}
function countActivity(kind){
  const t = rollDay();
  t[kind] = (t[kind] || 0) + 1;
  localStorage.setItem("qissa-today", JSON.stringify(t));
  const k = todayKey();
  if (state.streak.last !== k) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    const y2 = new Date(); y2.setDate(y2.getDate() - 2);
    let days = 1, shieldWeek = state.streak.shieldWeek;
    if (state.streak.last === todayKey(y)) {
      days = state.streak.days + 1;
    } else if (state.streak.last === todayKey(y2) && shieldWeek !== weekKey()) {
      // The mercy day: ONE missed day a week does not burn the chain — the
      // shield does. Breaking a long streak over a single bad day is the
      // sharpest quit-moment the habit apps know; forgiveness, rationed to
      // once a week, keeps the chain honest without making it brittle.
      days = state.streak.days + 1;
      shieldWeek = weekKey();
      showToast(ui().mercyUsed);
    }
    state.streak = { days, last: k, ...(shieldWeek ? { shieldWeek } : {}) };
    localStorage.setItem("qissa-streak", JSON.stringify(state.streak));
  }
  updateStreakChip();   // the percentage moves on every act, not only the first
}
function goalPct(){
  const t = rollDay();
  const r = Math.min(1, state.goal.reviews ? t.reviewed / state.goal.reviews : 1);
  const n = Math.min(1, state.goal.newWords ? t.learned / state.goal.newWords : 1);
  return Math.round(((r + n) / 2) * 100);
}
function updateStreakChip(){
  const el = document.getElementById("streakChip");
  if (!el) return;
  rollDay();
  const pct = goalPct();
  el.hidden = state.streak.days === 0 && pct === 0;
  el.textContent = "\u{1F525} " + state.streak.days + " \u00b7 " + pct + "%";
  el.title = ui().streakTitle.replace("{d}", state.streak.days)
    .replace("{r}", state.today.reviewed).replace("{R}", state.goal.reviews)
    .replace("{n}", state.today.learned).replace("{N}", state.goal.newWords);
}

// The words of the chapter you are reading, in level order, that are not in the
// deck yet — so "learn N new today" is a button and not a chore.
function newWordsHere(limit){
  if (!CUR) return [];
  const have = new Set(state.deck.filter(d => d.type === "word").map(d => d.lex));
  const out = [], seen = new Set();
  SENTENCE_FLAT.forEach(({ sen }) => sen.tokens.forEach(tok => {
    const e = GLOSSARY[tok.lex];
    if (!e || !e.level || e.level < 1) return;      // skip proper nouns
    if (have.has(tok.lex) || seen.has(tok.lex)) return;
    seen.add(tok.lex);
    out.push({ tok, entry: e });
  }));
  out.sort((a, b) => a.entry.level - b.entry.level);
  return limit ? out.slice(0, limit) : out;
}
function editGoal(){
  const r = prompt(ui().goalAskReviews, state.goal.reviews);
  if (r === null) return;
  const n = prompt(ui().goalAskNew, state.goal.newWords);
  if (n === null) return;
  state.goal = { reviews: Math.max(0, parseInt(r, 10) || 0),
                 newWords: Math.max(0, parseInt(n, 10) || 0) };
  localStorage.setItem("qissa-goal", JSON.stringify(state.goal));
  updateStreakChip();
  renderDeck();
}
function learnNewHere(){
  const left = Math.max(0, state.goal.newWords - rollDay().learned);
  const picks = newWordsHere(left || state.goal.newWords);
  // toggleCard refuses past the Lite cap — only words that actually went in
  // may count toward the daily goal.
  picks.forEach(({ tok }) => { if (toggleSave(tok)) countActivity("learned"); });
  renderDeck();
}
// The on-device difficulty model. Every review already logs lapses and moves
// ease; this folds both into one score so the queue serves the STRUGGLING
// cards first, while attention is fresh — a card failed four times outranks a
// merely young one. Two points per lapse, one per notch of lost ease.
function struggleScore(c){
  const s = ensureSrs(c).srs;
  return (s.lapses || 0) * 2 + Math.max(0, (2.5 - (s.ease || 2.5)) * 2.5);
}
function dueCards(){
  const now = Date.now();
  return state.deck.filter(c => ensureSrs(c).srs.due <= now)
    .sort((a, b) => struggleScore(b) - struggleScore(a) ||
                    ensureSrs(a).srs.due - ensureSrs(b).srs.due);
}
// ---------- deck export ----------
// Anki-importable TSV — Front, Back, Tags — so the learner's cards are THEIRS,
// portable to any SRS app. Built live from the deck; GRAMMAR is global, so
// note cards export their real title and plain lede anywhere.
function buildDeckExport(){
  const esc = v => String(v == null ? "" : v).replace(/[\t\n]/g, " ").trim();
  return state.deck.map(c => {
    if (c.type === "note") {
      const g = GRAMMAR[c.noteId];
      return [esc(g.title.ar), esc(T(g.title) + " — " + T(g.plain || {})), "qissa grammar"];
    }
    if (c.type === "verb")
      return [esc(c.lemma || c.lex), esc(ui().conjCard), "qissa sarf"];
    return [esc(c.lemma || c.bare), esc((c.gloss && c.gloss.en) || "") +
      ((c.gloss && c.gloss.tr) ? " / " + esc(c.gloss.tr) : ""), "qissa vocab"];
  }).map(r => r.join("\t")).join("\n");
}
function exportDeck(){
  const blob = new Blob(["﻿" + buildDeckExport()], { type: "text/tab-separated-values" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "qissa-deck.tsv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function updateDeckCount(){
  const c = document.getElementById("deckCount");
  const due = dueCards().length;
  c.hidden = due === 0;
  c.textContent = due;
}
function persistDeck(){
  localStorage.setItem("qissa-deck", JSON.stringify(state.deck));
  updateDeckCount();
}
// The Lite tier caps the deck (research §7.5); Premium removes the limit.
// The cap gates ADDING only — reviewing, grading and removing always work,
// because a lapsed subscriber must never lose access to their own cards.
const LITE_DECK_CAP = 100;
function deckFull(){ return !state.premium && state.deck.length >= LITE_DECK_CAP; }

// One statement of what makes two cards the same card. Every membership test
// and every toggle goes through it, so a new card type declares its identity
// once instead of adding a fourth hand-written findIndex predicate.
function cardKey(c){
  if (c.type === "verb") return "verb:" + c.lex;
  if (c.type === "note") return "note:" + c.noteId;
  return "word:" + c.lex;
}
function findCard(key){ return state.deck.findIndex(d => cardKey(d) === key); }
function cardSaved(key){ return findCard(key) >= 0; }
// Remove if present, otherwise build and add. `make` is only called when the
// card is actually going in, and may return null to decline.
function toggleCard(key, make){
  const i = findCard(key);
  if (i >= 0) state.deck.splice(i, 1);
  else {
    if (deckFull()) return false;    // removing above never hits the cap
    const card = make();
    if (!card) return;
    state.deck.push({...card, srs: {due: 0, ivl: 0}});
  }
  persistDeck();
  return true;
}
function toggleSave(tok, ctx){
  return toggleCard("word:" + tok.lex, () => {
    const e = GLOSSARY[tok.lex];
    const card = {lex: tok.lex, type: "word", bare: tok.s.bare, lemma: e.lemma,
            gloss: {en: e.gloss.en, tr: e.gloss.tr}};
    // The sentence snapshot (Satori Reader's most-loved idea): a card born in
    // a sentence remembers it, and review shows the word at home instead of
    // orphaned. Optional — vocab-sheet and daily-goal saves have no sentence,
    // and old cards without one still render.
    if (ctx && ctx.sen && CUR) {
      const t = ctx.sen.tokens;
      card.ctx = {
        story: CUR.id, sen: ctx.sen.id,
        pre: t.slice(0, ctx.ti).map(x => x.s.full + (x.punctAfter || "")).join(" "),
        word: t[ctx.ti].s.full,
        post: t.slice(ctx.ti + 1).map(x => x.s.full + (x.punctAfter || "")).join(" "),
      };
    }
    return card;
  });
}
// A conjugation card asks for one cell of the Emsile-i Muhtelife rather than a
// meaning — the drill a madrasah student actually does.
function toggleSaveVerb(lex){
  return toggleCard("verb:" + lex, () => {
    const m = MORPH[lex], e = GLOSSARY[lex];
    if (!m || !muhtelife(m)) return null;
    return {lex, type: "verb", lemma: e ? e.lemma : m.mazi[0],
            gloss: e ? {en: e.gloss.en, tr: e.gloss.tr} : {en: "", tr: ""}};
  });
}
// A grammar card asks the madrasah question: name the term, then give an
// example of it. Only the note id is stored — the title and the example are
// read from GRAMMAR at review time, so a note that is later corrected or
// retranslated does not leave a stale copy sitting in someone's deck.
function noteSaved(id){ return cardSaved("note:" + id); }
function toggleSaveNote(id){
  toggleCard("note:" + id, () => GRAMMAR[id] ? {type: "note", noteId: id} : null);
}
function notePrompt(card){
  const g = GRAMMAR[card.noteId];   // guaranteed by pruneDeck()
  const ex = (g.examples || [])[0];
  return { ar: g.title.ar, label: T(g.title), exAr: ex ? ex.ar : "", exGloss: ex ? T(ex.gloss) : "" };
}
let reviewStep = 0;
function openDeck(){
  reviewStep = 0;
  renderDeck();
  showSheet();
  if (activeWordEl) { activeWordEl.classList.remove("active"); activeWordEl = null; }
}
function fmtDue(c){
  const ms = ensureSrs(c).srs.due - Date.now();
  if (ms <= 0) return ui().dueNow;
  const m = Math.round(ms / 60000);
  if (m < 60) return m + "m";
  const hrs = Math.round(m / 60);
  if (hrs < 24) return hrs + "h";
  return Math.round(hrs / 24) + "d";
}
// q: "again" | "hard" | "good" | "easy"
function grade(card, q){
  if (q === true) q = "good";            // older call sites passed a boolean
  if (q === false) q = "again";
  const s = ensureSrs(card).srs;
  if (q === "again") {
    s.reps = 0; s.lapses++;
    s.ease = Math.max(MIN_EASE, s.ease - 0.20);
    s.ivl = 0;
    s.due = Date.now() + 10 * 60000;     // back in ten minutes
  } else {
    if (q === "hard")      s.ease = Math.max(MIN_EASE, s.ease - 0.15);
    else if (q === "easy") s.ease = s.ease + 0.15;
    if (s.reps === 0)      s.ivl = q === "easy" ? 3 : 1;
    else if (s.reps === 1) s.ivl = q === "hard" ? 3 : (q === "easy" ? 8 : 6);
    else {
      const mult = q === "hard" ? 1.2 : (q === "easy" ? s.ease * 1.3 : s.ease);
      s.ivl = Math.max(s.ivl + 1, Math.ceil(s.ivl * mult));
    }
    s.reps++;
    s.due = Date.now() + s.ivl * DAY;
  }
  persistDeck();
  countActivity("reviewed");
}
// What each button will do, so the learner can see the schedule before choosing.
function previewIvl(card, q){
  const s = ensureSrs(card).srs;
  if (q === "again") return ui().tenMin;
  let ivl;
  if (s.reps === 0)      ivl = q === "easy" ? 3 : 1;
  else if (s.reps === 1) ivl = q === "hard" ? 3 : (q === "easy" ? 8 : 6);
  else {
    const ease = q === "hard" ? Math.max(MIN_EASE, s.ease - 0.15)
               : q === "easy" ? s.ease + 0.15 : s.ease;
    const mult = q === "hard" ? 1.2 : (q === "easy" ? ease * 1.3 : ease);
    ivl = Math.max(s.ivl + 1, Math.ceil(s.ivl * mult));
  }
  return ivl + ui().dayShort;
}
function deckStats(){
  const now = Date.now();
  let fresh = 0, learning = 0, mature = 0, leeches = 0;
  state.deck.forEach(c => {
    const s = ensureSrs(c).srs;
    if (isLeech(c)) leeches++;
    if (s.reps === 0) fresh++;
    else if (s.ivl < 21) learning++;
    else mature++;
  });
  return { fresh, learning, mature, leeches, due: dueCards().length, total: state.deck.length };
}
// ---------- the progress page ----------
// The numbers a reader wants in one place. Everything is computed live from
// progress + deck through the same primitives the library and deck already
// trust (storyStats, deckStats, rollDay) — the page itself stores nothing,
// so it can never disagree with the shelf.
function corpusStats(){
  const out = { stories: STORIES.length, storiesDone: 0,
                sentencesRead: 0, sentencesTotal: 0, levels: new Map() };
  STORIES.forEach(st => {
    const { total, read } = storyStats(st);
    out.sentencesTotal += total; out.sentencesRead += read;
    if (total && read === total) out.storiesDone++;
    const e = out.levels.get(st.level) || { read: 0, total: 0 };
    e.read += read; e.total += total;
    out.levels.set(st.level, e);
  });
  return out;
}
function openStats(){
  const c = corpusStats(), d = deckStats(), t = rollDay();
  const noteCards = state.deck.filter(x => x.type === "note").length;
  const tile = (n, lbl) => `<div class="stat-tile"><b>${n}</b><span>${lbl}</span></div>`;
  const lvlRows = [...c.levels.entries()].sort((a, b) => a[0] - b[0]).map(([lv, e]) => `
    <div class="lvl-row ${state.myLevel === lv ? "mine" : ""}">
      <span class="lv">${ui().level} ${lv}</span>
      <span class="bar"><span style="width:${e.total ? Math.round(100 * e.read / e.total) : 0}%"></span></span>
      <span class="n">${e.read}/${e.total}</span>
    </div>`).join("");
  sheetInner.innerHTML = `
    <h3 class="welcome-h">${ui().statsTitle}</h3>
    <div class="stats-grid">
      ${tile("\u{1F525} " + state.streak.days, ui().dayStreak)}
      ${tile(c.storiesDone + "/" + c.stories, ui().stStories)}
      ${tile(c.sentencesRead, ui().stSentences)}
      ${tile(d.total, ui().stCards)}
      ${tile(d.mature, ui().stKnown)}
      ${tile(noteCards, ui().stTopics)}
    </div>
    <p class="ref-intro">${ui().todayLine.replace("{r}", t.reviewed)
      .replace("{n}", t.learned).replace("{s}", t.read)}</p>
    ${lvlRows}`;
  showSheet();
}
// A verb card asks for cells of the Muhtelife; a word card asks for a meaning.
// A round asks SEVERAL cells, not one: recalling a single form lets the reader
// pattern-match around it, three spread across the table demand the paradigm —
// the way the müderris asks «ism-i fâili? meçhûl muzârisi? emri?» in one
// breath. Deterministic per round so the reveal shows the same set that was
// asked, and a different set comes up next round.
const VERB_DRILL_QS = 3;
function verbPrompt(card){
  const m = MORPH[card.lex];
  if (!m) return null;
  const rows = muhtelife(m);
  if (!rows) return null;
  const base = ensureSrs(card).srs.reps + (card.pick || 0);
  const n = Math.min(VERB_DRILL_QS, rows.length);
  // A stride of len/n keeps the picks spread over the whole table AND distinct
  // (i·step stays below len for i < n), instead of three neighbouring sigha.
  const step = Math.max(1, Math.floor(rows.length / n));
  const qs = [];
  for (let i = 0; i < n; i++) {
    const row = rows[(base + i * step) % rows.length];
    qs.push({ label: state.uiLang === "tr" ? row.tr : row.en, answer: row.ar });
  }
  return { qs, lemma: m.mazi[0] };
}
function renderDeck(){
  const queue = dueCards();
  const st = deckStats();
  let html = `<div class="tabs"><button class="on">${ui().yourDeck} (${
    state.premium ? st.total : st.total + "/" + LITE_DECK_CAP}) · ${st.due} ${ui().due}</button></div>`;
  const t = rollDay();
  const rPct = Math.min(100, state.goal.reviews ? Math.round(t.reviewed / state.goal.reviews * 100) : 100);
  const nPct = Math.min(100, state.goal.newWords ? Math.round(t.learned / state.goal.newWords * 100) : 100);
  const canLearn = newWordsHere(1).length && t.learned < state.goal.newWords;
  html += `<div class="daily">
      <div class="d-head">
        <span class="d-streak">\u{1F525} ${state.streak.days} ${ui().dayStreak}</span>
        <button class="d-goal" id="goalEdit">${ui().goalEdit}</button>
      </div>
      <div class="d-bar"><span style="width:${rPct}%"></span></div>
      <div class="d-lbl">${ui().goalReviews.replace("{a}", t.reviewed).replace("{b}", state.goal.reviews)}</div>
      <div class="d-bar new"><span style="width:${nPct}%"></span></div>
      <div class="d-lbl">${ui().goalNew.replace("{a}", t.learned).replace("{b}", state.goal.newWords)}</div>
      ${canLearn ? `<button class="btn primary d-learn" id="learnHere">${ui().learnHere
        .replace("{n}", Math.min(newWordsHere(0).length, state.goal.newWords - t.learned))}</button>` : ""}
    </div>`;
  html += `<div class="deck-stats">
      <span class="st fresh">${st.fresh} ${ui().stNew}</span>
      <span class="st learn">${st.learning} ${ui().stLearning}</span>
      <span class="st mature">${st.mature} ${ui().stMature}</span>
      ${st.leeches ? `<span class="st leech">${st.leeches} ${ui().stLeech}</span>` : ""}
      ${state.deck.length ? `<button class="st export" id="deckExport">${ui().exportBtn}</button>` : ""}
    </div>`;
  if (!state.deck.length) {
    html += `<p class="empty">${ui().empty}</p>`;
  } else if (!queue.length) {
    const next = state.deck.slice().sort((x, y) => ensureSrs(x).srs.due - ensureSrs(y).srs.due)[0];
    html += `<p class="empty">${ui().allDone} ${ui().nextReview}: ${fmtDue(next)}</p>`;
  } else {
    const card = queue[0];
    const vp = card.type === "verb" ? verbPrompt(card) : null;
    const np = card.type === "note" ? notePrompt(card) : null;
    let steps = [ui().step1, ui().step2, ui().step3];
    let front, back;
    if (np) {
      steps = [ui().noteStep1, ui().noteStep2, ui().noteStep3];
      front = np.ar;
      back = (reviewStep >= 1 ? `<div class="verb-ask">${np.label}</div>` : "") +
             (reviewStep === 2 && np.exAr
               ? `<div class="verb-answer" lang="ar">${np.exAr}</div>
                  <div class="note-ex-gloss">${np.exGloss}</div>` : "");
    } else if (vp) {

      back = vp.qs.map((q, i) =>
        `<div class="verb-ask">${vp.qs.length > 1 ? (i + 1) + ". " : ""}${q.label}</div>` +
        (reviewStep === 2 ? `<div class="verb-answer" lang="ar">${q.answer}</div>` : "")).join("");
    } else {

      back = reviewStep === 2
        ? `<div style="margin-top:.4rem">${T(card.gloss)}</div>`
          + (card.ctx ? `<div class="card-ctx" lang="ar" dir="rtl">${card.ctx.pre} <b>${card.ctx.word}</b> ${card.ctx.post}</div>` : "")
        : "";
    }
    html += `<div class="deck-card" id="reviewCard" style="cursor:pointer">
        <div class="front" lang="ar" dir="rtl">${front}</div>

        <div class="step">${steps[reviewStep]} · ${queue.length} ${ui().due}${isLeech(card) ? " · " + ui().stLeech : ""}</div>
      </div>`;
    if (reviewStep === 2) {
      html += `<div class="grade-row">
        <button class="btn grade again" data-q="again"><b>${ui().again}</b><i>${previewIvl(card, "again")}</i></button>
        <button class="btn grade hard"  data-q="hard"><b>${ui().hard}</b><i>${previewIvl(card, "hard")}</i></button>
        <button class="btn grade good"  data-q="good"><b>${ui().good}</b><i>${previewIvl(card, "good")}</i></button>
        <button class="btn grade easy"  data-q="easy"><b>${ui().easy}</b><i>${previewIvl(card, "easy")}</i></button>
      </div>`;
    }
  }
  html += `<ul class="deck-list">` + state.deck.map((d, i) => {
    const g = d.type === "note" ? GRAMMAR[d.noteId] : null;
    const head = g ? g.title.ar : d.lemma;
    const sub = d.type === "verb" ? ui().conjCard
              : g ? ui().noteCard + " · " + T(g.title)
              : T(d.gloss);
    return `<li><span class="w" lang="ar">${head}</span><span class="g">${sub}</span><span class="due-tag">${fmtDue(d)}</span><button data-del="${i}">${ui().remove}</button></li>`;
  }).join("") + `</ul>`;
  sheetInner.innerHTML = html;
  const rc = document.getElementById("reviewCard");
  if (rc) rc.addEventListener("click", () => { if (reviewStep < 2) { reviewStep++; renderDeck(); } });
  // The snapshot is a door: tap the birth-sentence to stand in it again.
  const cx = sheetInner.querySelector(".card-ctx");
  if (cx) {
    cx.title = ui().ctxJump;
    cx.addEventListener("click", e => {
      e.stopPropagation();
      const c = dueCards()[0];
      if (c && c.ctx) { reviewStep = 0; jumpTo(c.ctx.story, c.ctx.sen); }
    });
  }
  const le = document.getElementById("learnHere");
  if (le) le.addEventListener("click", learnNewHere);
  const ge = document.getElementById("goalEdit");
  if (ge) ge.addEventListener("click", editGoal);

  if (de) de.addEventListener("click", exportDeck);
  sheetInner.querySelectorAll(".grade[data-q]").forEach(b =>

  sheetInner.querySelectorAll("[data-del]").forEach(b =>
    b.addEventListener("click", () => { state.deck.splice(+b.dataset.del, 1); persistDeck(); renderDeck(); }));

function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let M = null;
function startMatch(){
  const pool = shuffle(Object.entries(GLOSSARY).filter(([k, e]) => e.level > 0 && e.gloss && e.lemma.length > 1)).slice(0, 6);
  const cards = shuffle(pool.flatMap(([k, e], i) => [
    {pair: i, kind: "ar", label: e.lemma},
    {pair: i, kind: "gl", label: (state.uiLang === "tr" && e.gloss.tr) ? e.gloss.tr : e.gloss.en}
  ]));

  renderMatch();
}
function renderMatch(){
  let html = `<div class="backrow"><button id="gBack">${ui().back2}</button></div>
    <div class="tabs"><button class="on">${ui().match}</button></div>
    <div class="match-grid">` + M.cards.map((c, i) =>
      `<button class="${c.kind === "ar" ? "ar" : ""} ${c.matched ? "matched" : ""} ${M.first === i ? "sel" : ""}" data-i="${i}" ${c.kind === "ar" ? 'lang="ar"' : ""}>${c.label}</button>`).join("") + `</div>

  sheetInner.innerHTML = html;
  document.getElementById("gBack").addEventListener("click", openGames);
  sheetInner.querySelectorAll(".match-grid [data-i]").forEach(b =>
    b.addEventListener("click", () => pickMatch(+b.dataset.i)));
  if (M.found === M.total) {
    const secs = Math.round((Date.now() - M.start) / 1000);
    document.getElementById("mDone").innerHTML =
      `<div class="game-why">${ui().matchDone} ${M.moves} ${ui().moves.toLowerCase()}, ${secs}s.</div>
       <div class="sheet-actions"><button class="btn primary" id="replayM">${ui().replay}</button></div>`;
    document.getElementById("replayM").addEventListener("click", startMatch);
  }
}
function pickMatch(i){
  const c = M.cards[i];
  if (c.matched) return;
  if (M.first === null) { M.first = i; renderMatch(); return; }
  if (M.first === i) { M.first = null; renderMatch(); return; }
  M.moves++;
  const f = M.cards[M.first];
  if (f.pair === c.pair && f.kind !== c.kind) { f.matched = c.matched = true; M.found++; }
  M.first = null;
  renderMatch();
}

// Short vowels (fatha/damma/kasra/sukun) plus tanwin (fathatan/dammatan/kasratan) \u2014
// the endings a harakat drill can test. TANWIN_SET is a subset used to keep
// distractors grammatically plausible (tanwin never belongs on a definite noun).
const HARAKAT_SET = ["\u064E", "\u064F", "\u0650", "\u0652", "\u064B", "\u064C", "\u064D"].map(s => JSON.parse('"' + s + '"'));
const TANWIN_SET = ["\u064B", "\u064C", "\u064D"].map(s => JSON.parse('"' + s + '"'));
function harakatItems(){
  const items = [];
  CHAPTERS.forEach(ch => ch.sentences.forEach(sen => sen.tokens.forEach((t, ti) => {
    const full = t.s.full;
    if (HARAKAT_SET.includes(full.slice(-1)) && t.irab && full.length > 3) {
      items.push({sen, ti, full, base: full.slice(0, -1), last: full.slice(-1), irab: t.irab});
    }
  })));
  return items;
}
function startHarakat(){
  const items = shuffle(harakatItems()).slice(0, 8);
  if (!items.length) { openGames(); return; }
  runQuiz({
    title: ui().harakat, ask: ui().chooseForm, items, restart: startHarakat,
    question: it => `<div class="game-q" lang="ar">${senWithSlot(it.sen, it.ti, () => "«ـــــ»")}</div>`,
    options: it => {
      // Definite (ال-prefixed) nouns never take tanwin — keep distractors
      // plausible by excluding tanwin marks for those bases. The correct mark
      // is excluded from the pool, so a distractor can never equal the answer.
      const definite = /^ال/.test(stripAr(it.base));
      const candidates = HARAKAT_SET.filter(x => x !== it.last && !(definite && TANWIN_SET.includes(x)));
      return shuffle([{ html: it.full, ok: true, ar: true },
        ...shuffle(candidates).slice(0, 2).map(x => ({ html: it.base + x, ok: false, ar: true }))]);
    },
    why: it => irabWhy(it.irab),
  });
}

function startSpot(){
  const items = [];
  Object.entries(GRAMMAR).forEach(([id, g]) => (g.mistakes || []).forEach(m =>
    items.push({wrong: m.wrong, right: m.right, why: m.why, noteId: id, title: g.title})));
  if (!items.length) { openGames(); return; }
  runQuiz({
    title: ui().spot, ask: ui().whichCorrect, items: shuffle(items).slice(0, 8), restart: startSpot,
    question: () => "",
    options: it => shuffle([{ html: it.right, ok: true, ar: true },
                            { html: it.wrong, ok: false, ar: true }]),
    why: it => T(it.why),
    extras: [{ label: it => `${arSpan(it.title.ar)} — ${ui().gnote}`,
               run: it => openRef(it.noteId) }],
  });
}

// ---------- game: fill the gap (cloze) ----------
// The one drill that only works because the app knows what you have read: take
// a sentence you actually got through, remove a content word, and ask for it
// back. Recall in context, which no amount of isolated flashcards produces.
//
// Options are all lemmas — never a mix of the inflected answer and citation
// forms of the distractors, which would give the answer away by shape alone.
const CLOZE_POS = ["noun", "verb", "propn", "adv"];

// Candidate words are bucketed by part of speech ONCE per story. Filtering the
// whole glossary per candidate token instead made the walk cost
// tokens-read × glossary-size, so it got slower the more the reader had read —
// 50,000 pair visits over this corpus to keep the eight items a round uses.
// The two per-item exclusions are deferred to clozeRound, where they run for
// eight items rather than five hundred.
function glossaryByPos(st){
  if (!st._byPos) {
    const by = {};
    for (const [lex, g] of Object.entries(st.glossary)) {
      if (!g.lemma || !g.level || !g.pos) continue;
      (by[g.pos] = by[g.pos] || []).push({ lex, ...g });
    }
    st._byPos = by;
  }
  return st._byPos;
}
function clozeItems(){
  const items = [];
  STORIES.forEach(st => {
    const prog = state.progress[st.id] || {};
    const byPos = glossaryByPos(st);
    st.chapters.forEach(ch => ch.sentences.forEach(sen => {
      if (!prog[sen.id]) return;
      // Every lemma standing in this sentence is disqualified as a distractor:
      // it may well be a second correct answer.
      const present = new Set(sen.tokens.map(t => t.lex));
      sen.tokens.forEach((tok, ti) => {
        const e = st.glossary[tok.lex];
        if (!e || !e.level || !e.lemma) return;
        // Gate on the GLOSSARY's part of speech, not the token's. The two can
        // legitimately disagree — تَعَالَى is a verb in form but a formulaic
        // particle in the lexicon — and since the options are citation forms,
        // the lexical class is the one that has to govern both the admission
        // and the distractors. Mixing them let a verb be offered against three
        // particles, which gives the answer away by shape alone.
        if (!CLOZE_POS.includes(e.pos)) return;
        if (phraseAt(sen, ti)) return;                       // do not gut an idiom
        const bucket = byPos[e.pos] || [];
        // Cheap admission gate; the exact pool is cut in clozePool() below.
        if (bucket.length < 3) return;
        items.push({ storyId: st.id, sen, ti, tok, entry: e, bucket, present });
      });
    }));
  });
  return items;
}
// shuffle() is in-place, so this must return a fresh array — the bucket is
// shared by every item of the same part of speech in the story.
function clozePool(it){
  return it.bucket.filter(g => !it.present.has(g.lex) && g.lemma !== it.entry.lemma);
}
// Resolve pools only for the items a round will actually use, walking the
// shuffled candidates until enough of them turn out to be playable.
function clozeRound(n){
  const out = [];
  for (const it of shuffle(clozeItems())) {
    if (out.length >= n) break;
    const pool = clozePool(it);
    if (pool.length >= 2) out.push({ ...it, pool });
  }
  return out;
}

function startCloze(){
  const items = clozeRound(8);
  if (!items.length) { emptyGame(ui().clozeGame, ui().clozeNeedsReading); return; }
  runQuiz({
    title: ui().clozeGame, ask: ui().clozeAsk, items, restart: startCloze,
    question: it => `<div class="game-q" lang="ar">${senWithSlot(it.sen, it.ti, () => "«ـــــ»")}</div>`,
    options: it => shuffle([{ html: it.entry.lemma, ok: true, ar: true },
      ...shuffle(it.pool).slice(0, 3).map(g => ({ html: g.lemma, ok: false, ar: true }))]),
    why: it => `<span lang="ar" style="font-family:var(--ar-font);font-size:1.3em">${it.tok.s.full}</span>
         — ${T(it.entry.gloss)}
         ${it.tok.irab ? "<br>" + irabWhy(it.tok.irab) : ""}`,
    extras: [{ label: () => ui().seeInStory,
               // A read sentence can sit in a story that has since rotated back
               // behind the paywall; jumping there would land in the preview
               // wall. Reachable means: story open, or inside the free preview.
               show: it => {
                 const st = STORIES.find(x => x.id === it.storyId);
                 if (!storyLocked(st)) return true;
                 let i = 0;
                 for (const ch of st.chapters)
                   for (const sen of ch.sentences) {
                     if (sen.id === it.sen.id) return i < PREVIEW_SENTENCES;
                     i++;
                   }
                 return false;
               },
               run: it => jumpTo(it.storyId, it.sen.id, it.ti) }],
  });
}

renderModeSeg();

document.querySelectorAll(".controls .seg [data-layer]").forEach(x => x.classList.toggle("on", x.dataset.layer === state.layer));
document.getElementById("refOpen").textContent = ui().grammarBtn;
document.getElementById("gamesOpen").textContent = ui().games;
    document.getElementById("searchOpen").textContent = ui().searchBtn;
    document.getElementById("statsOpen").textContent = ui().statsBtn;
    updateStreakChip();
document.getElementById("deckOpen").childNodes[0].textContent = ui().deck + " ";
renderLegend();
updatePlayAllBtn();
document.getElementById("backLib").addEventListener("click", renderLibrary);
// The reading bar: a 3px thread of accent along the top, tracking how far
// through the story the reader is. rAF-throttled; hidden in the library.
const readbarFill = document.querySelector("#readbar div");
let rbPending = false;
addEventListener("scroll", () => {
  if (rbPending) return;
  rbPending = true;
  requestAnimationFrame(() => {
    rbPending = false;
    // scrollingElement, not documentElement: served without a doctype (file://,
    // the PWA before the host injects one) the page is in quirks mode and the
    // BODY is the scroller — documentElement.scrollTop stays 0 forever there.
    const h = document.scrollingElement || document.documentElement;
    const max = h.scrollHeight - innerHeight;
    readbarFill.style.width = max > 0 ? (100 * h.scrollTop / max).toFixed(1) + "%" : "0%";
  });
}, { passive: true });
if (STORIES.length === 1) openStory(STORIES[0]); else renderLibrary();
// A newcomer lands on a flat shelf where an L6 fiqh text sits beside an L1
// story with nothing steering them. Ask once — the answer feeds "For you" —
// and never ask again on boot: dismissing the sheet is also an answer, and
// the level chip (or the "For you" button) reopens the picker on demand.
if (!state.myLevel && STORIES.length > 1 && localStorage.getItem("qissa-welcomed") !== "1") {
  localStorage.setItem("qissa-welcomed", "1");
  openLevelPicker();
}
// The one place a deck loaded from storage is made safe to render. GRAMMAR is
// baked into the file and never changes at runtime, so once this has run no
// card can point at a note that is not there — which is why nothing downstream
// carries a fallback for that case. Also normalises decks written before card
// types existed.
function pruneDeck(){
  const before = state.deck.length;
  state.deck.forEach(c => { if (!c.type) c.type = "word"; });
  state.deck = state.deck.filter(c => c.type !== "note" || GRAMMAR[c.noteId]);
  return state.deck.length !== before;
}
// persistDeck writes to localStorage synchronously, so only pay for it when the
// prune actually removed something rather than on every single page load.
if (pruneDeck()) persistDeck(); else updateDeckCount();

// ---------- installable / offline ----------
// Only over http(s): a service worker cannot register from file:// or inside a
// sandboxed frame, and neither should throw. Everything below is additive — the
// app is one self-contained file and works with none of it.
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
// The manifest shortcut lands on #deck; honour it, and any later hash change.
function openFromHash(){
  if (location.hash === "#deck") openDeck();
  else if (location.hash === "#search") openSearch("");
}
window.addEventListener("hashchange", openFromHash);
openFromHash();
