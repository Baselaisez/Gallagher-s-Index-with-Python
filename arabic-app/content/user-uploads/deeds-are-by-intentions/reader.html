    ${morph ? `<button class="${mode==="sarf"?"on":""}" data-tab="sarf">${arSpan("صَرْف")} ${ui().sarf}</button>` : ""}
    ${tok.irab ? `<button class="${mode==="irab"?"on":""}" data-tab="irab">${arSpan("إِعْرَاب")} ${ui().irab}</button>` : ""}
    ${hasGrammar ? `<button class="${mode==="grammar"?"on":""}" data-tab="grammar">${ui().grammar}</button>` : ""}
  </div>`;

  // The idiom, when the tapped word is part of one — shown for every tab, since
  // it governs how the whole span is read.
  const ph = wordCtx ? phraseAt(wordCtx.sen, wordCtx.ti) : null;
  const phEntry = ph ? GLOSSARY[ph.lex] : null;
  if (phEntry) {
    html += `<div class="phrase-banner">
      <div class="pb-ar" lang="ar">${phraseText(wordCtx.sen, ph)}</div>
      <div class="pb-gloss">${T(phEntry.gloss)}</div>
      ${phEntry.literal ? `<div class="pb-lit">${T(phEntry.literal)}</div>` : ""}
      ${phEntry.note ? `<div class="pb-note">${T(phEntry.note)}</div>` : ""}
    </div>`;
  }
  if (mode === "word") {
    html += `<p class="lemma">${entry.lemma} <button class="say" id="sayWord" aria-label="${ui().sayWord}" title="${ui().sayWord}">🔊</button></p>`;
    if (morph) html += `<p class="bab-line">${morph.bab} — ${morph.wazn}</p>`;
    html += `<div class="facts">`;
    if (entry.pos) html += chip(posLabel(entry.pos));
    if (entry.form) html += chip(ui().formChip + " " + entry.form);
    if (entry.root) html += `<button class="root-btn" data-root="${escapeAttr(entry.root)}">` +
      chip(ui().rootChip + " " + arSpan(entry.root), "tappable") + `</button>`;
    if (entry.plural) html += chip(ui().pluralChip + " " + arSpan(entry.plural));
    if (entry.level > 0) html += chip(ui().level + " " + entry.level, "level");
    html += `</div>
      <p class="gloss"><small>EN</small>${entry.gloss.en}</p>
      <p class="gloss"><small>TR</small>${entry.gloss.tr}</p>`;
    // The form in the text, beside the dictionary form: وَاعْفُ next to عَفَا,
    // named (emir — sen) and translated as the FORM means («affet!»), so the
    // reader never has to bridge lemma and text alone.
    const cell = morph ? findFormInParadigm(morph, tok.s.full) : null;
    if (cell) {
      const lbl = formCellLabel(cell);
      const meaning = formMeaning(cell, entry);
      html += `<div class="intext">
        <div class="it-head">${ui().inText}</div>
        <div class="it-row"><span class="it-ar" lang="ar">${tok.s.full}</span>
          ${meaning ? `<span class="it-gloss">«${meaning}»</span>` : ""}</div>
        <div class="it-cell"><span lang="ar">${lbl.ar}</span> — ${state.uiLang === "tr" ? lbl.tr : lbl.en}</div>
      </div>`;
    }
    if (tok.segments) {
      html += `<div class="segrow">` + tok.segments.map(sg => {
        const e = GLOSSARY[sg.lex];
        return `<span class="seg-item">${sg.form}<small>${e ? T(e.gloss) : ""}</small></span>`;
      }).join("") + `</div>`;
    }
    const saved = cardSaved("word:" + tok.lex);
    const full = !saved && deckFull();
    html += `<div class="sheet-actions">
      <button class="btn ${saved ? "saved" : "primary"}" id="saveBtn" ${full ? "disabled" : ""}>${
        saved ? ui().saved : full ? ui().deckFull : ui().save}</button>
      ${hasGrammar ? `<button class="btn" id="toGrammar">${ui().gnote}</button>` : ""}
    </div>`;
  } else if (mode === "sarf" && morph) {
    // A jamid verb does not conjugate fully — the data carries exactly the
    // tenses that exist (لَيْسَ: mazi only; مَا زَالَ: mazi + mudari, no amr),
    // so the tab offers what is present rather than rendering empty tables.
    const nakil = morph.jamid ? null : nakilClass(entry);
    let tense = morph.jamid && !(morph[sarfTense] && morph[sarfTense].length)
      ? "mazi" : sarfTense;
    if (tense === "nakil" && !nakil) tense = "mazi";
    // Open on the tense that actually holds the tapped form — a reader who
    // taps وَاعْفُ should land on the amr table with their cell lit, not on
    // the mazi. Only the three plain tenses swap; muhtelife and nakil stay.
    const cellS = findFormInParadigm(morph, tok.s.full);
    if (!sarfUserPick && cellS && ["mazi", "mudari", "amr"].includes(tense)
        && ["mazi", "mudari", "amr"].includes(cellS.tense) && cellS.tense !== tense
        && morph[cellS.tense]) tense = cellS.tense;
    html += `<p class="lemma">${entry.lemma}</p>
      <p class="bab-line">${morph.bab} — ${morph.wazn}</p>`;
    const chain = ilalChain(entry, morph);
    if (chain) html += ilalHtml(chain);
    if (!morph.jamid) html += `<div class="facts">
        ${chip("المصدر: " + arSpan(morph.masdar))}
        ${chip("اسم الفاعل: " + arSpan(morph.fail))}
        ${morph.maful ? chip("اسم المفعول: " + arSpan(morph.maful)) : ""}
      </div>`;
    html += `<div class="seg tense-seg" role="group" aria-label="Tense">
        <button data-tense="mazi" class="${tense==="mazi"?"on":""}">الماضي</button>
        ${!morph.jamid || morph.mudari ? `
        <button data-tense="mudari" class="${tense==="mudari"?"on":""}">المضارع</button>` : ""}
        ${morph.jamid ? "" : `
        <button data-tense="amr" class="${tense==="amr"?"on":""}">الأمر</button>
        ${muhtelife(morph) ? `<button data-tense="muhtelife" class="${tense==="muhtelife"?"on":""}">المُخْتَلِفَة</button>` : ""}
        ${nakil ? `<button data-tense="nakil" class="${tense==="nakil"?"on":""}">النَّقْل</button>` : ""}`}
      </div>`;
    const highlight = tok.s.full.replace(/[«»،:.]/g, "");
    const hlIdx = cellS && cellS.tense === tense ? cellS.i : -1;
    if (tense === "nakil" && nakil) html += nakilTable(nakil, morph);
    else if (tense === "muhtelife" && muhtelife(morph)) html += muhtelifeTable(morph, highlight);
    else if (tense === "amr") html += conjTable(morph.amr, AMR_ROWS, highlight, hlIdx);
    else if (tense === "muhtelife") html += conjTable(morph.mazi, PERSON_ROWS, highlight);
    else html += conjTable(morph[tense], PERSON_ROWS, highlight, hlIdx);
    html += `<p class="sarf-note">${
      tense === "nakil" ? ui().nakilNote
      : tense === "muhtelife" ? ui().muhtelifeNote
        + (ziyadeExt(morph).length ? " " + ui().ziyadeNote : "")
      : ui().sarfNote}${
      tense === "nakil" ? "" : morph.note ? " " + morph.note : ""}</p>`;
    // Saving a verb adds a conjugation card, not a meaning card.
    if (muhtelife(morph)) {
      const savedV = cardSaved("verb:" + tok.lex);
      const fullV = !savedV && deckFull();
      html += `<div class="sheet-actions"><button class="btn ${savedV ? "" : "primary"}" id="saveConjBtn" ${fullV ? "disabled" : ""}>${
        savedV ? ui().savedConj : fullV ? ui().deckFull : ui().saveConj}</button></div>`;
    }
  } else if (mode === "irab" && tok.irab) {
    html += `<p class="lemma">${tok.s.full}</p>
      <div class="irab-ar" lang="ar">${tok.irab.ar}</div>
      <p class="irab-en">${tok.irab[state.uiLang] || tok.irab.en}</p>
      <p class="sarf-note">${ui().irabNote}</p>`;
  } else {
    tok.grammar.forEach(gid => { html += renderNote(gid); });
  }
  sheetInner.innerHTML = html;
  sheetInner.querySelectorAll("[data-tab]").forEach(b =>
    b.addEventListener("click", () => openWord(tok, el, b.dataset.tab)));
  sheetInner.querySelectorAll("[data-tense]").forEach(b =>
    b.addEventListener("click", () => {
      sarfTense = b.dataset.tense; sarfUserPick = true; openWord(tok, el, "sarf");
    }));
  const sb = document.getElementById("saveBtn");
  if (sb) sb.addEventListener("click", () => {
    toggleSave(tok, wordCtx);
    // The page's copies of this word flip their in-deck marking live.
    document.querySelectorAll(`.word[data-lex="${CSS.escape(tok.lex)}"]`).forEach(x =>
      x.classList.toggle("in-deck", cardSaved("word:" + tok.lex)));
    openWord(tok, el, "word");
  });
  const tg = document.getElementById("toGrammar");
  if (tg) tg.addEventListener("click", () => openWord(tok, el, "grammar"));
  sheetInner.querySelectorAll(".root-btn").forEach(b =>
    b.addEventListener("click", () => openRoot(b.dataset.root)));
  const sc = document.getElementById("saveConjBtn");
  if (sc) sc.addEventListener("click", () => { toggleSaveVerb(tok.lex); openWord(tok, el, "sarf"); });
  const say = document.getElementById("sayWord");
  if (say) say.addEventListener("click", () => {
    const entry = GLOSSARY[tok.lex];
    if (!entry || !("speechSynthesis" in window)) return;
    // Pronouncing a word interrupts whatever is playing — including a recorded
    // sentence, which speechSynthesis.cancel() alone would leave running
    // underneath the TTS lemma.
    if (playAllActive) stopPlayAll(); else { speakGen++; stopNarration(); }
    document.querySelectorAll(".sentence.playing").forEach(x => x.classList.remove("playing"));
    clearSpokenWord();
    const u = new SpeechSynthesisUtterance(entry.lemma);
    u.lang = arVoice ? arVoice.lang : "ar";
    if (arVoice) u.voice = arVoice;
    u.rate = state.rate;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  });
  showSheet();
}

// The madrasah's own answer to "how do I know which i'rab this is?": each role
// is identified by the question it answers — fa'il answers «Ne? Kim?», maf'ul
// fih answers «Nerede? Ne zaman?». The device is Turkish because Turkish case
// endings line up with Arabic's; the English is a functional equivalent rather
// than a translation, since English has no cases to line up.
function questionTestHtml(gid){
  const g = GRAMMAR[gid];
  const qs = g && g.question && g.question[state.uiLang === "tr" ? "tr" : "en"];
  if (!qs || !qs.length) return "";
  return `<div class="qtest"><span class="qt-lbl">${ui().questionTest}</span>` +
    qs.map(q => `<span class="qt">${q}</span>`).join("") + `</div>`;
}
function renderNote(gid){
  const g = GRAMMAR[gid];
  if (!g) return "";
  let html = `<div class="gnote"><h3><span class="ar-inline">${g.title.ar}</span> — ${T(g.title)}
    ${g.level ? " " + chip(ui().level + " " + g.level, "level") : ""}</h3>`;
  if (g.amil || g.mamul) {
    let facts = "";
    // Where this topic sits in Birgivi's scheme of the governed forms.
    if (g.mamul) facts += chip(arSpan(MAMUL_LABEL[g.mamul].ar) + " · " + MAMUL_LABEL[g.mamul][state.uiLang === "tr" ? "tr" : "en"], "mamul");
    if (g.amil) facts += chip("العوامل: " + arSpan(g.amil.split(" — ")[0]) + (g.amil.includes(" — ") ? " — " + g.amil.split(" — ")[1] : ""), "amil");
    html += `<div class="facts">${facts}</div>`;
  }
  // The question test comes FIRST, above the explanation: a reader who has just
  // tapped a word wants "how do I recognise this?" before "what is it?".
  html += questionTestHtml(gid);
  // A jargon-free line first, then the classical account behind one tap. The
  // toggle is remembered, so a reader who wants the full text opens it once and
  // it stays open — a beginner is not walled off and a student is not nagged.
  if (g.plain) html += `<p class="plain">${T(g.plain)}</p>`;
  html += `<details class="deep"${state.deepNotes ? " open" : ""}>
      <summary>${ui().fullExplanation}</summary>
      <p>${T(g.explanation)}</p>`;
  if (g.sources && g.sources.length) html += `<p class="sarf-note">${ui().sources}: <span lang="ar" style="font-family:var(--ar-font)">${g.sources.join(" · ")}</span></p>`;
  html += `</details>`;
  (g.examples || []).forEach(x => html += `<div class="ex"><div class="ar" lang="ar">${x.ar}</div><div class="en">${T(x.gloss)}${x.src && CUR && x.src === CUR.id ? " " + ui().fromThisStory : ""}</div></div>`);
  if (g.mistakes && g.mistakes.length) {
    html += `<p class="mlabel">${ui().mistakes}</p>`;
    g.mistakes.forEach(m => html += `<div class="mistake"><span class="wrong" lang="ar">${m.wrong}</span><span class="right" lang="ar">${m.right}</span><div class="why">${T(m.why)}</div></div>`);
  }
  // Words and verb paradigms were already reviewable; the topics themselves
  // were not. Bound by delegation on sheetInner, because renderNote's output is
  // inlined in three different views.
  const noteFull = !noteSaved(gid) && deckFull();
  html += `<div class="sheet-actions"><button class="btn ${noteSaved(gid) ? "saved" : ""}" data-note-save="${gid}" ${
    noteFull ? "disabled" : ""}>${noteSaved(gid) ? ui().noteAdded : noteFull ? ui().deckFull : ui().addNote}</button></div>`;
  return html + `</div>`;
}

// ---------- grammar reference browser ----------
// Search + level-filter state for the browse/index view. Reset whenever the
// bottom sheet is closed (see closeSheet) — deliberately not persisted.
let refQuery = "";
let refLevel = "all";

function escapeAttr(s){
  return (s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

// Case-insensitive, tashkeel-insensitive match against a note's title (ar/en/tr)
// and explanation (en/tr). stripAr() only strips Arabic diacritics, so running it
// over the whole haystack + query before a plain lowercase substring check makes
// one comparison serve both the Arabic (tashkeel-stripped) and Latin (EN/TR) cases.
function refNoteMatches(g, query){
  const needle = stripAr(query || "").trim().toLowerCase();
  if (!needle) return true;
  const hay = stripAr([
    g.title.ar, g.title.en, g.title.tr,
    g.explanation && g.explanation.en, g.explanation && g.explanation.tr
  ].filter(Boolean).join(" \n ")).toLowerCase();
  return hay.includes(needle);
}

// Notes with no level are only shown under "All" (never under a specific level chip).
function refLevelMatches(g, level){
  if (level === "all") return true;
  if (!g.level) return false;
  return String(g.level) === String(level);
}

function refAvailableLevels(){
  const set = new Set();
  Object.values(GRAMMAR).forEach(g => { if (g.level) set.add(g.level); });
  return [...set].sort((a, b) => a - b);
}

function refListHtml(){
  let html = "";
  let any = false;
  REF_GROUPS.forEach(gr => {
    const notes = Object.entries(GRAMMAR).filter(([, g]) =>
      g.group === gr.id && refLevelMatches(g, refLevel) && refNoteMatches(g, refQuery));
    if (!notes.length) return;
    any = true;
    html += `<div class="ref-group"><span class="ar">${gr.ar}</span><span>${T(gr.label)}</span></div><ul class="ref-list">`;
    notes.forEach(([id, g]) => {
      html += `<li><button data-note="${id}"><span class="t-ar">${g.title.ar}</span><span class="t-en">${T(g.title)}</span>${g.level ? chip("L" + g.level, "level") : ""}</button></li>`;
    });
    html += `</ul>`;
  });
  if (!any) html += `<p class="ref-empty">${ui().noResults}</p>`;
  return html;
}

function bindRefListEvents(){
  document.querySelectorAll("#refListWrap [data-note]").forEach(b =>
    b.addEventListener("click", () => openRef(b.dataset.note)));
}

function refRerenderList(){
  document.getElementById("refListWrap").innerHTML = refListHtml();
  bindRefListEvents();
}

function bindRefIndexEvents(){
  const search = document.getElementById("refSearch");
  if (search) {
    search.addEventListener("input", () => { refQuery = search.value; refRerenderList(); });
  }
  document.querySelectorAll("#refLevels [data-level]").forEach(b =>
    b.addEventListener("click", () => {
      refLevel = b.dataset.level;
      document.querySelectorAll("#refLevels [data-level]").forEach(x => x.classList.toggle("on", x === b));
      refRerenderList();
    }));
  bindRefListEvents();
}

// ---------- corpus search ----------
// Ten stories in, "where else does this word appear?" stopped being answerable
// by scrolling. The index is built once, lazily, over every token in every
// story; a story's own glossary is the only place a lemma or root is recorded,
// so the walk has to carry it rather than read the global GLOSSARY.
let CORPUS = null;
function buildCorpus(){
  if (CORPUS) return CORPUS;
  CORPUS = [];
  STORIES.forEach(st => st.chapters.forEach(ch => ch.sentences.forEach(sen =>
    sen.tokens.forEach((tok, ti) => {
      const e = st.glossary[tok.lex] || {};
      CORPUS.push({
        st, ch, sen, ti, tok, entry: e,
        // The root is stored spaced but a learner types it closed up, so index both.
        hay: [tok.s.bare, strip(e.lemma || ""), strip(e.root || ""), strip(e.root || "").replace(/\s+/g, ""),
              (e.gloss && e.gloss.en || "").toLowerCase(),
              (e.gloss && e.gloss.tr || "").toLowerCase()].join("␀"),
      });
    }))));
  return CORPUS;
}
const DIACRITICS_RE = /[ً-ْٓ-ٰٕ]/g;
function strip(t){ return String(t).replace(DIACRITICS_RE, ""); }
// ا / أ / إ / آ and ة / ه are the two spellings learners actually get wrong when
// typing, so fold them before matching.
function foldAr(t){ return strip(t).replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي"); }

let searchQuery = "";
function searchCorpus(q){
  const needle = q.trim();
  if (needle.length < 2) return [];
  const nAr = foldAr(needle), nLat = needle.toLowerCase();
  return buildCorpus().filter(r =>
    foldAr(r.hay).includes(nAr) || r.hay.includes(nLat));
}
function openSearch(q){
  if (q !== undefined) searchQuery = q;
  if (activeWordEl) { activeWordEl.classList.remove("active"); activeWordEl = null; }
  const hits = searchCorpus(searchQuery);
  // Group by lex so a word with twenty occurrences is one heading, not twenty.
  const byLex = new Map();
  hits.forEach(h => {
    if (!byLex.has(h.tok.lex)) byLex.set(h.tok.lex, []);
    byLex.get(h.tok.lex).push(h);
  });
  const groups = [...byLex.entries()].sort((a, b) => b[1].length - a[1].length).slice(0, 12);
  let body = "";
  if (searchQuery.trim().length < 2) {
    body = `<p class="ref-intro">${ui().searchHint}</p>`;
  } else if (!groups.length) {
    body = `<p class="ref-intro">${ui().searchNone}</p>`;
  } else {
    body = `<p class="ref-intro">${ui().searchFound
      .replace("{n}", hits.length).replace("{w}", byLex.size)}</p>`;
    groups.forEach(([lex, rows]) => {
      const e = rows[0].entry;
      body += `<div class="hit-lex"><span class="hl-ar" lang="ar">${e.lemma || lex}</span>
        <span class="hl-gl">${e.gloss ? T(e.gloss) : ""}</span>
        <span class="hl-n">${rows.length}</span></div>`;
      rows.slice(0, 4).forEach(r => {
        const line = r.sen.tokens.map((t, i) =>
          (i === r.ti ? `<b>${t.s.full}</b>` : t.s.full) + (t.punctAfter || "")).join(" ");
        body += `<button class="hit" data-sid="${escapeAttr(r.st.id)}" data-ch="${r.ch.n}"
            data-sen="${escapeAttr(r.sen.id)}" data-ti="${r.ti}">
          <div class="h-ar" lang="ar" dir="rtl">${line}</div>
          <div class="h-src">${r.st.title.ar} · ${ui().chapter} ${r.ch.n}</div>
        </button>`;
      });
      if (rows.length > 4)
        body += `<div class="h-src" style="padding:0 .6rem">${ui().searchMore
          .replace("{n}", rows.length - 4)}</div>`;
    });
  }
  sheetInner.innerHTML = `<div class="tabs"><button class="on">${arSpan("بَحْث")} ${ui().searchTitle}</button></div>
    <div class="ref-search-row">
      <input type="search" id="corpusSearch" class="ref-search" autocomplete="off"
        placeholder="${escapeAttr(ui().searchPlaceholder)}" aria-label="${escapeAttr(ui().searchTitle)}"
        value="${escapeAttr(searchQuery)}">
    </div>${body}`;
  const input = document.getElementById("corpusSearch");
  input.addEventListener("input", () => {
    searchQuery = input.value;
    const at = input.selectionStart;
    openSearch();
    const again = document.getElementById("corpusSearch");
    again.focus();
    try { again.setSelectionRange(at, at); } catch (e) {}
  });
  sheetInner.querySelectorAll(".hit").forEach(b =>
    b.addEventListener("click", () => jumpTo(b.dataset.sid, b.dataset.sen, Number(b.dataset.ti))));
  showSheet();
  if (q !== undefined) input.focus();
}
// Jumping across stories has to survive the paywall: a locked premium story
// renders only its preview, so the target sentence may not be on the page.
function jumpTo(storyId, senId, ti){
  const st = STORIES.find(s => s.id === storyId);
  if (!st) return;
  if (!CUR || CUR.id !== st.id) openStory(st);
  closeSheet();
  const found = SENTENCE_FLAT.find(({ sen }) => sen.id === senId);
  if (!found) {                       // behind the paywall — say so instead of failing silently
    setTimeout(() => { openSearch(); }, 0);
    return;
  }
  found.sec.scrollIntoView({ block: "center" });
  const words = found.sec.querySelectorAll(".word");
  const w = words[ti];
  if (w) { markRead(senId); openWord(found.sen.tokens[ti], w, null, { sen: found.sen, ti }); }
}

// Every word from one root, across every story. The root chip in the word sheet
// runs this — it is the same index, queried by root rather than by spelling.
function openRoot(root){
  searchQuery = strip(root);
  openSearch(searchQuery);
}

// The whole sentence analysed at once — what a student actually writes out in
// the madrasah. The word sheet answers "what is this word?"; this answers
// "how does the sentence hold together?", which is a different question.
function openIrabSheet(sen){
  if (activeWordEl) { activeWordEl.classList.remove("active"); activeWordEl = null; }
  const topics = [];
  sen.tokens.forEach(t => (t.grammar || []).forEach(g => {
    if (GRAMMAR[g] && !topics.includes(g)) topics.push(g);
  }));
  // A sentence with clause-level i'rab teaches the jumla doctrine too.
  if (sen.jumal && GRAMMAR["anwa-al-jumal"] && !topics.includes("anwa-al-jumal"))
    topics.push("anwa-al-jumal");
  const rows = sen.tokens.map((tok, ti) => {
    const entry = GLOSSARY[tok.lex] || {};
    const ir = tok.irab || {};
    const gloss = entry.gloss ? T(entry.gloss) : "";
    return `<tr>
      <td class="n">${ti + 1}</td>
      <td class="w"><button class="jump" data-ti="${ti}" lang="ar">${tok.s.full}</button>
        ${gloss ? `<small>${gloss}</small>` : ""}</td>
      <td>${ir.ar ? `<span class="ir-ar" lang="ar">${ir.ar}</span>` : ""}${T(ir) || ""}</td>
    </tr>`;
  }).join("");
  // TARKIB is the word-by-word table; I'RAB (below) reads the same sentence
  // as CLAUSES, each named — or denied — its mahall per Qawa'id al-I'rab.
  const jumalHtml = sen.jumal ? `
    <div class="tabs jumal-tabs"><button class="on">${arSpan("إِعْرَابُ الْجُمَلِ")} ${ui().jumalTitle}</button></div>
    <p class="ref-intro">${ui().jumalHint}</p>
    <div class="jumal">${sen.jumal.map(j => `
      <div class="jumla-row">
        <div class="jt" lang="ar" dir="rtl">«${j.text}»</div>
        <div class="jr" lang="ar" dir="rtl">${j.ar}</div>
        <div class="jg">${state.uiLang === "tr" ? j.tr : j.en}</div>
      </div>`).join("")}</div>` : "";
  sheetInner.innerHTML = quizReturnHtml() + `<div class="tabs"><button class="on">${arSpan("تَرْكِيبُ الْجُمْلَة")} ${ui().sheetTitle}</button></div>
    <p class="sheet-line" lang="ar" dir="rtl">${sen.tokens.map(t => t.s.full).join(" ")}</p>
    <p class="sheet-tr">${T(sen.translation)}</p>
    <p class="ref-intro">${ui().sheetHint}</p>
    <div style="overflow-x:auto">
      <table class="irab-sheet">
        <thead><tr><th></th><th>${ui().colWord}</th><th>${ui().colIrab}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${jumalHtml}
    ${topics.length ? `<div class="ref-group">${ui().sheetTopics}</div>
      <div class="sheet-topics">${topics.map(g =>
        `<button class="btn" data-note="${escapeAttr(g)}">${arSpan(GRAMMAR[g].title.ar)}</button>`).join("")}</div>` : ""}`;
  sheetInner.querySelectorAll(".jump").forEach(b => b.addEventListener("click", () => {
    const ti = Number(b.dataset.ti);
    openWord(sen.tokens[ti], null, null, {sen, ti});
  }));
  sheetInner.querySelectorAll("[data-note]").forEach(b =>
    b.addEventListener("click", () => openRef(b.dataset.note)));
  bindQuizReturn();
  showSheet();
}

// ---------- the I'RAB REALIZATION engine: pure rule, no data ------------
// Qawa'id al-I'rab and the Kafiya sort every declined word by TWO crossing
// questions, and both are answerable from the surface alone. (1) By WHAT is
// the case shown — a haraka, a letter, or the DROPPING of something? (2) In
// WHAT MANNER — lafzi (written on the word), taqdiri (the letter cannot
// carry it), or mahalli (the word is mabni and only its POSITION declines)?
// Neither question needs a dictionary, so neither needs data. The engine
// answers both, names the class that forces the answer, and refuses when the
// surface genuinely cannot decide.
class IrabSign {
  static MABNI = ["هذا","هذه","هؤلاء","ذلك","تلك","الذي","التي","الذين","اللاتي",
                  "من","ما","متى","اين","كيف","حيث","الان","امس","هو","هي","هم","انا",
                  "انت","نحن","هما","هن","كم","اي"];
  static of(word){
    const w = (word || "").normalize("NFC").replace(/[«»،.:!؟\s]/g, "");
    const bare = stripAr(w).replace(/[^ء-ي]/g, "");
    if (!bare) return null;
    // stripAr keeps the hamza SEAT (أ إ آ), so a plain-alif pattern would
    // never match أَبُوهُ. Fold the seats for MATCHING only — never for display.
    const flat = bare.replace(/[أإآ]/g, "ا").replace(/ى/g, "ي");
    const R = (by, manner, cases, why) => ({ by, manner, cases, why, word: w });
    // -- MABNI: the word itself never changes; only its place declines.
    if (this.MABNI.includes(flat) || this.MABNI.includes(bare))
      return R("mahalli", "mahalli", ["marfu", "mansub", "majrur"],
        { ar: "اِسْمٌ مَبْنِيٌّ — لَا يَتَغَيَّرُ آخِرُهُ، فَإِعْرَابُهُ مَحَلِّيٌّ بِحَسَبِ مَوْقِعِهِ.",
          en: "A mabni noun — its ending never changes, so its i'rab is MAHALLI: read off its position, not its last letter.",
          tr: "Mebnî isim — sonu değişmez; i'râbı MAHALLÎDİR, son harfinden değil cümledeki yerinden okunur." });
    // -- the five nouns in idafa: declined by LETTERS, waw/alif/ya
    if (/^(ابو|اخو|حمو|ذو|ابا|اخا|حما|ذا|ابي|اخي|حمي|ذي)/.test(flat) && flat.length > 3)
      return R("huruf", "lafzi", ["marfu", "mansub", "majrur"],
        { ar: "مِنَ الْأَسْمَاءِ الْخَمْسَةِ — تُعْرَبُ بِالْوَاوِ رَفْعًا وَالْأَلِفِ نَصْبًا وَالْيَاءِ جَرًّا.",
          en: "One of the five nouns — declined by the WAW in raf', the ALIF in nasb and the YA in jarr.",
          tr: "Esmâ-i hamseden — ref'te vâv, nasbda elif, cerde yâ ile i'râb alır." });
    // -- dual and sound plurals: letters again
    if (/[َا]نِ$/.test(w) || /َيْنِ$/.test(w))
      return R("huruf", "lafzi", /َيْنِ$/.test(w) ? ["mansub", "majrur"] : ["marfu"],
        { ar: "مُثَنًّى — يُعْرَبُ بِالْأَلِفِ رَفْعًا وَبِالْيَاءِ نَصْبًا وَجَرًّا.",
          en: "A dual — the alif shows raf', the ya shows nasb and jarr.",
          tr: "Tesniye — elif ref'i, yâ nasb ve cerri gösterir." });
    if (/ُونَ$/.test(w)) return R("huruf", "lafzi", ["marfu"],
      { ar: "جَمْعُ مُذَكَّرٍ سَالِمٌ — الْوَاوُ عَلَامَةُ رَفْعِهِ.",
        en: "A sound masculine plural — the waw is its sign of raf'.",
        tr: "Cem'-i müzekker-i sâlim — vâv ref alâmetidir." });
    if (/ِينَ$/.test(w)) return R("huruf", "lafzi", ["mansub", "majrur"],
      { ar: "جَمْعُ مُذَكَّرٍ سَالِمٌ — الْيَاءُ عَلَامَةُ نَصْبِهِ وَجَرِّهِ.",
        en: "A sound masculine plural — the ya is its sign of nasb and jarr.",
        tr: "Cem'-i müzekker-i sâlim — yâ nasb ve cer alâmetidir." });
    // -- the maqsur: an alif that CANNOT carry a vowel, so all three cases
    // are estimated on it. The most famous taqdiri case in the books.
    if (/[ىا]$/.test(bare) && bare.length > 2)
      return R("haraka", "taqdiri", ["marfu", "mansub", "majrur"],
        { ar: "اِسْمٌ مَقْصُورٌ — تُقَدَّرُ عَلَى أَلِفِهِ الْحَرَكَاتُ الثَّلَاثُ لِلتَّعَذُّرِ.",
          en: "A maqsur noun — all three vowels are ESTIMATED on its alif, which cannot bear them (ta'adhdhur).",
          tr: "İsm-i maksûr — üç hareke de elifi üzerinde TAKDÎR edilir; elif onları taşıyamaz (teazzür)." });
    // -- the manqus, but ONLY where its ya is on the page. Indefinite قَاضٍ
    // is spelled like any other indefinite majrur, so the surface cannot
    // decide it and the engine must not pretend otherwise.
    if (/^ال/.test(flat) && /ِي$/.test(w) && !/ِيّ$/.test(w) && flat.length > 4)
      return R("haraka", "taqdiri", ["marfu", "majrur"],
        { ar: "اِسْمٌ مَنْقُوصٌ — تُقَدَّرُ الضَّمَّةُ وَالْكَسْرَةُ عَلَى يَائِهِ لِلثِّقَلِ، وَتَظْهَرُ الْفَتْحَةُ.",
          en: "A manqus noun — damma and kasra are estimated on its ya as too heavy; only the fatha appears.",
          tr: "İsm-i menkūs — damme ve kesra yâsı üzerinde ağırlık sebebiyle takdîr edilir; yalnız fetha zâhir olur." });
    // -- the plain written vowel: lafzi, and CASE_SIGN already names it
    const sign = caseSignOf(w);
    if (sign && ["damma", "fatha", "kasra"].includes(sign.en))
      return R("haraka", "lafzi", sign.cases,
        { ar: `إِعْرَابٌ لَفْظِيٌّ بِالْحَرَكَةِ — ${sign.ar} ظَاهِرَةٌ فِي آخِرِهِ.`,
          en: `A plainly written vowel — the ${sign.en} stands visible on its last letter.`,
          tr: `Lafzî i'râb — ${sign.tr} son harfte açıkça görünür.` });
    if (sign && sign.en === "sukun")
      return R("hadhf", "lafzi", ["majzum"],
        { ar: "الْجَزْمُ بِالسُّكُونِ — وَهُوَ إِعْرَابٌ بِالْحَذْفِ فِي حَقِيقَتِهِ: حُذِفَتِ الْحَرَكَةُ.",
          en: "Jazm by the sukun — at bottom an i'rab BY REMOVAL: the vowel was taken away.",
          tr: "Sükûnla cezm — hakikatte HAZİFLE i'râbdır: hareke kaldırılmıştır." });
    return null;
  }
}

// ---------- النداء: the vocative, computed from the letters --------------
// Of all the nahw chapters the vocative is the most mechanical. Strip the
// particle and the RULING follows from the shape of what is left, so nothing
// here is stored: the engine reads a call and computes the kind, the sign and
// the reason, and where the conditions are met it also derives the tarkhim
// and the nadb letter by letter. Kafiya, Qatr al-Nada and the Izhar agree on
// the five kinds and on the principle that the two MABNI kinds are «mabni on
// what they would be RAISED by» — which is why a dual munada is fixed on the
// ALIF and a sound plural on the WAW, not on the damma.
//
// The engine reads the SIGN, never the meaning. That is deliberate: يَا زَيْدُ
// and يَا رَجُلُ are the same shape and take the same ruling, so the engine
// names the kind «مُفْرَدٌ عَلَمٌ أَوْ نَكِرَةٌ مَقْصُودَةٌ» and stops there.
// Where the surface cannot decide at all — an unvowelled call, or a mansub
// word that could be نكرة غير مقصودة or شبيه بالمضاف — it says so and names
// the test instead of guessing.

             ar: "مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ فَتْحَةٌ مُقَدَّرَةٌ قَبْلَ يَاءِ الْمُتَكَلِّمِ",

  };
  static flat(s){
    return stripAr((s || "").normalize("NFC")).replace(/[أإآ]/g, "ا").replace(/ى/g, "ي")
      .replace(/[^ء-ي]/g, "");
  }
  // What the last letter of a munada actually shows. Tanwin is kept apart from
  // the plain vowel here — the whole chapter turns on that difference.
  static ending(word){
    const s = (word || "").normalize("NFC").replace(/[«»،.:!؟\s]/g, "");
    if (/َانِ$/.test(s)) return "alif";
    if (/َيْنِ$/.test(s)) return "yaDual";
    if (/ُونَ$/.test(s)) return "waw";
    if (/ِينَ$/.test(s)) return "yaPlural";
    if (/ِي$/.test(s)) return "mutakallim";
    const marks = [...s].filter(c => "ًٌٍَُِْ".includes(c));
    return { "ُ": "damma", "ٌ": "dammatan", "َ": "fatha", "ً": "fathatan",
             "ِ": "kasra", "ٍ": "kasratan", "ْ": "sukun" }[marks[marks.length - 1]] || "none";
  }
  static read(text){
    const raw = (text || "").normalize("NFC").replace(/[.,،!؟:؛«»]/g, " ").trim();
    const words = raw.split(/\s+/).filter(Boolean);
    if (!words.length) return null;
    const N = o => ({ ok: true, ...o, kindLabel: this.KIND[o.kind], signLabel: this.SIGN[o.sign] });
    if (this.flat(words[0]) === "اللهم")
      return N({ particle: null, munada: words[0], kind: "lahumma", ruling: "mabni",
                 sign: "damma", tail: words.slice(1).join(" ") });
    const P = this.PARTICLES.find(p => p.flat === this.flat(words[0]));
    if (!P) return { ok: false, reason: "particle" };
    const rest = words.slice(1);
    if (!rest.length) return { ok: false, reason: "empty", particle: P };
    const w0 = rest[0], f0 = this.flat(w0), tail = rest.slice(1).join(" ");
    if (P.dist === "nadb")
      return N({ particle: P, munada: w0, kind: "nadb", ruling: "mabni", sign: "damma", tail });
    if (f0 === "ايها" || f0 === "ايتها")
      return N({ particle: P, munada: w0, kind: "ayyuha", ruling: "mabni", sign: "damma",
                 tabi: rest[1] || null, tail });
    if (/^لَ/.test(w0) && f0.length > 2)
      return N({ particle: P, munada: w0, kind: "istighatha", ruling: "majrur", sign: "kasra", tail });
    // يا never sits straight before الـ. The exception the books make is the
    // Name itself: يَا اللهُ is heard, and يَا أَيُّهَا is the way in for the rest.
    if (/^ال/.test(f0) && f0 !== "الله" && f0.length > 3)
      return { ok: false, reason: "alAfterYa", particle: P, munada: w0,
               fix: "أَيُّهَا " + w0 };
    const e = this.ending(w0), hasTail = rest.length > 1;
    if (e === "dammatan")
      return { ok: false, reason: "tanwin", particle: P, munada: w0,
               fix: w0.replace(/ٌ$/, "ُ") };
    if (e === "fathatan")
      return N({ particle: P, munada: w0, kind: hasTail ? "nakiraOrShibh" : "nakira",
                 ruling: "mansub", sign: "fathatan", ambiguous: hasTail, tail });
    if (e === "fatha")
      return N({ particle: P, munada: w0, kind: "mudaf", ruling: "mansub", sign: "fatha",
                 mudafIlayh: rest[1] || null, warn: hasTail ? null : "noMudafIlayh", tail });
    if (e === "yaDual" || e === "yaPlural")
      return N({ particle: P, munada: w0, kind: "mudaf", ruling: "mansub", sign: e,
                 mudafIlayh: rest[1] || null, tail });
    if (e === "mutakallim")
      return N({ particle: P, munada: w0, kind: "mudaf", ruling: "mansub",
                 sign: "fathaTaqdiri", mudafIlayh: "ي", tail });
    if (e === "damma" || e === "alif" || e === "waw")
      return N({ particle: P, munada: w0, kind: "mufrad", ruling: "mabni",
                 sign: e === "damma" ? "damma" : e, tail });
    return { ok: false, reason: "unvowelled", particle: P, munada: w0 };
  }
  // TARKHIM — lop the last letter off a called name. Two conditions license
  // it: a final ta marbuta (which licenses it even for three letters and even
  // when the word is no proper name), or a proper name of MORE than three
  // letters. Where a zaid madda is left exposed with three sound letters
  // before it, that goes too: عُثْمَان → عُثْمَ، مَنْصُور → مَنْصُ.
  static tarkhim(name){
    const w = (name || "").normalize("NFC").replace(/[«»،.:!؟\s]/g, "");
    const bare = stripAr(w).replace(/[^ء-يٱ]/g, "");
    if (bare.length < 3) return { ok: false, reason: "short", word: w };
    const ta = /ة$/.test(bare);
    if (!ta && bare.length < 4) return { ok: false, reason: "three", word: w };
    const strip = s => s.replace(new RegExp("[" + this.MARKS + "]+$"), "");
    let stem = strip(w);
    if (!stem) return { ok: false, reason: "short", word: w };
    const dropped = [stem.slice(-1)];
    // NOT stripped again: what is left keeps the vowel it was already wearing,
    // and that vowel is the whole difference between the two dialects below.
    stem = stem.slice(0, -1);
    // a long vowel now left bare at the end, with three letters still standing
    // before it, is itself zaid and falls with the letter it was carrying
    const left = stripAr(stem).replace(/[^ء-يٱ]/g, "");
    if (/[اوي]$/.test(stem) && left.length >= 4) {
      dropped.push(stem.slice(-1));
      stem = stem.slice(0, -1);
    }
    if (!stripAr(stem).replace(/[^ء-يٱ]/g, "")) return { ok: false, reason: "short", word: w };
    // «he who awaits» leaves the remainder exactly as it stood, as though the
    // dropped letter were still coming; «he who does not» treats what is left
    // as a munada mufrad in its own right, and builds it on the damma.
    const muntazir = stem;
    // Take the short vowel off the end but LEAVE the shadda standing — a
    // shadda is two letters, not a vowel, and it survives into the new form.
    const marks = stem.match(/[ً-ْ]*$/)[0];
    const head = stem.slice(0, stem.length - marks.length);
    const keep = marks.replace(/[ًٌٍَُِ]/g, "");
    const ghayr = /[اويٱ]$/.test(head + keep) ? stem : head + keep + "ُ";
    return { ok: true, word: w, licensed: true, byTa: ta, dropped,
             muntazir, ghayrMuntazir: ghayr, same: muntazir === ghayr,
             needsAlam: !ta };
  }
  // NADB — the lament. The alif of grief and the ha of pause are simply hung
  // on the end; a ta marbuta opens back into a plain ta before them.
  static nadb(name){
    const w = (name || "").normalize("NFC").replace(/[«»،.:!؟\s]/g, "");
    let stem = w.replace(new RegExp("[" + this.MARKS + "]+$"), "");
    if (!stem) return null;
    if (/ة$/.test(stem)) stem = stem.slice(0, -1) + "ت";
    return { call: "وَا " + stem + "َاهْ", stem };
  }
}

// ---------- deck (FSRS scheduling) ----------
// FSRS-4.5 — the open spaced-repetition memory model whose seventeen weights
// were machine-learned from hundreds of millions of real reviews (the
// open-spaced-repetition project). Each card carries a memory state: S,
// stability — the days until recall odds decay to 90% — and D, difficulty on
// a 1–10 scale. Retrievability at the moment of review feeds every update, so
// a card recalled long after it was due earns a far longer next interval than
// one recalled early; SM-2's ease factor cannot see elapsed time at all.
// Desired retention is 0.9, and the factor 19/81 is chosen so that R(S, S)
// is exactly 0.9 — which makes the next interval simply the stability.
const DAY = 86400000;
const MIN_EASE = 1.3, START_EASE = 2.5, LEECH_AT = 8;
const FSRS_W = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975,
                0.0310, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246,
                1.5870, 0.2272, 2.8755];
const FSRS_Q = { again: 1, hard: 2, good: 3, easy: 4 };
function fsrsR(t, S){ return Math.pow(1 + (19 / 81) * (t / S), -0.5); }
// The interval that lets recall decay exactly to the learner's target: the
// true FSRS inversion I(r) = S·(81/19)·(r^-2 − 1). At r = 0.9 this is S
// itself; a 0.95 target reviews sooner, a 0.85 target stretches further.
function fsrsInterval(S){
  const r = state.retention || 0.9;
  return Math.max(1, Math.round(S * (81 / 19) * (Math.pow(r, -2) - 1)));
}
function fsrsD0(g){ return Math.min(10, Math.max(1, FSRS_W[4] - (g - 3) * FSRS_W[5])); }
// One review step: (memory state, grade) → next memory state. Pure — the
// preview buttons call it speculatively, grade() calls it for real. A card
// from the SM-2 era walks in with ease/ivl and no state; its interval seeds
// S (an interval it survived is a stability floor) and its lost ease seeds D.
function fsrsNext(s, g){
  let S = s.S, D = s.D;
  if (S === undefined && s.reps > 0 && s.ivl > 0) {
    S = s.ivl;
    D = Math.min(10, Math.max(1, 5 + (START_EASE - (s.ease || START_EASE)) * 3.5));
  }
  if (S === undefined) return { S: FSRS_W[g - 1], D: fsrsD0(g) };
  const elapsed = s.seen ? Math.max(0, (Date.now() - s.seen) / DAY) : s.ivl;
  const R = fsrsR(elapsed, Math.max(0.1, S));
  if (D === undefined) D = fsrsD0(3);
  const D2 = Math.min(10, Math.max(1,
    FSRS_W[7] * fsrsD0(4) + (1 - FSRS_W[7]) * (D - FSRS_W[6] * (g - 3))));
  if (g === 1) {
    const Sf = FSRS_W[11] * Math.pow(D2, -FSRS_W[12]) *
               (Math.pow(S + 1, FSRS_W[13]) - 1) * Math.exp(FSRS_W[14] * (1 - R));
    return { S: Math.min(S, Math.max(0.1, Sf)), D: D2 };
  }
  const S2 = S * (1 + Math.exp(FSRS_W[8]) * (11 - D2) * Math.pow(S, -FSRS_W[9]) *
                  (Math.exp(FSRS_W[10] * (1 - R)) - 1) *
                  (g === 2 ? FSRS_W[15] : 1) * (g === 4 ? FSRS_W[16] : 1));
  return { S: Math.max(0.1, S2), D: D2 };
}
function ensureSrs(c){
  if (!c.srs) c.srs = { due: 0, ivl: 0 };
  const s = c.srs;
  if (s.ease === undefined) s.ease = START_EASE;
  if (s.reps === undefined) s.reps = s.ivl ? 2 : 0;   // migrate older decks
  if (s.lapses === undefined) s.lapses = 0;
  return c;
}
function isLeech(c){ return ensureSrs(c).srs.lapses >= LEECH_AT; }

// ---------- the daily loop ----------
// Local date, not UTC: a streak is about the learner's day, and midnight in
// Istanbul is not midnight in London.
function todayKey(d){
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
       + "-" + String(d.getDate()).padStart(2, "0");
}
function rollDay(){
  const k = todayKey();
  if (state.today.date !== k) {
    state.today = { date: k, reviewed: 0, learned: 0, read: 0 };
    localStorage.setItem("qissa-today", JSON.stringify(state.today));
  }
  return state.today;
}
// Called on any act of study. A day already counted does nothing; yesterday
// extends the streak; anything older starts a new one.
// The shield's calendar: one mercy per local week. Approximate week numbering
// is fine — the shield is a kindness, not an accounting system.
function weekKey(){
  const d = new Date();
  const jan1 = new Date(d.getFullYear(), 0, 1);
  return d.getFullYear() + "-" + Math.floor(((d - jan1) / 86400000 + jan1.getDay()) / 7);
}
function countActivity(kind){
  const t = rollDay();
  t[kind] = (t[kind] || 0) + 1;
  localStorage.setItem("qissa-today", JSON.stringify(t));
  const k = todayKey();
  if (state.streak.last !== k) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    const y2 = new Date(); y2.setDate(y2.getDate() - 2);
    let days = 1, shieldWeek = state.streak.shieldWeek;
    if (state.streak.last === todayKey(y)) {
      days = state.streak.days + 1;
    } else if (state.streak.last === todayKey(y2) && shieldWeek !== weekKey()) {
      // The mercy day: ONE missed day a week does not burn the chain — the
      // shield does. Breaking a long streak over a single bad day is the
      // sharpest quit-moment the habit apps know; forgiveness, rationed to
      // once a week, keeps the chain honest without making it brittle.
      days = state.streak.days + 1;
      shieldWeek = weekKey();
      showToast(ui().mercyUsed);
    }
    state.streak = { days, last: k, ...(shieldWeek ? { shieldWeek } : {}) };
    localStorage.setItem("qissa-streak", JSON.stringify(state.streak));
  }
  updateStreakChip();   // the percentage moves on every act, not only the first
}
function goalPct(){
  const t = rollDay();
  const r = Math.min(1, state.goal.reviews ? t.reviewed / state.goal.reviews : 1);
  const n = Math.min(1, state.goal.newWords ? t.learned / state.goal.newWords : 1);
  return Math.round(((r + n) / 2) * 100);
}
function updateStreakChip(){
  const el = document.getElementById("streakChip");
  if (!el) return;
  rollDay();
  const pct = goalPct();
  el.hidden = state.streak.days === 0 && pct === 0;
  el.textContent = "\u{1F525} " + state.streak.days + " \u00b7 " + pct + "%";
  el.title = ui().streakTitle.replace("{d}", state.streak.days)
    .replace("{r}", state.today.reviewed).replace("{R}", state.goal.reviews)
    .replace("{n}", state.today.learned).replace("{N}", state.goal.newWords);
}

// The words of the chapter you are reading, in level order, that are not in the
// deck yet — so "learn N new today" is a button and not a chore.
function newWordsHere(limit){
  if (!CUR) return [];
  const have = new Set(state.deck.filter(d => d.type === "word").map(d => d.lex));
  const out = [], seen = new Set();
  SENTENCE_FLAT.forEach(({ sen }) => sen.tokens.forEach(tok => {
    const e = GLOSSARY[tok.lex];
    if (!e || !e.level || e.level < 1) return;      // skip proper nouns
    if (have.has(tok.lex) || seen.has(tok.lex)) return;
    seen.add(tok.lex);
    out.push({ tok, entry: e });
  }));
  out.sort((a, b) => a.entry.level - b.entry.level);
  return limit ? out.slice(0, limit) : out;
}
function editGoal(){
  const r = prompt(ui().goalAskReviews, state.goal.reviews);
  if (r === null) return;
  const n = prompt(ui().goalAskNew, state.goal.newWords);
  if (n === null) return;
  state.goal = { reviews: Math.max(0, parseInt(r, 10) || 0),
                 newWords: Math.max(0, parseInt(n, 10) || 0) };
  localStorage.setItem("qissa-goal", JSON.stringify(state.goal));
  updateStreakChip();
  renderDeck();
}
function learnNewHere(){
  const left = Math.max(0, state.goal.newWords - rollDay().learned);
  const picks = newWordsHere(left || state.goal.newWords);
  // toggleCard refuses past the Lite cap — only words that actually went in
  // may count toward the daily goal.
  picks.forEach(({ tok }) => { if (toggleSave(tok)) countActivity("learned"); });
  renderDeck();
}
// The on-device difficulty model. Every review already logs lapses and moves
// ease; this folds both into one score so the queue serves the STRUGGLING
// cards first, while attention is fresh — a card failed four times outranks a
// merely young one. Two points per lapse, one per notch of lost ease.
function struggleScore(c){
  const s = ensureSrs(c).srs;
  // FSRS difficulty when the card has memory state, lost SM-2 ease before its
  // first FSRS review — both map struggle onto the same 0..3 band.
  const hard = s.D !== undefined ? Math.max(0, (s.D - 5) * 0.6)
                                 : Math.max(0, (2.5 - (s.ease || 2.5)) * 2.5);
  return (s.lapses || 0) * 2 + hard;
}
function dueCards(){
  const now = Date.now();
  return state.deck.filter(c => ensureSrs(c).srs.due <= now)
    .sort((a, b) => struggleScore(b) - struggleScore(a) ||
                    ensureSrs(a).srs.due - ensureSrs(b).srs.due);
}
// The memory model reaches into the games: word cards whose retrievability
// has sunk lowest — the ones FSRS says are quietly fading — sorted worst
// first. Only cards with real memory state qualify; a card still above 95%
// is not fading, it is fine.
function fadingWords(n){
  const now = Date.now();
  return state.deck

const LITE_DECK_CAP = 100;

function cardKey(c){

function toggleCard(key, make){

function toggleSave(tok, ctx){

function fmtDue(c){

  s.S = +next.S.toFixed(4); s.D = +next.D.toFixed(4);
  s.seen = Date.now();

  if (q === "again") {

  } else {                               // lapse stability then sets the ivl

// A verb card asks for cells of the Muhtelife; a word card asks for a meaning.
// A round asks SEVERAL cells, not one: recalling a single form lets the reader
// pattern-match around it, three spread across the table demand the paradigm —
// the way the müderris asks «ism-i fâili? meçhûl muzârisi? emri?» in one
// breath. Deterministic per round so the reveal shows the same set that was
// asked, and a different set comes up next round.
const VERB_DRILL_QS = 3;
function verbPrompt(card){
  const m = MORPH[card.lex];
  if (!m) return null;
  const rows = muhtelife(m);
  if (!rows) return null;
  const base = ensureSrs(card).srs.reps + (card.pick || 0);
  const n = Math.min(VERB_DRILL_QS, rows.length);
  // A stride of len/n keeps the picks spread over the whole table AND distinct
  // (i·step stays below len for i < n), instead of three neighbouring sigha.
  const step = Math.max(1, Math.floor(rows.length / n));
  const qs = [];
  for (let i = 0; i < n; i++) {
    const row = rows[(base + i * step) % rows.length];
    qs.push({ label: state.uiLang === "tr" ? row.tr : row.en, answer: row.ar });
  }
  return { qs, lemma: m.mazi[0] };
}

    b.addEventListener("click", () => { deckFilter = b.dataset.df; renderDeck(); }));
  sheetInner.querySelectorAll(".retention-seg [data-ret]").forEach(b =>
    b.addEventListener("click", () => {

    }));

    b.addEventListener("click", () => {

// ---------- games ----------
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// ---------- game: the vocative ----------
// Every item is a real call out of the corpus, and the right answer is not
// stored anywhere — NidaEngine derives it from the letters at play time. If
// the engine and the story's own i'rab ever disagreed, the smoke suite would
// fail before this game could show a wrong answer.
function nidaItems(){
  const out = [];
  // corpus-wide, not just the open story: calls are scarce, and the chapter
  // is worth drilling wherever the learner happens to be reading.
  STORIES.forEach(st => (st.chapters || []).forEach(ch => ch.sentences.forEach(sen => sen.tokens.forEach((t, ti) => {
    const f = NidaEngine.flat(t.s.full);
    if (!NidaEngine.PARTICLES.some(p => p.flat === f && f.length > 1)) return;
    const m = sen.tokens[ti + 1];
    if (!m) return;
    const call = [t, m, sen.tokens[ti + 2]].filter(Boolean).map(x => x.s.full).join(" ");
    const v = NidaEngine.read(call);
    if (!v || !v.ok || !v.signLabel) return;
    out.push({ sen, ti, mi: ti + 1, call, v, irab: m.irab });
  }))));
  return out;
}
const NIDA_DISTRACTORS = ["damma", "fatha", "fathatan", "fathaTaqdiri", "alif", "waw"];
function nidaWhyNot(it, picked){
  const tr = state.uiLang === "tr";
  const right = it.v.sign, got = picked.sign;
  const isMabni = k => ["damma", "alif", "waw"].includes(k);
  if (isMabni(right) && !isMabni(got))
    return tr ? "Bu münâdâ tek kelimelik bir marifedir: MEBNÎDİR, nasbı yalnız mahallîdir. Gerçek nasb ancak muzâfa, ona benzeyene ve nekire-i gayr-i maksûdeye aittir."
              : "This munada is a single definite call: it is FIXED, and its nasb is only positional. A real nasb belongs to the mudaf, its lookalike, and the unmeant indefinite alone.";
  if (!isMabni(right) && isMabni(got))
    return tr ? `«${it.v.munada}» kendinden sonrakine bağlıdır — muzâftır; muzâf mebnî olmaz, LAFZEN mansub olur.`
              : `«${it.v.munada}» leans on what follows it — it is a mudaf, and a mudaf is never fixed: it takes a REAL nasb.`;
  if (isMabni(right) && isMabni(got))
    return tr ? "Mebnî olduğu doğru; fakat münâdâ KENDİSİYLE MERFÛ OLACAĞI ŞEY üzere mebnîdir. Bu kelime tesniye yahut cem'-i müzekker-i sâlim değildir, öyleyse damme üzeredir."
              : "Fixed — that much is right; but a munada is fixed on WHAT WOULD RAISE IT. This word is no dual and no sound plural, so that is the damma.";
  if (got === "fathatan" && right !== "fathatan")
    return tr ? "Tenvin yalnız nekire-i gayr-i maksûdede kalır. Bu münâdâ ya muzâftır ya marifedir; her ikisinde de tenvin yoktur."
              : "The tanwin stays only on an indefinite meant of no one in particular. This munada is either a mudaf or definite — neither keeps it.";
  return tr ? "Alâmet, kelimenin son harfinin gösterdiği şey değildir."
            : "That is not the sign the last letter of this word is showing.";
}
function startNida(){
  const items = shuffle(nidaItems()).slice(0, 8);
  if (!items.length) { openGames(); return; }
  runQuiz({
    title: ui().nidaGame, ask: ui().nidaAsk, items, restart: startNida,
    area: "nahw", lvl: it => it.v.ruling === "mabni" ? 3 : 4, itemKey: it => "nida#" + it.v.munada,
    question: it => `<div class="game-q"><div class="nida-call" lang="ar">${

        ? `<span class="mn">${t.s.full}</span>` : t.s.full).join(" ")}</div></div>`,
    options: it => {
      const K = NidaEngine.SIGN;
      const wrong = shuffle(NIDA_DISTRACTORS.filter(k => k !== it.v.sign)).slice(0, 3);
      return shuffle([it.v.sign, ...wrong].map(k => ({
        html: K[k].short.ar + ` <span style="opacity:.6;font-size:.85em">${T(K[k].short)}</span>`,
        ar: true, ok: k === it.v.sign, sign: k })));
    },
    whyNot: nidaWhyNot,
    why: it => `<span lang="ar" style="font-family:var(--ar-font);font-size:1.2em">${
      it.v.kindLabel.ar} — ${it.v.signLabel.ar}</span><br>${T(it.v.kindLabel)} · ${T(it.v.signLabel)}` +
      (it.irab ? `<div class="game-why" style="margin-top:.4rem">${irabWhy(it.irab)}</div>` : ""),
  });
}

let M = null;
const matchable = ([k, e]) => e.level > 0 && e.gloss && e.lemma.length > 1;
function startMatch(){
  // Fading deck words take the seats first; random corpus words fill the rest.
  const seeded = fadingWords(3).map(f => [f.lex, GLOSSARY[f.lex]]).filter(matchable);
  const rest = shuffle(Object.entries(GLOSSARY).filter(p =>
    matchable(p) && !seeded.some(([sk]) => sk === p[0]))).slice(0, 6 - seeded.length);
  const pool = shuffle([...seeded, ...rest]);
  const cards = shuffle(pool.flatMap(([k, e], i) => [
    {pair: i, kind: "ar", label: e.lemma},
    {pair: i, kind: "gl", label: (state.uiLang === "tr" && e.gloss.tr) ? e.gloss.tr : e.gloss.en}
  ]));
  M = {cards, first: null, found: 0, moves: 0, start: Date.now(), total: pool.length,
       fading: seeded.length};
  renderMatch();
}
function renderMatch(){
  let html = `<div class="backrow"><button id="gBack">${ui().back2}</button></div>
    <div class="tabs"><button class="on">${ui().match}</button></div>
    ${M.fading ? `<div class="fade-note">\u{1F9E0} ${ui().fadingNote.replace("{n}", M.fading)}</div>` : ""}
    <div class="match-grid">` + M.cards.map((c, i) =>
      `<button class="${c.kind === "ar" ? "ar" : ""} ${c.matched ? "matched" : ""} ${M.first === i ? "sel" : ""}" data-i="${i}" ${c.kind === "ar" ? 'lang="ar"' : ""}>${c.label}</button>`).join("") + `</div>
    <div class="game-meta"><span>${ui().moves}: ${M.moves}</span></div><div id="mDone"></div>`;
  sheetInner.innerHTML = html;
  document.getElementById("gBack").addEventListener("click", openGames);
  sheetInner.querySelectorAll(".match-grid [data-i]").forEach(b =>
    b.addEventListener("click", () => pickMatch(+b.dataset.i)));
  if (M.found === M.total) {
    const secs = Math.round((Date.now() - M.start) / 1000);
    document.getElementById("mDone").innerHTML =
      `<div class="game-why">${ui().matchDone} ${M.moves} ${ui().moves.toLowerCase()}, ${secs}s.</div>
       <div class="sheet-actions"><button class="btn primary" id="replayM">${ui().replay}</button></div>`;
    document.getElementById("replayM").addEventListener("click", startMatch);
  }
}
function pickMatch(i){
  const c = M.cards[i];
  if (c.matched) return;
  if (M.first === null) { M.first = i; renderMatch(); return; }
  if (M.first === i) { M.first = null; renderMatch(); return; }
  M.moves++;
  const f = M.cards[M.first];
  if (f.pair === c.pair && f.kind !== c.kind) { f.matched = c.matched = true; M.found++; }
  M.first = null;
  renderMatch();
}

// Short vowels (fatha/damma/kasra/sukun) plus tanwin (fathatan/dammatan/kasratan) \u2014
// the endings a harakat drill can test. TANWIN_SET is a subset used to keep
// distractors grammatically plausible (tanwin never belongs on a definite noun).
const HARAKAT_SET = ["\u064E", "\u064F", "\u0650", "\u0652", "\u064B", "\u064C", "\u064D"].map(s => JSON.parse('"' + s + '"'));
const TANWIN_SET = ["\u064B", "\u064C", "\u064D"].map(s => JSON.parse('"' + s + '"'));
function harakatItems(){
  const items = [];
  CHAPTERS.forEach(ch => ch.sentences.forEach(sen => sen.tokens.forEach((t, ti) => {
    const full = t.s.full;
    if (HARAKAT_SET.includes(full.slice(-1)) && t.irab && full.length > 3) {
      items.push({sen, ti, full, base: full.slice(0, -1), last: full.slice(-1), irab: t.irab});
    }
  })));
  return items;
}
function startHarakat(){
  const items = shuffle(harakatItems()).slice(0, 8);
  if (!items.length) { openGames(); return; }
  runQuiz({
    title: ui().harakat, ask: ui().chooseForm, items, restart: startHarakat,
    area: "vocab", lvl: it => (it.entry && it.entry.level) || 3,
    question: it => `<div class="game-q" lang="ar">${senWithSlot(it.sen, it.ti, () => "«ـــــ»")}</div>`,
    options: it => {
      // Definite (ال-prefixed) nouns never take tanwin — keep distractors
      // plausible by excluding tanwin marks for those bases. The correct mark
      // is excluded from the pool, so a distractor can never equal the answer.
      const definite = /^ال/.test(stripAr(it.base));
      const candidates = HARAKAT_SET.filter(x => x !== it.last && !(definite && TANWIN_SET.includes(x)));
      return shuffle([{ html: it.full, ok: true, ar: true },
        ...shuffle(candidates).slice(0, 2).map(x => ({ html: it.base + x, ok: false, ar: true }))]);
    },
    why: it => irabWhy(it.irab),
  });
}

// ---------- game: fill the gap (cloze) ----------
// The one drill that only works because the app knows what you have read: take
// a sentence you actually got through, remove a content word, and ask for it
// back. Recall in context, which no amount of isolated flashcards produces.
//
// Options are all lemmas — never a mix of the inflected answer and citation
// forms of the distractors, which would give the answer away by shape alone.
const CLOZE_POS = ["noun", "verb", "propn", "adv"];

// Candidate words are bucketed by part of speech ONCE per story. Filtering the
// whole glossary per candidate token instead made the walk cost
// tokens-read × glossary-size, so it got slower the more the reader had read —
// 50,000 pair visits over this corpus to keep the eight items a round uses.
// The two per-item exclusions are deferred to clozeRound, where they run for
// eight items rather than five hundred.
function glossaryByPos(st){
  if (!st._byPos) {
    const by = {};
    for (const [lex, g] of Object.entries(st.glossary)) {
      if (!g.lemma || !g.level || !g.pos) continue;
      (by[g.pos] = by[g.pos] || []).push({ lex, ...g });
    }
    st._byPos = by;
  }
  return st._byPos;
}
function clozeItems(){
  const items = [];
  STORIES.forEach(st => {
    const prog = state.progress[st.id] || {};
    const byPos = glossaryByPos(st);
    st.chapters.forEach(ch => ch.sentences.forEach(sen => {
      if (!prog[sen.id]) return;
      // Every lemma standing in this sentence is disqualified as a distractor:
      // it may well be a second correct answer.
      const present = new Set(sen.tokens.map(t => t.lex));
      sen.tokens.forEach((tok, ti) => {
        const e = st.glossary[tok.lex];
        if (!e || !e.level || !e.lemma) return;
        // Gate on the GLOSSARY's part of speech, not the token's. The two can
        // legitimately disagree — تَعَالَى is a verb in form but a formulaic
        // particle in the lexicon — and since the options are citation forms,
        // the lexical class is the one that has to govern both the admission
        // and the distractors. Mixing them let a verb be offered against three
        // particles, which gives the answer away by shape alone.
        if (!CLOZE_POS.includes(e.pos)) return;
        if (phraseAt(sen, ti)) return;                       // do not gut an idiom
        const bucket = byPos[e.pos] || [];
        // Cheap admission gate; the exact pool is cut in clozePool() below.
        if (bucket.length < 3) return;
        items.push({ storyId: st.id, sen, ti, tok, entry: e, bucket, present });
      });
    }));
  });
  return items;
}
// shuffle() is in-place, so this must return a fresh array — the bucket is
// shared by every item of the same part of speech in the story.
function clozePool(it){
  return it.bucket.filter(g => !it.present.has(g.lex) && g.lemma !== it.entry.lemma);
}
// Resolve pools only for the items a round will actually use, walking the
// shuffled candidates until enough of them turn out to be playable. Items
// that gap a FADING deck word walk first — the cloze becomes a rescue: the
// memory model names the words about to slip, and the round drills exactly
// those, in the sentences the learner already read them in.
function clozeRound(n){
  const fade = new Set(fadingWords(n).map(f => f.lex));
  const all = shuffle(clozeItems());
  // fading words keep their reserved seats; everyone else queues by closeness
  // to the learner's desirable-difficulty band (the Elo model's ~75% line).
  const rest = EloModel.rank(all.filter(it => !fade.has(it.tok.lex)), "vocab",
                             it => it.entry && it.entry.level);
  const walk = [...all.filter(it => fade.has(it.tok.lex)), ...rest];
  const out = [];
  for (const it of walk) {
    if (out.length >= n) break;
    const pool = clozePool(it);
    if (pool.length >= 2) out.push({ ...it, pool, fading: fade.has(it.tok.lex) });
  }
  return out;
}

// ---------- the numbers game — every round composed by the Aded engine ----------
// The distractors are the CLASSIC drill errors: polarity flipped, the wrong
// ma'dud shape (plural where the tamyiz must be singular, singular where the
// idafa wants the plural), the adjective-number set before its noun.
function adadGameItems(count){
  const pools = [
    () => 3 + Math.floor(Math.random() * 8),
    () => 11 + Math.floor(Math.random() * 9),
    () => 20 + Math.floor(Math.random() * 80),
    () => (1 + Math.floor(Math.random() * 9)) * 100,
    () => 1 + Math.floor(Math.random() * 2),
  ];
  const items = [];
  for (let i = 0; i < count; i++) {
    let n = pools[i % pools.length]();
    while (n > 2 && n % 100 > 0 && n % 100 < 3) n += 3;   // keep the crisp rules
    const noun = ADAD_NOUNS[Math.floor(Math.random() * ADAD_NOUNS.length)];
    const right = AdadEngine.phrase(n, noun);
    const wrongs = [];
    if (n === 1) {
      wrongs.push(noun.sg + " " + (noun.fem ? "وَاحِدٌ" : "وَاحِدَةٌ"));
      wrongs.push((noun.fem ? "وَاحِدَةٌ" : "وَاحِدٌ") + " " + noun.sg);
    } else if (n === 2) {
      wrongs.push(noun.du + " " + (noun.fem ? "اِثْنَانِ" : "اِثْنَتَانِ"));
      wrongs.push((noun.fem ? "اِثْنَتَانِ" : "اِثْنَانِ") + " " + noun.du);
    } else {
      const flip = AdadEngine.phrase(n, { ...noun, fem: !noun.fem }).text;
      if (flip !== right.text) wrongs.push(flip);
      if (right.rule === "u310") wrongs.push(right.text.replace(noun.plMajrur, noun.majrur));
      else if (right.rule === "teen" || right.rule === "ten") {
        if (noun.plMansub !== noun.mansub) wrongs.push(right.text.replace(noun.mansub, noun.plMansub));
        wrongs.push(right.text.replace(noun.mansub, noun.majrur));
      }
      else if (right.rule === "mia") {
        wrongs.push(right.text.replace(noun.majrur, noun.plMajrur));
        wrongs.push(right.text.replace(noun.majrur, noun.mansub));
      }
    }
    const distinct = [...new Set(wrongs)].filter(w => w !== right.text).slice(0, 2);
    if (distinct.length < 2) { i--; continue; }
    items.push({ n, noun, right, wrongs: distinct });
  }
  return items;
}
function startAdadGame(){
  runQuiz({
    title: ui().adadGame, ask: ui().adadAsk, items: adadGameItems(8), restart: startAdadGame,
    area: "adad", lvl: it => (it.n > 10 ? 4 : 2),
    question: it => `<div class="game-q adad-q"><b>${it.n}</b> × ${T(it.noun.gloss)}</div>`,
    options: it => shuffle([{ html: it.right.text, ok: true, ar: true },
      ...it.wrongs.map(w => ({ html: w, ok: false, ar: true }))]),
    why: it => `<span lang="ar" style="font-family:var(--ar-font);font-size:1.2em">${it.right.text}</span><br>${adadRuleText(it.right.rule)}`,
  });
}

function startCloze(){
  const items = clozeRound(8);
  if (!items.length) { emptyGame(ui().clozeGame, ui().clozeNeedsReading); return; }
  runQuiz({

      <div class="game-q" lang="ar">${senWithSlot(it.sen, it.ti, () => "«ـــــ»")}</div>`,
    options: it => shuffle([{ html: it.entry.lemma, ok: true, ar: true },
      ...shuffle(it.pool).slice(0, 3).map(g => ({ html: g.lemma, ok: false, ar: true }))]),
    why: it => `<span lang="ar" style="font-family:var(--ar-font);font-size:1.3em">${it.tok.s.full}</span>
         — ${T(it.entry.gloss)}
         ${it.tok.irab ? "<br>" + irabWhy(it.tok.irab) : ""}`,
    extras: [{ label: () => ui().seeInStory,
               // A read sentence can sit in a story that has since rotated back
               // behind the paywall; jumping there would land in the preview

  b.addEventListener("click", () => {
    state.layer = b.dataset.layer;
    localStorage.setItem("qissa-layer", state.layer);
    document.querySelectorAll(".controls .seg [data-layer]").forEach(x => x.classList.toggle("on", x === b));
    renderStory();
  }));
document.getElementById("ulToggle").addEventListener("click", e => {
  state.underlines = !state.underlines;
  e.currentTarget.classList.toggle("on", state.underlines);
  e.currentTarget.setAttribute("aria-pressed", state.underlines);
  storyEl.classList.toggle("underlines", state.underlines);
});
document.querySelectorAll("#modeSeg [data-mode]").forEach(b =>
  b.addEventListener("click", () => {
    setMode(b.dataset.mode);
    renderStory();
  }));
document.getElementById("playAll").addEventListener("click", () => {
  if (playAllActive) stopPlayAll(); else startPlayAll();
});
document.querySelectorAll("#speedSeg [data-rate]").forEach(b =>
  b.addEventListener("click", () => {
    state.rate = parseFloat(b.dataset.rate) || 1;
    localStorage.setItem("qissa-rate", state.rate);
    document.querySelectorAll("#speedSeg [data-rate]").forEach(x => x.classList.toggle("on", x === b));
  }));
document.querySelectorAll("#uiLangSeg [data-ui]").forEach(b =>
  b.addEventListener("click", () => {
    state.uiLang = b.dataset.ui;
    localStorage.setItem("qissa-lang", state.uiLang);
    document.querySelectorAll("#uiLangSeg [data-ui]").forEach(x => x.classList.toggle("on", x === b));
    renderModeSeg();   // the mode labels are localized too
    document.getElementById("refOpen").textContent = ui().grammarBtn;
document.getElementById("conjOpen").textContent = ui().conjBtn;
    document.getElementById("gamesOpen").textContent = ui().games;
    document.getElementById("searchOpen").textContent = ui().searchBtn;
    document.getElementById("statsOpen").textContent = ui().statsBtn;
    updateStreakChip();
    document.getElementById("deckOpen").childNodes[0].textContent = ui().deck + " ";
    renderLegend();
    updatePlayAllBtn();
    closeSheet();
    if (CUR) openStory(CUR); else renderLibrary();
  }));
document.getElementById("fontPlus").addEventListener("click", () => { state.arSize = Math.min(2.6, state.arSize + 0.15); localStorage.setItem("qissa-arsize", state.arSize); renderStory(); });
document.getElementById("fontMinus").addEventListener("click", () => { state.arSize = Math.max(1.2, state.arSize - 0.15); localStorage.setItem("qissa-arsize", state.arSize); renderStory(); });
document.getElementById("deckOpen").addEventListener("click", openDeck);
document.getElementById("statsOpen").addEventListener("click", openStats);
// The streak chip is the same numbers seen smaller — tapping it opens the page.
document.getElementById("streakChip").addEventListener("click", openStats);
document.getElementById("refOpen").addEventListener("click", () => openRef());
document.getElementById("conjOpen").addEventListener("click", openConjugator);
document.getElementById("gamesOpen").addEventListener("click", openGames);
document.getElementById("searchOpen").addEventListener("click", () => openSearch(searchQuery));

// ---------- the thumb bar ----------
// It owns no behaviour. Each destination DELEGATES to the toolbar button that
// already implements it, so there is one implementation per destination and
// the two navigations can never disagree. The active item is derived at paint
// time from what is actually on screen — no stored "current tab" to go stale.
const TAB_NAV = {
  library:  () => { if (CUR) renderLibrary(); else { closeSheet(); window.scrollTo({ top: 0, behavior: "smooth" }); } },
  deck:     () => openDeck(),
  games:    () => { if (!CUR) { renderLibrary(); return; } openGames(); },
  atolye:   () => openConjugator(),
  progress: () => openStats(),
};
function syncTabbar(){
  const bar = document.getElementById("tabbar");
  if (!bar) return;
  const inLib = !CUR;
  bar.querySelectorAll("[data-nav]").forEach(b => {
    const k = b.dataset.nav;
    b.classList.toggle("on", k === "library" && inLib);
    // Games need an open story; say so by dimming rather than by failing.
    if (k === "games") b.disabled = inLib;
    b.style.opacity = (k === "games" && inLib) ? ".4" : "";
    const lbl = b.querySelector(".tb-l");
    if (lbl) lbl.textContent = ui()["nav_" + k];
    b.setAttribute("aria-label", ui()["nav_" + k]);
  });
  const n = dueCards().length, badge = document.getElementById("navDeckCount");
  if (badge) { badge.hidden = !n; badge.textContent = n > 99 ? "99+" : String(n); }
}
document.querySelectorAll("#tabbar [data-nav]").forEach(b =>
  b.addEventListener("click", () => { const f = TAB_NAV[b.dataset.nav]; if (f) f(); syncTabbar(); }));
// The bar repaints whenever the view or the deck can have changed. Rather than
// hunt every call site, wrap the two functions that DEFINE which view is open
// and the one that changes the due count — anything else that matters goes
// through one of these three.
["renderLibrary", "openStory", "grade"].forEach(fn => {
  const orig = window[fn];
  if (typeof orig !== "function") return;
  window[fn] = function(...a){ const r = orig.apply(this, a); try { syncTabbar(); } catch (e) {} return r; };
});
syncTabbar();

document.querySelectorAll("#uiLangSeg [data-ui]").forEach(x => x.classList.toggle("on", x.dataset.ui === state.uiLang));
renderModeSeg();
document.querySelectorAll("#speedSeg [data-rate]").forEach(x => x.classList.toggle("on", parseFloat(x.dataset.rate) === state.rate));
document.querySelectorAll(".controls .seg [data-layer]").forEach(x => x.classList.toggle("on", x.dataset.layer === state.layer));
document.getElementById("refOpen").textContent = ui().grammarBtn;
document.getElementById("conjOpen").textContent = ui().conjBtn;
document.getElementById("gamesOpen").textContent = ui().games;
    document.getElementById("searchOpen").textContent = ui().searchBtn;
    document.getElementById("statsOpen").textContent = ui().statsBtn;
    updateStreakChip();
document.getElementById("deckOpen").childNodes[0].textContent = ui().deck + " ";
renderLegend();
updatePlayAllBtn();
document.getElementById("backLib").addEventListener("click", renderLibrary);
document.getElementById("roleToggle").addEventListener("click", () => {
  state.roles = !state.roles;
  localStorage.setItem("qissa-roles", state.roles ? "1" : "0");
  updateRoleMode();
});
updateRoleMode();
// Focus mode: while the reader scrolls DOWN through a story the header slides
// away and the text owns the screen; a nudge upward — or nearing the top —
// brings the controls back. Library mode never hides (the CSS scopes it out).
// theme: auto follows the OS; light/dark pin it. The attribute lives on
// <html> so the override outranks the media query.
function applyTheme(){
  if (state.theme === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = state.theme;
  const b = document.getElementById("themeToggle");
  if (b) b.textContent = state.theme === "auto" ? "\u25d0" : state.theme === "light" ? "\u2600" : "\u263e";
}
document.getElementById("themeToggle").addEventListener("click", () => {
  state.theme = state.theme === "auto" ? "light" : state.theme === "light" ? "dark" : "auto";
  localStorage.setItem("qissa-theme", state.theme);
  applyTheme();
});
applyTheme();
let focusLastY = 0;
window.addEventListener("scroll", () => {
  const y = window.scrollY;
  if (y > focusLastY + 8 && y > 260) document.body.classList.add("focus-hide");
  else if (y < focusLastY - 8 || y < 120) document.body.classList.remove("focus-hide");
  focusLastY = y;
}, { passive: true });
// The reading bar: a 3px thread of accent along the top, tracking how far
// through the story the reader is. rAF-throttled; hidden in the library.
const readbarFill = document.querySelector("#readbar div");
let rbPending = false;
addEventListener("scroll", () => {
  if (rbPending) return;
  rbPending = true;
  requestAnimationFrame(() => {
    rbPending = false;
    // scrollingElement, not documentElement: served without a doctype (file://,
    // the PWA before the host injects one) the page is in quirks mode and the
    // BODY is the scroller — documentElement.scrollTop stays 0 forever there.
    const h = document.scrollingElement || document.documentElement;
    const max = h.scrollHeight - innerHeight;
    readbarFill.style.width = max > 0 ? (100 * h.scrollTop / max).toFixed(1) + "%" : "0%";
  });
}, { passive: true });
if (STORIES.length === 1) openStory(STORIES[0]); else renderLibrary();
// A newcomer lands on a flat shelf where an L6 fiqh text sits beside an L1
// story with nothing steering them. Ask once — the answer feeds "For you" —
// and never ask again on boot: dismissing the sheet is also an answer, and
// the level chip (or the "For you" button) reopens the picker on demand.
if (!state.myLevel && STORIES.length > 1 && localStorage.getItem("qissa-welcomed") !== "1") {
  localStorage.setItem("qissa-welcomed", "1");
  openLevelPicker();
}
// The one place a deck loaded from storage is made safe to render. GRAMMAR is
// baked into the file and never changes at runtime, so once this has run no
// card can point at a note that is not there — which is why nothing downstream
// carries a fallback for that case. Also normalises decks written before card
// types existed.
function pruneDeck(){
  const before = state.deck.length;
  state.deck.forEach(c => { if (!c.type) c.type = "word"; });
  state.deck = state.deck.filter(c => c.type !== "note" || GRAMMAR[c.noteId]);
  return state.deck.length !== before;
}
// persistDeck writes to localStorage synchronously, so only pay for it when the
// prune actually removed something rather than on every single page load.
if (pruneDeck()) persistDeck(); else updateDeckCount();

// ---------- installable / offline ----------
// Only over http(s): a service worker cannot register from file:// or inside a
// sandboxed frame, and neither should throw. Everything below is additive — the
// app is one self-contained file and works with none of it.
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
// The manifest shortcut lands on #deck; honour it, and any later hash change.
function openFromHash(){
  if (location.hash === "#deck") openDeck();
  else if (location.hash === "#search") openSearch("");
}
window.addEventListener("hashchange", openFromHash);
openFromHash();
</script>
