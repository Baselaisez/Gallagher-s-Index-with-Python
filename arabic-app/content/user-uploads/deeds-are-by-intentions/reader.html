n taşıdığı hareke ile bırakır, sanki düşen harf hâlâ gelecekmiş gibi (يَا حَارِ); BEKLEMEYENİN LUGATİ ise kalanı yepyeni bir müfred münâdâ sayar ve damme üzere bina eder (يَا حَارُ)."},"plain":{"en":"Calling someone. The particle stands in for a verb you never say — «I call» — and the one called is its object.","tr":"Birine seslenmek. Nidâ harfi, hiç söylenmeyen bir fiilin — «çağırıyorum» — yerini tutar; çağrılan da onun mef'ûlüdür."},"amil":"حَرْفُ النِّدَاءِ نَائِبٌ عَنْ فِعْلٍ مَحْذُوفٍ تَقْدِيرُهُ «أَدْعُو» — وَهُوَ النَّاصِبُ لِلْمُنَادَى","sources":["الكافية (ابن الحاجب) — بابُ المنادى","قطر الندى (ابن هشام) — المنادى والترخيم","الإظهار (البركوي) — المنادى"],"question":{"tr":["Münâdâ tek kelime mi, yoksa kendinden sonrakine mi bağlı? Tek ise mebnîdir.","Tenvinli mi? Öyleyse nekire-i gayr-i maksûdedir ve gerçekten mansubdur.","الـ'lı bir isme seslenilecekse araya أَيُّهَا girer."],"en":["Is the munada a single word, or does it lean on what follows? If single, it is FIXED.","Does it keep its tanwin? Then it is an unmeant indefinite, and really mansub.","To call a noun with الـ you must put أَيُّهَا between."]},"examples":[{"ar":"يَا يُوسُفُ اسْمَعْ وَصِيَّتِي.","gloss":{"en":"A single proper name: fixed on the damma with no tanwin, and mansub only by position — the object of the «I call» nobody says.","tr":"Müfred alem: tenvinsiz damme üzere mebnî; nasbı yalnız mahallîdir — kimsenin söylemediği «çağırıyorum»un mef'ûlü."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"يَا وَلَدُ اُدْخُلِ الْبَيْتَ.","gloss":{"en":"Not a proper name at all, yet ruled exactly the same: an indefinite MEANT of the child in front of you is a nakira maqsuda, and it too is fixed on the damma.","tr":"Hiç alem değil, fakat hükmü aynı: önünüzdeki çocuğu KASTEDEN bir nekire, nekire-i maksûdedir ve o da damme üzere mebnîdir."},"src":"jumal-al-tadrib"},{"ar":"يَا ابْنَ خَالِ.","gloss":{"en":"A mudaf: it leans on the word after it, so it cannot be fixed — the fatha on ابْنَ is a real nasb.","tr":"Muzâf: kendinden sonrakine dayanır, öyleyse mebnî olamaz — ابْنَ üzerindeki fetha gerçek nasbdır."},"src":"bad-al-amali"},{"ar":"سَمِعْتُ وَصِيَّتَكَ يَا مُعَلِّمِي.","gloss":{"en":"A mudaf to the ya of the speaker: still mansub, but the fatha is ESTIMATED before that ya — nothing is visible on the page.","tr":"Mütekellim yâsına muzâf: yine mansub, fakat fetha o yâdan önce TAKDÎR edilir — sayfada görünen bir şey yoktur."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"يَا أَهْلَ الْآمَالِ.","gloss":{"en":"The same mudaf ruling inside a verse — and the mudaf ilayh takes its own jarr underneath it.","tr":"Aynı muzâf hükmü bir beyit içinde — muzâfun ileyh de altında kendi cerrini alır."},"src":"bad-al-amali"}],"mistakes":[{"wrong":"يَا يُوسُفَ","right":"يَا يُوسُفُ","why":{"en":"A single proper name is FIXED on the damma. Learners give it fatha because the books say it is «in the position of nasb» — but a position is not a vowel.","tr":"Müfred alem damme üzere MEBNÎDİR. Kitaplar «mahallen mansubdur» dediği için fetha verilir — hâlbuki mahal, hareke demek değildir."}},{"wrong":"يَا الطَّالِبُ","right":"يَا أَيُّهَا الطَّالِبُ","why":{"en":"يَا never stands straight before الـ. أَيُّهَا goes between and becomes the munada itself; the الـ noun then follows it in raf' as a na't.","tr":"يَا, الـ'dan önce doğrudan durmaz. Araya أَيُّهَا girer ve münâdâ o olur; الـ'lı isim de ona tâbi olarak merfû na't gelir."}},{"wrong":"يَا مُسْلِمُونَ — مَبْنِيٌّ عَلَى الضَّمِّ","right":"يَا مُسْلِمُونَ — مَبْنِيٌّ عَلَى الْوَاوِ","why":{"en":"The munada is fixed on WHAT WOULD RAISE IT, and a sound masculine plural is raised by the waw, not by a damma. The same reasoning fixes a dual on its alif.","tr":"Münâdâ KENDİSİYLE MERFÛ OLACAĞI ŞEY üzere mebnîdir; cem'-i müzekker-i sâlimi ref eden vâvdır, damme değil. Aynı gerekçe tesniyeyi elifi üzere bina eder."}},{"wrong":"يَا رَجُلٌ خُذْ بِيَدِي","right":"يَا رَجُلًا خُذْ بِيَدِي","why":{"en":"An indefinite meant of nobody in particular is not fixed at all: it is really mansub, and its tanwin stays because it is still indefinite.","tr":"Hiç kimseyi kastetmeyen nekire mebnî değildir: gerçekten mansubdur ve hâlâ nekire olduğu için tenvini durur."}},{"wrong":"يَا زَيْ (تَرْخِيمُ «زَيْدٌ»)","right":"يَا زَيْدُ — لَا تَرْخِيمَ لِلثُّلَاثِيِّ","why":{"en":"Tarkhim needs a name of MORE than three letters, or a word ending in ta marbuta. A three-letter name has nothing to spare.","tr":"Terhîm, üç harften FAZLA bir alem yahut tâ-i te'nîs ile biten bir kelime ister. Üç harfli ismin verecek harfi yoktur."}}]},"zanna-wa-akhawatuha":{"title":{"ar":"ظَنَّ وَأَخَوَاتُهَا (أَفْعَالُ الْقُلُوبِ)","en":"The verbs of the heart: ظَنَّ and its sisters","tr":"Ef'âl-i kulûb (ظَنَّ ve kardeşleri)"},"level":5,"group":"awamil","explanation":{"en":"The أَفْعَالُ الْقُلُوبِ are named for acting through the heart, not the limbs: ظَنَّ، حَسِبَ، خَالَ، زَعَمَ («suppose»), عَلِمَ، رَأَى، وَجَدَ («know for certain»). They enter on a complete nominal sentence and turn BOTH its parts into objects: ظَنَنْتُ زَيْدًا عَالِمًا — mubteda and khabar have become first and second maf'ul, and neither may be dropped alone: mention one and the other becomes obligatory. Two licences soften their rule. الإِلْغَاء (annulment of the government, in word and meaning) is allowed when the verb sits in the middle or at the end: زَيْدٌ ظَنَنْتُ عَالِمٌ. التَّعْلِيق (suspension — the government is blocked in wording only) is forced when what follows has the right to head its own clause: an interrogative, a negation, or the lam of ibtida — عَلِمْتُ أَزَيْدٌ عِنْدَكَ أَمْ عَمْرٌو. The same doubling of objects, without the licences, belongs to the giving-and-making verbs (أَعْطَى, جَعَلَ), and أَعْلَمَ and أَرَى go on to three objects — but ظَنَّ's family is where the madrasah learns the machinery.","tr":"أَفْعَالُ الْقُلُوبِ adını, âzâ ile değil kalp ile işlenmelerinden alır: ظَنَّ، حَسِبَ، خَالَ، زَعَمَ («sanmak»), عَلِمَ، رَأَى، وَجَدَ («kesin bilmek»). Tam bir isim cümlesinin üzerine girer ve İKİ cüzünü birden mef'ûl yaparlar: ظَنَنْتُ زَيْدًا عَالِمًا — mübtedâ ile haber, birinci ve ikinci mef'ûl olmuştur; biri zikredilince öbürünün zikri vâcibtir. İki ruhsat kaidelerini yumuşatır. الإِلْغَاء (amelin hem lafzen hem manen iptali) fiil ortada yahut sonda ise câizdir: زَيْدٌ ظَنَنْتُ عَالِمٌ. التَّعْلِيق (askıya alma — amel yalnız lafzen kesilir) ise kendinden sonrası sadr hakkı taşıyorsa vâcibtir: istifham, nefiy yahut ibtidâ lâmı — عَلِمْتُ أَزَيْدٌ عِنْدَكَ أَمْ عَمْرٌو. Aynı iki-mef'ûllülük, ruhsatlar olmaksızın verme-kılma fiillerinde de vardır (أَعْطَى, جَعَلَ); أَعْلَمَ ve أَرَى üç mef'ûle kadar çıkar — fakat medrese bu mekanizmayı ظَنَّ ailesinde öğrenir."},"plain":{"en":"Verbs of thinking and knowing — ظَنَّ «suppose», عَلِمَ «know» — swallow a whole sentence: «Zayd is learned» becomes two objects, both mansub.","tr":"Zannetme ve bilme fiilleri — ظَنَّ «sanmak», عَلِمَ «bilmek» — bir cümleyi bütünüyle yutar: «Zeyd âlimdir» iki mef'ûle döner, ikisi de mensub."},"mamul":"mansub","sources":["الكافية (ابن الحاجب) — أفعال القلوب","العوامل (البيركوي)"],"examples":[{"ar":"ظَنَنْتُ زَيْدًا عَالِمًا.","gloss":{"en":"I supposed Zayd to be learned — the old mubteda and khabar are now two mansub objects.","tr":"Zeyd'i âlim sandım — eski mübtedâ ve haber artık iki mensub mef'ûldür."},"src":null},{"ar":"عَلِمْتُ أَزَيْدٌ عِنْدَكَ أَمْ عَمْرٌو.","gloss":{"en":"I know — is it Zayd with you, or Amr? The interrogative suspends the government (ta'liq): everything after it stays raf'.","tr":"Bilirim — yanındaki Zeyd mi, Amr mı? İstifham ameli askıya alır (ta'lîk): sonrası merfû kalır."},"src":null}],"mistakes":[{"wrong":"ظَنَنْتُ زَيْدًا","right":"ظَنَنْتُ زَيْدًا عَالِمًا","why":{"en":"The heart-verbs take their two objects as a pair: mentioning only one of them is not allowed, because together they carry the judgement that was the original sentence.","tr":"Kalp fiilleri iki mef'ûlünü çift olarak alır: yalnız birini zikretmek câiz değildir; hüküm — yani asıl cümle — ikisinin üzerinde birden durur."}},{"wrong":"ظَنَنْتُ زَيْدٌ عَالِمٌ","right":"ظَنَنْتُ زَيْدًا عَالِمًا","why":{"en":"With the verb at the HEAD, ilgha is not available — the government must run, and both objects take nasb.","tr":"Fiil BAŞTA iken ilğâ ruhsatı yoktur — amel işler, iki mef'ûl de nasb olur."}}]}};

// Demo paywall: premium stories show this many free sentences before the upsell.
const PREVIEW_SENTENCES = 3;

// ---------- the Lite tier: a rotating free set ----------
// Locking every premium story forever shows a Lite reader the same wall every
// day, and there is nothing to come back for. So a couple of them open up each
// week instead — the whole story, not a longer preview.
//
// The window is DERIVED from the date, never stored: every device shows the
// same stories in the same week with no server and no sync, and a reader who
// clears storage does not get a fresh set. It slides forward by its own width
// each week, so it walks the premium catalogue and every story comes round in
// turn rather than the same two recurring.
const FREE_ROTATION = 2;
const DAY_MS = 86400000;
const WEEK_MS = 7 * DAY_MS;
const ROTATION_EPOCH = Date.UTC(2026, 0, 5); // a Monday — weeks start there

// Midnight of the learner's own day, as a UTC instant, so the week turns over
// at local midnight rather than at whatever hour UTC midnight falls on here.
function localMidnight(now){
  const d = now || new Date();
  return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
}
function weekIndex(now){
  return Math.floor((localMidnight(now) - ROTATION_EPOCH) / WEEK_MS);
}
// Sorted by id, not by catalogue order: adding a story to the middle of the
// library must not reshuffle which stories are free this week. STORIES is a
// build-time constant, so this is computed once.
let _premiumIds = null;
function premiumIds(){
  if (!_premiumIds) _premiumIds = STORIES.filter(s => s.access === "premium").map(s => s.id).sort();
  return _premiumIds;
}
// Keyed on the week index and nothing else — the smoke test probes future weeks
// through the `now` argument, so a flat cache would both break it and survive
// the local-midnight rollover it is supposed to track.
let _rotWeek = null, _rotSet = null;
function rotatingFree(now){
  const w = weekIndex(now);
  if (w === _rotWeek) return _rotSet;
  const ids = premiumIds();
  const out = new Set();
  if (ids.length) {
    const n = Math.min(FREE_ROTATION, ids.length);
    const start = ((w * n) % ids.length + ids.length) % ids.length; // w is negative before the epoch
    for (let k = 0; k < n; k++) out.add(ids[(start + k) % ids.length]);
  }
  _rotWeek = w; _rotSet = out;
  return out;
}
function daysLeftInRotation(now){
  // Both operands are exact UTC midnights and a week is exactly seven days,
  // so this is already a whole number in 1..7 — nothing to round or clamp.
  return (ROTATION_EPOCH + (weekIndex(now) + 1) * WEEK_MS - localMidnight(now)) / DAY_MS;
}
function storyLocked(st){
  return !!st && st.access === "premium" && !state.premium && !rotatingFree().has(st.id);
}
// Defined as the complement of storyLocked rather than as a second copy of the
// same three clauses: the badge and the paywall are the one pair that must never
// disagree, and writing the rule twice is what made a test necessary to prove
// they don't.
function isFreeThisWeek(st){
  return !!st && st.access === "premium" && !state.premium && !storyLocked(st);
}

// not the sum of «between» and «his two hands» — but both words keep their own
// i'rab, so the sheet shows the idiom first and the word analysis under it.
function phraseAt(sen, ti){
  for (let i = 0; i <= ti; i++) {
    const ph = sen.tokens[i] && sen.tokens[i].phrase;
    if (ph && ti < i + ph.span) return { ...ph, start: i };

  return null;
}

  return sen.tokens.slice(ph.start, ph.start + ph.span).map(t => t.s.full).join(" ");

      markRead(sen.id); speak(sen, sec);
    });
    tools.appendChild(play);
    if (sen.tokens.some(t => t.irab)) {
      const irb = document.createElement("button");
      irb.className = "play irab-btn"; irb.lang = "ar";
      irb.style.width = "auto"; irb.style.padding = "0 .5rem"; irb.style.fontSize = ".85rem";
      irb.textContent = ui().sheetBtn;
      irb.title = ui().sheetTitle;
      irb.setAttribute("aria-label", ui().sheetTitle);
      irb.addEventListener("click", () => { markRead(sen.id); openIrabSheet(sen); });
      tools.appendChild(irb);
    }
    if (state.mode !== "easy") {
      // Being stuck should not force a mode change. One sentence, revealed.
      const peek = document.createElement("button");
      peek.className = "peek";
      peek.textContent = ui().peek;
      peek.addEventListener("click", () => {
        const line = sec.querySelector(".trans");
        line.textContent = T(sen.translation);
        line.hidden = false;
        peek.remove();
      });
      tools.appendChild(peek);
    }
    const tr = document.createElement("span");
    tr.className = "trans";
    tr.textContent = state.mode === "easy" ? T(sen.translation) : "";
    tr.hidden = state.mode !== "easy";
    tools.appendChild(tr);
    sec.appendChild(tools);
    storyEl.appendChild(sec);
  });
  });
  if (storyLocked(CUR)) {
    const up = document.createElement("div");
    up.className = "upsell";
    up.innerHTML = `<div class="ut">${ui().upsellTitle}</div><p>${ui().upsellBody}</p>
      <button id="unlockPremium" class="unlock">${ui().upsellBtn}</button>`;
    up.querySelector("#unlockPremium").addEventListener("click", () => {
      setPremium(true);
      openStory(CUR); // re-render the full story and refresh the header chips
    });
    storyEl.appendChild(up);
  }
  // Chapter pills, built from the heads that actually RENDERED — a locked
  // preview may cut chapters off, and a pill must never point at nothing.
  const heads = storyEl.querySelectorAll(".chapter-head");
  if (heads.length > 1) {
    const nav = document.createElement("div");
    nav.className = "ch-nav";
    heads.forEach(h => {
      const b = document.createElement("button");
      b.className = "ch-pill";
      b.textContent = ui().chapter + " " + h.dataset.ch;
      b.addEventListener("click", () => h.scrollIntoView({ block: "start" }));
      nav.appendChild(b);
    });
    storyEl.insertBefore(nav, storyEl.firstChild);
  }
}


// ---------- library / story shell ----------
function accessLabel(st){
  if (st.access === "user-upload") return ui().accessUpload;
  if (st.access === "free") return ui().accessFree;
  if (st.access === "premium") return ui().accessPremium;
  return st.access;
}
// ---------- recency ----------
// The sharpest complaint about the app this one is modelled on is that new
// content is invisible: a reader cannot tell what arrived since they last
// looked, so they stop looking. `published` is authored in the manifest (the
// day a story entered the library, not the day the text was written), and the
// library both badges and sorts on it.
const NEW_FOR_DAYS = 14;
// Both sides of the subtraction in daysSincePublished have to use ONE
// convention: a civil date rendered as a UTC instant. Date.parse("…T00:00:00")
// returns *local* midnight, which mixed against localMidnight()'s Date.UTC made
// a story published today read as −1 days old anywhere west of UTC — so the NEW
// badge never appeared on the day a story shipped for half the world.
function publishedMs(st){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(st.published || "");
  if (!m) return null;
  return Date.UTC(+m[1], +m[2] - 1, +m[3]);
}
function daysSincePublished(st){
  const t = publishedMs(st);
  if (t === null) return null;
  return Math.floor((localMidnight() - t) / DAY_MS);
}
function isNewStory(st){
  const d = daysSincePublished(st);
  return d !== null && d >= 0 && d < NEW_FOR_DAYS;
}
// Both orders are real sorts. "By level" used to be the identity, which quietly
// meant *directory-name* order — the button was labelled for something it did
// not do. Undated stories sort last under "Newest": null is treated as older
// than any real date rather than as the epoch, so it cannot outrank a story.
const LIB_SORTS = {
  level: (a, b) => a.level - b.level || a.id.localeCompare(b.id),
  new: (a, b) => {
    const x = publishedMs(a), y = publishedMs(b);
    if (x === null) return y === null ? a.id.localeCompare(b.id) : 1;
    if (y === null) return -1;
    return y - x || a.id.localeCompare(b.id);   // same-day releases keep a stable order
  },
  foryou: (a, b) => forYouRank(a) - forYouRank(b) || LIB_SORTS.new(a, b),
};
// "For you" is distance from the reader's own level, with easier breaking the
// tie: at-level, one easier, one harder, two easier, two harder… A story just
// above the reader is still closer to useful than one far below, which is why
// the shelves interleave instead of exhausting everything easier first.
// Within a shelf, newest first.
function forYouRank(st){
  const my = state.myLevel || 1;   // a cleared level degrades to the beginner shelf, not a crash
  return st.level === my ? 0 : st.level < my ? 2 * (my - st.level) : 2 * (st.level - my) + 1;
}
function storiesSorted(){
  return STORIES.slice().sort(LIB_SORTS[state.libSort] || LIB_SORTS.level);
}
function setLibSort(v){
  // "For you" before a level is stored is a question, not a sort.
  if (v === "foryou" && !state.myLevel) { openLevelPicker(); return; }
  state.libSort = v;
  localStorage.setItem("qissa-libsort", v);
  renderLibrary();
}
function storyStats(st){
  let total = 0;
  st.chapters.forEach(c => total += c.sentences.length);
  const read = Object.keys(state.progress[st.id] || {}).length;
  return {total, read: Math.min(read, total)};
}
// Words this story would add to the deck: unique token lexes with a teachable
// level (proper nouns are level 0) that are not already saved. The library
// shows it so "what do I read next" can be answered by vocabulary payoff, not
// only by level. Segments are not counted — the reader meets the whole token.
function storyNewWords(st, have){
  const seen = new Set();
  st.chapters.forEach(ch => ch.sentences.forEach(sen => sen.tokens.forEach(tok => {
    const e = st.glossary[tok.lex];
    if (e && e.level >= 1 && !have.has(tok.lex)) seen.add(tok.lex);
  })));
  return seen.size;
}
// A quiet toast for the moments worth marking — completion, never nagging.
let toastTimer = null;
function showToast(msg){
  let t = document.getElementById("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  // Force a reflow so back-to-back toasts restart the slide.
  void t.offsetHeight;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}
function markRead(senId){
  if (!CUR) return;
  const prog = state.progress[CUR.id] || (state.progress[CUR.id] = {});
  if (!prog[senId]) {
    prog[senId] = 1;
    localStorage.setItem("qissa-progress", JSON.stringify(state.progress));
    countActivity("read");
    // The completion moment: exactly once, on the read that finishes the story.
    const st = storyStats(CUR);
    if (st.total && st.read === st.total) showToast(ui().storyDone);
  }
}
function setHeader(titleAr, sub, chipsHtml){
  document.getElementById("storyTitle").textContent = titleAr;
  document.getElementById("storySub").textContent = sub;
  document.getElementById("metaRow").innerHTML = chipsHtml;
  // The open story's level tints the hero, same scale as the shelf's covers.
  const app = document.querySelector("header.app");
  if (CUR) app.dataset.lvlc = Math.min(4, Math.max(1, CUR.level));
  else delete app.dataset.lvlc;
}
// ---------- generated cover art ----------
// Every story wears a woven geometric band — an eight-point star lattice in
// its level's muted colour, parameterised by a hash of the story id so no two
// covers repeat and none is an asset. Deterministic: the same story always
// weaves the same cloth.
function coverArt(st){
  let h = 0;
  for (const c of st.id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const cols = { 1: "#5a9e6f", 2: "#6b93c4", 3: "#cf9f5d", 4: "#9a7fb8" };
  const col = cols[Math.min(4, Math.max(1, st.level))];
  const rot = h % 45, r = 9 + (h % 9), r2 = 14 + ((h >> 4) % 12);
  const op = (0.3 + (h % 18) / 100).toFixed(2);
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72'>` +
    `<g fill='none' stroke='${col}' stroke-width='1' opacity='${op}'>` +
    `<rect x='18' y='18' width='36' height='36' transform='rotate(${rot} 36 36)'/>` +
    `<rect x='18' y='18' width='36' height='36' transform='rotate(${rot + 45} 36 36)'/>` +
    `<circle cx='36' cy='36' r='${r}'/>` +
    `<circle cx='0' cy='0' r='${r2}'/><circle cx='72' cy='0' r='${r2}'/>` +
    `<circle cx='0' cy='72' r='${r2}'/><circle cx='72' cy='72' r='${r2}'/>` +
    `</g></svg>`;
  // encodeURIComponent leaves apostrophes alone, and the style attribute wraps
  // the URI in url('…') — so the SVG's quote marks must become %27 by hand.
  return "data:image/svg+xml," + encodeURIComponent(svg).replace(/'/g, "%27");
}

function renderLibrary(){
  stopPlayAll();
  CUR = null; GLOSSARY = {}; MORPH = {}; CHAPTERS = [];
  document.body.classList.add("lib-mode");

  // its ✓ chip records the achievement and the sorts suggest what is next.
  // ============ design wave 9: the front door states where you are ========
  // DESIGN.md's third borrowed principle — progress visible without being
  // asked for. Three tiles, no more: the streak, what is due, what is known.
  // Every number is read live from the same primitives the deck and the

  sortBar.querySelectorAll("[data-sort]").forEach(b =>

// ---------- first-run level picker ----------
// The levels on offer come from the shelf itself, not a hardcoded list: a
// library that has no Master story asks no Master question.
function levelChoices(){
  const seen = new Map();
  STORIES.forEach(st => { if (!seen.has(st.level)) seen.set(st.level, st.levelName || ""); });
  return [...seen.entries()].sort((a, b) => a[0] - b[0]);
}
function openLevelPicker(){
  const lvls = levelChoices();
  const lo = lvls[0][0], hi = lvls[lvls.length - 1][0];
  sheetInner.innerHTML = `

      ${lvls.map(([lv, en]) => `<button class="btn ${state.myLevel === lv ? "saved" : ""}" data-pick-level="${lv}">
        ${ui().level} ${lv} · ${levelLabel(en)}</button>`).join("")}
    </div>

  sheetInner.querySelectorAll("[data-pick-level]").forEach(b =>
    b.addEventListener("click", () => setMyLevel(parseInt(b.dataset.pickLevel, 10))));

function setMyLevel(lv){
  state.myLevel = lv;
  localStorage.setItem("qissa-mylevel", String(lv));
  setLibSort("foryou");   // persists the sort and re-renders; renderLibrary closes the sheet
}
// ---------- the story's word list ----------
// The lesson vocabulary page every serious reader app has: all teachable words
// of the open story, counted once, easiest first, each saveable to the deck
// without hunting its token in the text. The list reads from GLOSSARY live and
// stores nothing.
function openVocab(){
  if (!CUR) return;
  const seen = new Map();
  CHAPTERS.forEach(ch => ch.sentences.forEach(sen => sen.tokens.forEach(tok => {
    const e = GLOSSARY[tok.lex];
    if (e && e.level >= 1 && !seen.has(tok.lex)) seen.set(tok.lex, tok);
  })));
  const rows = [...seen.keys()].sort((a, b) =>
    GLOSSARY[a].level - GLOSSARY[b].level || GLOSSARY[a].lemma.localeCompare(GLOSSARY[b].lemma));
  sheetInner.innerHTML = `
    <h3 class="welcome-h">${ui().vocabTitle}</h3>
    <p class="ref-intro">${ui().vocabHint}</p>
    <ul class="deck-list vocab-list">` + rows.map(lex => {
      const e = GLOSSARY[lex], on = cardSaved("word:" + lex);
      return `<li><span class="w" lang="ar">${e.lemma}</span>
        <span class="g">${T(e.gloss)}</span>
        <span class="chip level">L${e.level}</span>
        <button data-vocab-save="${escapeAttr(lex)}" class="${on ? "saved" : ""}">${
          on ? ui().saved : ui().save}</button></li>`;
    }).join("") + `</ul>`;
  sheetInner.querySelectorAll("[data-vocab-save]").forEach(b =>
    b.addEventListener("click", () => {
      const lex = b.dataset.vocabSave;
      if (toggleSave(seen.get(lex)) === false) { b.textContent = ui().deckFull; return; }
      const on = cardSaved("word:" + lex);
      b.textContent = on ? ui().saved : ui().save;
      b.classList.toggle("saved", on);
    }));
  showSheet();
}
// sen.id -> {src, span} for every sentence that has BOTH a chapter audio file
// and its own [startMs, endMs]. One without the other plays nothing real —
// half-wired narration must fall back to TTS, never to silence.
let SEN_AUDIO = new Map();
function buildSenAudio(){
  SEN_AUDIO = new Map();
  CHAPTERS.forEach(ch => {
    if (!ch.audioFile) return;
    ch.sentences.forEach(sen => {
      if (sen.audio) SEN_AUDIO.set(sen.id, { src: ch.audioFile, span: sen.audio });
    });
  });
}
// The story a returning reader is offered to pick back up: the last one they
// opened, as long as it exists and is not finished.
function continueStory(){
  const st = STORIES.find(s => s.id === state.lastRead);
  if (!st) return null;
  const { total, read } = storyStats(st);
  return read < total ? st : null;
}
// Land the returning reader on the first sentence they have not read, not at
// the top of a text they have already worked through.
function resumeScroll(){
  const prog = state.progress[CUR ? CUR.id : ""] || {};
  const hit = SENTENCE_FLAT.find(({ sen }) => !prog[sen.id]);
  if (!hit) return;
  hit.sec.scrollIntoView({ block: "center" });
  hit.sec.classList.add("resume-target");
  hit.sec.addEventListener("animationend", () => hit.sec.classList.remove("resume-target"), { once: true });
}
function openStory(st, resume){
  stopPlayAll();
  CUR = st; GLOSSARY = st.glossary; MORPH = st.morph; CHAPTERS = st.chapters;
  if (STORIES.length > 1) {
    state.lastRead = st.id;
    localStorage.setItem("qissa-lastread", st.id);
  }
  buildSenAudio();
  document.body.classList.remove("lib-mode");
  const back = document.getElementById("backLib");
  back.hidden = STORIES.length < 2;
  back.textContent = ui().backLib;
  const siblings = STORIES.filter(s => s.group === st.group && s.id !== st.id);
  // Every teachable word of this story, counted once \u2014 the chip opens the list.
  const vocabCount = (() => {
    const s = new Set();
    st.chapters.forEach(c => c.sentences.forEach(x => x.tokens.forEach(t => {
      const e = st.glossary[t.lex];
      if (e && e.level >= 1) s.add(t.lex);
    })));
    return s.size;
  })();
  setHeader(st.title.ar, T(st.subtitle) || T(st.title) || "",
    `<span class="chip level">${ui().level} ${st.level} \u00b7 ${levelName(st)}</span>
     <span class="chip">${st.chapters.length} ${ui().chaptersWord}</span>
     ${vocabCount ? `<button class="chip vocab" id="vocabChip">${ui().vocabChip.replace("{n}", vocabCount)}</button>` : ""}
     <span class="chip">${accessLabel(st)}</span>` +
    (storyLocked(st) ? `<span class="chip preview">${ui().previewLbl}</span>` : "") +
    (isFreeThisWeek(st) ? `<span class="chip freeweek">${ui().freeWeek} · ${
      ui().freeWeekLeft.replace("{n}", daysLeftInRotation())}</span>` : "") +
    siblings.map(s =>
      `<button class="chip sib" data-sid="${s.id}">${ui().alsoAt} Level ${s.level} \u2192</button>`
    ).join(""));
  document.querySelectorAll("#metaRow .sib").forEach(b =>
    b.addEventListener("click", () => {
      const target = STORIES.find(s => s.id === b.dataset.sid);
      if (target) openStory(target);
    }));
  const vc = document.getElementById("vocabChip");
  if (vc) vc.addEventListener("click", openVocab);
  closeSheet();
  renderStory();
  window.scrollTo(0, 0);
  if (resume) resumeScroll();
}


// ---------- the quiz shell ----------
// Six of the seven games are one machine: a round of items, one question at a
// time, a row of options, a reveal that marks right / wrongpick and disables
// the rest, a why panel, zero or one extra action, then next-or-replay. That
// machine lives here ONCE; each game supplies its items and four hooks. The
// copies had already drifted (data-o vs data-k, «____» vs «ـــــ») — which is
// what six transcriptions of one idea do. Match stays outside the shell: a
// pairing grid with no rounds, no reveal and no score-per-question is
// genuinely a different game, not a seventh copy of this one.
function emptyGame(title, msg){
  sheetInner.innerHTML = `<div class="backrow"><button id="gBack">${ui().back2}</button></div>
    <div class="tabs"><button class="on">${title}</button></div>
    <p class="empty">${msg}</p>`;
  document.getElementById("gBack").addEventListener("click", openGames);
}
// cfg: { title, ask, items, restart, question(it), options(it) -> [{html, ok, ar?}],
//        why(it), after?(it), extras?: [{label(it), run(it)}] }
// options() is called once per question and must return the row pre-shuffled —
// the shell deliberately knows nothing about how a game builds distractors.
// ---------- ability model (Elo / IRT-lite) ----------
// Online learning with no model file: the learner holds one rating per skill
// area, every quiz item holds a rating from its difficulty level, and each
// answer moves the learner's rating by K·(result − expected) — the same update
// chess uses, which is logistic IRT fitted one observation at a time. The
// point is not the number but what it buys: games can then serve items whose
// expected success sits near 0.75 — hard enough to teach, easy enough to
// keep going (the "desirable difficulty" band) — and the coach can name the
// weakest area with evidence instead of a guess.
class EloModel {
  static K = 24;
  static AREAS = ["vocab", "sarf", "nahw", "adad", "balagha"];
  static itemRating(level){ return 900 + Math.min(6, Math.max(1, level || 3)) * 100; }
  static expected(rl, ri){ return 1 / (1 + Math.pow(10, (ri - rl) / 400)); }
  // TWO-SIDED: when the caller can name the item (a lex, a paradigm cell),
  // the item's own rating learns too — a word everyone misses drifts up from
  // its level's prior, one everyone aces drifts down. That is the item side
  // of IRT, fitted online exactly like the learner side; the level stays the
  // PRIOR, the plays are the evidence.
  static K_ITEM = 16;
  static update(area, level, correct, itemKey){
    if (!this.AREAS.includes(area)) return;
    const prior = this.itemRating(level);
    let ri = prior;
    if (itemKey) {
      const k = area + "|" + itemKey;
      ri = state.eloItems[k] != null ? state.eloItems[k] : prior;
    }
    const e = this.expected(state.elo[area], ri);
    const s = correct ? 1 : 0;
    state.elo[area] = Math.round(state.elo[area] + this.K * (s - e));
    if (itemKey) {
      const k = area + "|" + itemKey;
      state.eloItems[k] = Math.round(ri - this.K_ITEM * (s - e));
      const keys = Object.keys(state.eloItems);
      if (keys.length > 1200) delete state.eloItems[keys[0]];
      localStorage.setItem("qissa-elo-items", JSON.stringify(state.eloItems));
    }
    localStorage.setItem("qissa-elo", JSON.stringify(state.elo));
    this.snapshot();
  }
  // one point per day per area — the coach's sparkline reads this
  static snapshot(){
    const day = new Date().toISOString().slice(0, 10);
    const last = state.eloHist[state.eloHist.length - 1];
    if (last && last.d === day) Object.assign(last, state.elo, { d: day });
    else state.eloHist.push({ d: day, ...state.elo });
    if (state.eloHist.length > 90) state.eloHist.shift();
    localStorage.setItem("qissa-elo-hist", JSON.stringify(state.eloHist));
  }
  static weakest(){
    return this.AREAS.reduce((a, b) => (state.elo[b] < state.elo[a] ? b : a));
  }
  // the level whose expected success is ~0.75 for this learner:
  // solve expected(rl, ri) = t for ri, then map back to a 1-6 level.
  static targetLevel(area, t = 0.75){
    const ri = state.elo[area] + 400 * Math.log10(1 / t - 1);
    return Math.min(6, Math.max(1, Math.round((ri - 900) / 100)));
  }
  // order candidates by closeness to the desirable-difficulty band, with a
  // pinch of noise so rounds differ; fading words keep their reserved seats.
  static rank(cands, area, lvlOf){
    const tgt = this.targetLevel(area);
    return [...cands].sort((a, b) =>
      (Math.abs((lvlOf(a) || 3) - tgt) + Math.random() * 0.9) -
      (Math.abs((lvlOf(b) || 3) - tgt) + Math.random() * 0.9));
  }
}

// The harness keeps the whole round's state in G, and every render flows
// through draw() — so a detour into a grammar note or an i'rab sheet can
// come home: QUIZ_RESUME.redraw() repaints the very question, answered
// exactly as it was left. Cleared when the round ends or the hub reopens.
let QUIZ_RESUME = null;
function runQuiz(cfg){
  const G = { i: 0, score: 0, answered: null, opts: null, optsFor: -1 };
  function draw(){
    const it = cfg.items[G.i];
    // options are drawn ONCE per question — a resume must not reshuffle them
    if (G.optsFor !== G.i) { G.opts = cfg.options(it); G.optsFor = G.i; G.answered = null; }
    const opts = G.opts;
    const done = G.answered != null;
    sheetInner.innerHTML = `<div class="backrow"><button id="gBack">${ui().back2}</button></div>
      <div class="tabs"><button class="on">${cfg.title} · ${G.i + 1}/${cfg.items.length}</button></div>
      <p class="ref-intro">${cfg.ask}</p>
      ${cfg.question(it)}
      <div class="opts">` + opts.map((o, oi) =>
        `<button data-o="${oi}"${o.ar ? ' lang="ar"' : ""}${done ? " disabled" : ""} class="${
          done && o.ok ? "right" : (done && oi === G.answered ? "wrongpick" : "")}">${o.html}</button>`).join("") + `</div>
      <div class="game-meta"><span>${ui().score}: ${G.score}</span></div><div id="qWhy"></div>`;
    document.getElementById("gBack").addEventListener("click", () => { QUIZ_RESUME = null; openGames(); });
    if (!done) {
      sheetInner.querySelectorAll(".opts [data-o]").forEach(b => b.addEventListener("click", () => {
        G.answered = +b.dataset.o;
        if (opts[G.answered].ok) G.score++;
        // one Elo observation per answer — the game declares its skill area and
        // how hard THIS item is; the harness never guesses either. A resume
        // never lands here, so nothing double-counts.
        if (cfg.area) EloModel.update(cfg.area, cfg.lvl ? cfg.lvl(it) : 3, opts[G.answered].ok,
          cfg.itemKey ? cfg.itemKey(it) : null);
        draw();
      }));
      return;
    }
    const picked = opts[G.answered], right = opts.find(o => o.ok);
    // An extra may declare show(it): an action that would dead-end for THIS
    // item (e.g. jumping to a sentence behind the paywall) is not offered.
    const extras = (cfg.extras || []).filter(x => !x.show || x.show(it));
    document.getElementById("qWhy").innerHTML =
      `${picked.ok ? "" :
        `<div class="game-correct">${ui().correctWas} <b${right.ar ? ' lang="ar"' : ""}>${right.html}</b></div>` +
        (cfg.whyNot ? `<div class="game-wrongwhy">${cfg.whyNot(it, picked)}</div>` : "")}
       <div class="game-why">${cfg.why(it)}</div>
       ${cfg.after ? cfg.after(it) : ""}
       <div class="sheet-actions">` +
      extras.map((x, k) => `<button class="btn" id="qX${k}">${x.label(it)}</button>`).join("") +
      `<button class="btn primary" id="qNext">${G.i + 1 < cfg.items.length ? ui().next : ui().replay}</button>
       </div>`;
    extras.forEach((x, k) =>
      document.getElementById("qX" + k).addEventListener("click", () => x.run(it)));
    document.getElementById("qNext").addEventListener("click", () => {
      if (++G.i < cfg.items.length) draw(); else { QUIZ_RESUME = null; cfg.restart(); }
    });
  }
  QUIZ_RESUME = { redraw: draw };
  draw();
}
// The reading line with one token replaced — the question line the sentence
// games share. Same join as the page renders, so the gap sits where the word did.
function senWithSlot(sen, ti, slot){
  return sen.tokens.map((t, k) => (k === ti ? slot(t) : t.s.full) + (t.punctAfter || "")).join(" ");
}
// A token's i'rab, shown as every reveal shows it: the Arabic line, then yours.
function irabWhy(irab){
  return `<span lang="ar" style="font-family:var(--ar-font);font-size:1.2em">${irab.ar}</span><br>${T(irab)}`;
}

// ---------- game: Emsile-i Muhtelife drill ----------
// Name a cell of the fourteen, pick the form. The distractors are other cells
// of the SAME verb, so the learner must know the sigha, not just the root.
function sarfItems(){
  const out = [];
  STORIES.forEach(st => Object.entries(st.morph || {}).forEach(([lex, m]) => {
    const rows = muhtelife(m);
    if (!rows || rows.length < 5) return;
    rows.forEach((row, ri) => out.push({ lex, m, ri, rows, lemma: m.mazi[0] }));
  }));
  return out;
}
function startSarfGame(){
  const items = shuffle(sarfItems()).slice(0, 8);
  if (!items.length) { openGames(); return; }
  runQuiz({
    title: ui().sarfGame, ask: ui().sarfGameAsk, items, restart: startSarfGame,
    area: "sarf", lvl: () => 4, itemKey: it => it.lex + "#" + it.ri,
    question: it => `<div class="game-q"><span lang="ar" style="font-family:var(--ar-font);font-size:1.6rem">${it.lemma}</span>
      <div class="sigha">${state.uiLang === "tr" ? it.rows[it.ri].tr : it.rows[it.ri].en}</div></div>`,
    options: it => {
      const right = it.rows[it.ri];
      const others = it.rows.filter((r, k) => k !== it.ri && r.ar !== right.ar);
      return shuffle([{ html: right.ar, ok: true, ar: true, row: right },
        ...shuffle(others).slice(0, 3).map(r => ({ html: r.ar, ok: false, ar: true, row: r }))]);
    },
    // every distractor is another cell of the SAME verb, so the refutation
    // can simply name it: you read the paradigm, just one line off.
    whyNot: (it, picked) => {
      const tr = state.uiLang === "tr";
      const lbl = picked.row ? (tr ? picked.row.tr : picked.row.en) : null;
      return lbl
        ? (tr ? `<b lang="ar">${picked.html}</b> aynı fiilin başka bir hânesidir: «${lbl}».`
              : `<b lang="ar">${picked.html}</b> is another cell of the same verb: «${lbl}».`)
        : (tr ? "Bu sîga istenen hâne değil." : "That sigha is not the cell asked for.");
    },
    why: it => `${it.m.bab} — ${it.m.wazn}${it.m.note ? "<br>" + it.m.note : ""}`,
  });
}

// ---------- game: which case? ----------
// Birgivi's classes of governed form, drilled on real sentences. The answer is
// read off the i'rab already written for the token, never guessed.
const CASE_KEYS = [
  { k: "marfu",  re: /مَرْفُوع/ },
  { k: "mansub", re: /مَنْصُوب/ },
  { k: "majrur", re: /مَجْرُور/ },
  { k: "majzum", re: /مَجْزُوم/ },
];
function caseItems(){
  const out = [];
  STORIES.forEach(st => st.chapters.forEach(ch => ch.sentences.forEach(sen =>
    sen.tokens.forEach((t, ti) => {
      if (!t.irab || !t.irab.ar) return;
      const hits = CASE_KEYS.filter(c => c.re.test(t.irab.ar));
      if (hits.length !== 1) return;          // skip tokens naming two cases
      out.push({ sen, ti, tok: t, key: hits[0].k, story: st.id });
    }))));
  return out;
}
// ---- the ending sign, read off the word itself -------------------------
// A refutation should point at the text, not merely assert. The signs of
// i'rab are a closed list (Qatr al-Nada's chapter on alamat): the short
// vowels and their tanwin, the sukun, and the letters — واو/ألف/نون for
// raf', ياء/ألف for nasb and jarr, the dropped nun for jazm. This reads the
// LAST of them off a surface form and names which cases it can carry.
const CASE_SIGN = {
  damma:  { ar: "الضَّمَّة", en: "damma", tr: "damme", cases: ["marfu"] },
  fatha:  { ar: "الْفَتْحَة", en: "fatha", tr: "fetha", cases: ["mansub"] },
  kasra:  { ar: "الْكَسْرَة", en: "kasra", tr: "kesra", cases: ["majrur"] },
  sukun:  { ar: "السُّكُون", en: "sukun", tr: "sükûn", cases: ["majzum"] },
  waw:    { ar: "الْوَاو", en: "the waw", tr: "vâv", cases: ["marfu"] },
  yaNasb: { ar: "الْيَاء", en: "the ya", tr: "yâ", cases: ["mansub", "majrur"] },
  alif:   { ar: "الْأَلِف", en: "the alif", tr: "elif", cases: ["marfu"] },
};
function caseSignOf(full){
  const w = (full || "").normalize("NFC").replace(/[«»،.:!؟\s]/g, "");
  const bare = stripAr(w);
  // letters first: they outrank the vowel that may sit on them
  if (/ُونَ?$|ُو$/.test(w) || /ون$/.test(bare)) return CASE_SIGN.waw;
  if (/ِينَ?$|َيْنِ$/.test(w) || /ين$/.test(bare)) return CASE_SIGN.yaNasb;
  if (/َانِ$/.test(w) || /ان$/.test(bare)) return CASE_SIGN.alif;
  const marks = [...w].filter(c => "ًٌٍَُِْ".includes(c));
  const last = marks[marks.length - 1];
  if (last === "ُ" || last === "ٌ") return CASE_SIGN.damma;
  if (last === "َ" || last === "ً") return CASE_SIGN.fatha;
  if (last === "ِ" || last === "ٍ") return CASE_SIGN.kasra;
  if (last === "ْ") return CASE_SIGN.sukun;
  return null;
}
function startCaseGame(){
  const items = shuffle(caseItems()).slice(0, 8);
  if (!items.length) { openGames(); return; }
  runQuiz({
    title: ui().caseGame, ask: ui().caseGameAsk, items, restart: startCaseGame,
    area: "nahw", lvl: () => 3,
    question: it => `<div class="game-q" lang="ar">${senWithSlot(it.sen, it.ti,
      t => `<b class="target">${t.s.full}</b>`)}</div>`,
    // The four cases in a fixed order, never shuffled: the learner should find
    // marfu' in the same place every round, like the columns of the table.
    options: it => ["marfu", "mansub", "majrur", "majzum"].map(k => ({
      html: `<span lang="ar">${MAMUL_LABEL[k].ar}</span> · ${MAMUL_LABEL[k][state.uiLang === "tr" ? "tr" : "en"]}`,
      ok: k === it.key, k,
    })),
    // the refutation POINTS AT THE WORD: which sign it wears, and what the
    // learner's pick would have required instead.
    whyNot: (it, picked) => {
      const tr = state.uiLang === "tr";
      const lbl = k => MAMUL_LABEL[k][tr ? "tr" : "en"];
      if (picked.k === "majzum" && it.tok.pos !== "verb")
        return tr ? "Cezm yalnız muzâri fiile girer — bir isim asla meczum olmaz."
                  : "Jazm touches only the mudari' verb — a noun is never majzum.";
      const sign = caseSignOf(it.tok.s.full);
      if (sign) {
        const carries = sign.cases.map(lbl).join(" / ");
        return tr
          ? `Kelime <span lang="ar">${sign.ar}</span> (${sign.tr}) ile bitiyor — bu ${carries} alâmetidir; ${lbl(picked.k)} başka bir alâmet isterdi.`
          : `The word ends in <span lang="ar">${sign.ar}</span> (${sign.en}) — the sign of ${carries}; ${lbl(picked.k)} would need a different one.`;
      }
      return tr ? `Buradaki âmil onu ${lbl(picked.k)} yapmıyor — i'râb satırı hangi âmilin amel ettiğini söylüyor.`
                : `The governor here does not make it ${lbl(picked.k)} — the i'rab line below names the one that acts.`;
    },
    why: it => irabWhy(it.tok.irab),
  });
}

// ---------- game: what is this word doing? ----------
// The case game asks marfu' or mansub; this asks the harder question, because
// four different roles can all be marfu'. Answers are read off the Arabic i'rab
// already written for the token — a token whose i'rab names two roles at once
// («خَبَرُ الْمُبْتَدَإِ») is skipped rather than guessed at.
// `note` points at the registry entry whose question test identifies this role —
// the reveal shows the interrogative that would have given the answer away.
const ROLE_KEYS = [
  { k: "mubtada",   re: /مُبْتَدَأ/,        ar: "مُبْتَدَأ",        en: "mubtada",     tr: "mübteda",
    q: { en: "what is being spoken about?", tr: "kendisinden haber verilen nedir?" },
    note: "mubtada-khabar" },
  { k: "khabar",    re: /خَبَر/,            ar: "خَبَر",            en: "khabar",      tr: "haber",
    q: { en: "what is said ABOUT the mubtada?", tr: "mübteda hakkında ne haber veriliyor?" },
    note: "mubtada-khabar" },
  { k: "fail",      re: /فَاعِل/,           ar: "فَاعِل",           en: "fa'il",       tr: "fâil",
    q: { en: "who did it?", tr: "kim yaptı?" },
    not: /نَائِب/, note: "fail" },
  { k: "naib",      re: /نَائِبُ? فَاعِل/,  ar: "نَائِبُ الْفَاعِل", en: "na'ib al-fa'il", tr: "nâib-i fâil",
    q: { en: "to whom was it done — the verb being passive?", tr: "meçhul fiilde iş kime yapıldı?" },
    note: "naib-al-fail" },
  { k: "maful",     re: /مَفْعُولٌ بِه/,    ar: "مَفْعُولٌ بِهِ",   en: "maf'ul bihi", tr: "mef'ûlün bih",
    q: { en: "what/whom did the verb fall upon?", tr: "fiil neyin/kimin üzerine düştü?" },
    note: "maful-bihi" },
  // `inner`: the i'rab hands this role to a letter INSIDE the token
  // («وَالْكَافُ مُضَافٌ إِلَيْهِ» in بِعِلْمِكَ), so the token itself is not it.
  // Some sound items are lost with it; a wrong answer would cost more.
  { k: "mudafilayh",re: /مُضَافٌ إِلَيْهِ/, ar: "مُضَافٌ إِلَيْهِ", en: "mudaf ilayh", tr: "muzâfun ileyh",
    q: { en: "whose? — the word a bare noun leans on", tr: "kimin? neyin? — muzâfın dayandığı isim" },
    inner: /(الْكَافُ|الْهَاءُ|الْيَاءُ|الْمِيمُ|النُّونُ)\s*مُضَافٌ إِلَيْهِ/ },
  { k: "naat",      re: /نَعْت/,            ar: "نَعْت",            en: "na't",        tr: "na't (sıfat)",
    q: { en: "which one? — a describer following its noun in case", tr: "hangisi? — mevsûfuna i'râbda uyan sıfat" } },
  { k: "matuf",     re: /مَعْطُوف/,         ar: "مَعْطُوف",         en: "ma'tuf",      tr: "matûf",
    q: { en: "joined by a conjunction to what came before?", tr: "atıf harfiyle öncekine bağlanan hangisi?" } },
];
const ROLE_BY_KEY = Object.fromEntries(ROLE_KEYS.map(r => [r.k, r]));
// Only nominals are eligible. A verb's i'rab routinely names the role of some
// OTHER word — «فِعْلٌ مَاضٍ، وَالْفَاعِلُ ضَمِيرٌ مُسْتَتِرٌ» is not a fa'il, and
// «حَرْفُ جَرٍّ، وَالْجَارُّ وَالْمَجْرُورُ فِي مَحَلِّ رَفْعٍ خَبَرٌ» is not a khabar.
const NOMINAL_POS = ["noun", "propn", "pron", "adv"];
function roleItems(){
  const out = [];
  STORIES.forEach(st => st.chapters.forEach(ch => ch.sentences.forEach(sen =>
    sen.tokens.forEach((t, ti) => {
      if (!t.irab || !t.irab.ar) return;
      if (!NOMINAL_POS.includes(t.pos)) return;
      const hits = ROLE_KEYS.filter(r =>
        r.re.test(t.irab.ar) && !(r.not && r.not.test(t.irab.ar))
        && !(r.inner && r.inner.test(t.irab.ar)));
      // naib al-fa'il also matches fa'il; that pair is resolved, anything else
      // genuinely ambiguous is left out of the pool.
      if (hits.length !== 1) return;
      out.push({ sen, ti, tok: t, key: hits[0].k });
    }))));
  return out;
}
// Naming the WRONG role is the most instructive miss in nahw: each role has
// its own interrogative, and the pick fails precisely because the sentence
// does not answer that question. State both tests — theirs and the true one.
function roleWhyNot(it, picked){
  const tr = state.uiLang === "tr";
  const got = ROLE_BY_KEY[picked.k];
  const right = ROLE_BY_KEY[it.key];
  const nm = r => `<b lang="ar">${r.ar}</b> (${tr ? r.tr : r.en})`;
  const q = r => r && r.q ? (tr ? r.q.tr : r.q.en) : null;
  if (got && q(got))
    return tr ? `${nm(got)} şu soruya cevap verir: «${q(got)}» — bu kelime ona cevap vermiyor. Buradaki görev ${nm(right)}${q(right) ? `: «${q(right)}»` : ""}.`
              : `${nm(got)} answers «${q(got)}» — this word does not. Its job here is ${nm(right)}${q(right) ? `: «${q(right)}»` : ""}.`;
  return tr ? `Buradaki görev ${nm(right)}${q(right) ? ` — «${q(right)}»` : ""}.`
            : `Its job here is ${nm(right)}${q(right) ? ` — «${q(right)}»` : ""}.`;
}
function startRoleGame(){
  const items = shuffle(roleItems()).slice(0, 8);
  if (!items.length) { openGames(); return; }
  runQuiz({
    title: ui().roleGame, ask: ui().roleGameAsk, items, restart: startRoleGame,
    area: "nahw", lvl: () => 4,
    question: it => `<div class="game-q" lang="ar">${senWithSlot(it.sen, it.ti,
      t => `<b class="target">${t.s.full}</b>`)}</div>`,
    options: it => shuffle([ROLE_BY_KEY[it.key],
        ...shuffle(ROLE_KEYS.filter(r => r.k !== it.key)).slice(0, 3)])
      .map(o => ({
        html: `<span lang="ar">${o.ar}</span> · ${state.uiLang === "tr" ? o.tr : o.en}`,
        ok: o.k === it.key, k: o.k,
      })),
    whyNot: roleWhyNot,
    why: it => irabWhy(it.tok.irab),
    // The interrogative that would have given the answer away.
    after: it => questionTestHtml(ROLE_BY_KEY[it.key].note),
    extras: [{ label: () => `${arSpan("إِعْرَاب")} ${ui().sheetTitle}`,
               run: it => openIrabSheet(it.sen) }],
  });
}

// ---------- the Hamza game: inne or enne? ----------
// Fed by the corpus itself: every stored إِنَّ / أَنَّ token whose i'rab
// explains its own hamza. The blank hides the particle; the learner applies
// Qatr al-Nada's rule (sentence head / qawl / oath → kasra; masdar → fatha)
// and the stored i'rab line is the answer key.
function hamzaItems(){
  const items = [];
  STORIES.forEach(st => st.chapters.forEach(ch => ch.sentences.forEach(sen =>
    sen.tokens.forEach((t, ti) => {
      const b = t.s.bare;
      if ((b === "إن" || b === "أن") && t.irab && /ّ/.test(t.s.full.normalize("NFC")) &&
          sen.tokens.length >= 3)
        items.push({ sen, ti, tok: t, inna: b === "إن", st });
    }))));
  return items;
}
function startHamza(){
  const items = shuffle(hamzaItems()).slice(0, 8);
  if (!items.length) { openGames(); return; }
  runQuiz({
    title: ui().hamzaGame, ask: ui().hamzaAsk, items, restart: startHamza,
    area: "nahw", lvl: () => 3,
    itemKey: it => "hamza:" + it.sen.id + ":" + it.ti,
    question: it => `<div class="game-q" lang="ar">${senWithSlot(it.sen, it.ti, () => "«ـــــ»")}</div>
      <p class="ref-intro">${T(it.sen.translation)}</p>`,
    options: it => shuffle([
      { html: "إِنَّ", ok: it.inna, ar: true, k: "inna" },
      { html: "أَنَّ", ok: !it.inna, ar: true, k: "anna" },
      { html: "أَنْ", ok: false, ar: true, k: "an" },
    ]),
    // the wrong pick gets ITS OWN refutation — why that particle cannot
    // stand here — before the stored i'rab states the truth.
    whyNot: (it, picked) => {
      const tr = state.uiLang === "tr";
      if (picked.k === "an")
        return tr ? "«أَنْ» sâkindir — masdariyyedir ve muzâri fiilden önce gelir; burada isim geliyor, müşeddede lâzımdır."
                  : "Sakin أَنْ is the masdar-maker and stands before a mudari VERB; a noun follows here, so the doubled particle is required.";
      if (picked.k === "anna")
        return tr ? "Fetha, cümlenin bir masdara erimesini ister (-dığını); burada söz kendi başına duruyor — kesra gerekir."
                  : "Fatha needs the clause to melt into a masdar ('that…'); here the sentence stands on its own — kasra is required.";
      return tr ? "Kesra, kendi başına duran cümleyi ister; burada cümle bir fiilin boşluğunu dolduran gizli masdardır — fetha gerekir."
                : "Kasra quotes a standalone sentence; here the clause fills a verb's slot — a masdar in disguise, so fatha is required.";
    },
    why: it => irabWhy(it.tok.irab),
    extras: [{ label: () => `${arSpan("إِنَّ أَمْ أَنَّ؟")} ${state.uiLang === "tr" ? "kaide" : "the rule"}`,
               show: () => !!GRAMMAR["inna-am-anna"],
               run: () => openRef("inna-am-anna") }],
  });
}

// ---------- game: which alaqa licenses this majaz? ----------
// The learner sees the sentence, what the word LITERALLY means, what is

// madrasah gives — and must name the relation. Distractors are drawn from

// and each refutation states the DEFINITION the pick would have required.
function alaqaItems(){

// ---------- the Tahlil tutor: one sentence, walked word by word ----------
// The role game asks about random tokens from anywhere; the tutor does what a
// madrasah hoca does — takes ONE sentence and walks it in order, asking the
// learner to name each word's job before revealing the stored i'rab. Same
// eligibility as roleItems (only tokens whose i'rab names exactly one role),
// grouped by sentence; a sentence qualifies with three or more askable words.
function tahlilSentences(){
  const by = new Map();
  roleItems().forEach(it => {
    if (!by.has(it.sen)) by.set(it.sen, []);
    by.get(it.sen).push(it);

    .map(l => l.sort((a, b) => a.ti - b.ti));
}

  const pools = tahlilSentences();
  if (!pools.length) { openGames(); return; }
  const items = pools[Math.floor(Math.random() * pools.length)];

// ---------- audio ----------
let arVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  arVoice = vs.find(v => v.lang && v.lang.toLowerCase().startsWith("ar")) || null;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function reducedMotion(){
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}
// speakGen is bumped every time a new speech session starts (single-sentence
// tap, or a step in the "Play all" queue). A speech utterance's onend/onerror
// only acts if its captured generation still matches — this stops a stale
// callback (from a cancelled or superseded utterance) from clearing the
// wrong highlight or advancing a play-all run that has already moved on.
let speakGen = 0;

// Clearing the word highlight is its own function because three things end a
// utterance — finishing, erroring, and being superseded — and every one of them
// has to leave the page without a stranded highlighted word.
// Hold the highlighted element rather than re-querying for it: a boundary event
// arrives several times a second, and `.word.speaking` is a compound selector
// with no fast path, so the document-wide sweep walked hundreds of spans to
// find the one element we had just put the class on ourselves.
let spokenEl = null;
function clearSpokenWord(){
  if (spokenEl) { spokenEl.classList.remove("speaking"); spokenEl = null; }
}

// One statement of what gets spoken. The utterance is a single string and the
// page is a row of spans, so the boundary handler needs the character range of
// each token — and deriving that separately from building the string meant two
// descriptions of one format that had to be kept in step by a test.
function sentenceText(sen){
  const offsets = [];
  let text = "";
  // offsets[i] belongs to token i — the index is the token index, so nothing
  // needs to carry it.
  sen.tokens.forEach((t, ti) => {
    offsets.push({ start: text.length, end: text.length + t.s.full.length });
    text += t.s.full + (t.punctAfter || "");
    if (ti < sen.tokens.length - 1) text += " ";
  });
  return { text, offsets };
}

// One shared element for recorded narration. A chapter's audio is one file;
// each sentence plays its own [startMs, endMs] slice of it.
const narration = new Audio();
narration.preload = "auto";
let narrationTimer = null;
function stopNarration(){
  if (narrationTimer) { clearTimeout(narrationTimer); narrationTimer = null; }
  if (!narration.paused) narration.pause();
}
// Plays [a, b] ms of src, then onDone. The stop is belt-and-braces: a timer
// scaled by the playback rate, plus a timeupdate guard for when the tab was
// throttled and the timer drifted past the segment end.
function playSpan(src, span, gen, onDone, onFail){
  const [a, b] = span;
  // Compare resolved URLs, not suffixes: "ch2/intro.mp3".endsWith("intro.mp3")
  // is true, which would keep playing the WRONG chapter's file — and a raw
  // string never matches the element's percent-encoded absolute src, which
  // would reload the file on every single sentence.
  const abs = new URL(src, location.href).href;
  if (narration.src !== abs) narration.src = abs;
  narration.playbackRate = state.rate || 1;
  narration.currentTime = a / 1000;
  const end = () => {
    if (gen !== speakGen) return;
    stopNarration();
    narration.ontimeupdate = null;
    onDone();
  };
  narration.ontimeupdate = () => { if (narration.currentTime * 1000 >= b) end(); };
  narration.onended = end;
  // The timer is a fallback deadline, but it starts counting at CALL time and
  // playback may still be fetching/buffering — so on firing, check the actual
  // position and re-arm for the remainder instead of truncating the sentence.
  const arm = ms => { narrationTimer = setTimeout(deadline, ms); };
  const deadline = () => {
    if (gen !== speakGen) return;
    const at = narration.currentTime * 1000;
    if (at >= b - 40) { end(); return; }
    arm(Math.max(120, (b - at) / (state.rate || 1) + 120));
  };
  const p = narration.play();
  arm((b - a) / (state.rate || 1) + 120);
  // A refused or failed play() must NOT advance the queue — a 404'd audio file
  // would otherwise race through the whole story in microtasks, marking every
  // sentence read. Same contract as the TTS branch's onerror.
  if (p && p.catch) p.catch(() => { if (gen === speakGen) { stopNarration(); onFail(); } });
}

function speak(sen, sec, onDone){
  // Apply the karaoke highlight synchronously, independent of whether audio
  // actually plays — headless/voiceless environments still get the visual cue.
  document.querySelectorAll(".sentence.playing").forEach(s => s.classList.remove("playing"));
  clearSpokenWord();
  sec.classList.add("playing");
  sec.scrollIntoView({ block: "center", behavior: reducedMotion() ? "auto" : "smooth" });
  speakGen++;
  const gen = speakGen;
  const finish = () => {
    if (gen !== speakGen) return; // superseded by a newer speak() call
    sec.classList.remove("playing");
    clearSpokenWord();
    if (onDone) onDone();
  };
  stopNarration();
  // Recorded narration wins over synthesis wherever it exists. No word-level
  // highlight here — a recording has no boundary events, and interpolating one
  // would be a guess; the sentence highlight is the honest cue.
  const real = SEN_AUDIO.get(sen.id);
  if (real) {
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    playSpan(real.src, real.span, gen, finish, () => {
      if (gen !== speakGen) return;
      sec.classList.remove("playing");
      clearSpokenWord();
      if (playAllActive) stopPlayAll();
    });
    return;
  }
  if (!("speechSynthesis" in window)) { setTimeout(finish, 0); return; }
  speechSynthesis.cancel();
  const { text, offsets } = sentenceText(sen);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ar-SA"; u.rate = state.rate || 1;
  if (arVoice) u.voice = arVoice;
  // Follow the voice word by word. Boundary events are best-effort — Chrome
  // fires them, some engines never do, and none of them are contractual — so
  // this is written as pure enrichment: if nothing arrives, the sentence-level
  // highlight is exactly what it always was.
  // renderStory appends words in token order and stamps data-ti, so the NodeList
  // index is the token index — hoisted out of the handler so a boundary event
  // costs an array lookup rather than a selector match.
  const words = sec.querySelectorAll(".word");
  u.onboundary = e => {
    if (gen !== speakGen) return;
    if (e.name && e.name !== "word") return;
    const ti = offsets.findIndex(o => e.charIndex < o.end);
    const el = ti >= 0 && words[ti];
    if (!el || el === spokenEl) return;   // punctuation resolves back to the same word
    clearSpokenWord();
    el.classList.add("speaking");
    spokenEl = el;
  };
  u.onend = finish;
  // A TTS error (e.g. a browser with no voices installed) must not advance the
  // queue — otherwise "Play all" races through the whole story in silence,
  // marking every sentence read. Clear the highlight and stop cleanly instead.
  u.onerror = () => {
    if (gen !== speakGen) return;
    sec.classList.remove("playing");
    clearSpokenWord();
    if (playAllActive) stopPlayAll();
  };
  speechSynthesis.speak(u);
}

// ---------- audiobook: continuous "Play all" queue ----------
let playAllActive = false;
let playAllIdx = -1;

function updatePlayAllBtn(){
  const btn = document.getElementById("playAll");
  if (!btn) return;
  btn.textContent = playAllActive ? ui().stopAll : ui().playAll;
  btn.classList.toggle("on", playAllActive);
  btn.setAttribute("aria-pressed", String(playAllActive));
}

function stopPlayAll(){
  playAllActive = false;
  playAllIdx = -1;
  speakGen++; // invalidate any utterance still in flight
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  stopNarration();
  document.querySelectorAll(".sentence.playing").forEach(s => s.classList.remove("playing"));
  clearSpokenWord();
  updatePlayAllBtn();
}

function playAllStep(idx){
  if (!playAllActive) return; // stopped between steps
  if (idx >= SENTENCE_FLAT.length) { stopPlayAll(); return; }
  playAllIdx = idx;
  const { sen, sec } = SENTENCE_FLAT[idx];
  markRead(sen.id);
  speak(sen, sec, () => playAllStep(idx + 1));
}

function startPlayAll(){
  if (!SENTENCE_FLAT.length) return;
  // Resume from the first unread sentence in this story, falling back to the
  // very start once everything (or nothing) has been read yet.
  const prog = state.progress[CUR ? CUR.id : ""] || {};
  let idx = SENTENCE_FLAT.findIndex(({ sen }) => !prog[sen.id]);
  if (idx === -1) idx = 0;
  playAllActive = true;
  updatePlayAllBtn();
  playAllStep(idx);
}

function stripAr(s){ return (s || "").replace(/[ً-ٰٕ]/g, ""); }
function conjTable(forms, rows, highlight, hlIdx){

// ---------- which cell of the paradigm is this surface form? ----------
// A token walks in wearing clitics — وَاعْفُ is the amr اعْفُ under a waw,
// فَيَجْزِيهِمْ is يَجْزِي between a fa and an object pronoun. Candidates are
// built by peeling proclitics and enclitic pronouns from the VOCALIZED
// surface; an exact NFC pass runs first (it can tell قَضَيْتَ from قَضَيْتُ),
// and a bare-letters pass follows for wasl-hamza changes the vowels hide.
const AR_PROCLITIC = /^(وَ|فَ|سَ|لَ|لِ|بِ)/;
const AR_ENCLITIC = /(هُمَا|كُمَا|هُمْ|هِمْ|هُنَّ|هِنَّ|كُمْ|كُنَّ|هَا|نَا|نِي|هُ|هِ|كَ|كِ|يَ)$/;
function formCandidates(surface){
  let s = (surface || "").replace(/[«»،:.!؟]/g, "").normalize("NFC");
  const out = [s];
  let p = s;
  for (let i = 0; i < 2 && AR_PROCLITIC.test(p); i++) {
    p = p.replace(AR_PROCLITIC, "");
    out.push(p);
  }
  out.slice().forEach(c => {
    const c2 = c.replace(AR_ENCLITIC, "");
    if (c2 && c2 !== c) {
      out.push(c2);
      // the 3pl alif returns when its pronoun leaves: رَأَوْهُ → رَأَوْا
      if (/وْ?$/.test(c2)) out.push(c2 + "ا");
    }
  });
  return [...new Set(out)];
}
function findFormInParadigm(morph, surface){
  if (!morph) return null;
  const cands = formCandidates(surface);
  const bares = cands.map(stripAr);
  const slots = [["amr", morph.amr], ["mazi", morph.mazi], ["mudari", morph.mudari]];
  for (const exact of [true, false]) {
    for (const [tense, forms] of slots) {
      if (!forms) continue;
      for (let i = 0; i < forms.length; i++) {
        const f = (forms[i] || "").normalize("NFC");
        if (exact ? cands.includes(f) : bares.includes(stripAr(f)))
          return { tense, i };
      }
    }
    for (const k of ["mansub", "majzum", "majzum2"]) {
      if (!morph[k]) continue;
      const f = morph[k].normalize("NFC");
      if (exact ? cands.includes(f) : bares.includes(stripAr(f)))
        return { tense: k, i: 0 };
    }
  }
  return null;
}
// The cell's name, madrasah-style: tense + person, in all three tongues.
const CELL_TENSE = {

};
const CELL_PERSON = [

  { en: "you (pl)",     tr: "siz" },
  { en: "you (f)",      tr: "sen (dişil)" },{ en: "you two (f)",  tr: "ikiniz (dişil)" },
  { en: "you (pl, f)",  tr: "siz (dişil)" },
  { en: "I",            tr: "ben" },        { en: "we",           tr: "biz" },
];
const CELL_PERSON_AMR = [

// The other half of the Emsile: not the person-by-person conjugation
// (muttarida) but the fourteen FORMS built from one verb — the first table a
// madrasah student memorizes. Order and Turkish names follow the classical
// Emsile tables (see research/sources/). The governed forms come from the
// package data, never derived here, because hollow and defective verbs do not

      || !(morph.amr && morph.amr.length)) return null;
  const mazi = morph.mazi[0], mudari = morph.mudari[0], amr = morph.amr[0];

    { ar: mudari,                    tr: "Fiil-i muzâri",              en: "Present / future" },
    { ar: morph.masdar,              tr: "Masdar (gayr-i mîmî)",       en: "Verbal noun" },
    { ar: "فَهُوَ " + morph.fail,     tr: "İsm-i fâil",                 en: "Active participle" },
    ...(morph.maful ? [{ ar: "وَذَاكَ " + morph.maful, tr: "İsm-i mef'ûl", en: "Passive participle" }] : []),
    { ar: "لَمْ " + morph.majzum,     tr: "Cahd-ı mutlak",              en: "Absolute negation of the past" },
    { ar: "لَمَّا " + morph.majzum,   tr: "Cahd-ı müstağrak",           en: "Negation of the past, up to now" },
    { ar: "مَا " + mudari,           tr: "Nefy-i hâl",                 en: "Negation of the present" },
    { ar: "لَا " + mudari,           tr: "Nefy-i istikbâl",            en: "Negation of the future" },
    { ar: "لَنْ " + morph.mansub,     tr: "Te'kîd-i nefy-i istikbâl",   en: "Emphatic negation of the future" },

    { ar: "لَا " + morph.majzum,      tr: "Nehy-i gâib",                en: "Third-person prohibition" },

const SJ_NAQ = {
  i: { sg: "ِي", du: "ِيَانِ", pl: "ُونَ", fpl: "ِينَ", f2: "ِينَ", man: "ِيَ", maj: "ِ" },
  u: { sg: "ُو", du: "ُوَانِ", pl: "ُونَ", fpl: "ُونَ", f2: "ِينَ", man: "ُوَ", maj: "ُ" },
  a: { sg: "َى", du: "َيَانِ", pl: "َوْنَ", fpl: "َيْنَ", f2: "َيْنَ", man: "َى", maj: "َ" },
};
function sjMudariNaqis(yv, bb, typ){
  const e = SJ_NAQ[typ], y = "ي"+yv, t = "ت"+yv, a1 = "أ"+yv, n = "ن"+yv;
  return [y+bb+e.sg, y+bb+e.du, y+bb+e.pl, t+bb+e.sg, t+bb+e.du, y+bb+e.fpl, t+bb+e.sg,
          t+bb+e.du, t+bb+e.pl, t+bb+e.f2, t+bb+e.du, t+bb+e.fpl, a1+bb+e.sg, n+bb+e.sg].map(sjN);
}
function sjAmr(L, S){
  S = S === undefined ? L : S;
  return [S+"ْ", L+"َا", L+"ُوا", L+"ِي", L+"َا", S+"ْنَ"].map(sjIdgham);
}
function sjAmrNaqis(bb, typ){
  if (typ === "i") return [bb+"ِ", bb+"ِيَا", bb+"ُوا", bb+"ِي", bb+"ِيَا", bb+"ِينَ"].map(sjN);
  if (typ === "u") return [bb+"ُ", bb+"ُوَا", bb+"ُوا", bb+"ِي", bb+"ُوَا", bb+"ُونَ"].map(sjN);
  return [bb+"َ", bb+"َيَا", bb+"َوْا", bb+"َيْ", bb+"َيَا", bb+"َيْنَ"].map(sjN);
}
const SJ_BAB1 = {
  1: { v1: "َ", v2: "ُ", model: "نَصَرَ يَنْصُرُ", tr: "fetha–damme", en: "a–u" },
  2: { v1: "َ", v2: "ِ", model: "ضَرَبَ يَضْرِبُ", tr: "fetha–kesre", en: "a–i" },
  3: { v1: "َ", v2: "َ", model: "فَتَحَ يَفْتَحُ", tr: "fethateyn",   en: "a–a" },
  4: { v1: "ِ", v2: "َ", model: "سَمِعَ يَسْمَعُ", tr: "kesre–fetha", en: "i–a" },
  5: { v1: "ُ", v2: "ُ", model: "حَسُنَ يَحْسُنُ", tr: "dammeteyn",   en: "u–u" },
  6: { v1: "ِ", v2: "ِ", model: "حَسِبَ يَحْسِبُ", tr: "kesreteyn",   en: "i–i" },
};
function sjWasl(v){ return v === "ُ" ? "اُ" : "اِ"; }
// governed forms from a sound-style core
function sjGov(yv, L, S){
  S = S === undefined ? L : S;
  return { mansub: sjN("ي"+yv+L+"َ"), majzum: sjN("ي"+yv+S+"ْ"), majzum2: sjN("ت"+yv+S+"ْ") };
}
function sjGovNaqis(yv, bb, typ){
  const e = SJ_NAQ[typ];
  return { mansub: sjN("ي"+yv+bb+e.man), majzum: sjN("ي"+yv+bb+e.maj), majzum2: sjN("ت"+yv+bb+e.maj) };
}
function sjGovGem(yv, G){
  return { mansub: sjN("ي"+yv+G+"َ"), majzum: sjN("ي"+yv+G+"َ"), majzum2: sjN("ت"+yv+G+"َ") };
}
// ---------- the RUBA'I engine: the quadriliteral babs -------------------
// The 35-bab table (research/sources/sarf-35-bab-tablosu.txt) counts 18
// triliteral babs and SEVENTEEN quadriliteral ones — and the app taught none
// of them until now. They need no data: a four-letter root conjugates like a
// sound Form II, the mudari' wearing damma on its prefix for the mujarrad and
// fatha for the augmented. MULHAQ roots (حَوْقَلَ، بَيْطَرَ، جَلْبَبَ…) are the
// same shape wearing a different pedigree, so one engine answers for all.
const RUBAI_BABS = {
  R1: { key: "R1", ar: "فَعْلَلَ يُفَعْلِلُ", model: "دَحْرَجَ يُدَحْرِجُ",
        tr: "Rubâî mücerred", en: "Bare quadriliteral" },
  R2: { key: "R2", ar: "تَفَعْلَلَ يَتَفَعْلَلُ", model: "تَدَحْرَجَ يَتَدَحْرَجُ",
        tr: "Rubâî mezîd (tefa'lül)", en: "Augmented — reflexive" },
  R3: { key: "R3", ar: "افْعَنْلَلَ يَفْعَنْلِلُ", model: "اِحْرَنْجَمَ يَحْرَنْجِمُ",
        tr: "Rubâî mezîd (if'inlâl)", en: "Augmented — with nun" },
  R4: { key: "R4", ar: "افْعَلَلَّ يَفْعَلِلُّ", model: "اِقْشَعَرَّ يَقْشَعِرُّ",
        tr: "Rubâî mezîd (if'ilâl, muzâaf)", en: "Augmented — doubled last" },
};
// the six mulhaq shapes the books name, keyed by their surface skeleton
const RUBAI_MULHAQ = {
  "حوقل": "مُلْحَقٌ بِفَعْلَلَ — فَوْعَلَ", "بيطر": "مُلْحَقٌ بِفَعْلَلَ — فَيْعَلَ",
  "جهور": "مُلْحَقٌ بِفَعْلَلَ — فَعْوَلَ", "عثير": "مُلْحَقٌ بِفَعْلَلَ — فَعْيَلَ",
  "جلبب": "مُلْحَقٌ بِفَعْلَلَ — فَعْلَلَ بِتَكْرِيرِ اللَّامِ",
  "سلقى": "مُلْحَقٌ بِفَعْلَلَ — فَعْلَى",
};
function rubaiDerive(letters, bab){
  if (!letters || letters.length !== 4) return { ok: false, reason: "len" };
  const [f, a, l, m] = letters;
  const B = RUBAI_BABS[bab] || RUBAI_BABS.R1;
  const mulhaq = RUBAI_MULHAQ[letters.join("")] || null;
  const done = (o) => ({ ok: true, wazn: sjN(B.ar + " — " + B.model),
                         babLabel: B, mulhaq, ...o });
  if (bab === "R1") {
    // دَحْرَجَ يُدَحْرِجُ — the prefix wears DAMMA, the ayn of the mudari kasra
    const v = f+"َ"+a+"ْ"+l+"َ"+m, core = f+"َ"+a+"ْ"+l+"ِ"+m;
    return done({ mazi: sjMazi14(f+"َ"+a+"ْ"+l+"َ"+m), mudari: sjMudari14("ُ", core),
      amr: sjAmr(core), ...sjGov("ُ", core),
      fail: sjN("مُ"+core), maful: sjN("مُ"+f+"َ"+a+"ْ"+l+"َ"+m),
      masdar: sjN(f+"َ"+a+"ْ"+l+"َ"+m+"َة"),
      note: "الرُّبَاعِيُّ الْمُجَرَّدُ: مُضَارِعُهُ بِضَمِّ حَرْفِ الْمُضَارَعَةِ، وَمَصْدَرُهُ فَعْلَلَةٌ وَفِعْلَالٌ." });
  }
  if (bab === "R2") {
    // تَدَحْرَجَ يَتَدَحْرَجُ — ta prefixed, the prefix vowel back to fatha
    const v = "تَ"+f+"َ"+a+"ْ"+l+"َ"+m;
    return done({ mazi: sjMazi14(v), mudari: sjMudari14("َ", v), amr: sjAmr(v),
      ...sjGov("َ", v), fail: sjN("مُتَ"+f+"َ"+a+"ْ"+l+"ِ"+m),
      maful: sjN("مُتَ"+f+"َ"+a+"ْ"+l+"َ"+m),
      masdar: sjN("تَ"+f+"َ"+a+"ْ"+l+"ُ"+m),
      note: "مَزِيدُ الرُّبَاعِيِّ بِالتَّاءِ: مُطَاوِعُ فَعْلَلَ — دَحْرَجْتُهُ فَتَدَحْرَجَ." });
  }
  if (bab === "R3") {
    // اِحْرَنْجَمَ — a nun before the third radical, hamzat al-wasl in front
    const core = f+"ْ"+a+"َنْ"+l+"ِ"+m, longM = f+"ْ"+a+"َنْ"+l+"َ"+m;
    return done({ mazi: sjMazi14("اِ"+longM), mudari: sjMudari14("َ", core),
      amr: sjAmr("اِ"+core), ...sjGov("َ", core),
      fail: sjN("مُ"+core), maful: sjN("مُ"+longM),
      masdar: sjN("اِ"+f+"ْ"+a+"ِنْ"+l+"َا"+m),
      note: "مَزِيدُ الرُّبَاعِيِّ بِالنُّونِ وَهَمْزَةِ الْوَصْلِ — اِحْرَنْجَمَتِ الْإِبِلُ: اجْتَمَعَتْ." });
  }
  if (bab === "R4") {
    // اِقْشَعَرَّ — the LAST radical doubles; contracted before vowels, broken
    // before consonants, exactly as the triliteral geminate behaves
    const G = f+"ْ"+a+"َ"+l+"ِ"+m+"ّ", S = f+"ْ"+a+"َ"+l+"ْ"+m;
    // اِقْشَعَرَّ contracts before a vowel and BREAKS before a consonant —
    // اِقْشَعْرَرْتُ, the sukun falling on the third radical, not the second.
    return done({ mazi: sjMazi14("اِ"+f+"ْ"+a+"َ"+l+"َ"+m+"ّ", "اِ"+f+"ْ"+a+"َ"+l+"ْ"+m+"َ"+m),
      mudari: sjMudari14("َ", G, S+"ِ"+m),
      // the amr of a wasl-verb never opens bare: هَمْزَةُ الْوَصْلِ carries it
      amr: ["اِ"+G+"َ", "اِ"+G+"َا", "اِ"+G+"ُوا", "اِ"+G+"ِي", "اِ"+G+"َا",
            "اِ"+S+"ِ"+m+"ْنَ"].map(sjN),
      ...sjGovGem("َ", G), fail: sjN("مُ"+G), maful: sjN("مُ"+G),
      masdar: sjN("اِ"+f+"ْ"+a+"ِ"+l+"ْ"+m+"َا"+m),
      note: "مَزِيدُ الرُّبَاعِيِّ بِتَضْعِيفِ اللَّامِ — اِقْشَعَرَّ الْجِلْدُ، وَالْجَزْمُ بِالْفَتْحِ." });
  }
  return { ok: false, reason: "bab" };
}

// ---------- where i'lal must NOT run --------------------------------------
// The engines apply qalb and hadhf wherever the shape invites them, and for
// most roots that is right. But the books name a class where it is WRONG:
// أَفْعَالُ الْعُيُوبِ وَالْأَلْوَانِ — a hollow verb of bab سَمِعَ meaning a defect
// or a colour keeps its weak letter SOUND (عَوِرَ يَعْوَرُ, never عَارَ يَعَارُ),
// because its ism fa'il rides أَفْعَل (أَعْوَر) rather than فَاعِل, and the
// masdar فَعَل is sound. WHICH roots carry that meaning is lexical — nothing
// derives it — so the table holds only the roots; the conjugation that
// follows is pure rule. This is the project's line exactly: automate the
// derivable, store only what cannot be derived.
const SOUND_HOLLOW = {
  "عور": { ar: "الْعَوَر", en: "one-eyedness", tr: "tek gözlülük" },
  "حول": { ar: "الْحَوَل", en: "a squint", tr: "şaşılık" },
  "صيد": { ar: "الصَّيَد", en: "a stiff neck", tr: "boyun tutukluğu" },
  "غيد": { ar: "الْغَيَد", en: "softness of limb", tr: "endam yumuşaklığı" },
  "هيف": { ar: "الْهَيَف", en: "slenderness of waist", tr: "ince bellilik" },
  "حور": { ar: "الْحَوَر", en: "deep blackness of the eye", tr: "gözün siyahlığı" },
};
function soundHollowNote(key){
  const e = SOUND_HOLLOW[key];
  if (!e) return null;
  return `أَفْعَالُ الْعُيُوبِ وَالْأَلْوَانِ لَا تُعَلُّ: ${e.ar} مَصْدَرٌ صَحِيحٌ، وَاسْمُ الْفَاعِلِ عَلَى أَفْعَلَ لَا عَلَى فَاعِلٍ.`;
}

// sarfDerive(cls, form, bab) → {ok, mazi, mudari, amr, mansub…, fail, maful?,
// masdar?, wazn, note} or {ok:false, reason}. cls comes from nakilClass.
function sarfDerive(cls, form, bab){
  const [f, a, l] = cls.rs, t = cls.type;
  const glide = t === "ajwaf" ? a : t === "naqis" ? (l === "ى" ? "ي" : l) : null;
  const no = reason => ({ ok: false, reason });
  const V = SJ_BAB1[bab] || SJ_BAB1[1];

  if (form === "I") {
    if (t === "sound") {
      const v = f+"َ"+a+V.v1+l, core = f+"ْ"+a+V.v2+l, A = sjWasl(V.v2)+core;
      return { ok: true, wazn: sjN(`فَع${V.v1}لَ يَفْع${V.v2}لُ`),
        mazi: sjMazi14(v), mudari: sjMudari14("َ", core), amr: sjAmr(A),
        ...sjGov("َ", core), fail: sjN(f+"َا"+a+"ِ"+l), maful: sjN("مَ"+f+"ْ"+a+"ُو"+l) };
    }
    if (t === "gem") {
      if (![1, 2, 4].includes(bab)) return no("gem-bab");
      const G = f+V.v2+a+"ّ", S = f+"ْ"+a+V.v2+l;
      return { ok: true, wazn: sjN(`فَع${V.v1}لَ يَفْع${V.v2}لُ — مُضَاعَفٌ`),
        mazi: sjMazi14(f+"َ"+a+"ّ", f+"َ"+a+"َ"+l), mudari: sjMudari14("َ", G, S),
        amr: [G+"َ", G+"َا", G+"ُوا", G+"ِي", G+"َا", sjWasl(V.v2)+S+"ْنَ"].map(sjN),
        ...sjGovGem("َ", G), fail: sjN(f+"َا"+a+"ّ"), maful: sjN("مَ"+f+"ْ"+a+"ُو"+l),
        note: "مُضَاعَفٌ: الْجَزْمُ بِالْفَتْحِ، وَيَجُوزُ الْفَكُّ." };
    }
    if (t === "ajwaf") {
      // the defect-and-colour class refuses i'lal: conjugate it SOUND.
      const shKey = cls.rs.join("").replace(/ى/g, "ي");
      if (bab === 4 && SOUND_HOLLOW[shKey]) {
        const v = f+"َ"+a+"ِ"+l, core = f+"ْ"+a+"َ"+l, A = "اِ"+core;
        return { ok: true, wazn: sjN("فَعِلَ يَفْعَلُ — أَجْوَفُ لَا يُعَلُّ"),
          mazi: sjMazi14(v), mudari: sjMudari14("َ", core), amr: sjAmr(A),
          ...sjGov("َ", core),
          fail: sjN("أَ"+f+"ْ"+a+"َ"+l), maful: null,
          masdar: sjN(f+"َ"+a+"َ"+l),
          note: soundHollowNote(shKey) };
      }
      if (bab === 1 && glide !== "و") return no("bab-glide");
      if (bab === 2 && glide !== "ي") return no("bab-glide");
      if (![1, 2, 4].includes(bab)) return no("ajwaf-bab");
      const sv = bab === 1 ? "ُ" : "ِ";                 // قُلْتَ، بِعْتَ، خِفْتَ
      const mid = bab === 1 ? "ُو" : bab === 2 ? "ِي" : "َا";
      const L = f+mid+l, S = f+(bab === 4 ? "َ" : sv)+l;
      return { ok: true, wazn: sjN(`فَع${V.v1}لَ يَفْع${V.v2}لُ — أَجْوَفُ`),
        mazi: sjMazi14(f+"َا"+l, f+(bab === 4 ? "ِ" : sv)+l),
        mudari: sjMudari14("َ", L, S), amr: sjAmr(L, S), ...sjGov("َ", L, S),
        fail: sjN(f+"َائِ"+l),
        maful: sjN(glide === "و" ? "مَ"+f+"ُو"+l : "مَ"+f+"ِي"+l) };
    }
    if (t === "naqis") {
      if (bab === 1 && glide !== "و") return no("bab-glide");
      if (bab === 2 && glide !== "ي") return no("bab-glide");
      if (![1, 2, 4].includes(bab)) return no("naqis-bab");
      const b = f+"َ"+a, bb = f+"ْ"+a;
      const typ = bab === 1 ? "u" : bab === 2 ? "i" : "a";
      const mazi = bab === 4 ? sjMaziKasra(f+"َ"+a+"ِ", f+"َ"+a+"ُوا")
                             : sjMaziNaqis(b + "َ", glide);
      return { ok: true, wazn: sjN(`فَع${V.v1}لَ يَفْع${V.v2}لُ — نَاقِصٌ`),
        mazi, mudari: sjMudariNaqis("َ", bb, typ),
        amr: sjAmrNaqis(sjWasl(typ === "u" ? "ُ" : "ِ") + bb, typ),
        ...sjGovNaqis("َ", bb, typ), fail: sjN(f+"َا"+a+"ٍ"),
        maful: sjN(typ === "u" ? "مَ"+bb+"ُوّ" : "مَ"+bb+"ِيّ") };
    }
    if (t === "mithal") {
      if (glideOfMithal(f) === "ي" || ![2, 3, 4, 6].includes(bab)) {
        if (f === "ي") return no("mithal-ya");        // keep scope honest
        if (![2, 3, 4, 6].includes(bab)) return no("mithal-bab");
      }
      const drops = bab !== 4;                         // يَعِدُ يَقَعُ يَرِثُ — but يَوْجَلُ keeps
      const v = f+"َ"+a+V.v1+l;
      if (drops) {
        const core = a+V.v2+l;
        return { ok: true, wazn: sjN(`فَع${V.v1}لَ يَع${V.v2}لُ — مِثَالٌ تُحْذَفُ وَاوُهُ`),
          mazi: sjMazi14(v), mudari: sjMudari14("َ", core), amr: sjAmr(core),
          ...sjGov("َ", core), fail: sjN(f+"َا"+a+"ِ"+l), maful: sjN("مَ"+f+"ْ"+a+"ُو"+l),
          note: "مِثَالٌ وَاوِيٌّ: تَسْقُطُ الْوَاوُ فِي الْمُضَارِعِ وَالْأَمْرِ." };
      }
      const core = f+"ْ"+a+"َ"+l;                      // يَوْجَلُ
      return { ok: true, wazn: sjN("فَعِلَ يَفْعَلُ — مِثَالٌ"),
        mazi: sjMazi14(v), mudari: sjMudari14("َ", core),
        amr: sjAmr("اِي"+a+"َ"+l), ...sjGov("َ", core),
        fail: sjN(f+"َا"+a+"ِ"+l), maful: sjN("مَ"+f+"ْ"+a+"ُو"+l),
        note: "مِثَالٌ يَبْقَى وَاوُهُ فِي الْمُضَارِعِ؛ وَفِي الْأَمْرِ اِوْ ← اِي." };
    }
    return no("class");
  }

  // ---- derived babs: II III IV V VI VII VIII X (the corpus's working set)
  const D = {
    II:  { pre: "", yv: "ُ" }, III: { pre: "", yv: "ُ" }, IV: { pre: "أَ", yv: "ُ" },
    V:   { pre: "تَ", yv: "َ" }, VI: { pre: "تَ", yv: "َ" }, VII: { pre: "اِنْ", yv: "َ" },
    VIII:{ pre: "", yv: "َ" }, X: { pre: "اِسْتَ", yv: "َ" },
  }[form];
  if (!D) return no("form");
  const yv = D.yv;
  const asm = (v, core, A, extra) => ({ ok: true, mazi: sjMazi14(v),
    mudari: sjMudari14(yv, core), amr: sjAmr(A), ...sjGov(yv, core), ...extra });
  const asmNaq = (bb, amrBb, typ, extra) => ({ ok: true, mazi: sjMaziNaqis(bb + "َ", "ي"),
    mudari: sjMudariNaqis(yv, bb, typ), amr: sjAmrNaqis(amrBb, typ),
    ...sjGovNaqis(yv, bb, typ), ...extra });
  const P = (c, x) => ({ fail: sjN("مُ"+c), maful: x ? sjN("مُ"+x) : undefined });

  if (form === "II" || form === "V") {
    const p = form === "V" ? "تَ" : "";
    const wazn = form === "V" ? "تَفَعَّلَ يَتَفَعَّلُ" : "فَعَّلَ يُفَعِّلُ";
    if (t === "naqis") return { ...asmNaq(p+f+"َ"+a+"ّ", p+f+"َ"+a+"ّ",
      form === "V" ? "a" : "i",
      { wazn: sjN(wazn+" — نَاقِصٌ"),
        masdar: sjN(form === "V" ? "تَ"+f+"َ"+a+"ٍّ" : "تَ"+f+"ْ"+a+"ِيَة"),
        ...P(p+f+"َ"+a+"ٍّ") }) };
    const v = p+f+"َ"+a+"َّ"+l, core = form === "V" ? v : p+f+"َ"+a+"ِّ"+l;
    return { ...asm(v, core, core, { wazn: sjN(wazn),
      masdar: sjN(form === "V" ? "تَ"+f+"َ"+a+"ُّ"+l : "تَ"+f+"ْ"+a+"ِي"+l),
      ...P(core, p+f+"َ"+a+"َّ"+l) }) };
  }
  if (form === "III" || form === "VI") {
    const p = form === "VI" ? "تَ" : "";
    const wazn = form === "VI" ? "تَفَاعَلَ يَتَفَاعَلُ" : "فَاعَلَ يُفَاعِلُ";
    if (t === "naqis") return { ...asmNaq(p+f+"َا"+a, p+f+"َا"+a,
      form === "VI" ? "a" : "i",
      { wazn: sjN(wazn+" — نَاقِصٌ"),

                          "تَفَاعَلَ": "VI", "اِنْفَعَلَ": "VII", "اِفْتَعَلَ": "VIII",
                          "اِسْتَفْعَلَ": "X", "اسْتَفْعَلَ": "X" };
// What form/bab does the corpus recite this morphology entry in? Shared by the
// audit and by the Sarf Lab's root lookup, so the two can never disagree.
function sjAttested(m){
  const head = sjN((m.wazn || "").split(/\s+/)[0]);
  const form = SJ_FORM_OF_HEAD[head];
  if (form) return { form, bab: null };
  const key = Object.keys(SJ_BAB1_OF_MODEL).find(k => sjN(m.bab || "").includes(sjN(k)));
