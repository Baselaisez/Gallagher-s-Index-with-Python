i (مَكْتُوب «yazılmış»), mezîd bâbların hepsinden ise ism-i fâille aynı مُ'lu şekil, fakat sondan önce FETHA ile — مُخْرَج «çıkarılan», مُخْرِج «çıkaran» karşısında. Yapanla yapılan arasındaki bütün farkı tek hareke taşır. Birgivî'nin bu aileden saydığı ikinci kıyasî âmildir ve fiilinin amelini MEÇHUL olarak yapar: nâib-i fâil ref eder — ism-i fâille aynı iki şartla: hâl-istikbâl manası ve i'timâd. فَضْلٌ … مَشْرُوطٌ لِأَحَدِ الْمُتَعَاقِدَيْنِ'de ism-i mef'ûl فَضْل'i vasıflar; nâib-i fâili o fazlalığa dönen gizli هُوَ zamiridir ve لِ'li ifade ona tıpkı شُرِطَ fiiline asılır gibi asılır. الـ'lı şekil kayıtsız amel eder; meçhul fiilli bir الَّذِي hükmünde okunur: الْمُخْرَجُ مِنَ الْعَدَمِ «yokluktan çıkarılmış olan» demektir; câr-mecrûr ona أُخْرِجَ fiiline bağlanır gibi bağlanır."},"plain":{"en":"The noun for what the action was done to — «written», «stipulated» — and it takes a deputy subject exactly as a passive verb would.","tr":"İşin kendisine yapıldığını bildiren isim — «yazılmış», «şart koşulmuş» — ve tıpkı meçhul fiil gibi nâib-i fâil alır."},"sources":["الكافية (ابن الحاجب) — اسم المفعول","العوامل (البركوي) — العامل القياسي","قطر الندى (ابن هشام)"],"examples":[{"ar":"وَالْمُحْدَثُ هُوَ الْمُخْرَجُ مِنَ الْعَدَمِ إِلَى الْوُجُودِ.","gloss":{"en":"The الـ-form governing unconditionally: الْمُخْرَج is the ism maf'ul of أَخْرَجَ, and the two jarr phrases attach to it exactly as they would to the passive verb أُخْرِجَ.","tr":"Kayıtsız amel eden الـ'lı şekil: الْمُخْرَج, أَخْرَجَ'nın ism-i mef'ûlüdür ve iki câr-mecrûr ona tıpkı meçhul أُخْرِجَ fiiline bağlanır gibi bağlanır."},"src":"aqaid-ahl-al-sunna"},{"ar":"وَالرِّبَا فَضْلٌ خَالٍ عَنْ عِوَضٍ مَشْرُوطٌ لِأَحَدِ الْمُتَعَاقِدَيْنِ.","gloss":{"en":"مَشْرُوط as an adjective still does its verb's passive work: its deputy subject is the hidden pronoun, and the لِ-phrase hangs from it as from شُرِطَ.","tr":"Sıfat olan مَشْرُوط, fiilinin meçhul amelini yapmayı sürdürür: nâib-i fâili gizli zamirdir; لِ'li ifade ona شُرِطَ'ye asılır gibi asılır."},"src":"kitab-al-buyu"},{"ar":"مُخْرِجٌ / مُخْرَجٌ.","gloss":{"en":"The pair that trains the eye: kasra before the end is the doer, fatha the done-to. Every augmented bab makes both the same way.","tr":"Gözü eğiten çift: sondan önce kesre yapan, fetha yapılandır. Her mezîd bâb ikisini de aynı yolla kurar."},"src":null}],"mistakes":[{"wrong":"الْمُخْرِجُ مِنَ الْعَدَمِ (بِالْكَسْرِ) بِمَعْنَى مَا أُخْرِجَ","right":"الْمُخْرَجُ (بِالْفَتْحِ) — فَالْكَسْرُ لِلْفَاعِلِ وَالْفَتْحُ لِلْمَفْعُولِ","why":{"en":"In the augmented babs one vowel separates the bringer-out from the brought-out. Reading the kasra where the sense needs the fatha turns the created thing into its own creator.","tr":"Mezîd bâblarda çıkaranla çıkarılanı tek hareke ayırır. Mana fetha isterken kesre okumak, yaratılmışı kendi yaratıcısı hâline getirir."}},{"wrong":"اسْمُ الْمَفْعُولِ يَنْصِبُ مَفْعُولًا بِهِ","right":"يَرْفَعُ نَائِبَ فَاعِلٍ، كَفِعْلِهِ الْمَبْنِيِّ لِلْمَجْهُولِ","why":{"en":"Its verb-work is the passive's: the thing acted on has moved into the subject's place, so there is a deputy subject in raf', not an object in nasb.","tr":"Ameli meçhul fiilinkidir: iş yapılan şey fâilin yerine geçmiştir; nasb edilen mef'ûl değil, ref edilen nâib-i fâil vardır."}},{"wrong":"مَفْعُولٌ وَزْنُ اسْمِ الْمَفْعُولِ مِنْ كُلِّ فِعْلٍ","right":"مَفْعُولٌ لِلثُّلَاثِيِّ الْمُجَرَّدِ فَقَطْ؛ وَلِلْمَزِيدِ صِيغَةُ الْمُضَارِعِ بِمِيمٍ وَفَتْحٍ","why":{"en":"*مَخْرُوج from أَخْرَجَ is the classic slip. The مَفْعُول pattern serves only the bare triliteral; the augmented babs build on the mudari' with مُ and fatha: مُخْرَج.","tr":"أَخْرَجَ'dan *مَخْرُوج üretmek klasik hatadır. مَفْعُول vezni yalnız sülâsî mücerrede aittir; mezîd bâblar muzâriden مُ ve fetha ile kurar: مُخْرَج."}}]},"ism-maqsur-manqus":{"title":{"ar":"الِاسْمُ الْمَقْصُورُ وَالْمَنْقُوص","en":"Nouns ending in a weak letter","tr":"İsm-i maksûr ve mankûs"},"level":5,"group":"nahw","explanation":{"en":"Two classes of noun cannot carry their case vowel where you expect it. The MAQSUR ends in a fixed alif — مَعْنًى, هُدًى, مُصْطَفَى. No vowel can sit on an alif, so all three cases are مُقَدَّر, implied: raf', nasb and jarr look identical and only the governor tells you which one you have. The MANQUS ends in an unstressed ي — الْمُدَّعِي, الْقَاضِي, الرَّامِي. Here raf' and jarr are implied on the ي, but NASB appears normally: رَأَيْتُ الْقَاضِيَ, with a visible fatha. That asymmetry is the whole point of learning the pair. One further habit of the manqus: when it is indefinite and not in nasb, the ي is dropped and tanwin takes its place — قَاضٍ, مُدَّعٍ, رَامٍ; the ي returns with ال or in idafa.","tr":"İki isim sınıfı, i'rab harekesini beklendiği yerde taşıyamaz. MAKSÛR, sabit bir elif ile biter: مَعْنًى، هُدًى، مُصْطَفَى. Elif üzerine hareke gelemediği için üç i'rab da takdîrîdir; ref, nasb ve cer aynı görünür ve hangisi olduğunu ancak âmil gösterir. MANKÛS ise harekesiz bir yâ ile biter: الْمُدَّعِي، الْقَاضِي، الرَّامِي. Burada ref ve cer yâ üzerinde takdîrîdir, fakat NASB açıkça görünür: رَأَيْتُ الْقَاضِيَ, fetha zâhirdir. Bu ikisini birlikte öğrenmenin asıl sebebi bu farktır. Mankûsun bir âdeti daha vardır: nekre olup nasb hâlinde değilken yâ düşer ve yerine tenvin gelir — قَاضٍ، مُدَّعٍ، رَامٍ; ال ile veya izafette yâ geri döner."},"plain":{"en":"Nouns ending in a weak letter that cannot carry a case vowel, so all three cases look identical and only the governor tells you which one it is.","tr":"Sonu illet harfiyle biten ve hareke taşıyamayan isimler; üç i'rab da aynı görünür, hangisi olduğunu ancak âmil söyler."},"sources":["الكافية (ابن الحاجب)","مراح الأرواح","قطر الندى (ابن هشام)"],"examples":[{"ar":"وَالْإِلْهَامُ إِلْقَاءُ مَعْنًى فِي الْقَلْبِ.","gloss":{"en":"…the casting of a meaning into the heart — مَعْنًى is a mudaf ilayh in jarr with an implied kasra.","tr":"…kalbe bir mananın bırakılması — مَعْنًى takdîrî kesre ile mecrûr muzâfun ileyhtir."},"src":"aqaid-ahl-al-sunna"},{"ar":"الْبَيِّنَةُ لِلْمُدَّعِي.","gloss":{"en":"The proof is on the claimant — a manqus in jarr, the kasra implied on the ي.","tr":"Beyyine davacıya aittir — cer hâlinde mankûs, kesre yâ üzerinde takdîrîdir."},"src":"aqaid-ahl-al-sunna"},{"ar":"الْعَالَمُ مَا سِوَى اللهِ تَعَالَى.","gloss":{"en":"…what is other than Allah — سِوَى is a maqsur adverb in nasb with an implied fatha.","tr":"…Allah'ın dışındaki — سِوَى takdîrî fetha ile mansub maksûr zarftır."},"src":null}],"mistakes":[{"wrong":"رَأَيْتُ الْقَاضِي","right":"رَأَيْتُ الْقَاضِيَ","why":{"en":"The manqus is the one weak-ended noun that DOES show nasb. Leaving the ي bare hides the only case it can display.","tr":"Mankûs, nasbı gösteren tek illetli isimdir. Yâyı harekesiz bırakmak, gösterebildiği tek i'rabı gizler."}},{"wrong":"جَاءَ قَاضِي","right":"جَاءَ قَاضٍ","why":{"en":"An indefinite manqus in raf' or jarr drops its ي and takes tanwin instead.","tr":"Nekre mankûs, ref ve cer hâlinde yâsını düşürür ve yerine tenvin alır."}},{"wrong":"رَأَيْتُ الْفَتَى — بِفَتْحَةٍ ظَاهِرَةٍ","right":"الْفَتَى مَنْصُوبٌ بِفَتْحَةٍ مُقَدَّرَةٍ عَلَى الْأَلِفِ لِلتَّعَذُّرِ","why":{"en":"A maqsur shows nothing at all. Writing a fatha on the alif is not possible — the case is implied in every position.","tr":"Maksûr hiçbir i'rabı göstermez. Elif üzerine fetha yazılamaz; her hâlde i'rab takdîrîdir."}}]},"ism-mawsul":{"title":{"ar":"الِاسْمُ الْمَوْصُولُ وَصِلَتُهُ","en":"The relative noun and its clause","tr":"İsm-i mevsûl ve sılası"},"level":4,"group":"nahw","explanation":{"en":"A relative noun — اَلَّذِي, اَلَّتِي, مَنْ (for people), مَا (for things) — is a definite noun that cannot stand on its own. It needs a clause after it, the صِلَة, and that clause must contain a pronoun pointing back at it, the عَائِد. All three parts count as one noun for i'rab: «الْجُزْءُ الَّذِي لَا يَتَجَزَّى» is one thing, «the part that admits of no division». Two consequences fall out of this. First, the sila itself has NO case position (لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ) — you never i'rab it as subject or object of anything; it belongs to the relative. Second, the relative noun is مَبْنِيّ: اَلَّذِي and مَنْ never change their ending, so you say «in the position of raf'» rather than «in raf'». Drop the ‘aid and the sentence collapses — «مَا يُعْلَمُ بِهِ الصَّانِعُ» needs that بِهِ to tie the clause back to مَا.","tr":"İsm-i mevsûl — اَلَّذِي، اَلَّتِي، مَنْ (âkil için), مَا (gayr-i âkil için) — tek başına anlam vermeyen marife isimdir. Kendisinden sonra bir cümleye, yani sılaya muhtaçtır; o cümlede de mevsûle dönen bir zamir, âid bulunmalıdır. Üçü birlikte i'rab bakımından tek bir isim sayılır: «الْجُزْءُ الَّذِي لَا يَتَجَزَّى» tek bir şeydir. Bundan iki sonuç çıkar. Birincisi, sıla cümlesinin i'rabdan mahalli yoktur; onu fâil veya mef'ûl diye tahlil etmezsiniz, mevsûle aittir. İkincisi, ism-i mevsûl mebnîdir: اَلَّذِي ve مَنْ sonu değişmez, bu yüzden «merfû» değil «ref mahallinde» denir. Âid düşerse cümle çöker — «مَا يُعْلَمُ بِهِ الصَّانِعُ» ifadesinde بِهِ, cümleyi مَا'ya bağlayan âiddir."},"plain":{"en":"«the one who…», «that which…», and the clause that completes it.","tr":"«…-en kimse», «…olan şey» ve onu tamamlayan cümle."},"sources":["الكافية (ابن الحاجب) — المعارف","إظهار الأسرار (البركوي)","قطر الندى (ابن هشام)"],"examples":[{"ar":"وَالْجَوْهَرُ هُوَ الْجُزْءُ الَّذِي لَا يَتَجَزَّى.","gloss":{"en":"The atom is the part that admits of no division — الَّذِي is definite, so it can be the na't of the definite الْجُزْءُ.","tr":"Cevher, bölünemeyen cüzdür — الَّذِي marifedir, bu yüzden marife olan الْجُزْءُ'ya na't olabilir."},"src":"aqaid-ahl-al-sunna"},{"ar":"الْبَيِّنَةُ لِلْمُدَّعِي وَالْيَمِينُ عَلَى مَنْ أَنْكَرَ.","gloss":{"en":"…and the oath on the one who denies — مَنْ is in jarr after عَلَى, and أَنْكَرَ is its sila.","tr":"…yemin ise inkâr edene aittir — مَنْ, عَلَى'dan sonra cer mahallindedir, أَنْكَرَ onun sılasıdır."},"src":"aqaid-ahl-al-sunna"},{"ar":"الْعَالَمُ مَا سِوَى اللهِ تَعَالَى.","gloss":{"en":"The world is what is other than Allah — مَا stands in the position of raf' as the khabar.","tr":"Âlem, Allah'ın dışındaki şeydir — مَا haber olarak ref mahallindedir."},"src":null}],"mistakes":[{"wrong":"الرَّجُلُ الَّذِي جَاءَ أَمْسِ كَرِيمٌ — «الَّذِي جَاءَ» فَاعِلٌ","right":"«جَاءَ أَمْسِ» صِلَةُ الْمَوْصُولِ لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ","why":{"en":"Beginners parse the sila as though it were a clause of the main sentence. It is not — it has no case position at all; only the relative noun carries the i'rab.","tr":"Sıla cümlesi ana cümlenin bir öğesi gibi tahlil edilir; hâlbuki i'rabdan mahalli yoktur, i'rabı taşıyan sadece mevsûldür."}},{"wrong":"هَذَا هُوَ الْكِتَابُ الَّذِي قَرَأْتُ","right":"هَذَا هُوَ الْكِتَابُ الَّذِي قَرَأْتُهُ","why":{"en":"The sila needs the ‘aid. Without the ـهُ nothing ties «I read» back to «the book».","tr":"Sıla âidsiz olmaz. ـهُ olmadan «okudum» fiili «kitap»a bağlanmaz."}},{"wrong":"جَاءَ الَّذِينَ اجْتَهَدُوا — «الَّذِينَ» مَرْفُوعٌ بِالْوَاوِ","right":"«الَّذِينَ» مَبْنِيٌّ عَلَى الْفَتْحِ فِي مَحَلِّ رَفْعٍ فَاعِلٌ","why":{"en":"Relative nouns are mabni — they do not take case endings. Say «in the position of raf'», never «in raf' with a waw».","tr":"İsm-i mevsûller mebnîdir, i'rab alâmeti almaz. «Vâv ile merfû» değil, «ref mahallinde» denir."}}]},"ism-tafdil":{"title":{"ar":"اسْمُ التَّفْضِيل","en":"The ism tafdil (comparative and superlative)","tr":"İsm-i tafdîl (üstünlük)"},"level":3,"group":"sarf","explanation":{"en":"The ism tafdil is built on the pattern أَفْعَل and says that one thing has a quality MORE than another: أَبْيَضُ مِنَ اللَّبَنِ «whiter than milk». Three things follow from that pattern. First, it is a DIPTOTE (مَمْنُوعٌ مِنَ الصَّرْفِ) — it never takes tanwin, and in jarr it takes fatha instead of kasra. Second, the thing compared against is introduced by مِنْ, never by a separate word for «than». Third, in its bare أَفْعَل form it does not change for gender or number: هُوَ أَكْبَرُ, هِيَ أَكْبَرُ. It only inflects when made definite (الْأَكْبَرُ، الْكُبْرَى) or made mudaf. The Emsile lists it among the forms derived from every verb, and it is built only from a three-letter verb whose meaning admits degrees.","tr":"İsm-i tafdîl «ef'al» vezninde kurulur ve bir şeyin bir vasıfta diğerinden ÜSTÜN olduğunu bildirir: أَبْيَضُ مِنَ اللَّبَنِ «sütten daha beyaz». Bu vezinden üç şey doğar. Birincisi, GAYR-İ MUNSARİFTİR — tenvin almaz, cer hâlinde kesre yerine fetha alır. İkincisi, kendisine üstünlük verilen «min» ile gelir; ayrıca «-den daha» diye bir kelime kullanılmaz. Üçüncüsü, yalın «ef'al» şeklinde cinsiyet ve sayıya göre değişmez: هُوَ أَكْبَرُ, هِيَ أَكْبَرُ. Ancak marife yapılınca (الْأَكْبَرُ، الْكُبْرَى) veya muzâf olunca çekimlenir. Emsile onu her fiilden türeyen sîgalar arasında sayar; yalnız mânâsı derecelenebilen üç harfli fiilden yapılır."},"plain":{"en":"The أَفْعَل pattern, meaning «more X than»: أَبْيَضُ مِنَ اللَّبَنِ, «whiter than milk».","tr":"«Daha çok» manası veren أَفْعَل kalıbı: أَبْيَضُ مِنَ اللَّبَنِ, «sütten beyaz»."},"sources":["الأمثلة المختلفة","بناء الأفعال","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"examples":[{"ar":"وَمَاؤُهُ أَبْيَضُ مِنَ اللَّبَنِ.","gloss":{"en":"Its water is whiter than milk — أَبْيَضُ is a diptote, and مِنْ names what it is compared against.","tr":"Suyu sütten daha beyazdır — أَبْيَضُ gayr-i munsariftir, مِنْ kendisiyle kıyaslananı gösterir."},"src":"aqaid-ahl-al-sunna"},{"ar":"وَرِيحُهُ أَطْيَبُ مِنَ الْمِسْكِ.","gloss":{"en":"And its scent sweeter than musk.","tr":"Ve kokusu miskten daha güzeldir."},"src":"aqaid-ahl-al-sunna"},{"ar":"وَكِيزَانُهُ أَكْثَرُ مِنْ نُجُومِ السَّمَاءِ.","gloss":{"en":"And its cups more numerous than the stars of the sky.","tr":"Ve kâseleri gökyüzünün yıldızlarından daha çoktur."},"src":"aqaid-ahl-al-sunna"}],"mistakes":[{"wrong":"مَاؤُهُ أَبْيَضٌ مِنَ اللَّبَنِ","right":"مَاؤُهُ أَبْيَضُ مِنَ اللَّبَنِ","why":{"en":"The ism tafdil is a diptote: no tanwin, ever. Writing أَبْيَضٌ treats it as an ordinary noun.","tr":"İsm-i tafdîl gayr-i munsariftir: asla tenvin almaz. أَبْيَضٌ yazmak onu sıradan bir isim saymaktır."}},{"wrong":"مَرَرْتُ بِأَكْبَرِ مِنْهُ","right":"مَرَرْتُ بِأَكْبَرَ مِنْهُ","why":{"en":"As a diptote it takes FATHA in jarr, not kasra — unless it is made definite or mudaf, when the kasra returns.","tr":"Gayr-i munsarif olduğu için cer hâlinde kesre değil FETHA alır — marife veya muzâf yapılırsa kesre geri döner."}},{"wrong":"هِيَ أَكْبَرَةُ مِنْهَا","right":"هِيَ أَكْبَرُ مِنْهَا","why":{"en":"The bare أَفْعَل form does not take a feminine ending. Feminine appears only in the definite form الْكُبْرَى.","tr":"Yalın «ef'al» şekli müenneslik alâmeti almaz. Müenneslik ancak marife şekilde görülür: الْكُبْرَى."}}]},"istiara":{"title":{"ar":"الِاسْتِعَارَة","en":"Metaphor — a simile with one side removed","tr":"İstiâre — bir tarafı hazfedilmiş teşbih"},"level":5,"group":"balagha","explanation":{"en":"An isti'ara is a majaz whose relation is resemblance — which is to say, a tashbih with one of its two sides deleted and the tool gone with it. If what is named is the thing compared TO, the metaphor is مُصَرَّحَة (declared): «رَأَيْتُ أَسَدًا» names the lion and leaves the man out. If what is named is the thing compared and something belonging to the other side is attached to it instead, it is مَكْنِيَّة (implicit): «أَنْشَبَتِ الْمَنِيَّةُ أَظْفَارَهَا» never says «beast», but claws give it away — and the claws themselves are called تَخْيِيلِيَّة, the imagined trace of the deleted side. That second kind is what the wasiyya uses when it says laughter «kills» the heart: death belongs to a living thing, so the heart is being treated as one, and يُمِيتُ is the trace. Test it the same way every time: name the two sides, ask which one is missing from the words, and the answer tells you which kind you have.","tr":"İstiâre, alâkası müşâbehet olan mecazdır; yani iki tarafından biri ve onunla birlikte edâtı hazfedilmiş bir teşbihtir. Zikredilen müşebbehün bih ise istiâre musarrahadır: «رَأَيْتُ أَسَدًا» aslanı zikreder, adamı bırakır. Zikredilen müşebbeh olup öbür tarafın levazımından biri ona eklenmişse mekniyyedir: «أَنْشَبَتِ الْمَنِيَّةُ أَظْفَارَهَا» hiç «yırtıcı» demez, fakat pençeler ele verir — pençelerin kendisine de tahyîliyye denir, hazfedilen tarafın hayalî izidir. Vasiyet, gülmenin kalbi «öldürdüğünü» söylerken bu ikinciyi kullanır: ölmek diriye ait olduğu için kalp diri sayılmıştır, يُمِيتُ ise izidir. Ölçü her seferinde aynıdır: iki tarafı adlandırın, hangisinin lafızda bulunmadığını sorun; cevap türü söyler."},"plain":{"en":"A comparison with one of its two sides taken away — what English calls a metaphor.","tr":"İki tarafından biri kaldırılmış teşbih — istiare."},"sources":["تلخيص المفتاح (القزويني) — علم البيان","علاقات المجاز","مختصر السعد"],"examples":[{"ar":"وَإِيَّاكَ أَنْ تُكْثِرَ الضَّحِكَ فَإِنَّهُ يُمِيتُ الْقَلْبَ.","gloss":{"en":"Beware of laughing much, for it kills the heart — the heart is treated as a living thing and «kills» is the trace: isti'ara makniyya.","tr":"Çok gülmekten sakın, zira kalbi öldürür — kalp diri sayılmış, «öldürür» izdir: istiâre-i mekniyye."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"تَهَاوَنَ بِكَ وَصَغُرَتْ مَنْزِلَتُكَ عِنْدَهُ.","gloss":{"en":"Your standing shrank with him — a standing has no size; smallness is borrowed from bodies.","tr":"Yanında mevkiin küçüldü — mevkiin bir boyu yoktur; küçüklük cisimlerden ödünç alınmıştır."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"أَنْشَبَتِ الْمَنِيَّةُ أَظْفَارَهَا.","gloss":{"en":"Death sank its claws in — the beast is never named; the claws are the whole clue.","tr":"Ölüm pençelerini geçirdi — yırtıcı hiç anılmaz; bütün karîne pençelerdir."},"src":null}],"mistakes":[{"wrong":"«يُمِيتُ الْقَلْبَ» مَجَازٌ مُرْسَلٌ","right":"اسْتِعَارَةٌ، لِأَنَّ الْعَلَاقَةَ مُشَابَهَةٌ","why":{"en":"The relation here is likeness — the heart is being likened to something that can die. That makes it an isti'ara, not a mursal.","tr":"Buradaki alâka benzerliktir — kalp, ölebilen bir şeye benzetilmiştir. Bu mürsel değil istiâredir."}},{"wrong":"الِاسْتِعَارَةُ الْمَكْنِيَّةُ تَذْكُرُ الْمُشَبَّهَ بِهِ","right":"الْمَكْنِيَّةُ تَحْذِفُ الْمُشَبَّهَ بِهِ وَتُبْقِي مِنْ لَوَازِمِهِ شَيْئًا","why":{"en":"It is the makniyya that deletes the thing compared to; naming it makes the metaphor musarraha instead.","tr":"Müşebbehün bihi hazfeden mekniyyedir; onu zikretmek istiâreyi musarraha yapar."}}]},"istithna-mufarragh":{"title":{"ar":"الِاسْتِثْنَاءُ الْمُفَرَّغ (مَا … إِلَّا)","en":"Restriction: «nothing but…»","tr":"İstisnâ-i müferrağ (مَا … إِلَّا)"},"level":5,"group":"nahw","explanation":{"en":"When a negation is followed by إِلَّا and no مُسْتَثْنَى مِنْهُ has been mentioned, the sentence is «emptied» — مُفَرَّغ — and إِلَّا governs nothing at all. The word after it simply takes whatever case the sentence would have given it if the negation and the إِلَّا were both deleted. Test it: مَا مُحَمَّدٌ إِلَّا رَسُولٌ → remove both → مُحَمَّدٌ رَسُولٌ, mubtada and khabar, so رَسُولٌ is marfu'. There is a second effect worth naming. مَا can otherwise act like لَيْسَ and put its khabar in nasb (مَا مُحَمَّدٌ رَسُولًا). The moment إِلَّا arrives, that governing power lapses — النَّفْيُ مُنْتَقِضٌ بِإِلَّا — and raf' is the only option. The meaning is restriction, not exception: «Muhammad is nothing but a messenger».","tr":"Nefyden sonra إِلَّا gelir ve müstesnâ minh zikredilmezse cümle «boşaltılmış» (müferrağ) olur; إِلَّا hiçbir amel yapmaz. Ondan sonraki kelime, nefy ve إِلَّا kaldırılsaydı hangi i'rabı alacaksa onu alır. Deneyin: مَا مُحَمَّدٌ إِلَّا رَسُولٌ → ikisini kaldırın → مُحَمَّدٌ رَسُولٌ; mübteda ve haber, dolayısıyla رَسُولٌ merfûdur. İkinci bir netice daha vardır: مَا, aksi hâlde لَيْسَ gibi amel edip haberini nasb edebilir (مَا مُحَمَّدٌ رَسُولًا). إِلَّا geldiği anda bu amel düşer — النَّفْيُ مُنْتَقِضٌ بِإِلَّا — ve tek seçenek ref olur. Mana istisnâ değil hasrdır: «Muhammed ancak bir resuldür»."},"plain":{"en":"«nothing but…». With a negation, إِلَّا, and nothing named in between, إِلَّا governs nothing at all — the word after it takes the case it would have had anyway.","tr":"«…-den başkası değil». Nefy ve إِلَّا arasında bir şey anılmazsa إِلَّا hiçbir şeyi amel etmez; sonraki kelime zaten alacağı i'rabı alır."},"sources":["الكافية (ابن الحاجب) — الاستثناء","العوامل (البيركوي)","قطر الندى (ابن هشام)"],"examples":[{"ar":"وَمَا مُحَمَّدٌ إِلَّا رَسُولٌ قَدْ خَلَتْ مِنْ قَبْلِهِ الرُّسُلُ.","gloss":{"en":"Muhammad is but a messenger; messengers have passed away before him. (Al ‘Imran 144)","tr":"Muhammed ancak bir resuldür; ondan önce de resuller gelip geçti. (Âl-i İmrân 144)"},"src":"aqaid-ahl-al-sunna"},{"ar":"مَا جَاءَ إِلَّا زَيْدٌ.","gloss":{"en":"No one came but Zayd — delete مَا and إِلَّا and زَيْدٌ is the fa'il, so it stays marfu'.","tr":"Zeyd'den başkası gelmedi — مَا ile إِلَّا'yı kaldırın, زَيْدٌ fâildir, dolayısıyla merfû kalır."},"src":null},{"ar":"مَا رَأَيْتُ إِلَّا زَيْدًا.","gloss":{"en":"I saw none but Zayd — here the emptied position is the object, so nasb.","tr":"Zeyd'den başkasını görmedim — burada boşalan mahal mef'ûldür, o hâlde nasb."},"src":null}],"mistakes":[{"wrong":"مَا مُحَمَّدٌ إِلَّا رَسُولًا","right":"مَا مُحَمَّدٌ إِلَّا رَسُولٌ","why":{"en":"إِلَّا cancels مَا's power to give nasb. Once the negation is broken by إِلَّا, the khabar returns to raf'.","tr":"إِلَّا, مَا'nın nasb etme amelini iptal eder. Nefy إِلَّا ile bozulunca haber ref'e döner."}},{"wrong":"مَا جَاءَ إِلَّا زَيْدًا","right":"مَا جَاءَ إِلَّا زَيْدٌ","why":{"en":"In the emptied construction the case comes from the role, not from إِلَّا. Here زَيْد is the doer, so raf' — nasb would only be right if a مُسْتَثْنَى مِنْهُ had been mentioned.","tr":"Müferrağ istisnâda i'rab, إِلَّا'dan değil kelimenin görevinden gelir. Burada زَيْد fâildir, dolayısıyla ref alır; nasb ancak müstesnâ minh zikredilseydi doğru olurdu."}},{"wrong":"مَا جَاءَ الْقَوْمُ إِلَّا زَيْدٌ","right":"مَا جَاءَ الْقَوْمُ إِلَّا زَيْدًا (وَيَجُوزُ الْبَدَلُ: إِلَّا زَيْدٌ)","why":{"en":"This one is NOT emptied — الْقَوْمُ is the mustathna minhu, so the ordinary rules of istithna apply again.","tr":"Bu cümle müferrağ değildir; الْقَوْمُ müstesnâ minhtir, dolayısıyla normal istisnâ kuralları geçerlidir."}}]},"istithna":{"title":{"ar":"الِاسْتِثْنَاء (الْمُسْتَثْنَى)","en":"Exception (the mustathna)","tr":"İstisnâ (müstesnâ)"},"level":4,"group":"nahw","explanation":{"en":"The mustathna is what إِلَّا and its sisters (غَيْر، سِوَى، خَلَا، عَدَا، حَاشَا) take OUT of a larger group. The Mansubat divides it in two: (1) مُتَّصِل, «هُوَ الْمُخْرَجُ عَنْ مُتَعَدِّدٍ لَفْظًا أَوْ تَقْدِيرًا بِإِلَّا وَأَخَوَاتِهَا» — the excepted thing belongs to the group it is taken from (جَاءَ الْقَوْمُ إِلَّا زَيْدًا); (2) مُنْقَطِع, where it does not (مَا جَاءَ أَحَدٌ إِلَّا حِمَارًا). The case follows the sentence: after a COMPLETE AFFIRMATIVE sentence the mustathna is mansub. After a negative sentence with the excepted-from mentioned, it may either be mansub or follow the case of that noun. In a sentence where the excepted-from is dropped (مُفَرَّغ), إِلَّا governs nothing at all and the noun simply takes whatever the verb requires: مَا جَاءَ إِلَّا زَيْدٌ.","tr":"Müstesnâ, إِلَّا ve kardeşlerinin (غَيْر، سِوَى، خَلَا، عَدَا، حَاشَا) daha büyük bir topluluktan ÇIKARDIĞI şeydir. Mensûbât ikiye ayırır: (1) muttasıl, «هُوَ الْمُخْرَجُ عَنْ مُتَعَدِّدٍ لَفْظًا أَوْ تَقْدِيرًا بِإِلَّا وَ أَخَوَاتِهَا» — çıkarılan, çıkarıldığı cinsten olur (جَاءَ الْقَوْمُ إِلَّا زَيْدًا); (2) munkatı', olmaz (مَا جَاءَ أَحَدٌ إِلَّا حِمَارًا). İ'rabı cümleye bağlıdır: TAM ve MÛCEB bir cümleden sonra müstesnâ mansubdur. Menfî cümlede müstesnâ minh zikredilmişse ya mansub olur ya da ondan bedel olarak i'rabına uyar. Müstesnâ minh hazfedilmişse (müferrağ), إِلَّا hiçbir amel yapmaz ve isim fiilin gerektirdiği i'rabı alır: مَا جَاءَ إِلَّا زَيْدٌ."},"plain":{"en":"«except» — taking something back out of what you just said.","tr":"«…-den başka» — söylediğiniz şeyden bir kısmını dışarıda bırakmak."},"mamul":"mansub","sources":["المنصوبات","العوامل (البيركوي)","إظهار الأسرار (البيركوي)","قطر الندى (ابن هشام)"],"question":{"tr":["Ne müstesna?","Kim müstesna?"],"en":["What is excepted?","Who is excepted?"]},"examples":[{"ar":"وَمَنْ جَاءَكَ يَسْتَفْتِيكَ فَلَا تُجِبْ إِلَّا عَنْ سُؤَالِهِ.","gloss":{"en":"Whoever comes asking you for a ruling — answer nothing but his question. A mufarragh exception: إلا governs nothing, so the phrase simply takes the case its position requires.","tr":"Sana fetva sormaya gelene, ancak sorduğu şeyi cevapla. Müferrağ istisnâ: إلا amel etmez, kelime bulunduğu mahallin i'rabını alır."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"وَمَنْ جَاءَكَ يَسْتَفْتِيكَ فَلَا تُجِبْ إِلَّا عَنْ سُؤَالِهِ.","gloss":{"en":"Whoever comes asking you for a ruling — answer only his question. A mufarragh exception: إِلَّا governs nothing, the phrase simply completes the verb. From Abu Hanifa's testament to Abu Yusuf.","tr":"Sana fetva sormaya gelene yalnız sorusunu cevapla. Müferrağ istisnâ: إِلَّا amel etmez, ifade fiili tamamlar. Ebû Hanîfe'nin Ebû Yusuf'a vasiyetinden."},"src":null},{"ar":"جَاءَ الْقَوْمُ إِلَّا زَيْدًا.","gloss":{"en":"The people came except Zayd — complete affirmative sentence, so the mustathna is mansub.","tr":"Zeyd hariç insanlar geldi — tam ve müsbet cümle, dolayısıyla müstesnâ mansubdur."},"src":null},{"ar":"مَا جَاءَ أَحَدٌ إِلَّا زَيْدًا / إِلَّا زَيْدٌ.","gloss":{"en":"No one came except Zayd — negative sentence: nasb, or badal following أَحَدٌ, are both allowed.","tr":"Zeyd'den başka kimse gelmedi — menfî cümle: nasb da أَحَدٌ'den bedel de caizdir."},"src":null}],"mistakes":[{"wrong":"ما جاء إلا زيدًا","right":"ما جاء إلا زيدٌ","why":{"en":"When the excepted-from is not mentioned (mufarragh), إِلَّا governs nothing — the noun takes the case its position requires, here fa'il in raf'. This is the single most common exception error.","tr":"Müstesnâ minh zikredilmemişse (müferrağ) إِلَّا amel etmez — isim, konumunun gerektirdiği i'rabı alır, burada fâil olarak merfû. En sık yapılan istisna hatasıdır."}},{"wrong":"جاء القومُ إلا زيدٌ","right":"جاء القومُ إلا زيدًا","why":{"en":"After a complete affirmative sentence the mustathna must be mansub; it does not follow the case of the group.","tr":"Tam ve mûceb cümleden sonra müstesnâ mansub olmalıdır; topluluğun i'rabına uymaz."}},{"wrong":"جاء القومُ غيرًا زيدٍ","right":"جاء القومُ غَيْرَ زَيْدٍ","why":{"en":"With غَيْر and سِوَى the exception is expressed by idafa: غَيْر itself takes the case the mustathna would have taken, and the excepted noun goes into jarr after it.","tr":"غَيْر ve سِوَى ile istisna izafetle yapılır: غَيْر, müstesnânın alacağı i'rabı alır, istisna edilen isim ondan sonra mecrûr olur."}}]},"jam-muannath-salim":{"title":{"ar":"جَمْعُ الْمُؤَنَّثِ السَّالِم","en":"The sound feminine plural","tr":"Cem-i müennes-i sâlim"},"level":3,"group":"nahw","explanation":{"en":"Add ـَات to the singular and you have the sound feminine plural: إِدْرَاك → إِدْرَاكَات, مَوْجُود → مَوْجُودَات. Its i'rab has one peculiarity that must be memorised: it takes damma in raf' as expected, but KASRA in nasb — not fatha. So «رَأَيْتُ الْمُؤْمِنَاتِ» and «مَرَرْتُ بِالْمُؤْمِنَاتِ» look identical at the ending, and only the governor tells you which case it is. That makes this plural the mirror image of the sound masculine plural, which uses ـُونَ for raf' and ـِينَ for both nasb and jarr. Note also that the plural does not require a feminine singular — حَمَّامَات and إِدْرَاكَات are built on masculine words; what makes it «feminine» is the ending, not the sense.","tr":"Tekile ـَات eklenerek yapılır: إِدْرَاك → إِدْرَاكَات، مَوْجُود → مَوْجُودَات. İ'rabında ezberlenmesi gereken bir özellik vardır: ref hâlinde beklendiği gibi damme alır, fakat NASB hâlinde fetha değil KESRE alır. Bu yüzden «رَأَيْتُ الْمُؤْمِنَاتِ» ile «مَرَرْتُ بِالْمُؤْمِنَاتِ» sonlarında aynı görünür; hangi i'rabda olduğunu ancak âmil belirler. Böylece bu cemi, ref için ـُونَ, nasb ve cer için ـِينَ kullanan cem-i müzekker-i sâlimin aynadaki görüntüsüdür. Ayrıca tekilinin müennes olması şart değildir: حَمَّامَات ve إِدْرَاكَات müzekker kelimelerden yapılmıştır; «müennes» sayılmasının sebebi manası değil, ekidir."},"plain":{"en":"The regular feminine plural in ـَات — and it takes kasra where you would expect fatha.","tr":"ـَات ile yapılan düzenli müennes çoğul; fetha beklediğiniz yerde kesre alır."},"sources":["العوامل (البيركوي)","الكافية (ابن الحاجب)","مراح الأرواح"],"examples":[{"ar":"بِهَا تَسْتَعِدُّ لِلْعُلُومِ وَالْإِدْرَاكَاتِ.","gloss":{"en":"…is made ready for the sciences and the perceptions — kasra here is the mark of jarr.","tr":"…ilimlere ve idraklere hazır hâle gelir — buradaki kesre cer alâmetidir."},"src":"aqaid-ahl-al-sunna"},{"ar":"مَا سِوَى اللهِ تَعَالَى مِنَ الْمَوْجُودَاتِ.","gloss":{"en":"…among the existent things.","tr":"…mevcudat arasından."},"src":"aqaid-ahl-al-sunna"},{"ar":"إِنَّ الْمُسْلِمَاتِ وَالْمُؤْمِنَاتِ.","gloss":{"en":"Indeed the Muslim women and the believing women — after إِنَّ the case is nasb, but the mark is kasra.","tr":"Muhakkak Müslüman ve mümin kadınlar — إِنَّ'den sonra i'rab nasbdır, fakat alâmeti kesredir."},"src":null}],"mistakes":[{"wrong":"رَأَيْتُ الْمُسْلِمَاتَ","right":"رَأَيْتُ الْمُسْلِمَاتِ","why":{"en":"The sound feminine plural never takes fatha in nasb. Kasra stands in for it — this is the single rule that governs the form.","tr":"Cem-i müennes-i sâlim nasb hâlinde asla fetha almaz; onun yerine kesre gelir. Bu şeklin tek kuralı budur."}},{"wrong":"جَاءَتِ الْمُسْلِمَاتِ","right":"جَاءَتِ الْمُسْلِمَاتُ","why":{"en":"In raf' it is perfectly ordinary — damma. The kasra substitution applies to nasb only.","tr":"Ref hâlinde tamamen olağandır: damme. Kesre ikamesi yalnız nasb hâline mahsustur."}}]},"jam-mudhakkar-salim":{"title":{"ar":"جَمْعُ الْمُذَكَّرِ السَّالِم","en":"The sound masculine plural","tr":"Cem-i müzekker-i sâlim"},"level":3,"group":"nahw","explanation":{"en":"Nouns pluralized with ـُونَ / ـِينَ take their i'rab BY LETTERS, not vowels: raf' with و (الصَّالِحُونَ) and both nasb AND jarr with ي (الصَّالِحِينَ). So one form covers two cases — the sentence position tells you which. In this story: اصْحَبِ الصَّالِحِينَ — object in nasb, marked by ي. The final نَ drops in idafa: مُعَلِّمُو الْمَدْرَسَةِ. Only rational masculine nouns (and their adjectives) form this plural; broken plurals (كِبَار، عُلَمَاء) decline with ordinary vowels instead.","tr":"ـُونَ / ـِينَ ile yapılan çoğullar i'rabını harekelerle değil HARFLERLE alır: ref hali و ile (الصَّالِحُونَ), nasb VE cer halleri ي ile (الصَّالِحِينَ). Tek şekil iki hali karşılar — hangisi olduğunu cümledeki konum belirler. Hikâyede: اصْحَبِ الصَّالِحِينَ — mef'ûlün bih, nasb alâmeti ي. İzafette sondaki نَ düşer: مُعَلِّمُو الْمَدْرَسَةِ. Bu çoğul yalnız akıllı müzekker isimlerde kurulur; mükesser çoğullar (كِبَار، عُلَمَاء) normal harekelerle i'rablanır."},"plain":{"en":"The regular masculine plural in ـُونَ and ـِينَ.","tr":"ـُونَ ve ـِينَ ile yapılan düzenli müzekker çoğul."},"sources":["الكافية (ابن الحاجب) — المعربات بالحروف","قطر الندى (ابن هشام)","بناء الأفعال — للمقارنة مع جمع التكسير"],"examples":[{"ar":"اصْحَبِ الصَّالِحِينَ.","gloss":{"en":"Keep the company of the righteous — nasb marked by ي.","tr":"Sâlihlerle arkadaşlık et — nasb alâmeti yâdır."},"src":"wasiyyat-abi-hanifa-L4"},{"ar":"جَاءَ الصَّالِحُونَ.","gloss":{"en":"The righteous came — raf' marked by و.","tr":"Sâlihler geldi — ref alâmeti vâvdır."},"src":null},{"ar":"مَرَرْتُ بِالْمُعَلِّمِينَ.","gloss":{"en":"I passed by the teachers — jarr with the same ي form as nasb.","tr":"Hocalara uğradım — cerde de nasbdaki gibi yâ gelir."},"src":null}],"mistakes":[{"wrong":"اصحبِ الصالحونَ","right":"اصحبِ الصالحينَ","why":{"en":"Learners freeze the raf' form ـُونَ everywhere. As a direct object the plural must switch to ـِينَ.","tr":"Öğrenciler ref şekli ـُونَ'yi her yerde dondurur. Mef'ûl konumunda çoğul ـِينَ'ye dönmelidir."}},{"wrong":"جاء الصالحينَ","right":"جاء الصالحونَ","why":{"en":"The reverse error: as subject (fa'il) the plural must show و, not the ي of nasb/jarr.","tr":"Tersi hata: fâil konumunda çoğul و almalıdır, nasb/cer yâsı değil."}},{"wrong":"معلمونَ المدرسةِ","right":"معلمو المدرسةِ","why":{"en":"In idafa the final نَ drops — it stands in for tanwin, and mudaf nouns take neither.","tr":"İzafette sondaki نَ düşer — o tenvin yerine geçer; muzâf isim ikisini de almaz."}}]},"jinas":{"title":{"ar":"الجِنَاس وَمَا يُلْحَقُ بِهِ","en":"Jinas — two words that sound alike","tr":"Cinâs — telaffuzda birbirine benzeyen iki lafız"},"level":6,"group":"balagha","explanation":{"en":"With jinas we cross from the embellishments of meaning to those of wording. Jinas is the resemblance of two words in the way they are pronounced, and it is either complete or deficient. Complete (تَامّ) when the two agree in the kind of their letters, their number, their vowelling and their order. If both are of one part of speech it is مُمَاثِل — «وَيَوْمَ تَقُومُ السَّاعَةُ يُقْسِمُ الْمُجْرِمُونَ مَا لَبِثُوا غَيْرَ سَاعَةٍ», the Hour and an hour. If they are of two parts of speech it is مُسْتَوْفَى, as in the two يَحْيَى, one a verb and one a name. If one side is a compound the names change again: تَرْكِيب, and مُتَشَابِه or مَفْرُوق according to whether the two are written alike. Deficient (نَاقِص) when they fall short of that agreement: differing only in vowelling is مُحَرَّف; differing in the number of letters is the ordinary نَاقِص, and if the extra letter sits at the end it is مُطَرَّف — عَوَاصٍ beside عَوَاصِم — while a longer tail gives مُذَيَّل. Two further things are *joined* to jinas without being jinas proper: words that share a derivation, «فَأَقِمْ وَجْهَكَ لِلدِّينِ الْقَيِّمِ», and words that merely look derived from one root, «إِنِّي لِعَمَلِكُمْ مِنَ الْقَالِينَ» beside قَالَ. This last family — الِاشْتِقَاق — is the one that classical prose actually lives on, and it is what our texts have: a masdar set beside its own verb, a noun beside the verb it was cut from. Read it as a discipline rather than a trick. The tradition praises jinas only where the meaning did not bend to accommodate the sound.","tr":"Cinâs ile ma'nevî muhassinâttan lafzî olanlara geçeriz. Cinâs, iki lafzın telaffuzda birbirine benzemesidir; ya tam ya nâkıstır. Tam cinâs, iki lafzın harflerinin nev'inde, adedinde, hey'etinde (harekelerinde) ve tertibinde ittifak etmesidir. İkisi de aynı nevden ise mümâsil olur — «وَيَوْمَ تَقُومُ السَّاعَةُ يُقْسِمُ الْمُجْرِمُونَ مَا لَبِثُوا غَيْرَ سَاعَةٍ»: kıyamet saati ve bir saat. İki ayrı nevden iseler müstevfâ olur; biri fiil biri isim olan iki يَحْيَى gibi. Taraflardan biri mürekkeb olursa isimler yine değişir: terkîb; hatlarının bir olup olmamasına göre müteşâbih yahut mefrûk. Nâkıs cinâs, bu ittifakın eksik kalmasıdır: yalnız harekelerde ihtilâf muharref; harf adedinde ihtilâf âdî nâkıstır ve fazla harf sonda ise mutarraf denir — عَوَاصِم yanında عَوَاصٍ — kuyruk daha uzunsa müzeyyel olur. İki şey daha cinâsa katılır fakat hakikatte cinâs değildir: iştikakta birleşen iki lafız, «فَأَقِمْ وَجْهَكَ لِلدِّينِ الْقَيِّمِ»; ve iştikaka benzeyen bir müşâbehette birleşen iki lafız, قَالَ yanında «إِنِّي لِعَمَلِكُمْ مِنَ الْقَالِينَ». Klasik nesrin fiilen üzerinde yürüdüğü ve bizim metinlerimizde bulunan da bu sonuncu ailedir — iştikak: masdarın kendi fiilinin yanına, ismin kendisinden türediği fiilin yanına konulması. Bunu bir hüner değil bir edep olarak oku: gelenek cinâsı ancak mana sese kurban edilmediği yerde över."},"plain":{"en":"Two words that sound alike, set close together.","tr":"Sesçe birbirine benzeyen iki kelimeyi yan yana getirmek."},"sources":["تلخيص المفتاح (القزويني) — علم البديع، المحسنات اللفظية","مختصر السعد"],"examples":[{"ar":"فَإِنَّهُمْ يَأْخُذُونَ أَمْوَالَكَ وَيَطْمَعُونَ فِيهَا غَايَةَ الطَّمَعِ.","gloss":{"en":"يَطْمَعُونَ and الطَّمَع share one derivation — the mulhaq-bi'l-jinas kind. It is also a maful mutlaq, which is why the sound and the sense reinforce each other instead of competing.","tr":"يَطْمَعُونَ ile الطَّمَع iştikakta birleşir — cinâsa mülhak olan kısım. Aynı zamanda mef'ûl-i mutlaktır; ses ile mana bu yüzden çekişmez, birbirini pekiştirir."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"وَالْجَوْهَرُ هُوَ الْجُزْءُ الَّذِي لَا يَتَجَزَّى.","gloss":{"en":"الْجُزْء beside يَتَجَزَّى: the same root affirming and denying itself. The definition of the atom is stated in a single derivation.","tr":"الْجُزْء yanında يَتَجَزَّى: aynı kök hem kendini kurar hem nefyeder. Cevherin tarifi tek bir iştikakla söylenmiştir."},"src":"aqaid-ahl-al-sunna"},{"ar":"رَجُلٌ أَمْكَنَهُ طَلَبُ الْعِلْمِ فِي الدُّنْيَا فَلَمْ يَطْلُبْهُ.","gloss":{"en":"The masdar طَلَب beside its own verb يَطْلُبْ — joined by derivation, and at the same time a tibaq al-salb: what he could have sought, he did not seek.","tr":"طَلَب masdarı kendi fiili يَطْلُبْ ile yan yana — iştikakla birleşmiş, aynı anda bir tıbâku's-selb: talep edebileceği şeyi talep etmedi."},"src":"min-muqaddimat-al-maqsud"},{"ar":"وَجِئْتُكَ مِنْ سَبَإٍ بِنَبَإٍ يَقِينٍ.","gloss":{"en":"سَبَإ and نَبَإ differ in one letter and stand next to each other — the Talkhis's example of the muzdawij kind (al-Naml 22).","tr":"سَبَإ ile نَبَإ tek harfte ayrılır ve yan yana gelir — Telhîs'in müzdevic kısmı için verdiği misal (Neml 22)."},"src":null}],"mistakes":[{"wrong":"«مُبَادَلَةُ مَالٍ بِمَالٍ» جِنَاسٌ","right":"تَكْرَارُ اللَّفْظِ نَفْسِهِ، وَالْجِنَاسُ بَيْنَ لَفْظَيْنِ","why":{"en":"Jinas is a resemblance between two words. One word said twice is repetition — a real device, but a different one.","tr":"Cinâs iki lafız arasındaki benzerliktir. Bir lafzın iki kere söylenmesi tekrardır — o da bir sanattır, fakat başkasıdır."}},{"wrong":"«الْجُزْءُ / يَتَجَزَّى» جِنَاسٌ تَامٌّ","right":"مُلْحَقٌ بِالْجِنَاسِ بِالِاشْتِقَاقِ","why":{"en":"A jinas tamm requires the two to agree in the kind, number, vowelling and order of their letters. These two agree only in their root, so the book files them under what is joined to jinas, not under jinas.","tr":"Cinâs-ı tam, harflerin nev'inde, adedinde, hey'etinde ve tertibinde ittifak ister. Bu ikisi yalnız kökte birleşir; bu yüzden kitap onları cinâsın altına değil, cinâsa mülhak olanların altına koyar."}},{"wrong":"يَحْسُنُ الْجِنَاسُ وَإِنْ تُكُلِّفَ لَهُ الْمَعْنَى","right":"الْمُحَسِّنَاتُ اللَّفْظِيَّةُ بَعْدَ رِعَايَةِ الْمُطَابَقَةِ وَوُضُوحِ الدَّلَالَةِ","why":{"en":"Badi' is defined as what beautifies speech *after* the sense fits the situation and the meaning is clear. A jinas bought at the price of the meaning is not badi' at all.","tr":"Bedî', sözü ancak mutâbakat ve delâletin vuzûhu gözetildikten *sonra* güzelleştiren vecihler diye tarif edilir. Mana pahasına elde edilen cinâs, aslında bedî' değildir."}}]},"jumla-mutarida":{"title":{"ar":"الْجُمْلَةُ الْمُعْتَرِضَة","en":"The parenthetical clause","tr":"Cümle-i mu'teriza"},"level":5,"group":"nahw","explanation":{"en":"A clause can be dropped into the middle of a sentence without being part of it. It comes between two things that belong together — a verb and its object, a mubtada and its khabar, a mudaf and what follows — and it has no case position at all: لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ. The commonest kind by far is the invocation: تَعَالَى, سُبْحَانَهُ, رَحِمَهُ اللهُ, صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ. When you read «إِنْسَانٌ بَعَثَهُ اللهُ تَعَالَى إِلَى الْخَلْقِ», the تَعَالَى is not an adjective of the majestic name and not a second verb in the chain; it is a prayer set inside the sentence, and the sentence would be complete without it. The practical test: lift the clause out. If what remains is still a whole sentence, the clause was mu'tarida.","tr":"Bir cümle, cümlenin öğesi olmadan söz arasına girebilir. Birbirine bağlı iki unsurun — fiil ile mef'ûlünün, mübteda ile haberin, muzâf ile muzâfun ileyhin — arasına girer ve i'rabdan mahalli yoktur. En yaygın türü duâ cümlesidir: تَعَالَى، سُبْحَانَهُ، رَحِمَهُ اللهُ، صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ. «إِنْسَانٌ بَعَثَهُ اللهُ تَعَالَى إِلَى الْخَلْقِ» okurken تَعَالَى, lafza-i celâlin sıfatı yahut ikinci bir fiil değildir; cümlenin içine yerleştirilmiş bir duâdır ve o olmadan da cümle tamamdır. Pratik ölçü: cümleyi çıkarın; geriye kalan hâlâ tam bir cümle ise o cümle mu'terizadır."},"plain":{"en":"A clause dropped into the middle of a sentence without belonging to it — most often a blessing, like «Allah, exalted is He».","tr":"Cümlenin ortasına, ona dâhil olmadan giren cümlecik — çoğu zaman «Allah — teâlâ —» gibi bir duâ."},"sources":["الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"examples":[{"ar":"الرَّسُولُ إِنْسَانٌ بَعَثَهُ اللهُ تَعَالَى إِلَى الْخَلْقِ.","gloss":{"en":"…whom Allah — exalted is He — has sent to creation.","tr":"…Allah Teâlâ'nın mahlukata gönderdiği."},"src":"aqaid-ahl-al-sunna"},{"ar":"مُتَابَعَةُ أَهْلِ السُّنَّةِ وَالْجَمَاعَةِ — اللهُ سُبْحَانَهُ كَثَّرَهُمْ — فِي الْأَفْعَالِ وَالْأَقْوَالِ.","gloss":{"en":"…following Ahl al-Sunna — may Allah, glorified is He, increase them — in deeds and words. The prayer sits between the mudaf ilayh and the phrase that completes مُتَابَعَة.","tr":"…Ehl-i Sünnet'e tâbi olmak — Allah Sübhânehû onları çoğaltsın — fiillerde ve sözlerde. Duâ, muzâfun ileyh ile مُتَابَعَة'yi tamamlayan ifade arasına girmiştir."},"src":"aqaid-ahl-al-sunna"},{"ar":"الْعَالَمُ مَا سِوَى اللهِ تَعَالَى مِنَ الْمَوْجُودَاتِ.","gloss":{"en":"The world is what is other than Allah — exalted is He — among existent things.","tr":"Âlem, Allah Teâlâ'nın dışında kalan mevcudattır."},"src":"aqaid-ahl-al-sunna"}],"mistakes":[{"wrong":"اللهُ تَعَالَى — «تَعَالَى» نَعْتٌ لِلَفْظِ الْجَلَالَةِ","right":"«تَعَالَى» جُمْلَةٌ فِعْلِيَّةٌ دُعَائِيَّةٌ مُعْتَرِضَةٌ","why":{"en":"تَعَالَى is a verb, and a verb is never a na't. It is a whole clause slipped into the sentence.","tr":"تَعَالَى fiildir, fiil ise na't olmaz. Söz arasına girmiş müstakil bir cümledir."}},{"wrong":"قَالَ — رَحِمَهُ اللهُ — كَلَامًا؛ فَـ«رَحِمَهُ» مَعْطُوفَةٌ عَلَى «قَالَ»","right":"«رَحِمَهُ اللهُ» مُعْتَرِضَةٌ لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ","why":{"en":"The invocation is not coupled to the main verb — nothing joins them, and the speaker is not doing two things.","tr":"Duâ cümlesi ana fiile matûf değildir; aralarında atıf harfi yoktur ve fâil iki iş yapmamaktadır."}}]},"jumla-sifa":{"title":{"ar":"الْجُمْلَةُ الْوَاقِعَةُ صِفَةً","en":"A clause standing as an adjective","tr":"Sıfat olan cümle"},"level":5,"group":"nahw","explanation":{"en":"An adjective need not be a single word. A whole clause can describe a noun, and the tradition states the rule in one line: الْجُمَلُ بَعْدَ النَّكِرَاتِ صِفَاتٌ وَبَعْدَ الْمَعَارِفِ أَحْوَالٌ — clauses after indefinite nouns are adjectives, after definite nouns they are hal. So in «صِفَةٌ يَتَجَلَّى بِهَا الْمَذْكُورُ» the indefinite صِفَةٌ is described by the verbal clause that follows: «an attribute by which the named thing becomes manifest». Three things to hold on to. The clause must contain a pronoun linking it to the noun (the same عَائِد as in a relative clause) — here بِهَا. The clause takes the case POSITION of the noun it describes, which is why we say «فِي مَحَلِّ رَفْعٍ صِفَةٌ» after a marfu' noun and «فِي مَحَلِّ جَرٍّ صِفَةٌ» after a majrur one. And the noun must genuinely be indefinite: قَوْمٍ in «قَوْمٍ لَا يُتَصَوَّرُ تَوَاطُؤُهُمْ» is indefinite, so the clause is its sifa; make the noun definite and the same clause becomes a hal.","tr":"Sıfatın tek kelime olması şart değildir; bir cümle de ismi niteleyebilir. Kaide tek satırdır: الْجُمَلُ بَعْدَ النَّكِرَاتِ صِفَاتٌ وَبَعْدَ الْمَعَارِفِ أَحْوَالٌ — nekrelerden sonraki cümleler sıfat, marifelerden sonrakiler hâldir. «صِفَةٌ يَتَجَلَّى بِهَا الْمَذْكُورُ» ifadesinde nekre olan صِفَةٌ, kendisinden sonraki fiil cümlesiyle nitelenir. Üç noktayı unutmayın. Cümlede ismi bağlayan bir zamir (âid) bulunmalıdır — burada بِهَا. Cümle, nitelediği ismin i'rab MAHALLİNİ alır; merfû isimden sonra «ref mahallinde sıfat», mecrûr isimden sonra «cer mahallinde sıfat» denir. Ve isim gerçekten nekre olmalıdır: «قَوْمٍ لَا يُتَصَوَّرُ تَوَاطُؤُهُمْ» ifadesinde قَوْمٍ nekredir, dolayısıyla cümle sıfattır; isim marife olsaydı aynı cümle hâl olurdu."},"plain":{"en":"A whole clause used as an adjective. After an indefinite noun it describes it; after a definite one it tells you a state instead.","tr":"Sıfat olarak kullanılan tam cümle. Nekreden sonra sıfat, marifeden sonra hâl olur."},"mamul":"tabai","sources":["الكافية (ابن الحاجب) — التوابع","إظهار الأسرار (البركوي)","قطر الندى (ابن هشام)"],"examples":[{"ar":"الْعِلْمُ صِفَةٌ يَتَجَلَّى بِهَا الْمَذْكُورُ.","gloss":{"en":"Knowledge is an attribute by which the named thing becomes manifest — the clause stands in raf', describing the indefinite صِفَةٌ.","tr":"İlim, kendisiyle mezkûrun açığa çıktığı bir sıfattır — cümle, nekre olan صِفَةٌ'yi niteleyerek ref mahallindedir."},"src":"aqaid-ahl-al-sunna"},{"ar":"عَلَى أَلْسِنَةِ قَوْمٍ لَا يُتَصَوَّرُ تَوَاطُؤُهُمْ عَلَى الْكَذِبِ.","gloss":{"en":"…of a people whose collusion upon a lie cannot be conceived — the clause stands in jarr, following قَوْمٍ.","tr":"…yalan üzerinde birleşmeleri düşünülemeyen bir topluluğun — cümle قَوْمٍ'den sonra cer mahallindedir."},"src":"aqaid-ahl-al-sunna"},{"ar":"الرَّسُولُ إِنْسَانٌ بَعَثَهُ اللهُ تَعَالَى إِلَى الْخَلْقِ.","gloss":{"en":"A messenger is a human being whom Allah has sent to creation — the ‘aid is the ـهُ of بَعَثَهُ.","tr":"Resul, Allah'ın mahlukata gönderdiği bir insandır — âid, بَعَثَهُ'deki هُ'dir."},"src":"aqaid-ahl-al-sunna"}],"mistakes":[{"wrong":"رَأَيْتُ الرَّجُلَ يَقْرَأُ — «يَقْرَأُ» صِفَةٌ","right":"«يَقْرَأُ» جُمْلَةٌ حَالِيَّةٌ، لِأَنَّ «الرَّجُلَ» مَعْرِفَةٌ","why":{"en":"After a definite noun the clause is a hal, not a sifa — «I saw the man while he was reading», not «the man who reads».","tr":"Marife isimden sonra gelen cümle sıfat değil hâldir: «adamı okurken gördüm», «okuyan adamı gördüm» değil."}},{"wrong":"جَاءَ رَجُلٌ يَقْرَأُ الْكِتَابَ — «يَقْرَأُ» مَرْفُوعَةٌ صِفَةً","right":"الْجُمْلَةُ فِي مَحَلِّ رَفْعٍ صِفَةٌ لِـ«رَجُلٌ»","why":{"en":"A clause has no ending to inflect, so it is never itself marfu'. It occupies the POSITION of raf' — say «فِي مَحَلِّ رَفْعٍ».","tr":"Cümlenin çekilecek bir sonu yoktur, kendisi merfû olmaz; ref MAHALLİNDE bulunur — «فِي مَحَلِّ رَفْعٍ» denir."}},{"wrong":"هَذَا كِتَابٌ قَرَأْتُ","right":"هَذَا كِتَابٌ قَرَأْتُهُ","why":{"en":"A describing clause needs its ‘aid just as a relative clause does; without ـهُ the clause floats free of the noun.","tr":"Sıfat cümlesi de sıla gibi âide muhtaçtır; ـهُ olmadan cümle isimle bağını kurmaz."}}]},"kana-wa-akhawatuha":{"title":{"ar":"كَانَ وَأَخَوَاتُهَا","en":"Kana and its sisters","tr":"Kâne ve kardeşleri"},"level":2,"group":"nahw","explanation":{"en":"كَانَ and its sisters — صَارَ، لَيْسَ، أَصْبَحَ، أَمْسَى، أَضْحَى، ظَلَّ، بَاتَ، مَا زَالَ، مَا دَامَ … — are the الأفعال الناقصة (defective verbs): they carry tense but no full meaning of their own, so they need a predicate to complete them. They enter a nominal sentence (mubtada + khabar) and re-work it: the old mubtada becomes the اسم كان and stays marfu', while the old khabar becomes the خبر كان and turns mansub. This is the exact mirror of إِنَّ, which does the opposite (nasb on the ism, raf' on the khabar) — so the two make a clean contrasting pair. If the story's nominal sentence «الْعِلْمُ أَمَانَةٌ» took كان, it would read «كَانَ الْعِلْمُ أَمَانَةً»: الْعِلْمُ raised as ism, أَمَانَةً dropped to nasb as khabar. Ibn Ajurrum gives them their own chapter (\"ترفع الاسم وتنصب الخبر\"); Birgivi counts them among the لفظية governors in the Awamil.","tr":"كَانَ ve kardeşleri — صَارَ، لَيْسَ، أَصْبَحَ، أَمْسَى، أَضْحَى، ظَلَّ، بَاتَ، مَا زَالَ، مَا دَامَ … — nâkıs fiillerdir: zaman taşırlar ama tek başlarına tam mana vermezler, tamamlanmak için bir habere ihtiyaç duyarlar. İsim cümlesine (mübteda + haber) girip onu yeniden düzenlerler: eski mübteda kânenin ismi olur ve merfu kalır; eski haber kânenin haberi olur ve mansub olur. Bu, tam olarak إِنَّ'nin tersidir (o ismi nasb, haberi ref eder) — böylece ikisi karşıt bir çift oluşturur. Hikâyedeki «الْعِلْمُ أَمَانَةٌ» isim cümlesi كان alsaydı «كَانَ الْعِلْمُ أَمَانَةً» olurdu: الْعِلْمُ ism olarak merfu, أَمَانَةً haber olarak mansub. İbn Âcurrûm bunlara ayrı bir bab ayırır (\"ismi ref, haberi nasb eder\"); Birgivî Avâmil'de bunları lafzî âmiller arasında sayar."},"plain":{"en":"كَانَ and its family leave the topic as it was and put the predicate in the accusative.","tr":"كَانَ ve kardeşleri mübtedayı olduğu gibi bırakır, haberi nasb eder."},"amil":"تَرْفَعُ الِاسْمَ وَتَنْصِبُ الْخَبَرَ — the defective verbs that raise the subject to raf' and put the predicate in nasb","mamul":"marfu","sources":["الآجُرُّومِيَّة (ابن آجُرُّوم)","العوامل (البيركوي)","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"question":{"tr":["Ne? Kim? (ismi)","Nedir? Kimdir? (haberi)"],"en":["What? Who? (its noun)","What is it? Who is it? (its khabar)"]},"examples":[{"ar":"كَانَ الْعِلْمُ أَمَانَةً.","gloss":{"en":"Knowledge was a trust — the كان mirror of the story's «إِنَّ الْعِلْمَ أَمَانَةٌ» (s7): here الْعِلْمُ is the ism, raised to raf', and أَمَانَةً is the khabar, dropped to nasb.","tr":"İlim bir emanetti — hikâyedeki «إِنَّ الْعِلْمَ أَمَانَةٌ» (s7) cümlesinin كان ile aynadaki hâli: burada الْعِلْمُ isimdir, ref'e yükselir; أَمَانَةً haberdir, nasba iner."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"صَارَ الطَّالِبُ عَالِمًا.","gloss":{"en":"The student became a scholar — الطَّالِبُ ism (raf'), عَالِمًا khabar (nasb).","tr":"Talebe âlim oldu — الطَّالِبُ isim (ref), عَالِمًا haber (nasb)."},"src":null},{"ar":"لَيْسَ الْكَلَامُ كَثِيرًا مَحْمُودًا.","gloss":{"en":"Much talk is not praiseworthy — لَيْسَ negates and works like كان: الكلامُ marfu' ism, محمودًا mansub khabar.","tr":"Çok söz övülmüş değildir — لَيْسَ nefyeder ve كان gibi amel eder: الكلامُ merfû ism, محمودًا mansub haber."},"src":null}],"mistakes":[{"wrong":"كَانَ الْعِلْمُ أَمَانَةٌ","right":"كَانَ الْعِلْمُ أَمَانَةً","why":{"en":"The khabar of كان must be mansub. Learners keep the mubtada's raf' damma on it out of habit; كان demands nasb on the predicate — أَمَانَةً.","tr":"Kânenin haberi mansub olmalıdır. Öğrenciler alışkanlıkla mübtedanın ref ötresini haberde bırakır; kâne haberi nasb ister — أَمَانَةً."}},{"wrong":"كَانَ الْعِلْمَ أَمَانَةً","right":"كَانَ الْعِلْمُ أَمَانَةً","why":{"en":"Confusing كان with إنّ: كان raises its ism to raf' (الْعِلْمُ), it does not put it in nasb. Only the khabar of كان is mansub — the opposite of what إنّ does.","tr":"Kâne ile إنّ'yi karıştırmak: kâne ismini ref eder (الْعِلْمُ), nasb etmez. Kânede yalnız haber mansubdur — إنّ'nin yaptığının tersi."}}]},"kinaya":{"title":{"ar":"الْكِنَايَة","en":"Allusion — saying it by its consequence","tr":"Kinâye — lâzımıyla söylemek"},"level":5,"group":"balagha","explanation":{"en":"A kinaya is لَفْظٌ مُسْتَعْمَلٌ فِي لَازِمِ مَا وُضِعَ لَهُ بِلَا قَرِينَةٍ مَانِعَة — a word used for what its literal meaning ENTAILS, with nothing blocking the literal reading. That last clause is the whole difference from majaz. In a majaz the clue forbids you the literal sense; in a kinaya the literal sense stays perfectly available and you take the entailment as well. «طَوِيلُ النِّجَادِ» means the man's sword-belt is long — it really is — and therefore that he is tall. Both readings stand. That is why kinaya carries more force than plain statement: it does not assert the claim, it hands you the evidence and lets you draw it. The wasiyya's «الْبَهَائِمُ تُنَادَى مِنْ خَلْفِهَا» never calls anyone an animal; it states a fact about animals and leaves the listener to finish the sentence about himself. That oblique form has its own name, تَعْرِيض.","tr":"Kinâye: لَفْظٌ مُسْتَعْمَلٌ فِي لَازِمِ مَا وُضِعَ لَهُ بِلَا قَرِينَةٍ مَانِعَة — hakikî mananın GEREKTİRDİĞİ şey için, hakikî manayı engelleyen bir karîne olmaksızın kullanılan lafız. Son kayıt, mecazdan bütün farkıdır. Mecazda karîne hakikî manayı yasaklar; kinâyede hakikî mana da tamamen ayakta kalır, siz ayrıca lâzımını alırsınız. «طَوِيلُ النِّجَادِ» adamın kılıç bağının uzun olduğunu söyler — gerçekten uzundur — ve dolayısıyla boyunun uzun olduğunu. İki okuyuş da geçerlidir. Kinâyenin sarih sözden daha kuvvetli olmasının sebebi budur: iddiayı öne sürmez, delili verir ve neticeyi size çıkarttırır. Vasiyetteki «الْبَهَائِمُ تُنَادَى مِنْ خَلْفِهَا» kimseye hayvan demez; hayvanlar hakkında bir şey söyler ve cümleyi muhatabın kendisi hakkında tamamlamasını bırakır. Bu dolaylı şekle ta'rîz denir."},"plain":{"en":"Saying a thing by naming what follows from it: «the ash of his cooking-pot is deep» for «he is generous».","tr":"Bir şeyi, ondan doğan neticeyi anarak söylemek: «cömerttir» yerine «tenceresinin külü çoktur»."},"sources":["تلخيص المفتاح (القزويني) — علم البيان","علاقات المجاز"],"examples":[{"ar":"وَمَنْ دَعَاكَ مِنْ خَلْفِكَ فَلَا تُجِبْهُ، فَإِنَّ الْبَهَائِمَ تُنَادَى مِنْ خَلْفِهَا.","gloss":{"en":"Do not answer one who calls you from behind — beasts are what get called from behind. Nobody is called an animal; the hearer finishes it.","tr":"Arkandan çağırana cevap verme; zira hayvanlar arkalarından çağrılır. Kimseye hayvan denmez; neticeyi muhatap çıkarır."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"طَوِيلُ النِّجَادِ.","gloss":{"en":"Long of sword-belt — and therefore tall. The literal sense is not cancelled.","tr":"Kılıç bağı uzun — dolayısıyla boylu. Hakikî mana iptal edilmez."},"src":null},{"ar":"كَثِيرُ الرَّمَادِ.","gloss":{"en":"Much ash at his hearth — that is, generous, because a generous man cooks for guests.","tr":"Külü çok — yani cömert; çünkü cömert adam misafir için ocak yakar."},"src":null}],"mistakes":[{"wrong":"الْكِنَايَةُ تُبْطِلُ الْمَعْنَى الْحَقِيقِيَّ","right":"الْكِنَايَةُ لَا تُبْطِلُهُ؛ الْمَجَازُ هُوَ الَّذِي يَمْنَعُهُ بِالْقَرِينَةِ","why":{"en":"The one test that separates them: in a kinaya the literal reading is still true. If something in the sentence forbids it, you are looking at majaz.","tr":"İkisini ayıran tek ölçü: kinâyede hakikî mana hâlâ doğrudur. Cümlede onu yasaklayan bir şey varsa karşınızdaki mecazdır."}},{"wrong":"كُلُّ تَعْرِيضٍ كِنَايَةٌ عَنْ ذَمٍّ","right":"التَّعْرِيضُ أُسْلُوبٌ، وَقَدْ يَكُونُ مَدْحًا أَوْ نُصْحًا","why":{"en":"Ta'rid is the oblique manner, not a verdict. The wasiyya uses it to counsel, not merely to rebuke.","tr":"Ta'rîz bir üsluptur, bir hüküm değil. Vasiyet onu azarlamak için değil öğüt vermek için kullanır."}}]},"la-nafiya-lil-jins":{"title":{"ar":"لَا النَّافِيَةُ لِلْجِنْس","en":"The «la» that denies the whole genus","tr":"Cinsini nefyeden لَا"},"level":4,"group":"awamil","explanation":{"en":"This «la» denies the quality of an ENTIRE class, not of one individual — «there is no X whatsoever». Birgivi lists it among the governors, working like إِنَّ: its noun takes nasb and its predicate stays in raf'. When that noun is a single indefinite word it is BUILT on fatha with no tanwin — لَا رَجُلَ فِي الدَّارِ. The most famous instance of all is the testimony itself: لَا إِلَهَ إِلَّا اللهُ, where إِلَهَ is built on fatha and the predicate (مَوْجُودٌ, «existing») is left unspoken — which is precisely why the sentence denies every god absolutely before affirming the One.","tr":"Bu «lâ», bir ferdin değil BÜTÜN CİNSİN vasfını nefyeder — «hiçbir X yoktur». Birgivî onu âmiller arasında sayar; «inne» gibi amel eder: ismini nasb, haberini ref eder. İsmi müfred ve nekre olduğunda tenvinsiz olarak FETHA ÜZERE MEBNÎ olur — لَا رَجُلَ فِي الدَّارِ. En meşhur örneği kelime-i tevhiddir: لَا إِلَهَ إِلَّا اللهُ; burada إِلَهَ fetha üzere mebnîdir ve haberi (مَوْجُودٌ «mevcut») hazfedilmiştir — cümlenin Bir'i ispat etmeden önce her ilahı mutlak olarak nefyetmesinin sebebi de budur."},"plain":{"en":"The لَا that denies a whole class at once: «there is no god at all but Allah».","tr":"Bir cinsin tamamını birden nefyeden لَا: «Allah'tan başka hiçbir ilah yoktur»."},"amil":"تَنْصِبُ الِاسْمَ وَتَرْفَعُ الْخَبَرَ — it governs like inna: nasb on its noun, raf' on its predicate","mamul":"mansub","sources":["العوامل (البيركوي)","المنصوبات","إظهار الأسرار (البيركوي)","قطر الندى (ابن هشام)"],"question":{"tr":["Nedir? (haberi)"],"en":["What is it? (its khabar)"]},"examples":[{"ar":"مَنْ قَالَ لَا إِلَهَ إِلَّا اللهُ ... دَخَلَ الْجَنَّةَ.","gloss":{"en":"Whoever says «there is no god but Allah» ... enters the Garden — إِلَهَ is built on fatha as the ism of la.","tr":"«Allah'tan başka ilah yoktur» diyen … cennete girer — إِلَهَ, lâ'nın ismi olarak fetha üzere mebnîdir."},"src":"aqaid-ahl-al-sunna"},{"ar":"لَا رَجُلَ فِي الدَّارِ.","gloss":{"en":"There is no man at all in the house — a flat denial of the whole class.","tr":"Evde hiçbir adam yoktur — bütün cinsin kesin nefyi."},"src":null},{"ar":"لَا رَجُلٌ فِي الدَّارِ بَلْ رَجُلَانِ.","gloss":{"en":"Not ONE man is in the house, but two — with tanwin the «la» merely negates a number, and no longer denies the genus.","tr":"Evde BİR adam yok, iki var — tenvinli gelince lâ yalnız sayıyı nefyeder, cinsi nefyetmez."},"src":null}],"mistakes":[{"wrong":"لَا إِلَهٌ إِلَّا اللهُ","right":"لَا إِلَهَ إِلَّا اللهُ","why":{"en":"The ism of this la is built on fatha WITHOUT tanwin. With tanwin the sentence stops denying the genus and merely denies one instance — which would break the testimony's meaning.","tr":"Bu «lâ»nın ismi tenvinsiz olarak fetha üzere mebnîdir. Tenvinli olursa cümle cinsi nefyetmeyi bırakır, sadece bir ferdi nefyeder — bu da kelime-i tevhidin mânâsını bozar."}},{"wrong":"لَا الرَّجُلَ فِي الدَّارِ","right":"لَا رَجُلَ فِي الدَّارِ","why":{"en":"The ism of la nafiya lil-jins must be indefinite; a definite noun after it is not admitted.","tr":"Cinsini nefyeden «lâ»nın ismi nekre olmalıdır; ardından marife isim gelmez."}},{"wrong":"لَا إِلَهَ إِلَّا اللهَ","right":"لَا إِلَهَ إِلَّا اللهُ","why":{"en":"After the neutralized إِلَّا the majestic name is a badal of the POSITION of la's noun, which is raf' — so it takes damma, not the fatha of the ism.","tr":"Amelden düşmüş إِلَّا'dan sonra lafza-i celâl, «lâ»nın isminin MAHALLİNDEN bedeldir; o mahal ref olduğu için damme alır, ismin fethasını değil."}}]},"la-nahiya":{"title":{"ar":"لَا النَّاهِيَة","en":"The prohibiting la","tr":"Nehiy لَا'sı"},"level":2,"group":"awamil","explanation":{"en":"لا الناهية (\"do not…\") governs the present verb in the jussive (majzum): sukun on the last radical, or dropping the ن in the five verbs. Birgivi lists it among the jazm governors with لَمْ، لَمَّا، لام الأمر. Contrast لا النافية, which merely negates and governs nothing: لَا تَتَكَلَّمْ (don't speak!) vs لَا تَتَكَلَّمُ (you are not speaking) — the haraka on the final letter is the whole difference in meaning.","tr":"Nehiy lâsı ('yapma!') muzariyi cezmeder: son harfte sükûn, ef'al-i hamsede نون düşer. Birgivî cezm edatları arasında لَمْ، لَمَّا، لام الأمر ile birlikte sayar. Nefiy lâsı ise amel etmez: لَا تَتَكَلَّمْ (konuşma!) ile لَا تَتَكَلَّمُ (konuşmuyorsun) arasındaki fark son harekededir."},"plain":{"en":"لَا telling someone not to do something — and it shortens the verb.","tr":"Bir işi yapmamayı söyleyen لَا; fiilin sonunu cezm eder."},"amil":"مِنْ جَوَازِمِ الْمُضَارِعِ — a governor that puts the present verb in jazm","mamul":"majzum","sources":["العوامل (البيركوي)","إظهار الأسرار (البيركوي)","قطر الندى (ابن هشام)"],"examples":[{"ar":"لَا تَحْتَقِرْ أَحَدًا.","gloss":{"en":"Do not belittle anyone.","tr":"Hiç kimseyi küçümseme."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"وَلَا تَتَكَلَّمْ كَثِيرًا.","gloss":{"en":"And do not talk too much.","tr":"Ve çok konuşma."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"لَا تَحْزَنْ إِنَّ اللهَ مَعَنَا.","gloss":{"en":"Do not grieve; indeed Allah is with us. (Quran 9:40)","tr":"Üzülme, muhakkak Allah bizimledir. (Tevbe 9:40)"},"src":null}],"mistakes":[{"wrong":"لا تتكلمُ كثيرًا (بمعنى النهي)","right":"لا تتكلمْ كثيرًا","why":{"en":"Keeping the damma turns the prohibition into a statement (\"you do not talk much\"). The prohibiting لا demands sukun.","tr":"Ötre kalırsa nehiy haber cümlesine dönüşür ('çok konuşmuyorsun'). Nehiy lâsı sükûn ister."}},{"wrong":"لن تحتقرْ أحدًا (بمعنى النهي)","right":"لا تحتقرْ أحدًا","why":{"en":"لن negates the future (and governs nasb: لن تحتقرَ); prohibition needs لا + jazm.","tr":"لن geleceği nefyeder ve nasbeder (لن تحتقرَ); yasaklama لا + cezim ister."}},{"wrong":"لا تذهبوننَ","right":"لا تذهبوا","why":{"en":"In the five verbs jazm is shown by dropping the ن: تذهبون → لا تذهبوا.","tr":"Ef'al-i hamsede cezm نون düşmesiyle gösterilir: تذهبون → لا تذهبوا."}}]},"lam-amr":{"title":{"ar":"لَامُ الْأَمْر","en":"The lam of command","tr":"Emir lâmı"},"level":4,"group":"awamil","explanation":{"en":"Arabic has a proper imperative only for the person you are addressing: اِفْعَلْ. To command anyone else — a third person, or yourself, or a passive — you put لِ on the present verb and it goes into jazm: لِيَذْهَبْ «let him go», لِنَذْهَبْ «let us go», لِيُعْلَمْ «let it be known». The لِ carries kasra on its own, but after وَ, فَ or ثُمَّ it is usually left vowelless: وَلْتَكُنْ, فَلْيَقُلْ. That is why the wasiyya's وَلْتَكُنْ looks unfamiliar — it is simply «let it be», with the لِ having lost its vowel to the وَ before it. Two things to keep straight. The verb is مَجْزُوم, so a hollow verb shortens (تَكُونُ → تَكُنْ) and a defective one drops its weak letter. And the لِ of command is not the لِ of purpose: the first gives jazm and means «let», the second gives nasb through an implied أَنْ and means «in order to» — لِيَذْهَبْ against لِيَذْهَبَ.","tr":"Arapçada hakiki emir sadece muhatap içindir: اِفْعَلْ. Başkasına — gâibe, kendine yahut meçhule — emretmek için muzârinin başına لِ getirilir ve fiil cezmedilir: لِيَذْهَبْ «gitsin», لِنَذْهَبْ «gidelim», لِيُعْلَمْ «bilinsin». لِ kendi başına kesreli gelir, fakat وَ، فَ yahut ثُمَّ'den sonra çoğunlukla sâkin bırakılır: وَلْتَكُنْ، فَلْيَقُلْ. Vasiyetteki وَلْتَكُنْ'un yabancı görünmesinin sebebi budur — «ol(sun)» demektir, لِ kendinden önceki وَ sebebiyle harekesini bırakmıştır. İki noktaya dikkat: fiil MECZÛMdur, dolayısıyla ecvef kısalır (تَكُونُ → تَكُنْ), nâkıs ise illetli harfini düşürür. Ve emir lâmı, ta'lîl lâmı değildir: birincisi cezmeder ve «-sin» manasındadır, ikincisi mukadder أَنْ ile nasbeder ve «için» manasındadır — لِيَذْهَبْ ile لِيَذْهَبَ."},"plain":{"en":"A لِـ that turns a present verb into a command, usually for someone not being spoken to: «let him…».","tr":"Muzâriyi emre çeviren لِـ; çoğunlukla gâib için: «…-sın»."},"mamul":"majzum","sources":["العوامل (البيركوي) — الجوازم","قطر الندى (ابن هشام)"],"examples":[{"ar":"وَلْتَكُنْ إِذَا دَخَلْتَ عَلَيْهِ تَعْرِفُ قَدْرَكَ.","gloss":{"en":"And when you enter upon him, let it be that you know your own worth — تَكُنْ is in jazm, so the و of تَكُونُ is gone.","tr":"Onun yanına girdiğinde kendi kadrini bilir ol — تَكُنْ meczûmdur, تَكُونُ'nun vâvı düşmüştür."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"لِيُنْفِقْ ذُو سَعَةٍ مِنْ سَعَتِهِ.","gloss":{"en":"Let a man of means spend out of his means (Quran 65:7) — the لِ with its own kasra, at the start of the clause.","tr":"Varlıklı olan varlığından infak etsin (Talâk 65:7) — cümle başında kendi kesresiyle لِ."},"src":null},{"ar":"لِنَذْهَبْ إِلَى الدَّرْسِ.","gloss":{"en":"Let us go to the lesson — the command turned on the speaker himself.","tr":"Derse gidelim — emrin mütekellime yöneltilmiş hâli."},"src":null}],"mistakes":[{"wrong":"لِيَذْهَبُ","right":"لِيَذْهَبْ","why":{"en":"The lam of command is a jazim. A damma on the end means it was read as something else entirely.","tr":"Emir lâmı câzimdir. Sondaki damme, kelimenin bambaşka okunduğunu gösterir."}},{"wrong":"لِيَذْهَبَ إِلَى السُّوقِ (بِمَعْنَى: لِيَذْهَبْ)","right":"لِيَذْهَبْ إِلَى السُّوقِ","why":{"en":"With fatha this is the لِ of purpose — «in order for him to go». The command needs jazm.","tr":"Fetha ile bu, ta'lîl lâmıdır: «gitmesi için». Emir için cezm gerekir."}},{"wrong":"وَلِتَكُنْ صَابِرًا — بِكَسْرِ اللَّامِ بَعْدَ الْوَاوِ","right":"وَلْتَكُنْ صَابِرًا","why":{"en":"After وَ, فَ or ثُمَّ the lam is normally left vowelless. Keeping the kasra is not wrong in principle but is not how it is read.","tr":"وَ، فَ yahut ثُمَّ'den sonra lâm sâkin bırakılır. Kesreyi korumak aslen hatalı olmasa da okunuş bu değildir."}}]},"lam-jazim":{"title":{"ar":"لَمْ الْجَازِمَة","en":"«Lam»: negation, jussive, and the flip to past","tr":"لَمْ — nefy, cezm ve zamanı çevirme"},"level":2,"group":"awamil","explanation":{"en":"«Lam» does three things at once, which is why the grammarians call it حَرْفُ نَفْيٍ وَجَزْمٍ وَقَلْبٍ: it NEGATES, it puts the following present verb in the JUSSIVE, and it FLIPS the verb's time from present to past. So لَمْ يَطْلُبْهُ means «he did not seek it» — a past meaning carried by a present-tense form. Birgivi lists it first among the fifteen jawazim, those governors that put one present verb in the jussive. In the Emsile-i Muhtelife this is the row called جَحْدُ الْمُطْلَق (cahd-i mutlak), the absolute denial of the past, and its neighbour لَمَّا is the same construction denying the past up to the present moment.","tr":"«Lem» aynı anda üç iş yapar; bu yüzden gramerciler ona «harf-i nefy, cezm ve kalb» derler: NEFYEDER, ardından gelen muzari fiili CEZMEDER ve fiilin zamanını maziye ÇEVİRİR. Böylece لَمْ يَطْلُبْهُ «onu talep etmedi» demektir — muzari kalıbıyla taşınan mazi mânâsı. Birgivî onu, bir muzari fiili cezmeden on beş cezm edatının başında sayar. Emsile-i Muhtelife'de bu sîgaya «cahd-ı mutlak» denir; komşusu لَمَّا ise aynı yapının şimdiye kadar uzanan olumsuzluğudur (cahd-ı müstağrak)."},"plain":{"en":"لَمْ negates a present-tense verb and flips its meaning into the past: «he did not…».","tr":"لَمْ muzâriyi nefyeder ve manasını mâzîye çevirir: «…-madı»."},"amil":"تَجْزِمُ الْمُضَارِعَ وَتَقْلِبُ زَمَانَهُ إِلَى الْمُضِيِّ — it puts the present verb in the jussive and turns its time into the past","mamul":"majzum","sources":["العوامل (البيركوي) — الجوازم","الأمثلة المختلفة","إظهار الأسرار (البيركوي)"],"examples":[{"ar":"أَمْكَنَهُ طَلَبُ الْعِلْمِ فِي الدُّنْيَا فَلَمْ يَطْلُبْهُ.","gloss":{"en":"Seeking knowledge was within his reach in this world, and he did not seek it — present form, past meaning, jussive ending.","tr":"Dünyada ilim talebi elinin altındaydı da o talep etmedi — muzâri şekli, mâzi manası, meczûm sonu."},"src":"min-muqaddimat-al-maqsud"},{"ar":"لَمْ يَذْهَبْ.","gloss":{"en":"He did not go — compare مَا ذَهَبَ, which negates the past verb directly.","tr":"Gitmedi — doğrudan mâziyi nefyeden مَا ذَهَبَ ile karşılaştırın."},"src":null},{"ar":"لَمَّا يَذْهَبْ.","gloss":{"en":"He has not gone yet — لَمَّا denies right up to the present and implies it may still happen.","tr":"Henüz gitmedi — لَمَّا nefyi şimdiye kadar sürdürür ve hâlâ olabileceğini ima eder."},"src":null}],"mistakes":[{"wrong":"لَمْ يَذْهَبُ","right":"لَمْ يَذْهَبْ","why":{"en":"«Lam» governs the jussive: the final damma must go. Leaving it is the single most common jussive error.","tr":"«Lem» cezmeder: sondaki damme düşmelidir. Onu bırakmak en sık yapılan cezm hatasıdır."}},{"wrong":"لَمْ ذَهَبَ","right":"لَمْ يَذْهَبْ","why":{"en":"«Lam» enters only on a PRESENT verb, never a past one — it supplies the past meaning itself. To negate a past verb directly, use مَا.","tr":"«Lem» yalnız MUZARİ fiilin başına gelir, maziye gelmez — mazi mânâsını kendisi verir. Maziyi doğrudan olumsuzlamak için مَا kullanılır."}},{"wrong":"لَمْ يَذْهَبْ أَمْسِ وَسَيَذْهَبُ (بمعنى: لم يذهب بعدُ)","right":"لَمَّا يَذْهَبْ","why":{"en":"For «has not yet» — a denial reaching the present with the act still expected — the word is لَمَّا, not لَمْ.","tr":"«Henüz gitmedi» — şimdiye kadar süren ve devamı beklenen olumsuzluk — için لَمَّا kullanılır, لَمْ değil."}}]},"lam-taleel":{"title":{"ar":"لَام التَّعْلِيل","en":"The lam of purpose","tr":"Lâm-ı ta'lîl"},"level":2,"group":"awamil","explanation":{"en":"Prefixed لِ before a present verb means \"in order to\". Grammatically the verb is mansub by a hidden أَنْ after the lam — so it behaves exactly like the أَنْ clause: final fatha, نون dropped in the five verbs. In this story: لِيُوَدِّعَهُ = لِأَنْ يُوَدِّعَهُ (\"in order to bid him farewell\").","tr":"Muzariden önce gelen لِ '-mek için' demektir. Fiil, lâm'dan sonra gizli bir أَنْ ile mansubdur: son harf fetha, ef'al-i hamsede نون düşer. Hikâyede: لِيُوَدِّعَهُ = لِأَنْ يُوَدِّعَهُ ('onu uğurlamak için')."},"plain":{"en":"A لِـ meaning «in order to».","tr":"«…-mek için» manasındaki لِـ."},"amil":"تَنْصِبُ الْمُضَارِعَ بِأَنْ مُضْمَرَةً — governs nasb through an implied أَنْ","sources":["عوامل البركوي — اللام مِنْ حروف الجر العشرين","قطر الندى (ابن هشام) — لام كي"],"examples":[{"ar":"ذَهَبَ إِلَيْهِ لِيُوَدِّعَهُ.","gloss":{"en":"He went to him to bid him farewell.","tr":"Ona veda etmek için gitti."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"أَدْرُسُ لِأَنْجَحَ.","gloss":{"en":"I study in order to succeed.","tr":"Başarmak için çalışıyorum."},"src":null}],"mistakes":[{"wrong":"ذهب لِيُوَدِّعُهُ","right":"ذهب لِيُوَدِّعَهُ","why":{"en":"The verb after lam at-ta'lil is mansub — fatha on the last radical, not damma.","tr":"Lâmu't-ta'lîlden sonra fiil mansubdur — son harfte fetha, ötre değil."}},{"wrong":"أدرس لِأَنَّ أنجحَ","right":"أدرس لِأَنْجَحَ / لِكَيْ أَنْجَحَ","why":{"en":"Mixing لأنّ (\"because\", followed by a noun) with the purpose lam (followed by a mansub verb).","tr":"لأنّ ('çünkü', isimden önce) ile amaç lâmı (mansub fiilden önce) karıştırılıyor."}}]},"ma-la-mushabbaha":{"title":{"ar":"مَا وَلَا الْمُشَبَّهَتَانِ بِلَيْسَ","en":"«Ma» and «la» resembling «laysa»","tr":"لَيْسَ'ye benzeyen مَا ve لَا"},"level":5,"group":"awamil","explanation":{"en":"Birgivi counts exactly two governors in this class: the «ma» and the «la» that work like لَيْسَ. They enter a nominal sentence and do what laysa does — the subject stays in RAF' as their ism, and the predicate goes into NASB as their khabar. The Awamil explains the resemblance in two points: both enter upon a mubtada and khabar, and both carry the meaning of negation. The book's own example is مَا اللَّهُ تَعَالَى مُتَمَكِّنًا بِمَكَانٍ — «Allah is not confined to any place», where مُتَمَكِّنًا is in nasb. The Hijazi dialect is the one that governs this way; in the Tamimi dialect these particles govern nothing and the predicate simply stays in raf'.","tr":"Birgivî bu sınıfta tam olarak iki âmil sayar: لَيْسَ gibi amel eden «mâ» ve «lâ». İsim cümlesine girip leysenin yaptığını yaparlar — mübteda onların ismi olarak REF hâlinde kalır, haber ise onların haberi olarak NASB alır. Avâmil benzerliği iki noktada açıklar: ikisi de mübteda ve haberin başına girer, ikisi de nefy mânâsı taşır. Kitabın kendi örneği: مَا اللَّهُ تَعَالَى مُتَمَكِّنًا بِمَكَانٍ — «Allah bir mekânda yer tutmuş değildir»; burada مُتَمَكِّنًا mansubdur. Bu şekilde amel eden Hicaz lehçesidir; Temîm lehçesinde bu edatlar amel etmez ve haber merfû kalır."},"plain":{"en":"مَا and لَا used the way لَيْسَ is used — «is not».","tr":"لَيْسَ gibi kullanılan مَا ve لَا — «değildir»."},"amil":"تَرْفَعُ الِاسْمَ وَتَنْصِبُ الْخَبَرَ — it keeps the subject in raf' and puts the predicate in nasb","mamul":"marfu","sources":["العوامل (البيركوي)","إظهار الأسرار (البيركوي)","الكافية (ابن الحاجب)"],"examples":[{"ar":"وَمَا مُحَمَّدٌ إِلَّا رَسُولٌ.","gloss":{"en":"Muhammad is but a messenger — مَا would have put رَسُول in nasb, but إِلَّا cancels its effect and raf' returns.","tr":"Muhammed ancak bir resuldür — مَا, رَسُول'ü nasb edecekti, fakat إِلَّا amelini iptal eder ve ref döner."},"src":"aqaid-ahl-al-sunna"},{"ar":"مَا اللَّهُ تَعَالَى مُتَمَكِّنًا بِمَكَانٍ.","gloss":{"en":"Allah — exalted is He — is not confined to any place. The Awamil's own example: the predicate is in nasb.","tr":"Allah Teâlâ hiçbir mekâna hulûl etmiş değildir. Avâmil'in kendi örneği: haber mansubdur."},"src":null},{"ar":"مَا هَذَا بَشَرًا.","gloss":{"en":"This is no human being — the Qur'anic instance of the Hijazi «ma».","tr":"Bu bir beşer değildir — Hicaz مَا'sının Kur'ânî örneği."},"src":null},{"ar":"لَا رَجُلٌ أَفْضَلَ مِنْكَ.","gloss":{"en":"No man is better than you — the «la» that resembles laysa.","tr":"Hiçbir adam senden hayırlı değildir — لَيْسَ'ye benzeyen لَا."},"src":null}],"mistakes":[{"wrong":"ما هذا بشرٌ (على لغة الحجاز)","right":"مَا هَذَا بَشَرًا","why":{"en":"In the Hijazi usage these particles govern like laysa, so the predicate takes nasb. Leaving it in raf' is the Tamimi reading, where they govern nothing — correct in itself, but not what the Awamil is teaching here.","tr":"Hicaz kullanımında bu edatlar leyse gibi amel eder, haber nasb alır. Merfû bırakmak Temîm okuyuşudur; kendi başına doğrudur ama Avâmil'in burada öğrettiği bu değildir."}},{"wrong":"ما مُتَمَكِّنًا اللهُ","right":"مَا اللَّهُ مُتَمَكِّنًا","why":{"en":"These particles only govern while the order is kept: ism first, khabar after. Fronting the khabar cancels the resemblance to laysa and the government falls away.","tr":"Bu edatlar ancak sıra korunduğunda amel eder: önce isim, sonra haber. Haber öne alınırsa leyseye benzerlik bozulur ve amel düşer."}},{"wrong":"ما زيدٌ إلا قائمًا","right":"مَا زَيْدٌ إِلَّا قَائِمٌ","why":{"en":"If إِلَّا comes between, the negation is broken and the government lapses: the predicate returns to raf'.","tr":"Araya إِلَّا girerse nefy bozulur ve amel düşer: haber ref'e döner."}}]},"maful-bihi":{"title":{"ar":"الْمَفْعُولُ بِه","en":"The direct object (maf'ul bihi)","tr":"Mef'ûlün bih (nesne)"},"level":2,"group":"nahw","explanation":{"en":"The maf'ul bihi is the direct object — the noun in nasb upon which the verb's action falls. Its governor is the transitive verb (الفعل المتعدّي), and it is always mansub. In «أَكْرِمِ الْعُلَمَاءَ» (honor the scholars) the honoring lands on الْعُلَمَاءَ, so it is mansub. The object can be a visible noun — الْبَصْرَةَ، أَحَدًا، الْكِبَارَ — or an attached pronoun in the position of nasb, like the ـه of «يُوَدِّعَهُ» (to bid *him* farewell) and the ـك of «يَأْتِيكَ» (comes to *you*). Default order is verb–fa'il–maf'ul, but Arabic allows the object to move for emphasis while the nasb stays as its fixed sign. Ibn Ajurrum defines it as \"the mansub noun upon which the action occurs\"; it heads the منصوبات in the Ajurrumiyya and is detailed in Qatr al-Nada.","tr":"Mef'ûlün bih, düz nesnedir — fiilin işinin üzerine düştüğü mansub isimdir. Âmili müteaddî (geçişli) fiildir ve daima mansubdur. «أَكْرِمِ الْعُلَمَاءَ» (âlimlere ikram et) cümlesinde ikram الْعُلَمَاءَ üzerine düşer, bu yüzden mansubdur. Nesne açık bir isim olabilir — الْبَصْرَةَ، أَحَدًا، الْكِبَارَ — ya da nasb mahallinde bitişik bir zamir, mesela «يُوَدِّعَهُ»deki ـه (onu uğurlamak) ve «يَأْتِيكَ»deki ـك (sana gelir). Temel dizim fiil–fâil–mef'ûldür, ama Arapça vurgu için nesnenin öne geçmesine izin verir; sabit alâmeti olan nasb yine kalır. İbn Âcurrûm onu \"fiilin üzerine vuku bulduğu mansub isim\" diye tanımlar; Âcurrûmiyye'de mansûbâtın başında gelir."},"plain":{"en":"What the action was done to.","tr":"İşin kendisine yapıldığı şey."},"mamul":"mansub","sources":["الآجُرُّومِيَّة (ابن آجُرُّوم)","الكافية (ابن الحاجب)","قطر الندى (ابن هشام)"],"question":{"tr":["Neyi?","Neye?","Kimi?","Kime?"],"en":["What? (direct)","To what?","Whom?","To whom?"]},"examples":[{"ar":"أَكْرِمِ الْعُلَمَاءَ.","gloss":{"en":"Honor the scholars — الْعُلَمَاءَ is the direct object of أَكْرِم, mansub by fatha.","tr":"Âlimlere ikram et — الْعُلَمَاءَ, أَكْرِم fiilinin mef'ûlüdür, fetha ile mansubdur."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"لَا تَحْتَقِرْ أَحَدًا.","gloss":{"en":"Do not belittle anyone — أَحَدًا is the direct object, mansub with tanwin fatha.","tr":"Hiç kimseyi küçümseme — أَحَدًا mef'ûldür, tenvinli fetha ile mansubdur."},"src":"wasiyyat-abi-hanifa-L2"},{"ar":"إِذَا دَخَلْتَ الْبَصْرَةَ.","gloss":{"en":"When you enter Basra — الْبَصْرَةَ is the direct object of دَخَلْتَ, mansub by fatha.","tr":"Basra'ya girdiğinde — الْبَصْرَةَ, دَخَلْتَ fiilinin fetha ile mansub mef'ûlüdür."},"src":"wasiyyat-abi-hanifa-L2"}],"mistakes":[{"wrong":"أَكْرِمِ الْعُلَمَاءُ","right":"أَكْرِمِ الْعُلَمَاءَ","why":{"en":"The object is mansub, not marfu'. Giving الْعُلَمَاء a damma treats it as the fa'il (the doer) — but here it is who is honored, so it must be mansub (fatha).","tr":"Nesne mansubdur, merfu değil. الْعُلَمَاء'a ötre vermek onu fâil (yapan) saymaktır — oysa burada ikram edilen odur, bu yüzden mansub olmalı (fetha)."}},{"wrong":"أَكْرِمْ لِلْعُلَمَاءِ","right":"أَكْرِمِ الْعُلَمَاءَ","why":{"en":"أَكْرَمَ is transitive and takes a direct object with no preposition. Inserting لـ (from English 'be kind TO') puts the noun in jarr and loses the maf'ul bihi.","tr":"أَكْرَمَ geçişlidir ve nesnesini harf-i cersiz doğrudan alır. İngilizce 'to' etkisiyle لـ eklemek ismi mecrur yapar ve mef'ûlün bihi kaybeder."}}]},"maful-fih":{"title":{"ar":"الْمَفْعُولُ فِيهِ (الظَّرْف)","en":"The maf'ul fih (adverb of time or place)","tr":"Mef'ûl fîh (zarf)"},"level":3,"group":"nahw","explanation":{"en":"Defined in the Mansubat as «هُوَ مَا فُعِلَ فِيهِ فِعْلٌ مَذْكُورٌ مِنْ زَمَانٍ أَوْ مَكَانٍ» — the noun of the time or place IN WHICH the stated action happened. It answers «when?» or «where?» and takes nasb. The condition for nasb is that the sense «فِي» be intended without the preposition being written: صُمْتُ يَوْمَ الِاثْنَيْنِ = «I fasted ON Monday». Most zarfs are mudaf, and the following noun is in jarr: أَمَامَ مَكَّةَ, بَيْنَ يَدَيْهِ, عِنْدَهُ. Some are indeclinable (مَبْنِيّ) — حَيْثُ, and قَبْلُ / بَعْدُ when cut off from what they govern.","tr":"Mensûbât'ta şöyle tanımlanır: «هُوَ مَا فُعِلَ فِيهِ فِعْلٌ مَذْكُورٌ مِنْ زَمَانٍ أَوْ مَكَانٍ» — zikredilen işin İÇİNDE yapıldığı zaman veya mekânın ismidir. «Ne zaman?» «Nerede?» sorularına cevap verir ve nasb alır. Nasb olmasının şartı, «فِي» mânâsının kastedilip harfin yazılmamasıdır: صُمْتُ يَوْمَ الِاثْنَيْنِ = «Pazartesi GÜNÜ oruç tuttum». Zarfların çoğu muzâftır, sonrası mecrûr olur: أَمَامَ مَكَّةَ, بَيْنَ يَدَيْهِ, عِنْدَهُ. Bazıları mebnîdir — حَيْثُ ile, izafetten kesildiğinde قَبْلُ / بَعْدُ gibi."},"plain":{"en":"Where, or when.","tr":"Nerede yahut ne zaman."},"mamul":"mansub","sources":["المنصوبات","العوامل (البيركوي)","إظهار الأسرار (البيركوي)","قطر الندى (ابن هشام)"],"question":{"tr":["Nerede?","Ne zaman?","Hangi mekânda?","Kim indinde?","Nereye?","Ne zamana kadar?"],"en":["Where?","When?","In which place?","In whose presence?","To where?","Until when?"]},"examples":[{"ar":"وَقَفَ الْفِيلُ أَمَامَ مَكَّةَ.","gloss":{"en":"The elephant stopped before Mecca — zarf of place, in nasb, and mudaf.","tr":"Fil Mekke'nin önünde durdu — mekân zarfı, mansub ve muzâf."},"src":"ashab-al-fil"},{"ar":"وَإِيَّاكَ وَالْكَذِبَ بَيْنَ يَدَيْهِ.","gloss":{"en":"Beware of lying in his presence — بَيْنَ is a zarf of place in nasb.","tr":"Onun huzurunda yalandan sakın — بَيْنَ mansub mekân zarfıdır."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"وَصَغُرَتْ مَنْزِلَتُكَ عِنْدَهُ.","gloss":{"en":"And your standing with him shrank — عِنْدَ is a zarf, mudaf to the pronoun.","tr":"Ve onun yanında mevkiin küçüldü — عِنْدَ zarftır, zamire muzâftır."},"src":"wasiyyat-abi-yusuf-L5"},{"ar":"صُمْتُ يَوْمَ الِاثْنَيْنِ.","gloss":{"en":"I fasted on Monday — zarf of time; the sense of «on» is carried without فِي.","tr":"Pazartesi günü oruç tuttum — zaman zarfı; «-de» manası فِي olmadan taşınır."},"src":null}],"mistakes":[{"wrong":"وقف الفيلُ أمامُ مكةَ","right":"وقف الفيلُ أمامَ مكةَ","why":{"en":"The zarf is mansub. Learners give it a damma because it is not the object of the verb in the ordinary sense — but maf'ul fih is one of the thirteen mansubat.","tr":"Zarf mansubdur. Öğrenciler onu alışılmış mânâda mef'ûl saymadıkları için ötre v
